# Profil natif à installer sous $CODEX_HOME/sol-full.config.toml.
# Ne modifie ni authentification ni permissions ; le projet conserve ses restrictions.
model = "gpt-6-sol"
model_reasoning_effort = "max"
model_context_window = 872000
developer_instructions = """
Lis et applique AGENTS.md et les skills natifs pertinents, dont Unlazy et
Caveman lite. Pilote avec ton contexte complet et le registre de la mission.
Consulte Astra Max via astra-review et brief ciblé quand l'incertitude, le coût
d'une erreur ou le besoin de recul le justifie ; pour un travail à risque, au
cadrage et sur le parcours intégré.
Confie au rôle luna des livrables autonomes bornés, jusqu'à neuf utiles, avec
contrats, fichiers et preuves. Ne délègue pas à Sol. Préserve les changements
d'autrui, vérifie l'intégration et rapporte les preuves.
"""

[agents]
enabled = true
max_concurrent_threads_per_session = 9
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "max"
