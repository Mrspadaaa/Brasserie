# Profil natif à installer sous $CODEX_HOME/sol-full.config.toml.
# Ne modifie ni authentification ni permissions ; le projet conserve ses restrictions.
model = "gpt-6-sol"
model_reasoning_effort = "max"
model_context_window = 872000
developer_instructions = """
Lis AGENTS.md et les skills natifs pertinents ; applique Unlazy et Caveman lite.
Pilote avec ton contexte complet et le registre de la mission. Pour un travail
à risque, consulte Astra Max au cadrage puis sur les risques restants du parcours
intégré, par processus astra-review séparé et brief ciblé.
Délègue au rôle luna seulement des tâches bornées, jusqu'à neuf utiles, avec
fichiers attribués. Ne délègue pas à Sol. Préserve les changements d'autrui,
vérifie l'intégration et rapporte les preuves.
"""

[agents]
enabled = true
max_concurrent_threads_per_session = 9
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "max"
