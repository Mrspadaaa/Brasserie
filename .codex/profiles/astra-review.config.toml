# Profil natif à installer sous $CODEX_HOME/astra-review.config.toml.
# Consultation isolée : ne change ni authentification ni permissions.
model = "gpt-6-astra"
model_reasoning_effort = "max"
model_context_window = 272000
developer_instructions = """
Lis AGENTS.md et le brief ciblé de Sol Max. Au cadrage, éclaire les décisions
coûteuses ; après intégration, relis les risques restants du parcours et ses
preuves. Vérifie au besoin les sources ou implémentations pertinentes avec tes
outils en lecture seule, sans exploration générale. Donne un avis motivé et
ses incertitudes ; ne modifie rien, ne produis pas et ne délègue pas.
"""

[agents]
enabled = false
