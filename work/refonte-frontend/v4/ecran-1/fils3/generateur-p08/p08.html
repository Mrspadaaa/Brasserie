<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Houblons, le relevé</title>
<style>
  :root { --encre: #111; --gris: #555; --gris2: #6e6e6e; --trait: #d4d4d4; --fond: #f5f5f5; --fond2: #ebebeb; --bande: #e2e2e2; --acc: #c2410c; --t1: 12px; --t2: 14px; --t3: 18px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; color: var(--encre); }
  body { font: 400 var(--t2)/1.25 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; min-height: 24px; min-width: 24px; text-align: left; }
  :focus-visible { outline: 2px solid var(--encre); outline-offset: 2px; }
  .ecran { width: 100%; max-width: 390px; margin: 0 auto; padding: 8px 16px 10px; display: flex; flex-direction: column; gap: 6px; overflow-x: hidden; }
  .petit { font-size: var(--t1); }
  .gris { color: var(--gris2); }

  /* ---------- Étape (modèle Malts) ---------- */
  .barre { display: flex; align-items: center; gap: 8px; height: 32px; }
  .retour { width: 28px; height: 28px; position: relative; flex: none; }
  .retour::before { content: ''; position: absolute; left: 10px; top: 9px; width: 9px; height: 9px; border-left: 2px solid var(--encre); border-bottom: 2px solid var(--encre); transform: rotate(45deg); }
  .titre { font-size: var(--t3); font-weight: 650; }
  .style { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 10px; border: 1px solid var(--trait); border-radius: 14px; }
  .badge { font-size: var(--t1); padding: 2px 7px; border-radius: 10px; background: var(--fond2); color: var(--gris); }
  .resume { border-radius: 18px !important; display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 2px 12px; min-height: 48px; padding: 6px 14px 4px; border: 1px solid var(--trait); border-radius: 22px; }
  .resume > div { display: flex; align-items: baseline; gap: 4px; }
  .resume b { font-size: var(--t3); font-weight: 650; font-variant-numeric: tabular-nums; }
  .resume .ibu { display: grid; grid-template-columns: auto auto 1fr; align-items: center; gap: 5px; }
  .cle { font-size: var(--t1); color: var(--gris2); }
  .delta { font-size: var(--t1); font-weight: 650; }
  /* Jauge IBU empilée : un segment par ajout, bande du style en dessous (p10). */
  .pile { grid-column: 1 / -1; position: relative; height: 12px; margin: 2px 0 4px; border-radius: 3px; background: #f0f0f0; }
  .pile .bd { position: absolute; top: -3px; bottom: -3px; border-left: 1.5px solid var(--encre); border-right: 1.5px solid var(--encre); background: rgba(0,0,0,.05); }
  .pile .sg { position: absolute; top: 2px; bottom: 2px; background: #3d3d3d; border-right: 1.5px solid #fff; }
  .pile .sg.n1 { background: #777; } .pile .sg.n2 { background: #a3a3a3; } .pile .sg.n3 { background: #c4c4c4; }
  .note-ibu { grid-column: 1 / -1; font-size: var(--t1); color: var(--acc); font-weight: 600; }

  /* Frise : le temps de la recette, de l'ébullition à la fermentation (greffe p10). */
  .frise { position: relative; display: flex; flex-direction: column; gap: 5px; }
  .frise .axe { position: absolute; left: 47px; top: 14px; bottom: 14px; width: 2px; background: #cfcfcf; }
  .noeud { position: relative; display: grid; grid-template-columns: 56px 1fr; gap: 2px; align-items: start; }
  .rl { display: flex; align-items: center; justify-content: flex-end; gap: 4px; height: 36px; position: relative; z-index: 1; }
  .rl .pt { width: 12px; height: 12px; margin-right: 1px; border-radius: 6px; background: #fff; border: 2px solid var(--encre); flex: none; }
  .noeud.vide .rl .pt { border-style: dashed; border-color: var(--gris2); }
  .noeud.ferm .rl .pt { background: var(--encre); }
  .rl .quand { font-size: var(--t1); font-weight: 650; white-space: nowrap; min-height: 28px; padding: 0 2px; display: inline-flex; align-items: center; gap: 1px; }
  .rl .quand.tourne::after { content: '⟳'; font-weight: 400; color: var(--gris2); font-size: var(--t1); }
  .noeud > .champ { margin-top: 3px; }
  .carte { background: var(--fond); border-radius: 12px; padding: 5px 8px 6px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .r1, .r2 { display: flex; align-items: center; gap: 6px; min-height: 30px; }
  .r1 .nom { font-weight: 650; white-space: nowrap; }
  .puce { display: inline-flex; align-items: center; gap: 3px; height: 28px; padding: 0 8px; border: 1px solid var(--trait); border-radius: 14px; background: #fff; white-space: nowrap; font-size: var(--t1); }
  .puce.tourne::after { content: '⟳'; color: var(--gris2); }
  .sepq::before { content: ' · '; }
  .aere .r1, .aere .r2 { min-height: 36px; }
  .aere .carte { padding: 7px 8px 8px; }
  .cite { font-size: var(--t1); padding: 1px 7px; border-radius: 9px; border: 1px solid var(--acc); color: var(--acc); font-weight: 600; white-space: nowrap; }
  .ibu-l { white-space: nowrap; } .ibu-l b { font-weight: 650; }
  .taux { font-size: var(--t1); color: var(--gris2); white-space: nowrap; }
  .st { font-size: var(--t1); white-space: nowrap; color: var(--gris2); }
  .st.s-stock { display: none; }
  .exc { font-size: var(--t1); color: var(--gris2); white-space: nowrap; font-weight: 400; }
  .exc::before { content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 3px; border: 1px solid var(--gris2); margin-right: 4px; vertical-align: 1px; }
  .vide-t { font-size: var(--t1); color: var(--gris); }
  .dose-c { font-size: var(--t1); color: var(--gris2); white-space: nowrap; }
  .pas { display: inline-flex; align-items: center; gap: 2px; margin-left: auto; }
  .moins, .plus { width: 28px; height: 28px; border-radius: 14px; border: 1px solid var(--trait); background: #fff; position: relative; flex: none; }
  .moins::before, .plus::before, .plus::after { content: ''; position: absolute; left: 8px; top: 12.5px; width: 10px; height: 1.6px; background: var(--encre); }
  .plus::after { transform: rotate(90deg); }
  .dose { min-width: 40px; text-align: center; font-weight: 650; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .x { width: 24px; height: 24px; position: relative; flex: none; }
  .x::before, .x::after { content: ''; position: absolute; left: 6px; top: 11px; width: 12px; height: 1.6px; background: var(--gris2); transform: rotate(45deg); }
  .x::after { transform: rotate(-45deg); }
  .bio { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: var(--t1); padding-top: 2px; border-top: 1px dashed var(--trait); }
  .bio b { font-weight: 650; }
  .sig { padding: 1px 6px; border-radius: 9px; border: 1px solid var(--gris2); color: var(--gris); }
  .sig.ne { border-style: dashed; }
  .ajout-rap { display: flex; flex-direction: column; gap: 3px; }
  .g-tete { display: flex; align-items: center; gap: 6px; }
  .g-tete .quand-g { font-weight: 650; white-space: nowrap; }
  .dose-c { font-weight: 400; }
  
  .champ { flex: 1; min-width: 0; height: 30px; padding: 0 10px; border: 1px solid var(--trait); border-radius: 10px; background: #fff; }
  .champ::placeholder { color: var(--gris2); }
  .bascule { display: inline-flex; padding: 2px; border-radius: 14px; background: var(--fond2); }
  .bascule span { height: 24px; padding: 0 9px; display: inline-flex; align-items: center; border-radius: 12px; font-size: var(--t1); color: var(--gris); }
  .bascule span.on { background: #fff; color: var(--encre); font-weight: 650; box-shadow: 0 1px 2px rgba(0,0,0,.18); }
  .rap { display: grid; grid-template-columns: 1fr auto; gap: 4px; align-items: center; }
  .ajout { height: 44px; display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 0 8px 0 5px; border-radius: 10px; background: var(--fond); }
  .ajout .nb { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .ajout .nb2 { display: flex; align-items: center; gap: 6px; min-height: 12px; }
  .sgn { display: inline-flex; gap: 1px; } .sgn i { width: 7px; height: 7px; border-radius: 1px; background: #e2e2e2; } .sgn i.c1 { background: #a8a8a8; } .sgn i.c2 { background: #3d3d3d; } .sgn i.sep { margin-left: 3px; } .sgn i.acc.c1, .sgn i.acc.c2 { background: var(--acc); }
  .ajout b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ajout .ib { font-weight: 650; white-space: nowrap; }
  .ajout .ib .n::before { content: '+'; }
  .ajout .ib .dz { font-weight: 400; color: var(--gris); font-size: var(--t1); }
  .ajout .ib { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
  .ajout:has(.dz):has(.exc) { height: 50px; }
  .ajout .ib .dz::after { content: ' →'; }
  .plus-i { width: 22px; height: 22px; border-radius: 11px; background: var(--encre); position: relative; }
  .plus-i::before, .plus-i::after { content: ''; position: absolute; left: 6px; top: 10.2px; width: 10px; height: 1.6px; background: #fff; }
  .plus-i::after { transform: rotate(90deg); }
  .conf { font-size: var(--t1); color: var(--acc); }
  .gout { display: inline-flex; gap: 2px; }
  .gout button { width: 26px; height: 26px; border-radius: 13px; border: 1px solid var(--trait); background: #fff; position: relative; }
  .g-ex::before { content: ''; position: absolute; left: 6px; top: 6px; width: 10px; height: 10px; border-radius: 6px; border: 1.6px solid var(--gris2); }
  .g-ex::after { content: ''; position: absolute; left: 6px; top: 11.5px; width: 13px; height: 1.6px; background: var(--gris2); transform: rotate(-45deg); }
  .g-aime::before { content: '♡'; position: absolute; inset: 0; display: grid; place-items: center; color: var(--gris2); font-size: var(--t2); line-height: 1; }
  .g-aime[aria-pressed="true"] { background: var(--encre); border-color: var(--encre); }
  .g-aime[aria-pressed="true"]::before { content: '♥'; color: #fff; }
  .g-ex[aria-pressed="true"] { background: var(--encre); border-color: var(--encre); }
  .g-ex[aria-pressed="true"]::before { border-color: #fff; } .g-ex[aria-pressed="true"]::after { background: #fff; }
  .aime-t { font-size: var(--t1); color: var(--gris); }
  .exclus { display: flex; flex-wrap: wrap; gap: 4px; }
  .ex-chip { font-size: var(--t1); height: 24px; padding: 0 8px; border-radius: 12px; border: 1px dashed var(--gris2); color: var(--gris); text-decoration: line-through; }
  .levure { display: flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--trait); }
  .levure b { font-weight: 650; }
  .fente { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 10px; border: 1px dashed var(--trait); color: var(--gris2); font-size: var(--t1); }
  .achats { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; min-height: 34px; padding: 4px 10px; border-radius: 10px; border: 1px solid var(--trait); width: 100%; }
  .achats b { font-weight: 650; }
  .achats .chev::after, .lecture .chev::after { content: '›'; color: var(--gris2); font-size: var(--t3); }
  .achats ul { grid-column: 1 / -1; list-style: none; display: flex; flex-direction: column; gap: 2px; font-size: var(--t1); }
  .lecture { width: 100%; display: flex; flex-direction: column; gap: 4px; padding: 6px 10px 8px; border-radius: 14px; background: var(--fond); }
  .l-tete { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .l-tete b { font-weight: 650; }
  .trop { color: var(--acc); font-weight: 650; }
  .trop::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 4px; background: var(--acc); vertical-align: 1px; }
  .cpt { color: var(--gris); }
  .l-tete { position: relative; padding-right: 18px; align-items: baseline; }
  .l-tete .l-cpt { margin: 0; }
  .l-cpt { display: flex; gap: 10px; font-size: var(--t1); color: var(--gris); margin-top: -2px; }
  .l-cpt span + span::before { content: '·'; margin-right: 10px; }
  .l-tete .chev { position: absolute; right: 0; top: -2px; }
  .effet { font-size: var(--t1); color: var(--encre); font-weight: 600; }
  .mini { display: block; }
  .l-tab { display: flex; flex-direction: column; }
  .l-r { display: grid; grid-template-columns: 1fr 196px 22px; align-items: center; height: 20px; }
  .l-r.sep { margin-top: 4px; }
  .l-r .att { font-weight: 650; } .l-r .acc { color: var(--acc); }
  .l-r i { justify-self: center; width: 8px; height: 8px; border-radius: 4px; background: #a3a3a3; }
  .l-r i.e-ns { background: none; border: 1.5px dashed #7a7a7a; width: 10px; height: 10px; }
  .l-r i.e-trop { background: var(--acc); width: 10px; height: 10px; }
  .l-rangs { display: grid; grid-template-columns: 1fr; row-gap: 2px; }
  .l-rang { display: grid; grid-template-columns: 1fr 150px; align-items: center; height: 28px; }
  .l-rang .att { font-weight: 650; } .l-rang .acc { color: var(--acc); font-weight: 650; }
  .l-autres { display: flex; gap: 6px; justify-content: flex-end; align-items: center; height: 18px; }
  .l-autres i { width: 10px; height: 10px; border-radius: 5px; background: #a3a3a3; }
  .l-autres i.ns { background: none; border: 1.5px dashed #7a7a7a; }

  /* ---------- Panneau d'analyse : trois parties ---------- */
  .p-tete { display: flex; align-items: center; gap: 6px; height: 36px; }
  .onglets { display: flex; padding: 2px; border-radius: 16px; background: var(--fond2); }
  .onglets button { height: 30px; padding: 0 10px; border-radius: 14px; color: var(--gris); white-space: nowrap; }
  .onglets button[aria-selected="true"] { background: #fff; color: var(--encre); font-weight: 650; box-shadow: 0 1px 2px rgba(0,0,0,.18); }
  .lentille { margin-left: auto; display: inline-flex; padding: 2px; border-radius: 16px; background: var(--fond2); }
  .lentille i { width: 30px; height: 30px; border-radius: 14px; display: grid; place-items: center; }
  .lentille i.on { background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.18); }
  .lentille svg { display: block; }
  .outils { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 30px; }
  .src { display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 9px; border-radius: 14px; border: 1px solid var(--trait); font-size: var(--t1); }
  .src[aria-pressed="true"] { border-color: var(--encre); background: var(--encre); color: #fff; }
  .src i { width: 10px; height: 10px; border-radius: 5px; border: 2px solid currentColor; }
  .src i.plein { background: currentColor; }
  .src i.ns { border-style: dashed; }
  /* Tableau des familles (âme de p3) */
  .tab { display: flex; flex-direction: column; }
  .t-tete { display: grid; grid-template-columns: 84px 184px 1fr; height: 18px; align-items: end; font-size: var(--t1); color: var(--gris2); white-space: nowrap; }
  .t-tete span:nth-child(2) { text-align: center; }
  .ctx { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; min-height: 34px; padding: 3px 8px; border-radius: 10px; background: var(--fond); font-size: var(--t1); }
  .ctx b { font-size: var(--t2); font-weight: 650; margin-right: 4px; }
  .ctx span { padding: 2px 8px; border-radius: 10px; background: #fff; border: 1px solid var(--trait); }
  .rang { display: grid; grid-template-columns: 84px 1fr 44px; align-items: center; height: 46px; border-bottom: 1px solid #efefef; }
  .rang.att .fn { font-weight: 650; }
  .rang.sep { margin-top: 6px; }
  .rang.terne { opacity: .25; }
  .fn { text-align: left; height: 46px; display: flex; align-items: center; gap: 4px; }
  .fn.acc { color: var(--acc); }
  .piste { position: relative; height: 46px; touch-action: none; }
  .piste svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .etat { display: grid; place-items: center; }
  .etat .p-trop { font-size: var(--t1); color: #fff; background: var(--acc); padding: 2px 7px; border-radius: 10px; font-weight: 650; }
  .etat .p-ok { width: 8px; height: 8px; border-radius: 4px; background: #a3a3a3; }
  .etat .p-ns { width: 12px; height: 12px; border-radius: 6px; border: 1.5px dashed #7a7a7a; }
  .detail { font-size: var(--t1); color: var(--gris); padding: 2px 0 6px 84px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--trait); background: #fff; font-weight: 600; white-space: nowrap; }
  .chip.plus-d::before { content: '+ '; } .chip.moins-d::before { content: '− '; } .chip.autre::before { content: '+ …'; color: var(--gris2); }
  .chip[aria-pressed="true"] { background: var(--encre); border-color: var(--encre); color: #fff; }
  .hors { font-size: var(--t1); color: var(--acc); font-weight: 650; }

  /* Relevé en colonnes (suggestions et comparer) : une colonne par objet, comme des analyses successives */
  .rep { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .rep button { min-height: 50px; padding: 4px 10px; border-radius: 12px; background: var(--fond); display: flex; flex-direction: column; justify-content: center; gap: 1px; }
  .rep button b { font-weight: 650; }
  .rep button span { font-size: var(--t1); color: var(--gris); }
  .rep button[aria-pressed="true"] { background: var(--encre); color: #fff; }
  .rep button[aria-pressed="true"] span { color: #ddd; }
  .mat { display: grid; grid-template-columns: 64px 54px repeat(3, minmax(0, 1fr)); column-gap: 3px; }
  .mat.c4 { grid-template-columns: 66px repeat(4, minmax(0, 1fr)); }
  .mat > div { min-width: 0; }
  .ct { display: flex; flex-direction: column; gap: 3px; padding: 5px 4px 6px; border-radius: 10px 10px 0 0; background: var(--fond); }
  .ct.av { background: none; justify-content: flex-end; }
  .ct .hn { display: flex; align-items: center; gap: 3px; font-weight: 650; white-space: nowrap; overflow: hidden; }
  .ct .hn span { overflow: hidden; text-overflow: ellipsis; }
  .ct .md { font-size: var(--t1); color: var(--gris); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 3px; }
  .ct .st { align-self: flex-start; }
  .ct .ic { display: flex; gap: 2px; }
  .ct { position: relative; }
  
  .mat.c4 .cn, .mat.c4 .cc { height: 44px; }
  .mat .cn.ibu-r, .mat .cc.ibu-r { height: 44px; }
  .ct .md.fx { display: flex; align-items: center; justify-content: space-between; }
  .ct.pin { box-shadow: inset 0 0 0 1.5px var(--encre); }
  .op { width: 14px; height: 14px; border-radius: 7px; border: 1.5px solid var(--encre); position: relative; flex: none; }
  .op::before { position: absolute; inset: 0; display: grid; place-items: center; font-size: var(--t1); line-height: 1; }
  .op-Ajouter::before, .op-Assembler::before { content: '+'; } .op-Remplacer::before { content: '⇄'; } .op-Diminuer::before, .op-Retirer::before { content: '−'; }
  .op-lev::before { content: '✻'; }
  .cn { font-weight: 650; display: flex; align-items: center; height: 52px; border-bottom: 1px solid #efefef; white-space: nowrap; overflow: hidden; }
  .cn.n { font-weight: 400; }
  .cn.att { background: linear-gradient(90deg, #ececec, #fff); padding-left: 4px; }
  .cc { display: flex; align-items: center; gap: 3px; height: 52px; padding: 0 4px; border-bottom: 1px solid #efefef; }
  .cc.v { background: #fafafa; }
  .cc .dl { font-size: var(--t1); font-weight: 650; }
  .cc .dl.ap { color: var(--gris2); font-weight: 400; }
  .cc .nm { font-size: var(--t1); color: var(--gris2); }
  .cc.ibu-r { font-weight: 650; font-variant-numeric: tabular-nums; }
  .cn.ibu-r { color: var(--gris2); font-weight: 400; }
  .ne-row { grid-column: 3 / -1; display: flex; align-items: center; justify-content: center; height: 52px; font-size: var(--t1); color: var(--gris2); border-bottom: 1px solid #efefef; background: repeating-linear-gradient(135deg, #fff 0 5px, #f3f3f3 5px 10px); }
  .ns-row { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; height: 30px; color: var(--gris); font-size: var(--t1); }
  .ns-row i { width: 12px; height: 12px; border-radius: 6px; border: 1.5px dashed #7a7a7a; }
  .rail { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .rail button { flex: none; height: 34px; padding: 0 10px; border-radius: 15px; border: 1px solid var(--trait); white-space: nowrap; font-size: var(--t1); }
  .rail button.lev { border-style: dashed; }
  .rail.choix { align-items: center; }
  .cpt-c { font-size: var(--t1); font-weight: 650; padding: 0 4px; }
  .plus-c::before { content: '+ '; }
  .plus-c:disabled { opacity: .45; }

  const { cols } = colonnes();
  const series = [{ nom: 'avant', valeurs: D.profil.map((p) => p.crans) }, ...cols.map((v) => ({ nom: 'après ' + titreVoie(v), valeurs: v.apres.map((a) => a.crans) }))];
  const svg = sv('svg', { id: 'radar', width: 358, height: 290, viewBox: '0 0 358 290', role: 'img', 'aria-label': 'Radar : ma bière avant et après les voies, en crans du style' });
  sec.append(svg);
  radar(svg, { objet: 'voies', max: 4, bande: [0, 3], R: 102, cx: 179, cy: 145, repere: 'au-dessus', isole: ST.isole, noms: ORD.map((id, i) => ({ nom: FAM[id].nom, gras: FAM[id].attendue, acc: D.profil[i].crans > 3 })),
    series: series.map((s) => ({ ...s, cache: ST.cachees.has(s.nom) })) });
  const d = ceQuiDistingueBiere();
  sec.append(lignesSeries([
    ['avant', 'Avant', 'rond', d.hors],
    ...cols.map((v, k) => ['après ' + titreVoie(v), titreVoie(v), ['creux', 'carre', 'tri'][k], deltasVoie(v).length ? deltasVoie(v) : ['effet faible : ≈ partout'],
      h('span', { class: 'sr-x' }, h('span', { class: 'st ' + stCls(v.stock) }, v.stock), h('span', { class: 'petit' }, ibuTxt(v.ibu) + ' IBU'), v.houblons[0] ? gout(v.houblons[0]) : null)]),
  ]));
}

/* ---------- Partie 3 : Comparer des houblons (objet 3, fiches 0 à 2) ---------- */
function partieComparer(sec) {
  const hs = ST.comparer.map((n) => ficheDe(n)).filter(Boolean);
  sec.append(choixHoublons());
  if (ST.lentille === 'radar') return radarHoublons(sec, hs);
  const m = h('div', { class: 'mat c4', role: 'table', 'aria-label': 'Ce que disent les fiches, par famille' });
  m.append(h('div', { class: 'ct av' }));
  for (const f of hs) m.append(enteteHoublon(f));
  for (let k = hs.length; k < 4; k++) m.append(h('div', {}));
  ORD.forEach((id, i) => {
    m.append(h('div', { class: 'cn' + (FAM[id].attendue ? ' att' : ' n') }, FAM[id].nom));
    for (const f of hs) {
      const c = f.niv[i];
      m.append(h('div', { class: 'cc', 'aria-label': f.nom + ', ' + FAM[id].long + ' : ' + (c.n === 0 ? 'non décrit' : c.n === 1 ? 'cité' : 'marqué') + (c.n ? ', ' + c.s + ' fiche sur ' + c.m : '') },
        h('span', { class: 'dots' }, c.n === 0 ? h('i', { class: 'nd' }) : [h('i', {}), h('i', { class: c.n === 2 ? '' : 'vide' })]),
        c.n ? h('span', { class: 'nm' }, c.s + '/' + c.m) : null));
    }
    for (let k = hs.length; k < 4; k++) m.append(h('div', { class: 'cc' }));
  });
  sec.append(m);
}
function enteteHoublon(f, k) {
    const o = origine(f.nom, ST.lignes);
    return h('div', { class: 'ct' + (ST.gout[f.nom] === 'exclu' ? ' ex' : '') },
      h('span', { class: 'hn' }, k != null ? marque(k) : null, h('span', { style: ST.gout[f.nom] === 'exclu' ? 'text-decoration:line-through' : null }, f.nom)),
      h('span', { class: 'st ' + (o === 'recette' ? 's-rec' : stCls(o)) }, o),
      h('span', { class: 'md fx' }, f.niv[0].m + ' fiche' + (f.niv[0].m > 1 ? 's' : ''), h('button', { class: 'x', 'data-booster': 'retirer houblon', 'aria-label': 'Retirer ' + f.nom + ' de la comparaison', onclick: () => { ST.comparer = ST.comparer.filter((x) => x !== f.nom); rendre(); } })),
      h('span', { class: 'ic' }, gout(f.nom)));
}
function choixHoublons() {
  const deja = new Set(ST.comparer);
  const noms = [...ST.lignes.map((l) => l.nom), ...D.rapides.stock.map((r) => r.nom), ...D.rapides.racheter.map((r) => r.nom)].filter((n, k, a) => a.indexOf(n) === k && !deja.has(n) && ficheDe(n));
  return h('div', { class: 'rail choix', role: 'group', 'aria-label': 'Choisir des houblons à comparer (recette, stock, catalogue)' }, h('span', { class: 'cpt-c' }, ST.comparer.length + '/4'), noms.slice(0, 4).map((n) => h('button', { class: 'plus-c', 'data-booster': 'ajouter houblon', 'aria-label': (ST.comparer.length >= 4 ? 'Comparer ' + n + ' à la place de ' + ST.comparer[3] : 'Comparer aussi ' + n), onclick: () => { if (ST.comparer.length >= 4) ST.comparer.pop(); ST.comparer.push(n); rendre(); } }, n)));
}
function radarHoublons(sec, hs) {
  const svg = sv('svg', { id: 'radar', width: 358, height: 316, viewBox: '0 0 358 316', role: 'img', 'aria-label': 'Radar : silhouettes des fiches des houblons choisis (0 non décrit, 1 cité, 2 marqué)' });
  sec.append(svg);
  radar(svg, { objet: 'houblons', max: 2, bande: null, R: 106, cx: 179, cy: 158, repere: null, isole: ST.isole, noms: ORD.map((id) => ({ nom: FAM[id].nom, gras: FAM[id].attendue })),
    series: hs.map((f) => ({ nom: f.nom, valeurs: f.niv.map((c) => c.n), cache: ST.cachees.has(f.nom) })) });
  sec.append(h('div', { class: 'hautes' }, lignesSeries(hs.map((f, k) => {
    const d = distingueHoublon(f, hs);
    return [f.nom, f.nom, ['rond', 'creux', 'carre', 'tri'][k], [d.seul.length ? 'seul : ' + d.seul.join(', ') : 'jamais seul en tête', d.marque.length ? 'marqué : ' + d.marque.join(', ') : 'rien de marqué'],
      h('span', { class: 'sr-x' }, h('span', { class: 'st ' + stCls(origine(f.nom, ST.lignes)) }, origine(f.nom, ST.lignes)), h('span', { class: 'petit' }, f.niv[0].m + ' fiche' + (f.niv[0].m > 1 ? 's' : '')), gout(f.nom))];
  }))));
}
rendre();
