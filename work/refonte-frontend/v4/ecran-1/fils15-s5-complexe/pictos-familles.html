<!doctype html>
<meta charset="utf-8">
<title>Pictos des familles</title>
<!-- Lot 15 : le brasseur, sur la planche du lot 14 : « j'aime bien les petit logo sapin fleur » (s6).
     Un picto par famille, dans leur style (plein, 24 × 24), aux couleurs des familles de la fiche
     (base/generateur/fiche.css). Copier le bloc <svg id="pictos"> dans la page, puis
     <svg width="16" height="16" aria-label="Floral"><use href="#p-floral"/></svg>. -->
<style>
  body { font: 14px system-ui, sans-serif; margin: 16px; background: #fbfaf7; color: #16161a; }
  .g { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; max-width: 358px; }
  .g div { display: grid; justify-items: center; gap: 4px; font-size: 11px; }
  .pale use { opacity: .38; }
</style>
<svg id="pictos" width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="p-citrus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="#d9b414"/><circle cx="12" cy="12" r="6.8" fill="#f6e48a"/><g stroke="#d9b414" stroke-width="1.6"><path d="M12 5.2V18.8M5.2 12H18.8M7.2 7.2L16.8 16.8M16.8 7.2L7.2 16.8"/></g></symbol>
  <symbol id="p-tropical" viewBox="0 0 24 24"><path d="M12 9 L9 2 L12 5 L15 2 Z M12 9 L6 4 L10 9 Z M12 9 L18 4 L14 9 Z" fill="#3f8a5f"/><ellipse cx="12" cy="15.5" rx="6" ry="7" fill="#ee9b2f"/><path d="M8 12l8 8M16 12l-8 8M7 16h10" stroke="#b86d12" stroke-width="1.1" fill="none"/></symbol>
  <symbol id="p-melon" viewBox="0 0 24 24"><path d="M2 9 A10 10 0 0 0 22 9 Z" fill="#6fc09b" transform="translate(0 2)"/><path d="M5 11 A7 7 0 0 0 19 11 Z" fill="#c8ecd8"/><g fill="#2f6b5f"><circle cx="9" cy="13" r=".9"/><circle cx="12" cy="14.5" r=".9"/><circle cx="15" cy="13" r=".9"/></g></symbol>
  <symbol id="p-stoneFruit" viewBox="0 0 24 24"><path d="M12 5 C13 2.5 16 2 18 3 C16.5 5 14.5 5.5 12 5 Z" fill="#6aa33a"/><circle cx="12" cy="14" r="8.5" fill="#e88d68"/><path d="M12 6.5 C9.5 10 9.5 18 12 22" stroke="#b9573a" stroke-width="1.4" fill="none"/></symbol>
  <symbol id="p-pomeFruit" viewBox="0 0 24 24"><path d="M12 7 C9 4.5 3.5 6 3.5 12 C3.5 18 8 22.5 12 20.5 C16 22.5 20.5 18 20.5 12 C20.5 6 15 4.5 12 7 Z" fill="#a3bd38"/><path d="M12 7 C12 5 12.5 3.5 14 2.5" stroke="#7a4e3a" stroke-width="1.6" fill="none" stroke-linecap="round"/></symbol>
  <symbol id="p-berries" viewBox="0 0 24 24"><g fill="#9b3f74"><circle cx="8" cy="10" r="4.2"/><circle cx="16" cy="10" r="4.2"/><circle cx="12" cy="17" r="4.2"/></g><g fill="#e0a8c8"><circle cx="6.8" cy="8.8" r="1.1"/><circle cx="14.8" cy="8.8" r="1.1"/><circle cx="10.8" cy="15.8" r="1.1"/></g><path d="M12 6 V2.5" stroke="#3f8a5f" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="p-floral" viewBox="0 0 24 24"><g fill="#bf86d6"><circle cx="12" cy="6" r="4"/><circle cx="18" cy="11" r="4"/><circle cx="15.5" cy="18" r="4"/><circle cx="8.5" cy="18" r="4"/><circle cx="6" cy="11" r="4"/></g><circle cx="12" cy="12.5" r="3.2" fill="#7a3f9b"/></symbol>
  <symbol id="p-herbal" viewBox="0 0 24 24"><path d="M4 20 C4 10 10 4 20 4 C20 14 14 20 4 20 Z" fill="#3f8a5f"/><path d="M4 20 L15 9" stroke="#bfe0c9" stroke-width="1.5" stroke-linecap="round"/></symbol>
  <symbol id="p-resin" viewBox="0 0 24 24"><path d="M12 2 L18 10 H15 L20 16 H14 V22 H10 V16 H4 L9 10 H6 Z" fill="#2f6b5f"/></symbol>
  <!-- Épicé (19.10 : « pico épice très étrange, plutôt vanille, canelle ? ») : pour un houblon, poivre
       et clou de girofle ; des grains de poivre ridés, sans tige (les petits fruits ont la leur). -->
  <symbol id="p-spice" viewBox="0 0 24 24"><g fill="#7a4e3a" stroke="#4e3022" stroke-width=".7"><circle cx="7" cy="7.5" r="3.1"/><circle cx="13.6" cy="5.6" r="2.8"/><circle cx="18.6" cy="10" r="3"/><circle cx="10.6" cy="12.4" r="3.2"/><circle cx="5.6" cy="17.4" r="2.9"/><circle cx="12.4" cy="19" r="2.9"/><circle cx="18.2" cy="17" r="3.1"/></g><g fill="#d8bba8"><circle cx="6" cy="6.5" r=".8"/><circle cx="12.8" cy="4.8" r=".7"/><circle cx="17.7" cy="9.1" r=".75"/><circle cx="9.6" cy="11.4" r=".8"/><circle cx="4.8" cy="16.5" r=".7"/><circle cx="11.6" cy="18.1" r=".7"/><circle cx="17.3" cy="16.1" r=".75"/></g></symbol>
  <symbol id="p-green" viewBox="0 0 24 24"><g fill="#6aa33a"><path d="M6 22 C5 15 3 10 2 6 C5 10 8 15 9 22 Z"/><path d="M10.5 22 C11 14 11.5 8 12 2 C13 8 13.5 14 13.5 22 Z"/><path d="M15 22 C16 15 19 10 22 6 C21 10 19 15 18 22 Z"/></g></symbol>
  <symbol id="p-earthy" viewBox="0 0 24 24"><path d="M1 20 C3 12 7 9 10 12 C12 7 18 6 23 20 Z" fill="#9a8a66"/><g fill="#6b5d40"><circle cx="8" cy="17" r="1.1"/><circle cx="14" cy="15" r="1.1"/><circle cx="17.5" cy="18" r="1.1"/></g></symbol>
</svg>
<div class="g">
  <div><svg width="32" height="32" aria-label="Agrumes"><use href="#p-citrus"/></svg>Agrumes</div>
  <div><svg width="32" height="32" aria-label="Fruits tropicaux"><use href="#p-tropical"/></svg>Tropicaux</div>
  <div><svg width="32" height="32" aria-label="Melon"><use href="#p-melon"/></svg>Melon</div>
  <div><svg width="32" height="32" aria-label="Fruits à noyau"><use href="#p-stoneFruit"/></svg>Noyau</div>
  <div><svg width="32" height="32" aria-label="Fruits à pépins"><use href="#p-pomeFruit"/></svg>Pépins</div>
  <div><svg width="32" height="32" aria-label="Petits fruits"><use href="#p-berries"/></svg>Petits fruits</div>
  <div><svg width="32" height="32" aria-label="Floral"><use href="#p-floral"/></svg>Floral</div>
  <div><svg width="32" height="32" aria-label="Herbacé aromatique"><use href="#p-herbal"/></svg>Herbacé</div>
  <div><svg width="32" height="32" aria-label="Boisé et résineux"><use href="#p-resin"/></svg>Résineux</div>
  <div><svg width="32" height="32" aria-label="Épicé"><use href="#p-spice"/></svg>Épicé</div>
  <div><svg width="32" height="32" aria-label="Végétal vert"><use href="#p-green"/></svg>Végétal</div>
  <div><svg width="32" height="32" aria-label="Terreux"><use href="#p-earthy"/></svg>Terreux</div>
</div>
<p>À 16 px, plein (marqué) et pâle (cité) :</p>
<div class="g">
  <div><span><svg width="16" height="16"><use href="#p-citrus"/></svg><svg width="16" height="16"><use href="#p-tropical"/></svg><svg width="16" height="16"><use href="#p-spice"/></svg><svg width="16" height="16"><use href="#p-earthy"/></svg></span>plein</div>
  <div class="pale"><span><svg width="16" height="16"><use href="#p-citrus"/></svg><svg width="16" height="16"><use href="#p-tropical"/></svg><svg width="16" height="16"><use href="#p-spice"/></svg><svg width="16" height="16"><use href="#p-earthy"/></svg></span>pâle</div>
</div>
