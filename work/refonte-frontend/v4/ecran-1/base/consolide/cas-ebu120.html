<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Houblons, rail du brassage</title>
<style>
  :root { --encre: #111; --gris: #555; --gris2: #6e6e6e; --trait: #d4d4d4; --fond: #f5f5f5; --fond2: #ebebeb; --acc: #c2410c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; color: var(--encre); }
  body { font: 400 14px/1.2 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  button, input, output { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; min-height: 24px; min-width: 24px; }
  ul { list-style: none; }
  :focus-visible { outline: 2px solid var(--encre); outline-offset: 2px; }
  .ecran { width: 100%; max-width: 390px; margin: 0 auto; padding: 8px 16px 10px; display: flex; flex-direction: column; gap: 6px; overflow-x: hidden; }
  .p { font-size: 12px; }
  .gris { color: var(--gris2); }
  .num { font-variant-numeric: tabular-nums; }

  /* En-tête de l'étape */
  .barre { display: flex; align-items: center; gap: 8px; height: 32px; }
  .retour { width: 28px; height: 28px; position: relative; }
  .retour::before { content: ''; position: absolute; left: 10px; top: 9px; width: 9px; height: 9px; border-left: 2px solid var(--encre); border-bottom: 2px solid var(--encre); transform: rotate(45deg); }
  h1 { font-size: 19px; font-weight: 650; }
  .etape { color: var(--gris2); }
  .style { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 10px; border: 1px solid var(--trait); border-radius: 14px; }
  .badge { font-size: 12px; padding: 2px 7px; border-radius: 10px; background: var(--fond2); color: var(--gris); }

  /* Résumé de la recette, comme l'étape Malts */
  .resume { display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 12px; border: 1px solid var(--trait); border-radius: 20px; flex: none; }
  .resume > div { display: flex; align-items: baseline; gap: 4px; }
  .resume b, .resume output { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .cle { font-size: 12px; color: var(--gris2); }
  .ibu-bloc { position: relative; }
  .delta { position: absolute; left: 30px; top: -12px; font-size: 12px; font-weight: 600; }
  .jauge { position: relative; display: inline-block; width: 52px; height: 8px; margin-left: 4px; align-self: center; border-radius: 4px; background: #e4e4e4; }
  .jauge .bde { position: absolute; left: 25%; width: 50%; top: 0; bottom: 0; background: #b9b9b9; }
  .jauge .rep { position: absolute; top: -3px; width: 3px; height: 14px; margin-left: -1.5px; background: var(--encre); border-radius: 1px; }
  .jauge.hors .rep { background: var(--acc); }
  .note-acc { color: var(--acc); font-weight: 600; }
  .note-ibu { display: flex; flex-direction: column; gap: 2px; padding: 6px 0 2px; border-radius: 10px; }

  /* Éléments communs d'une ligne d'ajout */
  .tag { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px; border: 1px solid var(--trait); border-radius: 13px; background: #fff; white-space: nowrap; }
  .tourne::after { content: '⟳'; font-size: 12px; color: var(--gris2); display: inline-block; }
  .tourne.roule::after { animation: tour 150ms ease-out; }
  @keyframes tour { from { transform: rotate(-180deg); } }
  .type { font-size: 12px; }
  .pas { display: inline-flex; align-items: center; gap: 2px; margin-left: auto; flex: none; }
  .moins, .plus { width: 26px; height: 26px; border-radius: 13px; border: 1px solid var(--trait); background: #fff; position: relative; }
  .moins::before, .plus::before, .plus::after { content: ''; position: absolute; left: 7px; top: 11.5px; width: 10px; height: 1.6px; background: var(--encre); }
  .plus::after { transform: rotate(90deg); }
  .dose { min-width: 44px; text-align: center; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .corbeille { width: 26px; height: 26px; position: relative; flex: none; }
  .corbeille::before, .corbeille::after { content: ''; position: absolute; left: 7px; top: 12px; width: 12px; height: 1.6px; background: var(--gris2); transform: rotate(45deg); }
  .corbeille::after { transform: rotate(-45deg); }
  .l2 { display: flex; align-items: center; gap: 6px; font-size: 12px; min-height: 20px; }
  .st { font-size: 12px; font-weight: 400; color: var(--gris2); white-space: nowrap; }
  .alpha { font-size: 12px; font-weight: 650; color: var(--encre); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .role { font-size: 12px; color: var(--gris2); white-space: nowrap; }
  .ic-stock { width: 10px; height: 10px; border-radius: 5px; border: 1.5px solid #9a9a9a; flex: none; display: inline-block; position: relative; }
  .ic-manque { border-style: dashed; }
  .ic-a-racheter::after { content: ''; position: absolute; left: 2px; top: 2px; width: 3px; height: 3px; border-radius: 2px; background: #9a9a9a; }
  .ic-a-acheter { border-radius: 2px; }
  .pt-manque { width: 8px; height: 8px; border-radius: 4px; border: 1.5px dashed var(--gris2); flex: none; }
  .cite { height: 20px; padding: 0 7px; border: 1px solid var(--acc); color: var(--acc); border-radius: 10px; font-weight: 600; display: inline-flex; align-items: center; white-space: nowrap; }
  .effet { height: 20px; padding: 0 7px; border: 1px solid var(--encre); border-radius: 10px; display: inline-flex; align-items: center; white-space: nowrap; font-weight: 600; }
  .effet.ne { border-style: dashed; border-color: var(--gris2); color: var(--gris); font-weight: 400; }
  .ibu-l { margin-left: auto; color: var(--gris); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .bio { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--gris); }
  .bio { flex-wrap: wrap; }
  .bio .quand-bio { font-weight: 650; color: var(--encre); }
  .sigs { display: flex; flex-wrap: wrap; gap: 4px; }
  .sig { padding: 2px 7px; border: 1px solid var(--gris2); border-radius: 10px; white-space: nowrap; }
  .sig.ne { border-style: dashed; }
  .mini { display: inline-flex; gap: 1px; align-items: center; flex: none; }
  .mini .c { width: 5px; height: 10px; border-radius: 1px; background: #e6e6e6; }
  .mini .c.ci { background: #ababab; }
  .mini .c.m { background: #3d3d3d; }
  .mini .c.acc.ci { background: var(--acc); opacity: .55; }
  .mini .c.acc.m { background: var(--acc); }
  .mini .c.sep { margin-left: 3px; }

  /* Ajout en un toucher */
  .rapides { display: flex; flex-direction: column; gap: 4px; }
  .rapide-l { display: flex; align-items: center; gap: 4px; }
  .rapide { flex: 1; min-width: 0; min-height: 44px; display: flex; align-items: center; gap: 7px; padding: 3px 8px 3px 5px; border-radius: 10px; background: var(--fond); text-align: left; }
  .rapide .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .rapide .r1, .rapide .r2 { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .rapide .r1 .st { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .rapide b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 48px; }
  .rapide .r2 .mini { margin-left: auto; }
  .dose-r { font-size: 12px; color: var(--gris); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .dose-r.fl::after { content: ' →'; }
  .col-ibu { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none; min-width: 60px; }
  .ic-levure { width: 14px; height: 14px; border-radius: 7px; border: 1.5px solid var(--gris2); position: relative; flex: none; }
  .ic-levure::after { content: ''; position: absolute; left: 6px; top: 2px; width: 4px; height: 4px; border-radius: 2px; background: var(--gris2); }
  .rapide .qte { font-size: 12px; color: var(--gris2); white-space: nowrap; }
  .rapide .plus-ibu { font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .plus-i { width: 22px; height: 22px; border-radius: 11px; background: var(--encre); position: relative; flex: none; }
  .plus-i::before, .plus-i::after { content: ''; position: absolute; left: 6px; top: 10.2px; width: 10px; height: 1.6px; background: #fff; }
  .plus-i::after { transform: rotate(90deg); }
  .gout { width: 28px; height: 28px; flex: none; border-radius: 14px; position: relative; color: var(--gris2); }
  .gout::before { content: '♡'; font-size: 14px; line-height: 28px; }
  .gout.aime::before { content: '♥'; color: var(--encre); }
  .voie, .rapide-l { position: relative; }
  .voie .gout-choix, .rapide-l .gout-choix { position: absolute; right: 34px; top: 50%; transform: translateY(-50%); z-index: 2; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .gout-choix { display: inline-flex; gap: 2px; padding: 2px; border-radius: 14px; background: var(--fond2); flex: none; }
  .gout-choix button { height: 26px; padding: 0 8px; border-radius: 13px; font-size: 12px; }
  .gout-choix button[aria-pressed="true"] { background: #fff; font-weight: 650; }
  .seg { display: inline-flex; padding: 2px; border-radius: 15px; background: var(--fond2); flex: none; }
  .seg button { height: 26px; padding: 0 11px; border-radius: 13px; font-size: 12px; color: var(--gris); }
  .seg button[aria-checked="true"], .seg button[aria-selected="true"] { background: #fff; color: var(--encre); font-weight: 650; box-shadow: 0 1px 2px rgba(0,0,0,.18); }
  .champ input { width: 100%; height: 36px; padding: 0 12px; border: 1px solid var(--trait); border-radius: 10px; background: #fff; font-size: 14px; }
  .champ input::placeholder { color: var(--gris2); }
  /* Champ de saisie : le focus se voit par sa bordure, sans contour (D33). */
  .champ input:focus, .champ input:focus-visible { outline: none; border-color: var(--encre); box-shadow: 0 0 0 1px var(--encre); }
  .rangee { display: flex; align-items: center; gap: 8px; min-height: 30px; }
  .levure { display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px; border-radius: 10px; background: var(--fond); white-space: nowrap; overflow: hidden; flex: 1 1 auto; }
  .levure .cle { margin-right: 2px; }
  .goutsl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; }
  .goutsl button { height: 24px; padding: 0 8px; border-radius: 12px; border: 1px dashed var(--gris2); }

  /* Ligne qui résume ma bière face à la cible et ouvre le panneau */
  .pan { display: flex; flex-direction: column; gap: 3px; width: 100%; text-align: left; padding: 6px 0 0; border-top: 1px solid var(--trait); }
  .pan .r1, .pan .r2 { display: flex; align-items: center; gap: 6px; min-height: 24px; width: 100%; }
  .exc { color: var(--acc); font-weight: 650; }
  .exc::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 4px; background: var(--acc); vertical-align: 1px; }
  .ouvrir { margin-left: auto; width: 34px; height: 26px; border-radius: 13px; background: var(--encre); position: relative; flex: none; }
  .ouvrir::after { content: ''; position: absolute; left: 12px; top: 9px; width: 7px; height: 7px; border-right: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg); }
  .cpt { color: var(--gris); white-space: nowrap; }
  .cpt + .cpt::before { content: '·'; margin-right: 6px; color: var(--gris2); }
  svg { display: block; }
  svg text { font-family: inherit; }

  /* Panneau : onglets des trois parties, lentille, tableaux */
  .tete { display: flex; align-items: center; gap: 8px; height: 36px; }
  .onglets { flex: 1; display: flex; padding: 2px; border-radius: 16px; background: var(--fond2); }
  .onglets button { flex: 1; height: 30px; border-radius: 14px; color: var(--gris); white-space: nowrap; }
  .onglets button[aria-selected="true"] { background: #fff; color: var(--encre); font-weight: 650; box-shadow: 0 1px 2px rgba(0,0,0,.18); }
  .partie { display: flex; flex-direction: column; gap: 6px; }
  .bloc-lecture { display: flex; flex-direction: column; gap: 6px; }
  .tete-f { display: grid; grid-template-columns: 84px 1fr 52px; align-items: end; column-gap: 8px; min-height: 18px; }
  .graduations { grid-column: 2; display: flex; justify-content: space-between; font-size: 12px; color: var(--gris2); }
  .graduations span { flex: 1; text-align: center; }
  .graduations.gr-style span:last-child { flex: 0 0 18%; white-space: nowrap; }
  .graduations.gr-style span:first-child { flex: 0 0 80%; }
  .legende-f { display: flex; gap: 6px; flex-wrap: wrap; }
  .legende-f span { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--trait); border-radius: 14px; font-size: 12px; color: var(--gris); }
  .legende-f i { width: 10px; height: 10px; border-radius: 5px; border: 2px solid var(--encre); }
  .legende-f .pt-deg { background: var(--encre); }
  .legende-f .pt-ns { border: 1.5px dashed #8a8a8a; }
  .familles { display: flex; flex-direction: column; }
  .fam { display: grid; grid-template-columns: 84px 1fr 52px; align-items: center; column-gap: 8px; min-height: 40px; padding: 0 2px; border-radius: 10px; cursor: pointer; background: #fff; }
  .fam.att { min-height: 46px; }
  .fam + .fam { border-top: 1px solid #f0f0f0; }
  .fam.ouvert { background: var(--fond); border-top-color: transparent; }
  .nom-f { text-align: left; font-size: 12px; min-height: 30px; white-space: nowrap; }
  .fam.att .nom-f { font-size: 14px; font-weight: 650; }
  .nom-f.acc { color: var(--acc); }
  .piste-f { position: relative; height: 12px; border-radius: 6px; background: #f0f0f0; background-image: linear-gradient(90deg, transparent calc(33.33% - 1px), #e0e0e0 calc(33.33% - 1px), #e0e0e0 33.33%, transparent 33.33%, transparent calc(66.66% - 1px), #e0e0e0 calc(66.66% - 1px), #e0e0e0 66.66%, transparent 66.66%); }
  .piste-f.ns { background: repeating-linear-gradient(45deg, #f2f2f2 0 4px, #e4e4e4 4px 6px); }
  .zone-f { position: absolute; top: 0; bottom: 0; border-radius: 6px; background: #cfcfcf; }
  .fam.att .zone-f { background: #bdbdbd; }
  .zone-f.crans { background-image: linear-gradient(90deg, transparent calc(33.33% - 1px), #fff calc(33.33% - 1px), #fff 33.33%, transparent 33.33%, transparent calc(66.66% - 1px), #fff calc(66.66% - 1px), #fff 66.66%, transparent 66.66%); }
  .piste-f.ns .zone-f { background: none; border: 1px dashed #b5b5b5; }
  .au-dessus { position: absolute; top: 0; bottom: 0; left: 82%; right: 0; border: 1px dashed #c4c4c4; border-radius: 6px; }
  .biere-f { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 6px; border: 2px solid var(--encre); background: #fff; z-index: 2; }
  .biere-f.deg { background: var(--encre); }
  .biere-f.dessus { background: var(--acc); border-color: var(--acc); }
  .visee-f { position: absolute; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; transform: rotate(45deg); border: 2px solid var(--encre); background: #fff; z-index: 1; }
  .lien-visee { position: absolute; top: 50%; border-top: 1.5px dashed var(--encre); }
  .droite-f { display: flex; justify-content: flex-end; align-items: center; }
  .ecart { font-size: 12px; font-weight: 650; color: var(--acc); white-space: nowrap; }
  .src-f { font-size: 12px; color: var(--gris2); }
  .ns-pt { width: 10px; height: 10px; border-radius: 5px; border: 1.5px dashed #8a8a8a; }
  .actions-f { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; padding: 2px 0 6px 84px; }
  .actions-f button { min-width: 32px; height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid var(--trait); background: #fff; font-size: 12px; }
  .actions-f [data-action="bannir"] { font-weight: 650; }
  .actions-f .niv { font-size: 12px; color: var(--gris); min-width: 52px; text-align: center; }
  .fam.bannie .nom-f { text-decoration: line-through; color: var(--gris2); }
  .partie.entre { animation: monte 220ms ease-out; }
  @keyframes monte { from { transform: translateY(16px); opacity: .5; } }
  .titre { display: flex; align-items: center; gap: 8px; min-height: 30px; }
  .titre .seg { margin-left: auto; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--trait); background: #fff; font-weight: 600; white-space: nowrap; }
  .chip.dir-plus::before, .chip.ajt::before { content: '+ '; }
  .chip.dir-moins::before { content: '− '; }
  .chip.dir-autre::before { content: '+ …'; color: var(--gris2); }
  .chip[aria-pressed="true"] { background: var(--encre); border-color: var(--encre); color: #fff; }
  .chip.ajt { font-weight: 400; border-style: dashed; }
  .chip.sel { display: inline-flex; align-items: center; gap: 0; height: 30px; padding: 0 0 0 10px; background: var(--fond); border-color: var(--fond); font-size: 12px; }
  .chip.sel .gout { width: 26px; height: 26px; }
  .chip.sel .gout::before { line-height: 26px; }
  .objet { font-weight: 650; }
  .cols { display: grid; align-items: start; column-gap: 4px; }
  .col { display: flex; flex-direction: column; gap: 1px; min-width: 0; padding-left: 4px; position: relative; }
  .col > .p { min-height: 15px; }
  .col b svg { margin-right: 5px; }
  .col b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col b.exclu { color: var(--gris2); text-decoration: line-through; }
  .col-act { display: flex; align-items: center; gap: 2px; margin-left: -6px; }
  .col-act .x { width: 28px; height: 28px; position: relative; }
  .col-act .x::before, .col-act .x::after { content: ''; position: absolute; left: 9px; top: 13px; width: 10px; height: 1.5px; background: var(--gris2); transform: rotate(45deg); }
  .col-act .x::after { transform: rotate(-45deg); }
  .col-act .x:disabled { opacity: .35; }
  .col-act .gout-choix { position: absolute; z-index: 3; left: 0; top: 64px; }
  .ctx { display: inline-flex; gap: 6px; margin-left: auto; }
  .ctx-h { font-size: 12px; padding: 3px 8px; border-radius: 10px; background: var(--fond); white-space: nowrap; }
  .chip.sel .x { width: 26px; height: 26px; position: relative; }
  .chip.sel .x::before, .chip.sel .x::after { content: ''; position: absolute; left: 8px; top: 12px; width: 10px; height: 1.5px; background: var(--gris2); transform: rotate(45deg); }
  .chip.sel .x::after { transform: rotate(-45deg); }
  .moitie { min-height: 28px; text-align: left; font-weight: 650; }
  .moitie::after { content: '›'; margin-left: 4px; color: var(--gris2); }
  .moitie[aria-pressed="true"] { text-decoration: underline; text-underline-offset: 3px; }
  .lien { min-height: 30px; text-align: left; font-weight: 650; }
  .lien::after { content: ' ›'; color: var(--gris2); }
  .voies { display: flex; flex-direction: column; gap: 4px; }
  .voie { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 6px; min-height: 57px; padding: 3px 10px 3px 4px; border-radius: 12px; background: var(--fond); }
  .voie.on { box-shadow: inset 0 0 0 1.5px var(--encre); }
  .coche { width: 22px; height: 22px; margin: 0 auto; accent-color: var(--encre); }
  .corps { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .v1, .v2 { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .v1 b { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .md { font-size: 12px; color: var(--gris); white-space: nowrap; }
  .md + .md::before { content: '·'; margin-right: 6px; }
  .op { width: 14px; height: 14px; border-radius: 7px; border: 1.5px solid var(--encre); position: relative; flex: none; }
  .op::before { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; line-height: 1; }
  .op-ajouter::before { content: '+'; }
  .op-remplacer::before { content: '⇄'; }
  .op-diminuer::before { content: '−'; }
  .op-levure::before { content: '∿'; }
  .bord, .faible, .aime-t { font-size: 12px; padding: 1px 7px; border-radius: 9px; background: #fff; border: 1px solid var(--trait); color: var(--gris); white-space: nowrap; }
  .bord::before { content: '+ '; }
  .faible { border-style: dashed; }
  .droite { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .droite .h { display: flex; align-items: center; gap: 2px; }
  .plus-ibu { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pistes { font-size: 12px; color: var(--gris); }
  .series { display: flex; flex-direction: column; gap: 4px; }
  .serie { width: 100%; min-height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 10px; background: var(--fond); text-align: left; }
  .serie[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px var(--encre); }
  .serie b { white-space: nowrap; }
  .serie .fams { font-size: 12px; color: var(--gris); min-width: 0; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .serie .fams.monte::before { content: '↑ '; color: var(--encre); }

/* Étape houblons, base v4 : le rail des étapes (BRIEF-RAIL.md ; D27, D28, D34 à D37, D41 à D47, D55, D56).

   renvoi, D37 révisé), les lignes de la recette posées à leur moment, 0′, le whirlpool, la levure
   (D28), la fermentation et la post-fermentation. Le rail ne porte que la recette : les ajouts
   proposés vivent à part, sous le rail, chacun avec son moment suggéré (D41).
   La loupe (D47, D55, D61) : la poignée prise, le rail devient une échelle continue et fixe pendant
   tout le geste (ébullition par 5′ de la durée à 0′, whirlpool de 100 à 60 °C par 5, fermentation puis
   post-fermentation de J+0 à J+14), chaque segment régulier (D45) : la hauteur dit le temps ; le
   segment de la ligne tenue est agrandi, les autres resserrés, le tout dans la hauteur du repos ; la
   graduation de la ligne reste sous le doigt à la prise, et le moment ne dépend que de la position du
   doigt. Seules les graduations du segment sous le doigt se montrent. Le geste (D46) : la carte, réduite
   à une ligne, suit le doigt en translation seule, l'étiquette suit la tranche ; les rangées (étapes,
   0′, levure) et les autres lignes restent à leur hauteur, côte à côte au même moment, sans jamais se

  if (s === 'whirlpool') return [...((D.tables.wp && D.tables.wp.temperatures) || [60, 65, 70, 75, 80, 85, 90, 95, 100])].sort((a, b) => b - a).map((t) => 'wp' + t);

   croissante, pente ≥ 1), puis la graduation la plus proche de c. Les autres houblons restent à leur

const KG = LOUPE.gros - 1;
/* Les crans : le centre du Dock reste sur la graduation tenue tant que le doigt est dans la moitié
   centrale de sa tranche, puis passe en douceur à la suivante (pente 2) : la graduation visée ne fuit
   pas sous le doigt, et rien ne saute (au plus un écart de graduation × 1,5). */
function cran(G, c) {
  const Z = G.Z;
  if (c <= Z[0] || c >= Z[Z.length - 1]) return c;
  let i = 0; while (Z[i + 1] < c) i++;
  const a = Z[i], b = Z[i + 1], m = (a + b) / 2, d = (b - a) / 2;
  if (c < m) { const t = (c - a) / d; return t <= 0.5 ? a : a + (2 * t - 1) * d; }
  const t = (b - c) / d; return t <= 0.5 ? b : b - (2 * t - 1) * d;
}
// Écarts fixes de la structure (px) : tête d'ébullition → début, 0′ → whirlpool, whirlpool → 100 °C,
// 60 °C → levure, levure → fermentation, fermentation → J+0, J+14 → post, post → J+0, fin du rail.
const STRUCT = [16, 20, 12, 16, 22, 12, 16, 12, 6];
function axeLoupe() {
  const T = {}, ticks = [];
  for (const s of SEGMENTS) valeursSeg(s).forEach((v, k) => { T[v] = { s, k }; ticks.push({ v, s, k }); });
  return { T, ticks };
}
/* Plan de base du rail (sans grossissement) pour des écarts e (par segment) et des ajouts aux écarts
   de structure x, la tête d'ébullition centrée en h : y de chaque graduation (P), des rangées (R). */
function planFixe(e, x, h) {
  const g = (i) => STRUCT[i] + (x[i] || 0);
  const P = {}, R = { 'T-ebu': h };
  let y = h + g(0);
  const poser = (s) => { valeursSeg(s).forEach((v, k) => { P[v] = y + k * e[s]; }); y += nIntervalles(s) * e[s]; };
  poser('ebullition');
  R['T-fin'] = y; R['T-wp'] = y + g(1); y = R['T-wp'] + g(2);
  poser('whirlpool');
  R['T-levure'] = y + g(3); R['T-dryActive'] = R['T-levure'] + g(4); y = R['T-dryActive'] + g(5);
  poser('fermentation');
  R['T-dryPost'] = y + g(6); y = R['T-dryPost'] + g(7);
  poser('post');
  return { P, R, haut: h - 10, bas: y + g(8) };
}
const structAvant = (v) => ({ ebullition: 1, whirlpool: 3, fermentation: 6, post: 8 })[segDe(v)];
/* Le Dock : intégrale de la tente (1 au doigt, 0 à ±1 rayon), impaire. */
const Stente = (a) => { const b = Math.min(1, Math.abs(a)); return Math.sign(a) * (b - (b * b) / 2); };
const grossi = (G, z, c) => 1 + KG * Math.max(0, 1 - Math.abs(z - c) / G.W);
/* Position affichée du point z du rail de base, le doigt sur c (haut du rail fixe). */
/* Hors du segment tenu, le Dock reste garé au bord du segment : le rail y est immobile. */
const borne = (G, c) => Math.max(G.F0, Math.min(G.F1, c));
const Yd = (G, z, c) => { const k = borne(G, c); return G.O + z + KG * G.W * (Stente((z - k) / G.W) + Stente((k - G.haut) / G.W)); };
const phi = (G, c) => Yd(G, c, c) - G.O;
/* Le point c du rail de base sous le doigt : seule la position du doigt compte. */
function sousDoigt(G, yF) {
  const t = yF - G.O;
  let lo = G.haut - 400, hi = G.bas + 400;
  for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (phi(G, m) < t) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
/* Le rail de base de la prise : écarts e = λ × poids (le segment tenu pèse LOUPE.poids), λ le plus
   grand qui tient : le bas, grossissement compris (au plus 1,5 rayon), dans la hauteur du repos + 80 px,
   et la tête dans le rail (longue ébullition : jusqu'en haut de l'écran). La graduation de la ligne
   tenue reste sous le doigt à la prise. La place en trop va aux écarts de structure. */
function disposerDock(vA, yA, H0, frTop) {
  const segA = segDe(vA);
  const ecarts = (lam) => Object.fromEntries(SEGMENTS.map((s) => [s, s === segA
    ? Math.max(LOUPE.min.focus, Math.min(LOUPE.max.focus, lam * LOUPE.poids))
    : Math.max(LOUPE.min.autre, Math.min(LOUPE.max.autre, lam))]));
  const plan = (e, x) => { const G = planFixe(e, x, 0); G.e = e; G.W = LOUPE.rayon * e[segA]; G.cA = vA === 'fwh' ? G.P['b' + EBU] - e.ebullition : G.P[vA]; const Va = valeursSeg(segA); G.F0 = G.P[Va[0]]; G.F1 = G.P[Va[Va.length - 1]]; G.O = 0; G.O = yA - phi(G, G.cA); G.Z = Va.map((v) => G.P[v]); return G; };
  const bas = (G) => Yd(G, G.bas, G.cA);
  const tient = (lam, haut) => { const G = plan(ecarts(lam), []); return G.O + G.bas + KG * G.W <= H0 + LOUPE.marge && G.O + G.haut >= haut; };
  let haut = 0, lam = 0.05;
  for (const essai of [0, 8 - frTop]) {
    haut = essai;
    let lo = 0.05, hi = 20;
    if (!tient(lo, haut)) { lam = lo; continue; }
    for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; if (tient(m, haut)) lo = m; else hi = m; }
    lam = lo;
    if (ecarts(lam)[segA] >= LOUPE.min.focus || segA !== 'ebullition') break;
  }
  const e = ecarts(lam);
  // Longue ébullition qui ne tient pas : l'ébullition descend jusqu'au plancher, et le rail monte.
  if (segA === 'ebullition') {
    const G = plan(e, []);
    if (G.O + G.haut < haut) {
      const iA = vA === 'fwh' ? 0 : valeursSeg('ebullition').indexOf(vA);
      if (iA > 0) e.ebullition = Math.max(LOUPE.plancher, Math.min(e.ebullition, (yA - 10 - haut - STRUCT[0]) / (iA * (1 + KG / 2))));
    }
  }
  const x = [];
  const k = structAvant(vA);
  const G0 = plan(e, x);
  const reste = H0 - bas(G0);
  if (reste > 0) { const n = STRUCT.length - 1 - k; for (let i = k; i < STRUCT.length - 1; i++) x[i] = reste / n; }
  if (segA !== 'ebullition') { const libre = G0.O + G0.haut - 10; if (libre > 0) for (let i = 0; i < k; i++) x[i] = (x[i] || 0) + libre / k; }
  return plan(e, x);
}

let GESTE = null;
/* La loupe s'ouvre au premier mouvement du doigt, ou après 120 ms de maintien : un toucher bref
   sur la poignée ne fait rien clignoter. */
function brancherGlisser(poignee, carte, l) {
  let attente = null;
  const demarrer = (cy) => {
    const a = attente;
    attente = null;
    clearTimeout(a.timer);
    GESTE = ouvrirLoupe(carte, l, a);
    if (cy != null) GESTE.suivre(cy);
  };
  poignee.addEventListener('pointerdown', (e) => {
    if (e.button > 0 || GESTE || attente) return;
    e.preventDefault();
    try { poignee.setPointerCapture(e.pointerId); } catch (x) { /* rien */ }
    attente = { clientY: e.clientY, pointerId: e.pointerId };
    attente.timer = setTimeout(() => { if (attente) demarrer(null); }, 120);
  });
  poignee.addEventListener('pointermove', (e) => {
    if (attente && attente.pointerId === e.pointerId) { if (Math.abs(e.clientY - attente.clientY) >= 2) demarrer(e.clientY); }
    else if (GESTE && GESTE.id === e.pointerId) GESTE.suivre(e.clientY);
  });
  poignee.addEventListener('pointerup', (e) => {
    if (attente && attente.pointerId === e.pointerId) { clearTimeout(attente.timer); attente = null; return; }
    if (GESTE && GESTE.id === e.pointerId) GESTE.lacher(e.clientY);
  });
  // D42 : un geste interrompu par le téléphone (pointercancel, touchcancel, capture perdue) rend tout.
  const interrompre = () => {
    if (attente) { clearTimeout(attente.timer); attente = null; }
    if (GESTE && GESTE.carte === carte) GESTE.annuler();
  };
  poignee.addEventListener('pointercancel', interrompre);
  poignee.addEventListener('touchcancel', interrompre);
  poignee.addEventListener('lostpointercapture', () => { setTimeout(interrompre, 0); });
}

function ouvrirLoupe(carte, l, ev) {
  const fr = carte.parentElement, app = fr.parentElement;
  const R0 = fr.getBoundingClientRect();
  const lignes = [...fr.children].filter((r) => r.dataset.rang);
  const repos = new Map(lignes.map((r) => { const b = r.getBoundingClientRect(); return [r, b.top - R0.top]; }));
  const pq = carte.querySelector('.quand').getBoundingClientRect();
  const yA = pq.top + pq.height / 2 - R0.top;
  const topCarte = repos.get(carte);
  const vA = valeurDe(l);
  const A = axeLoupe();
  const q = carte.querySelector('[data-role="quand"]'), type = carte.querySelector('[data-role="type-ajout"]');
  const ticks = [...fr.querySelectorAll('.grad')].map((el) => ({ el, v: el.dataset.etape, s: el.dataset.graduation, etat: '' }));
  const tetes = Object.fromEntries(lignes.filter((r) => /^T-/.test(r.dataset.rang)).map((r) => [r.dataset.rang, r]));
  const axe = fr.querySelector('.axe');
  // Tout sort du flux sans bouger ; la carte tenue se réduit à une ligne, les autres lignes à leur nom
  // et leur moment, les rangées nommées se compactent ; les hauteurs sont mesurées ensuite.
  fr.style.height = R0.height + 'px';
  fr.setAttribute('data-geste', '');
  for (const [r, top] of repos) r.style.transform = 'translateY(' + top + 'px)';
  carte.setAttribute('data-glisse', '');
  carte.classList.add('leve');
  for (const r of lignes) if (r !== carte && /^L/.test(r.dataset.rang)) r.classList.add('jeton');
  // L'étiquette réunie : « Motueka · Nugget » quand deux houblons sont au même moment.
  const avecDe = (el) => { const n = el.querySelector('.nom'); const s = h('span', { class: 'avec' }); n.after(s); return s; };
  const avecTenu = avecDe(carte);
  const hauteur = new Map(lignes.map((r) => [r, r.getBoundingClientRect().height]));
  const hCarte = hauteur.get(carte);
  const G = disposerDock(vA, yA, R0.height, R0.top);
  const ancre = (v) => G.P[v] ?? (v === 'fwh' ? G.P['b' + EBU] - G.e.ebullition : G.P[valeursSeg(segDe(v)).slice(-1)[0]]);
  const rangees = Object.entries(tetes).filter(([k]) => k in G.R).map(([k, el]) => ({ el, z: G.R[k], h: hauteur.get(el) }));
  const jetons = lignes.filter((r) => r !== carte && /^L/.test(r.dataset.rang)).map((el) => {
    const x = ETAT.lignes.find((y) => 'L' + y.id === el.dataset.rang);
    const v = valeurDe(x);
    return { el, v, nom: x.nom, quand: quand(x), z: ancre(v), h: hauteur.get(el), avec: avecDe(el), fondu: false, txt: '' };
  }).sort((a, b) => a.z - b.z);
  const y0 = ev.clientY;
  const g = { id: ev.pointerId, carte, v: vA, seg: segDe(vA), bouge: false, dy: 0 };
  const plusProche = (c) => { let b = A.ticks[0], d = Infinity; for (const k of A.ticks) { const x = Math.abs(G.P[k.v] - c); if (x < d) { d = x; b = k; } } return b; };
  const croise = (a0, a1, b0, b1) => a0 < b1 + 1 && b0 < a1 + 1;
  // L'ouverture : de la place au repos à la place sur le Dock, en 170 ms (aussitôt en mouvement réduit).
  let p = REDUIT ? 1 : 0;
  const t0 = performance.now();
  const lisse = (k) => 1 - Math.pow(1 - k, 3);
  const placer = (el, y) => { const s = 'translateY(' + y.toFixed(1) + 'px)'; if (el._t !== s) { el._t = s; el.style.transform = s; } };
  let yDoigt = yA, txtTenu = '';
  const poserTout = () => {
    const k = p >= 1 ? 1 : lisse(p);
    const vers = (el, cible) => repos.get(el) + (cible - repos.get(el)) * k;
    const c = cran(G, borne(G, sousDoigt(G, yDoigt)));
    for (const r of rangees) { r.y = vers(r.el, Yd(G, r.z, c) - r.h / 2) + r.h / 2; placer(r.el, r.y - r.h / 2); }
    // Les autres houblons : à leur moment, jamais de côté. Sous la carte tenue, ils s'effacent ; au
    // même moment qu'elle, leur nom rejoint son étiquette ; deux autres qui se touchent, une étiquette.
    const avecT = [];
    const yC0 = topCarte + g.dy, yC1 = yC0 + hCarte;
    let prec = null;
    for (const j of jetons) {
      j.y = Yd(G, j.z, c);
      placer(j.el, vers(j.el, j.y - j.h / 2));
      let fondu = false;
      j.lie = [];
      if (croise(j.y - j.h / 2, j.y + j.h / 2, yC0, yC1)) { fondu = true; if (j.v === g.v) avecT.push(j.nom); }
      else if (prec && croise(j.y - j.h / 2, j.y + j.h / 2, prec.y - prec.h / 2, prec.y + prec.h / 2)) { fondu = true; prec.lie.push(j.v === prec.v ? j.nom : j.quand + ' ' + j.nom); }
      else prec = j;
      if (fondu !== j.fondu) { j.fondu = fondu; j.el.classList.toggle('fondu', fondu); }
    }
    for (const j of jetons) { const t = j.lie.length ? '· ' + j.lie.join(' · ') : ''; if (t !== j.txt) { j.txt = t; j.avec.textContent = t; } }
    const t = avecT.length ? '· ' + avecT.join(' · ') : '';
    if (t !== txtTenu) { txtTenu = t; avecTenu.textContent = t; }
    // Les graduations du segment sous le doigt : longues et foncées dans la loupe, courtes au loin.
    for (const tk of ticks) {
      const z = G.P[tk.v], y = Yd(G, z, c);
      if (tk.y !== y) { tk.y = y; tk.el.style.transform = 'translateY(' + (y - 1).toFixed(1) + 'px)'; }
      const etat = tk.s !== g.seg ? '' : grossi(G, z, c) >= 1.6 ? 'vue' : 'vue loin';
      if (etat !== tk.etat) { tk.etat = etat; tk.el.classList.toggle('vue', etat !== ''); tk.el.classList.toggle('loin', etat === 'vue loin'); }
    }
    // Le Dock écrit ses minutes (19.10, défaut du jury : la minute n'était lue que dans la pastille,
    // sous le pouce) : sur les graduations grossies, à droite du trait, hors de la pastille tenue
    // (20 px au moins du doigt), sans toucher une carte, une étape ni la minute écrite au-dessus.
    const occupe = [[yC0 - 3, yC1 + 3], ...rangees.map((r) => [r.y - r.h / 2, r.y + r.h / 2]), ...jetons.filter((j) => !j.fondu).map((j) => [j.y - j.h / 2, j.y + j.h / 2])];
    let dernier = -Infinity;
    for (const tk of ticks) {
      const ecrit = k >= 1 && tk.etat === 'vue' && tk.v !== g.v && Math.abs(tk.y - yDoigt) >= 20 && tk.y - dernier >= 16
        && !occupe.some(([a, b]) => tk.y + 7 > a && tk.y - 7 < b);
      if (ecrit) dernier = tk.y;
      if (ecrit !== !!tk.ecrit) { tk.ecrit = ecrit; tk.el.classList.toggle('ecrit', ecrit); }
    }
    const yTete = Yd(G, G.R['T-ebu'], c), yBas = Yd(G, G.bas, c);
    axe.style.top = yTete + 'px';
    axe.style.height = Math.max(0, yBas - 6 - yTete) + 'px';
    fr.style.height = Math.max(R0.height, yBas) + 'px';
    app.classList.toggle('rail-haut', Yd(G, G.haut, c) < -8);
    return c;
  };
  tetes[TETE_SEG[g.seg]].classList.add('focus');
  poserTout();
  if (p < 1) requestAnimationFrame(function ouvre(now) { if (g.ferme) return; p = Math.min(1, (now - t0) / LOUPE.ouverture); poserTout(); if (p < 1) requestAnimationFrame(ouvre); });

  g.suivre = (cy) => {
    const dy = cy - y0;
    g.dy = dy; yDoigt = yA + dy;
    carte.style.transform = 'translateY(' + (topCarte + dy) + 'px)';
    if (!g.bouge && Math.abs(dy) >= 3) g.bouge = true;
    const pr = plusProche(sousDoigt(G, yDoigt));
    if (pr.s !== g.seg) { tetes[TETE_SEG[g.seg]].classList.remove('focus'); g.seg = pr.s; tetes[TETE_SEG[g.seg]].classList.add('focus'); }
    if (g.bouge && pr.v !== g.v) {
      g.v = pr.v;
      const x = { ...l }; appliquer(x, pr.v);
      q.textContent = quand(x);
      if (type) type.textContent = mom(x.moment).type;
    }
    poserTout();
  };
  const fermer = (change) => {
    g.ferme = true;
    GESTE = null;
    const avant = new Map(lignes.map((r) => [r.dataset.rang, r.getBoundingClientRect().top]));
    const estompe = app.classList.contains('rail-haut');
    app.classList.remove('rail-haut');
    if (g.bouge) IGNORE_CLIC = performance.now() + 400;
    ETAT.focusK = 'q' + l.id;
    rendre(change);
    if (REDUIT) return;
    // Tout se referme : chaque rangée revient de sa place sur le Dock à sa place au repos.
    const fr2 = app.querySelector('.frise');
    if (fr2) for (const r of fr2.children) {
      const t0b = avant.get(r.dataset.rang);
      if (t0b == null) continue;
      const d = t0b - r.getBoundingClientRect().top;
      if (Math.abs(d) > 0.5) r.animate([{ transform: 'translateY(' + d + 'px)' }, { transform: 'none' }], { duration: 240, easing: 'cubic-bezier(.2,.8,.2,1)' });
    }
    if (estompe) for (const x of app.querySelectorAll(':scope > .barre, :scope > .resume')) x.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200 });
  };
  g.lacher = (cy) => {
    g.suivre(cy);
    const v = g.bouge ? plusProche(sousDoigt(G, yA + g.dy)).v : vA;
    const change = v !== vA;
    if (change) appliquer(l, v);
    fermer(change);
  };
  g.annuler = () => fermer(false);
  return g;
}

VARIANTE = {
  etape(app) {
    app.append(enTete(), resume(), frise(), zoneAjouts(), ...[goutsLigne(), panLigne()].filter(Boolean));
  },
};

/* Un seul composant radar pour toute la base (base v4.3, 18.10, soir et nuit ; D62, D65, D66) :
   Ma bière, Suggestions, Comparer et la fiche du houblon passent tous par radar(). Modèle : la
   variante D3 retenue par le brasseur sur la planche des fils 7 (fils7-radar/p04 ; « P3,4,6,7
   semble pas mal »), après « Les spidergraph/radar graph resemble a rien, c'est une vrai
   régression... ».
   Géométrie : d3-scale (scaleLinear) et d3-shape (lineRadial + curveLinearClosed, sur d3-path),
   empaquetés en ligne dans lib-radar.js (window.D3) ; le reste est du SVG ordinaire ; motion
   (window.MO) pour le balayage d'une voie à l'autre.
   Plancher : chaque série est un polygone fermé sur les 12 axes, sans valeur vide (D62).
   D65 (« souvent les spidergraph ne montre pas que certaines données sont inconnus et du coup ont
   les traitements comme connue mais valeur à 0 ») : une famille sans donnée (non située dans ma
   bière ; décrite par aucune fiche dans Comparer et la fiche) se pose au centre, jamais sur
   l'anneau du zéro ; son libellé est gris et suivi de « ? », une marque creuse sur son axe, un
   secteur hachuré (data-inconnu), et la légende dit « inconnu, ce n'est pas zéro ».
   D66 (« Pourquoi il y a cité ? ») : aucun nom d'échelle dans le dessin, où il se lisait comme la
   valeur du libellé voisin ; l'échelle est une clé de la légende, sous le radar.
   Silhouettes pleines translucides et points aux sommets ; aucune série en tirets ni en
   pointillés (D39). Libellés entiers de 12 px, sur deux lignes si besoin, ancrés selon l'angle ;
   au toucher (ou au survol) d'un sommet, la famille et la valeur en mots.
   Couleurs, dans le radar seulement (légende comprise, dessinée dans le SVG) : ma bière et l'après
   en bleu, l'avant en contour sombre, la zone du style en fond gris, chaque houblon de Comparer
   dans sa couleur ; l'orangé d'alerte sur le seul sommet de ma bière au-dessus du style (D40).
   Contrat (controle-radar) : svg[data-radar][data-objet][data-axes] (les 12 familles de la roue,
   agrumes en haut, sens horaire), [data-serie][data-valeurs] alignées sur data-axes et
   [data-couleur]. Aucun chiffre calculé : les valeurs du pack sont placées, rien d'autre. */
const RADAR = (() => {
  const TXT = '#333', ENC = '#111', GRIS = '#6e6e6e', LEG = '#555', GRILLE = '#e2e2e2', ANNEAU = '#c4c4c4', ANNEAU0 = '#e4e4e4';
  const ZONE_F = 'rgba(0,0,0,0.10)', ZONE_T = '#bdbdbd';
  const MOI = '#0072B2', AVANT = '#333';
  // Comparer : les couleurs de la page de référence (p04), loin de l'alerte et lisibles en daltonisme.
  const HOUBLONS = ['#0072B2', '#009E73', '#CC79A7', '#56B4E9'];
  // Mêmes traits et opacités partout (D39) : sujet 2 et 0,18 ; repère en contour 1,5.
  const OP = 0.18, T_SUJET = 2, T_REPERE = 1.5, PX = 12, LH = 14, GAP = 8, PAD = 3;
  // D66 : la clé d'échelle de la légende à 24 px au moins du libellé du bas.
  const ECART_LEG = 24;
  const ROUE = D.roue.map((r) => r.f);
  const POLICE = '-apple-system, system-ui, "Segoe UI", Roboto, sans-serif';
  const CTX = document.createElement('canvas').getContext('2d');
  const largeur = (t, gras) => { CTX.font = (gras ? 650 : 400) + ' ' + PX + 'px ' + POLICE; return CTX.measureText(t).width; };
  const nomF = (f) => D.court[f];
  const CLASSES_C = ['non décrit', 'cité', 'marqué'];
  const motsNiveau = (v) => (v < 0.5 ? 'à peine' : v < 1.5 ? 'faible' : v < 2.5 ? 'moyen' : 'marqué');
  const plein = (c, r) => ({ r, fill: c, stroke: '#fff', 'stroke-width': 1.5 });
  const creux = (c, r) => ({ r, fill: '#fff', stroke: c, 'stroke-width': 1.6 });
  const f1 = (x) => x.toFixed(1);
  const INCONNU = 'inconnu, ce n\'est pas zéro';
  let RID = 0;

  // Un toucher hors d'un radar referme sa bulle.
  document.addEventListener('pointerdown', (e) => {
    for (const b of document.querySelectorAll('.rdr-bulle.on')) if (!b.parentNode.contains(e.target)) b.classList.remove('on');
  }, true);

  /* Le cadre : libellés (une ou deux lignes, ancrés selon l'angle), rayon ajusté pour que tous
     tiennent dans la largeur (et la hauteur maximale), anneaux, rayons, légende, couches. */
  function radar(cont, o) {
    const axes = ROUE, n = axes.length, W = o.W || 358, pas = (2 * Math.PI) / n;
    const ang = (k) => k * pas, xy = (a, rr) => [Math.sin(a) * rr, -Math.cos(a) * rr];
    const lib = axes.map((f, k) => {
      const l = o.libelle ? o.libelle(f, k) : {};
      // D65 : une famille sans donnée, en gris et suivie de « ? » (collé : un seul mot).
      const nom = { t: nomF(f) + (l.inconnu ? '?' : ''), gras: !!l.gras, fill: l.inconnu ? GRIS : l.gras ? ENC : TXT };
      const compte = l.compte ? { t: l.compte, gras: false, fill: GRIS } : null;
      // Sur les côtés, le compte des fiches passe sous le nom ; en haut et en bas, à sa suite.
      const lignes = !compte ? [[nom]] : Math.abs(Math.sin(ang(k))) > 0.45 ? [[nom], [compte]] : [[nom, { ...compte, t: ' ' + compte.t }]];
      return { lignes, larg: Math.max(...lignes.map((li) => li.reduce((s, x) => s + largeur(x.t, x.gras), 0))) };
    });
    // Légende, dans le SVG (ses couleurs restent celles du radar). Un élément : une pastille et
    // ses mots, ou une clé (plusieurs pastilles, chacune suivie de son mot). En colonne : une
    // rangée par élément, ses précisions en gris à la suite, à la ligne quand la largeur manque ;
    // sinon à la file.
    const leg = (o.legende || []).filter(Boolean).map((it) => ({ ...it, sw: it.t === 'centre' ? 28 : it.t === 'cle' ? 0 : 16 }));
    for (const it of leg) {
      if (it.t !== 'cle') continue;
      let x = 0;
      it.parts = it.parts.map((p) => { const q = { ...p, x, xt: x + 14 }; x += 14 + largeur(p.mot, false) + 12; return q; });
      it.largeur = x - 12;
    }
    let legH = 0;
    if (o.colonne) {
      let y = 0;
      for (const it of leg) {
        const dispo = W - it.sw - 6, lignes = it.t === 'cle' ? [] : [[{ t: it.texte, fill: TXT }]];
        let w = it.t === 'cle' ? it.largeur : largeur(it.texte, false);
        (it.details ? it.details.split(' ') : []).forEach((m, j) => {
          const t = (j ? ' ' : ' · ') + m, lt = largeur(t, false);
          if (w + lt > dispo) { lignes.push([{ t: m, fill: GRIS }]); w = largeur(m, false); } else { lignes[lignes.length - 1].push({ t, fill: GRIS }); w += lt; }
        });
        it.x = 0; it.y = y; it.lignes = lignes;
        y += Math.max(1, lignes.length) * 15 + 8;
      }
      legH = leg.length ? y + 2 + ECART_LEG : 0;
    } else {
      let lx = 0, ly = 0, rangs = leg.length ? 1 : 0;
      for (const it of leg) {
        it.w = it.t === 'cle' ? it.largeur : it.sw + 5 + largeur(it.texte, false);
        if (lx > 0 && lx + it.w > W) { lx = 0; ly += 18; rangs++; }
        it.x = lx; it.y = ly; it.lignes = it.t === 'cle' ? [] : [[{ t: it.texte, fill: LEG }]]; lx += it.w + 14;
      }
      legH = rangs ? rangs * 18 + 4 + ECART_LEG : 0;
    }
    // Le rayon : la largeur d'abord (les libellés peuvent déborder dans la gouttière de la page),
    // puis la hauteur maximale s'il y en a une.
    const demi = W / 2 + (o.deborde ?? 0);
    let R = o.Rmax || 150;
    lib.forEach((l, k) => { const s = Math.abs(Math.sin(ang(k))); if (s > 0.1) R = Math.min(R, (demi - 2 - l.larg) / s - GAP); });
    const poser = (RR) => lib.map((l, k) => {
      const a = ang(k), s = Math.sin(a), c = Math.cos(a), [x, y] = xy(a, RR + GAP), nl = l.lignes.length;
      const y0 = c > 0.9 ? y - (nl - 1) * LH - 3 : c < -0.9 ? y + 12 : y - ((nl - 1) * LH) / 2 + 4;
      const ancre = Math.abs(s) < 0.1 ? 'middle' : s > 0 ? 'start' : 'end';
      return { x, y0, ancre, y1: y0 - 10, y2: y0 + (nl - 1) * LH + 3 };
    });
    let pos, haut, bas;
    for (let i = 0; i < 4; i++) {
      pos = poser(R);
      haut = Math.min(-R, ...pos.map((p) => p.y1)); bas = Math.max(R, ...pos.map((p) => p.y2));
      const trop = o.Hmax ? bas - haut + 2 * PAD + legH - o.Hmax : 0;
      if (trop <= 0.5) break;
      R -= trop / 2;
    }
    const H = Math.round(Math.max(o.Hmin || 0, bas - haut + 2 * PAD + legH));
    const reste = H - (bas - haut + 2 * PAD + legH);
    const cx = W / 2, cy = PAD - haut + reste / 2;
    const r = D3.scaleLinear().domain([o.min, o.max]).range([0, R]).clamp(true);
    // Polygone fermé sur les 12 axes : une valeur vide se pose au centre, jamais un axe sauté.
    const ligne = D3.lineRadial().angle((d, k) => ang(k)).radius((v) => (v == null ? 0 : r(v))).curve(D3.curveLinearClosed);
    const P = (k, v) => xy(ang(k), v == null ? 0 : r(v));

    const boite = h('div', { class: 'rdr-boite' });
    cont.append(boite);
    const svg = sv('svg', { width: W, height: H, viewBox: '0 0 ' + W + ' ' + H, class: 'rdr', 'data-radar': '', 'data-objet': o.objet, 'data-axes': axes.join(','), role: 'img', 'aria-label': o.label });
    boite.append(svg);
    const bulle = h('div', { class: 'rdr-bulle', 'aria-hidden': 'true' });
    boite.append(bulle);
    const defs = sv('defs', {}, svg);
    const centre = sv('g', { transform: 'translate(' + f1(cx) + ',' + f1(cy) + ')' }, svg);
    const C = {};
    for (const k of ['grille', 'zone', 'inconnu', 'series', 'libelles', 'visees', 'marques']) C[k] = sv('g', { class: 'c-' + k }, centre);
    // Anneaux, sans nom (D66) : 0 en trait clair quand il n'est pas au centre, les autres en gris ; rayons.
    const valsAnneaux = (o.min < 0 ? [0] : []).concat(o.anneaux || []);
    for (const v of valsAnneaux) sv('path', { d: ligne(axes.map(() => v)), fill: 'none', stroke: v === 0 ? ANNEAU0 : ANNEAU, 'stroke-width': 1 }, C.grille);
    axes.forEach((f, k) => { const [x, y] = xy(ang(k), R); sv('line', { x1: 0, y1: 0, x2: f1(x), y2: f1(y), stroke: GRILLE, 'stroke-width': 1 }, C.grille); });
    // Les 12 libellés, entiers.
    lib.forEach((l, k) => {
      const p = pos[k];
      const t = sv('text', { 'text-anchor': p.ancre, 'font-size': PX, 'data-fam': axes[k] }, C.libelles);
      l.lignes.forEach((li, j) => li.forEach((x, m) => {
        sv('tspan', { x: m ? null : f1(p.x), y: m ? null : f1(p.y0 + j * LH), fill: x.fill, 'font-weight': x.gras ? 650 : 400 }, t).textContent = x.t;
      }));
    });
    // Légende.
    if (leg.length) {
      const gl = sv('g', { class: 'c-legende', transform: 'translate(0,' + f1(H - legH + ECART_LEG + 4) + ')' }, svg);
      for (const it of leg) {
        const y = it.y + 7;
        if (it.t === 'cle') {
          // Une clé : un seul texte, chaque mot après sa pastille.
          const t = sv('text', { y: f1(y + 4), 'font-size': PX }, gl);
          for (const p of it.parts) {
            pastilleSvg(gl, p, it.x + p.x, y);
            sv('tspan', { x: f1(it.x + p.xt), fill: LEG }, t).textContent = p.mot;
          }
          continue;
        }
        pastilleSvg(gl, it, it.x, y);
        it.lignes.forEach((li, j) => {
          const t = sv('text', { x: f1(it.x + it.sw + 6), y: f1(y + 4 + j * 15), 'font-size': PX }, gl);
          for (const x of li) sv('tspan', { fill: x.fill }, t).textContent = x.t;
        });
      }
    }

    const g = { svg, boite, defs, C, axes, n, pas, cx, cy, R, r, P, ligne, id: 'rd' + ++RID, W, H, cibles: [] };
    // Un sommet posé : un cercle, et une cible pour le toucher (les mots de sa bulle).
    g.marque = (p, attrs, mots, parent) => {
      const e = sv('circle', { cx: f1(p[0]), cy: f1(p[1]), ...attrs }, parent || C.marques);
      if (mots) g.cibles.push({ x: p[0], y: p[1], mots, groupe: parent || null });
      return e;
    };
    // La bulle : la famille et la valeur en mots, au-dessus du sommet (dessous près du haut).
    const local = (e) => { const b = svg.getBoundingClientRect(), k = W / b.width; return [(e.clientX - b.left) * k - cx, (e.clientY - b.top) * k - cy]; };
    const proche = (e, rayon) => {
      const [x, y] = local(e);
      let best = null, d0 = rayon;
      for (const c of g.cibles) { const d = Math.hypot(c.x - x, c.y - y); if (d < d0) { d0 = d; best = c; } }
      return best;
    };
    g.cacher = () => bulle.classList.remove('on');
    g.montrer = (c) => {
      const ici = g.cibles.filter((x) => Math.hypot(x.x - c.x, x.y - c.y) < 3);
      bulle.replaceChildren(...ici.map((x) => h('div', {}, x.mots)));
      bulle.classList.add('on');
      const k = svg.getBoundingClientRect().width / W;
      const bw = bulle.offsetWidth, bh = bulle.offsetHeight, X = (cx + c.x) * k, Y = (cy + c.y) * k;
      bulle.style.left = Math.max(0, Math.min(W * k - bw, X - bw / 2)) + 'px';
      bulle.style.top = (Y - bh - 12 < 0 ? Y + 14 : Y - bh - 12) + 'px';
    };
    svg.addEventListener('pointerdown', (e) => { const c = proche(e, 22); if (c) g.montrer(c); else g.cacher(); });
    svg.addEventListener('pointermove', (e) => { if (e.pointerType !== 'mouse' || e.buttons) return; const c = proche(e, 14); if (c) g.montrer(c); else g.cacher(); });
    svg.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') g.cacher(); });
    return g;
  }

  /* Pastille de légende, dans le SVG (les couleurs restent dans le radar). */
  function pastilleSvg(parent, it, x, y) {
    const c = it.c || ENC, m = it.sw ? it.sw / 2 : 5;
    if (it.t === 'zone') sv('rect', { x, y: y - 5, width: 16, height: 10, rx: 2, fill: ZONE_F, stroke: ZONE_T }, parent);
    else if (it.t === 'plein') sv('rect', { x: x + 1, y: y - 4, width: 14, height: 8, rx: 2, fill: c, 'fill-opacity': 0.3, stroke: c, 'stroke-width': T_SUJET }, parent);
    else if (it.t === 'contour') sv('rect', { x: x + 1, y: y - 4, width: 14, height: 8, rx: 2, fill: 'none', stroke: c, 'stroke-width': T_REPERE }, parent);
    else if (it.t === 'point' || it.t === 'rond') sv('circle', { cx: x + m, cy: y, r: it.r || 4.5, fill: c }, parent);
    else if (it.t === 'creux') sv('circle', { cx: x + m, cy: y, r: it.r || 4, fill: '#fff', stroke: c, 'stroke-width': 1.6 }, parent);
    else if (it.t === 'anneau') sv('path', { d: `M${x + 1},${y + 5}A${it.r},${it.r} 0 0 1 ${x + 1 + it.r},${y + 5 - it.r}`, fill: 'none', stroke: GRIS, 'stroke-width': 1.5 }, parent);
    else if (it.t === 'centre') {
      sv('circle', { cx: x + 5, cy: y, r: 3.5, fill: '#fff', stroke: LEG, 'stroke-width': 1.5 }, parent);
      sv('rect', { x: x + 12, y: y - 5, width: 16, height: 10, rx: 2, fill: '#fff', stroke: '#d2d2d2' }, parent);
      sv('path', { d: `M${x + 13},${y + 4}L${x + 19},${y - 4}M${x + 17},${y + 4}L${x + 23},${y - 4}M${x + 21},${y + 4}L${x + 27},${y - 4}`, stroke: '#c4c4c4', 'stroke-width': 1.2 }, parent);
    }
  }
  /* D66 : l'échelle hors du dessin, en clé. Intensité : un arc par anneau, du plus petit au plus
     grand, chacun suivi de son nom. Citations : le sommet creux (cité) et plein (marqué). */
  const CLE_I = { t: 'cle', parts: [{ t: 'anneau', r: 5, mot: 'faible' }, { t: 'anneau', r: 8, mot: 'moyen' }, { t: 'anneau', r: 11, mot: 'marqué' }] };
  const cleC = (c) => ({ t: 'cle', parts: [{ t: 'creux', c, r: 3.5, mot: 'cité' }, { t: 'rond', c, r: 4, mot: 'marqué' }] });

  /* La zone du style : un fond gris jusqu'au haut (un anneau si le bas dépasse 0). */
  function zone(g, bas, haut) {
    const z = sv('g', { 'data-serie': 'zone', 'data-valeurs': haut.join(','), fill: 'none' }, g.C.zone);
    sv('path', { d: g.ligne(haut) + (bas.some((v) => v > 0) ? g.ligne(bas) : ''), 'fill-rule': 'evenodd', fill: ZONE_F, stroke: ZONE_T, 'stroke-width': 1 }, z);
  }
  /* Les familles sans donnée (D62, D65) : secteur hachuré léger et marque creuse sur l'axe. */
  function inconnus(g, fams, mots) {
    if (!fams.length) return;
    const pid = g.id + '-hachure';
    const pat = sv('pattern', { id: pid, width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, g.defs);
    sv('line', { x1: 0, y1: 0, x2: 0, y2: 6, stroke: 'rgba(0,0,0,0.16)', 'stroke-width': 1.2 }, pat);
    const rb = g.R * Math.cos(g.pas / 2), pt = (a, rr) => f1(Math.sin(a) * rr) + ',' + f1(-Math.cos(a) * rr);
    for (const f of fams) {
      const k = g.axes.indexOf(f), a = k * g.pas;
      sv('path', { d: 'M0,0L' + pt(a - g.pas / 2, rb) + 'L' + pt(a, g.R) + 'L' + pt(a + g.pas / 2, rb) + 'Z', fill: 'url(#' + pid + ')', 'data-inconnu': f }, g.C.inconnu);
      g.marque(g.P(k, 0), { ...creux(LEG, 3.5), 'stroke-width': 1.5, 'data-inconnu': f }, [h('b', {}, nomF(f)), ' : ' + mots + ', inconnu (ce n\'est pas zéro), posé au centre']);
    }
  }
  /* Une série : polygone fermé, plein translucide (sujet) ou en contour (repère). */
  function serie(g, s) {
    const e = sv('g', { 'data-serie': s.nom, 'data-valeurs': s.valeurs.map((v) => (v == null ? 0 : v)).join(','), 'data-couleur': s.couleur, fill: 'none' }, g.C.series);
    const p = sv('path', { d: g.ligne(s.valeurs), fill: s.plein ? s.couleur : 'none', 'fill-opacity': s.plein ? OP : null, stroke: s.couleur, 'stroke-width': s.plein ? T_SUJET : T_REPERE, 'stroke-linejoin': 'round' }, e);
    s.maj = (vals) => p.setAttribute('d', g.ligne(vals));
    s.g = e;
    return s;
  }
  /* Ma visée (posée par une direction ou un geste) : un losange creux sur l'axe, sous les sommets. */
  function visees(g) {
    for (const f of Object.keys(ETAT.viseeAbs || {})) {
      const k = g.axes.indexOf(f);
      if (k < 0) continue;
      const v = ETAT.viseeAbs[f], p = g.P(k, v);
      sv('path', { d: losange(p.map((x) => +f1(x)), 6), fill: '#fff', stroke: ENC, 'stroke-width': 1.5 }, g.C.visees);
      g.cibles.push({ x: p[0], y: p[1], mots: [h('b', {}, nomF(f)), ' : visée ' + motsNiveau(v)] });
    }
  }
  const ANNEAUX_I = [1, 2, 3], ANNEAUX_C = [1, 2];

  /* Ma bière (objets 1 et 2) : la zone du style en fond gris, ma bière pleine, l'orangé sur le seul
     sommet au-dessus du style, les familles attendues du style en gras. */
  function donneesBiere() {
    const axes = ROUE;
    const val = axes.map((f) => (D.continu.biere[fi(f)] != null ? D.continu.biere[fi(f)] : null));
    const bas = axes.map((f) => D.continu.cible[fi(f)].bas), haut = axes.map((f) => D.continu.cible[fi(f)].haut);
    return { axes, hors: axes.filter((f, k) => val[k] == null), val, bas, haut,
      deg: axes.map((f) => D.profil[fi(f)].source === 'dégustation'), dessus: axes.map((f, k) => val[k] != null && val[k] > haut[k] + 0.05) };
  }
  const position = (b, k, v) => {
    if (v > b.haut[k] + 0.05) { const e = D.continu.ecart[fi(b.axes[k])]; return 'au-dessus du style' + (e ? ' (' + e + ')' : ''); }
    return v < b.bas[k] - 0.05 ? 'sous le style' : 'dans le style';
  };
  function biere(cont) {
    const b = donneesBiere();
    const g = radar(cont, {
      objet: 'biere-cible', min: -1, max: 3, anneaux: ANNEAUX_I, deborde: 12, colonne: true, Hmin: 515,
      libelle: (f, k) => ({ gras: D.attendues.includes(f), inconnu: b.val[k] == null }),
      legende: [{ t: 'zone', texte: 'zone du style' }, { t: 'plein', c: MOI, texte: 'ma bière' },
        b.dessus.some(Boolean) ? { t: 'point', c: ACC, texte: 'au-dessus du style' } : null, CLE_I,
        b.hors.length ? { t: 'centre', texte: 'au centre : non situé, ' + INCONNU } : null],
      label: 'Radar de ma bière face à la zone du style, intensité de 0 à 3 ; ' + (b.dessus.some(Boolean) ? 'au-dessus du style : ' + b.axes.filter((f, k) => b.dessus[k]).map((f) => nomF(f).toLowerCase()).join(', ') + ' ; ' : '') + 'au centre, les familles non situées : inconnues, pas à zéro',
    });
    zone(g, b.bas, b.haut);
    inconnus(g, b.hors, 'non situé');
    serie(g, { nom: 'ma bière', valeurs: b.val, couleur: MOI, plein: true });
    const src = (k) => (b.deg[k] ? 'dégusté' + (D.degustation ? ' le ' + D.degustation.date : '') : 'prévu');
    visees(g);
    b.val.forEach((v, k) => {
      if (v == null) return;
      g.marque(g.P(k, v), b.dessus[k] ? plein(ACC, 5) : plein(MOI, 4), [h('b', {}, nomF(b.axes[k])), ' : ' + motsNiveau(v) + ', ' + position(b, k, v) + ' · ' + src(k)]);
    });
  }

  /* Suggestions (objet 4) : l'avant en contour plein, l'après d'une voie plein ; puces ou balayage
     du radar pour passer d'une voie à l'autre (la silhouette suit le doigt, un ressort finit le
     passage). Là où le moteur n'établit pas d'effet, l'après recopie l'avant, petit sommet.
     Ni zone ni orangé dans la légende (budget de mots de la page) ; jamais d'orangé sur une voie
     (D40). */
  function apresDe(v, b) {
    const etabli = b.axes.map((f) => v.apresC[fi(f)] != null);
    return { etabli, valeurs: b.axes.map((f, k) => (etabli[k] ? v.apresC[fi(f)] : b.val[k])) };
  }
  function voies(cont, ctx, redraw) {
    const vs = ctx.marq.length ? ctx.marq : ctx.liste.filter((v) => !v.nouvelle).slice(0, 1);
    if (!vs.length) return;
    if (!vs.some((v) => v.rang === ETAT.voieRadar)) ETAT.voieRadar = vs[0].rang;
    const i = vs.findIndex((v) => v.rang === ETAT.voieRadar);
    const b = donneesBiere();
    const A = vs.map((v) => apresDe(v, b));
    const titre = (v) => (v.cles.length ? nomsHoublons(v.houblons) : v.houblons.join(' + '));
    const nomV = (v) => 'après ' + v.houblons.join(' + ');
    if (vs.length > 1) {
      cont.append(h('div', { class: 'chips puces-v', role: 'group', 'aria-label': 'Voie montrée sur le radar (ou balayer le radar)' }, vs.map((v, k) => h('button', {
        class: 'chip', 'aria-pressed': String(k === i), 'data-k': 'pv' + v.rang, 'data-booster': k === (i + 1) % vs.length ? 'voie suivante' : null,
        'aria-label': 'Montrer la voie ' + v.label, onclick: () => aller(k),
      }, titre(v)))));
    }
    const a = A[i];
    const inconnue = (k) => b.val[k] == null && a.valeurs[k] == null;
    const hors = b.axes.filter((f, k) => inconnue(k));
    // Légende courte (budget de mots de la page) : la puce allumée dit déjà quelle voie est l'après.
    const g = radar(cont, {
      objet: 'voies', min: -1, max: 3, anneaux: ANNEAUX_I, deborde: 12, Hmin: 0, Hmax: 430,
      libelle: (f, k) => ({ gras: D.attendues.includes(f), inconnu: inconnue(k) }),
      legende: [{ t: 'contour', c: AVANT, texte: 'avant' }, { t: 'plein', c: MOI, texte: 'après' }, CLE_I, hors.length ? { t: 'centre', texte: INCONNU } : null],
      label: 'Radar des voies : l\'avant en contour, ' + nomV(vs[i]) + ' plein, dans la zone du style en gris ; au centre, les familles non situées, inconnues et pas à zéro' + (vs.length > 1 ? ' ; balayer pour passer à la voie suivante' : ''),
    });
    zone(g, b.bas, b.haut);
    inconnus(g, hors, 'non situé');
    const sV = serie(g, { nom: nomV(vs[i]), valeurs: a.valeurs, couleur: MOI, plein: true });
    serie(g, { nom: 'avant', valeurs: b.val, couleur: AVANT, plein: false });
    visees(g);
    const mV = sv('g', {}, g.C.marques);
    const motsApres = (k, v) => {
      const av = b.val[k], f = b.axes[k];

    h('div', { class: 'f-replis', role: 'group', 'aria-label': 'Détail de la fiche' }, SECTIONS.map(([id, titre], n) => h('button', {
      class: 'f-repli', 'aria-expanded': String(FICHE.sec === id), 'data-k': 'fr' + id, 'data-booster': n === 0 ? 'repli de la fiche' : null,
      'aria-label': (FICHE.sec === id ? 'Replier ' : 'Déplier ') + titre.toLowerCase(), onclick: (e) => { e.stopPropagation(); FICHE.sec = FICHE.sec === id ? null : id; construireFiche(true); },
    }, titre))),
    sec ? h('section', { class: 'f-sec', 'aria-label': sec[1] }, ...sec[2](F).filter(Boolean)) : null,
  ];
}

/* ---------- Contenant : feuille du bas au téléphone, bulle à côté de la colonne à l'ordinateur ---------- */
function construireFiche(versSection) {
  const cle = FICHE.cle, F = D.fichesH[cle];
  if (!F) return;
  const ancien = FICHE.racine.querySelector('.f-fiche');
  const defil = ancien ? ancien.scrollTop : 0;
  const fe = h('section', { class: 'f-fiche f-' + FICHE.mode, 'data-role': 'fiche', role: 'dialog', tabindex: '-1', 'aria-modal': FICHE.mode === 'feuille' ? 'true' : null, 'aria-label': 'Fiche de ' + F.nom },
    FICHE.mode === 'feuille' ? h('div', { class: 'f-poignee', 'aria-hidden': 'true' }) : null,
    h('div', { class: 'f-corps' }, tete(F, cle), blocAlpha(F), tableMoments(F, cle), blocArome(F), blocActions(F, cle), ...blocReplis(F)));
  const voile = FICHE.mode === 'feuille' ? h('div', { class: 'f-voile', 'aria-hidden': 'true', onclick: () => fermerFiche() }) : null;
  FICHE.racine.replaceChildren(...[voile, fe].filter(Boolean));
  if (FICHE.mode === 'feuille') { placerFeuille(fe); poigneeFeuille(fe); } else placerBulle(fe);
  fe.scrollTop = defil;
  if (versSection) { const s = fe.querySelector('.f-sec'); if (s) s.scrollIntoView({ block: 'nearest' }); }
  marquerSource();
}
/* La feuille prend la hauteur de son contenu, sous le résumé au plus haut : au-dessus, l'étape reste
   lisible (en-tête, résumé IBU, la ligne du houblon). Ce qu'elle couvre est masqué. */
function placerFeuille(fe) {
  fe.style.top = 'auto';
  const hC = fe.getBoundingClientRect().height;
  const res = document.querySelector('#app .resume');
  const min = res ? Math.round(res.getBoundingClientRect().bottom) + 6 : 80;
  const top = FICHE.sec ? min : Math.max(min, Math.round(innerHeight - hC));
  fe.style.top = top + 'px';
  masquerSous(top);
}
function masquerSous(top) {
  demasquer();
  const rangs = [...document.querySelectorAll('#app > *')].flatMap((e) => (e.matches('.frise, .partie, .ajouts') ? [...e.children].flatMap((c) => (c.matches('ul') ? [...c.children] : [c])) : [e]));
  for (const r of rangs) { if (r.matches('.axe')) continue; const b = r.getBoundingClientRect(); if (b.height && b.bottom > top - 4) r.classList.add('sous-fiche'); }
}
function demasquer() { for (const e of document.querySelectorAll('.sous-fiche')) e.classList.remove('sous-fiche'); }
/* Tirer la poignée vers le bas ferme la feuille. */
function poigneeFeuille(fe) {
  const p = fe.querySelector('.f-poignee');
  let y0 = null;
  p.addEventListener('pointerdown', (e) => { y0 = e.clientY; try { p.setPointerCapture(e.pointerId); } catch (x) { /* rien */ } });
  p.addEventListener('pointermove', (e) => { if (y0 != null) fe.style.transform = 'translateY(' + Math.max(0, e.clientY - y0) + 'px)'; });
  p.addEventListener('pointerup', (e) => { if (y0 == null) return; const d = e.clientY - y0; y0 = null; fe.style.transform = ''; if (d > 80) fermerFiche(); });
  p.addEventListener('pointercancel', () => { y0 = null; fe.style.transform = ''; });
}
/* À l'ordinateur : à droite de la colonne de l'étape (elle reste lisible), sinon à gauche. */
function placerBulle(fe) {
  const col = document.getElementById('app').getBoundingClientRect();
  const r = FICHE.source && FICHE.source.isConnected ? FICHE.source.getBoundingClientRect() : { top: 80 };
  const w = fe.offsetWidth, hh = fe.offsetHeight;
  let x = col.right + 16;
  if (x + w > innerWidth - 8) x = col.left - w - 16;
  if (x < 8) x = Math.max(8, innerWidth - w - 8);
  fe.style.left = x + 'px';
  fe.style.top = Math.max(8, Math.min(innerHeight - hh - 8, r.top - 60)) + 'px';
}
/* La ligne d'où vient la fiche reste repérée au-dessus de la feuille. */
function marquerSource() {
  for (const e of document.querySelectorAll('.f-source')) e.classList.remove('f-source');
  const n = [...document.querySelectorAll('#app [data-houblon="' + FICHE.cle + '"]')].find((e) => e.getClientRects().length && !e.closest('.sous-fiche'));
  const c = n && n.closest('.corps-b, .rapide, .voie, .col, .pm, .chip');
  if (c) c.classList.add('f-source');
}
function ouvrirFiche(cle, o) {
  if (!D.fichesH[cle]) return;
  const deja = FICHE.cle != null;
  if (FICHE.cle !== cle) FICHE.sec = null;
  FICHE.cle = cle; FICHE.source = o.source || null; FICHE.mode = o.mode;
  if (!deja) FICHE.epingle = !!o.epingle;
  clearTimeout(FICHE.tFerme);
  construireFiche();
  const fe = FICHE.racine.querySelector('.f-fiche');
  if (!deja && o.anim !== false && !REDUIT) fe.animate(FICHE.mode === 'feuille' ? [{ transform: 'translateY(40%)' }, { transform: 'none' }] : [{ opacity: 0, transform: 'scale(.97)' }, { opacity: 1, transform: 'none' }], { duration: 200, easing: 'cubic-bezier(.2,.8,.2,1)' });
  // Au clavier, le focus va au bouton Fermer ; au doigt, rien ne prend le focus (D33).
  if (ETAT.clavier) { const b = fe.querySelector('[data-role="fermer-fiche"]'); if (b) b.focus({ preventScroll: true }); }
}
function fermerFiche() {
  if (FICHE.cle == null) return;
  const src = FICHE.source;
  FICHE.cle = null; FICHE.epingle = false; FICHE.sec = null;
  clearTimeout(FICHE.tFerme);
  FICHE.racine.replaceChildren();
  demasquer();
  for (const e of document.querySelectorAll('.f-source')) e.classList.remove('f-source');
  if (ETAT.clavier && src && src.isConnected) { const f = src.closest('button, [tabindex]'); if (f) f.focus({ preventScroll: true }); }
}
/* Après un rendu de l'écran (un moment touché, un ajout, un goût) : la fiche suit l'état. */
function ficheApresRendu() { if (FICHE.cle != null && FICHE.racine) construireFiche(); }
function planifierFermeture(ms) { clearTimeout(FICHE.tFerme); FICHE.tFerme = setTimeout(() => { if (!FICHE.epingle) fermerFiche(); }, ms); }

/* ---------- Gestes : appui long (doigt), survol long (souris), clavier ---------- */
/* D49 : « La zone de trigger est que le nom alors que ça devrait être la fiche entière... » : tout nom
   de houblon, et toute la carte d'un houblon (ligne de la recette, ajout proposé) hors de ses
   commandes (−/+, type, ×, cœur, poignée de glissement), qui gardent leur toucher court. */
const CARTE_H = '[data-role="ligne-houblon"], [data-role="ajout-rapide"]';
const COMMANDE_H = 'button, input, select, textarea, a, [role="button"], [data-action], [data-role="glisser-moment"], [data-role="type-ajout"], [data-role="gout"]';
function zoneHoublon(t) {
  if (!t || !t.closest || (FICHE.racine && FICHE.racine.contains(t))) return null;
  const e = t.closest('[data-houblon]');
  if (e) {
    if (!D.fichesH[e.getAttribute('data-houblon')]) return null;
    const c = e.closest(CARTE_H);
    return { el: e, zone: c && !c.closest('[data-glisse]') ? c : e };
  }
  const c = t.closest(CARTE_H);
  if (!c || c.closest('[data-glisse]')) return null;
  const cmd = t.closest(COMMANDE_H);
  if (cmd && cmd !== c && c.contains(cmd)) return null;
  const n = c.querySelector('[data-houblon]');
  return n && D.fichesH[n.getAttribute('data-houblon')] ? { el: n, zone: c } : null;
}
function houblonSous(t) { const z = zoneHoublon(t); return z ? z.el : null; }
let APPUI = null, AVALE = 0;
// Après un appui long, le clic qui suit le lâcher n'agit pas (ajout, case à cocher, ni le voile de
// la fiche qui vient de s'ouvrir sous le doigt) ; un nouveau toucher remet AVALE à zéro.
document.addEventListener('click', (e) => { if (performance.now() < AVALE) { e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('contextmenu', (e) => { if ((APPUI && APPUI.type !== 'mouse') || performance.now() < AVALE) e.preventDefault(); });
function annulerAppui() { const a = APPUI; APPUI = null; if (a) { clearTimeout(a.timer); a.el.classList.remove('appui'); } }
document.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  AVALE = 0;
  if (FICHE.racine && FICHE.racine.contains(e.target)) { if (FICHE.mode === 'bulle') FICHE.epingle = true; return; }
  if (FICHE.cle != null && FICHE.mode === 'bulle') fermerFiche();
  if (APPUI) annulerAppui();
  const el = houblonSous(e.target);
  if (!el) return;
  const a = { el, cle: el.getAttribute('data-houblon'), x: e.clientX, y: e.clientY, id: e.pointerId, type: e.pointerType, actif: false };
  APPUI = a;
  el.classList.add('appui');
  a.timer = setTimeout(() => {
    if (APPUI !== a) return;
    a.actif = true; AVALE = performance.now() + 15000; vibrer();
    el.classList.remove('appui');
    ouvrirFiche(a.cle, { source: el, mode: a.type === 'mouse' || innerWidth >= 700 ? 'bulle' : 'feuille' });
  }, APPUI_MS);
}, true);
document.addEventListener('pointermove', (e) => { if (APPUI && e.pointerId === APPUI.id && !APPUI.actif && Math.hypot(e.clientX - APPUI.x, e.clientY - APPUI.y) > 10) annulerAppui(); }, true);
function relacher() { const a = APPUI; if (!a) return; if (!a.actif) { annulerAppui(); return; } APPUI = null; AVALE = performance.now() + 400; }
document.addEventListener('pointerup', (e) => { if (APPUI && e.pointerId === APPUI.id) relacher(); }, true);
document.addEventListener('pointercancel', (e) => { if (APPUI && e.pointerId === APPUI.id && !APPUI.actif) annulerAppui(); }, true);
document.addEventListener('touchend', () => { if (APPUI && APPUI.actif) relacher(); }, true);
// Une fois la fiche ouverte sous le doigt, le doigt ne fait pas défiler l'étape.
document.addEventListener('touchmove', (e) => { if (APPUI && APPUI.actif) e.preventDefault(); }, { passive: false });

let SURVOL = null;
function finSurvol() { if (SURVOL) { clearTimeout(SURVOL.timer); SURVOL.el.classList.remove('survol'); SURVOL = null; } }
document.addEventListener('pointerover', (e) => {
  if (e.pointerType !== 'mouse') return;
  if (FICHE.racine && FICHE.racine.contains(e.target)) { clearTimeout(FICHE.tFerme); return; }
  const z = zoneHoublon(e.target);
  // Sur une commande de la carte (−/+, type, ×, cœur, poignée), le survol long s'arrête.
  if (!z) { if (SURVOL && SURVOL.zone.contains(e.target)) finSurvol(); return; }
  if (SURVOL && SURVOL.el === z.el && SURVOL.zone === z.zone) return;
  finSurvol();
  const el = z.el, cle = el.getAttribute('data-houblon');
  if (FICHE.cle === cle) { clearTimeout(FICHE.tFerme); SURVOL = { el, zone: z.zone }; return; }
  el.classList.add('survol');
  SURVOL = { el, zone: z.zone, timer: setTimeout(() => { el.classList.remove('survol'); if (FICHE.mode === 'feuille' && FICHE.cle != null) return; ouvrirFiche(cle, { source: el, mode: 'bulle' }); }, SURVOL_MS) };
});
document.addEventListener('pointerout', (e) => {
  if (e.pointerType !== 'mouse') return;
  const vers = e.relatedTarget;
  if (SURVOL && SURVOL.zone.contains(e.target) && !(vers && SURVOL.zone.contains(vers))) finSurvol();
  if (FICHE.cle != null && FICHE.mode === 'bulle' && !FICHE.epingle) {
    const hv = vers && houblonSous(vers);
    if (!(vers && FICHE.racine.contains(vers)) && !(hv && hv.getAttribute('data-houblon') === FICHE.cle)) planifierFermeture(650);
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && FICHE.cle != null) { e.preventDefault(); fermerFiche(); return; }
  // Clavier : la touche Menu (ou Maj+F10) sur un élément qui nomme un houblon ouvre sa fiche.
  if (e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10')) {
    const a = document.activeElement, el = a && (houblonSous(a) || (a.querySelector && a.querySelector('[data-houblon]')));
    if (el && D.fichesH[el.getAttribute('data-houblon')]) { e.preventDefault(); ouvrirFiche(el.getAttribute('data-houblon'), { source: el, mode: innerWidth >= 700 ? 'bulle' : 'feuille', epingle: true }); }
  }
});
addEventListener('resize', () => { if (FICHE.cle != null) construireFiche(); });

/* Démarrage : la racine de la fiche, puis la fiche demandée par la page (fiche.html : Nugget). */
const demarrerSansFiche = demarrer;
demarrer = function () {
  FICHE.racine = h('div', { id: 'fiche-racine' });
  document.body.append(FICHE.racine);
  demarrerSansFiche();
  const init = document.body.dataset.ficheInit;
  if (init && D.fichesH[init]) ouvrirFiche(init, { source: document.querySelector('#app [data-houblon="' + init + '"]'), mode: innerWidth >= 700 ? 'bulle' : 'feuille', anim: false, epingle: true });
};

demarrer();
</script>
</body>
</html>
