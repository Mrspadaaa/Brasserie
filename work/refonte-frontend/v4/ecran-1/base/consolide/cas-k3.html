<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Houblons, rail du brassage</title>
<style>
  :root { --encre: #111; --gris: #555; --gris2: #6e6e6e; --trait: #d4d4d4; --fond: #f5f5f5; --fond2: #ebebeb; --acc: #c2410c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; color: var(--encre); }
  body { font: 400 14px/1.2 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  button, input, output { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; min-height: 24px; min-width: 24px; }
  ul { list-style: none; }
  :focus-visible { outline: 2px solid var(--encre); outline-offset: 2px; }
  .ecran { width: 100%; max-width: 390px; margin: 0 auto; padding: 8px 16px 10px; display: flex; flex-direction: column; gap: 6px; overflow-x: hidden; }
  .p { font-size: 12px; }
  .gris { color: var(--gris2); }
  .num { font-variant-numeric: tabular-nums; }

  /* En-tête de l'étape */
  .barre { display: flex; align-items: center; gap: 8px; height: 32px; }
  .retour { width: 28px; height: 28px; position: relative; }
  .retour::before { content: ''; position: absolute; left: 10px; top: 9px; width: 9px; height: 9px; border-left: 2px solid var(--encre); border-bottom: 2px solid var(--encre); transform: rotate(45deg); }
  h1 { font-size: 19px; font-weight: 650; }
  .etape { color: var(--gris2); }
  .style { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 10px; border: 1px solid var(--trait); border-radius: 14px; }
  .badge { font-size: 12px; padding: 2px 7px; border-radius: 10px; background: var(--fond2); color: var(--gris); }

  /* Résumé de la recette, comme l'étape Malts */
  .resume { display: flex; align-items: center; justify-content: space-between; height: 40px; padding: 0 12px; border: 1px solid var(--trait); border-radius: 20px; flex: none; }
  .resume > div { display: flex; align-items: baseline; gap: 4px; }
  .resume b, .resume output { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .cle { font-size: 12px; color: var(--gris2); }
  .ibu-bloc { position: relative; }
  .delta { position: absolute; left: 30px; top: -12px; font-size: 12px; font-weight: 600; }
  .jauge { position: relative; display: inline-block; width: 52px; height: 8px; margin-left: 4px; align-self: center; border-radius: 4px; background: #e4e4e4; }
  .jauge .bde { position: absolute; left: 25%; width: 50%; top: 0; bottom: 0; background: #b9b9b9; }
  .jauge .rep { position: absolute; top: -3px; width: 3px; height: 14px; margin-left: -1.5px; background: var(--encre); border-radius: 1px; }
  .jauge.hors .rep { background: var(--acc); }
  .note-acc { color: var(--acc); font-weight: 600; }
  .note-ibu { display: flex; flex-direction: column; gap: 2px; padding: 6px 0 2px; border-radius: 10px; }

  /* Éléments communs d'une ligne d'ajout */
  .tag { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px; border: 1px solid var(--trait); border-radius: 13px; background: #fff; white-space: nowrap; }
  .tourne::after { content: '⟳'; font-size: 12px; color: var(--gris2); display: inline-block; }
  .tourne.roule::after { animation: tour 150ms ease-out; }
  @keyframes tour { from { transform: rotate(-180deg); } }
  .type { font-size: 12px; }
  .pas { display: inline-flex; align-items: center; gap: 2px; margin-left: auto; flex: none; }
  .moins, .plus { width: 26px; height: 26px; border-radius: 13px; border: 1px solid var(--trait); background: #fff; position: relative; }
  .moins::before, .plus::before, .plus::after { content: ''; position: absolute; left: 7px; top: 11.5px; width: 10px; height: 1.6px; background: var(--encre); }
  .plus::after { transform: rotate(90deg); }
  .dose { min-width: 44px; text-align: center; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .corbeille { width: 26px; height: 26px; position: relative; flex: none; }
  .corbeille::before, .corbeille::after { content: ''; position: absolute; left: 7px; top: 12px; width: 12px; height: 1.6px; background: var(--gris2); transform: rotate(45deg); }
  .corbeille::after { transform: rotate(-45deg); }
  .l2 { display: flex; align-items: center; gap: 6px; font-size: 12px; min-height: 20px; }
  .st { font-size: 12px; font-weight: 400; color: var(--gris2); white-space: nowrap; }
  .alpha { font-size: 12px; font-weight: 650; color: var(--encre); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .role { font-size: 12px; color: var(--gris2); white-space: nowrap; }
  .ic-stock { width: 10px; height: 10px; border-radius: 5px; border: 1.5px solid #9a9a9a; flex: none; display: inline-block; position: relative; }
  .ic-manque { border-style: dashed; }
  .ic-a-racheter::after { content: ''; position: absolute; left: 2px; top: 2px; width: 3px; height: 3px; border-radius: 2px; background: #9a9a9a; }
  .ic-a-acheter { border-radius: 2px; }
  .pt-manque { width: 8px; height: 8px; border-radius: 4px; border: 1.5px dashed var(--gris2); flex: none; }
  .cite { height: 20px; padding: 0 7px; border: 1px solid var(--acc); color: var(--acc); border-radius: 10px; font-weight: 600; display: inline-flex; align-items: center; white-space: nowrap; }
  .effet { height: 20px; padding: 0 7px; border: 1px solid var(--encre); border-radius: 10px; display: inline-flex; align-items: center; white-space: nowrap; font-weight: 600; }
  .effet.ne { border-style: dashed; border-color: var(--gris2); color: var(--gris); font-weight: 400; }
  .ibu-l { margin-left: auto; color: var(--gris); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .bio { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--gris); }
  .bio { flex-wrap: wrap; }
  .bio .quand-bio { font-weight: 650; color: var(--encre); }
  .sigs { display: flex; flex-wrap: wrap; gap: 4px; }
  .sig { padding: 2px 7px; border: 1px solid var(--gris2); border-radius: 10px; white-space: nowrap; }
  .sig.ne { border-style: dashed; }
  .mini { display: inline-flex; gap: 1px; align-items: center; flex: none; }
  .mini .c { width: 5px; height: 10px; border-radius: 1px; background: #e6e6e6; }
  .mini .c.ci { background: #ababab; }
  .mini .c.m { background: #3d3d3d; }
  .mini .c.acc.ci { background: var(--acc); opacity: .55; }
  .mini .c.acc.m { background: var(--acc); }
  .mini .c.sep { margin-left: 3px; }

  /* Ajout en un toucher */
  .rapides { display: flex; flex-direction: column; gap: 4px; }
  .rapide-l { display: flex; align-items: center; gap: 4px; }
  .rapide { flex: 1; min-width: 0; min-height: 44px; display: flex; align-items: center; gap: 7px; padding: 3px 8px 3px 5px; border-radius: 10px; background: var(--fond); text-align: left; }
  .rapide .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .rapide .r1, .rapide .r2 { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .rapide .r1 .st { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .rapide b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 48px; }
  .rapide .r2 .mini { margin-left: auto; }
  .dose-r { font-size: 12px; color: var(--gris); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .dose-r.fl::after { content: ' →'; }
  .col-ibu { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: none; min-width: 60px; }
  .ic-levure { width: 14px; height: 14px; border-radius: 7px; border: 1.5px solid var(--gris2); position: relative; flex: none; }
  .ic-levure::after { content: ''; position: absolute; left: 6px; top: 2px; width: 4px; height: 4px; border-radius: 2px; background: var(--gris2); }
  .rapide .qte { font-size: 12px; color: var(--gris2); white-space: nowrap; }
  .rapide .plus-ibu { font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .plus-i { width: 22px; height: 22px; border-radius: 11px; background: var(--encre); position: relative; flex: none; }
  .plus-i::before, .plus-i::after { content: ''; position: absolute; left: 6px; top: 10.2px; width: 10px; height: 1.6px; background: #fff; }
  .plus-i::after { transform: rotate(90deg); }
  .gout { width: 28px; height: 28px; flex: none; border-radius: 14px; position: relative; color: var(--gris2); }
  .gout::before { content: '♡'; font-size: 14px; line-height: 28px; }
  .gout.aime::before { content: '♥'; color: var(--encre); }
  .voie, .rapide-l { position: relative; }
  .voie .gout-choix, .rapide-l .gout-choix { position: absolute; right: 34px; top: 50%; transform: translateY(-50%); z-index: 2; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .gout-choix { display: inline-flex; gap: 2px; padding: 2px; border-radius: 14px; background: var(--fond2); flex: none; }
  .gout-choix button { height: 26px; padding: 0 8px; border-radius: 13px; font-size: 12px; }
  .gout-choix button[aria-pressed="true"] { background: #fff; font-weight: 650; }
  .seg { display: inline-flex; padding: 2px; border-radius: 15px; background: var(--fond2); flex: none; }
  .seg button { height: 26px; padding: 0 11px; border-radius: 13px; font-size: 12px; color: var(--gris); }
  .seg button[aria-checked="true"], .seg button[aria-selected="true"] { background: #fff; color: var(--encre); font-weight: 650; box-shadow: 0 1px 2px rgba(0,0,0,.18); }
  .champ input { width: 100%; height: 36px; padding: 0 12px; border: 1px solid var(--trait); border-radius: 10px; background: #fff; font-size: 14px; }
  .champ input::placeholder { color: var(--gris2); }
  /* Champ de saisie : le focus se voit par sa bordure, sans contour (D33). */
  .champ input:focus, .champ input:focus-visible { outline: none; border-color: var(--encre); box-shadow: 0 0 0 1px var(--encre); }
  .rangee { display: flex; align-items: center; gap: 8px; min-height: 30px; }
  .levure { display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px; border-radius: 10px; background: var(--fond); white-space: nowrap; overflow: hidden; flex: 1 1 auto; }
  .levure .cle { margin-right: 2px; }
  .goutsl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; }
  .goutsl button { height: 24px; padding: 0 8px; border-radius: 12px; border: 1px dashed var(--gris2); }

  /* Ligne qui résume ma bière face à la cible et ouvre le panneau */
  .pan { display: flex; flex-direction: column; gap: 3px; width: 100%; text-align: left; padding: 6px 0 0; border-top: 1px solid var(--trait); }
  .pan .r1, .pan .r2 { display: flex; align-items: center; gap: 6px; min-height: 24px; width: 100%; }
  .exc { color: var(--acc); font-weight: 650; }
  .exc::before { content: ''; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 4px; background: var(--acc); vertical-align: 1px; }
  .ouvrir { margin-left: auto; width: 34px; height: 26px; border-radius: 13px; background: var(--encre); position: relative; flex: none; }
  .ouvrir::after { content: ''; position: absolute; left: 12px; top: 9px; width: 7px; height: 7px; border-right: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg); }
  .cpt { color: var(--gris); white-space: nowrap; }
  .cpt + .cpt::before { content: '·'; margin-right: 6px; color: var(--gris2); }
  svg { display: block; }
  svg text { font-family: inherit; }

  /* Panneau : onglets des trois parties, lentille, tableaux */
  .tete { display: flex; align-items: center; gap: 8px; height: 36px; }
  .onglets { flex: 1; display: flex; padding: 2px; border-radius: 16px; background: var(--fond2); }
  .onglets button { flex: 1; height: 30px; border-radius: 14px; color: var(--gris); white-space: nowrap; }
  .onglets button[aria-selected="true"] { background: #fff; color: var(--encre); font-weight: 650; box-shadow: 0 1px 2px rgba(0,0,0,.18); }
  .partie { display: flex; flex-direction: column; gap: 6px; }
  .bloc-lecture { display: flex; flex-direction: column; gap: 6px; }
  .tete-f { display: grid; grid-template-columns: 84px 1fr 52px; align-items: end; column-gap: 8px; min-height: 18px; }
  .graduations { grid-column: 2; display: flex; justify-content: space-between; font-size: 12px; color: var(--gris2); }
  .graduations span { flex: 1; text-align: center; }
  .graduations.gr-style span:last-child { flex: 0 0 18%; white-space: nowrap; }
  .graduations.gr-style span:first-child { flex: 0 0 80%; }
  .legende-f { display: flex; gap: 6px; flex-wrap: wrap; }
  .legende-f span { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--trait); border-radius: 14px; font-size: 12px; color: var(--gris); }
  .legende-f i { width: 10px; height: 10px; border-radius: 5px; border: 2px solid var(--encre); }
  .legende-f .pt-deg { background: var(--encre); }
  .legende-f .pt-ns { border: 1.5px dashed #8a8a8a; }
  .familles { display: flex; flex-direction: column; }
  .fam { display: grid; grid-template-columns: 84px 1fr 52px; align-items: center; column-gap: 8px; min-height: 40px; padding: 0 2px; border-radius: 10px; cursor: pointer; background: #fff; }
  .fam.att { min-height: 46px; }
  .fam + .fam { border-top: 1px solid #f0f0f0; }
  .fam.ouvert { background: var(--fond); border-top-color: transparent; }
  .nom-f { text-align: left; font-size: 12px; min-height: 30px; white-space: nowrap; }
  .fam.att .nom-f { font-size: 14px; font-weight: 650; }
  .nom-f.acc { color: var(--acc); }
  .piste-f { position: relative; height: 12px; border-radius: 6px; background: #f0f0f0; background-image: linear-gradient(90deg, transparent calc(33.33% - 1px), #e0e0e0 calc(33.33% - 1px), #e0e0e0 33.33%, transparent 33.33%, transparent calc(66.66% - 1px), #e0e0e0 calc(66.66% - 1px), #e0e0e0 66.66%, transparent 66.66%); }
  .piste-f.ns { background: repeating-linear-gradient(45deg, #f2f2f2 0 4px, #e4e4e4 4px 6px); }
  .zone-f { position: absolute; top: 0; bottom: 0; border-radius: 6px; background: #cfcfcf; }
  .fam.att .zone-f { background: #bdbdbd; }
  .zone-f.crans { background-image: linear-gradient(90deg, transparent calc(33.33% - 1px), #fff calc(33.33% - 1px), #fff 33.33%, transparent 33.33%, transparent calc(66.66% - 1px), #fff calc(66.66% - 1px), #fff 66.66%, transparent 66.66%); }
  .piste-f.ns .zone-f { background: none; border: 1px dashed #b5b5b5; }
  .au-dessus { position: absolute; top: 0; bottom: 0; left: 82%; right: 0; border: 1px dashed #c4c4c4; border-radius: 6px; }
  .biere-f { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 6px; border: 2px solid var(--encre); background: #fff; z-index: 2; }
  .biere-f.deg { background: var(--encre); }
  .biere-f.dessus { background: var(--acc); border-color: var(--acc); }
  .visee-f { position: absolute; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; transform: rotate(45deg); border: 2px solid var(--encre); background: #fff; z-index: 1; }
  .lien-visee { position: absolute; top: 50%; border-top: 1.5px dashed var(--encre); }
  .droite-f { display: flex; justify-content: flex-end; align-items: center; }
  .ecart { font-size: 12px; font-weight: 650; color: var(--acc); white-space: nowrap; }
  .src-f { font-size: 12px; color: var(--gris2); }
  .ns-pt { width: 10px; height: 10px; border-radius: 5px; border: 1.5px dashed #8a8a8a; }
  .actions-f { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; padding: 2px 0 6px 84px; }
  .actions-f button { min-width: 32px; height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid var(--trait); background: #fff; font-size: 12px; }
  .actions-f [data-action="bannir"] { font-weight: 650; }
  .actions-f .niv { font-size: 12px; color: var(--gris); min-width: 52px; text-align: center; }
  .fam.bannie .nom-f { text-decoration: line-through; color: var(--gris2); }
  .partie.entre { animation: monte 220ms ease-out; }
  @keyframes monte { from { transform: translateY(16px); opacity: .5; } }
  .titre { display: flex; align-items: center; gap: 8px; min-height: 30px; }
  .titre .seg { margin-left: auto; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid var(--trait); background: #fff; font-weight: 600; white-space: nowrap; }
  .chip.dir-plus::before, .chip.ajt::before { content: '+ '; }
  .chip.dir-moins::before { content: '− '; }
  .chip.dir-autre::before { content: '+ …'; color: var(--gris2); }
  .chip[aria-pressed="true"] { background: var(--encre); border-color: var(--encre); color: #fff; }
  .chip.ajt { font-weight: 400; border-style: dashed; }
  .chip.sel { display: inline-flex; align-items: center; gap: 0; height: 30px; padding: 0 0 0 10px; background: var(--fond); border-color: var(--fond); font-size: 12px; }
  .chip.sel .gout { width: 26px; height: 26px; }
  .chip.sel .gout::before { line-height: 26px; }
  .objet { font-weight: 650; }
  .cols { display: grid; align-items: start; column-gap: 4px; }
  .col { display: flex; flex-direction: column; gap: 1px; min-width: 0; padding-left: 4px; position: relative; }
  .col > .p { min-height: 15px; }
  .col b svg { margin-right: 5px; }
  .col b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col b.exclu { color: var(--gris2); text-decoration: line-through; }
  .col-act { display: flex; align-items: center; gap: 2px; margin-left: -6px; }
  .col-act .x { width: 28px; height: 28px; position: relative; }
  .col-act .x::before, .col-act .x::after { content: ''; position: absolute; left: 9px; top: 13px; width: 10px; height: 1.5px; background: var(--gris2); transform: rotate(45deg); }
  .col-act .x::after { transform: rotate(-45deg); }
  .col-act .x:disabled { opacity: .35; }
  .col-act .gout-choix { position: absolute; z-index: 3; left: 0; top: 64px; }
  .ctx { display: inline-flex; gap: 6px; margin-left: auto; }
  .ctx-h { font-size: 12px; padding: 3px 8px; border-radius: 10px; background: var(--fond); white-space: nowrap; }
  .chip.sel .x { width: 26px; height: 26px; position: relative; }
  .chip.sel .x::before, .chip.sel .x::after { content: ''; position: absolute; left: 8px; top: 12px; width: 10px; height: 1.5px; background: var(--gris2); transform: rotate(45deg); }
  .chip.sel .x::after { transform: rotate(-45deg); }
  .moitie { min-height: 28px; text-align: left; font-weight: 650; }
  .moitie::after { content: '›'; margin-left: 4px; color: var(--gris2); }
  .moitie[aria-pressed="true"] { text-decoration: underline; text-underline-offset: 3px; }
  .lien { min-height: 30px; text-align: left; font-weight: 650; }
  .lien::after { content: ' ›'; color: var(--gris2); }
  .voies { display: flex; flex-direction: column; gap: 4px; }
  .voie { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 6px; min-height: 57px; padding: 3px 10px 3px 4px; border-radius: 12px; background: var(--fond); }
  .voie.on { box-shadow: inset 0 0 0 1.5px var(--encre); }
  .coche { width: 22px; height: 22px; margin: 0 auto; accent-color: var(--encre); }
  .corps { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .v1, .v2 { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .v1 b { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .md { font-size: 12px; color: var(--gris); white-space: nowrap; }
  .md + .md::before { content: '·'; margin-right: 6px; }
  .op { width: 14px; height: 14px; border-radius: 7px; border: 1.5px solid var(--encre); position: relative; flex: none; }
  .op::before { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; line-height: 1; }
  .op-ajouter::before { content: '+'; }
  .op-remplacer::before { content: '⇄'; }
  .op-diminuer::before { content: '−'; }
  .op-levure::before { content: '∿'; }
  .bord, .faible, .aime-t { font-size: 12px; padding: 1px 7px; border-radius: 9px; background: #fff; border: 1px solid var(--trait); color: var(--gris); white-space: nowrap; }
  .bord::before { content: '+ '; }
  .faible { border-style: dashed; }
  .droite { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .droite .h { display: flex; align-items: center; gap: 2px; }
  .plus-ibu { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pistes { font-size: 12px; color: var(--gris); }
  .series { display: flex; flex-direction: column; gap: 4px; }
  .serie { width: 100%; min-height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 10px; background: var(--fond); text-align: left; }
  .serie[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px var(--encre); }
  .serie b { white-space: nowrap; }
  .serie .fams { font-size: 12px; color: var(--gris); min-width: 0; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .serie .fams.monte::before { content: '↑ '; color: var(--encre); }
  @media (prefers-reduced-motion: reduce) { .partie.entre, .tourne.roule::after { animation: none; } }
  /* Version consolidée : rail des étapes de p2, levure sur le rail (D28), moment à glisser (D27) */
  .frise { position: relative; display: flex; flex-direction: column; gap: 3px; }
  .axe { position: absolute; left: 21px; top: 8px; bottom: 8px; width: 2px; background: #cfcfcf; }
  .couloir { display: flex; flex-direction: column; gap: 4px; }
  .blk, .rap-zone, .vide-l, .etape-levure { display: grid; grid-template-columns: 44px 1fr; align-items: start; column-gap: 2px; }
  .poignee { justify-self: center; position: relative; z-index: 1; margin-top: 5px; touch-action: none; cursor: grab; border-radius: 15px; }
  .quand, .rail-l.plein { justify-self: center; position: relative; z-index: 1; min-width: 40px; height: 26px; padding: 0 5px; border-radius: 13px; background: #fff; border: 1.5px solid var(--encre); font-size: 12px; font-weight: 650; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; }
  .rail-l.plein { margin-top: 5px; }
  .quand { cursor: grab; touch-action: none; }
  /* Repère de la poignée : on la glisse de haut en bas. */
  .poignee::before, .poignee::after { content: ''; position: absolute; left: 50%; margin-left: -3px; border: 3px solid transparent; }
  .poignee::before { top: -6px; border-bottom-color: #9a9a9a; }
  .poignee::after { bottom: -6px; border-top-color: #9a9a9a; }
  .rail-l { justify-self: center; position: relative; z-index: 1; width: 10px; height: 10px; margin-top: 5px; border-radius: 5px; background: #fff; border: 1.5px solid #9a9a9a; }

  .corps-b .l2 { min-height: 24px; }

  .l1 .nom { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* Étapes vides : fines, le rail ne doit pas déborder de l'écran. */
  .vide-l { min-height: 20px; }

  .marque .drop::after { display: none; }

  .corps-b { padding: 6px 6px 6px 8px; gap: 3px; }

function partieSuggestions(part) {
  const dirs = dirsActives();
  part.append(h('div', { class: 'titre' }, chipsDirection(), lentille()));
  if (!dirs.length || !D.voies.length) {

  }
  const { liste, fam } = voiesListe();
  const res = D.voiesResume.filter((v) => dirs.includes(v.fam));
  part.append(h('div', { class: 'reponse' }, res.map((v) => h('button', {
    class: 'moitie', 'aria-pressed': String(ETAT.filtreVoies === v.fam), 'data-k': 'm' + v.fam, 'data-booster': v.fam === 'resin' ? 'compteur voies' : null,
    onclick: () => { ETAT.filtreVoies = ETAT.filtreVoies === v.fam ? null : v.fam; ETAT.marques = null; rendre(false); },
  }, v.texte))));
  const marq = marquees(liste);

  const zone = h('div', { class: 'vue-voies' });

  const dessiner = () => {
    zone.innerHTML = '';
    if (ETAT.lentille === 'radar') zone.setAttribute('data-composant', 'radar'); else zone.removeAttribute('data-composant');
    if (ETAT.lentille === 'radar') {
      const series = [{ nom: 'avant', valeurs: D.profil.map((p) => p.crans), stroke: '#8f8f8f', w: 4, point: (gg, p, i) => marqueBiere(gg, D.profil[i], i, p, 4) },
        ...marq.map((v, k) => ({ nom: 'après ' + v.houblons.join(' + '), valeurs: v.crans, ...styleApres(k), w: 1.8 }))];
      zone.append(radar('voies', series, { min: 0, max: 4, pad: 0.6, anneaux: [0, 4], bande: D.cible.map((c) => c.max), H: 300, R: 98, label: 'Radar des voies : avant et après, en crans du style', accent: D.profil.map((p) => p.crans === 4),
        apres: (s, P) => { for (const f of dirs) { const i = fi(f); sv('path', { d: losange(P(i, ETAT.visee[f]), 6), fill: '#fff', stroke: '#111', 'stroke-width': 1.6 }, s); } } }));
      zone.append(rangeesSeries([{ nom: 'avant', titre: 'Avant', st: { stroke: '#8f8f8f', w: 4 }, texte: '' }, ...marq.map((v, k) => {
        const monte = D.ordre.map((f, i) => i).filter((i) => typeof v.delta[i] === 'number' && v.delta[i] > 0);
        const baisse = D.ordre.map((f, i) => i).filter((i) => typeof v.delta[i] === 'number' && v.delta[i] < 0);
        return { nom: 'après ' + v.houblons.join(' + '), titre: v.houblons.join(' + '), houblons: v.cles.length ? v.houblons : null, st: styleApres(k), fleche: monte.length > 0, texte: (monte.length ? listeFams(monte) : '') + (baisse.length ? ' ↓ ' + listeFams(baisse) : '') || '≈' };
      })], dessiner));
    } else zone.append(matriceVoies(marq));
  };
  dessiner();
  LENTILLE_CB = () => anime(160, (k) => { zone.style.opacity = 1 - k; }, () => { dessiner(); anime(160, (k) => { zone.style.opacity = k; }); });
}

/* ---------- Partie 3 : Comparer des houblons (objet 3), ce que disent les fiches ---------- */
const NOM_W = 72;
function matriceFiches(noms) {
  const colW = (358 - NOM_W) / noms.length;
  const rows = []; let y = 4;
  D.ordre.forEach((f, i) => { const att = D.attendues.includes(f); if (i === D.attendues.length) y += 6; const rh = att ? 43 : 41; rows.push({ y: y + rh / 2, att }); y += rh; });
  const s = sv('svg', { width: 358, height: y + 2, role: 'img', 'aria-label': 'Ce que disent les fiches, famille par famille : non décrit, cité ou marqué' });
  D.ordre.forEach((f, i) => {
    const r = rows[i];
    if (r.att) sv('rect', { x: 0, y: r.y - 15, width: 358, height: 30, rx: 6, fill: '#f5f5f5' }, s);
    sv('text', { x: 4, y: r.y + 4, 'font-size': 12, 'font-weight': r.att ? 650 : 400 }, s).textContent = nomCourt(f);
    noms.forEach((n, k) => {
      const F = D.fiches[n], x0 = NOM_W + k * colW + 4, bw = colW - 40;
      const lv = F.niv[i];
      if (!lv) { sv('rect', { x: x0, y: r.y - 4, width: bw, height: 8, rx: 4, fill: 'none', stroke: '#b5b5b5', 'stroke-dasharray': '2 2' }, s); return; }
      sv('rect', { x: x0, y: r.y - 4, width: bw, height: 8, rx: 4, fill: '#ededed' }, s);
      sv('rect', { x: x0, y: r.y - 4, width: lv === 2 ? bw : bw / 2, height: 8, rx: 4, fill: lv === 2 ? '#3d3d3d' : '#9a9a9a' }, s);
      sv('text', { x: x0 + bw + 4, y: r.y + 4, 'font-size': 12, fill: '#555' }, s).textContent = F.n[i] + '/' + F.of;
    });
  });
  return s;
}
/* En-tête des colonnes : le houblon, son groupe de stock, mon goût et le retrait. */
const STYLES_FICHES = [{ stroke: '#111', fill: '#111', fillOp: 0.08 }, { stroke: '#111', dash: '5 3' }, { stroke: '#6e6e6e', dash: '2 2' }, { stroke: '#8f8f8f', w: 3 }];
function enteteFiches(noms) {
  const mot = { stock: '', epuise: 'à racheter', catalogue: 'à acheter' };
  return h('div', { class: 'cols', style: 'grid-template-columns:' + NOM_W + 'px repeat(' + noms.length + ', 1fr)', role: 'group', 'aria-label': 'Houblons comparés' },
    h('span'),
    noms.map((n, k) => h('span', { class: 'col' },
      h('b', { class: ETAT.gouts.exclut.has(n) ? 'exclu' : null }, ETAT.lentille === 'radar' ? trait(STYLES_FICHES[k]) : null, h('span', { 'data-houblon': cleDe(n) }, n)),
      h('span', { class: 'p gris' }, mot[D.groupes[n]] || ''),
      h('span', { class: 'col-act' }, goutBouton(n, 'c', null),
        h('button', { class: 'x', 'aria-label': 'Retirer ' + n + ' du comparatif', disabled: noms.length <= 2 || null, onclick: () => { ETAT.comp = ETAT.comp.filter((x) => x !== n); rendre(false); } })))));
}
function partieComparer(part) {
  const noms = ETAT.comp.filter((n) => D.fiches[n]).slice(0, 4);
  part.append(h('div', { class: 'titre' }, h('span', { class: 'objet' }, 'Ce que disent les fiches'), lentille()));
  part.append(enteteFiches(noms));
  const cand = noms.length < 4 ? [['stock', 'en stock'], ['epuise', 'à racheter'], ['catalogue', 'à acheter']].map(([g, mot]) => {
    const c = D.candidats.find(([n, gg]) => gg === g && !noms.includes(n) && D.fiches[n]);
    return c && h('button', { class: 'chip ajt', 'data-k': 'a' + c[0], 'data-booster': g === 'stock' ? 'ajouter au comparatif' : null, 'data-houblon': cleDe(c[0]), 'aria-label': 'Comparer aussi ' + c[0] + ', ' + mot, onclick: () => { ETAT.comp.push(c[0]); rendre(false); } }, c[0]);
  }).filter(Boolean) : [];
  if (cand.length) part.append(h('div', { class: 'chips cand' }, cand));
  const zone = h('div', { class: 'vue-fiches' });
  part.append(zone);
  const dessiner = () => {
    zone.innerHTML = '';
    if (ETAT.lentille === 'radar') zone.setAttribute('data-composant', 'radar'); else zone.removeAttribute('data-composant');
    if (ETAT.lentille === 'radar') {
      zone.append(radar('houblons', noms.map((n, k) => ({ nom: n, valeurs: D.fiches[n].niv, ...STYLES_FICHES[k] })), { min: 0, max: 2, pad: 0.5, anneaux: [0, 1, 2], zeroPointille: true, H: 318, R: 100, label: 'Radar des fiches : citations de 0 (non décrit) à 2 (marqué)' }));
      // Ce qui distingue chaque houblon : les familles où sa fiche dit plus que toutes les autres.
      zone.append(h('p', { class: 'cle' }, 'Se distingue par'));
      zone.append(rangeesSeries(noms.map((n, k) => {
        const propre = D.ordre.map((f, i) => i).filter((i) => noms.every((m) => m === n || D.fiches[n].niv[i] > D.fiches[m].niv[i]));
        return { nom: n, titre: n, houblons: [n], st: STYLES_FICHES[k], texte: propre.length ? listeFams(propre) : 'rien en propre' };
      }).concat((() => {
        const vide = D.ordre.map((f, i) => i).filter((i) => noms.every((m) => !D.fiches[m].niv[i]));
        return vide.length ? [{ nom: 'non décrit', titre: 'Non décrit', st: { point: 'pointille' }, texte: listeFams(vide) }] : [];
      })()), dessiner));
    } else zone.append(matriceFiches(noms));
  };
  dessiner();
  LENTILLE_CB = () => anime(160, (k) => { zone.style.opacity = 1 - k; }, () => { dessiner(); part.querySelector('.cols').replaceWith(enteteFiches(noms)); anime(160, (k) => { zone.style.opacity = k; }); });
}

/* ---------- Rendu ---------- */
function rendre(animerIbu) {
  const app = $('#app');
  const actif = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
  app.innerHTML = '';
  document.body.dataset.vue = ETAT.vue;
  if (ETAT.vue === 'etape') VARIANTE.etape(app); else panneau(app);
  majIbu(animerIbu);
  const k = ETAT.focusK || actif;
  ETAT.focusK = null;
  if (k && ETAT.clavier) { const e = app.querySelector('[data-k="' + CSS.escape(k) + '"]'); if (e) e.focus({ preventScroll: true }); }
}
function demarrer() { rendre(false); }

/* Version consolidée de l'étape (choix du brasseur, 18.10, soir) : le visuel de p2 (rail,
   cartes, ajouts proposés, stock discret), la levure comme étape du rail entre le whirlpool et
   le dry hop (D28, comme p8), et le moment qui se glisse le long du rail (D27).
   Rail (D34, D36) : l'ébullition est une échelle de temps de la durée de la recette à 0′, une
   graduation fine par tranche de 5′ (data-etape="b<minute>"), des repères écrits aux valeurs
   utiles seulement ; lâchée entre deux repères, la carte prend la tranche la plus proche.
   Geste (D35) : la carte glissée reste dans le flux (CSS order, sans sortir du document) : elle
   se range au fil du doigt, les autres s'écartent, l'origine se referme, une seule pastille. */

/* Après un glisser, le clic qui suit le lâcher est ignoré (il tomberait sous le doigt). */
let IGNORE_CLIC = 0;
document.addEventListener('click', (e) => { if (performance.now() < IGNORE_CLIC) { e.stopPropagation(); e.preventDefault(); } }, true);

/* Pendant le glisser : moment, type et IBU de l'étape visée, lus dans les tables du pack. */
function apercuGlisse(carte, l, code) {
  const fictif = { ...l, moment: code };
  carte.querySelector('.ibu-l').textContent = ibuEl(fictif).textContent;
  carte.querySelector('[data-role="quand"]').textContent = quand(fictif);
  carte.querySelector('[data-role="type-ajout"]').textContent = mom(code).type;
}
function brancherGlisser(poignee, carte, l) {
  let g = null;
  poignee.addEventListener('pointerdown', (e) => {
    if (e.button > 0) return;
    g = { y0: e.clientY, bouge: false, code: l.moment };
    try { poignee.setPointerCapture(e.pointerId); } catch (x) { /* rien */ }
  });
  const commencer = () => {
    // Repères à leur place d'avant le geste : le doigt descend de d, la carte prend la tranche qui
    // était d sous son repère ; ces positions ne bougent plus pendant le geste (pas de va-et-vient).
    const rc = carte.getBoundingClientRect();
    g.reperes = [...carte.parentElement.querySelectorAll('.marque')].map((x) => {
      const r = x.getBoundingClientRect();
      return { code: x.dataset.etape, el: x, ordre: Number(x.style.order), y: r.top + r.height / 2 };
    });
    const depart = g.reperes.find((x) => x.code === l.moment);
    g.base = depart ? depart.y : rc.top;
    carte.setAttribute('data-glisse', '');
    carte.classList.add('glisse');
  };
  poignee.addEventListener('pointermove', (e) => {
    if (!g) return;
    const d = e.clientY - g.y0;
    if (!g.bouge && Math.abs(d) < 6) return;
    if (!g.bouge) { g.bouge = true; commencer(); }
    const y = g.base + d;
    let best = g.reperes[0];
    for (const x of g.reperes) if (Math.abs(x.y - y) < Math.abs(best.y - y)) best = x;
    if (best.code !== g.code || !g.place) {
      g.code = best.code; g.place = true;
      carte.style.order = String(best.ordre + 1);
      apercuGlisse(carte, l, best.code);
      for (const x of g.reperes) x.el.classList.toggle('survol', x === best);
    }
  });
  poignee.addEventListener('pointerup', () => {
    const d = g;
    g = null;
    if (!d || !d.bouge) return;
    IGNORE_CLIC = performance.now() + 400;
    ETAT.focusK = 'q' + l.id;
    if (d.code !== l.moment) placer(l, d.code); else rendre(false);
  });
  poignee.addEventListener('pointercancel', () => { if (g && g.bouge) rendre(false); g = null; });
}

/* Réglages libres là où le moteur donne une table : whirlpool (°C, minutes), dry hop (jour). */
function reglage(libelle, valeur, moins, plus) {
  return h('span', { class: 'regl', role: 'group', 'aria-label': libelle },
    h('button', { class: 'moins', 'aria-label': libelle + ' : moins', onclick: (e) => { e.stopPropagation(); moins(); } }),
    h('span', { class: 'regl-v' }, valeur),
    h('button', { class: 'plus', 'aria-label': libelle + ' : plus', onclick: (e) => { e.stopPropagation(); plus(); } }));
}
function reglagesMoment(l) {
  const m = mom(l.moment);
  if (l.moment === 'wp' && l.tab && l.tab.wp && D.tables.wp) {
    const T = D.tables.wp.temperatures, M = D.tables.wp.minutes, t = T.indexOf(l.wpT), n = M.indexOf(l.wpMin);
    return h('div', { class: 'reglages' },
      reglage('Température du whirlpool', l.wpT + ' °C', () => { if (t > 0) { l.wpT = T[t - 1]; rendre(true); } }, () => { if (t < T.length - 1) { l.wpT = T[t + 1]; rendre(true); } }),
      reglage('Durée du whirlpool', l.wpMin + ' min', () => { if (n > 0) { l.wpMin = M[n - 1]; rendre(true); } }, () => { if (n < M.length - 1) { l.wpMin = M[n + 1]; rendre(true); } }));
  }
  if (m.type === 'à froid') {
    const J = D.dryJours || { min: 0, max: 14 };
    return h('div', { class: 'reglages' },
      reglage('Jour du houblonnage à froid', 'J+' + l.jour, () => { if (l.jour > J.min) { l.jour -= 1; rendre(false); } }, () => { if (l.jour < J.max) { l.jour += 1; rendre(false); } }));
  }
  return null;
}

function blocRail(l, i, st, ordre) {
  const premier = i === 0;
  const m = mom(l.moment);
  const pastille = h('button', {
    class: 'quand', 'data-role': 'quand', 'data-k': 'q' + l.id, 'data-booster': premier ? 'moment qui tourne' : null,
    'aria-label': 'Moment : ' + quandLong(l) + ' ; glisser le long du rail pour le changer (tranches de 5 minutes), toucher pour passer au suivant, flèches haut et bas',
    onkeydown: (e) => {
      if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
      e.preventDefault();
      const k = MOMENTS.findIndex((x) => x.code === l.moment) + (e.key === 'ArrowDown' ? 1 : -1);
      if (k >= 0 && k < MOMENTS.length) { ETAT.focusK = 'q' + l.id; placer(l, MOMENTS[k].code); }
    },
  }, quand(l));
  const poignee = h('span', { class: 'poignee', 'data-role': 'glisser-moment', onclick: () => { ETAT.focusK = 'q' + l.id; momentSuivant(l); } }, pastille);
  const carte = h('div', { class: 'blk', 'data-role': 'ligne-houblon', style: 'order:' + ordre },
    poignee,
    h('div', { class: 'corps-b' },
      h('div', { class: 'l1' },
        h('b', { class: 'nom', 'data-houblon': l.cle }, l.nom),
        h('button', {
          class: 'tag tourne type', 'data-role': 'type-ajout', 'data-k': 't' + l.id, 'data-booster': premier ? 'type d\'ajout' : null,
          'aria-label': 'Type d\'ajout : ' + m.type + ', toucher pour passer au suivant', onclick: () => { ETAT.focusK = 't' + l.id; typeSuivant(l); },
        }, m.type),
        h('span', { class: 'pas' },
          h('button', { class: 'moins', 'aria-label': 'Retirer 2 g de ' + l.nom, onclick: () => doser(l, -2) }),
          h('output', { class: 'dose' }, grammes(l.g)),
          h('button', { class: 'plus', 'data-k': 'd' + l.id, 'data-booster': premier ? 'dose au pas' : null, 'aria-label': 'Ajouter 2 g de ' + l.nom, onclick: () => { ETAT.focusK = 'd' + l.id; doser(l, 2); } })),
        h('button', { class: 'corbeille', 'aria-label': 'Retirer ' + l.nom + ' de la recette', onclick: () => retirer(l) })),
      h('div', { class: 'l2' }, alphaEl(l.alpha), roleEl(l.role), stockIcone(st.code, st.txt), citationTag(l), effetTag(l), ibuEl(l)),
      h('div', { class: 'l3' }, miniProfil(l.fiche, l.nom), reglagesMoment(l)),
      l.moment === 'dryActive' ? bioEl(l) : null));
  brancherGlisser(poignee, carte, l);
  return carte;
}
function zoneRapides(code, liste, tete, premier, ordre, seule) {
  // Sous une carte de la même étape, la zone ne répète pas le moment (une seule pastille).
  return h('div', { class: 'rap-zone', 'data-etape': code, style: 'order:' + ordre },
    seule ? h('span', { class: 'rail-l plein' }, mom(code).quand) : h('span'),
    h('div', { class: 'rap-corps' },
      tete ? noteIbu() : null,
      tete ? champ() : null,
      h('ul', { class: 'rapides', 'aria-label': 'Ajouts proposés à ' + mom(code).quand + ', selon le moteur' },
        // Deux amérisants « au choix » (un seul suffit pour l'IBU visé) : un « ou » les sépare.
        liste.flatMap((r, n) => [rapideLigne(r, premier && n === 0, false), r.alternative && liste[n + 1] && liste[n + 1].alternative ? h('li', { class: 'ou' }, 'ou') : null]).filter(Boolean))));
}
/* Repère du rail : une graduation fine ; son nom n'est écrit qu'aux valeurs utiles. */
function repere(code, libelle, ordre) {
  const m = mom(code);
  return h('div', {
    class: 'marque' + (libelle ? ' ecrit' : '') + (m.type === 'ébullition' ? ' ebu' : ''), 'data-etape': code, style: 'order:' + ordre,
    'aria-label': 'Étape : ' + quandLong({ moment: code, jour: 3, wpT: 80, wpMin: 20 }),
  }, h('span', { class: 'rail-l' }), h('span', { class: 'drop' }, libelle || null));
}
VARIANTE = {
  etape(app) {
    app.append(enTete(), resume());
    const fr = h('section', { class: 'frise', 'data-role': 'houblons-recette', 'aria-label': 'Houblons de la recette, posés sur le rail du brassage', style: '--tick:' + Math.max(2, Math.min(9, Math.floor(110 / (EBU / 5)))) + 'px' },
      h('i', { class: 'axe', 'aria-hidden': 'true' }),
      // D37 : la durée d'ébullition se règle ici, par pas de 5′ ; le rail se redessine à cette durée.
      h('div', { class: 'ebu-regl', 'data-role': 'ebullition', 'data-minutes': String(EBU), style: 'order:-1' },
        h('span', { class: 'rail-ebu', 'aria-hidden': 'true' }),
        h('span', { class: 'ebu-corps' }, h('span', { class: 'cle' }, 'ébullition'),
          h('button', { class: 'moins', 'data-action': 'ebullition-moins', 'aria-label': 'Ébullition plus courte de 5 minutes', disabled: EBU <= EBU_MIN || null, onclick: () => changerEbu(EBU - 5) }),
          h('output', { class: 'ebu-v', 'aria-live': 'polite' }, EBU + '′'),
          h('button', { class: 'plus', 'data-action': 'ebullition-plus', 'aria-label': 'Ébullition plus longue de 5 minutes', disabled: EBU >= EBU_MAX || null, onclick: () => changerEbu(EBU + 5) }))));
    const et = etatsStock();
    const n = ETAT.lignes.length;
    // Propositions selon la place : 5 pour une recette vide, puis 3, 2, 1, et aucune au-delà de 3 ajouts (le champ reste).
    const proposes = rapidesVisibles(n === 0 ? 5 : Math.max(0, 4 - n));
    const parMoment = (c) => proposes.filter((r) => momentBorne(r.moment) === c);
    const codes = MOMENTS.map((m) => m.code);
    const premiereZone = codes.find((c) => parMoment(c).length) || D.rapidesMoment;
    let ordre = 0;
    const suite = () => (ordre += 2);
    for (const code of codes) {
      const blocs = ETAT.lignes.map((l, i) => [l, i]).filter(([l]) => l.moment === code);
      const zone = parMoment(code).length || code === premiereZone;
      const m = mom(code);
      // Repère écrit : étapes nommées (premier moût, whirlpool, phases à froid) et minutes utiles, quand rien ne les dit déjà.
      const ecrit = m.type === 'à froid' ? m.vide : blocs.length || zone ? null : m.vide || (REPERES.has(m.minute) ? m.quand : null);
      fr.append(repere(code, ecrit, suite()));
      blocs.forEach(([l, i]) => fr.append(blocRail(l, i, et[i], suite())));
      if (zone) fr.append(zoneRapides(code, parMoment(code), code === premiereZone, code === premiereZone, suite(), !blocs.length));
      if (code === 'wp') fr.append(h('div', { class: 'etape-levure', 'data-etape': 'levure', style: 'order:' + suite() }, h('span', { class: 'rail-lev', 'aria-hidden': 'true' }), levure()));
    }
    app.append(...[fr, goutsLigne(), panLigne()].filter(Boolean));
  },
};

demarrer();
