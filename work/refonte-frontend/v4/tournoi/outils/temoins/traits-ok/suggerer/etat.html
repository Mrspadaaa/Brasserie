<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Témoin D110 : un toucher montre « Agrumes +1,6 cran » à côté du picto</title>
<style>body{margin:0;font:15px/1.3 system-ui,sans-serif;background:#fff;color:#222}
main{max-width:420px;margin:0 auto;padding:0 8px 80px}
h1{font-size:17px;margin:14px 0 10px}
ul{list-style:none;margin:0;padding:0}
.voie{position:relative;padding:14px 4px;border-bottom:1px solid #ddd}
.nom{margin:0 0 6px}.alpha{font-size:12px;color:#555}
.rang{display:flex;gap:2px;align-items:flex-start}
.case{display:flex;flex-direction:column;align-items:center;gap:2px;width:22px}
.traits{display:flex;align-items:flex-end;gap:1px;height:6px}
.tr{display:block;width:3px;height:6px;background:#c08a2e;border-radius:1px}.demi{height:3px}
.hach{display:block;width:14px;height:6px;background:repeating-linear-gradient(45deg,#999 0 2px,#fff 2px 4px)}
.pt{display:block;width:4px;height:4px;border-radius:50%;background:#999;margin-top:6px}
.calme{align-items:center}
.plus{position:absolute;right:4px;top:14px;width:44px;height:44px;border-radius:50%;border:2px solid #222;background:#fff;font-size:22px}
.legende{display:flex;gap:2px;margin-top:2px;font-size:10px;white-space:nowrap}.cl{display:block;width:22px}
.bulle{position:absolute;z-index:5;padding:5px 9px;border-radius:6px;background:#222;color:#fff;font-size:13px;white-space:nowrap}
.feuille{position:fixed;left:0;right:0;top:0;bottom:0;z-index:9;background:rgba(0,0,0,.55)}
.feuille .bulle{position:absolute;background:#fff;color:#222}</style></head>
<body data-route="suggerer"><main><h1>Voies pour la stout</h1><ul><li data-voie="Motueka" data-role="ligne-houblon" class="voie"><p class="nom"><b>Motueka</b> <span class="alpha">α 6,5 %</span></p><div class="rang"><span data-role="extra" data-famille="citrus" data-crans="1.57" role="img" aria-label="Agrumes +1,6 cran" class="case"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#c08a2e"/></svg><span class="traits" aria-hidden="true"><i class="tr"></i><i class="tr"></i><i class="tr demi"></i></span></span><span data-role="extra" data-famille="tropical" data-crans="0.87" role="img" aria-label="Tropicaux +0,9 cran" class="case"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#c08a2e"/></svg><span class="traits" aria-hidden="true"><i class="tr"></i><i class="tr demi"></i></span></span><span class="case calme" aria-hidden="true"><i class="pt"></i></span><span data-role="extra" data-famille="floral" data-crans="0.50" role="img" aria-label="Floral +0,5 cran" class="case"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#c08a2e"/></svg><span class="traits" aria-hidden="true"><i class="tr"></i><i class="tr demi"></i></span></span></div><button type="button" data-role="ajouter" class="plus" aria-label="Ajouter Motueka à la comparaison">+</button></li><li data-voie="Idaho 7" data-role="ligne-houblon" class="voie"><p class="nom"><b>Idaho 7</b> <span class="alpha">α 6,5 %</span></p><div class="rang"><span data-role="extra" data-famille="earthy" data-crans="-0.80" role="img" aria-label="Terreux −0,8 cran" class="case"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#c08a2e"/></svg><span class="traits" aria-hidden="true"><i class="tr"></i><i class="tr demi"></i></span></span><span data-role="extra" data-famille="spice" data-crans="0.87" role="img" aria-label="Épicé +0,9 cran" class="case"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#c08a2e"/></svg><span class="traits" aria-hidden="true"><i class="tr"></i><i class="tr demi"></i></span></span><span data-role="extra" data-famille="resin" data-crans="1.20" role="img" aria-label="Résineux +1,2 cran" class="case"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#c08a2e"/></svg><span class="traits" aria-hidden="true"><i class="tr"></i><i class="tr demi"></i></span></span><span class="case calme" aria-hidden="true"><i class="pt"></i></span></div><button type="button" data-role="ajouter" class="plus" aria-label="Ajouter Idaho 7 à la comparaison">+</button></li><li data-voie="Nelson Sauvin" data-role="ligne-houblon" class="voie"><p class="nom"><b>Nelson Sauvin</b> <span class="alpha">α 6,5 %</span></p><div class="rang"><span data-role="extra" data-famille="floral" data-crans="?" role="img" aria-label="Floral : effet non établi" class="case"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#c08a2e"/></svg><span class="traits" aria-hidden="true"><i class="hach"></i></span></span><span data-role="extra" data-famille="herbal" data-crans="0.50" role="img" aria-label="Herbacé +0,5 cran" class="case"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#c08a2e"/></svg><span class="traits" aria-hidden="true"><i class="tr"></i><i class="tr demi"></i></span></span><span class="case calme" aria-hidden="true"><i class="pt"></i></span><span data-role="extra" data-famille="citrus" data-crans="2.04" role="img" aria-label="Agrumes +2,0 cran" class="case"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#c08a2e"/></svg><span class="traits" aria-hidden="true"><i class="tr"></i><i class="tr"></i><i class="tr demi"></i></span></span></div><button type="button" data-role="ajouter" class="plus" aria-label="Ajouter Nelson Sauvin à la comparaison">+</button></li></ul></main>
<script>window.__parcours = { etat: { aComparer: [] }, route: 'suggerer' };
const NOMS={"citrus":"Agrumes","tropical":"Tropicaux","floral":"Floral","earthy":"Terreux","spice":"Épicé","herbal":"Herbacé","resin":"Résineux"};
const fmt=(c)=>{const x=Number(c);if(!Number.isFinite(x))return 'non \u00e9tabli';const v=(Math.round(Math.abs(x)*10+1e-9)/10).toFixed(1).split('.').join(',');return (x<0?'\u2212':'+')+v+' cran'};
const ferme=()=>document.querySelectorAll('.bulle').forEach((b)=>b.remove());
document.addEventListener('click',(ev)=>{
  const c=ev.target.closest('[data-famille][data-crans]');
  ferme();
  if(!c)return;
  const r=c.getBoundingClientRect();
  const b=document.createElement('div');b.className='bulle';b.setAttribute('role','tooltip');
  b.textContent=NOMS[c.dataset.famille]+' '+fmt(c.dataset.crans);
  b.style.left=(r.left+scrollX)+'px';b.style.top=(r.bottom+scrollY+6)+'px';
  document.body.appendChild(b);
});</script></body></html>
