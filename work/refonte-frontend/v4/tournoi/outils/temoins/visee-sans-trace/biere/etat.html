<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temoin visee-sans-trace (D108)</title>
<!-- TEMOIN visee-sans-trace (D108) : la version rejetee en petit. « + », « - » et « bannir » ne changent que le mot
     entre les boutons, et une puce « + tropicaux » s'ajoute en bas de page ; la piste ne change jamais : pas de losange,
     pas de trait, pas de nom barre. Doit ECHOUER. Marqueurs du contrat presents, sauf ceux de la visee sur la piste. -->
<style>
  body { margin: 0; padding: 16px; font: 14px/1.4 sans-serif; background: #fff; color: #111; }
  .fam { border-top: 1px solid #eee; }
  .fam > button { display: grid; grid-template-columns: 84px 1fr 52px; align-items: center; width: 100%; min-height: 40px; border: 0; background: none; text-align: left; font: inherit; }
  .piste { position: relative; height: 12px; border-radius: 6px; background: #f0f0f0; }
  .zone { position: absolute; left: 0; width: 80%; top: 0; bottom: 0; border-radius: 6px; background: #cfcfcf; }
  .pt { position: absolute; top: 50%; left: 17%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; border: 2px solid #111; background: #fff; }
  .groupe { display: flex; gap: 8px; align-items: center; padding: 8px 0 12px; }
  .groupe[hidden] { display: none; }
  .groupe button { min-width: 44px; height: 40px; border-radius: 20px; border: 1px solid #ccc; background: #fff; font: inherit; }
  .mot { min-width: 90px; text-align: center; color: #666; }
  #puces { margin-top: 900px; }
  #puces span { display: inline-block; padding: 4px 10px; border: 1px solid #ccc; border-radius: 14px; margin-right: 6px; }
</style>
</head>
<body>
<div class="fam" data-famille-ligne="tropical">
  <button type="button" aria-expanded="false" aria-controls="g-tropical"><span>Tropicaux</span>
    <span class="piste" data-role="piste"><span class="zone"></span><span class="pt" data-biere-point></span></span><span>prévu</span></button>
  <div class="groupe" id="g-tropical" role="group" aria-label="Visée pour Tropicaux" hidden>
    <button type="button" data-visee="bannir">bannir</button>
    <button type="button" data-visee="moins" aria-label="Moins de Tropicaux">−</button>
    <span class="mot" data-palier>sans visée</span>
    <button type="button" data-visee="plus" aria-label="Plus de Tropicaux">+</button>
    <button type="button" data-visee="retirer" aria-label="Retirer ma visée">×</button>
  </div>
</div>
<div id="puces"></div>
<script>
(() => {
  const ligne = document.querySelector('[data-famille-ligne="tropical"]');
  const bouton = ligne.querySelector('[aria-expanded]'), groupe = ligne.querySelector('.groupe');
  const mot = ligne.querySelector('[data-palier]'), puces = document.getElementById('puces');
  const MOTS = { bannir: 'bannie', moins: 'moins', plus: 'plus', retirer: 'sans visée' };
  bouton.addEventListener('click', () => { const o = bouton.getAttribute('aria-expanded') === 'true'; bouton.setAttribute('aria-expanded', String(!o)); groupe.hidden = o; });
  groupe.addEventListener('click', (e) => {
    const b = e.target.closest('[data-visee]'); if (!b) return;
    const g = b.getAttribute('data-visee');
    mot.textContent = MOTS[g];
    puces.textContent = '';
    if (g !== 'retirer') { const s = document.createElement('span'); s.textContent = (g === 'moins' ? '− ' : g === 'bannir' ? '× ' : '+ ') + 'tropicaux'; puces.append(s); }
  });
})();
</script>
</body>
</html>
