<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Témoin D111 · graduations qui se chevauchent</title>
<!-- Témoin statique de controle-geste-etape.mjs (D111, voie p13). ÉCHEC attendu : la carte se replie en puce et rien ne se sélectionne, mais la frise est serrée (1,4 px par minute) et les graduations de 13 px se marchent dessus, et passent sur les puces des étapes.
     Classes préfixées tg-. -->
<style>
  .tg-corps { margin: 0; font: 14px/18px system-ui, sans-serif; background: #fff; color: #111; -webkit-user-select: none; user-select: none; }
  .tg-titre { padding: 10px 12px; font-weight: 700; }
  .tg-frise { position: relative; height: 700px; touch-action: none; }
  .tg-axe { position: absolute; left: 33px; top: 70px; width: 2px; height: 380px; background: #ccc; }
  .tg-etape { position: absolute; left: 0; width: 100%; height: 20px; }
  .tg-puce { position: absolute; left: 28px; width: 12px; height: 12px; border: 2px solid #111; border-radius: 50%; background: #fff; box-sizing: border-box; }
  .tg-nom { position: absolute; left: 72px; font-size: 14px; line-height: 18px; color: #444; }
  .tg-poignee { position: absolute; left: 8px; width: 50px; height: 28px; border-radius: 14px; background: #111; color: #fff; font: 700 14px/28px system-ui, sans-serif; text-align: center; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }
  .tg-carte { position: absolute; left: 72px; right: 8px; border-radius: 10px; background: #f0f0f0; padding: 8px 10px; box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .tg-carte .tg-detail { display: block; margin-top: 6px; }
  .tg-carte.tg-tenue { height: 31px; width: 74px; left: 104px; right: auto; white-space: nowrap; padding: 5px 10px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .tg-carte.tg-tenue .tg-detail { display: none; }
  .tg-grad { position: absolute; left: 25px; font: 11px/13px ui-monospace, monospace; color: #555; display: none; }
  .tg-geste .tg-grad.tg-voisine { display: block; }
</style>
</head>
<body class="tg-corps">
<div class="tg-titre">Houblons 3/7</div>
<div class="tg-frise" id="tg-frise">
  <div class="tg-axe"></div>
  <div id="tg-etapes"></div>
  <div id="tg-grads"></div>
  <div class="tg-carte" id="tg-carte" data-role="ligne-houblon" data-houblon-ligne="beermaverick-nugget"><b>Nugget</b><span class="tg-detail"> · 46 g · α 13 % · résine 2/4 · 60 IBU</span></div>
  <span class="tg-poignee" id="tg-poignee" data-role="glisser-moment" role="slider" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="60" aria-valuenow="60" aria-valuetext="60′" tabindex="0">60′</span>
</div>
<script>
(function () {
  var PX = 1.4, Y0 = 90, frise = document.getElementById('tg-frise');
  var poignee = document.getElementById('tg-poignee'), carte = document.getElementById('tg-carte');
  var etapes = [['Ébullition 60′', Y0 - 40, true], ['0′', Y0 + 60 * PX + 30], ['whirlpool', Y0 + 60 * PX + 66], ['levure', Y0 + 60 * PX + 102], ['fermentation', Y0 + 60 * PX + 138], ['post-fermentation', Y0 + 60 * PX + 174]];
  var h = '';
  etapes.forEach(function (e) { h += '<div class="tg-etape" style="top:' + e[1] + 'px"><i class="tg-puce" style="top:2px"></i><span class="tg-nom" style="top:0">' + e[0] + '</span></div>'; });
  document.getElementById('tg-etapes').innerHTML = h;
  var g = '';
  for (var m = 60; m >= 0; m -= 5) g += '<span class="tg-grad" data-cran="' + m + '" style="top:' + (Y0 + (60 - m) * PX - 6) + 'px">' + m + '′</span>';
  document.getElementById('tg-grads').innerHTML = g;
  function poser(m) {
    var y = Y0 + (60 - m) * PX;
    poignee.style.top = (y - 14) + 'px';
    poignee.textContent = m + '′';
    poignee.setAttribute('aria-valuenow', m);
    poignee.setAttribute('aria-valuetext', m + '′');
    carte.style.top = (carte.classList.contains('tg-tenue') ? y - 15 : Y0 - 4 + 30) + 'px';
    var gs = document.querySelectorAll('.tg-grad');
    for (var i = 0; i < gs.length; i++) { var c = +gs[i].getAttribute('data-cran'); gs[i].classList.toggle('tg-voisine', c !== m && Math.abs(c - m) <= 30); }
  }
  var actif = false, m0 = 60;
  function suivre(e) { var r = frise.getBoundingClientRect(); var m = Math.round((60 - (e.clientY - r.top - Y0) / PX) / 5) * 5; m = Math.max(0, Math.min(60, m)); m0 = m; poser(m); }
  poignee.addEventListener('pointerdown', function (e) { actif = true; poignee.setPointerCapture(e.pointerId); frise.classList.add('tg-geste'); carte.classList.add('tg-tenue'); suivre(e); e.preventDefault(); });
  poignee.addEventListener('pointermove', function (e) { if (actif) suivre(e); });
  function lever() { actif = false; frise.classList.remove('tg-geste'); carte.classList.remove('tg-tenue'); poser(m0); }
  poignee.addEventListener('pointerup', lever); poignee.addEventListener('pointercancel', lever);
  poignee.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  poser(60);
})();
</script>
</body>
</html>
