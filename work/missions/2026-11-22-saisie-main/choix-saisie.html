<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saisie à la main</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Source Sans 3',system-ui,sans-serif;background:#d9d9d9;color:#111}
button,input{font:inherit;color:inherit;background:none;border:0}
input{outline:none}
.mono,.sm-n{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
/* ---------- planche ---------- */
.pl-top{padding:16px 20px 8px;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.pl-top h1{font-size:20px}
.pl-top p{font-size:13px;color:#444}
.pl-top button{border:1px solid #111;border-radius:8px;padding:4px 10px;font-weight:600;cursor:pointer;background:#fff}
.pl-v{padding:14px 20px 22px;border-top:1px solid #bbb}
.pl-v h2{font-size:17px;display:flex;gap:10px;align-items:baseline}
.pl-v h2 small{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:#fff}
.pl-cor{font-size:13px;color:#1d4d1a;background:#e6f2df;border-left:3px solid #567F45;padding:4px 8px;margin:4px 0 2px;max-width:1100px}
.pl-v>p{font-size:13px;color:#333;margin:2px 0 10px;max-width:900px}
.pl-row{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}
.pl-cell{flex:none}
.pl-cell>b{display:block;font-size:12px;margin:0 0 4px 2px;color:#333}
/* ---------- téléphone + jetons ---------- */
.sm-ph{--page:#fff;--pan:#F5F5F5;--rai:#EBEBEB;--bord:#DDD;--bordm:#BFBFBF;--trait:#9E9E9E;--sec:#666;--txt:#333;--val:#111;
 --act:#111;--acttx:#fff;--in:#3F6B2E;--inbg:#E4F0DD;--inap:#567F45;--out:#7F5B10;--outbg:#F8ECCF;--outap:#E3B55D;--fin:#1F64A3;--finbg:rgba(31,100,163,.12);
 width:390px;height:844px;background:var(--page);color:var(--txt);position:relative;overflow:hidden;display:flex;flex-direction:column;font-size:14px;line-height:1.25;border-radius:4px}
.sm-ph.cave{--page:#12100E;--pan:#1A1613;--rai:#221D19;--bord:#2C2521;--bordm:#3D342E;--trait:#6B5D53;--sec:#9A8A7E;--txt:#D8CEC5;--val:#F5F0EA;
 --act:#F2C14E;--acttx:#12100E;--in:#8FC27A;--inbg:#18221A;--inap:#6E9B5B;--out:#E8A55A;--outbg:#261C12;--outap:#D9954A;--fin:#86B9E6;--finbg:rgba(134,185,230,.14)}
.sm-i{flex:none;display:inline-block;vertical-align:middle}
.sm-hd{height:48px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid var(--bord)}
.sm-hd b{font-size:18px;color:var(--val);flex:1}
.sm-hd button{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;color:var(--val)}
.sm-hd .sm-doc{border:1px solid var(--bordm)}
.sm-cat{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--cb);color:var(--ct);white-space:nowrap}
.sm-mm{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 10px;border:1px solid var(--bordm);border-radius:12px;font-weight:600;color:var(--val);white-space:nowrap}
.sm-mmv{font-family:'IBM Plex Mono',monospace;font-size:14px;padding:1px 7px;border-radius:7px;font-weight:600}
.sm-mmv.out{background:var(--outap);color:#2b1f05}
.sm-mmv.in{background:var(--inap);color:#fff}
.sm-mmv.vide{background:var(--rai);color:var(--sec);font-family:'Source Sans 3',sans-serif}
.sm-go{height:44px;padding:0 14px;border-radius:12px;background:var(--act);color:var(--acttx);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sm-go b{font-family:'IBM Plex Mono',monospace;font-weight:600}
.sm-go[disabled]{opacity:.35}
.sm-chip{height:34px;padding:0 10px;border-radius:99px;border:1px solid var(--bordm);font-size:13px;display:inline-flex;align-items:center;gap:4px;color:var(--val);white-space:nowrap;font-weight:600;flex:none}
.sm-chip.on{background:var(--val);color:var(--page);border-color:var(--val)}
.sm-chip.lk{border-color:var(--inap);color:var(--in);background:var(--inbg)}
.sm-chip.dt{font-family:'IBM Plex Mono',monospace;font-weight:500}
.sm-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sm-row>small{font-size:13px;color:var(--sec)}
.sm-sum{font-size:13px;color:var(--val);display:inline-flex;gap:6px;align-items:center;font-weight:600}
.sm-sum b{font-family:'IBM Plex Mono',monospace;color:var(--out)}
.sm-fold{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--val);padding:11px 4px;border-top:1px solid var(--bord);border-bottom:1px solid var(--bord)}
.sm-fold span{font-size:12px;color:var(--sec);display:inline-flex;gap:3px;align-items:center}
.sm-in.sel{background:var(--finbg);border-radius:6px}
/* aperçu Calendrier (13 px, noir) */
.sm-ap{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.sm-ap>b{font-size:13px;color:var(--val);font-weight:600;display:inline-flex;gap:4px;align-items:center;margin-right:2px}
.sm-ap i{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:13px;padding:2px 6px;border-radius:6px;background:var(--rai);color:var(--val)}
.sm-ap i.f{background:var(--outbg);color:var(--out);font-weight:600}.sm-ap i.fi{background:var(--inbg);color:var(--in);font-weight:600}
.sm-ap small{font-size:13px;color:var(--val)}
/* frise partagée (FrisePeriode du Calendrier : cadre bleu, deux poignées, pastille de période) */
.fr{background:var(--pan);border-radius:12px;padding:8px 8px 2px;border:1px solid var(--bord)}
.fr-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.fr-pill{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--fin);border:2px solid var(--fin);border-radius:99px;padding:1px 9px;background:var(--page);white-space:nowrap}
.fr-top small{font-size:12px;color:var(--sec);margin-left:auto}
.fr-tr{position:relative;height:40px;background:var(--rai);border-radius:6px;margin:0 6px}
.fr-fr{position:absolute;top:-2px;bottom:-2px;border:2.5px solid var(--fin);border-radius:9px;background:var(--finbg)}
.fr-fr.open{border-right:0;border-radius:9px 0 0 9px;background:linear-gradient(90deg,var(--finbg) 80%,transparent)}
.fr-h{position:absolute;top:50%;width:8px;height:24px;margin-top:-12px;border-radius:4px;background:var(--fin)}
.fr-h.l{left:-5px}.fr-h.r{right:-5px}
.fr-d{position:absolute;top:50%;width:6px;height:16px;margin:-8px 0 0 -3px;border-radius:3px}
.fr-d.out{background:var(--outap)}.fr-d.in{background:var(--inap)}
.fr-g{position:relative;height:20px;margin:0 6px}
.fr-g span{position:absolute;top:3px;font-size:12px;color:var(--sec);transform:translateX(-50%);white-space:nowrap}
.fr-g span.y{color:var(--val);font-weight:600}
/* confirmation (après Enregistrer) */
.sm-ok-veil{position:absolute;inset:0;background:rgba(0,0,0,.38)}
.sm-ok{position:absolute;left:0;right:0;bottom:0;background:var(--page);border-radius:16px 16px 0 0;padding:14px 14px 16px;box-shadow:0 -6px 24px rgba(0,0,0,.25)}
.sm-ok-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sm-ok-h .sm-okc{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--inap);color:#fff;flex:none}
.sm-ok-h b{font-size:16px;color:var(--val);display:block}
.sm-ok-h span{font-size:13px;color:var(--sec)}
.sm-ok-r{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bord);flex-wrap:wrap}
.sm-ok-r>b{width:96px;font-size:13px;color:var(--val);display:flex;gap:6px;align-items:center}
.sm-ok-r>small{font-size:13px;color:var(--sec)}
.sm-ok-tl{display:flex;gap:4px;flex:1;align-items:center;flex-wrap:wrap}
.sm-ok-tl i{font-style:normal;font-size:13px;padding:2px 6px;border-radius:6px;background:var(--rai);font-family:'IBM Plex Mono',monospace;color:var(--val)}
.sm-ok-tl i.f{background:var(--outbg);color:var(--out);font-weight:600}
.sm-ok-tl i.fi{background:var(--inbg);color:var(--in);font-weight:600}
.sm-ok-tl small{font-size:13px;color:var(--val)}
.sm-ok-a{display:flex;gap:8px;margin-top:10px}
.sm-ok-a button{height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--bordm);font-weight:600;color:var(--val);display:inline-flex;align-items:center;gap:5px}
.sm-ok-a .sm-go{border:0;color:var(--acttx);margin-left:auto;padding:0 22px}

/* ================= v01 : le genre d'abord ================= */
.v01-b{flex:1;padding:10px 10px 0;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.v01-hab h3{font-size:12px;color:var(--sec);font-weight:700;letter-spacing:.03em;margin:0 0 2px 2px}
.v01-hr{display:flex;align-items:center;gap:10px;height:44px;border-bottom:1px solid var(--bord);padding:0 2px}
.v01-hr .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--cb);color:var(--ct);flex:none}
.v01-hr div{flex:1;min-width:0}.v01-hr div b{display:block;font-size:14px;color:var(--val)}.v01-hr div span{font-size:12px;color:var(--sec)}
.v01-pm{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;padding:2px 7px;border-radius:7px}
.v01-pm.out{background:var(--outbg);color:var(--out)}.v01-pm.in{background:var(--inbg);color:var(--in)}
.v01-side{border-radius:14px;padding:6px 6px 6px}
.v01-side.out{background:var(--outbg)}.v01-side.in{background:var(--inbg)}
.v01-lab{font-size:15px;font-weight:700;display:flex;align-items:center;gap:4px;margin:0 0 5px 4px}
.v01-side.out .v01-lab{color:var(--out)}.v01-side.in .v01-lab{color:var(--in)}
.v01-g{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.v01-t{height:56px;border-radius:11px;background:var(--page);border:1px solid var(--bord);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;padding:0 2px;font-weight:600;color:var(--val);line-height:1.1}
.v01-t .ic{color:var(--cseg)}
.v01-rb{display:flex;align-items:center;gap:10px;height:44px;border:1px dashed var(--bordm);border-radius:12px;padding:0 12px;font-weight:600;color:var(--val);font-size:14px}
.v01-rb span{font-weight:400;color:var(--sec);font-size:13px}
.v01-sel{display:flex;align-items:center;gap:8px;height:52px;border-radius:14px;padding:0 6px 0 12px;font-weight:700;font-size:15px}
.v01-sel.out{background:var(--outbg);color:var(--out)}.v01-sel.in{background:var(--inbg);color:var(--in)}
.v01-sel .g{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:10px;background:var(--page);color:var(--val);border:2px solid currentColor}
.v01-sel .g .ic{color:var(--cseg)}
.v01-sel button{margin-left:auto;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--bordm);background:var(--page);color:var(--val);font-weight:600;font-size:14px}
.v01-card{border:1px solid var(--bordm);border-radius:14px;padding:10px 12px;background:var(--page)}
.v01-c1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.v01-c1 input{font-size:16px;font-weight:700;color:var(--val);flex:1;min-width:0}
.v01-amt{display:flex;align-items:baseline;gap:6px;margin:2px 0 6px}
.v01-amt input{font-family:'IBM Plex Mono',monospace;font-size:46px;font-weight:600;width:260px;letter-spacing:-.02em}
.v01-amt input.out{color:var(--out)}.v01-amt input.in{color:var(--in)}.v01-amt input.vide{color:var(--trait)}
.v01-amt small{font-size:14px;color:var(--sec)}
.v01-rec{background:var(--pan);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
.v01-rec h3{font-size:13px;color:var(--val);font-weight:700;display:flex;gap:5px;align-items:center}
.v01-seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--bordm);border-radius:10px;overflow:hidden;background:var(--page)}
.v01-seg button{height:40px;font-size:14px;font-weight:600;border-left:1px solid var(--bord);color:var(--txt)}
.v01-seg button:first-child{border-left:0}
.v01-seg button.on{background:var(--act);color:var(--acttx)}
.v01-ft{flex:none;display:flex;justify-content:space-between;align-items:center;padding:10px;border-top:1px solid var(--bord);margin-top:auto}
/* ================= v01s : le genre d'abord, simplifié (D426) ================= */
.v1s-b{flex:1;min-height:0;padding:10px 10px 8px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.v1s-b.sc{overflow-y:auto}
.v1s-card{border:1.5px solid var(--bordm);border-radius:14px;padding:8px 12px 10px;background:var(--page);flex:none}
.v1s-card.out{border-color:var(--outap)}.v1s-card.in{border-color:var(--inap)}
.v1s-c1{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px}
.v1s-nm{font-size:16px;font-weight:700;color:var(--val);display:inline-flex;gap:6px;align-items:center;min-width:0}
.v1s-nm .sm-i{color:var(--trait)}
.v1s-nm.ph{color:var(--trait);font-weight:600}
.v1s-amt{display:flex;align-items:center;height:56px;font-family:'IBM Plex Mono',monospace;font-size:44px;font-weight:600;letter-spacing:-.02em;color:var(--val)}
.v1s-amt.out{color:var(--out)}.v1s-amt.in{color:var(--in)}
.v1s-amt input{font:inherit;letter-spacing:inherit;color:inherit;padding:0}
.v1s-amt input.sel{background:var(--finbg);border-radius:6px}
.v1s-amt .gh{color:var(--trait);font-weight:500}
.v1s-amt .car{width:3px;height:42px;border-radius:2px;background:var(--fin);margin:0 1px;flex:none}
.v1s-amt small{font-family:'Source Sans 3',sans-serif;font-size:14px;color:var(--sec);margin-left:auto;font-weight:400;letter-spacing:0}
.v1s-lk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--val);margin-top:7px;flex-wrap:wrap}
.v1s-lk .sm-i{color:var(--fin)}
.v1s-lk>span.t{flex:1;min-width:0}
.v1s-hab{flex:none}
.v1s-hab h3{font-size:11px;letter-spacing:.05em;color:var(--sec);font-weight:700;margin:0 0 4px 2px}
.v1s-hg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.v1s-hc{height:46px;border:1px solid var(--bord);border-radius:12px;padding:0 6px;display:flex;align-items:center;gap:6px;min-width:0;background:var(--page)}
.v1s-hc .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--cb);color:var(--ct);flex:none}
.v1s-hc div{min-width:0;display:flex;flex-direction:column}
.v1s-hc div b{font-size:13px;color:var(--val);white-space:nowrap}
.v1s-hc div span{font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600}
.v1s-hc div span.out{color:var(--out)}.v1s-hc div span.in{color:var(--in)}
.v1s-side{border-radius:14px;padding:5px 6px 6px;flex:none}
.v1s-side.out{background:var(--outbg)}.v1s-side.in{background:var(--inbg)}
.v1s-lab{font-size:15px;font-weight:700;display:flex;align-items:center;gap:4px;margin:0 0 4px 4px}
.v1s-side.out .v1s-lab{color:var(--out)}.v1s-side.in .v1s-lab{color:var(--in)}
.v1s-lab small{font-size:12px;font-weight:400;color:var(--sec);margin-left:6px}
.v1s-g{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.v1s-t{height:54px;border-radius:11px;background:var(--page);border:1px solid var(--bord);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;padding:0 2px;font-weight:600;color:var(--val);line-height:1.1}
.v1s-t .ic{color:var(--cseg)}
.v1s-rb{display:flex;align-items:center;gap:10px;height:40px;border:1px dashed var(--bordm);border-radius:12px;padding:0 12px;font-weight:600;color:var(--val);font-size:14px;flex:none}
.v1s-rb span{font-weight:400;color:var(--sec);font-size:13px}
.v1s-sel{display:flex;align-items:center;gap:8px;height:48px;border-radius:14px;padding:0 6px 0 12px;font-weight:700;font-size:15px;flex:none}
.v1s-sel.out{background:var(--outbg);color:var(--out)}.v1s-sel.in{background:var(--inbg);color:var(--in)}
.v1s-sel.neu{border:1px dashed var(--bordm);color:var(--val)}
.v1s-sel .g{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:10px;background:var(--page);color:var(--val);border:2px solid currentColor}
.v1s-sel.out .g{border-color:var(--out)}.v1s-sel.in .g{border-color:var(--in)}
.v1s-sel .g .ic{color:var(--cseg)}
.v1s-sel em{font-style:normal;font-weight:400;font-size:13px;color:var(--sec)}
.v1s-sel button{margin-left:auto;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--bordm);background:var(--page);color:var(--val);font-weight:600;font-size:14px}
.v1s-rec{background:var(--pan);border-radius:14px;padding:9px 10px;display:flex;flex-direction:column;gap:8px;flex:none}
.v1s-rec .sm-row>small{width:52px}
.v1s-rc.on{background:var(--act);color:var(--acttx);border-color:var(--act)}
.v1s-ft{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--bord);background:var(--page)}
.v1s-kb{flex:none;background:#D1D4DA;padding:8px 6px 14px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:46px;gap:6px}
.v1s-kb span{background:#fff;border-radius:7px;display:grid;place-items:center;font-size:22px;color:#111;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.v1s-kb .del{grid-row:span 2;background:#ABB0BA}
.v1s-kb .ok{grid-row:span 2;background:#3A3A3C;color:#fff;font-size:15px;font-weight:700;display:flex;flex-direction:column;gap:2px}
.v1s-kb .ok small{font-size:11px;font-weight:400;opacity:.8}
.v1s-kb .z{grid-column:span 2}
.v1s-pl{flex:none;background:var(--page);border-top:1px solid var(--bordm);border-radius:16px 16px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.14);padding:10px 12px 14px;display:flex;flex-direction:column;gap:6px}
.v1s-pl h4{font-size:15px;color:var(--val);display:flex;justify-content:space-between;align-items:center}
.v1s-pl h4 small{font-size:12px;font-weight:400;color:var(--sec)}
.v1s-q{height:40px;border:1px solid var(--bordm);border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--sec)}
.v1s-q input{flex:1;font-size:15px;min-width:0}
.v1s-pc{display:flex;align-items:center;gap:10px;height:52px;border-bottom:1px solid var(--bord);padding:0 6px}
.v1s-pc.on{background:var(--inbg);border-radius:10px;border-color:transparent}
.v1s-pc .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--cb);color:var(--ct);flex:none}
.v1s-pc div{flex:1;min-width:0;display:flex;flex-direction:column}
.v1s-pc div b{font-size:14px;color:var(--val)}.v1s-pc div span{font-size:12px;color:var(--sec)}
.v1s-pc .n{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--val)}
.v1s-dir{font-size:12px;font-weight:700;padding:2px 6px;border-radius:7px;white-space:nowrap}
.v1s-dir.in{background:var(--inbg);color:var(--in)}.v1s-dir.out{background:var(--outbg);color:var(--out)}
.v1s-pc.on .v1s-dir.in{background:var(--page)}
.v1s-plok{display:flex;justify-content:flex-end}
/* tableau des touchers (planche, hors téléphone) */
.v1s-tab{border-collapse:collapse;font-size:13px;background:#fff;margin:6px 0 4px;max-width:1100px}
.v1s-tab th,.v1s-tab td{border:1px solid #ccc;padding:4px 8px;text-align:left;vertical-align:top}
.v1s-tab th{background:#f1f1f1}
.v1s-tab td.n{font-family:'IBM Plex Mono',monospace;white-space:nowrap;text-align:center}
.v1s-tab td.g{font-weight:700;color:#2f6b3a}
.v1s-tab tr.tot td{font-weight:700;background:#f7f7f7}
.v1s-meth{font-size:12.5px;color:#444;max-width:1100px;margin:2px 0 4px}
.v1s-ch{font-size:13px;color:#222;max-width:1100px;margin:4px 0 10px 18px}
.v1s-ch li{margin:1px 0}
#v01s .pl-row{flex-wrap:wrap}
/* v01s passe 2 */
.v1s-t2{gap:2px}.v1s-t2 small{font-size:10.5px;font-weight:400;color:var(--sec);line-height:1}
.v1s-rep.sc{overflow-y:auto}
.v1s-hr{width:100%;text-align:left}
button.v01-rb{width:100%;text-align:left;flex:none}
.v1s-band{height:48px;flex:none}
.v1s-band.neu{border:1px dashed var(--bordm);color:var(--val)}
.v1s-card2{flex:none;padding:8px 12px 10px}
.v1s-card2.out{border-color:var(--outap)}.v1s-card2.in{border-color:var(--inap)}
.v1s-nm2{flex:1;min-width:0;display:inline-flex;align-items:center;gap:6px;min-height:32px;font-size:16px;font-weight:700;color:var(--val);text-align:left;white-space:nowrap;overflow:hidden}
.v1s-nm2 svg{color:var(--trait);flex:none}
.v1s-nm2.ph{color:var(--trait);font-weight:600}
.v1s-dt{height:30px;padding:0 8px;font-size:12.5px}
.v1s-neuf{background:transparent;border:1.5px dashed var(--bordm);color:var(--sec)}
.v1s-qui{display:flex;align-items:center;gap:6px;flex:none;overflow-x:auto;padding:0 2px}
.v1s-qui>small{font-size:12px;color:var(--sec);font-weight:600;flex:none;margin-right:2px}
.v1s-plus{border-style:dashed;color:var(--sec)}
.v1s-ach2{flex:none;display:flex;flex-direction:column;gap:6px}
.v1s-lb{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sec);font-weight:600;margin-left:2px}
.v1s-art{display:flex;align-items:center;gap:8px;height:36px;border:1px solid var(--bord);border-radius:10px;padding:0 10px;font-size:13.5px;color:var(--val)}
.v1s-art span{margin-left:auto;color:var(--sec);display:inline-flex;align-items:center;gap:3px;font-size:13px}
.v1s-rec2{flex:none}
.v1s-hab2{flex:none;background:var(--pan);border-radius:12px;padding:9px 10px;margin-top:0}
.v1s-pv{font-size:13px;color:var(--val);font-weight:600}
.v1s-b+.v1s-ft{box-shadow:0 -8px 12px -8px rgba(0,0,0,.18);position:relative}
.v1s-kb2{flex:none;height:300px;background:#E8EAED;display:flex;flex-direction:column}
.v1s-kb2 .g{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:6px;padding:8px 6px 4px}
.v1s-kb2 span{background:#fff;border-radius:8px;display:grid;place-items:center;font-size:24px;color:#202124;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.v1s-kb2 span.f{background:#D3D6DB;font-size:22px}
.v1s-kb2 span.ok{background:#3C4043;color:#fff}
.v1s-kb2 .nav{height:34px;flex:none;display:flex;align-items:center;justify-content:center}
.v1s-kb2 .nav small{font-size:10.5px;color:#5F6368}
.v1s-pl2{position:absolute;left:0;right:0;bottom:0;background:var(--page);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);padding:6px 12px 14px;display:flex;flex-direction:column;gap:6px}
.v1s-grip{display:block;width:40px;height:4px;border-radius:2px;background:var(--bordm);margin:2px auto 2px}
.v1s-pl2 h4{font-size:16px;color:var(--val);display:flex;justify-content:space-between;align-items:center}
.v1s-pl2 h4 button{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--val);border:1px solid var(--bord)}
.v1s-b.sc{gap:7px}
.v1s-b.sc .v1s-band{height:42px}
.v1s-b.sc .v1s-amt{height:44px;font-size:38px}
.v1s-b.sc .v1s-card2{padding:6px 12px 8px}

/* ================= v02 : ± sur le montant ================= */
.v02-b{flex:1;display:flex;flex-direction:column;padding:10px 12px 0;gap:10px;overflow:hidden}
.v02-hero{display:flex;gap:12px;align-items:stretch;background:var(--pan);border-radius:16px;padding:10px}
.v02-pm{display:flex;flex-direction:column;width:92px;border-radius:12px;overflow:hidden;border:1px solid var(--bordm);flex:none}
.v02-pm button{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:14px;color:var(--txt);background:var(--page)}
.v02-pm button b{font-size:24px;line-height:1;font-family:'IBM Plex Mono',monospace}
.v02-pm button.out.on{background:var(--outap);color:#2b1f05}
.v02-pm button.in.on{background:var(--inap);color:#fff}
.v02-pm button+button{border-top:1px solid var(--bordm)}
.v02-am{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0}
.v02-am input{font-family:'IBM Plex Mono',monospace;font-size:42px;font-weight:600;width:100%;text-align:right;letter-spacing:-.03em}
.v02-am input.out{color:var(--out)}.v02-am input.in{color:var(--in)}.v02-am input.vide{color:var(--trait)}
.v02-am-s{text-align:right;font-size:14px;color:var(--sec)}
.v02-q{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--val);padding:4px 2px}
.v02-q input{flex:1;font-size:17px;color:var(--val);font-weight:600;min-width:0}
.v02-q input::placeholder{color:var(--sec);font-weight:400}
.v02-gr{display:flex;align-items:flex-start;gap:6px}
.v02-gr>b{flex:none;width:68px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:3px;height:34px}
.v02-gr.out>b{color:var(--out)}.v02-gr.in>b{color:var(--in)}.v02-gr.nt>b{color:var(--sec)}
.v02-gr div{display:flex;flex-wrap:wrap;gap:5px}
.v02-gr button{height:34px;padding:0 9px 0 7px;border-radius:10px;background:var(--page);border:1px solid var(--bordm);font-size:13px;font-weight:600;display:inline-flex;gap:5px;align-items:center;color:var(--val)}
.v02-gr.out button{border-left:4px solid var(--outap)}.v02-gr.in button{border-left:4px solid var(--inap)}.v02-gr.nt button{border-style:dashed}
.v02-gr button .ic{color:var(--cseg)}
.v02-gr button.on{background:var(--cb);color:var(--ct);border-color:var(--cb)}.v02-gr button.on .ic{color:var(--ct)}
.v02-rep{border:1px solid var(--bordm);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.v02-rep-h{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--val);font-size:15px;min-height:30px}
.v02-rep-h small{font-size:12px;font-weight:600;color:var(--sec);border:1px solid var(--bordm);border-radius:99px;padding:1px 7px}
.v02-sw{margin-left:auto;width:48px;height:28px;border-radius:99px;background:var(--rai);border:1px solid var(--bordm);position:relative}
.v02-sw::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--page);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.v02-sw.on{background:var(--val);border-color:var(--val)}.v02-sw.on::after{left:23px}
.v02-kb{flex:none;background:var(--rai);padding:6px 4px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.v02-kb span{height:44px;border-radius:7px;background:var(--page);display:grid;place-items:center;font-size:20px;color:var(--val);font-family:'IBM Plex Mono',monospace}
.v02-kb span.k2{background:var(--pan);font-size:14px;font-family:inherit}
.v02-kb span.ent{background:var(--act);color:var(--acttx);font-size:14px;font-weight:700;font-family:inherit;grid-row:span 2;height:auto;gap:2px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.v02-ft{flex:none;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-top:1px solid var(--bord);margin-top:auto}

/* ================= v03 : phrase à trous ================= */
.v03-hd{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.v03-hd button{width:36px;height:36px;display:grid;place-items:center;color:var(--val);border-radius:8px}
.v03-hd .sm-doc{border:1px solid var(--bordm)}
.v03-s{flex:none;padding:8px 14px 0;font-size:26px;line-height:1.8;color:var(--val);font-weight:600;letter-spacing:-.01em}
.v03-t{margin:0 1px;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 10px;border-radius:10px;line-height:1.35;border:2px solid transparent;vertical-align:baseline;white-space:nowrap}
.v03-t.out{background:var(--outap);color:#2b1f05;min-width:120px}
.v03-t.in{background:var(--inap);color:#fff;min-width:120px}
.v03-t.m{font-family:'IBM Plex Mono',monospace;background:var(--rai);font-weight:600;min-width:150px}
.v03-t.q{background:var(--cb);color:var(--ct)}
.v03-t.r{background:var(--pan);color:var(--fin);border-color:var(--fin);font-size:22px}
.v03-t.d{background:var(--pan);font-family:'IBM Plex Mono',monospace;font-size:21px;color:var(--val);border-color:var(--bordm)}
.v03-t.p{background:var(--pan);color:var(--val);border-color:var(--bordm);font-size:21px}
.v03-t.vide{background:var(--pan);border:2px dashed var(--trait);color:var(--sec);font-weight:600}
.v03-t.act{box-shadow:0 0 0 3px var(--page),0 0 0 5px var(--val)}
.v03-nm{margin:6px 14px 0;display:flex;align-items:center;gap:8px;height:40px;border-bottom:1px solid var(--bordm);color:var(--val);font-size:16px;font-weight:600}
.v03-nm span{color:var(--sec);font-size:13px;font-weight:600;width:36px}
.v03-res{margin:10px 14px 0;display:flex;flex-direction:column;gap:8px}
.v03-res .sm-fold{margin-top:2px}
.v03-tray{flex:none;margin-top:auto;background:var(--pan);border-top:1px solid var(--bord);padding:10px 10px 12px;border-radius:16px 16px 0 0}
.v03-tray h4{font-size:13px;color:var(--val);font-weight:700;margin:0 0 8px 2px;display:flex;gap:5px;align-items:center}
.v03-op{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.v03-op button{height:60px;border-radius:12px;background:var(--page);border:1px solid var(--bord);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:600;color:var(--val);line-height:1.1;text-align:center}
.v03-op button.on{background:var(--val);color:var(--page);border-color:var(--val)}
.v03-op button.o{border-top:4px solid var(--outap)}.v03-op button.i{border-top:4px solid var(--inap)}.v03-op button.n{border-style:dashed}
.v03-op button.o.on{background:var(--outap);color:#2b1f05;border-color:var(--outap)}.v03-op button.i.on{background:var(--inap);color:#fff;border-color:var(--inap)}
.v03-go{display:flex;gap:8px;margin-top:10px}
.v03-go .sm-go{flex:1;justify-content:center}

/* ================= v04 : habituels en un toucher ================= */
.v04-b{flex:1;overflow:hidden;display:flex;flex-direction:column}
.v04-search{margin:10px 10px 6px;height:44px;border-radius:12px;background:var(--pan);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--sec)}
.v04-search input{flex:1;font-size:16px;color:var(--val)}
.v04-new{margin:2px 10px 8px;border-radius:14px;overflow:hidden;border:1px solid var(--bord)}
.v04-nr{display:grid;grid-template-columns:34px repeat(5,1fr);gap:4px;padding:5px 5px}
.v04-nr.out{background:var(--outbg)}.v04-nr.in{background:var(--inbg)}
.v04-nr>b{display:grid;place-items:center}
.v04-nr.out>b{color:var(--out)}.v04-nr.in>b{color:var(--in)}
.v04-nr button{height:54px;border-radius:10px;background:var(--page);border:1px solid var(--bord);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--val);letter-spacing:-.01em}
.v04-nr button .ic{color:var(--cseg)}
.v04-nr button.n{border-style:dashed;grid-column:span 2}
.v04-sec{font-size:12px;font-weight:700;color:var(--sec);padding:6px 12px 4px;letter-spacing:.03em}
.v04-row{display:flex;align-items:center;gap:10px;padding:7px 12px;border-top:1px solid var(--bord);min-height:52px}
.v04-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--cb);color:var(--ct);flex:none}
.v04-nm{flex:1;min-width:0}
.v04-nm b{display:block;color:var(--val);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v04-nm span{font-size:12px;color:var(--sec);display:flex;gap:4px;align-items:center}
.v04-am{font-size:14px;font-weight:600;padding:3px 8px;border-radius:8px}
.v04-am.out{color:var(--out);background:var(--outbg)}.v04-am.in{color:var(--in);background:var(--inbg)}
.v04-open{margin:4px 8px 6px;border:2px solid var(--val);border-radius:16px;padding:10px;background:var(--page);display:flex;flex-direction:column;gap:8px}
.v04-open .v04-row{border:0;padding:0;min-height:0}
.v04-ed{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--val)}
.v04-ed input{font-family:'IBM Plex Mono',monospace;font-size:36px;font-weight:600;width:240px;padding:0 4px}
.v04-ed input.out{color:var(--out)}.v04-ed input.in{color:var(--in)}
.v04-ed small{font-size:12px;color:var(--sec);margin-left:auto}
.v04-seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--bordm);border-radius:10px;overflow:hidden}
.v04-seg button{height:40px;font-size:14px;font-weight:600;border-left:1px solid var(--bord);color:var(--txt);display:flex;align-items:center;justify-content:center;gap:3px}
.v04-seg button:first-child{border-left:0}
.v04-seg button.on{background:var(--act);color:var(--acttx)}
.v04-act{display:flex;justify-content:space-between;align-items:center;gap:6px}
.v04-nmi{font-size:16px;font-weight:700;color:var(--val);border-bottom:1px solid var(--bordm);width:100%;padding:2px 0 4px;margin-bottom:2px}
.v04-done{margin:4px 8px 6px;border:2px solid var(--inap);border-radius:16px;padding:10px;background:var(--inbg);display:flex;flex-direction:column;gap:8px}

/* ================= v05 : deux côtés ================= */
.v05-amt0{flex:none;display:flex;align-items:baseline;justify-content:flex-end;gap:8px;padding:8px 14px;border-bottom:1px solid var(--bord)}
.v05-amt0 input{font-family:'IBM Plex Mono',monospace;font-size:38px;font-weight:600;flex:1;min-width:0;text-align:right}
.v05-amt0 input.vide{color:var(--trait)}.v05-amt0 input.out{color:var(--out)}.v05-amt0 input.in{color:var(--in)}
.v05-amt0 small{font-size:14px;color:var(--sec)}
.v05-b{flex:1;display:flex;overflow:hidden;flex-direction:column}
.v05-two{flex:1;display:flex;overflow:hidden}
.v05-col{display:flex;flex-direction:column;padding:10px 8px;gap:7px;overflow:hidden;flex:1}
.v05-col.in{background:var(--inbg)}.v05-col.out{background:var(--outbg)}
.cave .v05-col.in{background:#141C15;box-shadow:inset 3px 0 0 var(--inap)}.cave .v05-col.out{background:#1E1711;box-shadow:inset 3px 0 0 var(--outap)}
.v05-h{display:flex;align-items:center;gap:6px;font-size:19px;font-weight:700;padding:2px 2px 4px}
.v05-col.in .v05-h,.v05-strip.in{color:var(--in)}.v05-col.out .v05-h,.v05-strip.out{color:var(--out)}
.sg{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:'IBM Plex Mono',monospace;font-size:22px;flex:none}
.in .sg{background:var(--inap)}.out .sg{background:var(--outap);color:#2b1f05}
.v05-gb{min-height:52px;border-radius:12px;background:var(--page);display:flex;align-items:center;gap:8px;padding:0 10px;font-size:15px;font-weight:700;color:var(--val);border:1px solid var(--bord)}
.v05-gb .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--cb);color:var(--ct);flex:none}
.v05-rb{flex:none;display:flex;align-items:center;gap:8px;height:52px;padding:0 14px;font-weight:700;color:var(--val);border-top:1px dashed var(--bordm);background:var(--page)}
.v05-rb span{font-weight:400;color:var(--sec);font-size:13px}
.v05-strip{flex:none;display:flex;align-items:center;gap:8px;height:46px;padding:0 10px;font-weight:700;font-size:15px}
.v05-strip.in{background:var(--inbg)}.v05-strip.out{background:var(--outbg)}
.v05-strip button{margin-left:auto;height:36px;padding:0 10px;border-radius:10px;border:1px solid currentColor;background:var(--page);font-weight:600;display:inline-flex;gap:4px;align-items:center}
.v05-sel{display:flex;align-items:center;gap:10px;background:var(--page);border-radius:14px;padding:6px 6px 6px 10px}
.v05-sel b{font-size:17px;color:var(--val);flex:1}
.v05-sel .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--cb);color:var(--ct)}
.v05-sel button{height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--bordm);font-size:14px;font-weight:600;color:var(--val)}
.v05-q{background:var(--page);border-radius:12px;padding:0 12px;height:42px;display:flex;align-items:center;gap:8px;color:var(--sec)}
.v05-q input{font-size:16px;color:var(--val);width:100%;font-weight:600}
.v05-rt{background:var(--page);border-radius:14px;padding:3px}
.v05-rt>div{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 8px;border-radius:10px;font-size:15px;color:var(--val)}
.v05-rt .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--bordm);flex:none}
.v05-rt>div.on{background:var(--rai);font-weight:700}
.v05-rt>div.on .rd{border:6px solid var(--val)}
.v05-rt .sm-chip{margin-left:auto;height:32px}
.v05-ft{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px;padding-top:4px}
.v05-card{background:var(--page);border-radius:12px;padding:8px 10px}

/* ================= v06 : qui paie qui ================= */
.v06-dia{flex:none;position:relative;background:var(--pan);border-bottom:1px solid var(--bord)}
.v06-dia svg.f{position:absolute;inset:0}
.v06-node{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--val);transform:translate(-50%,-50%);text-align:center;line-height:1.1}
.v06-node small{font-size:12px;font-weight:600;color:var(--sec)}
.v06-node .c{border-radius:50%;display:grid;place-items:center;background:var(--page);border:2px solid var(--bordm);color:var(--val);margin-bottom:2px}
.v06-node.me .c{width:84px;height:84px;background:var(--act);color:var(--acttx);border:0}
.v06-node.k .c{width:62px;height:62px;background:var(--cb);color:var(--ct);border:0}
.v06-node.o .c{width:48px;height:48px}
.v06-tag{position:absolute;transform:translate(-50%,-50%);font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:18px;padding:2px 10px;border-radius:10px;white-space:nowrap}
.v06-tag.out{background:var(--outap);color:#2b1f05}.v06-tag.in{background:var(--inap);color:#fff}
.v06-flip{position:absolute;transform:translate(-50%,-50%);height:36px;padding:0 10px;border-radius:99px;background:var(--page);border:1px solid var(--bordm);display:inline-flex;align-items:center;gap:4px;color:var(--val);font-size:13px;font-weight:600}
.v06-b{flex:1;padding:4px 12px 0;display:flex;flex-direction:column;overflow:hidden;gap:2px}
.v06-r{display:flex;align-items:center;gap:10px;min-height:52px;border-bottom:1px solid var(--bord)}
.v06-r>.ic{color:var(--sec);width:24px;display:grid;place-items:center;flex:none;font-size:13px;font-weight:600}
.v06-r input{flex:1;font-size:16px;color:var(--val);font-weight:600;min-width:0}

function frise(st){
 const W=100/13,open=st.fin==='sans fin',f0=st.from||0,L=(0.7+f0)*W,R=open?100:11.75*W;
 let x='<div class="fr"><div class="fr-top"><span class="fr-pill">'+(open?(f0?'dès 01.12.26 · sans fin':'dès 22.11.26 · sans fin'):'22.11.26 – 22.10.27 · 12 fois')+'</span></div><div class="fr-tr">';
 x+='<div class="fr-fr'+(open?' open':'')+'" style="left:'+L+'%;width:'+(R-L)+'%"><span class="fr-h l"></span>'+(open?'':'<span class="fr-h r"></span>')+'</div>';
 for(let i=f0;i<f0+12;i++)x+='<span class="fr-d '+st.s+(st.apayer?' apay':'')+'" style="left:'+((i+0.7)*W)+'%"></span>';
 x+='</div><div class="fr-g">'+['nov.','janv.','mars','mai','juil.','sept.','nov.'].map((m,i)=>'<span class="'+(i===1?'y':'')+'" style="left:'+((i*2+0.5)*W)+'%">'+(i===1?'janv. 27':m)+'</span>').join('')+'</div></div>';
 return x;
}

 h+='<div class="v07-q">'+I('pen',16)+'<input placeholder="Nom" value="'+(st?st.q:'')+'" aria-label="Nom"></div>';

 h+='<div class="v07-rt">'+['une','mois','trim','an'].map(x=>'<button class="'+(r===x?'on':'')+'">'+(x!=='une'?I('repeat',13):'')+RS[x]+'</button>').join('')+'</div>';
 h+='<div class="v07-yr"><span>2026</span><span>2027</span></div><div class="v07-g'+(rec?'':' strip')+'">';
 const endIdx=rec?11:0;
 M.forEach((m,i)=>{
  const on=st&&(rec?(i>=(st.from||0)&&i<=endIdx):i===0);
  h+='<div class="v07-m'+(i===0?' now':'')+'"><b>'+(rec?m:m.slice(0,1).toUpperCase())+'</b>';
  if(on)h+='<span class="bar '+st.s+(st.apayer?' apay':'')+'"></span>'+(rec?'<span class="v '+st.s+'">'+sgn(st).replace(',00','')+'</span>':'');
  else h+='<span></span>'+(rec?'<span class="v"></span>':'');

 });
 h+='</div>';
 if(rec)h+='<div class="v07-fr">'+frise(st)+'</div>';
 if(st&&st.apayer){h+='<div class="v07-sum"><span class="sm-chip">Payé</span><span class="sm-chip on">'+I('check',14)+'À payer · le 1.12</span><span class="sm-chip">'+I('bank',14)+'Banque '+I('chev',12)+'</span>'+sumTxt(st)+'</div><div class="v07-sum"><small>rien de payé aujourd’hui · novembre inchangé · décembre : prévu, pas dépensé</small></div>';
  return h+'<div class="v07-ft"><span class="sm-mm">'+BARS()+' Mon mois <span class="sm-mmv prevu">prévu</span></span>'+go(st,'À payer <b>−400,00</b>')+'</div>';}
 if(st)h+='<div class="v07-sum">'+regl(st,true)+(rec?sumTxt(st):'')+'</div>';
 return h+'<div class="v07-ft">'+mm(st)+go(st,st?undefined:'Enregistrer',!st)+'</div>';

 h+='<div class="v08-rt">'+['une','mois','trim','an'].map(x=>'<button class="'+(r===x?'on':'')+'">'+(x!=='une'?I('repeat',13):'')+RS[x]+'</button>').join('')+'</div>';
 if(st){
  h+='<div class="v08-x">';

  if(k==='c')h+=frise(st);
  h+='<div class="sm-row">'+mm(st)+'</div></div>';
 }
 h+='<div class="v08-pad">';
 ['1','2','3','4','5','6','7','8','9',',','0','⌫'].forEach((x,i)=>{h+='<span style="grid-column:'+(i%3+1)+';grid-row:'+(Math.floor(i/3)+1)+'">'+(x==='⌫'?I('del',22):x)+'</span>';});
 /* La touche contraire au genre se grise ou se renomme : genre et sens ne peuvent pas se contredire. */
 const def=st?st.s:'';
 let ko,ki;
 if(!st){ko='<span class="vk out" style="grid-row:1/3"><b>−</b>Payé</span>';ki='<span class="vk in" style="grid-row:3/5"><b>+</b>Reçu</span>';}
 else if(st.g==='apport'){ko='<span class="vk out" style="grid-row:1/3"><b>−</b>Retiré<small>→ Pour moi</small></span>';ki='<span class="vk in def" style="grid-row:3/5"><b>+</b>Reçu<small>'+I('enter',11)+'Entrée</small></span>';}
