<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Carnets · jouable passe 4 (amélioré 26.11)</title>
<!-- Jouable passe 4 (25.11 nuit). Moteur repris tel quel de jouable/m4b.html (Claude par sample, journal db, consigne et validation des citations,
     lecture auto, Organisé par défaut, « + », Aide, exemples) ; interface greffée selon la recette des trois juges (JOUABLE-P4.md).
     Capacités à déclarer à la publication : capabilities: { sample: {}, dictation: {}, db: { rules: [ { path: "journal", read: "admin", write: "admin" }, { path: "liens", read: "view", write: "admin" }, { path: "demandes", read: "admin", write: "admin" } ] } }
     26.11 : liens/<id> lus par Claude (session pilote), demandes/<id> écrites par la page (work/missions/2026-11-26-liens/LIENS.md).
     Les id des <symbol> commencent par « i- » ; aucun id d élément ne commence par « i- ». -->
<style>
:root{color-scheme:dark;--bg:#000;--card:#1c1c1f;--s2:#2a2a2e;--line:#424248;--mut:#a3a3aa;--ink:#f1f1f3;--ia:#b9a3ff;--ok:#8fd17e;--bad:#ff8f80;--att:#e8bd5a;--fin:#7db8f5;--im:#aab3c0;--car:#8ab4f8;
--barre:#0e0e10;--bord:#26262a;--bas:#17171a;--on:#2c2c31;--pop:#232327;--feuille:#1c1c1f;--lienbg:#1b2433;--ombre:rgba(0,0,0,.6);--voile:rgba(0,0,0,.6);--sur-plein:#000;
--iabg:color-mix(in srgb,var(--ia) 17%,var(--card));--okbg:color-mix(in srgb,var(--ok) 15%,var(--card));--badbg:color-mix(in srgb,var(--bad) 15%,var(--card));--attbg:color-mix(in srgb,var(--att) 15%,var(--card));--surl:color-mix(in srgb,var(--ia) 30%,var(--bg))}
@media (prefers-color-scheme: light){
:root{color-scheme:light;--bg:#fff;--card:#f2f2f5;--s2:#e3e3e8;--line:#c5c5cc;--mut:#5d5d66;--ink:#121214;--ia:#6a4bd6;--ok:#2e7a22;--bad:#bf3324;--att:#8c6000;--fin:#1d66b8;--im:#66707c;--car:#1a73e8;
--barre:#f6f6f8;--bord:#e0e0e5;--bas:#ececf0;--on:#fff;--pop:#fff;--feuille:#fff;--lienbg:#e8f0fb;--ombre:rgba(0,0,0,.18);--voile:rgba(0,0,0,.35);--sur-plein:#fff;--surl:color-mix(in srgb,var(--ia) 20%,var(--bg))}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overscroll-behavior:none}
body{font:16px/1.35 "Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
svg{flex:none}
q{quotes:none}
[hidden]{display:none!important}
#app{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100dvh);max-width:640px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.vue{display:none;flex:1;min-height:0;flex-direction:column;position:relative}
.vue.on{display:flex}
/* barre du haut : retour · bascule légère · annuler, refaire, fini */
.m4b-top{height:52px;flex:none;display:flex;align-items:center;padding:0 4px;margin-top:env(safe-area-inset-top)}
.m4b-ic{width:44px;height:44px;display:grid;place-items:center;color:var(--ink);flex:none;border-radius:12px}
.m4b-ic svg{width:24px;height:24px}
.m4b-esp{width:44px;flex:none}
.m4b-bas{margin:0 auto;display:flex;border-radius:999px;background:var(--bas)}
.m4b-bas button{height:44px;display:flex;align-items:center;gap:5px;padding:0 13px;border-radius:999px;font-size:14px;font-weight:700;color:var(--mut)}
.m4b-bas button.on{background:var(--on);color:var(--ink)}
.m4b-bas button.on.ia{color:var(--ia)}
.m4b-bas i{width:7px;height:7px;border-radius:50%;background:var(--ia);display:inline-block}
.m4b-bas i.att{background:var(--att)}
.edition-seule{display:none}
body.edite .edition-seule{display:grid}
body.edite .hors-edition{display:none}
#defil{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;position:relative}
/* la note */
.m4b-titre{font-size:20px;font-weight:800;padding:6px 22px 0;line-height:1.3;outline:none;word-break:break-word}
.m4b-titre[contenteditable]:empty:before{content:"Titre";color:var(--mut)}
.m4b-meta{font-size:14px;color:var(--mut);padding:4px 22px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.m4b-meta .sep{width:1px;height:14px;background:var(--line)}
.m4b-meta .ia{color:var(--ia)}
.m4b-meta .att{color:var(--att);font-weight:700}
.m4b-doc{padding:0 22px 96px;font-size:16px;line-height:1.75;outline:none;caret-color:var(--car);min-height:60%;word-break:break-word}
.m4b-doc > div,.m4b-doc > p{margin:0;min-height:1.75em}
.m4b-doc.vide:before{content:"Écris ici…";color:var(--mut);position:absolute;pointer-events:none}
.m4b-doc a{color:var(--fin);text-decoration:underline;text-underline-offset:4px}
.m4b-doc img{display:block;max-width:100%;max-height:260px;border-radius:12px;margin:6px 0 8px;object-fit:cover}
.m4b-doc .surl{background:var(--surl);border-radius:5px;box-shadow:0 0 0 5px var(--surl);margin:6px 0}
.m4b-doc .cb{display:inline-grid;place-items:center;width:20px;height:20px;border:2px solid var(--mut);border-radius:6px;vertical-align:-4px;margin-right:8px;cursor:pointer;font-size:14px;line-height:1;font-weight:800;color:var(--sur-plein)}
.m4b-doc .cb[data-c="1"]{background:var(--ok);border-color:var(--ok)}
.m4b-doc .cb[data-c="1"]:after{content:"✓"}
.m4b-doc div:has(> .cb[data-c="1"]){color:var(--mut);text-decoration:line-through}
::highlight(lu){text-decoration:underline;text-decoration-color:var(--ia);text-decoration-thickness:1.5px}
/* bulle d'un mot lu ou d'un lien */
.m4b-bulle{position:absolute;background:var(--on);border-radius:12px;padding:0 4px 0 12px;font-size:14px;line-height:1.3;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px var(--ombre);z-index:6;max-width:330px}
.m4b-bulle b{color:var(--att)}
.m4b-bulle .go{height:44px;display:flex;align-items:center;gap:4px;color:var(--ia);font-weight:700;padding:0 8px;border-left:1px solid var(--line);text-decoration:none}
.m4b-bulle .go svg{width:16px;height:16px}
.m4b-bulle:after{content:"";position:absolute;top:-6px;left:var(--fl,40px);width:12px;height:12px;background:var(--on);transform:rotate(45deg)}
/* outils au-dessus du clavier */
.m4b-outils{min-height:54px;flex:none;border-top:1px solid var(--bord);background:var(--barre);display:flex;align-items:center;justify-content:space-around;padding:0 4px env(safe-area-inset-bottom);position:relative}
.m4b-o{width:44px;height:44px;display:grid;place-items:center;color:var(--ink);opacity:.88;border-radius:12px}
.m4b-o svg{width:25px;height:25px}
.m4b-o.iao{color:var(--ia);opacity:1}
.m4b-o.on{background:var(--on);opacity:1}
.m4b-o.ecoute{background:var(--iabg);color:var(--ia);opacity:1}
.m4b-lit{height:44px;flex:1;margin:0 4px;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 10px;border-radius:12px;background:var(--iabg);color:var(--ia);font-size:14px;font-weight:700;min-width:0}
.m4b-lit span{display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.m4b-lit svg{width:16px;height:16px}
.m4b-lit .bar{height:3px;border-radius:2px;background:color-mix(in srgb,var(--ia) 25%,transparent);overflow:hidden;position:relative}
.m4b-lit .bar i{position:absolute;top:0;bottom:0;width:40%;background:var(--ia);animation:m4b-va 1.4s ease-in-out infinite}
@keyframes m4b-va{0%{left:-40%}100%{left:100%}}
@media (prefers-reduced-motion:reduce){.m4b-lit .bar i{animation:none;left:0;width:58%}}
.m4b-lit.att{background:var(--attbg);color:var(--att)}
.m4b-txtbtn{height:44px;display:flex;align-items:center;padding:0 10px;font-size:14px;font-weight:700;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;white-space:nowrap}
.m4b-txtbtn.att{color:var(--att);border-color:var(--att)}
.m4b-dicte{position:absolute;left:12px;right:12px;bottom:62px;background:var(--pop);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--mut);display:flex;gap:8px;align-items:center;box-shadow:0 6px 20px var(--ombre);z-index:3}
.m4b-dicte svg{width:18px;height:18px;color:var(--ia)}
/* menu de l'IA */
.m4b-voile-menu{position:absolute;inset:0;z-index:7}
.m4b-menu{position:absolute;left:10px;bottom:64px;width:300px;background:var(--pop);border-radius:16px;padding:6px;box-shadow:0 10px 30px var(--ombre);z-index:8}
.m4b-mi{display:flex;gap:12px;align-items:center;min-height:58px;padding:6px 10px;border-radius:12px;line-height:1.25;width:100%;text-align:left}
.m4b-mi+.m4b-mi{border-top:1px solid var(--s2)}
.m4b-mi svg{width:22px;height:22px;color:var(--ia)}
.m4b-mi b{display:block;font-weight:700}
.m4b-mi small{display:block;font-size:14px;color:var(--mut)}
.m4b-retour{position:absolute;left:50%;transform:translateX(-50%);bottom:66px;height:44px;display:flex;align-items:center;gap:6px;padding:0 16px;border-radius:999px;background:var(--on);color:var(--ia);font-size:14px;font-weight:700;box-shadow:0 6px 18px var(--ombre);white-space:nowrap;z-index:5;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.m4b-retour svg{width:18px;height:18px}
.m4b-toast{position:absolute;left:50%;transform:translateX(-50%);bottom:72px;background:var(--on);color:var(--ink);padding:10px 14px;border-radius:12px;font-size:14px;box-shadow:0 6px 18px var(--ombre);z-index:9;max-width:92%}
/* Organisé : la vue de l'IA */
.m4b-org{padding:0 14px 24px}
.m4b-org .m4b-titre,.m4b-org .m4b-meta{padding-left:8px;padding-right:8px}
.m4b-org .m4b-meta{padding-bottom:4px}
.m4b-range{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ia);font-weight:700;margin:0 0 6px 8px;min-height:44px;flex-wrap:wrap}
.m4b-range > svg{width:15px;height:15px}
.m4b-range .m4b-btn{margin-left:auto}
.m4b-range .lien{color:var(--ia);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:44px}
.m4b-range.ok{color:var(--ok)}
.m4b-chg{margin-left:auto;display:flex;align-items:center;gap:5px;height:44px;padding:0 12px;border-radius:999px;border:1px solid color-mix(in srgb,var(--ia) 45%,var(--bg));color:var(--ia);font-size:14px;font-weight:700}
.m4b-chg svg{width:15px;height:15px}
.m4b-frise{display:flex;align-items:center;margin:2px 0 10px}
.m4b-frise i{flex:1;height:4px;background:var(--line);min-width:6px}
.m4b-frise i.f{background:var(--fin)}
.m4b-frise b{font-size:14px;color:var(--mut);font-weight:700;padding:0 3px;white-space:nowrap}
.m4b-frise b.fait{color:var(--fin)}
.m4b-frise b.ici{background:var(--fin);color:var(--sur-plein);border-radius:999px;padding:3px 10px}
.m4b-frise b.ici.ok{background:var(--ok)}
.m4b-frise button.prop{border:1.5px dashed var(--ia);color:var(--ia);border-radius:999px;display:flex;align-items:center;gap:6px;height:44px;padding:0 10px 0 6px;font-size:14px;font-weight:700;white-space:nowrap}
.m4b-frise button.prop i{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--ia);background:transparent;min-width:0}
.m4b-fnote{font-size:14px;color:var(--mut);margin:-4px 0 10px;text-align:center}
.m4b-k{font-size:14px;font-weight:700;color:var(--mut);margin:0 4px 6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.m4b-src{font-size:14px;color:var(--mut)}
.m4b-src q{color:var(--ink)}
.m4b-r{width:15px;height:15px;color:var(--ia);vertical-align:-3px;margin-left:3px}
.m4b-tag{font-size:14px;font-weight:700;border-radius:6px;padding:0 6px;white-space:nowrap}
.m4b-tag.app{background:var(--s2);color:var(--ink);border:1px solid var(--line)}
.m4b-tag.ia{background:var(--iabg);color:var(--ia)}
.m4b-tag.ok{background:var(--okbg);color:var(--ok)}
.m4b-pistes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.m4b-p{border-radius:14px;padding:9px 10px;display:grid;grid-template-columns:30px 1fr;gap:2px 8px;align-items:center;line-height:1.2;min-height:64px;text-align:left;width:100%}
.m4b-p .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;grid-row:span 2}
.m4b-p .v{font-weight:700}
.m4b-p.oui{background:var(--okbg)}.m4b-p.oui .ic{background:var(--ok);color:var(--sur-plein)}
.m4b-p.q{background:var(--attbg)}.m4b-p.q .ic{color:var(--att);border:2px solid var(--att)}
.m4b-p.q .v{color:var(--att)}
.m4b-bloc{background:var(--card);border-radius:14px;padding:2px 12px;margin-bottom:10px}
.m4b-bloc.prop{border:1.5px dashed color-mix(in srgb,var(--ia) 70%,var(--bg))}
.m4b-bhead{display:flex;align-items:center;gap:8px;min-height:44px;border-bottom:1px solid var(--s2);font-weight:700}
.m4b-bhead .t{flex:1}
.m4b-opt{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--s2);min-height:44px;width:100%;text-align:left}
.m4b-opt:last-child{border-bottom:0}
.m4b-opt .t{font-weight:700;line-height:1.2}
.m4b-opt .m{font-size:14px;color:var(--mut);display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center}
.m4b-opt .m b{color:var(--ink)}
.m4b-opt .m b.cout{font-size:16px;font-weight:800;background:var(--s2);border-radius:999px;padding:1px 10px}
.m4b-opt .t,.m4b-p .v,.m4b-tache .t{font-size:17px}
.m4b-opt .btn{grid-row:span 2}
.m4b-opt.seule{grid-template-columns:1fr}
.m4b-conseille{font-size:14px;font-weight:700;color:var(--ia);background:var(--iabg);border-radius:6px;padding:0 6px}
.m4b-btn{height:44px;min-width:44px;border-radius:11px;border:1.5px solid var(--ink);background:transparent;font:inherit;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 12px;color:var(--ink);white-space:nowrap}
.m4b-btn.plein{background:var(--ink);color:var(--sur-plein)}
.m4b-btn.doux{border-color:var(--line);color:var(--mut)}
.m4b-btn svg{width:16px;height:16px}
.m4b-case{width:44px;height:44px;display:grid;place-items:center;flex:none;margin-right:-8px}
.m4b-case i{width:28px;height:28px;border-radius:8px;border:2px solid var(--ia)}
.m4b-tache{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px 10px 8px 12px;display:grid;grid-template-columns:26px 1fr auto;gap:2px 10px;align-items:center;margin-bottom:8px}
.m4b-tache.prop{border:1.5px dashed color-mix(in srgb,var(--ia) 70%,var(--bg))}
.m4b-tache .c{width:24px;height:24px;border:2px solid var(--ink);border-radius:7px;grid-row:span 2;display:grid;place-items:center;position:relative}
.m4b-tache .c:before{content:"";position:absolute;inset:-10px}
.m4b-tache .t{font-weight:700;line-height:1.2}
.m4b-tache .m{font-size:14px;color:var(--mut);display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center}
.m4b-tache .btn{grid-row:span 2}
.m4b-tache.faite{background:var(--okbg);border-color:transparent}
.m4b-tache.faite .c{background:var(--ok);border-color:var(--ok);color:var(--sur-plein)}
.m4b-tache.faite .t{color:var(--ok)}
.m4b-tache > svg{width:22px;height:22px;color:var(--ia);grid-row:span 2}
.m4b-conseil{background:var(--iabg);border-left:4px solid var(--ia);border-radius:6px 14px 14px 6px;padding:8px 12px;display:flex;gap:8px;line-height:1.35;margin-bottom:10px}
.m4b-conseil > svg{width:17px;height:17px;color:var(--ia);margin-top:2px}
.m4b-conseil small{display:block;font-size:14px;color:var(--mut);margin-top:2px}
.m4b-carte{background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:10px;line-height:1.35}
.m4b-carte.ok{background:var(--okbg)}
.m4b-carte.prop{border:1.5px dashed var(--ia)}
.m4b-carte h3{margin:0 0 4px;font-size:16px;font-weight:800;display:flex;gap:6px;align-items:center}
.m4b-carte h3 svg{width:18px;height:18px}
.m4b-cite{border-left:3px solid var(--ink);padding:2px 0 2px 9px;margin:6px 0;font-weight:600;display:block;text-align:left;width:100%}
.m4b-cite .m4b-src{display:flex;font-weight:400;align-items:center}
.m4b-ligne{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--s2);width:100%;text-align:left}
.m4b-ligne:first-child{border-top:0}
.m4b-ligne .tx{flex:1}
.m4b-hl{border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center;font-weight:700;line-height:1.3;margin:0 0 10px}
.m4b-hl > svg{width:20px;height:20px;align-self:flex-start;margin-top:1px}
.m4b-hl .t{flex:1}
.m4b-hl small{display:block;font-size:14px;font-weight:600;color:var(--ink)}
.m4b-hl.bad{background:var(--badbg);color:var(--bad)}
.m4b-lit-org{margin:0 8px 10px}
.m4b-vide{color:var(--mut);margin:6px 8px 12px;line-height:1.4}
.m4b-actions{display:flex;gap:8px;margin-top:10px}
.m4b-actions .m4b-btn{flex:1}
.m4b-cmp{display:grid;background:var(--card);border-radius:14px;padding:4px 10px;margin-bottom:10px;font-size:14px;line-height:1.25}
.m4b-cmp > *{padding:8px 4px;border-bottom:1px solid var(--s2);min-width:0;overflow-wrap:anywhere}
.m4b-cmp .hd{font-weight:800;font-size:16px;text-align:left;min-height:44px}
.m4b-cmp .hd small{display:block;font-size:14px;font-weight:700;color:var(--ok)}
.m4b-cmp .cr{color:var(--mut)}
.m4b-cmp .v{font-weight:600}
.m4b-cmp .v small{color:var(--ia);font-weight:700}
.m4b-cmp .v.win{background:var(--okbg);color:var(--ok);border-radius:8px}
.m4b-cmp .v.inc{color:var(--mut);font-weight:400}
/* pied d'Organisé : pas de champ, on écrit dans Mes notes */
.m4b-pied{flex:none;border-top:1px solid var(--bord);padding:8px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;background:var(--barre)}
.m4b-pied .m4b-btn{flex:1}
/* feuilles */
.m4b-voile{position:absolute;inset:0;background:var(--voile);z-index:10}
.m4b-feuille{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--feuille);border-radius:20px 20px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));z-index:11}
.m4b-poig{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.m4b-feuille h2{font-size:20px;margin:0;display:flex;align-items:center;gap:6px}
.m4b-feuille h2 svg{width:20px;height:20px;color:var(--ia)}
.m4b-feuille .sous{font-size:14px;color:var(--mut);margin:2px 0 6px}
.m4b-feuille .grp{font-size:14px;font-weight:700;color:var(--mut);margin:8px 0 0}
.m4b-ch{display:flex;gap:10px;align-items:center;min-height:50px;border-bottom:1px solid var(--s2)}
.m4b-ch .t{flex:1;line-height:1.25;min-width:0}
.m4b-ch .t small{display:block;font-size:14px;color:var(--mut)}
.m4b-ch.off .t{color:var(--mut)}
.m4b-ch.off .t small{color:var(--bad);font-weight:700}
.m4b-ch .s{height:44px;display:flex;align-items:center;gap:3px;font-size:14px;color:var(--mut);max-width:132px;min-width:0}
.m4b-ch .s q{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m4b-sw{width:46px;height:44px;flex:none;position:relative}
.m4b-sw:before{content:"";position:absolute;left:0;top:8px;width:46px;height:28px;border-radius:14px;background:var(--ia)}
.m4b-sw:after{content:"";position:absolute;top:11px;left:21px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.m4b-ch.off .m4b-sw:before{background:var(--line)}
.m4b-ch.off .m4b-sw:after{left:3px}
.m4b-feuille .rassure{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mut);margin:8px 0 0}
.m4b-feuille .rassure svg{width:16px;height:16px}
.m4b-feuille .pb{font-size:14px;color:var(--att);margin:8px 0 0}
.m4b-champ{width:100%;min-height:88px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:10px 12px;margin:8px 0 0;resize:none;outline:none}
.m4b-champ:focus{border-color:var(--ia)}
.m4b-reponse{margin:10px 0 0;line-height:1.45;white-space:pre-wrap}
/* liste des carnets */
.m4j-tete{padding:calc(14px + env(safe-area-inset-top)) 22px 8px;font-size:20px;font-weight:800}
.m4j-sous{padding:0 22px 10px;font-size:14px;color:var(--mut)}
.m4j-liste{flex:1;min-height:0;overflow-y:auto;padding:0 14px 16px}
.m4j-l{display:flex;gap:10px;align-items:center;width:100%;text-align:left;min-height:64px;padding:10px 10px;border-bottom:1px solid var(--s2)}
.m4j-l .t{flex:1;min-width:0}
.m4j-l b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m4j-l small{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mut);margin-top:2px}
.m4j-l small .sep{width:1px;height:12px;background:var(--line)}
.m4j-l i{width:8px;height:8px;border-radius:50%;background:var(--ia);flex:none}
.m4j-l svg{width:18px;height:18px;color:var(--mut)}
/* liste v01 (son 2) : coup d'œil, arbre par catégorie, priorité, état, ce qui attend */
.m4j-oeil{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:2px 0 8px}
.m4j-oeil div{border-radius:12px;padding:7px 8px;line-height:1.1;min-height:60px}
.m4j-oeil b{display:block;font-size:26px;font-weight:800}
.m4j-oeil span{font-size:14px}
.m4j-oeil .cherche{background:color-mix(in srgb,var(--fin) 18%,var(--bg));color:var(--fin)}
.m4j-oeil .decide{background:var(--attbg);color:var(--att)}
.m4j-oeil .note{background:var(--card);color:var(--mut)}
.m4j-oeil .resolu{background:var(--okbg);color:var(--ok)}
.m4j-puces{display:flex;gap:6px;align-items:center;padding:0 0 4px}
.m4j-puce{height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.m4j-puce.on{background:var(--ink);color:var(--sur-plein);border-color:var(--ink)}
.m4j-aide{margin-left:auto;font-size:13px;color:var(--mut);text-align:right;line-height:1.2;display:flex;align-items:center;gap:5px}
.m4j-aide i{width:4px;height:16px;border-radius:2px;background:var(--bad);flex:none}
.m4j-dn{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;background:var(--card);border-radius:10px;margin-top:8px;font-weight:800;font-size:17px;width:100%;text-align:left}
.m4j-dn .e{flex:1}
.m4j-dn .n,.m4j-sd .n{color:var(--mut);font-weight:700}
.m4j-dn.res{background:var(--okbg);color:var(--ok)}
.m4j-sd{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 10px 0 12px;font-weight:700;color:var(--fin);width:100%;text-align:left;white-space:nowrap;overflow:hidden}
.m4j-sd .s{font-weight:400;color:var(--mut);overflow:hidden;text-overflow:ellipsis;min-width:0}
.m4j-sd.res{color:var(--ok)}
.m4j-r{display:flex;gap:10px;align-items:center;min-height:62px;padding:6px 8px 6px 8px;margin-left:6px;border-left:4px solid transparent;border-radius:6px;width:calc(100% - 6px);text-align:left;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.m4j-r.haute{border-left-color:var(--bad)}
.m4j-r .ic{width:38px;height:38px;border-radius:10px;background:var(--card);display:grid;place-items:center;font-size:21px;flex:none}
.m4j-r .t{flex:1;min-width:0}
.m4j-r .ti{display:block;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m4j-r.basse .ti{color:var(--mut);font-weight:600}
.m4j-r .sub{display:flex;gap:5px;align-items:center;font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;margin-top:2px}
.m4j-r .sub .res{overflow:hidden;text-overflow:ellipsis;color:var(--ink);min-width:0}
.m4j-r .et{font-weight:800}
.m4j-jg{display:inline-flex;gap:3px;flex:none}
.m4j-jg i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.m4j-r .zz{font-size:12px;font-weight:800;color:var(--mut);border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-right:6px;vertical-align:2px}
.m4j-r .neuf{width:9px;height:9px;border-radius:50%;background:var(--ia);flex:none}
.m4j-r .date{font-weight:800;color:var(--att);flex:none}
.m4j-r .date.passe{color:var(--bad)}
.m4j-r .lit{color:var(--ia);font-weight:700}
.m4j-r.leve{background:var(--on);box-shadow:0 10px 28px var(--ombre);position:relative;z-index:4;pointer-events:none}
.m4j-r.cible-av{box-shadow:inset 0 3px 0 var(--ia)}
.m4j-r.cible-ap{box-shadow:inset 0 -3px 0 var(--ia)}
.m4j-dn.cible,.m4j-sd.cible{outline:2px dashed var(--ia);outline-offset:-2px}
.m4j-recharger{display:block;margin:22px auto 4px;min-height:44px;padding:0 12px;color:var(--mut);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.m4j-af{display:flex;gap:10px;align-items:center;min-height:58px;border-bottom:1px solid var(--s2);width:100%;text-align:left;padding:4px 6px}
.m4j-af .ic{font-size:20px;width:30px;text-align:center;flex:none}
.m4j-af .t{flex:1;min-width:0;font-weight:700;line-height:1.25}
.m4j-af .t small{display:block;font-weight:400;font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m4j-af .d{font-weight:800;color:var(--att);font-size:14px;text-align:right;white-space:nowrap}
.m4j-af .d.passe{color:var(--bad)}
.m4j-af .d small{display:block;font-weight:600;color:var(--mut)}
/* feuille Ranger (appui long) */
.m4b-feuille .prios{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.m4b-feuille .prios .m4b-btn{gap:7px}
.m4b-feuille .prios i{width:5px;height:18px;border-radius:3px;background:var(--line)}
.m4b-feuille .prios i.haute{background:var(--bad)}
.m4b-feuille .cats{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.m4b-puce-c{min-height:44px;padding:0 12px;border-radius:999px;background:var(--card);font-size:15px;font-weight:700;display:flex;align-items:center;gap:5px}
.m4b-puce-c.on{background:var(--ink);color:var(--sur-plein)}
/* Organisé : contexte, échéance, période, chiffres, liste, à retenir, gestes */
.m4b-ctx{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.m4b-ctx .m4b-puce-c{font-size:14px}
.m4b-ctx .m4b-puce-c i{width:5px;height:16px;border-radius:3px;background:var(--bad)}
.m4b-frise button.et{min-height:44px;font-size:14px;color:var(--mut);font-weight:700;padding:0 3px;white-space:nowrap}
.m4b-frise button.et.fait{color:var(--fin)}
.m4b-frise button.et.ici span{background:var(--fin);color:var(--sur-plein);border-radius:999px;padding:3px 10px}
.m4b-frise button.et.ici.ok span{background:var(--ok)}
.m4b-ech{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 12px;background:var(--attbg);margin-bottom:10px;width:100%;text-align:left;min-height:64px}
.m4b-ech .j{font-size:30px;font-weight:800;color:var(--att);line-height:1;text-align:center;min-width:64px}
.m4b-ech .j small{display:block;font-size:13px;font-weight:700;margin-top:2px}
.m4b-ech .t{flex:1;font-weight:700;font-size:17px;line-height:1.25}
.m4b-ech .t small{display:block;font-weight:600;color:var(--mut);font-size:14px}
.m4b-ech.passe{background:var(--badbg)}.m4b-ech.passe .j{color:var(--bad)}
.m4b-per{background:var(--card);border-radius:14px;padding:10px 12px 8px;margin-bottom:10px;width:100%;text-align:left}
.m4b-per .bar{position:relative;height:12px;border-radius:6px;background:var(--s2);margin:8px 0 6px}
.m4b-per .bar b{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--fin)}
.m4b-per .bar u{position:absolute;top:-5px;bottom:-5px;width:3px;border-radius:2px;background:var(--ia)}
.m4b-per .bout{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.m4b-per .bout small{display:block;color:var(--mut);font-weight:600}
.m4b-per h3{margin:0;font-size:16px;font-weight:800}
.m4b-chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-bottom:10px}
.m4b-chf{background:var(--card);border-radius:14px;padding:8px 10px;text-align:left;line-height:1.15;min-height:58px;position:relative}
.m4b-chf b{display:block;font-size:19px;font-weight:800}
.m4b-chf span{font-size:14px;color:var(--mut)}
.m4b-liste{background:var(--card);border-radius:14px;padding:2px 4px 2px 0;margin-bottom:10px}
.m4b-li{display:flex;align-items:center;min-height:48px;border-bottom:1px solid var(--s2)}
.m4b-li:last-child{border-bottom:0}
.m4b-li .c{width:48px;height:48px;display:grid;place-items:center;flex:none}
.m4b-li .c i{width:24px;height:24px;border:2px solid var(--ink);border-radius:7px;display:grid;place-items:center;color:var(--sur-plein)}
.m4b-li .c i svg{width:16px;height:16px}
.m4b-li.fait .c i{background:var(--ok);border-color:var(--ok)}
.m4b-li .tx{flex:1;font-weight:700;font-size:17px;min-height:44px;display:flex;align-items:center;gap:4px;text-align:left}
.m4b-li.fait .tx{color:var(--mut);text-decoration:line-through;font-weight:600}
.m4b-ret{background:var(--okbg);border-radius:14px;padding:6px 12px;margin-bottom:10px}
.m4b-ret h3{margin:4px 0;font-size:14px;color:var(--ok);font-weight:800}
.m4b-ret button{display:flex;gap:8px;align-items:center;min-height:44px;width:100%;text-align:left;font-weight:700;font-size:17px}
.m4b-pw{position:relative}
.m4b-pistes{grid-template-columns:1fr;gap:6px}
.m4b-pistes .m4b-p{min-height:54px}
.m4b-ctx .m4b-puce-c i{background:var(--line)}
.m4b-ctx .m4b-puce-c i.haute{background:var(--bad)}
.m4b-ctx .m4b-puce-c i.basse{background:transparent;border:1.5px solid var(--line);width:5px}
.m4b-ajouts{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.m4b-ajouts .m4b-puce-c{color:var(--mut);font-size:14px}
.m4b-cmp .hd .m4b-btn{margin-top:4px;height:40px;font-size:14px;padding:0 10px;min-height:44px}
.m4j-r .dt{flex:none;text-align:center;font-weight:800;color:var(--att);font-size:14px;line-height:1.1;min-width:50px}
.m4j-r .dt small{display:block;font-size:12px;font-weight:700;color:var(--mut)}
.m4j-r .dt.passe{color:var(--bad)}
.m4b-q{font-weight:800;color:var(--att)}
.m4b-tache .c svg{width:16px;height:16px}
.m4b-p .m4b-tag{justify-self:start}
.m4b-ai .m4b-btn{padding:0 10px}
.m4b-pw .m4b-p{padding-right:44px}
.m4b-plus{position:absolute;right:0;top:50%;transform:translateY(-50%);width:44px;height:44px;display:grid;place-items:center;color:var(--ink);font-size:22px;font-weight:600}
.m4b-plus span{width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--ink) 12%,transparent);display:grid;place-items:center;line-height:1}
/* barre d'ajout d'Organisé : écrire sans quitter la vue */
.m4b-ajout{flex:none;border-top:1px solid var(--bord);background:var(--barre);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.m4b-ajout .rang{display:flex;align-items:center;gap:2px}
.m4b-ajout input{flex:1;min-width:0;height:44px;border-radius:22px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:0 14px;outline:none}
.m4b-ajout input:focus{border-color:var(--ia)}
.m4b-ajout .ics{display:flex}
.m4b-envoi{width:44px;height:44px;border-radius:50%;background:var(--ia);color:var(--sur-plein);display:grid;place-items:center;flex:none;margin-left:4px}
.m4b-envoi svg{width:22px;height:22px}
.m4b-pour{display:flex;align-items:center;gap:4px;margin:0 0 6px 6px;font-size:14px;font-weight:700;color:var(--ia)}
.m4b-toast{display:flex;align-items:center;gap:4px}
.m4b-toast-a{color:var(--ia);font-weight:800;min-height:44px;padding:0 4px 0 10px;white-space:nowrap}
.m4b-aidebtn{height:44px;display:flex;align-items:center;gap:4px;padding:0 11px 0 8px;border-radius:22px;background:var(--iabg);color:var(--ia);font-weight:800;font-size:15px;margin-left:2px;flex:none}
.m4b-aidebtn svg{width:20px;height:20px}
.m4b-aide{background:var(--iabg);border-radius:14px;padding:0 0 4px 12px;margin-bottom:10px}
.m4b-aide .hd{display:flex;align-items:center;gap:6px;min-height:44px;color:var(--ia);font-weight:800}
.m4b-aide .hd svg{width:19px;height:19px}
.m4b-aide .hd .e{flex:1}
.m4b-aide .x{width:44px;height:44px;display:grid;place-items:center;color:var(--mut);font-size:18px;flex:none}
.m4b-ai{display:flex;align-items:center;gap:6px;min-height:58px;border-top:1px solid color-mix(in srgb,var(--ia) 28%,transparent);padding-right:6px}
.m4b-ai .ty{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;flex:none;border:2px solid var(--ia);color:var(--ia)}
.m4b-ai .ty.suggestion{border:0;font-size:21px}
.m4b-ai .t{flex:1;min-width:0;font-weight:700;font-size:17px;line-height:1.2}
.m4b-ai .t small{display:block;font-weight:500;font-size:14px;color:var(--mut)}
.m4b-sec{justify-content:space-between;margin-top:2px;min-height:44px}
.m4b-sec .m4b-plus{position:static;transform:none}
.m4b-sec .m4b-case{margin:0 0 0 auto}
.m4b-opt.ret{background:var(--okbg);border-radius:10px;margin:0 -6px;padding-left:6px;padding-right:6px}
.m4b-btn.ok{border-color:var(--ok);color:var(--ok)}
.m4b-pour button{width:44px;height:32px;display:grid;place-items:center;color:var(--mut);font-size:18px}
/* ====================================================================== passe 4 (25.11 nuit) : recette greffée des juges */
:root{--hach:repeating-linear-gradient(135deg,color-mix(in srgb,var(--mut) 26%,transparent) 0 5px,transparent 5px 10px)}
.p4-titre{flex:1;min-width:0;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
#v-carnet[data-vue="notes"] .p4-titre{visibility:hidden}
body.edite .p4-titre{display:none}
#k-menu{font-size:22px;font-weight:900;letter-spacing:1px}
.p4-bascule{flex:none;display:flex;gap:6px;padding:6px 10px calc(6px + env(safe-area-inset-bottom));background:var(--barre)}
.p4-bascule button{flex:1;height:44px;border-radius:12px;font-weight:800;font-size:15px;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:6px;background:var(--bas)}
.p4-bascule button.on{background:var(--on);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.p4-bascule .n{min-width:20px;height:20px;border-radius:10px;background:var(--att);color:var(--sur-plein);font-size:13px;display:inline-grid;place-items:center;padding:0 5px}
.p4-bascule i{width:8px;height:8px;border-radius:50%;background:var(--ia);display:inline-block}
.p4-bascule i.att{background:var(--att)}
body.edite .p4-bascule{display:none}
#action{flex:none;padding:8px 12px 4px;background:var(--bg);border-top:1px solid var(--bord)}
.p4-go{width:100%;min-height:52px;border-radius:14px;background:var(--ink);color:var(--sur-plein);display:flex;align-items:center;gap:10px;padding:0 14px;font-size:17px;text-align:left}
.p4-go .em{font-size:22px}
.p4-go b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p4-go small{font-size:14px;font-weight:800;opacity:.75;white-space:nowrap}
.p4-go .case{width:24px;height:24px;border:2.5px solid currentColor;border-radius:7px;flex:none;opacity:.8}
.p4-duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.p4-duo-t{grid-column:1/-1;font-weight:800;text-align:center;font-size:15px;color:var(--mut)}
.p4-b{min-height:52px;border-radius:14px;background:var(--on);border:1.5px solid var(--ink);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:6px}
.m4b-org{padding:4px 12px 16px}
.p4-etat{display:flex;align-items:center;gap:8px;min-height:44px;margin:0 0 4px}
.p4-puce{height:30px;padding:0 10px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--mut)) 18%,var(--bg));color:var(--c,var(--ink));font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px;position:relative;white-space:nowrap;flex:none}
button.p4-puce:before{content:"";position:absolute;inset:-7px 0}
.p4-puce i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.p4-puce.genre{--c:var(--att)}
.p4-av{display:flex;gap:4px;font-size:13px;color:var(--mut);font-weight:700;white-space:nowrap;overflow:hidden}
.p4-av b{font-weight:700}
.p4-av b+b:before{content:"› ";color:var(--line)}
.p4-av b.ici{color:var(--fin);font-weight:900}
.p4-av b.fait{color:var(--ink)}
.p4-chg{margin-left:auto;height:44px;padding:0 2px 0 10px;color:var(--ia);font-weight:800;font-size:14px;white-space:nowrap;flex:none}
.p4-band{display:flex;gap:10px;align-items:center;border-radius:14px;padding:10px 12px;margin:0 0 10px}
.p4-band .ic{font-size:24px}
.p4-band b{display:block;font-size:16px}
.p4-band small{display:block;font-size:14px;color:var(--mut)}
.p4-band.bad{background:var(--badbg);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.p4-band.bad b{color:var(--bad)}
.p4-band.hors{background:var(--attbg)}
.p4-band.hors b{color:var(--att)}
.p4-k{font-size:14px;font-weight:800;color:var(--mut);margin:12px 2px 6px;display:flex;align-items:center;gap:6px}
.p4-k.sec{justify-content:space-between;margin-bottom:0}
.p4-k .m4b-plus{position:static;transform:none}
/* pistes : jetons ronds, un mot */
.p4-jetons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 10px}
.p4-jeton{display:flex;flex-direction:column;align-items:center;gap:5px;min-height:84px;padding:8px 0 6px;border-radius:16px;background:var(--card)}
.p4-jeton .rond{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:25px;position:relative;background:var(--s2)}
.p4-jeton .rond i{position:absolute;right:-5px;bottom:-4px;width:22px;height:22px;border-radius:50%;font-style:normal;font-size:13px;font-weight:900;display:grid;place-items:center;color:var(--sur-plein);border:2px solid var(--card)}
.p4-jeton.oui .rond{background:var(--okbg)}
.p4-jeton.oui .rond i{background:var(--ok)}
.p4-jeton.q .rond{background:var(--attbg)}
.p4-jeton.q .rond i{background:var(--att)}
.p4-jeton.mien .rond i{background:var(--ia)}
.p4-jeton .mot{font-size:14px;font-weight:800;line-height:1.1;text-align:center;padding:0 3px;overflow-wrap:anywhere}
.p4-jeton.oui .mot{color:var(--ok)}
.p4-jeton.q .mot{color:var(--att)}
.p4-jeton.mien .mot{color:var(--ia)}
.p4-jeton.plus{background:none;border:1.5px dashed var(--line)}
.p4-jeton.plus .rond{background:none;font-size:30px;color:var(--mut);font-weight:400}
/* face à face, comparaison */
.p4-face,.p4-cmp{display:grid;gap:6px;align-items:stretch;background:var(--card);border-radius:16px;padding:10px 8px;margin:0 0 10px}
.p4-qui{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:64px;justify-content:center;border-radius:12px;position:relative;padding:2px}
.p4-qui .em{font-size:30px;line-height:1}
.p4-qui b{font-size:15px;text-align:center;line-height:1.15}
.p4-qui.ret{background:var(--okbg);color:var(--ok)}
.p4-cons{position:absolute;top:2px;right:6px;color:var(--ia);font-style:normal;font-weight:900;font-size:16px}
.p4-ou{display:grid;place-items:center;font-weight:800;color:var(--mut)}
.p4-ri{display:grid;place-items:center;font-size:19px}
.p4-c{min-height:44px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--s2);font-size:15px;line-height:1.15;padding:4px;text-align:center;position:relative;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.p4-c b{font-weight:800}
.p4-c small{font-size:12px;color:var(--mut);font-weight:700}
.p4-c.inc{background:var(--hach);color:var(--mut);font-weight:800}
.p4-c.relire{background:var(--hach);color:var(--att)}
.p4-c.est{background:transparent;border:2px dashed var(--fin);color:var(--fin)}
.p4-c.est small{color:var(--fin)}
.p4-c.att{color:var(--fin);font-weight:800}
.p4-c.win{background:var(--okbg);box-shadow:inset 0 0 0 2px var(--ok);color:var(--ok)}
.p4-c.calc b{text-decoration:underline dotted;text-underline-offset:3px}
.p4-c .pg{width:12px;height:12px;color:var(--mut);position:absolute;top:4px;left:4px}
.p4-c .emo{font-size:20px;letter-spacing:2px;font-weight:400}
.couronne{position:absolute;top:-9px;right:-3px;font-style:normal;font-size:15px}
.p4-ret{min-height:36px;border-radius:10px;font-size:14px;font-weight:800;color:var(--mut);border:1.5px solid var(--line)}
.p4-ret.on{color:var(--ok);border-color:var(--ok);background:var(--okbg)}
.p4-jauge{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--ok);margin:0 2px 8px;font-variant-numeric:tabular-nums}
.p4-jauge .seg{flex:1;display:flex;gap:3px}
.p4-jauge .seg i{flex:1;height:10px;border-radius:3px;background:var(--hach);box-shadow:inset 0 0 0 1px var(--line)}
.p4-jauge .seg i.l{background:var(--ok);box-shadow:none}
.p4-jauge .m{color:var(--mut)}
.p4-art{display:flex;flex-direction:column;align-items:stretch;gap:4px;min-width:0}
.p4-art .nom{display:flex;flex-direction:column;align-items:center;min-height:56px;justify-content:center;border-radius:12px;background:var(--s2);padding:4px}
.p4-art .nom .em{font-size:22px}
.p4-art .nom b{font-size:14px;text-align:center;line-height:1.15;overflow-wrap:anywhere}
.p4-art.ret .nom{background:var(--okbg);color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.p4-art .gestes{display:flex;gap:4px}
.p4-art .gestes .p4-ret{flex:1}
.p4-x{width:36px;min-height:36px;border-radius:10px;border:1.5px solid var(--line);color:var(--mut);font-weight:800;flex:none}
.p4-ecartes{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 10px}
/* décider : colonnes proportionnelles */
.p4-dec{display:flex;gap:12px;align-items:flex-end;background:var(--card);border-radius:16px;padding:12px 12px 10px;margin:0 0 6px}
.p4-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;border-radius:12px;padding:4px}
.p4-col .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.p4-col .barre{width:100%;border-radius:10px 10px 4px 4px;background:var(--fin);display:grid;place-items:center;font-size:28px}
.p4-col.moins .barre{background:var(--ok)}
.p4-col .n{font-weight:800;font-size:15px}
.p4-col.ret{box-shadow:inset 0 0 0 2px var(--ok)}
.p4-col.ret .n{color:var(--ok)}
.p4-ecart{text-align:center;font-size:15px;color:var(--att);margin:0 0 10px;font-variant-numeric:tabular-nums}
.p4-ecart b{font-size:17px}
.p4-ecart small{color:var(--mut);font-size:13px}
/* chiffres, manque, attention, conseil */
.p4-chf{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.p4-chf button{display:flex;align-items:center;gap:6px;min-height:44px;padding:4px 12px 4px 8px;border-radius:12px;background:var(--card);font-size:14px;color:var(--mut)}
.p4-chf .em{font-size:20px}
.p4-chf b{font-size:17px;color:var(--ink);font-weight:800;font-variant-numeric:tabular-nums}
.p4-chf button.est{background:transparent;box-shadow:inset 0 0 0 2px var(--fin)}
.p4-chf button.est b{color:var(--fin)}
.p4-manque{display:flex;align-items:center;gap:10px;border:1.5px dashed var(--att);border-radius:14px;padding:4px 6px 4px 12px;margin:0 0 10px;min-height:54px}
.p4-manque .em{font-size:20px}
.p4-manque b{flex:1;color:var(--att);font-size:16px}
.p4-noter{height:44px;padding:0 14px;border-radius:10px;background:var(--att);color:var(--sur-plein);font-weight:800}
.p4-att{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;border-radius:14px;background:var(--attbg);padding:4px 12px;margin:0 0 10px;text-align:left}
.p4-att .em{font-size:20px}
.p4-att span{flex:1;font-weight:700}
.p4-att small{font-size:13px;color:var(--mut);font-weight:700;white-space:nowrap;min-height:44px;display:flex;align-items:center}
.p4-conseil{background:var(--iabg);border-radius:14px;padding:10px 12px;margin:0 0 10px;font-weight:700;display:flex;gap:8px}
.p4-conseil i{font-style:normal;color:var(--ia)}
/* échéance : compte à rebours */
.p4-ech{background:var(--attbg);border-radius:16px;padding:12px 12px 4px;margin:0 0 10px}
.p4-ech .haut{display:flex;align-items:baseline;gap:10px}
.p4-ech .j{font-size:40px;font-weight:900;color:var(--att);line-height:1;font-variant-numeric:tabular-nums}
.p4-ech .t{font-size:18px;font-weight:800}
.p4-ech .jours{display:flex;gap:2px;margin:12px 0 4px;height:16px}
.p4-ech .jours i{flex:1;border-radius:2px;background:color-mix(in srgb,var(--att) 25%,transparent)}
.p4-ech .jours i:first-child{background:var(--att)}
.p4-ech .jours i:last-child{background:var(--bad)}
.p4-ech .bouts{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);font-weight:700}
.p4-ech.passe{background:var(--badbg)}
.p4-ech.passe .j{color:var(--bad)}
.p4-ligne{min-height:44px;display:inline-flex;align-items:center;gap:4px;color:var(--ia);font-weight:800;font-size:14px;padding:0 4px}
.p4-ligne svg{width:16px;height:16px}
/* relecture : pourquoi */
.p4-pq{display:flex;align-items:center;gap:12px;width:100%;background:var(--okbg);border-radius:16px;padding:10px 12px;margin:0 0 10px;text-align:left}
.p4-pq .q{font-size:30px}
.p4-pq small{display:block;font-size:13px;font-weight:800;color:var(--ok);text-transform:uppercase;letter-spacing:.04em}
.p4-pq b{font-size:20px}
.p4-svf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.p4-sv{background:var(--card);border-radius:14px;padding:6px 8px}
.p4-sv.af{box-shadow:inset 0 0 0 1.5px var(--ok)}
.p4-sv .hd{font-size:13px;font-weight:800;color:var(--mut);padding:4px 2px}
.p4-sv.af .hd{color:var(--ok)}
.p4-sv button{display:flex;gap:6px;align-items:flex-start;width:100%;min-height:44px;padding:4px 2px;text-align:left;font-size:15px;font-weight:700;line-height:1.2}
.p4-sv .em{font-size:18px}
.p4-calc{display:flex;align-items:baseline;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px;margin:0 0 10px}
.p4-calc b{font-size:24px;font-weight:900;color:var(--att);font-variant-numeric:tabular-nums}
.p4-calc small{font-size:14px;color:var(--mut)}
/* sans IA : ce que l'app lit seule */
.p4-lus{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 8px}
.p4-lu{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border-radius:14px;padding:8px 10px;min-height:64px;text-align:left;background:color-mix(in srgb,var(--fin) 15%,var(--card))}
.p4-lu .ic{font-size:20px}
.p4-lu b{font-size:17px;color:var(--fin)}
.p4-lu small{font-size:13px;color:var(--mut);font-weight:700}
.p4-lu.pas_trouve{background:var(--attbg)}
.p4-lu.pas_trouve b{color:var(--att)}
.p4-creux{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 6px}
.p4-creux span{border:1.5px dashed var(--line);border-radius:12px;min-height:44px;display:grid;place-items:center;color:var(--mut);font-weight:700;font-size:14px}
.p4-notes{background:var(--card);border-radius:14px;padding:4px 12px;line-height:1.45}
.p4-notes p{margin:8px 0}
/* aide : garder / non merci */
.p4-ai{display:grid;grid-template-columns:40px 1fr;gap:8px 10px;align-items:center;border-radius:14px;background:var(--card);padding:10px;margin:8px 0}
.p4-ai .ty{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;font-weight:900;border:2px solid var(--ia);color:var(--ia)}
.p4-ai.suggestion .ty{border-color:var(--att)}
.p4-ai .t b{display:block;font-size:17px}
.p4-ai .t small{display:block;font-size:14px;color:var(--mut)}
.p4-gn{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* feuille Changé par l'IA : une case par changement */
.m4b-sw:before{left:9px;top:9px;width:26px;height:26px;border-radius:8px;background:var(--ia)}
.m4b-sw:after{content:"✓";top:9px;left:9px;width:26px;height:26px;border-radius:0;background:none;color:var(--sur-plein);font-weight:900;display:grid;place-items:center;transition:none;font-size:16px}
.m4b-ch.off .m4b-sw:before{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.m4b-ch.off .m4b-sw:after{content:"";left:9px}
.m4b-retour{left:12px;right:12px;transform:none;bottom:var(--rb,118px);justify-content:center;background:var(--iabg);max-width:none;height:48px;font-size:15px}
.m4b-toast{bottom:var(--tb,120px)}
.p4-mi-e{font-size:22px;width:28px;text-align:center}
/* liste */
.p4-tete{display:flex;gap:4px;padding:calc(8px + env(safe-area-inset-top)) 10px 4px;align-items:center}
.p4-tab{height:44px;padding:0 12px;border-radius:12px;font-size:19px;font-weight:800;color:var(--mut);display:flex;align-items:center;gap:6px}
.p4-tab span{font-size:14px;font-weight:700}
.p4-tab.on{color:var(--ink);background:var(--card)}
#v-liste .m4j-liste{padding:0 8px 12px}
.p4-dn{display:flex;align-items:center;gap:4px;min-height:36px;margin-top:4px;border-bottom:1px solid var(--s2)}
.p4-dn .pli{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 4px;font-weight:800;font-size:15px;flex:none}
.p4-dn .ch{color:var(--mut);width:12px;font-size:12px}
.p4-dn .n{color:var(--mut);font-weight:700}
.p4-dn .ss{flex:1;min-width:0;display:flex;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.p4-ss{min-height:32px;padding:0 5px;border-radius:8px;font-size:13px;color:var(--mut);flex:none}
.p4-ss.on{background:var(--ink);color:var(--sur-plein)}
.p4-res{flex:none;min-height:32px;padding:0 8px;border-radius:8px;background:var(--okbg);color:var(--ok);font-weight:800;font-size:13px}
.p4-r{display:flex;align-items:center;min-height:40px;border-bottom:1px solid color-mix(in srgb,var(--s2) 60%,transparent);border-left:3px solid transparent;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.p4-r.haute{border-left-color:var(--bad)}
.p4-r-em{width:38px;height:38px;display:grid;place-items:center;font-size:19px;flex:none;border-radius:10px}
.p4-r-t{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding-right:4px}
.p4-r .ti{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px;font-weight:600}
.p4-r.res .ti{color:var(--mut)}
.p4-cle{flex:none;display:flex;align-items:center;gap:5px;font-size:14px;font-weight:800;color:var(--ink);max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.p4-cle i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.p4-cle.date{color:var(--att)}
.p4-cle.est{color:var(--fin)}
.p4-cle.lit{color:var(--ia)}
.p4-r .neuf{width:8px;height:8px;border-radius:50%;background:var(--ia);flex:none}
.p4-r.leve{background:var(--on);box-shadow:0 10px 28px var(--ombre);position:relative;z-index:4;pointer-events:none}
.p4-r.cible-av{box-shadow:inset 0 3px 0 var(--ia)}
.p4-r.cible-ap{box-shadow:inset 0 -3px 0 var(--ia)}
.p4-dn.cible,.p4-ss.cible{outline:2px dashed var(--ia);outline-offset:-2px}
.p4-bas-liste{flex:none;padding:6px 10px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--bord);background:var(--barre)}
.p4-oeil{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.p4-oeil button{height:40px;border-radius:10px;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:4px}
.p4-oeil b{font-size:17px;font-variant-numeric:tabular-nums}
.p4-oeil .cherche{background:color-mix(in srgb,var(--fin) 20%,var(--bg));color:var(--fin)}
.p4-oeil .decide{background:var(--attbg);color:var(--att)}
.p4-oeil .note{background:var(--card);color:var(--mut)}
.p4-oeil .resolu{background:var(--okbg);color:var(--ok)}
.p4-oeil button.on{box-shadow:inset 0 0 0 2px currentColor}
.p4-saisie{display:flex;gap:8px}
.p4-saisie input{flex:1;min-width:0;height:44px;border-radius:22px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:0 14px;outline:none}
.p4-saisie input:focus{border-color:var(--ia)}
.p4-plus{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--sur-plein);font-size:26px;font-weight:600;display:grid;place-items:center;flex:none}
#v-liste.afaire .p4-oeil{display:none}
/* à faire : ligne de temps, décision sur place, par délai */
.p4-temps{position:relative;margin:4px 0 6px;background:var(--card);border-radius:14px;overflow:hidden}
.p4-temps .axe{position:absolute;left:5%;right:5%;bottom:30px;height:3px;background:var(--line);border-radius:2px}
.p4-temps .auj{position:absolute;left:calc(5% - 6px);bottom:26px;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.p4-temps .pt{position:absolute;transform:translateX(-50%);width:36px;height:36px;border-radius:50%;background:var(--attbg);box-shadow:inset 0 0 0 2px var(--att);display:grid;place-items:center;font-size:17px}
.p4-temps .pt.passe{background:var(--badbg);box-shadow:inset 0 0 0 2px var(--bad)}
.p4-temps .lb{position:absolute;bottom:6px;font-size:12px;color:var(--mut);font-weight:700}
.p4-deci{background:var(--card);border-radius:14px;padding:6px 10px 10px;margin:0 0 8px;box-shadow:inset 0 0 0 1.5px var(--fin)}
.p4-deci .q{display:flex;gap:8px;align-items:center;font-weight:800;font-size:16px;min-height:40px;width:100%;text-align:left}
.p4-deci .q small{margin-left:auto;color:var(--att);font-size:13px;white-space:nowrap}
.p4-deci .duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.p4-deci .duo button{min-height:48px;border-radius:12px;background:var(--on);border:1.5px solid var(--line);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.p4-afr{display:flex;align-items:center;gap:4px;min-height:52px;border-bottom:1px solid var(--s2)}
.p4-afr .case{width:44px;height:44px;display:grid;place-items:center;flex:none}
.p4-afr .case i{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--att)}
.p4-afr .t{flex:1;min-width:0;text-align:left;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.p4-afr .t b{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p4-afr .t small{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p4-afr .d{font-size:14px;font-weight:800;color:var(--att);white-space:nowrap;padding-right:6px;font-variant-numeric:tabular-nums}
.p4-afr .d.passe{color:var(--bad)}
.p4-grp{font-size:13px;font-weight:800;color:var(--mut);margin:12px 4px 2px;text-transform:uppercase;letter-spacing:.04em}

/* passe 4, mots : étape d'achat en points, « ✦ n », écart et calcul à un toucher, avant → fait en icônes, pouces, attention sous l'article */
.p4-etape .pts{display:inline-flex;gap:3px;align-items:center;margin-right:2px}
.p4-etape .pts u{width:7px;height:7px;border-radius:50%;background:var(--line);text-decoration:none}
.p4-etape .pts u.f{background:var(--c)}
.p4-etape .pts u.ici{width:16px;border-radius:4px;background:var(--c)}
.p4-chg .n{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:12px;background:var(--ia);color:var(--bg);font-size:14px;font-weight:900;margin-left:4px;padding:0 6px}
.p4-ecart{display:block;width:100%;min-height:44px}
.p4-abaque{font-style:normal;font-size:15px;margin-left:2px;border-bottom:1.5px dotted var(--mut)}
.p4-c.calc{cursor:pointer}
.p4-att-art{min-height:44px;border-radius:10px;padding:2px 4px;font-size:13px;font-weight:800;line-height:1.1;color:var(--att);background:color-mix(in srgb,var(--att) 16%,var(--bg))}
.p4-svf{grid-template-columns:1fr 16px 1fr;gap:4px}
.p4-fl{align-self:center;text-align:center;color:var(--mut);font-weight:900;font-size:18px}
.p4-sv .hd{font-size:18px;padding:2px}
.p4-pouce{font-size:28px;line-height:1}
.p4-creux.un{grid-template-columns:1fr}
.p4-art .nom{flex:1}
.p4-att-art{min-height:0;margin-top:3px;padding:2px 6px;border-radius:8px}
.p4-jeton .mot.long{font-size:12px;letter-spacing:-.2px}
/* ===== correction J1 (25.11 nuit) ===== */
/* B2 : action proposée par une note (« Starter lancé ») ; action douce (Rouvrir) ; mot d'action (Noter) */
.p4-go.prop{background:var(--okbg);color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.p4-go.prop .case{border-style:dashed;display:grid;place-items:center}
.p4-go.prop .case::after{content:'✓';font-style:normal;font-weight:900;font-size:15px}
.p4-go small.prop{font-size:13px;opacity:1}
.p4-go.doux{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.p4-go .p4-mot{font-size:15px;font-weight:800;padding:6px 12px;border-radius:10px;background:color-mix(in srgb,currentColor 14%,transparent)}
/* B3 : la case et le manque remplis par sa note, en attendant l'IA */
.p4-c.note{background:var(--okbg);color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}
.p4-c.note small{color:var(--ok)}
.p4-manque.fait{background:var(--okbg)}
.p4-manque.fait .em{color:var(--ok);font-weight:900}
.p4-manque.fait b{color:var(--ok)}
.p4-manque.fait small{margin-left:auto;font-size:12px;color:var(--mut);font-weight:700;white-space:nowrap}
/* B5 : variété commune, offre qui ne couvre pas le besoin, total sans livraison */
.p4-var{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:8px 12px;margin:0 0 8px;font-size:22px;min-height:44px}
.p4-var .em{font-size:18px;opacity:.8}
.p4-var b{font-weight:400;letter-spacing:2px}
.p4-c.court{color:var(--bad);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--bad) 55%,transparent)}
.p4-c{position:relative}
/* B7 : la courbe de deux mesures, et les visuels agrandis quand la place le permet */
.p4-courbe{background:var(--card);border-radius:16px;padding:10px 10px 6px;margin:0 0 10px}
.p4-courbe svg{display:block;width:100%}
.p4-courbe line{stroke:var(--line);stroke-width:2}
.p4-courbe polyline{fill:none;stroke:var(--fin);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.p4-courbe circle{fill:var(--fin)}
.p4-courbe.baisse polyline{stroke:var(--att)}
.p4-courbe.baisse circle:last-of-type{fill:var(--bad)}
.p4-courbe .pts{display:grid;gap:6px;margin-top:4px}
.p4-courbe .pts button{display:flex;flex-direction:column;align-items:center;min-height:44px}
.p4-courbe .pts b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.p4-courbe .pts span{font-size:13px;color:var(--mut);font-weight:700}
.m4b-org.ample>*{margin-bottom:calc(10px * var(--k))}
.m4b-org.ample .p4-jetons{gap:10px}
.m4b-org.ample .p4-jeton{min-height:calc(84px * var(--k));gap:8px;justify-content:center}
.m4b-org.ample .p4-jeton .rond{width:min(calc(48px * var(--k)),72px);height:min(calc(48px * var(--k)),72px);font-size:min(calc(25px * var(--k)),38px)}
.m4b-org.ample .p4-jeton .rond i{width:26px;height:26px;font-size:15px}
.m4b-org.ample .p4-jeton .mot{font-size:15px}
.m4b-org.ample .p4-chf button{min-height:calc(44px * var(--k));padding:6px 14px 6px 10px}
.m4b-org.ample .p4-chf .em{font-size:calc(20px * var(--k))}
.m4b-org.ample .p4-chf b{font-size:calc(17px * var(--k))}
.m4b-org.ample .p4-courbe .pts b{font-size:calc(20px * var(--k))}
.m4b-org.ample .p4-c{min-height:calc(44px * var(--k));font-size:17px}
.m4b-org.ample .p4-c .emo{font-size:calc(20px * var(--k))}
.m4b-org.ample .p4-qui{min-height:calc(48px * var(--k))}
.m4b-org.ample .p4-qui .em{font-size:calc(22px * var(--k))}
.m4b-org.ample .p4-ech .j{font-size:calc(40px * var(--k))}
.m4b-org.ample .p4-ech .jours{height:calc(16px * var(--k));margin:16px 0 8px}
.m4b-org.ample .m4b-per{padding:14px 14px 10px}
.m4b-org.ample .m4b-per .bar{height:calc(22px * var(--k));border-radius:12px;margin:14px 0 26px}
.m4b-org.ample .m4b-per .bar b{border-radius:12px}
.m4b-org.ample .m4b-per h3{font-size:calc(16px * var(--k))}
.m4b-org.ample .m4b-li{min-height:calc(44px * var(--k))}
.m4b-org.ample .p4-svf button{min-height:calc(44px * var(--k));font-size:17px}
.m4b-org.ample .p4-manque{min-height:calc(48px * var(--k));font-size:calc(16px * var(--k))}
.m4b-org.ample .p4-manque .em{font-size:calc(20px * var(--k))}
.m4b-org.ample .p4-var{font-size:calc(22px * var(--k));min-height:calc(44px * var(--k))}
.m4b-org.ample .p4-att{min-height:calc(48px * var(--k))}
.m4b-org.ample .p4-pq{min-height:calc(52px * var(--k))}
.m4b-per .bar .mois{position:absolute;top:0;bottom:0;width:1px;background:color-mix(in srgb,var(--ink) 25%,transparent);font-style:normal}
.m4b-per .bar .mois span{position:absolute;top:100%;margin-top:4px;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--mut);white-space:nowrap}
/* B8 : repères de la période */
.p4-per-lb{position:relative;height:20px;font-size:14px;font-weight:700}
.p4-per-lb span{position:absolute;top:0;white-space:nowrap}
.p4-per-lb .auj{color:var(--ia);transform:translateX(-2px)}
/* À faire : graduations par mois sous la ligne de temps */
.p4-temps .tic{position:absolute;bottom:25px;width:2px;height:13px;margin-left:-1px;background:var(--mut);opacity:.6}
.p4-temps .lb.m{transform:translateX(-50%)}
/* légendes au toucher, coût de l'IA */
[data-leg]{cursor:help}
.m4b-feuille h2 .p4-cout{font-size:13px;font-weight:700;color:var(--ia);margin-left:6px}
.p4-go small.cout{color:inherit}
.p4-jeton.plus{min-height:0;height:48px;width:48px;align-self:center;border-radius:50%;padding:0}
.p4-jeton.plus .rond{width:44px;height:44px}
.m4b-org.ample .p4-jeton.plus{min-height:0}
.m4b-org.ample .p4-jeton.plus .rond{width:44px;height:44px;font-size:30px}
.p4-b.on{box-shadow:inset 0 0 0 2.5px var(--ok);background:var(--okbg)}
.m4b-org.ample .p4-chf b{font-size:min(calc(17px * var(--k)),28px);white-space:nowrap}
.m4b-org.ample .p4-chf .em{font-size:min(calc(20px * var(--k)),32px)}
.p4-courbe .pts b{white-space:nowrap}
.m4b-org.ample .p4-courbe .pts b{font-size:min(calc(20px * var(--k)),28px)}
.m4b-org.ample .p4-manque{font-size:min(calc(16px * var(--k)),20px)}
.m4b-org.ample .p4-manque .em{font-size:min(calc(20px * var(--k)),28px)}
.m4b-org.ample .p4-noter{font-size:16px}
.p4-att>span:nth-child(2){flex:1;min-width:0;text-align:left}
.m4b-org.ample .p4-ech .j{font-size:min(calc(40px * var(--k)),64px)}
.p4-att .em{flex:none}
.p4-jplus{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.p4-jplus .p4-jeton.plus,.m4b-org.ample .p4-jplus .p4-jeton.plus{width:44px;height:44px}
.p4-jplus .p4-jeton.plus .rond{width:40px;height:40px;font-size:24px}
.p4-jeton .mot{overflow-wrap:normal;word-break:normal;hyphens:auto}
.m4b-org.ample .p4-jeton .mot.long{font-size:12.5px}
.p4-ri small{display:block;font-size:11px;font-weight:700;color:var(--mut);line-height:1.1;text-align:center;overflow-wrap:anywhere;max-width:100%}
.p4-ri{gap:1px;padding:2px 0}
.p4-var{font-size:14px;flex-wrap:wrap;gap:6px 12px}
.p4-var b{letter-spacing:0;font-weight:700}
.p4-jeton.p4-sg .rond{color:var(--ia);font-size:22px}
.p4-jeton.p4-sg{border-color:color-mix(in srgb,var(--ia) 55%,transparent)}
.p4-sg.en .rond,.p4-sg-p.en span{animation:p4sg 1s linear infinite}
@keyframes p4sg{to{transform:rotate(360deg)}}
.p4-plus-bloc{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.p4-k .p4-plus-bloc{margin-left:auto}
.p4-plus-bloc .m4b-plus{position:static;transform:none}
.p4-sg-p{width:44px;height:44px;display:grid;place-items:center;color:var(--ia);font-size:17px;font-weight:700}
.p4-sg-p span{width:28px;height:28px;border-radius:50%;background:var(--iabg);display:grid;place-items:center;line-height:1}
.p4-suggs{display:flex;flex-direction:column;gap:6px;margin:0 0 10px}
.p4-sugg{display:flex;align-items:center;gap:8px;min-height:48px;padding:2px 4px 2px 10px;border-radius:12px;border:1px dashed color-mix(in srgb,var(--ia) 60%,transparent);background:var(--iabg)}
.p4-sugg i{font-style:normal;font-size:11px;font-weight:800;color:var(--ia);white-space:nowrap}
.p4-sugg .t{flex:1;font-weight:700;font-size:15px;line-height:1.2}
.p4-sugg.en .t{color:var(--mut);font-weight:600}
.p4-sugg button{width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--ink);font-size:16px}
.p4-sugg button.g{color:var(--ok)}
.p4-sugg button.g svg{width:20px;height:20px}
/* 26.11 : liens lus (🔗), lien en lecture, inconnus discrets (PAS-DE-HARCELEMENT), noms réels (TROP-ENFANTIN) */
.p4-c .lk{position:absolute;top:3px;left:5px;font-size:11px;line-height:1}
button.p4-c.inc{border:0;font:inherit;font-weight:800;color:var(--mut);cursor:pointer;width:100%}
.p4-c.inc.lect{background:var(--lienbg);color:var(--car)}
.p4-lect{display:block;margin-top:3px;font-size:12px;font-weight:700;color:var(--car);white-space:nowrap}
.p4-incs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.p4-inc{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:22px;border:1px dashed var(--line);background:transparent;color:var(--mut);font:inherit;font-size:14px;font-weight:600}
.p4-inc .em{font-size:16px}
.p4-inc b{font-weight:900}
.p4-inc.fait{border-style:solid;border-color:color-mix(in srgb,var(--ok) 50%,transparent);color:var(--ink)}
.p4-inc.fait b{color:var(--ok)}
.p4-qui small{font-size:12px;color:var(--mut);font-weight:700}
.p4-b .p4-bn{font-size:15px;line-height:1.15;text-align:left}
/* ====================================================================== amélioration du 26.11 (AMELIORER-JOUABLES.md, points 1 à 14)
   Thème de l'app (mini/COMMUN.md, DESIGN.md « cave ») ; classes préfixées a- (L26). */
@media (prefers-color-scheme: dark){
:root{--bg:#12100E;--card:#1A1613;--s2:#221D19;--line:#3D342E;--mut:#9A8A7E;--ink:#F5F0EA;--txt:#D8CEC5;--ia:#BCA5E8;--ok:#A3C97A;--bad:#F29289;--att:#F2C14E;--fin:#8FBEDB;--im:#9A8A7E;--car:#86B9E6;
--barre:#1A1613;--bord:#2C2521;--bas:#221D19;--on:#2C2521;--pop:#221D19;--feuille:#1A1613;--lienbg:#1d2228;--sur-plein:#12100E;--trait:#574A42;--jaune:#F2C14E;--pq:#E3B55D;
--iabg:rgba(188,165,232,.12);--okbg:rgba(163,201,122,.12);--badbg:rgba(242,146,137,.12);--attbg:rgba(224,160,46,.14);--finbg:rgba(91,138,166,.18)}}
@media (prefers-color-scheme: light){:root{--txt:#2b2622;--trait:#b9aea6;--jaune:#E0A02E;--pq:#9a6a00;--finbg:rgba(29,102,184,.12)}}
body{color:var(--txt,var(--ink))}
/* l'en-tête L'Affinée et les onglets de l'app */
.a-app{flex:none;display:flex;align-items:center;gap:8px;height:48px;padding:calc(2px + env(safe-area-inset-top)) 10px 0;border-bottom:1px solid var(--bord)}
.a-logo{width:34px;height:34px;border-radius:9px;background:var(--jaune);color:#12100E;display:grid;place-items:center;flex:none}
.a-logo svg{width:20px;height:20px}
.a-app .p4-tete{padding:0;flex:1;min-width:0;gap:2px}
.a-app .p4-tab{font-size:16px;height:44px;padding:0 10px;color:var(--mut)}
.a-app .p4-tab.on{background:var(--ink);color:var(--bg)}
.a-app .p4-tab.on span{color:var(--bg)}
.a-onglets{flex:none;display:grid;grid-template-columns:repeat(6,1fr);height:56px;border-top:1px solid var(--bord);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
.a-onglets button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;color:var(--mut);min-height:44px}
.a-onglets button svg{width:22px;height:22px}
.a-onglets button.on{color:var(--ink);background:var(--s2)}
.a-onglets button.on svg{color:var(--ok)}
body.edite .a-onglets{display:none}
/* icônes au trait */
.a-i{display:inline-grid;place-items:center;flex:none}
.a-i svg{width:var(--is,18px);height:var(--is,18px);fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
/* barre du pouce : champ, ✦, + sur une ligne, collée aux onglets */
.a-pouce,.m4b-ajout{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--bord);background:var(--bg)}
.m4b-ajout{flex-direction:column;align-items:stretch;gap:4px}
.m4b-ajout .rang{display:flex;align-items:center;gap:8px}
.a-champ{flex:1;min-width:0;height:44px;display:flex;align-items:center;border-radius:22px;border:1.5px solid var(--line);background:var(--card);padding:0 4px 0 14px}
.a-champ:focus-within{border-color:var(--ia)}
.a-champ input,.m4b-ajout .a-champ input{flex:1;min-width:0;height:40px;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;outline:none;padding:0;border-radius:0}
.a-champ input::placeholder{color:var(--mut)}
.a-champ .ics,.a-champ .a-ics{display:flex}
.a-champ .m4b-o,.a-champ .a-ic{width:40px;height:40px;display:grid;place-items:center;color:var(--mut);border-radius:20px}
.a-champ .m4b-o svg{width:20px;height:20px}
.a-sg{width:44px;height:44px;border-radius:22px;flex:none;border:1.5px solid var(--ia);color:var(--ia);display:grid;place-items:center;font-size:19px;background:var(--iabg)}
.a-sg[aria-busy="true"]{opacity:.55}
.a-plus{width:44px;height:44px;border-radius:22px;flex:none;background:var(--jaune);color:#12100E;display:grid;place-items:center;font-size:26px;font-weight:400;line-height:1}
.m4b-ajout .m4b-envoi,.m4b-ajout .m4b-aidebtn{display:none!important}
.p4-bas-liste{display:none}
/* liste : arbre compact catégorie › sous-catégorie, une ligne par carnet */
#v-liste .m4j-liste{padding:0 0 10px}
.p4-oeil{flex:none;margin:0;padding:4px 10px;gap:6px;border-bottom:1px solid var(--bord)}
.p4-oeil button{height:36px;border-radius:18px;font-size:14px;font-weight:600;position:relative}
.p4-oeil button::after{content:'';position:absolute;inset:-4px 0}
.p4-oeil b{font-size:16px}
.p4-oeil .cherche{background:var(--finbg);color:var(--fin)}
.a-cat{margin:0;min-height:0;display:flex;align-items:center;gap:8px;height:30px;padding:0 10px 0 8px;background:var(--card);border-bottom:1px solid var(--bord);position:sticky;top:0;z-index:2}
.a-cat .pli{display:flex;align-items:center;gap:8px;flex:1;min-width:0;height:30px;font-weight:700;font-size:15px;color:var(--ink)}
.a-cat .pli .n{color:var(--mut);font-weight:600}
.a-cat .ch{color:var(--mut);font-size:11px;width:10px}
.a-cat .a-i{color:var(--mut)}
.a-cat .res{height:30px;padding:0 8px;border-radius:8px;color:var(--ok);font-weight:700;font-size:14px}
.a-r{display:grid;grid-template-columns:106px minmax(0,1fr) auto;align-items:center;min-height:44px;column-gap:8px;padding:0 10px 0 0;border-bottom:1px solid color-mix(in srgb,var(--bord) 70%,transparent);cursor:pointer;user-select:none;-webkit-user-select:none;position:relative;touch-action:pan-y}
.a-r.haute::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--bad)}
.a-r .ss{height:100%;display:flex;align-items:center;padding:0 4px 0 10px;overflow-wrap:anywhere;hyphens:auto;font-size:13px;line-height:1.1;color:var(--mut);border-right:1.5px solid var(--trait);align-self:stretch;overflow:hidden}
.a-r .ss.vide{border-right-color:color-mix(in srgb,var(--trait) 55%,transparent)}
.a-r .ss button{text-align:left;height:100%;width:100%;font-size:13px;line-height:1.1;color:var(--mut)}
.a-r .ti{display:flex;align-items:center;gap:7px;min-width:0}
.a-r .ti i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c)}
.a-r .ti span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px;font-weight:600;color:var(--ink)}
.a-r .ti .neuf{width:7px;height:7px;background:var(--ia)}
.a-r .k{font-size:14px;color:var(--txt,var(--ink));white-space:nowrap;max-width:122px;overflow:hidden;text-overflow:ellipsis;text-align:right;font-variant-numeric:proportional-nums}
.a-r .k.date b{color:var(--att);font-weight:700}
.a-r .k.retard b{color:var(--bad)}
.a-r .k.est{color:var(--fin)}
.a-r .k.lit{color:var(--ia)}
.a-r.res .ti span{color:var(--mut);font-weight:500}
.a-r.pli-ss .ti span{color:var(--mut);font-weight:500}
.a-r.cible{outline:2px dashed var(--ia);outline-offset:-2px}
/* carnet : en-tête utile (‹ titre, puce de catégorie, ⋯) puis Mes notes | Organisé et l'heure de lecture */
#v-carnet .m4b-top{height:48px;border-bottom:0;gap:2px}
.a-catc{height:44px;max-width:140px;display:flex;align-items:center;flex:none;padding:0 2px}
.a-catc .chip{height:32px;display:flex;align-items:center;gap:5px;padding:0 10px;border-radius:16px;border:1px solid var(--line);color:var(--txt,var(--ink));font-size:13px;white-space:nowrap;overflow:hidden;max-width:100%}
.a-catc .chip span{overflow:hidden;text-overflow:ellipsis}
body.edite .a-catc,#v-carnet[data-vue="notes"] .a-catc{display:none}
.p4-bascule{order:0;padding:0 10px 6px;gap:6px;background:var(--bg);border-bottom:1px solid var(--bord);align-items:center}
.p4-bascule .a-seg{flex:1;display:flex;background:var(--card);border-radius:12px;padding:3px;gap:3px;min-width:0}
.p4-bascule .a-seg button{flex:1;height:38px;border-radius:9px;font-size:15px;font-weight:600;background:none;color:var(--mut);position:relative}
.p4-bascule .a-seg button::after{content:'';position:absolute;inset:-3px 0}
.p4-bascule .a-seg button.on{background:var(--on);color:var(--ink);box-shadow:none}
.p4-bascule #a-chg{flex:none;height:44px;min-width:44px;padding:0 10px;border-radius:12px;border:1px solid var(--line);color:var(--ia);font-size:14px;font-weight:600;display:flex;align-items:center;gap:5px;background:none}
.p4-bascule #a-chg b{background:var(--ia);color:#12100E;border-radius:9px;min-width:18px;height:18px;font-size:12px;display:inline-grid;place-items:center;padding:0 4px}
#action{border-top:0;padding:6px 10px 2px}
.p4-go{background:var(--jaune);color:#12100E;min-height:48px;border-radius:12px;font-size:16px;font-weight:700;gap:10px}
.p4-go .em{font-size:16px;width:20px;text-align:center}
.p4-go.doux{background:var(--card);color:var(--ink)}
.p4-go.prop{background:var(--okbg);color:var(--ok)}
/* Organisé : cases (état, dernier pas, coût, chiffres) */
#p-org.m4b-org{padding:10px 10px 18px}
.a-tus{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.a-tu{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:9px 12px 10px;border-radius:12px;background:var(--card);border:1px solid var(--bord);min-height:76px;min-width:0}
.a-tu .lab{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mut);white-space:nowrap;max-width:100%;overflow:hidden}
.a-tu .v{font-size:19px;font-weight:700;color:var(--ink);line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-tu .v.t{font-size:16px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.a-tu .s{font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.a-tu.est{border:1.5px dashed var(--fin)}
.a-tu.est .v,.a-tu.est .lab{color:var(--fin)}
.a-tu.e-cherche{border-left:3px solid var(--fin)} .a-tu.e-cherche .lab{color:var(--fin)}
.a-tu.e-decide{border-left:3px solid var(--att)} .a-tu.e-decide .lab{color:var(--att)}
.a-tu.e-resolu{border-left:3px solid var(--ok)} .a-tu.e-resolu .lab{color:var(--ok)}
.a-ex{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:10px;border:1px dashed var(--trait);color:var(--mut);font-size:13px;font-weight:500}
.a-l{color:var(--mut);font-size:13px;white-space:nowrap}
/* sections : étiquette grise, + et ✦ */
.a-sec{display:flex;align-items:center;gap:8px;margin:14px 0 4px}
.a-sec h3{margin:0;flex:1;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.a-sec .a-mini{width:44px;height:36px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);font-size:20px;position:relative}
.a-sec .a-mini::after{content:'';position:absolute;inset:-4px 0}
.a-sec .a-mini.ia{color:var(--ia);border-color:color-mix(in srgb,var(--ia) 60%,transparent);font-size:16px}
.a-sec .a-mini[aria-busy="true"]{opacity:.5}
/* pistes : le chemin, une ligne par piste */
.a-ch{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;align-items:center;column-gap:10px;min-height:44px;width:100%;text-align:left;border-bottom:1px solid var(--bord)}
.a-ch .st{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800}
.a-ch.oui .st{background:var(--ok);color:#12100E}
.a-ch.non .st{border:1.5px solid var(--pq);color:var(--pq)}
.a-ch.q .st{border:1.5px dashed var(--pq);color:var(--pq)}
.a-ch .n{font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-ch .p{font-size:14px;font-weight:600;padding:3px 9px;border-radius:9px;white-space:nowrap}
.a-ch.oui .p{color:var(--ok);background:var(--okbg)}
.a-ch.non .p,.a-ch.q .p{color:var(--pq);background:rgba(227,181,93,.12)}
.a-ch.mien .st{border:1.5px dashed var(--mut);color:var(--mut)}
.a-ch.mien .p{color:var(--mut);background:var(--s2)}
/* options : une ligne par option, la valeur à droite, retenir d'un toucher */
.a-op{display:grid;grid-template-columns:40px minmax(0,1fr) auto 44px;align-items:center;column-gap:10px;min-height:60px;border-bottom:1px solid var(--bord)}
.a-op .ic{width:40px;height:40px;border-radius:10px;background:var(--s2);display:grid;place-items:center;color:var(--txt,var(--ink))}
.a-op .tx{min-width:0;text-align:left;display:flex;flex-direction:column;gap:1px;min-height:44px;justify-content:center}
.a-op .tx b{font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-op .tx small{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-op .val{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.a-op .val b{font-size:17px;font-weight:700;color:var(--ink);white-space:nowrap}
.a-op .val b.est{color:var(--fin);border:1.5px dashed var(--fin);border-radius:8px;padding:0 6px}
.a-op .val b.inc{color:var(--pq);font-weight:600}
.a-op .val > button{min-height:44px;min-width:44px;display:flex;align-items:center;justify-content:flex-end}
.a-op .val small{font-size:13px;color:var(--mut);white-space:nowrap}
.a-op .ret{width:44px;height:44px;border-radius:22px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--mut)}
.a-op .ret.on{background:var(--ok);border-color:var(--ok);color:#12100E}
.a-op .ret svg{width:18px;height:18px}
.a-op.ret-on .tx b{color:var(--ok)}
/* achat : qui gagne quoi, à quantité égale ; Comparer à un toucher */
.a-qgq{background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:6px 12px 10px;margin-bottom:12px}
.a-qgq .hd{display:flex;align-items:center;gap:8px;min-height:32px;font-size:13px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.a-qgq .hd span{flex:1}
.a-qgq .hd small{text-transform:none;letter-spacing:0;font-weight:500;font-size:13px}
.a-gq{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr) auto;column-gap:8px;align-items:center;min-height:44px;padding:4px 0;border-top:1px solid var(--bord);width:100%;text-align:left}
.a-gq .c{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-gq .w{font-size:16px;font-weight:700;color:var(--ok);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-gq .w.pas{color:var(--pq);font-weight:600}
.a-gq .v{font-size:15px;font-weight:700;color:var(--ink);text-align:right;white-space:nowrap}
.a-gq .v small{color:var(--mut);font-weight:500;font-size:13px}
.a-gq.court .w{color:var(--pq)}
.a-gocmp{width:100%;min-height:48px;margin-top:8px;border-radius:12px;border:1.5px solid var(--ink);color:var(--ink);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
/* liens : l'objet en image, Relire, Escalader */
.a-lien{display:grid;grid-template-columns:48px minmax(0,1fr) auto;column-gap:10px;align-items:center;min-height:60px;border-bottom:1px solid var(--bord)}
.a-img{width:48px;height:48px;border-radius:10px;background:var(--s2);display:grid;place-items:center;overflow:hidden;color:var(--txt,var(--ink));flex:none}
.a-img img{width:100%;height:100%;object-fit:cover;background:#fff}
.a-lien .tx{min-width:0;display:flex;flex-direction:column;text-align:left;min-height:44px;justify-content:center}
.a-lien .tx b{font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-lien .tx small{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-lien .tx small.lu{color:var(--car)}
.a-lien .tx small.att{color:var(--ia)}
.a-acts{display:flex;gap:6px}
.a-act{height:44px;padding:0 10px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:5px;white-space:nowrap}
.a-act.ia{color:var(--ia);border-color:color-mix(in srgb,var(--ia) 55%,transparent)}
.a-act[disabled]{opacity:.5}
.a-lect{display:flex;align-items:center;gap:8px;margin-top:14px;padding-top:8px;border-top:1px solid var(--bord);font-size:13px;color:var(--mut)}
.a-lect span{flex:1;min-width:0}
.a-lect .forte{color:var(--ia);font-weight:700}
/* emoji : 16 px au plus, à côté d'un nom ; pas de bulles ni de hachures */
#p-org .em,#p-org .p4-ri,.p4-go .em,.p4-pouce,.m4b-ret button,.p4-att .em,.p4-chf .em{font-size:16px!important}
.p4-c.inc{background:none!important;border:1.5px dashed var(--pq)!important;color:var(--pq)!important}
.p4-dec .barre{font-size:16px}
.p4-dec .p4-col .barre{background:color-mix(in srgb,var(--ink) 30%,transparent)}
.p4-dec .p4-col.moins .barre{background:var(--ok)}
.p4-att{border-radius:12px}
.p4-ech .j{font-size:24px}
/* Comparer : vue dédiée (h04-7, v03-4, g05-8, g01-8, h06-7) */
#v-cmp .m4b-top{height:48px}
.a-cmp{flex:1;min-height:0;overflow-y:auto;padding:0 12px 18px;scrollbar-width:none}
.a-cmp h1{font-size:26px;margin:2px 0 0;color:var(--ink)}
.a-cmp .sous{font-size:14px;color:var(--mut);margin:2px 0 10px}
.a-crit > span:last-child{flex:1;min-width:0}
.a-crit{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:22px;background:var(--okbg);color:var(--ok);font-size:15px;width:100%;text-align:left}
.a-crit b{color:var(--ink)}
.a-crit .a-i{color:var(--ok)}
.a-barres{margin-top:10px;background:var(--card);border:1px solid var(--bord);border-radius:12px;padding:8px 12px 10px}
