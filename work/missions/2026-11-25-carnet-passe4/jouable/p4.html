.a-barres .hd{display:flex;gap:8px;align-items:baseline;font-size:14px;color:var(--mut);padding-bottom:4px}
.a-barres .hd b{color:var(--ink);font-size:16px}
.a-br{display:grid;grid-template-columns:18px minmax(0,1fr) auto;column-gap:8px;align-items:center;padding:6px 0 2px;width:100%;text-align:left;min-height:44px}
.a-br .r{font-weight:700;color:var(--mut)}
.a-br .n{font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.a-br .v{font-size:16px;font-weight:700;text-align:right;white-space:nowrap}
.a-br .v small{font-size:13px;color:var(--mut);font-weight:500;margin-left:4px}
.a-br .b{grid-column:2 / 4;height:6px;border-radius:3px;background:var(--s2);position:relative;margin-top:4px}
.a-br .b i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:color-mix(in srgb,var(--ink) 35%,transparent)}
.a-br.win .n,.a-br.win .v{color:var(--ok)} .a-br.win .b i{background:var(--ok)}
.a-br.est .v{color:var(--fin)} .a-br.est .b i{background:repeating-linear-gradient(90deg,var(--fin) 0 8px,transparent 8px 11px)}
.a-br.court .v,.a-br.court .n{color:var(--pq)}
.a-br.inc .v{color:var(--pq);font-weight:600}
.a-br .a-act{height:36px;font-size:13px;padding:0 8px;position:relative}
.a-br .a-act::after{content:'';position:absolute;inset:-4px 0}
.a-h2{display:flex;align-items:baseline;gap:8px;margin:18px 0 6px}
.a-h2 b{font-size:18px;color:var(--ink)}
.a-h2 span{font-size:14px;color:var(--mut)}
.a-tab{width:100%;border-collapse:collapse;table-layout:fixed;font-variant-numeric:proportional-nums}
.a-tab th,.a-tab td{padding:8px 4px;border-bottom:1px solid var(--bord);text-align:right;font-size:15px;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.a-tab th:first-child,.a-tab td:first-child{text-align:left;color:var(--mut);font-weight:500;font-size:14px;padding-left:0}
.a-tab thead th{vertical-align:bottom;font-weight:600;font-size:13px;color:var(--txt,var(--ink));text-align:center}
.a-tab thead th .a-img{width:44px;height:44px;margin:0 auto 4px}
.a-tab thead th .rk{display:block;font-weight:700;color:var(--ink);font-size:14px}
.a-tab thead th .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.15}
.a-tab td.win{background:var(--okbg);color:var(--ok);font-weight:700}
.a-tab td.est{color:var(--fin)}
.a-tab td.inc{color:var(--pq)}
.a-tab td.court{color:var(--pq)}
.a-tab tr.crit td:first-child{color:var(--ok);font-weight:700}
.a-tab td:first-child button{text-align:left;width:100%;min-height:36px;color:inherit;font:inherit}
.a-tab .ex{display:block;font-size:12px;color:var(--mut);font-weight:500}
.a-tab .gst{display:flex;gap:3px;justify-content:center;margin-top:4px}
.a-tab .gst button:first-child{flex:1;min-width:0;font-size:13px;padding:0 2px}
.a-tab .gst button{width:34px;height:40px;border-radius:9px;border:1px solid var(--line);font-size:14px;color:var(--mut);position:relative}
.a-tab .gst button::after{content:'';position:absolute;inset:-4px 0}
.a-tab .gst button.on{background:var(--ok);color:#12100E;border-color:var(--ok);font-weight:700}
.a-tab.rangs td:first-child{color:var(--ink);font-weight:600;font-size:15px}
.a-tab.rangs td:first-child .nmr{display:flex;align-items:center;gap:8px}
.a-tab.rangs td:first-child .a-img{width:32px;height:32px;border-radius:8px}
.a-comp{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--bord);font-size:15px;line-height:1.4;color:var(--txt,var(--ink))}
.a-comp b{color:var(--ink)}
.a-ec{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:10px;min-height:52px;border-bottom:1px solid var(--bord)}
.a-ec b{font-size:16px;color:var(--ink)} .a-ec small{display:block;font-size:13px;color:var(--mut)}
.a-car{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.a-car button{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);font-size:15px;font-weight:600;color:var(--ink)}
.a-car button.ia{color:var(--ia);border-color:color-mix(in srgb,var(--ia) 55%,transparent)}
.a-car button[aria-busy="true"]{opacity:.55}
.a-sgl{display:grid;grid-template-columns:minmax(0,1fr) 44px 44px;align-items:center;gap:6px;min-height:48px;border-bottom:1px solid var(--bord);color:var(--ink)}
.a-sgl i{color:var(--ia);font-style:normal;font-size:13px;margin-right:6px}
.a-sgl button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);color:var(--ink)}
.a-note{font-size:13px;color:var(--mut);margin-top:10px}
/* feuille ✦ de la liste */
.a-fs{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;min-height:52px;width:100%;text-align:left;border-bottom:1px solid var(--bord);column-gap:10px}
.a-fs b{font-size:16px;color:var(--ink)} .a-fs small{display:block;font-size:13px;color:var(--mut)} .a-fs .x{color:var(--ia);font-weight:700;font-size:14px}

/* ====================================================================== correction du 26.11 (CRITIQUE-AMELIO) */
/* cibles de 44 px (oeil, bascule, champ) */
.p4-oeil{padding:3px 10px}
.p4-oeil button{height:44px}
.p4-oeil button::after{content:none}
.p4-bascule .a-seg{padding:0;gap:2px}
.p4-bascule .a-seg button{height:44px}
.p4-bascule .a-seg button::after{content:none}
.a-pouce,.m4b-ajout{padding:4px 10px}
.a-champ{height:48px;padding:0 2px 0 14px;border-radius:24px}
.a-champ .m4b-o,.a-champ .a-ic{width:44px;height:44px;border-radius:22px}
.a-sg,.a-plus{width:46px;height:46px;border-radius:23px}
#liste,.m4j-liste,.a-cmp,#defil{scrollbar-width:none}
#liste::-webkit-scrollbar,.m4j-liste::-webkit-scrollbar,.a-cmp::-webkit-scrollbar,#defil::-webkit-scrollbar{display:none}
/* toasts en bas, au-dessus de la barre du pouce */
.m4b-toast{bottom:122px!important;top:auto!important}
/* liste : sous-catégorie en colonne étroite (nom entier, coupé en syllabes) ; icône au trait par carnet, teintée par son état ; titre sur 2 lignes ; valeur avec son sens */
.a-r{grid-template-columns:68px minmax(0,1fr) auto;padding:3px 10px 3px 0;column-gap:8px}
.a-r.haute::before{content:none}
.a-r .ss{font-size:12px;line-height:1.1;padding:0 4px 0 8px;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:normal;word-break:normal}
.a-r .ss button{font-size:12px;line-height:1.1;hyphens:auto;-webkit-hyphens:auto}
.a-r .ti{gap:8px;align-items:center}
.a-r .ti .ic{color:var(--c);flex:none;display:inline-grid;overflow:visible}
.a-r .ti span.tt{white-space:normal;text-overflow:clip;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;line-height:1.2;font-weight:600;color:var(--ink)}
.a-r.res .ti span.tt,.a-r.pli-ss .ti span{color:var(--mut);font-weight:500}
.a-r .k{display:flex;flex-direction:column;align-items:flex-end;max-width:106px;white-space:normal;line-height:1.15;text-overflow:clip;overflow:visible;gap:1px}
.a-r .k small{font-size:12px;color:var(--mut);font-weight:500;text-align:right}
.a-r .k b{font-size:13px;color:var(--txt,var(--ink))}
.a-r .k > span{font-size:14px;text-align:right}
.a-r .k.date b{color:var(--att)} .a-r .k.retard b{color:var(--bad)}
/* en-tête du carnet : titre sur 2 lignes, catégorie dessous */
#v-carnet .m4b-top{height:auto;min-height:48px;padding:2px 4px}
.a-tt{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:2px 4px;gap:1px}
.a-tt .p4-titre{flex:none;white-space:normal;text-overflow:clip;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:17px;line-height:1.2;padding:0}
.a-catl{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden}
body.edite .a-catl,#v-carnet[data-vue="notes"] .a-catl{display:none}
/* action sous le pouce : titre entier (2 lignes), sa date dessous */
.p4-go{padding:6px 14px}
.p4-go .a-gt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.p4-go .a-gt b{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.2;font-size:16px}
.p4-go .a-gt small{font-size:13.5px;font-weight:700;opacity:.8;white-space:normal}
.p4-go .a-ex{border-color:currentColor;color:inherit;opacity:.85;margin-left:6px;vertical-align:1px;height:18px;font-size:12px}
.p4-duo-t{font-size:14px}
.a-ecart{display:block;width:100%;min-height:44px;text-align:center;color:var(--att);font-size:15px;margin:0 0 6px}
/* tuiles : le dernier pas entier sur 3 lignes */
.a-tu .v.t{-webkit-line-clamp:3;font-size:15.5px}
/* liens : titre sur 2 lignes, prix et quantité, Relire / Escalader au ⋯ */
.a-lien{grid-template-columns:48px minmax(0,1fr) 44px;padding:6px 0}
.a-lien .tx b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2}
.a-lien .tx small{white-space:normal;line-height:1.3;display:flex;flex-wrap:wrap;align-items:center;gap:0 3px}
.a-lien .tx small b{font-size:13px;display:inline;color:var(--ink);-webkit-line-clamp:none}
.a-plusl{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);font-size:20px;color:var(--ink);display:grid;place-items:center}
.m4b-mi[disabled]{opacity:.45}
.p4-ligne{min-width:44px;justify-content:center}
/* qui gagne quoi : barres à quantité égale, libellés nommés */
.a-qgq .a-barres.org{margin:4px 0 2px;padding:4px 0 2px;border:0;background:none}
.a-gq .w.dec{color:var(--att)}
.a-gqn{margin:4px 0 0;font-size:14px;color:var(--mut);line-height:1.35}
/* Comparer (h04-7, v03-4) : en-tête L'Affinée, lien de retour, barres pleines pour le 1er */
.a-app-cmp{padding-right:14px}
.a-marque{font-size:18px;font-weight:700;color:var(--ink)}
#v-cmp .m4b-top{height:44px}
#cmp-titre{color:var(--car);font-weight:500;font-size:17px}
#cmp-retour{color:var(--car)}
.a-cmp{padding-bottom:32px}
.a-cmp .sous b{color:var(--ink)}
.a-barres .hd{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;min-height:44px;font-size:14px;color:var(--mut);padding:0}
.a-barres .hd b{color:var(--ink);font-size:16px}
.a-barres .hd span{flex:1;min-width:0}
.a-barres .hd em{font-style:normal;color:var(--ok);font-weight:700;font-size:14px;white-space:nowrap}
.a-br{grid-template-columns:18px minmax(0,1fr) auto;padding:4px 0 2px}

function reduire(f, max) {
  return new Promise(function (ok, ko) {
    var url = URL.createObjectURL(f), img = new Image();

      var cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);

    };

}
