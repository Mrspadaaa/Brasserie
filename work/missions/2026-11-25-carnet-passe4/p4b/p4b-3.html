<!--
RECETTE p4b-3 « Qui gagne quoi » (recette du juge personas produit, juge-personas-produit-1.md, fin)
écran → mécanisme → source
- Liste → lignes de v04-01 (état en pastille, un mot ou le chiffre clé de ses notes, à droite, aligné) ; en-têtes de domaine repliables (v01)
          avec la part de chaque état en mini-barre ; rangée basse de v01-01 en barre proportionnelle qui filtre d'un toucher (v06-02).
- Organisé (problème) → en-tête v06-09 en jetons, sans frise ; « qui gagne quoi » en face à face (v01-11, comparaison du jouable M4 b) à la place
          des cartes de façons ; « tes notes ne le disent pas · Noter » (v03) ; « lu par l'app » (v03-07) ; une seule action noire ; ≤ 30 mots.
- Organisé (achat) → Comparer en tableau qui couronne chaque critère (v06-19, jouable) ; « Lu / Manque » (v05-19) ; fiche du lien « rangé dans … Changer » (v06-18).
- Décider → tuiles « l'un face à l'autre » (v01-11) sur une même règle de prix ; la ligne qui remplit les coûts (v06-11) ; « Pourquoi B plutôt que A ? Ajouter » (v01-10).
- À faire → règle du temps (dates de ses notes) ; « Une décision t'attend » question et deux prix (v02-18 / v06-13) ; achat daté « aussi dans À venir » (v01-13) ; veille à interrupteur.
- Relecture → v03-16 : pourquoi, ce que tu savais alors, « tes notes ne le disent pas » ; « Toujours le bon choix ? » (v02-21).
- IA en erreur → repli v03-22 en pastilles v06-26 : les 4 cases que l'app sait lire seule (montant, pas trouvé, contacté, piste), vides dites vides ; sans options ni tâche.
- Mémo → M4, genre en tête (v01-18), « je le ressortirai quand tu noteras… » (v03-18) ; échéance sur un mini calendrier ; pas d'état d'avancement.
Données : tests/fixtures/c79 et c75 (lignes telles quelles, préfixe « ZZ TEST — » masqué). Thème sombre du jouable M4 b.
-->
<style>

.c-sw{width:44px;height:26px;border-radius:13px;background:var(--ok);position:relative;flex:none}

<script>
(function () {
var Q = new URLSearchParams(location.search), E = Q.get('e') || 'recette';
var ETAT = { cherche: ['Je cherche', 'e-cherche'], decide: ['Décidé', 'e-decide'], note: ['Noté', 'e-note'], resolu: ['Résolu', 'e-resolu'] };
var COUL = { cherche: '#7db8f5', decide: '#e8bd5a', note: '#8a8a92', resolu: '#8fd17e' };
var IC = {

};
/* k : le chiffre clé ou le mot de ses notes (rien d'autre) */
var CARNETS = [
  { d: 'Brasserie', em: '❄️', t: 'Frigo de garde en panne', etat: 'cherche', k: '480 | 1 200 CHF' },
  { d: 'Brasserie', em: '🫧', t: 'CO2 qui baisse vite dans un fût', etat: 'decide', k: '1,2 → 0,4 bar' },
  { d: 'Brasserie', em: '♨️', t: 'Trop de vapeur au brassage', etat: 'decide', k: 'fin du mois' },
  { d: 'Brasserie', em: '👃', t: 'Odeur de soufre dans un lot', etat: 'decide', k: 'J+5' },
  { d: 'Brasserie', em: '🌿', t: 'Houblons citra', etat: 'note', k: '2 liens' },

    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="c-go" style="height:46px;font-size:16px">Garder</button><button class="c-go" style="height:46px;font-size:16px;background:var(--s2);color:var(--ink)">Non merci</button></div></div></div>';
}

/* ---------- Organisé, achat : houblons citra ---------- */
function achat() {

    '<div style="display:flex;align-items:center;gap:8px;padding:10px 12px 0" data-utile data-booster="lu-manque"><span style="font-size:13px;font-weight:800;color:var(--ok)">lu 7</span>' +
    '<span style="flex:1;display:flex;gap:2px;height:10px">' + Array.apply(null, Array(10)).map(function (x, i) { return '<span style="flex:1;border-radius:2px;background:' + (i < 7 ? 'var(--ok)' : 'repeating-linear-gradient(135deg,#3a3a40 0 3px,#1c1c1f 3px 6px)') + '"></span>'; }).join('') + '</span>' +
    '<span style="font-size:13px;font-weight:800;color:var(--mut)">manque 3</span></div>' +
    '<div class="c-card" data-booster="comparer-couronnes"><div class="c-ff">' +
    '<span></span><div class="hd"><span>🌿</span>MotlerHops</div><div class="hd"><span>🌿</span><span style="font-size:15px">Brau- und Rauchshop</span></div>' +

}

/* ---------- Décider : frigo de garde ---------- */
function decider() {
  var W = 318, x480 = Math.round(480 / 1200 * (W - 24)) + 12, x1200 = W - 12;
  return '<div class="c-ecran" style="padding-bottom:150px">' + barre('Frigo de garde en panne') +
    '<div style="display:flex;align-items:center;gap:8px;padding:10px 12px 0">' + etat('cherche') + '<span style="margin-left:auto;color:var(--att);font-weight:800">⏳ avant décembre</span></div>' +
    '<div class="c-card" data-utile data-booster="regle-prix" style="padding:14px 12px 10px">' +
    '<svg width="' + W + '" height="96" viewBox="0 0 ' + W + ' 96">' +
    '<line x1="12" y1="56" x2="' + x1200 + '" y2="56" stroke="#2a2a2e" stroke-width="12" stroke-linecap="round"/>' +
    '<line x1="12" y1="56" x2="' + x480 + '" y2="56" stroke="#8fd17e" stroke-width="12" stroke-linecap="round"/>' +
    '<line x1="' + (x480 + 8) + '" y1="56" x2="' + (x1200 - 8) + '" y2="56" stroke="#e8bd5a" stroke-width="3" stroke-dasharray="5 5"/>' +
    '<text x="' + ((x480 + x1200) / 2) + '" y="84" text-anchor="middle" fill="#e8bd5a" font-size="15" font-weight="800">720 CHF d’écart</text>' +
    '<circle cx="' + x480 + '" cy="56" r="16" fill="#8fd17e"/><text x="' + x480 + '" y="62" text-anchor="middle" font-size="16">🔧</text>' +
    '<circle cx="' + x1200 + '" cy="56" r="16" fill="#7db8f5"/><text x="' + x1200 + '" y="62" text-anchor="middle" font-size="16">❄️</text>' +
    '<text x="' + x480 + '" y="22" text-anchor="middle" fill="#f1f1f3" font-size="22" font-weight="800">480</text>' +
    '<text x="' + x1200 + '" y="22" text-anchor="end" fill="#f1f1f3" font-size="22" font-weight="800">1 200 CHF</text></svg></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 12px 0" data-booster="face-a-face">' +
    '<div class="c-card" style="margin:0;box-shadow:inset 0 0 0 2px var(--ok)"><div style="font-size:30px">🔧</div><b style="font-size:17px">Réparer</b><div style="color:var(--mut);font-size:13px;margin:2px 0 10px">compresseur HS</div><button class="c-go" style="height:44px;font-size:16px">Retenir</button></div>' +
    '<div class="c-card" style="margin:0"><div style="font-size:30px">❄️</div><b style="font-size:17px">Frigo neuf</b><div style="color:var(--mut);font-size:13px;margin:2px 0 10px">&nbsp;</div><button class="c-go" style="height:44px;font-size:16px;background:var(--s2);color:var(--ink)">Retenir</button></div></div>' +
    '<div class="c-card" style="display:flex;gap:10px;align-items:flex-start;background:#121214;box-shadow:inset 0 0 0 1px var(--bord)"><span>📄</span><span style="font-size:15px;color:var(--mut)">« Technicien : compresseur HS, réparation 480 CHF ou frigo neuf 1 200 CHF. » <small>ta ligne 3 remplit les deux prix</small></span></div>' +
    '<button class="c-manque" style="border-color:var(--ia);color:var(--ia)"><span style="font-size:20px">🤔</span><span style="font-weight:700">Pourquoi l’un plutôt que l’autre ? <span style="color:var(--mut);font-weight:600">Tes notes ne le disent pas.</span></span><span class="b" style="background:var(--ia)">Ajouter</span></button>' +
    '<div class="c-card" style="display:flex;align-items:center;gap:10px;background:transparent;box-shadow:inset 0 0 0 1px var(--bord)"><span style="font-size:20px">🛢️</span><span style="color:var(--mut)">6 fûts dans la chambre froide en attendant · <span class="c-n">14 °C</span> au lieu de <span class="c-n">2 °C</span></span></div>' +
    dock('', 'org') + '</div>';
}

/* ---------- À faire ---------- */
function afaire() {
  /* règle du 25 nov. au 31 déc. (36 jours), les dates viennent de ses notes */
  var W = 318, j = function (n) { return 12 + Math.round(n / 36 * (W - 24)); };
  var P = [[5, '♨️'], [6, '🫧'], [11, '📦'], [13, '👃'], [36, '📄']];
  var regle = '<svg width="' + W + '" height="88" viewBox="0 0 ' + W + ' 88"><line x1="12" y1="40" x2="' + (W - 12) + '" y2="40" stroke="#2a2a2e" stroke-width="6" stroke-linecap="round"/>' +
    '<text x="12" y="84" fill="#a3a3aa" font-size="12">auj.</text><text x="' + j(6) + '" y="84" text-anchor="middle" fill="#a3a3aa" font-size="12">1 déc.</text><text x="' + (W - 12) + '" y="84" text-anchor="end" fill="#a3a3aa" font-size="12">31 déc.</text>' +
    P.map(function (p, i) { var y = i % 2 ? 54 : 22; return '<line x1="' + j(p[0]) + '" y1="40" x2="' + j(p[0]) + '" y2="' + y + '" stroke="#e8bd5a" stroke-width="2"/><circle cx="' + j(p[0]) + '" cy="' + y + '" r="13" fill="#1c1c1f" stroke="#e8bd5a" stroke-width="2"/><text x="' + j(p[0]) + '" y="' + (y + 5) + '" text-anchor="middle" font-size="14">' + p[1] + '</text>'; }).join('') +
    '<circle cx="12" cy="40" r="5" fill="#f1f1f3"/></svg>';
  function dec(em, q, a, b, ta, tb) {
    return '<div class="c-card" style="margin-top:8px;padding:10px 12px"><div style="display:flex;align-items:center;gap:8px;font-weight:800"><span style="font-size:20px">' + em + '</span>' + q + '</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">' + ta + tb + '</div></div>';
  }
  function px(t, cls) { return '<div class="c-v ' + (cls || '') + '" style="min-height:38px;font-size:15px">' + t + '</div>'; }
  function tk(em, tx, sous, d) { return '<div class="c-tk"><span class="c"></span><span class="tx">' + em + ' ' + tx + '<small>' + sous + '</small></span><span class="d">' + d + '</span></div>'; }
  return '<div class="c-ecran" style="padding-bottom:80px">' + barre('À faire', false, '<span></span>') +
    '<div class="c-card" data-utile data-booster="regle-temps" style="margin-top:8px;padding:6px 12px 4px">' + regle + '</div>' +
    '<div class="c-h">⚖️ Une décision t’attend</div>' +
    dec('❄️', 'Réparer ou frigo neuf ?', 0, 0, px('🔧 <span class="c-n">480 CHF</span>', 'win'), px('❄️ <span class="c-n">1 200 CHF</span>')) +
    dec('💧', 'Toi ou le sanitaire X ?', 0, 0, px('🔧 ?', 'c-hach'), px('👷 <span class="c-n">150 CHF</span>', 'c-est')) +
    '<div class="c-h">Puis</div>' +
    tk('♨️', 'Acheter le steam condenser', 'Vapeur · <span style="color:var(--fin)">aussi dans À venir</span>', 'fin nov.') +
    tk('🫧', 'Revérifier le raccord gaz', 'CO2 · « dans une semaine »', '≈ 1 déc.') +
    tk('📦', 'Ranger la cave', 'samedi au matin', '6 déc.') +
    tk('👃', 'Sentir à nouveau le lot 14', 'Soufre · avant la mise en fût', '≈ 8 déc.') +
    tk('📄', 'Renouveler l’assurance', 'Assurance', '31 déc.') +
    tk('📞', 'Contacter l’entreprise X', 'Écoulement', '') +
    '<div class="c-tk" style="grid-template-columns:24px 1fr auto"><span style="font-size:18px">🔔</span><span class="tx">Veille : le 2e condenser<small>Vapeur · « à surveiller »</small></span><span class="c-sw" data-booster="veille"></span></div>' +
    tabs() + '</div>';
}

/* ---------- Relecture : malt pilsner ---------- */
function relecture() {
  function c(ic, t) { return '<div style="display:flex;gap:8px;align-items:flex-start;padding:6px 0"><span style="font-size:20px">' + ic + '</span><span style="font-size:15px">' + t + '</span></div>'; }
  return '<div class="c-ecran" style="padding-bottom:40px">' + barre('Malt pilsner en rupture chez le fournisseur') +
    '<div style="display:flex;align-items:center;gap:8px;padding:10px 12px 0">' + etat('resolu') + '<span style="color:var(--mut);font-size:13px">25 nov.</span></div>' +
    '<div class="c-card" data-utile style="display:flex;align-items:center;gap:12px"><span style="font-size:34px">❓</span><span><span style="color:var(--mut);font-size:13px;font-weight:800">POURQUOI</span><br><b style="font-size:19px">🚚 Autre fournisseur</b></span></div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 12px 0" data-booster="avant-apres">' +
    '<div class="c-card" style="margin:0"><div style="font-size:13px;color:var(--mut);font-weight:800">🧠 TU SAVAIS · 24 nov.</div>' + c('🚫', 'Pilsner en rupture → <b>mi-déc.</b>') + c('🍺', 'Brassin du <b>3 déc.</b>') + c('✅', 'L’autre : en stock, <b>+4 CHF</b> le sac') + '</div>' +
    '<div class="c-card" style="margin:0;box-shadow:inset 0 0 0 2px var(--ok)"><div style="font-size:13px;color:var(--ok);font-weight:800">✓ TU AS FAIT · 25 nov.</div>' + c('🛒', 'Commandé <b>2 sacs</b> chez l’autre') + c('🍺', 'Brassin <b>maintenu</b>') + c('🧮', '<b class="c-n" style="color:var(--att)">+8 CHF</b> <small style="color:var(--mut)">calcul de l’app</small>') + '</div></div>' +
    '<div class="c-card" style="display:flex;align-items:center;gap:10px;background:repeating-linear-gradient(135deg,#1c1c1f 0 8px,#202024 8px 16px)"><span style="font-size:20px">✎</span><span style="color:var(--mut)">Le prix du sac : <b style="color:var(--ink)">tes notes ne le disent pas</b></span></div>' +
    '<div class="c-card" style="display:flex;align-items:center;gap:10px;opacity:.7"><span style="font-size:20px">📅</span><s>Décaler le brassin</s><span style="margin-left:auto;font-size:13px;color:var(--mut)">pas pris</span></div>' +
    '<div class="c-h">Toujours le bon choix ?</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 12px" data-booster="bon-choix"><button class="c-go" style="height:50px">👍 Oui</button><button class="c-go" style="height:50px;background:var(--s2);color:var(--ink)">🤔 Pas sûr</button></div>' +
    '</div>';
}

/* ---------- IA en erreur : les 4 cases que l'app sait lire ---------- */
function erreur() {
  function cs(ic, nom, val, ligne, c, bg) {
    var vide = !val;
    return '<div style="border-radius:16px;padding:12px;min-height:104px;display:flex;flex-direction:column;gap:6px;' + (vide ? 'border:1.5px dashed var(--line);color:var(--mut)' : 'background:' + bg + ';color:' + c) + '">' +
      '<span style="font-size:26px;' + (vide ? 'opacity:.45' : '') + '">' + ic + '</span><span style="font-size:13px;font-weight:800">' + nom + '</span>' +
      '<b style="font-size:17px">' + (val || 'rien lu') + '</b>' + (ligne ? '<span style="font-size:13px;color:var(--mut)">ligne ' + ligne + ' ↩</span>' : '') + '</div>';
  }
  return '<div class="c-ecran" style="padding-bottom:150px">' + barre('Écoulement qui fuit') +
    '<div class="c-card" data-utile style="margin-top:10px;background:#24130f;box-shadow:inset 0 0 0 1.5px #6b2d26;display:flex;gap:10px;align-items:center"><span style="font-size:26px">⚠️</span><span><b>L’IA n’a pas pu lire</b><br><span style="font-size:13px;color:var(--mut)">tes 5 notes restent telles quelles</span></span></div>' +
    '<div class="c-h">📱 Ce que l’app sait lire seule</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 12px" data-booster="lecture-locale">' +
    cs('💰', 'MONTANT', '<span class="c-n">150 CHF</span>', 5, 'var(--fin)', '#16253a') + cs('❓', 'PAS TROUVÉ', '« pas trouvée »', 2, 'var(--att)', '#2f2512') +
    cs('📞', 'CONTACTÉ', '', 0) + cs('🛤️', 'PISTE', '', 0) + '</div>' +
    '<div class="c-card" style="display:flex;gap:10px;align-items:center;background:transparent;box-shadow:inset 0 0 0 1px var(--bord);color:var(--mut)"><span style="font-size:20px">✦</span><span>Options, tâche, conseil : seulement avec l’IA.</span></div>' +
    dock('<span class="e">↻</span>Réessayer', 'org') + '</div>';
}

/* ---------- Mémo : assurance ---------- */
function memo() {
  /* mini calendrier : 25 nov. (aujourd'hui) au 31 déc. ; lundi en tête */
  var cases = '', jours = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
  cases += jours.map(function (x) { return '<span style="font-size:12px;color:var(--mut);text-align:center">' + x + '</span>'; }).join('');
  /* 25 nov. 2026 est un mercredi : 2 cases vides */
  for (var v = 0; v < 2; v++) cases += '<span></span>';
  var d = [];
  for (var n = 25; n <= 30; n++) d.push([n, 'nov']);
  for (var m = 1; m <= 31; m++) d.push([m, 'dec']);
  cases += d.map(function (x) {
    var auj = x[0] === 25 && x[1] === 'nov', fin = x[0] === 31 && x[1] === 'dec';
    return '<span class="c-n" style="height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700;' +
      (auj ? 'background:var(--ink);color:#000' : fin ? 'background:var(--bad);color:#000' : x[1] === 'nov' ? 'color:var(--mut)' : 'background:#1c1c1f') + '">' + x[0] + '</span>';
  }).join('');
  return '<div class="c-ecran" style="padding-bottom:150px">' + barre('Assurance à renouveler') +
    '<div style="display:flex;align-items:center;gap:8px;padding:10px 12px 0"><span class="c-etat e-note">📌 Mémo</span><span style="font-size:13px;color:var(--mut)">rien à suivre, une échéance</span></div>' +
    '<div class="c-card" data-utile data-booster="calendrier" style="padding:10px 12px"><div style="display:flex;align-items:baseline;gap:8px;margin-bottom:8px"><b class="c-n" style="font-size:28px;color:var(--att)">36 j</b><b>avant le 31 déc.</b></div>' +
    '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">' + cases + '</div></div>' +
    '<div class="c-h">📎 À réunir</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin:0 12px">' +
    [['📜', 'police actuelle'], ['🧰', 'inventaire du matériel'], ['📈', 'chiffre d’affaires 2026']].map(function (x) { return '<span style="display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;background:var(--card);font-weight:700"><span style="font-size:18px">' + x[0] + '</span>' + x[1] + '</span>'; }).join('') +
    '<span style="display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;background:var(--card);font-weight:700"><span style="font-size:18px">🤝</span>offre d’un 2e assureur</span></div>' +
    '<div class="c-card" data-booster="rappel-mot" style="border:1.5px dashed #5b4f86;background:#1a1726;display:flex;align-items:center;gap:10px"><span style="font-size:22px">🔔</span><span style="flex:1">Je le ressortirai quand tu noteras <b style="color:var(--ia)">« assurance »</b></span><span class="c-sw"></span></div>' +
    dock('', 'org') + '</div>';
}

function recette() {
  var src = document.documentElement.innerHTML.match(/RECETTE[\s\S]*?-->/)[0].replace('-->', '');
  var ids = ['liste', 'organise', 'organise-ligne', 'organise-aide', 'achat', 'decider', 'afaire', 'relecture', 'erreur', 'memo'];
  return '<div class="c-rec"><pre style="white-space:pre-wrap;font:13px/1.45 inherit">' + src.replace(/</g, '&lt;') + '</pre>' + ids.map(function (i) { return '<a href="?e=' + i + '">' + i + '</a>'; }).join(' · ') + '</div>';
}
var R = { recette: recette, liste: liste, organise: organise, 'organise-ligne': organiseLigne, 'organise-aide': organiseAide, achat: achat, decider: decider, afaire: afaire, relecture: relecture, erreur: erreur, memo: memo };
document.getElementById('app').innerHTML = (R[E] || recette)();
})();
</script>
