<!doctype html><html lang="fr" data-theme="clair"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>s3d — compagnon brasseur — la cuve parle : on demande en touchant la cuve, la réponse se dessine dedans</title><style>
:root{--page:#FFFFFF;--pan:#F5F5F5;--sur:#EBEBEB;--bord:#DDDDDD;--bordm:#BFBFBF;--trait:#9E9E9E;--t2:#666666;--t:#333333;--t0:#111111;
--act:#111111;--sur-act:#FFFFFF;--hop:#567F45;--hopt:#3F6B2E;--hopf:#EEF4EA;--eau:#4F7E9B;--eaut:#2F5F7D;--eauf:#EAF1F6;
--alr:#C8382F;--alrt:#A8291F;--alrf:#FBEBEA;--att:#9C7020;--attt:#7F5B10;--attf:#FBF3E2;--fin:#1F64A3;
--fond:#D4D4D4;--voile:rgba(17,17,17,.30);--ombre:0 -6px 24px rgba(0,0,0,.14);
--sans:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;color-scheme:light}
[data-theme="cave"]{--page:#12100E;--pan:#1A1613;--sur:#221D19;--bord:#2C2521;--bordm:#3D342E;--trait:#574A42;--t2:#9A8A7E;--t:#D8CEC5;--t0:#F5F0EA;
--act:#F2C14E;--sur-act:#12100E;--hop:#6E9B5B;--hopt:#86B573;--hopf:#1B2417;--eau:#5B8AA6;--eaut:#5E8CA8;--eauf:#16202A;
--alr:#D6453D;--alrt:#DC5F58;--alrf:#2A1715;--att:#E3B55D;--attt:#E3B55D;--attf:#2A2114;--fin:#86B9E6;
--fond:#070605;--voile:rgba(0,0,0,.55);--ombre:0 -8px 32px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--fond);font-family:var(--sans);color:var(--t);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.s3d-i{width:16px;height:16px;flex:none}
.s3d-n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.s3d-planche{display:flex;flex-wrap:wrap;gap:28px 20px;padding:20px;align-items:flex-start}
.s3d-cadre{display:flex;flex-direction:column;gap:8px}
.s3d-cadre>figcaption{font-size:14px;font-weight:600;color:var(--t0)}
.s3d-cadre>figcaption span{font-weight:400;color:var(--t2)}
.s3d-tel{position:relative;width:390px;height:760px;border-radius:28px;overflow:hidden;background:var(--page);border:1px solid var(--bordm);flex:none}
.s3d-tel.s3d-large{width:1280px}
.s3d-fond{position:absolute;inset:0;filter:blur(2.5px);pointer-events:none}
.s3d-voile{position:absolute;inset:0;background:var(--voile)}
.s3d-ap-tete{height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--bord);font-weight:700;color:var(--t0);font-size:16px}
.s3d-ap-ong{display:flex;gap:16px;padding:8px 12px;font-size:13px;color:var(--t2);border-bottom:1px solid var(--bord)}
.s3d-ap-ong b{color:var(--t0)}
.s3d-ap-gros{display:flex;align-items:baseline;gap:12px;padding:16px 12px 8px}
.s3d-ap-gros .s3d-n{font-size:40px;color:var(--t0)}
@media (max-width:600px){.s3d-planche{padding:0;gap:16px 0}.s3d-cadre>figcaption{padding:0 8px}.s3d-tel.s3d-large{width:390px}}
.s3d-ap-logo{width:20px;height:20px}
.s3d-ap-ligne{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--bord);font-size:14px}
.s3d-ap-barre{margin:12px;height:10px;border-radius:5px;background:var(--sur);position:relative}
.s3d-ap-barre i{position:absolute;inset:0 62% 0 0;border-radius:5px;background:var(--hop)}

.s3d-feuille{position:absolute;left:0;right:0;bottom:0;top:28px;background:var(--pan);border-radius:24px 24px 0 0;box-shadow:var(--ombre);display:flex;flex-direction:column;overflow:hidden}
.s3d-tete{display:flex;align-items:center;gap:2px;height:44px;padding:0 6px 0 12px;border-bottom:1px solid var(--bord)}
.s3d-tete h2{font-size:16px;font-weight:700;color:var(--t0);flex:1;white-space:nowrap}
.s3d-tete h2 span{font-weight:400;color:var(--t2);font-size:13px}
.s3d-ic{width:28px;height:28px;display:grid;place-items:center;border-radius:10px;color:var(--t2)}
.s3d-corps{flex:1;overflow:hidden;padding:10px;display:flex;flex-direction:column;gap:10px}
.s3d-scene{display:grid;grid-template-columns:128px 1fr;gap:10px;align-items:stretch}
.s3d-cuve{width:128px;height:300px}
.s3d-cuve .s3d-paroi{fill:var(--page);stroke:var(--bordm);stroke-width:2}
.s3d-cuve .s3d-biere{fill:var(--attf)}
.s3d-cuve .s3d-pied-c{stroke:var(--bordm);stroke-width:3}
.s3d-cuve .s3d-hb{fill:var(--hop)}
.s3d-cuve .s3d-hb2{fill:var(--hop);opacity:.7}
.s3d-cuve .s3d-hb3{fill:var(--hop);opacity:.45}
.s3d-cuve .s3d-ancien{fill:none;stroke:var(--t2);stroke-dasharray:3 3;stroke-width:1.5}
.s3d-cuve text{font-family:var(--mono);font-size:12px;fill:var(--t0)}
.s3d-cuve .s3d-lbl{font-family:var(--sans);fill:var(--t2)}
.s3d-cuve .s3d-mano{fill:var(--page);stroke:var(--t);stroke-width:2}
.s3d-cuve .s3d-mano.s3d-chaud{stroke:var(--att);fill:var(--attf)}
.s3d-cuve .s3d-aig{stroke:var(--t0);stroke-width:2;stroke-linecap:round}
.s3d-cuve .s3d-repere{fill:var(--eau)}
.s3d-cuve.s3d-eteinte{opacity:.5}
.s3d-points{display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.s3d-pt{display:flex;flex-direction:column;gap:2px;text-align:left;padding:8px 10px;border-radius:16px;background:var(--page);border:1px solid var(--bord);position:relative}
.s3d-pt::before{content:"";position:absolute;left:-11px;top:50%;width:10px;border-top:1px dashed var(--bordm)}
.s3d-pt b{font-size:12px;color:var(--t2);font-weight:700;display:flex;gap:4px;align-items:center}
.s3d-pt b svg.s3d-i{width:13px;height:13px}
.s3d-pt span{font-size:14px;color:var(--t0);line-height:1.25}
.s3d-pt.s3d-vif{border-color:var(--att);background:var(--attf)}
.s3d-pt.s3d-vif b{color:var(--attt)}
.s3d-pied{padding:8px 10px 10px;border-top:1px solid var(--bord);display:flex;flex-direction:column;gap:6px}
.s3d-saisie{display:flex;gap:6px;align-items:center}
.s3d-champ{flex:1;min-width:0;height:40px;border:1px solid var(--bordm);border-radius:10px;background:var(--page);font-size:16px;color:var(--t2);display:flex;align-items:center;padding:0 10px;white-space:nowrap;overflow:hidden}
.s3d-modes{display:flex;border:1px solid var(--bord);border-radius:10px;overflow:hidden;height:40px}
.s3d-modes button{width:34px;display:grid;place-items:center;color:var(--t2)}
.s3d-modes button.s3d-sel{background:var(--act);color:var(--sur-act)}
.s3d-env{width:40px;height:40px;border-radius:10px;background:var(--sur);color:var(--t2);display:grid;place-items:center}
.s3d-lim{display:flex;gap:10px;font-size:12px;color:var(--t2)}
.s3d-lim b{color:var(--t0)}
.s3d-colonne{display:flex;flex-direction:column;gap:8px;min-width:0}
.s3d-q{font-size:14px;color:var(--t0);background:var(--sur);border-radius:16px 16px 16px 4px;padding:8px 10px;line-height:1.3}
.s3d-chrono{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--t2)}
.s3d-chrono .s3d-n{font-size:28px;color:var(--t0);line-height:1}
.s3d-et{list-style:none;display:flex;flex-direction:column;gap:2px;font-size:14px}
.s3d-et li{display:flex;gap:6px;align-items:center;min-height:24px;color:var(--t)}
.s3d-et li svg.s3d-i{width:14px;height:14px;color:var(--hopt)}
.s3d-et li.s3d-c{font-weight:700;color:var(--t0)}
.s3d-et li.s3d-a{color:var(--t2)}
.s3d-et li i{width:14px;height:14px;border-radius:50%;border:2px solid var(--bordm)}
.s3d-et li.s3d-c i{border-color:var(--att);border-right-color:transparent}
.s3d-pet{font-size:13px;color:var(--t2);line-height:1.3}
.s3d-file{display:flex;align-items:center;gap:8px;border:1px dashed var(--bordm);border-radius:16px;padding:8px 10px;font-size:14px;color:var(--t0)}
.s3d-file div{flex:1}.s3d-file small{display:block;font-size:12px;color:var(--t2)}
.s3d-niv{font-size:12px;font-weight:700;color:var(--attt);display:flex;gap:4px;align-items:center}
.s3d-niv svg.s3d-i{width:13px;height:13px}
.s3d-colonne h3{font-size:17px;color:var(--t0);line-height:1.2}
.s3d-geste{font-size:15px;font-weight:600;color:var(--t0);background:var(--attf);border-radius:10px;padding:8px}
.s3d-prop{border:1px solid var(--bord);border-radius:16px;background:var(--page);padding:2px 10px 8px}
.s3d-ch{display:flex;align-items:center;gap:8px;min-height:34px;font-size:14px;color:var(--t0);border-bottom:1px solid var(--bord)}
.s3d-ch .s3d-nom{flex:1}.s3d-ch s{color:var(--t2);font-size:13px}
.s3d-case{width:20px;height:20px;border-radius:6px;background:var(--hop);color:#fff;display:grid;place-items:center}
.s3d-case svg.s3d-i{width:14px;height:14px;stroke-width:3}
.s3d-act{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;align-items:center}
.s3d-act .s3d-mini{flex:1;font-size:12px;color:var(--t2);display:flex;gap:4px;align-items:center}
.s3d-btn{height:32px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.s3d-btn.s3d-p{background:var(--act);color:var(--sur-act)}
.s3d-btn.s3d-s{border:1px solid var(--bordm);background:var(--page);color:var(--t0)}
.s3d-btn.s3d-g{color:var(--t)}
.s3d-ctl{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--t);padding:8px 10px;border-radius:16px;border:1px solid var(--bord);background:var(--page)}
.s3d-ctl span{flex:1}.s3d-ctl b{color:var(--eaut)}
.s3d-echec{border:1px solid var(--att);background:var(--attf);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px}
.s3d-echec h3{font-size:16px;color:var(--t0);display:flex;gap:6px;align-items:center}
.s3d-echec h3 svg{color:var(--attt)}
.s3d-echec p{font-size:14px;color:var(--t)}
.s3d-bandeau{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--attt)}

panier" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></symbol><symbol id="s3d-i-feuille" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></symbol><symbol id="s3d-i-pression" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></symbol><symbol id="s3d-i-question" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/></symbol><symbol id="s3d-i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></symbol><symbol id="s3d-i-panneau" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></symbol><symbol id="s3d-i-goutte" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></symbol><symbol id="s3d-i-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></symbol></svg>
<main class="s3d-planche"><!--titre:la cuve parle : on demande en touchant la cuve, la réponse se dessine dedans-->
