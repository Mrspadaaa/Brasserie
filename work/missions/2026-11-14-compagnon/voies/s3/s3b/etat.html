<!doctype html><html lang="fr" data-theme="clair"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>s3b — compagnon brasseur — les représentations : feu, jauges, barres avant après</title><style>
:root{--page:#FFFFFF;--pan:#F5F5F5;--sur:#EBEBEB;--bord:#DDDDDD;--bordm:#BFBFBF;--trait:#9E9E9E;--t2:#666666;--t:#333333;--t0:#111111;
--act:#111111;--sur-act:#FFFFFF;--hop:#567F45;--hopt:#3F6B2E;--hopf:#EEF4EA;--eau:#4F7E9B;--eaut:#2F5F7D;--eauf:#EAF1F6;
--alr:#C8382F;--alrt:#A8291F;--alrf:#FBEBEA;--att:#9C7020;--attt:#7F5B10;--attf:#FBF3E2;--fin:#1F64A3;
--fond:#D4D4D4;--voile:rgba(17,17,17,.30);--ombre:0 -6px 24px rgba(0,0,0,.14);
--sans:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;color-scheme:light}
[data-theme="cave"]{--page:#12100E;--pan:#1A1613;--sur:#221D19;--bord:#2C2521;--bordm:#3D342E;--trait:#574A42;--t2:#9A8A7E;--t:#D8CEC5;--t0:#F5F0EA;
--act:#F2C14E;--sur-act:#12100E;--hop:#6E9B5B;--hopt:#86B573;--hopf:#1B2417;--eau:#5B8AA6;--eaut:#5E8CA8;--eauf:#16202A;
--alr:#D6453D;--alrt:#DC5F58;--alrf:#2A1715;--att:#E3B55D;--attt:#E3B55D;--attf:#2A2114;--fin:#86B9E6;
--fond:#070605;--voile:rgba(0,0,0,.55);--ombre:0 -8px 32px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--fond);font-family:var(--sans);color:var(--t);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.s3b-i{width:16px;height:16px;flex:none}
.s3b-n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.s3b-planche{display:flex;flex-wrap:wrap;gap:28px 20px;padding:20px;align-items:flex-start}
.s3b-cadre{display:flex;flex-direction:column;gap:8px}
.s3b-cadre>figcaption{font-size:14px;font-weight:600;color:var(--t0)}
.s3b-cadre>figcaption span{font-weight:400;color:var(--t2)}
.s3b-tel{position:relative;width:390px;height:760px;border-radius:28px;overflow:hidden;background:var(--page);border:1px solid var(--bordm);flex:none}
.s3b-tel.s3b-large{width:1280px}
.s3b-fond{position:absolute;inset:0;filter:blur(2.5px);pointer-events:none}
.s3b-voile{position:absolute;inset:0;background:var(--voile)}
.s3b-ap-tete{height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--bord);font-weight:700;color:var(--t0);font-size:16px}
.s3b-ap-ong{display:flex;gap:16px;padding:8px 12px;font-size:13px;color:var(--t2);border-bottom:1px solid var(--bord)}
.s3b-ap-ong b{color:var(--t0)}
.s3b-ap-gros{display:flex;align-items:baseline;gap:12px;padding:16px 12px 8px}
.s3b-ap-gros .s3b-n{font-size:40px;color:var(--t0)}
@media (max-width:600px){.s3b-planche{padding:0;gap:16px 0}.s3b-cadre>figcaption{padding:0 8px}.s3b-tel.s3b-large{width:390px}}
.s3b-ap-logo{width:20px;height:20px}
.s3b-ap-ligne{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--bord);font-size:14px}
.s3b-ap-barre{margin:12px;height:10px;border-radius:5px;background:var(--sur);position:relative}
.s3b-ap-barre i{position:absolute;inset:0 62% 0 0;border-radius:5px;background:var(--hop)}

.s3b-feuille{position:absolute;left:0;right:0;bottom:0;top:40px;background:var(--pan);border-radius:24px 24px 0 0;box-shadow:var(--ombre);display:flex;flex-direction:column;overflow:hidden}
.s3b-tete{display:flex;align-items:center;gap:4px;padding:10px 6px 6px 12px}
.s3b-tete h2{font-size:14px;font-weight:700;color:var(--t0);flex:1}
.s3b-tete h2 span{font-weight:400;color:var(--t2)}
.s3b-ic{width:28px;height:28px;display:grid;place-items:center;border-radius:10px;color:var(--t2)}
.s3b-corps{flex:1;overflow:hidden;padding:4px 10px 10px;display:flex;flex-direction:column;gap:10px}
.s3b-pied{padding:8px 10px 10px;border-top:1px solid var(--bord);display:flex;flex-direction:column;gap:8px}
.s3b-saisie{display:flex;gap:6px;align-items:center}
.s3b-champ{flex:1;height:40px;border:1px solid var(--bordm);border-radius:10px;background:var(--page);font-size:16px;color:var(--t2);display:flex;align-items:center;padding:0 10px;min-width:0;white-space:nowrap;overflow:hidden}
.s3b-env{width:40px;height:40px;border-radius:10px;background:var(--sur);color:var(--t2);display:grid;place-items:center}
.s3b-pres{display:flex;align-items:center;gap:8px;background:var(--page);border:1px solid var(--bord);border-radius:16px;padding:8px 10px}
.s3b-pres h3{font-size:17px;color:var(--t0);line-height:1.2}
.s3b-pres p{font-size:13px;color:var(--t2)}
/* tuiles de questions */
.s3b-tuiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.s3b-tuile{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:10px;border-radius:16px;background:var(--page);border:1px solid var(--bord);min-height:84px;font-size:14px;color:var(--t0);line-height:1.25}
.s3b-tuile svg.s3b-i{width:20px;height:20px;color:var(--hopt)}
.s3b-tuile.s3b-large{grid-column:span 2;flex-direction:row;align-items:center;min-height:48px}
/* modes en jauges */
.s3b-lbl{font-size:12px;font-weight:600;color:var(--t2);display:flex;justify-content:space-between}
.s3b-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.s3b-m{border:1px solid var(--bord);background:var(--page);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:4px;text-align:left}
.s3b-m b{font-size:14px;color:var(--t0)}
.s3b-m.s3b-sel{border:2px solid var(--t0);padding:5px 7px}
.s3b-jr{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t2)}
.s3b-jr i{display:flex;gap:2px}
.s3b-jr i u{width:10px;height:6px;border-radius:2px;background:var(--bord);text-decoration:none}
.s3b-jr i u.s3b-v{background:var(--t)}
.s3b-m small{font-size:12px;color:var(--t2)}
.s3b-budget{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px;color:var(--t2)}
.s3b-budget div{display:flex;flex-direction:column;gap:3px}
.s3b-budget b{color:var(--t0);font-weight:600}
.s3b-piste{height:6px;border-radius:3px;background:var(--bord);position:relative;overflow:hidden}
.s3b-piste i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--hop)}
/* attente */
.s3b-q{align-self:flex-end;max-width:86%;background:var(--sur);color:var(--t0);border-radius:16px 16px 4px 16px;padding:8px 10px;font-size:14px;line-height:1.35}
.s3b-chrono{background:var(--page);border:1px solid var(--bord);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.s3b-chrono-h{display:flex;align-items:baseline;gap:8px}
.s3b-chrono-h .s3b-n{font-size:28px;color:var(--t0);line-height:1}
.s3b-chrono-h span:last-child{font-size:13px;color:var(--t2)}
.s3b-duree{position:relative;height:28px;margin-top:4px}
.s3b-duree .s3b-rail{position:absolute;left:0;right:0;top:10px;height:8px;border-radius:4px;background:var(--sur)}
.s3b-duree .s3b-hab{position:absolute;top:6px;height:16px;border-radius:4px;background:var(--hopf);border:1px solid var(--hop)}
.s3b-duree .s3b-fait{position:absolute;left:0;top:10px;height:8px;border-radius:4px;background:var(--att)}
.s3b-duree .s3b-aig{position:absolute;top:2px;width:2px;height:24px;background:var(--t0)}
.s3b-graduation{display:flex;justify-content:space-between;font-size:12px;color:var(--t2)}
.s3b-seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.s3b-seg div{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--t2)}
.s3b-seg div i{height:6px;border-radius:3px;background:var(--bord)}
.s3b-seg div.s3b-f i{background:var(--hop)}
.s3b-seg div.s3b-f{color:var(--t)}
.s3b-seg div.s3b-e i{background:linear-gradient(90deg,var(--hop) 55%,var(--bord) 55%)}
.s3b-seg div.s3b-e{color:var(--t0);font-weight:600}
.s3b-ligne{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--t2)}
.s3b-ligne svg.s3b-i{width:14px;height:14px}
.s3b-file{display:flex;align-items:center;gap:8px;border:1px dashed var(--bordm);border-radius:16px;padding:8px 10px;font-size:14px;color:var(--t0)}
.s3b-file .s3b-rang{width:24px;height:24px;border-radius:50%;background:var(--sur);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--t);flex:none}
.s3b-file div{flex:1}
.s3b-file small{display:block;font-size:12px;color:var(--t2)}
/* réponse */
.s3b-verdict{display:flex;gap:10px;align-items:flex-start;background:var(--page);border:1px solid var(--bord);border-radius:16px;padding:10px}
.s3b-feu{display:flex;flex-direction:column;gap:4px;padding:5px;border-radius:10px;background:var(--sur);flex:none}
.s3b-feu i{width:14px;height:14px;border-radius:50%;background:var(--bord);display:block}
.s3b-feu i.s3b-ambre{background:var(--att);box-shadow:0 0 0 3px var(--attf)}
.s3b-verdict h3{font-size:17px;color:var(--t0);line-height:1.2}
.s3b-verdict p{font-size:14px;color:var(--t);margin-top:4px}
.s3b-verdict p b{color:var(--t0)}
.s3b-niv{font-size:12px;font-weight:700;color:var(--attt)}
.s3b-barres{background:var(--page);border:1px solid var(--bord);border-radius:16px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.s3b-br{display:grid;grid-template-columns:20px 74px 1fr 82px;align-items:center;gap:6px;min-height:34px;font-size:14px;color:var(--t0)}
.s3b-case{width:20px;height:20px;border-radius:6px;background:var(--hop);color:#fff;display:grid;place-items:center}
.s3b-case svg.s3b-i{width:14px;height:14px;stroke-width:3}
.s3b-tr{position:relative;height:14px}
.s3b-tr .s3b-av{position:absolute;left:0;top:0;bottom:0;border:1px dashed var(--t2);border-radius:4px}
.s3b-tr .s3b-ap{position:absolute;left:0;top:3px;bottom:3px;border-radius:3px;background:var(--hop)}
.s3b-br .s3b-v{font-size:13px;text-align:right;color:var(--t0)}
.s3b-br .s3b-v s{color:var(--t2)}
.s3b-jours{display:flex;gap:3px;align-items:center}
.s3b-jours u{width:12px;height:12px;border-radius:3px;background:var(--hop);text-decoration:none}
.s3b-jours u.s3b-nv{background:transparent;border:1.5px solid var(--hop)}
.s3b-total{display:flex;justify-content:space-between;font-size:13px;color:var(--t2);padding-top:6px;border-top:1px solid var(--bord)}
.s3b-total b{color:var(--t0)}
.s3b-act{display:flex;gap:8px;justify-content:flex-end;padding-top:6px}
.s3b-btn{height:32px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.s3b-btn.s3b-p{background:var(--act);color:var(--sur-act)}
.s3b-btn.s3b-s{border:1px solid var(--bordm);background:var(--page);color:var(--t0)}
.s3b-btn.s3b-g{color:var(--t)}
.s3b-ctl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--t)}
.s3b-jalon{flex:none;height:28px;padding:0 8px;border-radius:10px;background:var(--eauf);color:var(--eaut);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.s3b-ctl span{flex:1}
.s3b-puces{display:flex;flex-wrap:wrap;gap:6px}
.s3b-puce{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border-radius:10px;border:1px solid var(--bord);background:var(--page);font-size:12px;color:var(--t)}
.s3b-puce svg.s3b-i{width:13px;height:13px;color:var(--hopt)}
/* erreur */
.s3b-chemin{background:var(--page);border:1px solid var(--bord);border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;gap:10px}
.s3b-noeuds{display:grid;grid-template-columns:auto 1fr auto 1fr auto;align-items:center;gap:6px}
.s3b-nd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--t2);width:70px;text-align:center}
.s3b-nd .s3b-rd{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--hop);color:var(--hopt)}
.s3b-nd.s3b-loin .s3b-rd{border:2px dashed var(--bordm);color:var(--t2)}
.s3b-nd .s3b-rd svg.s3b-i{width:18px;height:18px}
.s3b-lien{height:2px;background:var(--hop);border-radius:1px}
.s3b-lien.s3b-coupe{background:repeating-linear-gradient(90deg,var(--bordm) 0 6px,transparent 6px 10px)}
.s3b-coupure{width:28px;height:28px;border-radius:50%;background:var(--attf);color:var(--attt);display:grid;place-items:center}
.s3b-chemin h3{font-size:17px;color:var(--t0)}
.s3b-chemin p{font-size:14px;color:var(--t)}
.s3b-garde{display:flex;align-items:center;gap:8px;border:1px solid var(--att);border-radius:16px;padding:8px 10px;font-size:14px;color:var(--t0);background:var(--attf)}
.s3b-garde small{display:block;font-size:12px;color:var(--attt);font-weight:600}
.s3b-garde div{flex:1}
.s3b-bandeau{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--attt)}

.s3b-tuile span{display:block}
.s3b-ctl span{flex:none}.s3b-ctl>span:nth-child(2){flex:1}
.s3b-feu i.s3b-vert{background:var(--hop);box-shadow:0 0 0 3px var(--hopf)}
.s3b-convs{display:flex;align-items:center;gap:5px;min-height:36px;padding:0 10px;border:1px solid var(--bord);border-radius:10px;background:var(--page);font-size:13px;color:var(--t)}
.s3b-convs>span:first-of-type{flex:1;text-align:left;font-weight:600;color:var(--t0)}
.s3b-convs svg.s3b-i{color:var(--t2)}
.s3b-pt{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:4px}
.s3b-pv{background:var(--hop)}.s3b-pa{background:var(--att)}.s3b-pr{background:var(--alr)}

.s3b-tuile span span{display:inline}
.s3b-pile{display:flex;gap:2px;height:14px}
.s3b-pile i{border-radius:3px;background:var(--hop)}
.s3b-pile i:nth-child(2){opacity:.7}.s3b-pile i:nth-child(3){opacity:.45}
.s3b-leg{display:grid;grid-template-columns:96px 85fr 43fr 43fr 104px;font-size:12px;color:var(--t2);gap:2px;margin-top:-4px}
.s3b-leg span:first-child{grid-column:2}.s3b-leg span:last-child{text-align:right;color:var(--attt);font-weight:600}
.s3b-convs{white-space:nowrap}
