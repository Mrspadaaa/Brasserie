<!doctype html><html lang="fr" data-theme="clair"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>s3a — compagnon brasseur — la base sur deux places, chrome sur une ligne</title><style>
:root{--page:#FFFFFF;--pan:#F5F5F5;--sur:#EBEBEB;--bord:#DDDDDD;--bordm:#BFBFBF;--trait:#9E9E9E;--t2:#666666;--t:#333333;--t0:#111111;
--act:#111111;--sur-act:#FFFFFF;--hop:#567F45;--hopt:#3F6B2E;--hopf:#EEF4EA;--eau:#4F7E9B;--eaut:#2F5F7D;--eauf:#EAF1F6;
--alr:#C8382F;--alrt:#A8291F;--alrf:#FBEBEA;--att:#9C7020;--attt:#7F5B10;--attf:#FBF3E2;--fin:#1F64A3;
--fond:#D4D4D4;--voile:rgba(17,17,17,.30);--ombre:0 -6px 24px rgba(0,0,0,.14);
--sans:"Source Sans 3","Source Sans Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;color-scheme:light}
[data-theme="cave"]{--page:#12100E;--pan:#1A1613;--sur:#221D19;--bord:#2C2521;--bordm:#3D342E;--trait:#574A42;--t2:#9A8A7E;--t:#D8CEC5;--t0:#F5F0EA;
--act:#F2C14E;--sur-act:#12100E;--hop:#6E9B5B;--hopt:#86B573;--hopf:#1B2417;--eau:#5B8AA6;--eaut:#5E8CA8;--eauf:#16202A;
--alr:#D6453D;--alrt:#DC5F58;--alrf:#2A1715;--att:#E3B55D;--attt:#E3B55D;--attf:#2A2114;--fin:#86B9E6;
--fond:#070605;--voile:rgba(0,0,0,.55);--ombre:0 -8px 32px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--fond);font-family:var(--sans);color:var(--t);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.s3a-i{width:16px;height:16px;flex:none}
.s3a-n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.s3a-planche{display:flex;flex-wrap:wrap;gap:28px 20px;padding:20px;align-items:flex-start}
.s3a-cadre{display:flex;flex-direction:column;gap:8px}
.s3a-cadre>figcaption{font-size:14px;font-weight:600;color:var(--t0)}
.s3a-cadre>figcaption span{font-weight:400;color:var(--t2)}
.s3a-tel{position:relative;width:390px;height:760px;border-radius:28px;overflow:hidden;background:var(--page);border:1px solid var(--bordm);flex:none}
.s3a-tel.s3a-large{width:1280px}
.s3a-fond{position:absolute;inset:0;filter:blur(2.5px);pointer-events:none}
.s3a-voile{position:absolute;inset:0;background:var(--voile)}
.s3a-ap-tete{height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--bord);font-weight:700;color:var(--t0);font-size:16px}
.s3a-ap-ong{display:flex;gap:16px;padding:8px 12px;font-size:13px;color:var(--t2);border-bottom:1px solid var(--bord)}
.s3a-ap-ong b{color:var(--t0)}
.s3a-ap-gros{display:flex;align-items:baseline;gap:12px;padding:16px 12px 8px}
.s3a-ap-gros .s3a-n{font-size:40px;color:var(--t0)}
@media (max-width:600px){.s3a-planche{padding:0;gap:16px 0}.s3a-cadre>figcaption{padding:0 8px}.s3a-tel.s3a-large{width:390px}}
.s3a-ap-logo{width:20px;height:20px}
.s3a-ap-ligne{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--bord);font-size:14px}
.s3a-ap-barre{margin:12px;height:10px;border-radius:5px;background:var(--sur);position:relative}
.s3a-ap-barre i{position:absolute;inset:0 62% 0 0;border-radius:5px;background:var(--hop)}

.s3a-feuille{position:absolute;left:0;right:0;bottom:0;top:52px;background:var(--pan);border-radius:24px 24px 0 0;box-shadow:var(--ombre);display:flex;flex-direction:column;overflow:hidden}
.s3a-poignee{width:36px;height:4px;border-radius:2px;background:var(--bordm);margin:6px auto 0}
.s3a-tete{display:flex;align-items:center;gap:2px;height:40px;padding:0 6px 0 12px;border-bottom:1px solid var(--bord)}
.s3a-tete h2{font-size:16px;font-weight:700;color:var(--t0);white-space:nowrap}
.s3a-tete .s3a-ctx{font-size:13px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;margin-left:6px}
.s3a-ic{width:28px;height:28px;display:grid;place-items:center;border-radius:10px;color:var(--t2);position:relative}
.s3a-ic.s3a-on{color:var(--hopt)}
.s3a-ic .s3a-pt{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--hop);border:1.5px solid var(--pan)}
.s3a-fil{flex:1;overflow:hidden;padding:12px 10px;display:flex;flex-direction:column;gap:12px}
.s3a-pied{border-top:1px solid var(--bord);padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;background:var(--pan)}
.s3a-saisie{display:flex;align-items:center;gap:6px}
.s3a-champ{flex:1;min-width:0;height:40px;border:1px solid var(--bordm);border-radius:10px;background:var(--page);display:flex;align-items:center;gap:6px;padding:0 4px 0 4px}
.s3a-champ .s3a-txt{font-size:16px;color:var(--t2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s3a-champ .s3a-txt.s3a-plein{color:var(--t0)}
.s3a-mode{height:28px;display:flex;align-items:center;gap:3px;padding:0 6px 0 8px;border-radius:8px;background:var(--sur);font-size:12px;font-weight:600;color:var(--t)}
.s3a-mode svg.s3a-i{width:12px;height:12px}
.s3a-env{width:40px;height:40px;border-radius:10px;background:var(--act);color:var(--sur-act);display:grid;place-items:center}
.s3a-env.s3a-off{background:var(--sur);color:var(--t2)}
.s3a-hl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--attt);font-weight:600}
/* accueil */
.s3a-bonjour h3{font-size:18px;color:var(--t0);font-weight:700}
.s3a-bonjour p{font-size:14px;color:var(--t2);margin-top:2px}
.s3a-sugg{display:flex;flex-direction:column;border:1px solid var(--bord);border-radius:16px;background:var(--page);overflow:hidden}
.s3a-sugg button{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 10px;font-size:14px;color:var(--t0);text-align:left;border-top:1px solid var(--bord)}
.s3a-sugg button:first-child{border-top:0}
.s3a-sugg button span{flex:1}
.s3a-sugg button svg{color:var(--hopt)}
.s3a-titre{font-size:12px;font-weight:600;color:var(--t2)}
.s3a-lit{display:flex;flex-wrap:wrap;gap:6px}
.s3a-puce{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:10px;border:1px solid var(--bord);background:var(--page);font-size:13px;color:var(--t)}
.s3a-puce svg.s3a-i{width:14px;height:14px;color:var(--t2)}
.s3a-lim{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t2);margin-top:auto;padding:8px 2px 0;border-top:1px solid var(--bord)}
.s3a-lim b{color:var(--t0);font-weight:600}
/* conversation */
.s3a-q{align-self:flex-end;max-width:84%;background:var(--sur);color:var(--t0);border-radius:16px 16px 4px 16px;padding:8px 10px;font-size:14px;line-height:1.35}
.s3a-q small{display:block;font-size:12px;color:var(--t2);margin-top:4px}
.s3a-q.s3a-file{background:transparent;border:1px dashed var(--bordm)}
.s3a-q.s3a-garde{border:1px solid var(--att)}
.s3a-cours{border:1px solid var(--bord);background:var(--page);border-radius:16px;padding:10px}
.s3a-cours-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--t0)}
.s3a-cours-h .s3a-n{margin-left:auto;font-size:16px;font-weight:500}
.s3a-etapes{list-style:none;margin:8px 0 6px;display:flex;flex-direction:column;gap:2px}
.s3a-etapes li{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--t);min-height:26px}
.s3a-etapes li svg{color:var(--hopt)}
.s3a-etapes li.s3a-ici{color:var(--t0);font-weight:600}
.s3a-etapes li.s3a-pas{color:var(--t2)}
.s3a-rond{width:16px;height:16px;border-radius:50%;border:2px solid var(--bordm);flex:none}
.s3a-ici .s3a-rond{border-color:var(--hop);border-right-color:transparent}
.s3a-note{font-size:13px;color:var(--t2);display:flex;gap:6px;align-items:flex-start;line-height:1.35}
.s3a-note svg.s3a-i{width:14px;height:14px;margin-top:2px}
.s3a-sep{height:1px;background:var(--bord);margin:6px 0}
.s3a-lien{font-size:13px;font-weight:600;color:var(--t);height:28px;padding:0 8px;border-radius:10px;border:1px solid var(--bord);background:var(--page);display:inline-flex;align-items:center;gap:5px}
/* réponse */
.s3a-rep{display:flex;flex-direction:column;gap:8px}
.s3a-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2)}
.s3a-niv{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:10px;font-size:12px;font-weight:700}
.s3a-niv.s3a-att{background:var(--attf);color:var(--attt)}
.s3a-niv.s3a-info{background:var(--eauf);color:var(--eaut)}
.s3a-niv svg.s3a-i{width:13px;height:13px}
.s3a-rep h3{font-size:17px;line-height:1.25;color:var(--t0);font-weight:700}
.s3a-geste{background:var(--attf);border-radius:10px;padding:8px 10px;font-size:15px;color:var(--t0);font-weight:600}
.s3a-plie{display:flex;align-items:center;gap:6px;min-height:32px;font-size:13px;color:var(--t);border-top:1px solid var(--bord);padding-top:2px}
.s3a-plie span{flex:1}
.s3a-plie em{font-style:normal;color:var(--t2)}
.s3a-ctl{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--page);border:1px solid var(--bord)}
.s3a-ctl div{flex:1;font-size:14px;line-height:1.3;color:var(--t)}
.s3a-ctl div b{display:block;font-size:12px;color:var(--t2);font-weight:600}
.s3a-prop{border:1px solid var(--bord);border-radius:16px;background:var(--page);padding:4px 10px 10px}
.s3a-prop-h{font-size:13px;font-weight:700;color:var(--t0);padding:6px 0 2px}
.s3a-ch{display:flex;align-items:center;gap:8px;min-height:36px;font-size:14px;border-bottom:1px solid var(--bord)}
.s3a-ch .s3a-nom{flex:1;color:var(--t0)}
.s3a-ch .s3a-av{color:var(--t2);text-decoration:line-through;font-size:13px}
.s3a-ch .s3a-ap{color:var(--t0);font-weight:600;font-size:14px;min-width:38px;text-align:right}
.s3a-ch svg.s3a-fl{width:13px;height:13px;color:var(--t2)}
.s3a-case{width:20px;height:20px;border-radius:6px;background:var(--hop);color:#fff;display:grid;place-items:center;flex:none}
.s3a-case svg.s3a-i{width:14px;height:14px;stroke-width:3}
.s3a-act{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.s3a-btn{height:32px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.s3a-btn.s3a-p{background:var(--act);color:var(--sur-act)}
.s3a-btn.s3a-s{border:1px solid var(--bordm);background:var(--page);color:var(--t0)}
.s3a-btn.s3a-g{color:var(--t)}
.s3a-ancien{opacity:.9;display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--bord)}
.s3a-ancien p{font-size:14px;color:var(--t)}
.s3a-echec{border:1px solid var(--att);background:var(--attf);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px}
.s3a-echec h3{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--t0)}
.s3a-echec h3 svg{color:var(--attt)}
.s3a-echec p{font-size:14px;color:var(--t);line-height:1.35}
/* 1280 */
.s3a-bureau{position:absolute;inset:0;display:flex}
.s3a-nav{width:200px;border-right:1px solid var(--bord);padding:16px 12px;display:flex;flex-direction:column;gap:4px;background:var(--pan)}
.s3a-nav b{font-size:16px;color:var(--t0);margin-bottom:12px}
.s3a-nav span{font-size:14px;color:var(--t2);height:32px;display:flex;align-items:center;padding:0 8px;border-radius:10px}
.s3a-nav span.s3a-sel{background:var(--sur);color:var(--t0);font-weight:600}
.s3a-page{flex:1;padding:20px 24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.s3a-page h1{font-size:20px;color:var(--t0)}
.s3a-page .s3a-gr{display:flex;gap:24px;align-items:baseline;font-size:14px;color:var(--t2)}
.s3a-page .s3a-gr .s3a-n{font-size:36px;color:var(--t0)}
.s3a-tab{border:1px solid var(--bord);border-radius:16px;overflow:hidden}
.s3a-tab div{display:flex;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--bord);font-size:14px}
.s3a-tab div:first-child{border-top:0;color:var(--t2);font-size:13px}
.s3a-tab div.s3a-vise{background:var(--attf)}
.s3a-lat{width:420px;border-left:1px solid var(--bordm);background:var(--pan);display:flex;flex-direction:column;box-shadow:-8px 0 24px rgba(0,0,0,.08)}

.s3a-plie{text-align:left}
.s3a-page .s3a-gr .s3a-n{font-size:14px;color:var(--t0)}
.s3a-page .s3a-gr .s3a-n.s3a-big{font-size:36px}
.s3a-repr{display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 10px;border:1px solid var(--bord);border-radius:16px;background:var(--page);text-align:left}
.s3a-repr>span:nth-child(2){flex:1;font-size:14px;color:var(--t0)}
.s3a-repr small{display:block;font-size:12px;color:var(--t2)}
.s3a-repr>svg:first-child{color:var(--t2)}
.s3a-repr b{font-weight:600}
