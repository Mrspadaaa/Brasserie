<!doctype html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>z3 · Local et travaux, la file dans Prévisions</title>
<style>
:root{--renoz3-line:#DDDDDD;--renoz3-surf:#F5F5F5;--renoz3-surf2:#EBEBEB;--renoz3-fin:#1F64A3;--renoz3-ok:#3F6B2E;--renoz3-al:#A8291F;--renoz3-att:#7F5B10;--renoz3-mono:"IBM Plex Mono",Consolas,ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.3;color:#111;background:#fff}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.renoz3-m{font-family:var(--renoz3-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.renoz3-head{border-bottom:1px solid var(--renoz3-line)}
.renoz3-head-in{max-width:880px;margin:0 auto;height:40px;display:flex;align-items:center;gap:8px;padding:0 8px}
.renoz3-logo{width:30px;height:30px;border-radius:10px;background:#111;color:#fff;display:grid;place-items:center;flex:none}
.renoz3-brand{font-size:18px;font-weight:500;flex:1}
.renoz3-hbtn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#333;flex:none}
.renoz3-hbtn.renoz3-hf{background:var(--renoz3-surf2);border:1px solid #BFBFBF}
.renoz3-wrap{max-width:872px;margin:0 auto;padding:0 12px 76px}
.renoz3-tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--renoz3-line)}
.renoz3-tabs button{height:34px;color:#333;border-bottom:2px solid transparent;text-align:center}
.renoz3-tabs button[aria-selected=true]{color:var(--renoz3-fin);border-color:var(--renoz3-fin);background:rgba(31,100,163,.05);font-weight:600}
.renoz3-bar{display:flex;align-items:center;gap:8px;padding:8px 0 4px}
.renoz3-bar h2{font-size:16px;font-weight:600;margin:0;flex:1}
.renoz3-seg{display:flex;gap:6px;padding:0 0 6px}
.renoz3-seg button{height:28px;padding:0 10px;border-radius:10px;border:1px solid transparent;font-size:13px;color:#333;display:inline-flex;align-items:center;gap:6px}
.renoz3-seg button[aria-pressed=true]{background:var(--renoz3-surf2);border-color:#BFBFBF;color:var(--renoz3-fin);font-weight:600}
.renoz3-seg b{font-family:var(--renoz3-mono);font-weight:600;color:#111}
.renoz3-off{display:flex;gap:6px;align-items:center;margin:0 0 6px;padding:6px 10px;border-radius:10px;background:var(--renoz3-surf);font-size:13px;color:#333}
.renoz3-caisse{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:6px 0;border-top:1px solid var(--renoz3-line);border-bottom:1px solid var(--renoz3-line);font-size:13px;color:#333}
.renoz3-caisse b{font-family:var(--renoz3-mono);font-weight:600;color:#111;font-size:14px}
.renoz3-link{color:var(--renoz3-fin);font-weight:600;display:inline-flex;align-items:center;gap:2px;min-height:24px}
.renoz3-solde{grid-column:1/-1;display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--renoz3-surf2);margin-top:2px}
.renoz3-solde i{display:block;height:100%}
.renoz3-ctx{font-size:13px;color:#333;padding:6px 0 2px;display:flex;gap:10px;flex-wrap:wrap}
.renoz3-ctx b{font-family:var(--renoz3-mono);font-weight:600;color:#111}
.renoz3-file{position:relative;margin:6px 0 0 36px;padding-left:24px}
.renoz3-file::before{content:"";position:absolute;left:0;top:12px;bottom:36px;width:2px;background:#BFBFBF;transform:translateX(-50%)}
.renoz3-flag{position:absolute;left:-48px;top:-2px;display:inline-block;font-size:12px;font-weight:600;padding:1px 6px;border-radius:10px;background:#111;color:#fff;z-index:1}
.renoz3-flag + .renoz3-it{margin-top:20px}
.renoz3-it{position:relative;display:grid;grid-template-columns:1fr auto 52px;gap:8px;align-items:center;min-height:44px;border-bottom:1px solid var(--renoz3-line)}
.renoz3-it.renoz3-dim{opacity:.55}
.renoz3-node{position:absolute;left:-24px;top:50%;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;background:#111;color:#fff;font-family:var(--renoz3-mono);font-weight:600;font-size:13px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 0 0 1px #BFBFBF}
.renoz3-node.renoz3-s-afaire{background:#8A4A2A}.renoz3-node.renoz3-s-enc{background:#567F45}.renoz3-node.renoz3-s-pay{background:var(--renoz3-fin)}.renoz3-node.renoz3-s-dev{background:#9C7020}
.renoz3-node.renoz3-s-blo{background:#fff;color:#666;border:2px dashed #666;box-shadow:none}.renoz3-node.renoz3-s-fait{background:var(--renoz3-ok)}.renoz3-node.renoz3-s-dep{background:#C8382F}
.renoz3-t{font-size:14px;color:#111;min-height:36px;display:flex;flex-direction:column;justify-content:center}
.renoz3-t small{display:block;font-size:12px;color:#333;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.renoz3-nat{display:inline-flex;align-items:center;gap:3px;min-height:24px;color:#333;font-size:12px}
.renoz3-comp{display:flex;align-items:center;gap:10px;min-height:44px;width:100%;text-align:left;border-top:1px solid var(--renoz3-line);margin-top:8px}
.renoz3-comp strong{flex:1;font-size:15px;font-weight:500}.renoz3-comp span{font-size:13px;color:#555}
.renoz3-h{display:inline-flex;align-items:center;gap:3px;font-family:var(--renoz3-mono);font-weight:600;color:#111}
.renoz3-v{font-family:var(--renoz3-mono);font-weight:600;font-size:14px;text-align:right;white-space:nowrap}
.renoz3-v.renoz3-e{font-family:inherit;font-weight:400;font-size:12px;color:#333}
.renoz3-v.renoz3-al{color:var(--renoz3-al)}
.renoz3-ud{display:flex;gap:2px}
.renoz3-ud button{width:25px;height:28px;border-radius:10px;display:grid;place-items:center;color:#333;border:1px solid var(--renoz3-line)}
.renoz3-add{display:flex;align-items:center;gap:8px;min-height:36px;width:100%;color:#333;font-size:14px;position:relative}
.renoz3-add .renoz3-node{background:#fff;color:#333;box-shadow:0 0 0 1px #BFBFBF}
.renoz3-in{display:flex;align-items:center;gap:6px;padding:6px 0 4px}
.renoz3-in input{flex:1;height:32px;border:1px solid #BFBFBF;border-radius:10px;padding:0 10px;font:inherit;font-size:16px;color:#111;background:#fff}
.renoz3-in input:focus{outline:2px solid #111;outline-offset:1px}
.renoz3-btn{height:32px;padding:0 12px;border-radius:10px;background:#111;color:#fff;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.renoz3-btn2{height:28px;padding:0 10px;border-radius:10px;border:1px solid #BFBFBF;background:#fff;font-size:13px;display:inline-flex;align-items:center;gap:6px;color:#111}
.renoz3-kb{position:fixed;left:0;right:0;bottom:0;height:240px;background:#D9DCE1;border-top:1px solid #BFBFBF;z-index:6}.renoz3-kb svg{display:block;width:100%;height:100%}
.renoz3-sheet{position:fixed;left:0;right:0;bottom:0;z-index:7;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:8px 12px 10px;max-width:560px;margin:0 auto}
.renoz3-sheet h3{margin:0;font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}
.renoz3-sheet h3 .renoz3-x{margin-left:auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--renoz3-surf2)}
.renoz3-form{display:grid;grid-template-columns:72px 1fr;gap:6px 8px;align-items:center;padding:6px 0;font-size:13px;color:#333}
.renoz3-sg{display:flex;gap:2px;border:1px solid #BFBFBF;border-radius:10px;overflow:hidden}
.renoz3-sg button{flex:1;height:28px;text-align:center;font-size:13px;color:#333}
.renoz3-sg button[aria-pressed=true]{background:#111;color:#fff;font-weight:600}
.renoz3-step{display:inline-flex;align-items:center;border:1px solid #BFBFBF;border-radius:10px;overflow:hidden}
.renoz3-step button{width:30px;height:28px;display:grid;place-items:center;color:#333}
.renoz3-step b{font-family:var(--renoz3-mono);font-size:14px;min-width:44px;text-align:center;color:#111}
.renoz3-chips{display:flex;gap:6px;flex-wrap:wrap}
.renoz3-chip{height:26px;padding:0 9px;border-radius:10px;border:1px solid #BFBFBF;font-size:13px;color:#333;display:inline-flex;align-items:center;gap:4px}
.renoz3-chip[aria-pressed=true]{background:#111;color:#fff;border-color:#111}
.renoz3-acts{display:flex;gap:8px;align-items:center;padding-top:6px}
.renoz3-scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:6}
.renoz3-nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--renoz3-line);z-index:5}
.renoz3-nav-in{max-width:872px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr) 76px;height:46px}
.renoz3-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;color:#333;text-decoration:none}
.renoz3-nav a.renoz3-on{background:rgba(31,100,163,.12);color:#111;box-shadow:inset 0 3px 0 var(--renoz3-fin)}
.renoz3-fab{align-self:center;justify-self:center;width:64px;height:40px;border-radius:20px;background:#111;color:#fff;display:grid;place-items:center}
@media (min-width:900px){.renoz3-corps{display:grid;grid-template-columns:300px 1fr;gap:32px;align-items:start}.renoz3-head-in{padding:0}.renoz3-caisse{border-top:0}}
</style>
</head>
<body>
<div id="renoz3-root"></div>
<script>
(function(){
  var etat=new URLSearchParams(location.search).get('etat')||'jour1';
  if(['jour1','encours','ajout','ouvert','depasse','caisse','fini','horsligne'].indexOf(etat)<0)etat='jour1';
  var P={
    mug:'<path d="M6 7h9v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1z"/><path d="M15 10h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2"/><path d="M6 7c0-2 1.5-3 3-3 1 0 1.6.5 2 1 .5-.6 1.2-1 2-1 1.4 0 2 1 2 3"/>',
    moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>',
    bulle:'<path d="M5 18.5V7a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H8z"/><path d="M9 9.5h6M9 12.5h4"/>',
    grid:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
    wallet:'<path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><rect x="4" y="8" width="16" height="11" rx="2"/><path d="M15 13.5h2"/>',
    cubes:'<path d="M12 3 8 5v4l4 2 4-2V5z"/><path d="M8 11 4 13v4l4 2 4-2v-4z"/><path d="M16 11l-4 2v4l4 2 4-2v-4z"/>',
    users:'<circle cx="9" cy="8" r="3.5"/><path d="M3 19c.7-3.4 3-5 6-5s5.3 1.6 6 5"/><path d="M15.5 4.8a3.5 3.5 0 0 1 0 6.4M17.5 14.3c1.7.8 2.9 2.4 3.3 4.7"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',right:'<path d="m9 6 6 6-6 6"/>',up:'<path d="m6 15 6-6 6 6"/>',down:'<path d="m6 9 6 6 6-6"/>',
    check:'<path d="m5 12.5 4.5 4.5L19 7"/>',chain:'<path d="M10 14a3.5 3.5 0 0 0 5 0l3-3a3.5 3.5 0 0 0-5-5l-1 1"/><path d="M14 10a3.5 3.5 0 0 0-5 0l-3 3a3.5 3.5 0 0 0 5 5l1-1"/>',
    cloud:'<path d="M7 18h10a4 4 0 0 0 .5-8A5.5 5.5 0 0 0 7 9.5 4.3 4.3 0 0 0 7 18z"/><path d="M4 4l16 16"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',
    recu:'<path d="M6 3h12v18l-2-1.5L14 21l-2-1.5L10 21l-2-1.5L6 21z"/><path d="M9 8h6M9 12h6"/>',clock:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
    sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
    alerte:'<circle cx="12" cy="12" r="8.5"/><path d="M12 8v4.5M12 15.5v.5"/>',spark:'<path d="M12 4c.6 3.6 2.4 5.4 6 6-3.6.6-5.4 2.4-6 6-.6-3.6-2.4-5.4-6-6 3.6-.6 5.4-2.4 6-6z"/><path d="M18.5 3.5v3M17 5h3"/><circle cx="6" cy="18.5" r="1.5"/>',
    achat:'<path d="M4 6h2l2.2 9h9.3L20 8H7"/><circle cx="9.5" cy="19" r="1.3"/><circle cx="16.5" cy="19" r="1.3"/>',travail:'<path d="M14 5l5 5-9 9H5v-5z"/><path d="M12 7l5 5"/>'
  };
  // Hypothèse 2 de la fiche : la nature se devine depuis le titre, se corrige d'un toucher.
  var NAT={hotte:['achat','achat + pose'],evier:['achat','achat + pose'],armoire:['achat','achat'],sols:['travail','travail'],site:['travail','travail']};
  function ico(n,s){s=s||16;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(36/s).toFixed(3)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+P[n]+'</svg>';}
  function chf(v){return v.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,' ');}

  // Les cinq manques, ses mots ; états, prix, heures et artisans inventés. h = heures notées, hf = heures faites.
  var T={hotte:'Installation de la hotte',evier:'2ᵉ évier',armoire:'Armoire extérieure',sols:'Seconde passe sur les sols',site:'Site web vitrine'};
  var ETATS={
    jour1:[['hotte','afaire'],['evier','afaire'],['armoire','afaire'],['sols','afaire'],['site','afaire']],
    encours:[['sols','enc','en cours',720,'',12,5],['hotte','pay','payée, à poser',0,'pose à estimer'],['evier','dev','devis Sanitaire Fictif SA',640],['armoire','blo','attend 1 · sols',0,'à estimer'],['site','enc','en cours, sans achat',0,'',20,4]],
    depasse:[['sols','dep','dépassé',0,'+184,50',12,5],['hotte','pay','payée, à poser',0,'pose à estimer'],['evier','dev','devis Sanitaire Fictif SA',640],['armoire','blo','attend 1 · sols',0,'à estimer'],['site','enc','en cours, sans achat',0,'',20,4]],
    fini:[['evier','enc','en cours',640],['armoire','afaire','',0,'à estimer'],['sols','fait','faite',0,'1 200,00',12,12],['hotte','fait','posée',0,'1 850,00'],['site','fait','fait, sans facture',0,'—',20,20]]
  };
  var L=(ETATS[etat]||(etat==='ouvert'||etat==='caisse'?ETATS.encours:ETATS.jour1)).map(function(r){return {k:r[0],t:T[r[0]],s:r[1],mot:r[2]||'',r:r[3]||0,e:r[4]||'',h:r[5]||0,hf:r[6]||0};});
  var caisseConnue=false;

  function caisse(){
    var connu=L.reduce(function(a,m){return a+m.r;},0), est=L.filter(function(m){return /estimer/.test(m.e);}).length;
    if(etat==='depasse')return '<div class="renoz3-caisse"><span>Sols : <b>1 384,50</b> de factures pour <b>1 200,00</b> prévus</span><span class="renoz3-v renoz3-al">+184,50</span></div>';
    if(!caisseConnue)return '<div class="renoz3-caisse"><span>'+(connu?'À payer, connu <b>'+chf(connu)+' CHF</b>':'Aucun prix connu')+'</span><button class="renoz3-link" style="color:#7F5B10" data-booster="caisse"'+(etat==='caisse'?' data-capture-apres':'')+'>'+ico('alerte',14)+'Caisse à renseigner'+ico('right',14)+'</button></div>';
    return '<div class="renoz3-caisse"><span>Caisse <b>6 240,00</b> · après le connu <b>'+chf(6240-connu)+' CHF</b></span><span class="renoz3-link">90 jours'+ico('right',14)+'</span><span class="renoz3-solde" data-booster="solde"><i style="width:'+(connu/6240*100).toFixed(0)+'%;background:#1F64A3"></i><i style="flex:1;background:#A3C97A"></i></span></div>';
  }
  function ctx(){
    var h=L.reduce(function(a,m){return a+m.h;},0), hf=L.reduce(function(a,m){return a+m.hf;},0), est=L.filter(function(m){return /estimer/.test(m.e);}).length;
    if(!h&&!est)return '';
    return '<p class="renoz3-ctx">'+(h?'<span>'+ico('clock',14)+' <b>'+hf+' h</b> faites sur <b>'+h+' h</b> notées · fin : rythme à régler</span>':'')+(est?'<span><b>'+est+'</b> prix à estimer, hors du connu</span>':'')+'</p>';
  }
  function file(){
    var out='<div class="renoz3-file">';
    if(etat==='ajout')out+='<div class="renoz3-in" style="margin-top:-4px"><span class="renoz3-node" style="position:static;transform:none;background:#fff;color:#333;box-shadow:0 0 0 1px #BFBFBF">6</span><input type="text" value="Étagère pour les fûts" aria-label="Noter un manque" autofocus><button class="renoz3-btn" data-booster="noter">Noter</button></div>';
    L.forEach(function(m,i){
      var v=m.s==='dep'?'<span class="renoz3-v renoz3-al">'+m.e+'</span>':m.r?'<span class="renoz3-v">'+chf(m.r)+'</span>':/\d/.test(m.e)?'<span class="renoz3-v">'+m.e+'</span>':'<span class="renoz3-v renoz3-e">'+m.e+'</span>';
      var sub=(m.mot||m.h)?'<small>'+(m.s==='blo'?ico('chain',12):'')+m.mot+(m.h?' <span class="renoz3-h">'+(m.hf?m.hf+'/':'')+m.h+' h</span>':'')+'</small>':
        '<small><span class="renoz3-nat" role="button" tabindex="0" data-booster="nature" aria-label="Nature, à corriger d’un toucher">'+ico(NAT[m.k][0],12)+NAT[m.k][1]+'</span></small>';
      if(i===0&&m.s!=='fait')out+='<span class="renoz3-flag">Ensuite</span>';
      out+='<div class="renoz3-it'+(m.s==='fait'?' renoz3-dim':'')+'"><span class="renoz3-node renoz3-s-'+m.s+'">'+(m.s==='fait'?ico('check',13):(i+1))+'</span>'+
        '<button class="renoz3-t" data-booster="ouvrir" data-k="'+m.k+'"><span data-mots="lignes">'+m.t+'</span>'+sub+'</button>'+v+
        '<span class="renoz3-ud"><button data-booster="ordre" data-dir="-1" data-i="'+i+'" aria-label="Avancer">'+ico('up',14)+'</button><button data-booster="ordre" data-dir="1" data-i="'+i+'" aria-label="Reculer">'+ico('down',14)+'</button></span></div>';
    });
    out+=etat==='ajout'?'':'<button class="renoz3-add" data-booster="ajouter"><span class="renoz3-node">'+ico('plus',14)+'</span>Noter un manque</button>';
    return out+'</div>';
  }
  function sheet(){
    if(etat!=='ouvert')return '';
    return '<div class="renoz3-scrim"></div><div class="renoz3-sheet" role="dialog" aria-label="Site web vitrine"><h3><span class="renoz3-node renoz3-s-enc" style="position:static;transform:none">5</span><span data-mots="lignes">Site web vitrine</span><button class="renoz3-x" aria-label="Fermer">'+ico('x',14)+'</button></h3>'+
      '<div class="renoz3-form"><span>Nature</span><div class="renoz3-sg" data-booster="nature"><button aria-pressed="false">Achat</button><button aria-pressed="true">Travail</button><button aria-pressed="false">Les deux</button></div>'+
      '<span>Heures</span><span style="display:flex;gap:8px;align-items:center"><span class="renoz3-step" data-booster="heures"><button aria-label="Moins">'+ico('minus',14)+'</button><b>20 h</b><button aria-label="Plus">'+ico('plus',14)+'</button></span><span>faites <b class="renoz3-m" style="color:#111">4 h</b></span></span>'+
      '<span>Fin</span><span class="renoz3-link">rythme à régler'+ico('right',14)+'</span>'+
      '<span>Prix</span><span>aucun achat</span>'+
      '<span>Bloqué par</span><span class="renoz3-chips" data-booster="blocage"><button class="renoz3-chip" aria-pressed="true">rien</button><button class="renoz3-chip" aria-pressed="false">un chantier</button><button class="renoz3-chip" aria-pressed="false">un artisan</button><button class="renoz3-chip" aria-pressed="false">un devis</button><button class="renoz3-chip" aria-pressed="false">l’argent</button></span></div>'+
      '<div class="renoz3-acts"><button class="renoz3-btn">'+ico('check',14)+'Fait</button><button class="renoz3-btn2" data-booster="noter-achat">'+ico('recu',14)+'Noter un achat</button></div></div>';
  }
  function kb(){if(etat!=='ajout')return '';var k='';[10,9,7].forEach(function(n,r){var w=(378-(n-1)*5)/n;for(var i=0;i<n;i++)k+='<rect x="'+(6+i*(w+5)).toFixed(1)+'" y="'+(44+r*48)+'" width="'+w.toFixed(1)+'" height="38" rx="5" fill="#fff"/>';});k+='<rect x="100" y="188" width="190" height="38" rx="5" fill="#fff"/>';return '<div class="renoz3-kb" aria-hidden="true"><svg viewBox="0 0 390 240" preserveAspectRatio="none"><text x="12" y="26" font-size="13" fill="#333" font-family="Source Sans 3,sans-serif">clavier</text>'+k+'</svg></div>';}
  function corps(){return '<div class="renoz3-corps"><div>'+caisse()+ctx()+'</div><div>'+file()+'<button class="renoz3-comp" data-booster="compagnon"><span style="color:#333">'+ico('spark',20)+'</span><strong>Prévoir mes prochains paiements</strong><span>Compagnon brasseur</span>'+ico('right',16)+'</button></div></div>';}
  function page(){
    var t=['Synthèse','Opérations','Prévisions','Annuel'];
    return '<header class="renoz3-head"><div class="renoz3-head-in"><span class="renoz3-logo" aria-hidden="true">'+ico('mug',20)+'</span><span class="renoz3-brand">L’Affinée</span>'+
      '<button class="renoz3-hbtn" aria-label="Thème sombre">'+ico('moon',18)+'</button><button class="renoz3-hbtn renoz3-hf" aria-label="Rechercher">'+ico('search',18)+'</button><button class="renoz3-hbtn renoz3-hf" aria-label="Compagnon">'+ico('bulle',18)+'</button></div></header>'+
      '<main class="renoz3-wrap"><nav class="renoz3-tabs" role="tablist" aria-label="Finances">'+t.map(function(x,i){return '<button role="tab" aria-selected="'+(i===2)+'">'+x+'</button>';}).join('')+'</nav>'+
      '<div class="renoz3-bar"><h2>Anticiper les dépenses</h2><button class="renoz3-hbtn" aria-label="Réglages de la prévision">'+ico('sliders',16)+'</button></div>'+
      '<div class="renoz3-seg" role="group" aria-label="Vue"><button aria-pressed="false">Échéances</button><button aria-pressed="true" data-booster="vue">Local et travaux <b>'+L.filter(function(m){return m.s!=='fait';}).length+'</b></button></div>'+
      (etat==='horsligne'?'<div class="renoz3-off">'+ico('cloud',16)+'Hors ligne · gardé sur ce téléphone, envoyé au retour du réseau</div>':'')+
      '<div id="renoz3-corps">'+corps()+'</div></main>';
  }
  function nav(){
    var it=[['grid','Bord','#333'],['wallet','Finances','#1F64A3'],['mug','Brassins','#9A4F1E'],['cubes','Stocks','#4C6B2A'],['users','Clients','#333']];
    return '<nav class="renoz3-nav" aria-label="Navigation principale"><div class="renoz3-nav-in">'+it.map(function(x){return '<a href="#" class="'+(x[1]==='Finances'?'renoz3-on':'')+'"><span style="color:'+x[2]+'">'+ico(x[0],18)+'</span>'+x[1]+'</a>';}).join('')+
      '<button class="renoz3-fab" data-commun aria-label="Actions rapides">'+ico('plus',22)+'</button></div></nav>';
  }
  var root=document.getElementById('renoz3-root');
  root.innerHTML=page()+nav()+sheet()+kb();
  root.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-booster]');if(!b)return;
    var k=b.getAttribute('data-booster');
    if(k==='ordre'){var i=+b.getAttribute('data-i'),d=+b.getAttribute('data-dir'),j=i+d;if(j<0||j>=L.length)return;var t=L[i];L[i]=L[j];L[j]=t;document.getElementById('renoz3-corps').innerHTML=corps();ev.preventDefault();}
    if(k==='caisse'){caisseConnue=true;document.getElementById('renoz3-corps').innerHTML=corps();ev.preventDefault();}
  });
})();
</script>
</body>
</html>
