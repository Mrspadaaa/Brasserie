<style>
:root{--renor2-page:#FFFFFF;--renor2-pan:#F5F5F5;--renor2-sur:#EBEBEB;--renor2-bord:#DDDDDD;--renor2-bordm:#BFBFBF;--renor2-t2:#666666;--renor2-t1:#333333;--renor2-t0:#111111;

a{color:var(--renor2-fin);text-decoration:none}
::selection{background:#CFE0F1}

.renor2-m{font-family:var(--renor2-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
svg{flex:none}

.renor2-main{max-width:872px;margin:0 auto;padding:0 12px 124px}
.renor2-tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--renor2-bordm)}

.renor2-lab{font-size:12px;color:var(--renor2-t2);margin:6px 0 2px}
.renor2-seg{display:flex;gap:2px;padding:2px;border-radius:10px;background:var(--renor2-sur)}

.renor2-rw{display:flex;align-items:center;gap:8px;min-height:36px;border-bottom:1px solid var(--renor2-bord);font-size:14px}
.renor2-rw .renor2-l{flex:1;color:var(--renor2-t1)}
.renor2-rw .renor2-v{color:var(--renor2-t0)}

.renor2-chk{display:flex;align-items:center;gap:8px;min-height:36px;font-size:14px}
.renor2-chk input{width:18px;height:18px;accent-color:var(--renor2-fin)}
.renor2-fa{display:flex;gap:8px;margin-top:8px}
.renor2-prim{flex:1;height:36px;border-radius:10px;background:#111;color:#FFFFFF;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.renor2-in{height:32px;width:120px;padding:0 8px;border-radius:10px;border:1px solid var(--renor2-bordm);font-family:var(--renor2-mono);font-size:16px;text-align:right;color:var(--renor2-t0)}
/* Barre du bas, reprise telle quelle */
.renor2-nav{position:fixed;left:0;right:0;bottom:0;height:52px;background:#F7F7F7;border-top:1px solid var(--renor2-bord);display:flex;justify-content:center;padding-right:76px;z-index:8}
.renor2-nav a{flex:0 1 62px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--renor2-t1)}
.renor2-nav a[aria-current]{background:#E1E9F2;color:var(--renor2-t0);box-shadow:inset 0 2px 0 var(--renor2-fin)}
.renor2-fab{position:fixed;right:8px;bottom:4px;width:64px;height:44px;border-radius:22px;background:#111;color:#FFF;display:flex;align-items:center;justify-content:center;z-index:9}
@media (min-width:900px){.renor2-nav{padding-right:0}.renor2-nav a{flex-basis:90px}.renor2-fab{right:12px}
  .renor2-file{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}}

  function pastille(x) {
    var p = [];
    if (x.st) { var s = ST[x.st]; p.push('<span class="renor2-pa renor2-p-' + s[0] + '">' + s[1] + (x.st === 'bloque' ? x.cause : '') + '</span>'); }
    if (x.wait) p.push('<span class="renor2-pa renor2-p-wait">à envoyer</span>');
    return p.join('');
  }
  function prixCell(x) {
    if (x.sansAchat) return '<span class="renor2-pr"><span class="renor2-m">' + (x.hF || 0) + ' / ' + x.hE + ' h</span><small>heures</small></span>';
    if (x.prix == null) return '<span class="renor2-pr"><span class="renor2-inc">' + (etat === 'jour1' || etat === 'ajout' ? '' : 'à estimer') + '</span>' + (x.hE ? '<small class="renor2-m">' + x.hE + ' h</small>' : '') + '</span>';
    var dep = x.paye > x.prix;
    return '<span class="renor2-pr"><span class="renor2-m' + (dep ? ' renor2-alr' : '') + '">' + fmt(dep ? x.paye : x.prix) + '</span>' +
      '<small>' + (dep ? 'sur <span class="renor2-m">' + fmt(x.prix) + '</span> prévus' : x.paye ? 'payé <span class="renor2-m">' + fmt(x.paye) + '</span>' : (x.st === 'devis' ? 'sur devis' : 'à payer')) +
      (x.hE ? ' · <span class="renor2-m">' + x.hF + '/' + x.hE + ' h</span>' : '') + '</small></span>';
  }
  function recap() {
    var reste = 0, inc = 0, dep = 0, connu = false;
    L.forEach(function (x) { if (x.sansAchat) return; if (x.prix == null) { inc++; return; } connu = true; reste += Math.max(0, x.prix - x.paye); dep += Math.max(0, x.paye - x.prix); });
    if (!connu || scope === 'done') return '';
    var h = '<button type="button" class="renor2-rec" data-booster="caisse" data-caisse="1">';
    h += '<span class="renor2-rl"><span>Reste à payer</span><b class="renor2-m">' + fmt(reste) + '</b><span>CHF</span>' + (inc ? '<span class="renor2-chip">+' + inc + ' à estimer</span>' : '') + '<span class="renor2-sp"></span>' + chev + '</span>';
    var tot = caisse != null ? Math.max(caisse, reste + dep) : reste + dep;
    h += '<span class="renor2-gau" aria-hidden="true"><i class="renor2-g-reste" style="width:' + (reste / tot * 100) + '%"></i>' +
      (dep ? '<i class="renor2-g-dep" style="width:' + (dep / tot * 100) + '%"></i>' : '') +
      (caisse != null ? '<i class="renor2-g-libre" style="width:' + (Math.max(0, caisse - reste - dep) / tot * 100) + '%"></i>' : '') + '</span>';
    h += '<span class="renor2-leg"><span><i style="background:var(--renor2-fin)"></i>à payer</span>' + (dep ? '<span><i style="background:var(--renor2-alr)"></i>dépassé <span class="renor2-m">+' + fmt(dep) + '</span></span>' : '') +
      (caisse != null ? '<span><i style="background:#DCE7F2;border:1px solid var(--renor2-fin)"></i>caisse <span class="renor2-m">' + fmt(caisse) + '</span>, reste <span class="renor2-m">' + fmt(caisse - reste - dep) + '</span></span>' : '<span class="renor2-chip">caisse à renseigner</span>') + '</span>';
    return h + '</button>';
  }
  function rendre() {
    var nb = L.length, nbDone = 2;
    document.getElementById('renor2-cat').innerHTML =
      '<button type="button" aria-pressed="' + (scope === 'future') + '" data-scope="future" data-booster="local-travaux">Local et travaux<span class="renor2-m">' + nb + '</span></button>' +
      '<button type="button" aria-pressed="false">Matériel<span class="renor2-m">0</span></button>' +
      (etat === 'fini' ? '<button type="button" aria-pressed="' + (scope === 'done') + '" data-scope="done">Réalisés<span class="renor2-m">' + nbDone + '</span></button>' : '');
    document.getElementById('renor2-rec').innerHTML = recap();
    var h = [];
    if (scope === 'done') {
      h.push('<div class="renor2-band"><div class="renor2-bh"><span>Réalisés</span><span class="renor2-n">2</span></div><div data-mots="lignes">');
      h.push('<div class="renor2-row"><span class="renor2-op"><span class="renor2-mn"><strong>' + T[0] + '</strong><span class="renor2-st"><span class="renor2-pa renor2-p-paye">posée</span></span></span><span class="renor2-pr"><span class="renor2-m">2 480,00</span><small>2 factures liées</small></span></span></div>');
      h.push('<div class="renor2-row"><span class="renor2-op"><span class="renor2-mn"><strong>' + T[1] + '</strong><span class="renor2-st"><span class="renor2-pa renor2-p-idee">fait hors de l\'app</span></span></span><span class="renor2-pr"><span class="renor2-inc">sans achat noté</span><small>Noter l\'achat ›</small></span></span></div>');
      h.push('</div></div>');
    } else {
      HOR.forEach(function (hz, k) {
        var ls = L.filter(function (x) { return x.h === hz[0]; });
        if (!ls.length && etat !== 'jour1' && etat !== 'ajout') return;
        h.push('<section class="renor2-band"><div class="renor2-bh"><i class="renor2-dot" style="background:' + hz[2] + '"></i><span>' + hz[1] + '</span><span class="renor2-n">' + ls.length + '</span><span class="renor2-sp"></span></div><div data-mots="lignes">');
        ls.forEach(function (x) {
          var i = L.indexOf(x);
          h.push('<div class="renor2-row' + (x.moved ? ' renor2-moved' : '') + '"><button type="button" class="renor2-op" data-ouvre="' + i + '"><span class="renor2-mn"><strong>' + x.t + '</strong>' +
            (pastille(x) ? '<span class="renor2-st">' + pastille(x) + '</span>' : '') + '</span>' + prixCell(x) + '</button>' +
            '<span class="renor2-fl" data-booster="horizon"><button type="button" data-m="' + i + '" data-d="-1" aria-label="Plus tôt : ' + x.t + '"' + (k === 0 ? ' disabled' : '') + '>' + up + '</button>' +
            '<button type="button" data-m="' + i + '" data-d="1" aria-label="Plus tard : ' + x.t + '"' + (k === 2 ? ' disabled' : '') + '>' + dn + '</button></span></div>');
        });
        h.push('</div></section>');
      });
    }
    document.getElementById('renor2-file').innerHTML = h.join('');
    brancher();
  }
  function feuille(x) {
    var r = [];
    r.push('<div class="renor2-fh"><b>' + x.t + '</b><button class="renor2-ib" type="button" data-ferme="1" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>');
    r.push('<div class="renor2-lab">Quand</div><div class="renor2-seg" role="group" aria-label="Horizon" data-booster="horizon">' + HOR.map(function (hz) { return '<button type="button" aria-pressed="' + (x.h === hz[0]) + '">' + hz[1] + '</button>'; }).join('') + '</div>');
    r.push('<div class="renor2-lab">Nature</div><div class="renor2-seg" role="group" aria-label="Nature" data-booster="nature"><button type="button" aria-pressed="false">Achat</button><button type="button" aria-pressed="false">Travail</button><button type="button" aria-pressed="true">Les deux</button></div>');
    r.push('<div class="renor2-lab">Étape</div><div class="renor2-seg" role="group" aria-label="Étape"><button type="button" aria-pressed="false">Idée</button><button type="button" aria-pressed="false">À étudier</button><button type="button" aria-pressed="true">Devis</button><button type="button" aria-pressed="false">Prêt</button></div>');
    r.push('<div class="renor2-lab">Prix TTC · devis Sanitaire Fictif SA</div>');
    r.push('<div class="renor2-rw"><span class="renor2-l">Achat</span><input class="renor2-in" type="text" inputmode="decimal" value="780,00" aria-label="Achat"></div>');
    r.push('<div class="renor2-rw"><span class="renor2-l">Livraison</span><span class="renor2-inc">à estimer</span></div>');
    r.push('<div class="renor2-rw"><span class="renor2-l">Installation</span><input class="renor2-in" type="text" inputmode="decimal" value="360,00" aria-label="Installation"></div>');
    r.push('<div class="renor2-rw"><span class="renor2-l">Mes heures</span><input class="renor2-in" type="text" inputmode="decimal" value="3" aria-label="Mes heures"></div>');
    r.push('<div class="renor2-rw"><span class="renor2-l">Bloqué par</span><span class="renor2-pa renor2-p-bloque" data-booster="cause">artisan · Sanitaire Fictif SA</span></div>');
    r.push('<label class="renor2-chk"><input type="checkbox" checked>Dans les prévisions</label>');
    r.push('<div class="renor2-fa"><a class="renor2-prim" href="#noter-achat" data-booster="noter-achat">Noter l\'achat' + chev + '</a></div>');
    return r.join('');
  }
  function feuilleCaisse() {
    return '<div class="renor2-fh"><b>Caisse</b><button class="renor2-ib" type="button" data-ferme="1" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
      '<div class="renor2-rw"><span class="renor2-l">Solde de départ</span><input class="renor2-in" type="text" inputmode="decimal" placeholder="à renseigner" aria-label="Solde de départ"></div>' +
      '<div class="renor2-fa"><a class="renor2-prim" href="#solde">Renseigner le solde de départ' + chev + '</a></div>';
  }
  function ouvrir(html) { document.getElementById('renor2-feuille').innerHTML = html; racine.classList.add('renor2-ouvre'); }
  function brancher() {
    document.querySelectorAll('#renor2-file [data-ouvre]').forEach(function (b) { b.addEventListener('click', function () { ouvrir(feuille(L[+b.getAttribute('data-ouvre')])); }); });
    document.querySelectorAll('#renor2-file [data-m]').forEach(function (b) {
      b.addEventListener('click', function () {
        var x = L[+b.getAttribute('data-m')], k = HOR.findIndex(function (hz) { return hz[0] === x.h; }) + +b.getAttribute('data-d');
        if (k < 0 || k > 2) return; x.h = HOR[k][0]; L.forEach(function (y) { y.moved = y === x; }); rendre();
      });
    });
    var c = document.querySelector('[data-caisse]');
    if (c) c.addEventListener('click', function () { if (caisse == null) ouvrir(feuilleCaisse()); });
    document.querySelectorAll('#renor2-cat [data-scope]').forEach(function (b) { b.addEventListener('click', function () { scope = b.getAttribute('data-scope'); rendre(); }); });
  }
  document.getElementById('renor2-voile').addEventListener('click', function () { racine.classList.remove('renor2-ouvre'); });
  document.getElementById('renor2-feuille').addEventListener('click', function (e) { if (e.target.closest('[data-ferme]')) racine.classList.remove('renor2-ouvre'); });
  document.querySelectorAll('.renor2-dev button').forEach(function (b) {
    b.addEventListener('click', function () { document.querySelectorAll('.renor2-dev button').forEach(function (c) { c.setAttribute('aria-pressed', String(c === b)); }); });
  });
  rendre();
  if (etat === 'ajout') { racine.classList.add('renor2-on'); var i = document.getElementById('renor2-in'); i.value = 'Seconde passe sur les sols'; i.focus();
    var d = document.querySelectorAll('.renor2-dev button'); d[0].setAttribute('aria-pressed', 'false'); d[1].setAttribute('aria-pressed', 'true'); }
  if (etat === 'ouvert') ouvrir(feuille(L[2]));
})();
</script>
</body></html>
