<!doctype html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>z2 · Rénovation, la brasserie en plan</title>
<style>
:root{--renoz2-line:#DDDDDD;--renoz2-surf:#F5F5F5;--renoz2-surf2:#EBEBEB;--renoz2-fin:#1F64A3;--renoz2-ok:#3F6B2E;--renoz2-al:#A8291F;--renoz2-mono:"IBM Plex Mono",Consolas,ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.3;color:#111;background:#fff}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.renoz2-m{font-family:var(--renoz2-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.renoz2-head{border-bottom:1px solid var(--renoz2-line)}
.renoz2-head-in{max-width:880px;margin:0 auto;height:40px;display:flex;align-items:center;gap:8px;padding:0 8px}
.renoz2-logo{width:30px;height:30px;border-radius:10px;background:#111;color:#fff;display:grid;place-items:center;flex:none}
.renoz2-brand{font-size:18px;font-weight:500;flex:1}
.renoz2-hbtn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#333;flex:none}
.renoz2-hbtn.renoz2-hf{background:var(--renoz2-surf2);border:1px solid #BFBFBF}
.renoz2-wrap{max-width:872px;margin:0 auto;padding:0 12px 76px}
.renoz2-bar{display:flex;align-items:center;gap:8px;min-height:36px;border-bottom:1px solid var(--renoz2-line)}
.renoz2-bar h2{font-size:18px;font-weight:600;margin:0;flex:1}
.renoz2-back{display:inline-flex;align-items:center;color:var(--renoz2-fin);font-weight:600;height:28px}
.renoz2-off{display:flex;gap:6px;align-items:center;margin:8px 0 0;padding:6px 10px;border-radius:10px;background:var(--renoz2-surf);font-size:13px;color:#333}
.renoz2-ctx{font-size:13px;color:#333;margin:6px 0 0;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.renoz2-ctx b{font-family:var(--renoz2-mono);font-weight:600;color:#111}
.renoz2-env{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:10px;border:1px solid #BFBFBF;background:#fff;color:#111;font-size:13px}
.renoz2-envbar{height:8px;border-radius:4px;background:var(--renoz2-surf2);overflow:hidden;display:flex;width:100%;margin-top:4px}
.renoz2-envbar i{display:block;height:100%}
.renoz2-fig{margin:6px 0 2px}
.renoz2-fig svg{display:block;width:100%;height:auto}
.renoz2-fig text{font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif}
.renoz2-fig .renoz2-pin{cursor:pointer}
.renoz2-fig .renoz2-pin.renoz2-sel circle:first-child{stroke:#111;stroke-width:3}
.renoz2-rows{margin-top:4px}
.renoz2-row{display:grid;grid-template-columns:24px 1fr auto 52px;gap:8px;align-items:center;width:100%;min-height:36px;border-top:1px solid var(--renoz2-line)}
.renoz2-row.renoz2-dim{opacity:.55}
.renoz2-t{font-size:14px;color:#111}
.renoz2-t small{display:block;font-size:12px;color:#333}
.renoz2-v{font-family:var(--renoz2-mono);font-weight:600;font-size:14px;text-align:right;white-space:nowrap}
.renoz2-v.renoz2-e{font-family:inherit;font-weight:400;font-size:12px;color:#333}
.renoz2-v.renoz2-al{color:var(--renoz2-al)}
.renoz2-num{width:22px;height:22px;border-radius:50%;background:#111;color:#fff;font-family:var(--renoz2-mono);font-weight:600;font-size:12px;display:grid;place-items:center}
.renoz2-num.renoz2-s-enc{background:#567F45}.renoz2-num.renoz2-s-pay{background:var(--renoz2-fin)}.renoz2-num.renoz2-s-dev{background:#9C7020}
.renoz2-num.renoz2-s-blo{background:#fff;color:#666;border:2px dashed #666}.renoz2-num.renoz2-s-fait{background:var(--renoz2-ok)}.renoz2-num.renoz2-s-dep{background:#C8382F}
.renoz2-ud{display:flex;gap:2px}
.renoz2-ud button{width:25px;height:28px;border-radius:10px;display:grid;place-items:center;color:#333;border:1px solid var(--renoz2-line)}
.renoz2-add{display:flex;align-items:center;gap:8px;min-height:36px;border-top:1px solid var(--renoz2-line);width:100%;color:#333;font-size:14px}
.renoz2-in{display:flex;align-items:center;gap:6px;padding:8px 0 4px}
.renoz2-in input{flex:1;height:32px;border:1px solid #BFBFBF;border-radius:10px;padding:0 10px;font:inherit;font-size:16px;color:#111;background:#fff}
.renoz2-in input:focus{outline:2px solid #111;outline-offset:1px}
.renoz2-btn{height:32px;padding:0 12px;border-radius:10px;background:#111;color:#fff;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.renoz2-btn2{height:28px;padding:0 10px;border-radius:10px;border:1px solid #BFBFBF;background:#fff;font-size:13px;display:inline-flex;align-items:center;gap:6px;color:#111}
.renoz2-kb{position:fixed;left:0;right:0;bottom:0;height:240px;background:#D9DCE1;border-top:1px solid #BFBFBF;z-index:6}.renoz2-kb svg{display:block;width:100%;height:100%}
.renoz2-sheet{position:fixed;left:0;right:0;bottom:0;z-index:7;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:8px 12px 10px;max-width:560px;margin:0 auto}
.renoz2-sheet h3{margin:0;font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}
.renoz2-sheet h3 .renoz2-x{margin-left:auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--renoz2-surf2)}
.renoz2-steps{display:grid;gap:2px;padding:6px 0}
.renoz2-step{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;min-height:30px;font-size:14px}
.renoz2-step .renoz2-v{font-size:13px}
.renoz2-cb{width:20px;height:20px;border-radius:5px;border:2px solid #666;display:grid;place-items:center;color:#fff}
.renoz2-cb.renoz2-on{background:var(--renoz2-ok);border-color:var(--renoz2-ok)}
.renoz2-line{display:grid;grid-template-columns:72px 1fr;gap:5px 8px;align-items:center;padding:4px 0;font-size:13px;color:#333;border-top:1px solid var(--renoz2-line)}
.renoz2-acts{display:flex;gap:8px;align-items:center;padding-top:6px}
.renoz2-scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:6}
.renoz2-nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--renoz2-line);z-index:5}
.renoz2-nav-in{max-width:872px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr) 76px;height:46px}
.renoz2-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;color:#333;text-decoration:none}
.renoz2-nav a.renoz2-on{background:var(--renoz2-surf2);color:#111;box-shadow:inset 0 3px 0 #111}
.renoz2-fab{align-self:center;justify-self:center;width:64px;height:40px;border-radius:20px;background:#111;color:#fff;display:grid;place-items:center}
@media (min-width:900px){.renoz2-body{display:grid;grid-template-columns:440px 1fr;gap:24px;align-items:start}.renoz2-head-in{padding:0}}
</style>
</head>
<body>
<div id="renoz2-root"></div>
<script>
(function(){
  var etat=new URLSearchParams(location.search).get('etat')||'jour1';
  if(['jour1','encours','ajout','ouvert','depasse','caisse','fini','horsligne'].indexOf(etat)<0)etat='jour1';
  var P={
    mug:'<path d="M6 7h9v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1z"/><path d="M15 10h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2"/><path d="M6 7c0-2 1.5-3 3-3 1 0 1.6.5 2 1 .5-.6 1.2-1 2-1 1.4 0 2 1 2 3"/>',
    moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
    search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>',
    bulle:'<path d="M5 18.5V7a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H8z"/><path d="M9 9.5h6M9 12.5h4"/>',
    grid:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
    wallet:'<path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><rect x="4" y="8" width="16" height="11" rx="2"/><path d="M15 13.5h2"/>',
    cubes:'<path d="M12 3 8 5v4l4 2 4-2V5z"/><path d="M8 11 4 13v4l4 2 4-2v-4z"/><path d="M16 11l-4 2v4l4 2 4-2v-4z"/>',
    users:'<circle cx="9" cy="8" r="3.5"/><path d="M3 19c.7-3.4 3-5 6-5s5.3 1.6 6 5"/><path d="M15.5 4.8a3.5 3.5 0 0 1 0 6.4M17.5 14.3c1.7.8 2.9 2.4 3.3 4.7"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',right:'<path d="m9 6 6 6-6 6"/>',left:'<path d="m15 6-6 6 6 6"/>',up:'<path d="m6 15 6-6 6 6"/>',down:'<path d="m6 9 6 6 6-6"/>',
    check:'<path d="m5 12.5 4.5 4.5L19 7"/>',chain:'<path d="M10 14a3.5 3.5 0 0 0 5 0l3-3a3.5 3.5 0 0 0-5-5l-1 1"/><path d="M14 10a3.5 3.5 0 0 0-5 0l-3 3a3.5 3.5 0 0 0 5 5l1-1"/>',
    cloud:'<path d="M7 18h10a4 4 0 0 0 .5-8A5.5 5.5 0 0 0 7 9.5 4.3 4.3 0 0 0 7 18z"/><path d="M4 4l16 16"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',
    recu:'<path d="M6 3h12v18l-2-1.5L14 21l-2-1.5L10 21l-2-1.5L6 21z"/><path d="M9 8h6M9 12h6"/>',wall:'<path d="M4 12h16M4 6h16M4 18h16M9 6v6M15 12v6"/>'
  };
  function ico(n,s){s=s||16;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(36/s).toFixed(3)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+P[n]+'</svg>';}
  function chf(v){return v.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
  var COL={afaire:'#111',enc:'#567F45',pay:'#1F64A3',dev:'#9C7020',blo:'#666',fait:'#3F6B2E',dep:'#C8382F'};

  // Les cinq manques (ses mots) ; chaque manque a sa place sur le plan (clé « où »). Tout le reste est inventé.
  var BASE={hotte:{t:'Installation de la hotte',ou:'hotte'},evier:{t:'2ᵉ évier',ou:'evier'},armoire:{t:'Armoire extérieure',ou:'armoire'},sols:{t:'Seconde passe sur les sols',ou:'sols'},site:{t:'Site web vitrine',ou:'site'}};
  var ETATS={
    jour1:[['hotte','afaire'],['evier','afaire'],['armoire','afaire'],['sols','afaire'],['site','afaire']],
    encours:[['sols','enc','en cours',720],['hotte','pay','payée, à poser',0,'pose à estimer'],['evier','dev','devis Sanitaire Fictif SA',640],['armoire','blo','attend les sols',0,'à estimer'],['site','enc','en cours, sans achat',0,'4 h']],
    depasse:[['sols','dep','dépassé de 184,50',0,'+184,50'],['hotte','pay','payée, à poser',0,'pose à estimer'],['evier','dev','devis Sanitaire Fictif SA',640],['armoire','blo','attend les sols',0,'à estimer'],['site','enc','en cours, sans achat',0,'4 h']],
    fini:[['evier','enc','en cours',640],['armoire','afaire','',0,'à estimer'],['sols','fait','faite',0,'1 200,00'],['hotte','fait','posée',0,'1 850,00'],['site','fait','fait, sans facture',0,'—']]
  };
  var L=(ETATS[etat]||(etat==='ouvert'||etat==='caisse'?ETATS.encours:ETATS.jour1)).map(function(r){return {k:r[0],t:BASE[r[0]].t,s:r[1],mot:r[2]||'',r:r[3]||0,e:r[4]||''};});
  var envFixee=false, sel=etat==='ouvert'?'hotte':null;

  function pin(k,n,s,x,y){
    var c=COL[s], blo=s==='blo', fait=s==='fait';
    return '<g class="renoz2-pin'+(sel===k?' renoz2-sel':'')+'" data-booster="pin" data-k="'+k+'" role="button" aria-label="'+BASE[k].t+'" transform="translate('+x+' '+y+')">'+
      '<circle r="12" fill="'+(blo?'#fff':c)+'" stroke="'+(blo?'#666':'#fff')+'" stroke-width="'+(blo?2:1.5)+'"'+(blo?' stroke-dasharray="3 2"':'')+'/>'+
      (fait?'<path d="M-5 0.5l3.5 3.5L6-3.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>':'<text y="4.5" text-anchor="middle" font-size="13" font-weight="700" fill="'+(blo?'#666':'#fff')+'" font-family="IBM Plex Mono,Consolas,monospace">'+n+'</text>')+'</g>';
  }
  function plan(){
    var idx={};L.forEach(function(m,i){idx[m.k]={n:i+1,s:m.s};});
    function p(k,x,y){var o=idx[k];return pin(k,o.n,o.s,x,y);}
    var sols=idx.sols, solsFill=sols.s==='fait'?'#E9F0E4':'url(#renoz2-hach)';
    return '<figure class="renoz2-fig"><svg viewBox="0 0 366 236" role="img" aria-label="Plan de la brasserie : chaque manque à sa place">'+
      '<defs><pattern id="renoz2-hach" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#F5F5F5"/><rect width="3" height="8" fill="#DDD"/></pattern></defs>'+
      // Extérieur, hors du mur
      '<rect x="276" y="6" width="84" height="200" rx="4" fill="#EEF4E8" stroke="#9E9E9E" stroke-dasharray="4 3"/><text x="318" y="24" text-anchor="middle" font-size="12" fill="#333">Extérieur</text>'+
      // Local : trois pièces
      '<rect x="6" y="6" width="170" height="200" fill="'+solsFill+'"/><rect x="176" y="6" width="100" height="90" fill="#F5F5F5"/><rect x="176" y="96" width="100" height="110" fill="#F5F5F5"/>'+
      '<path d="M6 6h270v200H6z M176 6v200 M176 96h100" fill="none" stroke="#111" stroke-width="2"/>'+
      // Porte d'entrée (gap dans le mur du bas)
      '<path d="M60 206h30" stroke="#fff" stroke-width="3"/><path d="M60 206a30 30 0 0 1 30-30" fill="none" stroke="#111" stroke-width="1"/><text x="75" y="226" text-anchor="middle" font-size="12" fill="#333">Entrée</text>'+
      '<text x="14" y="24" font-size="12" fill="#333">Brassage</text><text x="184" y="24" font-size="12" fill="#333">Lavage</text><text x="184" y="114" font-size="12" fill="#333">Fermentation</text>'+
      // Cuve et hotte au-dessus
      '<circle cx="66" cy="92" r="24" fill="#E7A070" fill-opacity=".45" stroke="#9A4F1E" stroke-width="1.5"/><text x="66" y="96" text-anchor="middle" font-size="11" fill="#333">cuve</text>'+
      '<rect x="38" y="46" width="56" height="12" rx="2" fill="none" stroke="'+COL[idx.hotte.s]+'" stroke-width="1.5" stroke-dasharray="'+(idx.hotte.s==='fait'||idx.hotte.s==='pay'?'0':'4 2')+'"/>'+p('hotte',110,52)+
      // Sols : la surface hachurée de Brassage, épinglée en bas
      p('sols',120,170)+'<text x="120" y="196" text-anchor="middle" font-size="11" fill="#333">sols</text>'+
      // Lavage : évier existant, 2e évier à côté
      '<rect x="238" y="60" width="30" height="18" rx="2" fill="#A9C3EE" stroke="#1F64A3"/><text x="253" y="92" text-anchor="middle" font-size="11" fill="#333">évier</text>'+
      '<rect x="202" y="60" width="30" height="18" rx="2" fill="none" stroke="'+COL[idx.evier.s]+'" stroke-width="1.5" stroke-dasharray="4 2"/>'+p('evier',198,52)+
      // Fermentation : deux cuves, rien à faire
      '<circle cx="212" cy="160" r="13" fill="#E7A070" fill-opacity=".45" stroke="#9A4F1E"/><circle cx="246" cy="160" r="13" fill="#E7A070" fill-opacity=".45" stroke="#9A4F1E"/>'+
      // Armoire extérieure contre le mur
      '<rect x="292" y="120" width="40" height="56" rx="2" fill="none" stroke="'+COL[idx.armoire.s]+'" stroke-width="1.5" stroke-dasharray="4 2"/><text x="312" y="194" text-anchor="middle" font-size="11" fill="#333">armoire</text>'+p('armoire',338,118)+
      // En ligne : le site, hors des murs
      '<rect x="176" y="212" width="184" height="22" rx="10" fill="#EEE9F8" stroke="#6A4FB0"/><text x="268" y="227" text-anchor="middle" font-size="12" fill="#333">En ligne · vitrine</text>'+p('site',190,223)+
      '</svg></figure>';
  }
  function ctx(){
    var reste=L.reduce(function(a,m){return a+m.r;},0), est=L.filter(function(m){return /estimer/.test(m.e);}).length;
    if(etat==='depasse')return '<p class="renoz2-ctx">Sols : <b>1 384,50</b> pour <b>1 200,00</b> prévus · <b style="color:#A8291F">+184,50</b></p>';
    if(etat==='caisse'){
      if(!envFixee)return '<p class="renoz2-ctx">Reste à payer <b>'+chf(reste)+' CHF</b> · '+est+' à estimer <button class="renoz2-env" data-booster="enveloppe" data-capture-apres>'+ico('wall',14)+'Enveloppe à fixer</button></p>';
      return '<p class="renoz2-ctx"><span>Enveloppe <b>4 000,00</b> · engagé <b>3 690,00</b> · libre <b>310,00 CHF</b></span><span class="renoz2-envbar" data-booster="jauge"><i style="width:58%;background:#1F64A3"></i><i style="width:34%;background:#A9C3EE"></i></span><span>'+est+' à estimer, hors de la jauge</span></p>';
    }
    if(!reste&&!est)return '';
    return '<p class="renoz2-ctx">Reste à payer <b>'+chf(reste)+' CHF</b>'+(est?' · '+est+' à estimer':'')+'</p>';
  }
  function rows(){
    var out='';
    L.forEach(function(m,i){
      var v=m.s==='dep'?'<span class="renoz2-v renoz2-al">'+m.e+'</span>':m.r?'<span class="renoz2-v">'+chf(m.r)+'</span>':/\d/.test(m.e)?'<span class="renoz2-v">'+m.e+'</span>':'<span class="renoz2-v renoz2-e">'+m.e+'</span>';
      out+='<div class="renoz2-row'+(m.s==='fait'?' renoz2-dim':'')+'" data-k="'+m.k+'"><span class="renoz2-num renoz2-s-'+m.s+'">'+(m.s==='fait'?ico('check',12):(i+1))+'</span>'+
        '<button class="renoz2-t" data-booster="ouvrir" data-k="'+m.k+'"><span data-mots="lignes">'+m.t+'</span>'+(m.mot?'<small>'+m.mot+'</small>':'')+'</button>'+v+
        '<span class="renoz2-ud"><button data-booster="ordre" data-dir="-1" data-i="'+i+'" aria-label="Avancer">'+ico('up',14)+'</button><button data-booster="ordre" data-dir="1" data-i="'+i+'" aria-label="Reculer">'+ico('down',14)+'</button></span></div>';
    });
    out+='<button class="renoz2-add" data-booster="ajouter">'+ico('plus',16)+'Noter un manque</button>';
    return out;
  }
  function sheet(){
    if(etat!=='ouvert')return '';
    return '<div class="renoz2-scrim"></div><div class="renoz2-sheet" role="dialog" aria-label="Installation de la hotte"><h3><span class="renoz2-num renoz2-s-pay">2</span><span data-mots="lignes">Installation de la hotte</span><button class="renoz2-x" aria-label="Fermer">'+ico('x',14)+'</button></h3>'+
      '<div class="renoz2-steps" data-booster="etapes">'+
      '<label class="renoz2-step"><span class="renoz2-cb renoz2-on">'+ico('check',12)+'</span><span>Achat · Ventil’Demo Sàrl</span><span class="renoz2-v">1 850,00</span></label>'+
      '<label class="renoz2-step"><span class="renoz2-cb renoz2-on">'+ico('check',12)+'</span><span>Livraison</span><span class="renoz2-v renoz2-e">reçue</span></label>'+
      '<label class="renoz2-step"><span class="renoz2-cb"></span><span>Pose</span><span class="renoz2-v renoz2-e">à estimer</span></label></div>'+
      '<div class="renoz2-line"><span>Bloqué par</span><span class="renoz2-btn2" data-booster="blocage">'+ico('chain',14)+'l’artisan</span></div>'+
      '<div class="renoz2-line"><span>Place</span><span>2ᵉ, après les sols</span></div>'+
      '<div class="renoz2-acts"><button class="renoz2-btn" data-booster="noter-achat">'+ico('recu',14)+'Noter l’achat</button><button class="renoz2-btn2">'+ico('check',14)+'Posée</button></div></div>';
  }
  function kb(){if(etat!=='ajout')return '';var k='';[10,9,7].forEach(function(n,r){var w=(378-(n-1)*5)/n;for(var i=0;i<n;i++)k+='<rect x="'+(6+i*(w+5)).toFixed(1)+'" y="'+(44+r*48)+'" width="'+w.toFixed(1)+'" height="38" rx="5" fill="#fff"/>';});k+='<rect x="100" y="188" width="190" height="38" rx="5" fill="#fff"/>';return '<div class="renoz2-kb" aria-hidden="true"><svg viewBox="0 0 390 240" preserveAspectRatio="none"><text x="12" y="26" font-size="13" fill="#333" font-family="Source Sans 3,sans-serif">clavier</text>'+k+'</svg></div>';}
  function page(){
    var body=(etat==='ajout'?'<div class="renoz2-in"><input type="text" value="Étagère pour les fûts" aria-label="Noter un manque" autofocus><button class="renoz2-btn" data-booster="noter">Noter</button></div>':'')+
      '<div class="renoz2-body"><div>'+ctx()+plan()+'</div><div class="renoz2-rows" id="renoz2-rows">'+rows()+'</div></div>';
    return '<header class="renoz2-head"><div class="renoz2-head-in"><span class="renoz2-logo" aria-hidden="true">'+ico('mug',20)+'</span><span class="renoz2-brand">L’Affinée</span>'+
      '<button class="renoz2-hbtn" aria-label="Thème sombre">'+ico('moon',18)+'</button><button class="renoz2-hbtn renoz2-hf" aria-label="Rechercher">'+ico('search',18)+'</button><button class="renoz2-hbtn renoz2-hf" aria-label="Compagnon">'+ico('bulle',18)+'</button></div></header>'+
      '<main class="renoz2-wrap"><div class="renoz2-bar"><a href="#" class="renoz2-back">'+ico('left',16)+'Bord</a><h2>Rénovation</h2><span class="renoz2-m" style="font-weight:600">'+L.filter(function(m){return m.s!=='fait';}).length+'</span><span style="color:#333">à faire</span></div>'+
      (etat==='horsligne'?'<div class="renoz2-off">'+ico('cloud',16)+'Hors ligne · gardé sur ce téléphone, envoyé au retour du réseau</div>':'')+
      '<div id="renoz2-corps">'+body+'</div></main>';
  }
  function nav(){
    var it=[['grid','Bord','#333'],['wallet','Finances','#1F64A3'],['mug','Brassins','#9A4F1E'],['cubes','Stocks','#4C6B2A'],['users','Clients','#333']];
    return '<nav class="renoz2-nav" aria-label="Navigation principale"><div class="renoz2-nav-in">'+it.map(function(x){return '<a href="#" class="'+(x[1]==='Bord'?'renoz2-on':'')+'"><span style="color:'+x[2]+'">'+ico(x[0],18)+'</span>'+x[1]+'</a>';}).join('')+
      '<button class="renoz2-fab" data-commun aria-label="Actions rapides">'+ico('plus',22)+'</button></div></nav>';
  }
  var root=document.getElementById('renoz2-root');
  function redraw(){document.getElementById('renoz2-corps').innerHTML=(etat==='ajout'?'':'')+'<div class="renoz2-body"><div>'+ctx()+plan()+'</div><div class="renoz2-rows" id="renoz2-rows">'+rows()+'</div></div>';}
  root.innerHTML=page()+nav()+sheet()+kb();
  root.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-booster]');if(!b)return;
    var k=b.getAttribute('data-booster');
    if(k==='ordre'){var i=+b.getAttribute('data-i'),d=+b.getAttribute('data-dir'),j=i+d;if(j<0||j>=L.length)return;var t=L[i];L[i]=L[j];L[j]=t;redraw();ev.preventDefault();}
    if(k==='pin'){sel=b.getAttribute('data-k');redraw();var r=root.querySelector('.renoz2-row[data-k="'+sel+'"]');if(r)r.style.background='#EBEBEB';ev.preventDefault();}
    if(k==='enveloppe'){envFixee=true;redraw();ev.preventDefault();}
  });
})();
</script>
</body>
</html>
