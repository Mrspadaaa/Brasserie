<!doctype html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>z4 · Rénovation, la pile : une chose à la fois sur le Bord</title>
<style>
:root{--renoz4-line:#DDDDDD;--renoz4-surf:#F5F5F5;--renoz4-surf2:#EBEBEB;--renoz4-fin:#1F64A3;--renoz4-prod:#9A4F1E;--renoz4-stock:#4C6B2A;--renoz4-ag:#6A4FB0;--renoz4-trav:#8A4A2A;--renoz4-ok:#3F6B2E;--renoz4-al:#A8291F;--renoz4-mono:"IBM Plex Mono",Consolas,ui-monospace,monospace}
*{box-sizing:border-box}
body{margin:0;font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.3;color:#111;background:#fff}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.renoz4-m{font-family:var(--renoz4-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.renoz4-head{border-bottom:1px solid var(--renoz4-line)}
.renoz4-head-in{max-width:880px;margin:0 auto;height:40px;display:flex;align-items:center;gap:8px;padding:0 8px}
.renoz4-logo{width:30px;height:30px;border-radius:10px;background:#111;color:#fff;display:grid;place-items:center;flex:none}
.renoz4-brand{font-size:18px;font-weight:500;flex:1}
.renoz4-hbtn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#333;flex:none}
.renoz4-hbtn.renoz4-hf{background:var(--renoz4-surf2);border:1px solid #BFBFBF}
.renoz4-wrap{max-width:872px;margin:0 auto;padding:8px 12px 76px;display:grid;gap:8px}
.renoz4-off{display:flex;gap:6px;align-items:center;padding:6px 10px;border-radius:10px;background:var(--renoz4-surf);font-size:13px;color:#333}
.renoz4-card{border-radius:16px;border:1px solid;background:var(--renoz4-surf);overflow:hidden}
.renoz4-ch{display:flex;align-items:center;gap:8px;min-height:32px;padding:4px 10px;font-weight:600;font-size:16px}
.renoz4-ch .renoz4-r{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:400;font-size:14px;color:#333}
.renoz4-cb{padding:6px 10px 8px}
.renoz4-c-prod{border-color:rgba(154,79,30,.3)}.renoz4-c-prod .renoz4-ch{background:rgba(231,160,112,.18);color:var(--renoz4-prod)}
.renoz4-c-stock{border-color:rgba(76,107,42,.3)}.renoz4-c-stock .renoz4-ch{background:rgba(163,201,122,.18);color:var(--renoz4-stock)}
.renoz4-c-fin{border-color:rgba(31,100,163,.3)}.renoz4-c-fin .renoz4-ch{background:rgba(134,185,230,.18);color:var(--renoz4-fin)}
.renoz4-c-ag{border-color:rgba(106,79,176,.3)}.renoz4-c-ag .renoz4-ch{background:rgba(188,165,232,.18);color:var(--renoz4-ag)}
.renoz4-link{color:var(--renoz4-fin);font-weight:600;display:inline-flex;align-items:center;gap:2px;min-height:24px}
/* La pile : la carte du dessus, et deux bords derrière */
.renoz4-pile{position:relative}
.renoz4-edges{position:relative;height:12px}
.renoz4-edges::before,.renoz4-edges::after{content:"";position:absolute;left:5%;right:5%;top:-2px;height:7px;border:1px solid rgba(210,123,86,.35);border-top:0;border-radius:0 0 14px 14px;background:#FBF3EF;z-index:0}
.renoz4-edges::after{left:10%;right:10%;top:3px;background:#FDF8F6;z-index:-1}
.renoz4-top{position:relative;z-index:1;border-radius:16px;border:1px solid rgba(210,123,86,.35);background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);overflow:hidden}
.renoz4-top .renoz4-ch{background:rgba(210,123,86,.12);color:var(--renoz4-trav)}
.renoz4-tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:10px;background:#111;color:#fff}
.renoz4-big{font-size:18px;font-weight:600;line-height:22px;margin:2px 0 4px;color:#111}
.renoz4-etat{font-size:13px;color:#333;display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.renoz4-dot{width:10px;height:10px;border-radius:50%;background:#567F45;display:inline-block}
.renoz4-dot.renoz4-s-dep{background:#C8382F}.renoz4-dot.renoz4-s-afaire{background:#fff;border:2px solid #9E9E9E}
.renoz4-chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.renoz4-chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:10px;border:1px solid #BFBFBF;background:#fff;font-size:13px;color:#333}
.renoz4-chip b{font-family:var(--renoz4-mono);font-weight:600;color:#111}
.renoz4-chip.renoz4-al{border-color:#C8382F;color:var(--renoz4-al)}.renoz4-chip.renoz4-al b{color:var(--renoz4-al)}
.renoz4-chip[aria-pressed=true]{background:#111;color:#fff;border-color:#111}.renoz4-chip[aria-pressed=true] b{color:#fff}
.renoz4-bar{height:8px;border-radius:4px;background:var(--renoz4-surf2);overflow:hidden;display:flex;margin:0 0 8px}
.renoz4-bar i{display:block;height:100%}
.renoz4-acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.renoz4-btn{height:32px;padding:0 12px;border-radius:10px;background:#111;color:#fff;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.renoz4-btn2{height:28px;padding:0 10px;border-radius:10px;border:1px solid #BFBFBF;background:#fff;font-size:13px;display:inline-flex;align-items:center;gap:6px;color:#111}
.renoz4-peek{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:0 10px;font-size:14px;color:#111;border:1px solid rgba(210,123,86,.35);border-top:0;background:#FBF3EF;position:relative;z-index:1;margin:0 4%;width:92%;border-radius:0 0 12px 12px}
.renoz4-peek+.renoz4-peek{margin:0 8%;width:84%;background:#FDF8F6}
.renoz4-peek .renoz4-n{width:20px;height:20px;border-radius:50%;background:#111;color:#fff;font-family:var(--renoz4-mono);font-weight:600;font-size:12px;display:grid;place-items:center;flex:none}
.renoz4-peek .renoz4-l{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.renoz4-peek small{font-size:12px;color:#333}
.renoz4-puis{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:0 10px;font-size:13px;color:#333;position:relative;z-index:1}
.renoz4-puis .renoz4-n{width:22px;height:22px;border-radius:50%;background:#111;color:#fff;font-family:var(--renoz4-mono);font-weight:600;font-size:12px;display:grid;place-items:center;flex:none}
.renoz4-puis span.renoz4-l{flex:1;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.renoz4-faits{display:grid;gap:0;padding:0 10px}
.renoz4-fait{display:flex;align-items:center;gap:8px;min-height:30px;font-size:13px;color:#333;border-top:1px solid var(--renoz4-line)}
.renoz4-fait .renoz4-m{margin-left:auto;font-weight:600}
.renoz4-ck{width:18px;height:18px;border-radius:50%;background:var(--renoz4-ok);color:#fff;display:grid;place-items:center;flex:none}
.renoz4-in{display:flex;align-items:center;gap:6px;padding:4px 0 6px}
.renoz4-in input{flex:1;height:32px;border:1px solid #BFBFBF;border-radius:10px;padding:0 10px;font:inherit;font-size:16px;color:#111;background:#fff}
.renoz4-in input:focus{outline:2px solid #111;outline-offset:1px}
.renoz4-form{display:grid;grid-template-columns:72px 1fr;gap:6px 8px;align-items:center;padding:4px 0 6px;font-size:13px;color:#333;border-top:1px solid var(--renoz4-line);margin-top:4px}
.renoz4-sg{display:flex;gap:2px;border:1px solid #BFBFBF;border-radius:10px;overflow:hidden}
.renoz4-sg button{flex:1;height:28px;text-align:center;font-size:13px;color:#333}
.renoz4-sg button[aria-pressed=true]{background:#111;color:#fff;font-weight:600}
.renoz4-step{display:inline-flex;align-items:center;border:1px solid #BFBFBF;border-radius:10px;overflow:hidden;background:#fff}
.renoz4-step button{width:30px;height:28px;display:grid;place-items:center;color:#333}
.renoz4-step b{font-family:var(--renoz4-mono);font-size:14px;min-width:44px;text-align:center;color:#111}
.renoz4-kb{position:fixed;left:0;right:0;bottom:0;height:240px;background:#D9DCE1;border-top:1px solid #BFBFBF;z-index:6}.renoz4-kb svg{display:block;width:100%;height:100%}
.renoz4-sheet{position:fixed;left:0;right:0;bottom:0;z-index:7;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);padding:8px 12px 10px;max-width:560px;margin:0 auto}
.renoz4-sheet h3{margin:0 0 2px;font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}
.renoz4-sheet h3 .renoz4-x{margin-left:auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--renoz4-surf2)}
.renoz4-row{display:grid;grid-template-columns:22px 1fr auto 24px;gap:8px;align-items:center;width:100%;min-height:36px;border-top:1px solid var(--renoz4-line);font-size:14px}
.renoz4-row small{display:block;font-size:12px;color:#333}
.renoz4-row .renoz4-v{font-family:var(--renoz4-mono);font-weight:600;text-align:right;white-space:nowrap}
.renoz4-row .renoz4-v.renoz4-e{font-family:inherit;font-weight:400;font-size:12px;color:#333}
.renoz4-grip{width:24px;height:36px;display:grid;place-items:center;color:#666}
.renoz4-scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:6}
.renoz4-nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--renoz4-line);z-index:5}
.renoz4-nav-in{max-width:872px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr) 76px;height:46px}
.renoz4-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;color:#333;text-decoration:none}
.renoz4-nav a.renoz4-on{background:var(--renoz4-surf2);color:#111;box-shadow:inset 0 3px 0 #111}
.renoz4-fab{align-self:center;justify-self:center;width:64px;height:40px;border-radius:20px;background:#111;color:#fff;display:grid;place-items:center}
@media (min-width:900px){.renoz4-wrap{grid-template-columns:1fr 1fr;align-items:start}.renoz4-pile{grid-row:span 3}.renoz4-head-in{padding:0}}
</style>
</head>
<body>
<div id="renoz4-root"></div>
<script>
(function(){
  var etat=new URLSearchParams(location.search).get('etat')||'jour1';
  if(['jour1','encours','ajout','ouvert','depasse','caisse','fini','horsligne'].indexOf(etat)<0)etat='jour1';
  var P={
    mug:'<path d="M6 7h9v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1z"/><path d="M15 10h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2"/><path d="M6 7c0-2 1.5-3 3-3 1 0 1.6.5 2 1 .5-.6 1.2-1 2-1 1.4 0 2 1 2 3"/>',
    moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>',
    bulle:'<path d="M5 18.5V7a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H8z"/><path d="M9 9.5h6M9 12.5h4"/>',
    grid:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
    wallet:'<path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><rect x="4" y="8" width="16" height="11" rx="2"/><path d="M15 13.5h2"/>',
    cubes:'<path d="M12 3 8 5v4l4 2 4-2V5z"/><path d="M8 11 4 13v4l4 2 4-2v-4z"/><path d="M16 11l-4 2v4l4 2 4-2v-4z"/>',
    users:'<circle cx="9" cy="8" r="3.5"/><path d="M3 19c.7-3.4 3-5 6-5s5.3 1.6 6 5"/><path d="M15.5 4.8a3.5 3.5 0 0 1 0 6.4M17.5 14.3c1.7.8 2.9 2.4 3.3 4.7"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',right:'<path d="m9 6 6 6-6 6"/>',down:'<path d="m6 9 6 6 6-6"/>',
    check:'<path d="m5 12.5 4.5 4.5L19 7"/>',chain:'<path d="M10 14a3.5 3.5 0 0 0 5 0l3-3a3.5 3.5 0 0 0-5-5l-1 1"/><path d="M14 10a3.5 3.5 0 0 0-5 0l-3 3a3.5 3.5 0 0 0 5 5l1-1"/>',
    cloud:'<path d="M7 18h10a4 4 0 0 0 .5-8A5.5 5.5 0 0 0 7 9.5 4.3 4.3 0 0 0 7 18z"/><path d="M4 4l16 16"/>',x:'<path d="M6 6l12 12M18 6 6 18"/>',
    recu:'<path d="M6 3h12v18l-2-1.5L14 21l-2-1.5L10 21l-2-1.5L6 21z"/><path d="M9 8h6M9 12h6"/>',clock:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
    cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/>',truelle:'<path d="M3 13 11 5l5 5-8 8H5z"/><path d="M14 8l6-4"/><path d="M5 15l4 4"/>',
    grip:'<path d="M8 7h8M8 12h8M8 17h8"/>',tobottom:'<path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>'
  };
  function ico(n,s){s=s||16;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(36/s).toFixed(3)+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+P[n]+'</svg>';}
  function chf(v){return v.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,' ');}

  // Ses cinq manques (ses mots) ; le reste est inventé. La pile : le premier est « Ensuite », les autres derrière.
  var T={hotte:'Installation de la hotte',evier:'2ᵉ évier',armoire:'Armoire extérieure',sols:'Seconde passe sur les sols',site:'Site web vitrine'};
  var ENC=[
    {k:'sols',s:'enc',mot:'en cours',prix:1200,paye:480,h:12,hf:5},
    {k:'hotte',s:'pay',mot:'payée, à poser',prix:1850,paye:1850,e:'pose à estimer'},
    {k:'evier',s:'dev',mot:'devis Sanitaire Fictif SA',prix:640,paye:0},
    {k:'armoire',s:'blo',mot:'attend les sols',e:'à estimer'},
    {k:'site',s:'enc',mot:'en cours, sans achat',h:20,hf:4}];
  var J1=['hotte','evier','armoire','sols','site'].map(function(k){return {k:k,s:'afaire'};});
  var FIN={pile:[{k:'evier',s:'enc',mot:'en cours, devis accepté',prix:640,paye:0},{k:'armoire',s:'afaire',e:'à estimer'}],
    faits:[{k:'hotte',v:'1 850,00',mot:'posée'},{k:'sols',v:'1 200,00',mot:'faite'},{k:'site',v:'—',mot:'fait, sans facture'}]};
  var L=(etat==='jour1'||etat==='ajout'||etat==='horsligne')?J1:etat==='fini'?FIN.pile:ENC.slice();
  if(etat==='depasse')L[0]={k:'sols',s:'dep',mot:'dépassé',prix:1200,paye:1384.5,h:12,hf:5};
  var caisseConnue=false, pileOuverte=false;

  function chips(m){
    var c='';
    if(m.s==='afaire')return '<div class="renoz4-chips" data-booster="renseigner"><button class="renoz4-chip">'+ico('plus',12)+'prix</button><button class="renoz4-chip">'+ico('plus',12)+'heures</button><button class="renoz4-chip">'+ico('chain',12)+'bloqué par</button></div>';
    if(m.s==='dep')c+='<button class="renoz4-chip renoz4-al"><b>1 384,50</b> pour <b>1 200,00</b> · <b>+184,50</b></button>';
    else if(m.prix)c+='<button class="renoz4-chip" data-booster="prix"><b>'+chf(m.prix)+'</b>'+(m.paye?' · reste <b>'+chf(m.prix-m.paye)+'</b>':' · devis')+'</button>';
    else c+='<button class="renoz4-chip" data-booster="prix">'+ico('plus',12)+'prix'+(m.e?' · '+m.e:'')+'</button>';
    if(m.h)c+='<button class="renoz4-chip" data-booster="heures">'+ico('clock',12)+'<b>'+m.hf+'/'+m.h+' h</b></button>';
    else c+='<button class="renoz4-chip" data-booster="heures">'+ico('plus',12)+'heures</button>';
    c+='<button class="renoz4-chip" data-booster="blocage">'+ico('chain',12)+(m.s==='blo'?m.mot:'rien')+'</button>';
    if(etat==='caisse')c+=caisseConnue?'<button class="renoz4-chip" aria-pressed="true">payable · caisse <b>6 240,00</b></button>':'<button class="renoz4-chip" data-booster="caisse" data-capture-apres>payable ? caisse à renseigner'+ico('right',12)+'</button>';
    return '<div class="renoz4-chips">'+c+'</div>';
  }
  function dessus(){
    var m=L[0];
    var head='<div class="renoz4-ch">'+ico('truelle',18)+'Rénovation<span class="renoz4-r"><button class="renoz4-link" data-booster="pile"'+(etat==='jour1'?' data-capture-apres':'')+'><b class="renoz4-m">'+(L.length)+'</b>&nbsp;à faire'+ico('right',14)+'</button></span></div>';
    var input=etat==='ajout'?'<div class="renoz4-in"><input type="text" value="Étagère pour les fûts" aria-label="Noter un manque" autofocus><button class="renoz4-btn" data-booster="noter">Noter</button></div>':'';
    var jauge=m.paye&&m.prix&&m.s!=='dep'?'<div class="renoz4-bar" data-booster="jauge"><i style="width:'+(m.paye/m.prix*100).toFixed(0)+'%;background:#1F64A3"></i></div>':'';
    var form=etat==='ouvert'?'<div class="renoz4-form"><span>Nature</span><div class="renoz4-sg" data-booster="nature"><button aria-pressed="false">Achat</button><button aria-pressed="false">Travail</button><button aria-pressed="true">Les deux</button></div>'+
      '<span>Payé</span><span><b class="renoz4-m">480,00</b> · Sols Fictifs Sàrl · <span class="renoz4-link">1 facture'+ico('right',12)+'</span></span>'+
      '<span>Heures</span><span class="renoz4-step" data-booster="heures-pas"><button aria-label="Moins">'+ico('minus',14)+'</button><b>12 h</b><button aria-label="Plus">'+ico('plus',14)+'</button></span>'+
      '<span>Fin</span><span>rythme à régler</span></div>':'';
    return '<div class="renoz4-top">'+head+'<div class="renoz4-cb">'+input+'<span class="renoz4-tag">Ensuite</span><p class="renoz4-big" data-mots="lignes">'+T[m.k]+'</p>'+
      (m.mot?'<p class="renoz4-etat"><span class="renoz4-dot renoz4-s-'+m.s+'"></span>'+m.mot+'</p>':'')+chips(m)+jauge+form+
      '<div class="renoz4-acts"><button class="renoz4-btn" data-booster="noter-achat">'+ico('recu',14)+'Noter l’achat</button><button class="renoz4-btn2" data-booster="fait">'+ico('check',14)+'Fait</button><button class="renoz4-btn2" data-booster="recul" style="margin-left:auto">'+ico('tobottom',14)+'Pas maintenant</button></div></div></div>';
  }
  function puis(){
    var r=L.slice(1);if(!r.length)return '<div class="renoz4-puis"><span class="renoz4-l">Rien derrière</span></div>';
    // Les deux cartes suivantes dépassent de la pile, le reste se compte.
    var peek=r.slice(0,2).map(function(m,i){return '<button class="renoz4-peek" data-booster="pile"><span class="renoz4-n">'+(i+2)+'</span><span class="renoz4-l" data-mots="lignes">'+T[m.k]+'</span>'+(m.mot?'<small>'+m.mot+'</small>':'')+'</button>';}).join('');
    return peek+(r.length>2?'<button class="renoz4-puis" data-booster="pile"><span class="renoz4-n">+'+(r.length-2)+'</span><span class="renoz4-l">derrière</span>'+ico('down',16)+'</button>':'');
  }
  function faits(){
    if(etat!=='fini')return '';
    return '<div class="renoz4-faits">'+FIN.faits.map(function(f){return '<div class="renoz4-fait"><span class="renoz4-ck">'+ico('check',11)+'</span><span data-mots="lignes">'+T[f.k]+'</span><span style="color:#333">'+f.mot+'</span><span class="renoz4-m">'+f.v+'</span></div>';}).join('')+'</div>';
  }
  function pile(){return '<section class="renoz4-pile" aria-label="Rénovation">'+dessus()+puis()+faits()+'</section>';}
  function bande(){
    return '<section class="renoz4-card renoz4-c-prod"><div class="renoz4-ch">'+ico('mug',18)+'Brassins<span class="renoz4-r">0 en cuve <span class="renoz4-link">Tous'+ico('right',14)+'</span></span></div><div class="renoz4-cb" style="color:#333">Aucun brassin en cuve.</div></section>'+
      '<section class="renoz4-card renoz4-c-stock"><div class="renoz4-ch">'+ico('cubes',18)+'Stocks<span class="renoz4-r"><span class="renoz4-link">Voir'+ico('right',14)+'</span></span></div><div class="renoz4-cb" style="display:flex;gap:8px;align-items:center;color:#333"><span style="color:#4C6B2A">'+ico('check',16)+'</span>Stocks suffisants</div></section>'+
      '<section class="renoz4-card renoz4-c-fin"><div class="renoz4-ch">'+ico('wallet',18)+'Finances<span class="renoz4-r">Ce mois '+ico('down',16)+'</span></div><div class="renoz4-cb" style="display:flex;justify-content:space-between;color:#333">Charges<span class="renoz4-m" style="color:#111">0,00 CHF</span></div></section>'+
      '<section class="renoz4-card renoz4-c-ag"><div class="renoz4-ch">'+ico('cal',18)+'Agenda<span class="renoz4-r">0 à faire <span class="renoz4-link">Gérer'+ico('right',14)+'</span></span></div><div class="renoz4-cb" style="color:#333">Rien à faire.</div></section>'+
      '<section class="renoz4-card renoz4-c-ag"><div class="renoz4-ch">'+ico('cal',18)+'Échéances et démarches<span class="renoz4-r">'+ico('down',16)+'</span></div><div class="renoz4-cb" style="color:#333">6 points à suivre</div></section>';
  }
  function liste(){
    if(!pileOuverte)return '';
    var rows=L.map(function(m,i){
      var v=m.s==='dep'?'<span class="renoz4-v" style="color:#A8291F">+184,50</span>':m.prix&&m.paye<m.prix?'<span class="renoz4-v">'+chf(m.prix-(m.paye||0))+'</span>':m.h?'<span class="renoz4-v">'+m.hf+'/'+m.h+' h</span>':m.e?'<span class="renoz4-v renoz4-e">'+m.e+'</span>':'<span class="renoz4-v renoz4-e"></span>';
      return '<div class="renoz4-row"><span class="renoz4-n" style="width:22px;height:22px;border-radius:50%;background:#111;color:#fff;font-family:var(--renoz4-mono);font-weight:600;font-size:12px;display:grid;place-items:center">'+(i+1)+'</span><span><span data-mots="lignes">'+T[m.k]+'</span>'+(m.mot?'<small>'+m.mot+'</small>':'')+'</span>'+v+'<span class="renoz4-grip" data-booster="ordre" aria-label="Déplacer">'+ico('grip',16)+'</span></div>';
    }).join('');
    return '<div class="renoz4-scrim" data-booster="fermer"></div><div class="renoz4-sheet" role="dialog" aria-label="La suite"><h3>La suite<span class="renoz4-x" data-booster="fermer" aria-label="Fermer">'+ico('x',14)+'</span></h3>'+rows+'<button class="renoz4-row" data-booster="ajouter" style="color:#333"><span style="display:grid;place-items:center">'+ico('plus',16)+'</span><span>Noter un manque</span></button></div>';
  }
  function kb(){if(etat!=='ajout')return '';var k='';[10,9,7].forEach(function(n,r){var w=(378-(n-1)*5)/n;for(var i=0;i<n;i++)k+='<rect x="'+(6+i*(w+5)).toFixed(1)+'" y="'+(44+r*48)+'" width="'+w.toFixed(1)+'" height="38" rx="5" fill="#fff"/>';});k+='<rect x="100" y="188" width="190" height="38" rx="5" fill="#fff"/>';return '<div class="renoz4-kb" aria-hidden="true"><svg viewBox="0 0 390 240" preserveAspectRatio="none"><text x="12" y="26" font-size="13" fill="#333" font-family="Source Sans 3,sans-serif">clavier</text>'+k+'</svg></div>';}
  function page(){
    return '<header class="renoz4-head"><div class="renoz4-head-in"><span class="renoz4-logo" aria-hidden="true">'+ico('mug',20)+'</span><span class="renoz4-brand">L’Affinée</span>'+
      '<button class="renoz4-hbtn" aria-label="Thème sombre">'+ico('moon',18)+'</button><button class="renoz4-hbtn renoz4-hf" aria-label="Rechercher">'+ico('search',18)+'</button><button class="renoz4-hbtn renoz4-hf" aria-label="Compagnon">'+ico('bulle',18)+'</button></div></header>'+
      '<main class="renoz4-wrap">'+(etat==='horsligne'?'<div class="renoz4-off" style="grid-column:1/-1">'+ico('cloud',16)+'Hors ligne · gardé sur ce téléphone, envoyé au retour du réseau</div>':'')+'<div id="renoz4-pile" style="display:contents">'+pile()+'</div>'+bande()+'</main>';
  }
  function nav(){
    var it=[['grid','Bord','#333'],['wallet','Finances','#1F64A3'],['mug','Brassins','#9A4F1E'],['cubes','Stocks','#4C6B2A'],['users','Clients','#333']];
    return '<nav class="renoz4-nav" aria-label="Navigation principale"><div class="renoz4-nav-in">'+it.map(function(x){return '<a href="#" class="'+(x[1]==='Bord'?'renoz4-on':'')+'"><span style="color:'+x[2]+'">'+ico(x[0],18)+'</span>'+x[1]+'</a>';}).join('')+
      '<button class="renoz4-fab" data-commun aria-label="Actions rapides">'+ico('plus',22)+'</button></div></nav>';
  }
  var root=document.getElementById('renoz4-root');
  function redraw(){document.getElementById('renoz4-pile').innerHTML=pile();document.getElementById('renoz4-liste').innerHTML=liste();}
  root.innerHTML=page()+nav()+'<div id="renoz4-liste">'+liste()+'</div>'+kb();
  root.addEventListener('click',function(ev){
    var b=ev.target.closest('[data-booster]');if(!b)return;
    var k=b.getAttribute('data-booster');
    if(k==='recul'){L.push(L.shift());redraw();ev.preventDefault();}
    if(k==='pile'){pileOuverte=true;redraw();ev.preventDefault();}
    if(k==='fermer'){pileOuverte=false;redraw();ev.preventDefault();}
    if(k==='caisse'){caisseConnue=true;redraw();ev.preventDefault();}
  });
})();
</script>
</body>
</html>
