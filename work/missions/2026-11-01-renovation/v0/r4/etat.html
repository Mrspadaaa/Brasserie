button,input{font:inherit;color:inherit;background:none;border:0;text-align:left}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:#DCD3F0}
:focus-visible{outline:2px solid var(--renor4-t0);outline-offset:2px}

.renor4-logo{width:32px;height:32px;border-radius:10px;background:#111;display:flex;align-items:center;justify-content:center}

.renor4-main{max-width:720px;margin:0 auto;padding:0 12px 76px}
.renor4-tete{display:flex;align-items:center;gap:4px;min-height:40px}

.renor4-tete h1{flex:1;font-size:16px;font-weight:700;color:var(--renor4-t0)}
.renor4-hl{display:none;align-items:center;gap:6px;min-height:28px;margin-bottom:6px;padding:0 8px;border-radius:10px;background:var(--renor4-pan);border:1px solid var(--renor4-bord);font-size:12px;color:var(--renor4-t1)}

.renor4-rec{display:flex;gap:6px;margin-bottom:8px}

.renor4-rec em{font-style:normal;font-size:12px;font-weight:600;color:var(--renor4-att)}

.renor4-file{position:relative}
.renor4-bl{display:grid;grid-template-columns:40px 1fr;gap:6px}
.renor4-reg{position:relative;border-right:2px solid var(--renor4-age)}
.renor4-reg span{position:absolute;right:4px;bottom:-8px;font-family:var(--renor4-mono);font-size:12px;color:var(--renor4-age);background:#FFFFFF;padding:0 2px;line-height:16px}
.renor4-reg span.renor4-q{color:var(--renor4-att)}
.renor4-reg i{position:absolute;right:-6px;bottom:-1px;width:10px;height:2px;background:var(--renor4-age)}
.renor4-reg.renor4-inc{border-right:2px dashed var(--renor4-attb)}
.renor4-sem{position:absolute;left:-2px;font-size:12px;color:var(--renor4-t2)}
.renor4-blk{display:flex;align-items:stretch;gap:4px;margin-bottom:4px;border-radius:10px;border:1px solid #C9BEE6;background:repeating-linear-gradient(180deg,#FFFFFF 0 6px,#E4DDF3 6px 7px) 0 40px/100% 100% no-repeat,#FFFFFF;overflow:hidden}

.renor4-blk.renor4-x-cours{background:linear-gradient(180deg,rgba(106,79,176,.18) var(--renor4-fait),transparent var(--renor4-fait)),repeating-linear-gradient(180deg,#FFFFFF 0 6px,#E4DDF3 6px 7px) 0 40px/100% 100% no-repeat,#FFFFFF}
.renor4-blk.renor4-sel{outline:2px solid var(--renor4-age)}
.renor4-o{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-start;gap:2px;padding:6px 8px}
.renor4-o strong{font-size:14px;font-weight:600;color:var(--renor4-t0)}
.renor4-meta{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--renor4-t1)}
.renor4-pa{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap;background:#FFFFFF;border:1px solid var(--renor4-bordm)}
.renor4-p-h{border-color:var(--renor4-age);color:var(--renor4-age)}

.renor4-p-bloque{border:1px dashed var(--renor4-attb);background:var(--renor4-attf);color:var(--renor4-att)}

.renor4-p-devis{border-color:var(--renor4-fin);color:var(--renor4-fin)}
.renor4-p-dep{background:#FBE6E3;border-color:#FBE6E3;color:var(--renor4-alr)}
.renor4-ctl{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:2px 2px 0 0}

.renor4-fin{display:grid;grid-template-columns:40px 1fr;gap:6px;margin-top:2px}

.renor4-finb span{flex:1}
.renor4-flag{display:flex;justify-content:flex-end;align-items:center;color:var(--renor4-age)}
/* Noter : le bloc vide au bout de la file */
.renor4-add{display:grid;grid-template-columns:40px 1fr;gap:6px;margin-top:6px}
.renor4-addb{display:flex;align-items:center;gap:6px;height:40px;padding:0 6px 0 10px;border-radius:10px;border:1.5px dashed var(--renor4-age);color:var(--renor4-age);background:#FFFFFF}

.renor4-on .renor4-addb{border:2px solid var(--renor4-age)}
.renor4-go{display:none;height:30px;padding:0 12px;border-radius:10px;background:var(--renor4-age);color:#FFFFFF;font-weight:600}
.renor4-on .renor4-go{display:block}
.renor4-dev{display:none;grid-column:2;align-items:center;gap:4px;font-size:12px;color:var(--renor4-t1)}
.renor4-on .renor4-dev{display:flex}

.renor4-dev button[aria-pressed="true"]{border-color:var(--renor4-age);background:var(--renor4-agef);color:var(--renor4-age);font-weight:700}
.renor4-faits{display:flex;align-items:center;gap:6px;min-height:32px;margin-bottom:6px;padding:0 8px;border-radius:10px;background:var(--renor4-okf);font-size:14px;color:var(--renor4-ok);width:100%}

.renor4-fl{display:flex;align-items:center;gap:6px;min-height:28px;padding:0 8px;font-size:12px;color:var(--renor4-t2)}
.renor4-fl s{flex:1;font-size:14px}

.renor4-voile{display:none;position:fixed;inset:0;background:rgba(17,17,17,.35);z-index:20}

.renor4-fh b{flex:1;font-size:16px;color:var(--renor4-t0)}
.renor4-rw{display:flex;align-items:center;gap:8px;min-height:40px;border-bottom:1px solid var(--renor4-bord);font-size:14px}
.renor4-rw .renor4-l{flex:1;color:var(--renor4-t1)}
.renor4-rw .renor4-inc{color:var(--renor4-att)}
.renor4-step{display:flex;align-items:center;gap:2px;border:1px solid var(--renor4-bordm);border-radius:10px;height:32px}
.renor4-step button{width:32px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--renor4-age)}
.renor4-step b{min-width:44px;text-align:center;font-family:var(--renor4-mono);font-size:16px;color:var(--renor4-t0)}
.renor4-causes{display:flex;flex-wrap:wrap;gap:4px;padding:6px 0;border-bottom:1px solid var(--renor4-bord)}
.renor4-causes button{height:28px;padding:0 10px;border-radius:10px;border:1px solid var(--renor4-bordm);font-size:14px}
.renor4-causes button[aria-pressed="true"]{border:1px dashed var(--renor4-attb);background:var(--renor4-attf);color:var(--renor4-att);font-weight:600}
.renor4-lab{font-size:12px;color:var(--renor4-t2);margin-top:8px}
.renor4-prim{display:flex;align-items:center;justify-content:center;gap:6px;height:36px;margin-top:10px;border-radius:10px;background:#111;color:#FFFFFF;font-weight:600}
.renor4-in{height:32px;width:96px;padding:0 8px;border-radius:10px;border:1px solid var(--renor4-bordm);font-family:var(--renor4-mono);font-size:16px;text-align:right}
/* Barre du bas */
.renor4-nav{position:fixed;left:0;right:0;bottom:0;height:52px;background:#F7F7F7;border-top:1px solid var(--renor4-bord);display:flex;justify-content:center;padding-right:76px;z-index:8}
.renor4-nav a{flex:0 1 62px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--renor4-t1)}
.renor4-nav a[aria-current]{background:#E9E9E9;color:var(--renor4-t0);font-weight:600;box-shadow:inset 0 2px 0 var(--renor4-t0)}
.renor4-fab{position:fixed;right:8px;bottom:4px;width:64px;height:44px;border-radius:22px;background:#111;color:#FFF;display:flex;align-items:center;justify-content:center;z-index:9}
@media (min-width:900px){.renor4-nav{padding-right:0}.renor4-nav a{flex-basis:90px}.renor4-fab{right:12px}}
</style></head>

<script>
(function () {
  // Données fictives. Les cinq titres sont ses mots. h : mes heures estimées (null = à estimer), f : faites ;
  // prix, paye en CHF (null = à estimer). Le rythme (heures par semaine) est un réglage, inconnu par défaut.
  var T = ['Installation de la hotte', '2ᵉ évier', 'Armoire extérieure', 'Seconde passe sur les sols', 'Site web vitrine'];
  var q = new URLSearchParams(location.search);
  var etat = q.get('etat') || 'jour1';
  var L, rythme = null, faits = [], vue = null, sel = null;
  if (etat === 'jour1' || etat === 'ajout') {
    L = T.map(function (t) { return { t: t, h: null, f: 0, prix: null, paye: 0 }; });
    if (etat === 'ajout') L = L.slice(0, 4);
  } else {
    L = [
      { t: T[3], h: 12, f: 5, prix: 860, paye: 420, st: 'cours' },
      { t: T[0], h: 2, f: 0, prix: 2480, paye: 1980, st: 'paye' },
      { t: T[1], h: 3, f: 0, prix: 1140, paye: 0, st: 'devis' },
      { t: T[2], h: null, f: 0, prix: null, paye: 0, st: 'bloque', cause: 'les sols' },
      { t: T[4], h: 10, f: 0, prix: null, sansAchat: true, paye: 0 }
    ];
  }
  if (etat === 'depasse') { L[0].paye = 1012.40; L[0].st = 'dep'; }
  if (etat === 'caisse') { rythme = 6; L[3].h = 4; vue = 'payer'; }
  if (etat === 'fini') { faits = [{ t: T[0], hors: false }, { t: T[1], hors: true }]; L = L.filter(function (x) { return x.t !== T[0] && x.t !== T[1]; }); L[1].h = 4; }
  if (etat === 'horsligne') { document.body.classList.add('renor4-off'); L[4].wait = true; }
  var racine = document.body;

  function fmt(n) { var s = n.toFixed(2).split('.'); return s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ',' + s[1]; }
  function hh(n) { return String(n).replace('.', ',') + ' h'; }
  var chev = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  var haut = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';

  function restantes(x) { return x.h == null ? null : Math.max(0, x.h - x.f); }
  function recap() {
    var hr = 0, hq = 0, r = 0, pq = 0, connu = false;
    L.forEach(function (x) { var v = restantes(x); if (v == null) hq++; else hr += v; if (x.sansAchat) return; if (x.prix == null) { pq++; return; } connu = true; r += Math.max(0, x.prix - x.paye); });
    var h = [];

    if (connu) h.push('<button type="button" data-vue="payer" aria-pressed="' + (vue === 'payer') + '" data-booster="recap-payer"><small>Reste à payer</small><b>' + fmt(r) + ' CHF</b>' + (pq ? '<em>+' + pq + ' à estimer</em>' : '') + '</button>');
    return h.join('');
  }
  function haute(x) { var v = restantes(x); return v == null ? 56 : Math.max(48, 40 + v * 7); }
  function meta(x) {
    var p = [];
    var v = restantes(x);
    if (v == null && etat !== 'jour1' && etat !== 'ajout') p.push('<span class="renor4-pa renor4-p-hq">heures à estimer</span>');
    else if (x.h) p.push('<span class="renor4-pa renor4-p-h"><span class="renor4-m">' + (x.f ? x.f + ' / ' + hh(x.h) : hh(x.h)) + '</span></span>');
    if (x.st === 'paye') p.push('<span class="renor4-pa renor4-p-paye">payé, pose à régler</span>');
    if (x.st === 'devis') p.push('<span class="renor4-pa renor4-p-devis">devis <span class="renor4-m">' + fmt(x.prix) + '</span></span>');
    if (x.st === 'bloque') p.push('<span class="renor4-pa renor4-p-bloque">attend ' + x.cause + '</span>');
    if (x.st === 'dep') p.push('<span class="renor4-pa renor4-p-dep">dépassé <span class="renor4-m">+' + fmt(x.paye - x.prix) + '</span></span>');
    if (x.sansAchat) p.push('<span class="renor4-pa">sans achat</span>');
    if (x.wait) p.push('<span class="renor4-pa">à envoyer</span>');
    if (vue === 'payer' && !x.sansAchat) p.push('<span class="renor4-pa" style="border-color:#111">' + (x.prix == null ? 'prix à estimer' : '<span class="renor4-m">' + fmt(Math.max(0, x.prix - x.paye)) + '</span> à payer') + '</span>');
    return p.join('');
  }
  function rendre() {
    document.getElementById('renor4-rec').innerHTML = recap();
    document.getElementById('renor4-faits').innerHTML = faits.length ? '<button type="button" class="renor4-faits"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M5 12l5 5 9-10"/></svg><span>Fait · ' + faits.length + '</span></button><div data-mots="lignes">' +
      faits.map(function (f) { return '<div class="renor4-fl"><s>' + f.t + '</s>' + (f.hors ? 'hors de l\'app' : '<span class="renor4-m">2 480,00</span>') + '</div>'; }).join('') + '</div>' : '';
    var h = ['<div data-mots="lignes">'], cum = 0, trou = false, sem = 1;
    L.forEach(function (x, i) {
      var v = restantes(x);
      if (v == null) trou = true; else cum += v;
      var lab = trou ? '<span class="renor4-q">?</span>' : '<span>' + cum + '</span>';
      var semaines = '';
      if (rythme && !trou) { while (sem * rythme <= cum) { semaines += '<span class="renor4-sem" style="bottom:' + Math.round((cum - sem * rythme) / (v || 1) * (haute(x) - 4)) + 'px">s' + sem + '</span>'; sem++; } }
      var x2 = v == null ? ' renor4-x-inc' : '';
      var style = 'height:' + haute(x) + 'px';
      h.push('<div class="renor4-bl"><div class="renor4-reg' + (v == null ? ' renor4-inc' : '') + '" style="height:' + (haute(x) + 4) + 'px">' + semaines + lab + '<i></i></div>' +
        '<div class="renor4-blk' + x2 + (sel === i ? ' renor4-sel' : '') + '" style="' + style + '"><button type="button" class="renor4-o" data-ouvre="' + i + '"><strong>' + x.t + '</strong><span class="renor4-meta">' + meta(x) + '</span></button>' +
        '<span class="renor4-ctl"><span class="renor4-grip" aria-hidden="true" style="display:flex;width:28px;height:20px;align-items:center;justify-content:center">' + grip + '</span>' +
        (i ? '<button type="button" data-monte="' + i + '" aria-label="Plus tôt : ' + x.t + '" data-booster="ordre">' + haut + '</button>' : '') + '</span></div></div>');
    });
    h.push('</div>');
    var fin;
    if (trou) fin = '<button type="button" class="renor4-finb renor4-q" data-booster="fin"><span>Fin : heures à estimer</span>' + chev + '</button>';
    else if (!rythme) fin = '<button type="button" class="renor4-finb renor4-q" data-booster="fin" data-rythme="1"><span>Fin : rythme à régler</span>' + chev + '</button>';
    else { var s = Math.ceil(cum / rythme); var d = new Date(2026, 10, 1 + s * 7); fin = '<button type="button" class="renor4-finb" data-booster="fin"><span>Fin estimée · ' + s + ' semaines à ' + hh(rythme) + '</span><span class="renor4-m" style="flex:none">≈ ' + String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '</span></button>'; }
    h.push('<div class="renor4-fin"><span class="renor4-flag">' + drapeau + '</span>' + fin + '</div>');
    var on = etat === 'ajout';
    h.push('<div class="renor4-add"><span></span><label class="renor4-addb" data-booster="noter"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><input id="renor4-in" type="text" inputmode="text" enterkeyhint="done" placeholder="Noter un manque, à la suite" aria-label="Noter un manque" value="' + (on ? 'Site web vitrine' : '') + '"><button type="button" class="renor4-go">Noter</button></label>' +
      '<div class="renor4-dev" data-booster="nature"><span>Deviné</span><button type="button" aria-pressed="false">achat</button><button type="button" aria-pressed="true">travail</button><button type="button" aria-pressed="false">les deux</button></div></div>');
    if (on) racine.classList.add('renor4-on');
    document.getElementById('renor4-file').innerHTML = h.join('');
    brancher();
    if (on) { var i = document.getElementById('renor4-in'); i.focus(); }
  }
  function feuille(x) {
    var r = ['<div class="renor4-fh"><b>' + x.t + '</b><button class="renor4-ib" type="button" data-ferme="1" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'];
    r.push('<div class="renor4-rw"><span class="renor4-l">Mes heures, estimées</span><span class="renor4-step" data-booster="heures"><button type="button" aria-label="Une heure de moins"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M5 12h14"/></svg></button><b>' + (x.h == null ? '?' : x.h) + '</b><button type="button" aria-label="Une heure de plus"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></span></div>');
    r.push('<div class="renor4-rw"><span class="renor4-l">Déjà faites</span><input class="renor4-in" type="text" inputmode="decimal" value="' + x.f + '" aria-label="Heures faites"></div>');
    r.push('<div class="renor4-rw"><span class="renor4-l">Achat</span>' + (x.sansAchat ? '<span class="renor4-pa">sans achat</span>' : x.prix == null ? '<span class="renor4-inc">à estimer</span>' : '<span class="renor4-m">' + fmt(x.prix) + ' CHF</span>') + '</div>');
    r.push('<div class="renor4-lab">Bloqué par</div><div class="renor4-causes" role="group" aria-label="Bloqué par" data-booster="cause">' +
      ['rien', 'un chantier', 'un artisan', 'un devis', 'une livraison', 'l\'argent'].map(function (c, k) { return '<button type="button" aria-pressed="' + (k === 0) + '">' + c + '</button>'; }).join('') + '</div>');
    r.push('<a class="renor4-prim" href="#noter-achat" data-booster="noter-achat">Noter l\'achat' + chev + '</a>');
    return r.join('');
  }
  function feuilleRythme() {
    return '<div class="renor4-fh"><b>Mon rythme</b><button class="renor4-ib" type="button" data-ferme="1" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
      '<div class="renor4-rw"><span class="renor4-l">Heures par semaine</span><input class="renor4-in" type="text" inputmode="decimal" placeholder="à régler" aria-label="Heures par semaine"></div>' +
      '<a class="renor4-prim" href="#rythme">Régler' + chev + '</a>';
  }
  function ouvrir(html) { document.getElementById('renor4-feuille').innerHTML = html; racine.classList.add('renor4-ouvre'); }
  function brancher() {
    document.querySelectorAll('#renor4-file [data-ouvre]').forEach(function (b) { b.addEventListener('click', function () { ouvrir(feuille(L[+b.getAttribute('data-ouvre')])); }); });
    document.querySelectorAll('#renor4-file [data-monte]').forEach(function (b) {
      b.addEventListener('click', function () { var i = +b.getAttribute('data-monte'); var x = L.splice(i, 1)[0]; L.splice(i - 1, 0, x); sel = i - 1; rendre(); });
    });
    document.querySelectorAll('#renor4-rec [data-vue]').forEach(function (b) { b.addEventListener('click', function () { var v = b.getAttribute('data-vue'); vue = vue === v ? null : v; rendre(); }); });
    var ry = document.querySelector('[data-rythme]');
    if (ry) ry.addEventListener('click', function () { ouvrir(feuilleRythme()); });
    document.querySelectorAll('.renor4-dev button').forEach(function (b) {
      b.addEventListener('click', function () { document.querySelectorAll('.renor4-dev button').forEach(function (c) { c.setAttribute('aria-pressed', String(c === b)); }); });
    });
  }
  document.getElementById('renor4-voile').addEventListener('click', function () { racine.classList.remove('renor4-ouvre'); });
  document.getElementById('renor4-feuille').addEventListener('click', function (e) {
    if (e.target.closest('[data-ferme]')) racine.classList.remove('renor4-ouvre');
    var c = e.target.closest('.renor4-causes button');
    if (c) c.parentNode.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b === c)); });
  });
  rendre();
  if (etat === 'ouvert') { sel = 4; rendre(); ouvrir(feuille(L[4])); }
})();
</script>
</body></html>
