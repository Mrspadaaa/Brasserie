<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>r1 — Rénovation : une carte du Bord, la liste à pastilles (froide, 01.11)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--renor1-page:#FFFFFF;--renor1-pan:#F5F5F5;--renor1-sur:#EBEBEB;--renor1-bord:#DDDDDD;--renor1-bordm:#BFBFBF;--renor1-t2:#666666;--renor1-t1:#333333;--renor1-t0:#111111;
--renor1-prod:#9A4F1E;--renor1-fin:#1F64A3;--renor1-sto:#4C6B2A;--renor1-age:#6A4FB0;--renor1-reno:#2C6670;--renor1-att:#7F5B10;--renor1-attb:#9C7020;--renor1-attf:#FBF3E2;--renor1-alr:#A8291F;
--renor1-sans:"Source Sans 3",system-ui,sans-serif;--renor1-mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--renor1-page);color:var(--renor1-t1);font-family:var(--renor1-sans);font-size:14px;line-height:1.3;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;background:none;border:0;text-align:left}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:#CFE3E6}
:focus-visible{outline:2px solid var(--renor1-t0);outline-offset:2px}
.renor1-m{font-family:var(--renor1-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
svg{flex:none}
/* En-tête de l'app, repris tel quel */
.renor1-hd{position:sticky;top:0;z-index:6;background:var(--renor1-page);border-bottom:1px solid var(--renor1-bord);height:44px;display:flex;align-items:center;gap:8px;padding:0 8px}
.renor1-logo{width:32px;height:32px;border-radius:10px;background:#111;display:flex;align-items:center;justify-content:center}
.renor1-hd b{flex:1;font-size:16px;font-weight:600;color:var(--renor1-t0)}
.renor1-ib{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--renor1-t1)}
.renor1-ib.renor1-f{background:var(--renor1-sur);border:1px solid var(--renor1-bordm)}
.renor1-main{max-width:1180px;margin:0 auto;padding:8px 12px 76px;display:grid;gap:8px}
@media (min-width:900px){.renor1-main{grid-template-columns:1fr 1fr;align-items:start}.renor1-col{display:grid;gap:8px}}
.renor1-col{display:grid;gap:8px}
/* Hors ligne */
.renor1-hl{display:none;align-items:center;gap:6px;min-height:28px;padding:0 8px;border-radius:10px;background:var(--renor1-pan);border:1px solid var(--renor1-bord);font-size:12px;color:var(--renor1-t1)}
.renor1-off .renor1-hl{display:flex}
@media (min-width:900px){.renor1-hl{grid-column:1/-1}}
/* Cartes teintées du Bord, reprises telles quelles */
.renor1-card{border-radius:16px;border:1px solid;background:var(--renor1-pan);overflow:hidden}
.renor1-ch{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 8px}
.renor1-ch h2{flex:1;font-size:16px;font-weight:600}
.renor1-ch .renor1-cpt{font-size:12px;color:var(--renor1-t1)}
.renor1-act{display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 4px;font-size:14px;font-weight:600}
.renor1-cb{padding:6px 8px;font-size:14px;color:var(--renor1-t1);display:flex;align-items:center;gap:6px}
.renor1-prod{border-color:rgba(154,79,30,.3)}.renor1-prod .renor1-ch{background:rgba(154,79,30,.1);color:var(--renor1-prod)}
.renor1-sto{border-color:rgba(76,107,42,.3)}.renor1-sto .renor1-ch{background:rgba(76,107,42,.1);color:var(--renor1-sto)}
.renor1-fin{border-color:rgba(31,100,163,.3);background:rgba(31,100,163,.1)}.renor1-fin .renor1-ch{color:var(--renor1-fin)}
.renor1-age{border-color:rgba(106,79,176,.3)}.renor1-age .renor1-ch{background:rgba(106,79,176,.1);color:var(--renor1-age)}
.renor1-ch .renor1-dark{color:var(--renor1-t1)}
/* La carte Rénovation */
.renor1-reno{border-color:rgba(44,102,112,.35)}
.renor1-reno .renor1-ch{background:rgba(44,102,112,.1);color:var(--renor1-reno)}
.renor1-ens{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--renor1-bord);background:#FFFFFF;width:100%}
.renor1-ensl{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:10px;background:var(--renor1-reno);color:#FFFFFF;font-size:12px;font-weight:700}
.renor1-ens .renor1-ti{flex:1;min-width:0;font-size:16px;font-weight:600;color:var(--renor1-t0)}
.renor1-li{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 4px 0 8px;border-bottom:1px solid var(--renor1-bord)}
.renor1-li .renor1-ti{flex:1;min-width:0;font-size:14px;color:var(--renor1-t0);display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:40px;justify-content:center;padding:4px 0}
.renor1-up{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--renor1-reno)}
.renor1-num{font-family:var(--renor1-mono);font-size:12px;color:var(--renor1-t2);width:14px}
/* Pastilles d'état : une forme, un mot */
.renor1-pa{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 6px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.renor1-pa i{width:8px;height:8px;border-radius:50%;flex:none}
.renor1-p-devis{border:1px solid var(--renor1-fin);color:var(--renor1-fin);background:#FFFFFF}.renor1-p-devis i{border:1.5px solid var(--renor1-fin)}
.renor1-p-paye{background:#E7EFE2;color:#3F5F24}.renor1-p-paye i{background:#3F5F24}
.renor1-p-cours{background:#E3EEF0;color:var(--renor1-reno)}.renor1-p-cours i{background:linear-gradient(90deg,var(--renor1-reno) 50%,transparent 50%);border:1.5px solid var(--renor1-reno)}
.renor1-p-bloque{border:1px dashed var(--renor1-attb);color:var(--renor1-att);background:var(--renor1-attf)}.renor1-p-bloque i{background:var(--renor1-attb);border-radius:2px}
.renor1-p-travail{border:1px solid var(--renor1-bordm);color:var(--renor1-t1);background:#FFFFFF}.renor1-p-travail i{border:1.5px solid var(--renor1-t2)}
.renor1-p-depasse{background:#FBE6E3;color:var(--renor1-alr)}.renor1-p-depasse i{background:var(--renor1-alr)}
.renor1-p-fait{background:var(--renor1-sur);color:var(--renor1-t1)}
.renor1-pas{display:flex;gap:4px;flex-wrap:wrap}
/* Ligne de contexte : le reste à payer, seulement s'il est connu */
.renor1-ctx{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 8px;border-bottom:1px solid var(--renor1-bord);font-size:14px;color:var(--renor1-t1);width:100%;background:#FFFFFF}
.renor1-ctx b{font-weight:600;color:var(--renor1-t0)}
.renor1-ctx .renor1-sp{flex:1}
.renor1-est{font-size:12px;color:var(--renor1-att);border-bottom:1px dashed var(--renor1-attb)}
/* Noter un manque */
.renor1-add{display:flex;align-items:center;gap:6px;padding:6px 8px}
.renor1-add label{flex:1;display:flex;align-items:center;gap:6px;height:32px;padding:0 8px;border-radius:10px;border:1px solid var(--renor1-bordm);background:#FFFFFF;color:var(--renor1-t2)}
.renor1-add input{flex:1;min-width:0;height:30px;font-size:16px;color:var(--renor1-t0);outline:0}
.renor1-add input::placeholder{color:var(--renor1-t2)}
.renor1-add.renor1-on label{border:2px solid var(--renor1-reno)}
.renor1-go{height:32px;padding:0 12px;border-radius:10px;background:var(--renor1-reno);color:#FFFFFF;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.renor1-nat{display:flex;align-items:center;gap:4px;padding:0 8px 8px;font-size:12px;color:var(--renor1-t1)}
.renor1-nat button{height:24px;padding:0 8px;border-radius:10px;border:1px solid var(--renor1-bordm);font-size:12px;background:#FFFFFF}
.renor1-nat button[aria-pressed="true"]{border-color:var(--renor1-reno);background:#E3EEF0;color:var(--renor1-reno);font-weight:700}
.renor1-faits summary{list-style:none;display:flex;align-items:center;gap:6px;min-height:32px;padding:0 8px;font-size:14px;color:var(--renor1-t1);cursor:pointer}
.renor1-faits summary::-webkit-details-marker{display:none}
.renor1-faits summary span{flex:1}
.renor1-faits[open] summary svg{transform:rotate(180deg)}
.renor1-fl{display:flex;align-items:center;gap:6px;min-height:32px;padding:0 8px;border-top:1px solid var(--renor1-bord);font-size:14px;color:var(--renor1-t2);text-decoration:line-through}
.renor1-fl .renor1-pa{text-decoration:none}
.renor1-fl span:first-child{flex:1}
.renor1-ok{color:var(--renor1-sto)}
/* La feuille */
.renor1-voile{display:none;position:fixed;inset:0;background:rgba(17,17,17,.35);z-index:20}
.renor1-feuille{display:none;position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#FFFFFF;border-radius:24px 24px 0 0;z-index:21;padding:8px 12px 16px;max-height:86vh;overflow:auto}
.renor1-ouvre .renor1-voile,.renor1-ouvre .renor1-feuille{display:block}
.renor1-fh{display:flex;align-items:center;gap:8px;min-height:40px}
.renor1-fh b{flex:1;font-size:16px;color:var(--renor1-t0)}
.renor1-seg{display:flex;gap:2px;margin:4px 0 8px;padding:2px;border-radius:10px;background:var(--renor1-sur)}
.renor1-seg button{flex:1;height:28px;border-radius:10px;text-align:center;font-size:14px;color:var(--renor1-t1)}
.renor1-seg button[aria-pressed="true"]{background:#FFFFFF;color:var(--renor1-reno);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.renor1-rw{display:flex;align-items:center;gap:8px;min-height:36px;border-bottom:1px solid var(--renor1-bord);font-size:14px}
.renor1-rw .renor1-l{flex:1;color:var(--renor1-t1)}
.renor1-rw .renor1-v{color:var(--renor1-t0)}
.renor1-rw .renor1-v.renor1-inc{color:var(--renor1-att)}
.renor1-bar{height:8px;border-radius:10px;background:var(--renor1-sur);overflow:hidden;display:flex;margin:6px 0 2px}
.renor1-bar i{display:block;height:100%}
.renor1-fa{display:flex;align-items:center;gap:8px;margin-top:10px}
.renor1-prim{flex:1;height:36px;border-radius:10px;background:#111;color:#FFFFFF;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.renor1-sec{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--renor1-bordm);font-weight:600;display:flex;align-items:center;gap:6px}
.renor1-cause{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border-radius:10px;border:1px dashed var(--renor1-attb);background:var(--renor1-attf);color:var(--renor1-att);font-size:14px;font-weight:600}
/* Barre du bas, reprise telle quelle */
.renor1-nav{position:fixed;left:0;right:0;bottom:0;height:52px;background:#F7F7F7;border-top:1px solid var(--renor1-bord);display:flex;justify-content:center;padding-right:76px;z-index:8}
.renor1-nav a{flex:0 1 62px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--renor1-t1)}
.renor1-nav a[aria-current]{background:#E9E9E9;color:var(--renor1-t0);font-weight:600;box-shadow:inset 0 2px 0 var(--renor1-t0)}
.renor1-fab{position:fixed;right:8px;bottom:4px;width:64px;height:44px;border-radius:22px;background:#111;color:#FFF;display:flex;align-items:center;justify-content:center;z-index:9}
@media (min-width:900px){.renor1-nav{padding-right:0}.renor1-nav a{flex-basis:90px}.renor1-fab{right:12px}}
</style></head>

<script>
(function () {
  // Données fictives. Les cinq titres sont ses mots ; montants, artisans et heures inventés.
  // e : état (null = rien de connu) ; prix, paye : CHF (null = à estimer) ; nat : achat | travail | deux.
  var T = ['Installation de la hotte', '2ᵉ évier', 'Armoire extérieure', 'Seconde passe sur les sols', 'Site web vitrine'];
  function jour1() { return T.map(function (t) { return { t: t, e: null, prix: null, paye: null }; }); }
  function encours() {
    return [
      { t: T[3], e: 'cours', nat: 'deux', prix: 860, paye: 420 },
      { t: T[0], e: 'paye', nat: 'deux', prix: 2480, paye: 1980, cause: 'Ventil\'Demo Sàrl, la pose' },
      { t: T[1], e: 'devis', nat: 'deux', prix: 1140, paye: 0 },
      { t: T[2], e: 'bloque', nat: 'achat', prix: null, paye: null, cause: 'les sols' },
      { t: T[4], e: 'travail', nat: 'travail', prix: null, paye: null, sansAchat: true }
    ];
  }
  var q = new URLSearchParams(location.search);
  var etat = q.get('etat') || 'jour1';
  var L = etat === 'jour1' ? jour1() : etat === 'ajout' ? jour1().slice(0, 4) : encours();
  var faits = [];
  if (etat === 'depasse') { L[0].e = 'depasse'; L[0].paye = 1012.40; }
  if (etat === 'fini') {
    faits = [{ t: T[0], prix: 2480, hors: false }, { t: T[1], prix: null, hors: true }];
    L = L.filter(function (x) { return x.t !== T[0] && x.t !== T[1]; });
    L[1].e = 'bloque';
  }
  if (etat === 'horsligne') document.body.classList.add('renor1-off');
  var racine = document.body;

  function fmt(n) { var s = n.toFixed(2).split('.'); return s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ',' + s[1]; }
  var chev = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  var bas = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5714" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';
  var haut = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';
  var marteau = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M13 6l5 5"/><path d="M10 4.5l3-1.5 7 7-1.5 3z"/><path d="M12.5 8.5L4 17l3 3 8.5-8.5"/></svg>';

  function pastille(x) {
    if (!x.e) return '';
    var m = {
      devis: ['devis', 'devis <span class="renor1-m">' + (x.prix != null ? fmt(x.prix) : '') + '</span>'],
      paye: ['paye', 'payé, à poser'],
      cours: ['cours', 'en cours'],
      bloque: ['bloque', 'attend ' + x.cause],
      travail: ['travail', 'sans achat'],
      depasse: ['depasse', '<span class="renor1-m">+' + fmt(x.paye - x.prix) + '</span> au-delà']
    }[x.e];
    return '<span class="renor1-pa renor1-p-' + m[0] + '" data-booster="pastille-etat"><i></i>' + m[1] + '</span>';
  }
  function reste() {
    var r = 0, inc = 0, connu = false;
    L.forEach(function (x) {
      if (x.sansAchat) return;
      if (x.prix == null) { inc++; return; }
      connu = true; r += Math.max(0, x.prix - (x.paye || 0));
    });
    return { r: r, inc: inc, connu: connu };
  }
  function rendre() {
    var h = [];
    var nb = L.length;
    h.push('<div class="renor1-ch">' + marteau + '<h2 id="renor1-h">Rénovation</h2><span class="renor1-cpt">' + nb + ' à faire</span>' +
      '<a class="renor1-act" href="#tout">Tout' + chev + '</a></div>');
    var premier = L[0];
    h.push('<button type="button" class="renor1-ens" data-ouvre="0" data-booster="ensuite"><span class="renor1-ensl">Ensuite</span>' +
      '<span class="renor1-ti" data-mots="lignes">' + premier.t + '</span><span data-mots="lignes">' + pastille(premier) + '</span>' + chev + '</button>');
    h.push('<div data-mots="lignes">');
    L.slice(1).forEach(function (x, i) {
      h.push('<div class="renor1-li"><span class="renor1-num">' + (i + 2) + '</span><button type="button" class="renor1-ti" data-ouvre="' + (i + 1) + '">' + x.t +
        (x.e ? '<span class="renor1-pas">' + pastille(x) + '</span>' : '') + '</button>' +
        '<button type="button" class="renor1-up" data-monte="' + (i + 1) + '" aria-label="Faire ensuite : ' + x.t + '" data-booster="monter">' + haut + '</button></div>');
    });
    h.push('</div>');
    var r = reste();
    if (r.connu) {
      h.push('<button type="button" class="renor1-ctx" data-booster="reste" data-reste="1"><span>Reste à payer</span><b class="renor1-m">' + fmt(r.r) + ' CHF</b>' +
        (r.inc ? '<span class="renor1-est">+' + r.inc + ' à estimer</span>' : '') + '<span class="renor1-sp"></span>' + chev + '</button>');
    }
    if (faits.length) {
      h.push('<details class="renor1-faits" open><summary><span>Fait · ' + faits.length + '</span>' + bas + '</summary><div data-mots="lignes">');
      faits.forEach(function (f) {
        h.push('<div class="renor1-fl"><span>' + f.t + '</span>' + (f.hors ? '<span class="renor1-pa renor1-p-fait">hors de l\'app</span>' : '<span class="renor1-m">' + fmt(f.prix) + '</span>') +
          '<svg class="renor1-ok" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M5 12l5 5 9-10"/></svg></div>');
      });
      h.push('</div></details>');
    }
    var on = etat === 'ajout';
    h.push('<div class="renor1-add' + (on ? ' renor1-on' : '') + '"><label data-booster="noter"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>' +
      '<input id="renor1-in" type="text" inputmode="text" enterkeyhint="done" placeholder="Noter un manque" aria-label="Noter un manque" value="' + (on ? 'Site web vitrine' : '') + '"></label>' +
      (on ? '<button type="button" class="renor1-go" id="renor1-go">Noter</button>' : '') + '</div>');
    if (on) {
      h.push('<div class="renor1-nat" data-booster="nature"><span>Deviné :</span><button type="button" aria-pressed="false">achat</button><button type="button" aria-pressed="true">travail</button><button type="button" aria-pressed="false">les deux</button></div>');
    }
    document.getElementById('renor1-reno').innerHTML = h.join('');
    brancher();
    if (on) { var i = document.getElementById('renor1-in'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  }
  function feuilleManque(x) {
    var paye = x.paye || 0;
    var rows = [];
    rows.push('<div class="renor1-fh"><b>' + x.t + '</b>' + fermer() + '</div>');
    rows.push('<div class="renor1-seg" role="group" aria-label="Nature" data-booster="nature"><button type="button" aria-pressed="' + (x.nat === 'achat') + '">Achat</button><button type="button" aria-pressed="' + (x.nat === 'travail') + '">Travail</button><button type="button" aria-pressed="' + (x.nat === 'deux') + '">Les deux</button></div>');
    if (x.t === T[0]) {
      rows.push('<div class="renor1-rw"><span class="renor1-l">Achat</span><span class="renor1-v renor1-m">1 890,00</span><span class="renor1-pa renor1-p-paye"><i></i>payé</span></div>');
      rows.push('<div class="renor1-rw"><span class="renor1-l">Livraison</span><span class="renor1-v renor1-m">90,00</span><span class="renor1-pa renor1-p-paye"><i></i>payé</span></div>');
      rows.push('<div class="renor1-rw"><span class="renor1-l">Installation</span><span class="renor1-v renor1-m">500,00</span><span class="renor1-pa renor1-p-devis"><i></i>à régler</span></div>');
      rows.push('<div class="renor1-bar" aria-hidden="true"><i style="width:' + (paye / x.prix * 100) + '%;background:#3F5F24"></i></div>');
      rows.push('<div class="renor1-rw"><span class="renor1-l">Payé · 1 facture liée</span><span class="renor1-v renor1-m">' + fmt(paye) + ' / ' + fmt(x.prix) + ' CHF</span></div>');
      rows.push('<div class="renor1-rw"><span class="renor1-l">Bloqué par</span><button type="button" class="renor1-cause" data-booster="cause">' + x.cause + chev + '</button></div>');
    } else if (x.t === T[3]) {
      rows.push('<div class="renor1-bar" aria-hidden="true"><i style="width:' + Math.min(100, paye / x.prix * 100) + '%;background:' + (paye > x.prix ? 'var(--renor1-alr)' : 'var(--renor1-reno)') + '"></i></div>');
      rows.push('<div class="renor1-rw"><span class="renor1-l">Factures liées · 2</span><span class="renor1-v renor1-m">' + fmt(paye) + ' / ' + fmt(x.prix) + ' CHF</span></div>');
      if (paye > x.prix) rows.push('<div class="renor1-rw"><span class="renor1-l">Au-delà du budget</span><span class="renor1-pa renor1-p-depasse"><i></i><span class="renor1-m">+' + fmt(paye - x.prix) + '</span></span></div>');
    } else {
      rows.push('<div class="renor1-rw"><span class="renor1-l">Prix</span><span class="renor1-v ' + (x.prix == null ? 'renor1-inc' : 'renor1-m') + '">' + (x.prix == null ? 'à estimer' : fmt(x.prix) + ' CHF') + '</span></div>');
    }
    rows.push('<div class="renor1-fa"><button type="button" class="renor1-sec">Fait</button><a class="renor1-prim" href="#noter-achat" data-booster="noter-achat">Noter l\'achat' + chev + '</a></div>');
    return rows.join('');
  }
  function feuilleReste() {
    var rows = ['<div class="renor1-fh"><b>Reste à payer</b>' + fermer() + '</div>'];
    L.forEach(function (x, i) {
      var v = x.sansAchat ? '<span class="renor1-pa renor1-p-travail"><i></i>sans achat</span>' : x.prix == null ? '<span class="renor1-v renor1-inc">à estimer</span>' :
        '<span class="renor1-v renor1-m">' + fmt(Math.max(0, x.prix - (x.paye || 0))) + '</span>';
      rows.push('<button type="button" class="renor1-rw" style="width:100%" data-ouvre="' + i + '"><span class="renor1-l">' + x.t + '</span>' + v + chev + '</button>');
    });
    var r = reste();
    rows.push('<div class="renor1-rw" style="border-bottom:0"><span class="renor1-l" style="font-weight:600;color:var(--renor1-t0)">Connu</span><span class="renor1-v renor1-m" style="font-weight:600">' + fmt(r.r) + ' CHF</span></div>');
    return rows.join('');
  }
  function fermer() { return '<button class="renor1-ib" type="button" data-ferme="1" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>'; }
  function ouvrir(html) { document.getElementById('renor1-feuille').innerHTML = html; racine.classList.add('renor1-ouvre'); }
  function brancher() {
    document.querySelectorAll('#renor1-reno [data-ouvre]').forEach(function (b) {
      b.addEventListener('click', function () { ouvrir(feuilleManque(L[+b.getAttribute('data-ouvre')])); });
    });
    document.querySelectorAll('#renor1-reno [data-monte]').forEach(function (b) {
      b.addEventListener('click', function () { var i = +b.getAttribute('data-monte'); var x = L.splice(i, 1)[0]; L.unshift(x); rendre(); });
    });
    var r = document.querySelector('#renor1-reno [data-reste]');
    if (r) r.addEventListener('click', function () { ouvrir(feuilleReste()); });
    document.querySelectorAll('#renor1-reno .renor1-nat button').forEach(function (b) {
      b.addEventListener('click', function () { document.querySelectorAll('#renor1-reno .renor1-nat button').forEach(function (c) { c.setAttribute('aria-pressed', String(c === b)); }); });
    });
  }
  document.getElementById('renor1-voile').addEventListener('click', function () { racine.classList.remove('renor1-ouvre'); });
  document.getElementById('renor1-feuille').addEventListener('click', function (e) {
    if (e.target.closest('[data-ferme]')) racine.classList.remove('renor1-ouvre');
    var o = e.target.closest('[data-ouvre]');
    if (o) ouvrir(feuilleManque(L[+o.getAttribute('data-ouvre')]));
  });
  rendre();
  if (etat === 'ouvert') ouvrir(feuilleManque(L[1]));
  if (etat === 'depasse') ouvrir(feuilleManque(L[0]));
  if (etat === 'caisse') ouvrir(feuilleReste());
})();
</script>
