<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>r3 — Rénovation : la brasserie en plan, chaque manque à sa place, numéroté dans la suite (chaude, 01.11)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--renor3-page:#FFFFFF;--renor3-pan:#F5F5F5;--renor3-sur:#EBEBEB;--renor3-bord:#DDDDDD;--renor3-bordm:#BFBFBF;--renor3-t2:#666666;--renor3-t1:#333333;--renor3-t0:#111111;
--renor3-reno:#2C6670;--renor3-renof:#E3EEF0;--renor3-fin:#1F64A3;--renor3-ok:#3F5F24;--renor3-okf:#E7EFE2;--renor3-att:#7F5B10;--renor3-attb:#9C7020;--renor3-attf:#FBF3E2;--renor3-alr:#A8291F;
--renor3-sans:"Source Sans 3",system-ui,sans-serif;--renor3-mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--renor3-page);color:var(--renor3-t1);font-family:var(--renor3-sans);font-size:14px;line-height:1.3;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;background:none;border:0;text-align:left}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:#CFE3E6}
:focus-visible{outline:2px solid var(--renor3-t0);outline-offset:2px}
.renor3-m{font-family:var(--renor3-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
svg{flex:none}
.renor3-hd{position:sticky;top:0;z-index:6;background:var(--renor3-page);border-bottom:1px solid var(--renor3-bord);height:44px;display:flex;align-items:center;gap:8px;padding:0 8px}
.renor3-logo{width:32px;height:32px;border-radius:10px;background:#111;display:flex;align-items:center;justify-content:center}
.renor3-hd b{flex:1;font-size:16px;font-weight:600;color:var(--renor3-t0)}
.renor3-ib{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--renor3-t1)}
.renor3-ib.renor3-f{background:var(--renor3-sur);border:1px solid var(--renor3-bordm)}
.renor3-main{max-width:1180px;margin:0 auto;padding:0 12px 112px}
/* La tête de l'écran : teinte de sa carte du Bord */
.renor3-tete{display:flex;align-items:center;gap:6px;min-height:40px;margin:8px 0 0;padding:0 4px 0 2px;border-radius:16px 16px 0 0;background:rgba(44,102,112,.1);border:1px solid rgba(44,102,112,.35);border-bottom:0;color:var(--renor3-reno)}
.renor3-tete a{display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 6px;font-size:14px;font-weight:600}
.renor3-tete h1{flex:1;font-size:16px;font-weight:700}
.renor3-ctx{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--renor3-t1)}
.renor3-env{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 8px;border-radius:10px;border:1px dashed var(--renor3-attb);background:var(--renor3-attf);color:var(--renor3-att);font-size:12px;font-weight:600}
.renor3-env.renor3-set{border:1px solid var(--renor3-reno);background:#FFFFFF;color:var(--renor3-reno)}
.renor3-cadre{border:1px solid rgba(44,102,112,.35);border-top:0;border-radius:0 0 16px 16px;padding:6px 8px 8px;background:#FFFFFF}
.renor3-gau{height:8px;border-radius:10px;background:var(--renor3-sur);display:flex;overflow:hidden;margin:4px 0 2px}
.renor3-gau i{display:block;height:100%}
.renor3-hl{display:none;align-items:center;gap:6px;min-height:28px;margin-top:6px;padding:0 8px;border-radius:10px;background:var(--renor3-pan);border:1px solid var(--renor3-bord);font-size:12px;color:var(--renor3-t1)}
.renor3-off .renor3-hl{display:flex}
/* Le plan */
.renor3-plan{display:block;width:100%;max-width:480px;height:auto;margin:4px auto 0}
.renor3-plan text{font-family:var(--renor3-sans);font-size:12px;fill:var(--renor3-t1)}
.renor3-plan .renor3-zl{font-weight:600;fill:var(--renor3-t1);letter-spacing:.02em;paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}
.renor3-plan .renor3-pinn{font-family:var(--renor3-mono);font-size:12px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.renor3-plan [data-pin]{cursor:pointer}
.renor3-plan .renor3-zone-on{fill:#E3EEF0;stroke:var(--renor3-reno);stroke-width:2;stroke-dasharray:4 3}
/* La suite */
.renor3-suite{margin-top:8px}
.renor3-sh{display:flex;align-items:center;gap:6px;min-height:28px;border-bottom:1px solid var(--renor3-bordm);font-size:14px;font-weight:600;color:var(--renor3-t0)}
.renor3-sh span{flex:1}
.renor3-row{display:flex;align-items:center;gap:6px;min-height:40px;border-bottom:1px solid var(--renor3-bord)}
.renor3-row.renor3-sel{background:var(--renor3-renof)}
.renor3-row > button.renor3-o{flex:1;min-width:0;display:flex;align-items:center;gap:8px;min-height:40px}
.renor3-row .renor3-tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.renor3-row strong{font-size:14px;font-weight:600;color:var(--renor3-t0)}
.renor3-row .renor3-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px;font-size:12px;color:var(--renor3-t1)}
.renor3-pin{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--renor3-mono);font-size:12px;font-weight:600;flex:none}
.renor3-k-rien{border:1.5px dashed var(--renor3-t1);color:var(--renor3-t0);background:#FFFFFF}
.renor3-k-devis{border:2px solid var(--renor3-fin);color:var(--renor3-fin);background:#FFFFFF}
.renor3-k-paye{background:var(--renor3-ok);color:#FFFFFF}
.renor3-k-cours{background:var(--renor3-reno);color:#FFFFFF}
.renor3-k-bloque{background:var(--renor3-attf);border:2px dashed var(--renor3-attb);color:var(--renor3-att)}
.renor3-k-depasse{background:var(--renor3-alr);color:#FFFFFF}
.renor3-k-fait{background:var(--renor3-sur);color:var(--renor3-ok)}
.renor3-pa{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.renor3-p-bloque{border:1px dashed var(--renor3-attb);background:var(--renor3-attf);color:var(--renor3-att)}
.renor3-p-dep{background:#FBE6E3;color:var(--renor3-alr)}
.renor3-p-wait{border:1px solid var(--renor3-bordm);background:var(--renor3-pan)}
.renor3-mv{width:28px;height:28px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--renor3-reno)}
.renor3-pr{font-size:14px;color:var(--renor3-t0);text-align:right}
.renor3-pr.renor3-inc{color:var(--renor3-att);font-size:12px}
/* Noter un manque, sous le pouce */
.renor3-add{position:fixed;left:0;right:0;bottom:52px;z-index:7;background:#FFFFFF;border-top:1px solid var(--renor3-bord);padding:6px 12px}
.renor3-addi{max-width:1156px;margin:0 auto;display:flex;align-items:center;gap:6px}
.renor3-addi label{flex:1;display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--renor3-bordm);background:var(--renor3-pan);color:var(--renor3-t2)}
.renor3-addi input{flex:1;min-width:0;height:34px;font-size:16px;color:var(--renor3-t0);outline:0;background:transparent}
.renor3-addi input::placeholder{color:var(--renor3-t2)}
.renor3-on .renor3-addi label{border:2px solid var(--renor3-reno);background:#FFFFFF}
.renor3-go{height:36px;padding:0 14px;border-radius:10px;background:var(--renor3-reno);color:#FFFFFF;font-weight:600}
.renor3-ou{display:none;max-width:1156px;margin:4px auto 0;font-size:12px;color:var(--renor3-reno);font-weight:600}
.renor3-on .renor3-ou{display:block}
/* Feuille */
.renor3-voile{display:none;position:fixed;inset:0;background:rgba(17,17,17,.35);z-index:20}
.renor3-feuille{display:none;position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#FFFFFF;border-radius:24px 24px 0 0;z-index:21;padding:8px 12px 12px;max-height:80vh;overflow:auto}
.renor3-ouvre .renor3-voile,.renor3-ouvre .renor3-feuille{display:block}
.renor3-fh{display:flex;align-items:center;gap:8px;min-height:40px}
.renor3-fh b{flex:1;font-size:16px;color:var(--renor3-t0)}
.renor3-rw{display:flex;align-items:center;gap:8px;min-height:36px;border-bottom:1px solid var(--renor3-bord);font-size:14px}
.renor3-rw .renor3-l{flex:1;color:var(--renor3-t1)}
.renor3-rw .renor3-inc{color:var(--renor3-att)}
.renor3-cause{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:10px;border:1px dashed var(--renor3-attb);background:var(--renor3-attf);color:var(--renor3-att);font-weight:600}
.renor3-et{display:flex;align-items:center;gap:8px;min-height:32px;font-size:14px}
.renor3-et input{width:18px;height:18px;accent-color:var(--renor3-reno)}
.renor3-et.renor3-done span{color:var(--renor3-t2);text-decoration:line-through}
.renor3-lab{font-size:12px;color:var(--renor3-t2);margin-top:8px}
.renor3-prim{display:flex;align-items:center;justify-content:center;gap:6px;height:36px;margin-top:8px;border-radius:10px;background:#111;color:#FFFFFF;font-weight:600}
/* Barre du bas */
.renor3-nav{position:fixed;left:0;right:0;bottom:0;height:52px;background:#F7F7F7;border-top:1px solid var(--renor3-bord);display:flex;justify-content:center;padding-right:76px;z-index:8}
.renor3-nav a{flex:0 1 62px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--renor3-t1)}
.renor3-nav a[aria-current]{background:#E9E9E9;color:var(--renor3-t0);font-weight:600;box-shadow:inset 0 2px 0 var(--renor3-t0)}
.renor3-fab{position:fixed;right:8px;bottom:4px;width:64px;height:44px;border-radius:22px;background:#111;color:#FFF;display:flex;align-items:center;justify-content:center;z-index:9}
@media (min-width:900px){.renor3-nav{padding-right:0}.renor3-nav a{flex-basis:90px}.renor3-fab{right:12px}
  .renor3-grille{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}.renor3-suite{margin-top:4px}}
</style></head>
<body>
<header class="renor3-hd">
  <span class="renor3-logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2C14E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h9v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z"/><path d="M15 10h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2"/><path d="M6 7a3 3 0 0 1 3-3 3 3 0 0 1 3 1 2.5 2.5 0 0 1 3 2"/></svg></span>
  <b>L'Affinée</b>
  <button class="renor3-ib" type="button" aria-label="Thème sombre"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
  <button class="renor3-ib renor3-f" type="button" aria-label="Rechercher"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></button>
  <button class="renor3-ib renor3-f" type="button" aria-label="Compagnon brasseur"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18l2-4a7 7 0 1 1 3 3z"/></svg></button>
</header>
<main class="renor3-main">
  <div class="renor3-hl" role="status"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 9.1 4.5 4.5 0 0 0 7 18z"/><path d="M3 3l18 18"/></svg><span>Hors ligne · gardé sur ce téléphone</span></div>
  <div class="renor3-grille">
    <div>
      <div class="renor3-tete"><a href="#bord" aria-label="Retour au Bord"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>Bord</a><h1>Rénovation</h1><span id="renor3-env-slot"></span></div>
      <div class="renor3-cadre"><div id="renor3-ctx"></div><div id="renor3-plan"></div></div>
    </div>
    <section class="renor3-suite" id="renor3-suite"></section>
  </div>
</main>
<div class="renor3-add" id="renor3-add">
  <div class="renor3-addi"><label data-booster="noter"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><input id="renor3-in" type="text" inputmode="text" enterkeyhint="done" placeholder="Noter un manque" aria-label="Noter un manque"></label><button type="button" class="renor3-go">Noter</button></div>
  <div class="renor3-ou">Où ? Touche une zone du plan, ou Noter sans lieu</div>
</div>
<div class="renor3-voile" id="renor3-voile"></div>
<section class="renor3-feuille" role="dialog" aria-label="Manque" id="renor3-feuille"></section>
<nav class="renor3-nav" aria-label="Navigation">
  <a href="#" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="6" height="7" rx="1"/><rect x="14" y="4" width="6" height="4" rx="1"/><rect x="4" y="15" width="6" height="5" rx="1"/><rect x="14" y="12" width="6" height="8" rx="1"/></svg>Bord</a>
  <a href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F64A3" stroke-width="1.8" stroke-linejoin="round"><path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 7l11-3v3"/><path d="M15 13h5v3h-5z"/></svg>Finances</a>
  <a href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A4F1E" stroke-width="1.8" stroke-linejoin="round"><path d="M6 8h9v11a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1z"/><path d="M15 10h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2M9 11v6M12 11v6M6 8a3 3 0 0 1 4.5-2.5A3 3 0 0 1 15 8"/></svg>Brassins</a>
  <a href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4C6B2A" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l4 2.3v4.6L12 12 8 9.9V5.3z"/><path d="M8 12l4 2.3v4.6L8 21l-4-2.1v-4.6z"/><path d="M16 12l4 2.3v4.6L16 21l-4-2.1v-4.6z"/></svg>Stocks</a>
  <a href="#"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M3 20a6 6 0 0 1 12 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a5 5 0 0 1 3 6"/></svg>Clients</a>
</nav>
<button class="renor3-fab" data-commun="plus" type="button" aria-label="Nouvelle opération"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<script>
(function () {
  // Données fictives. Les cinq titres sont ses mots ; le plan est un schéma qu'il pose lui-même (zones nommées),
  // pas le relevé de son local. k : état ; prix, paye en CHF (null = à estimer) ; h : heures estimées (null = rien).
  var T = ['Installation de la hotte', '2ᵉ évier', 'Armoire extérieure', 'Seconde passe sur les sols', 'Site web vitrine'];
  var POS = {}; // position du repère de chaque manque sur le plan (viewBox 366 × 300)
  POS[T[0]] = [96, 66]; POS[T[1]] = [300, 76]; POS[T[2]] = [344, 186]; POS[T[3]] = [248, 246]; POS[T[4]] = [300, 21];
  var q = new URLSearchParams(location.search);
  var etat = q.get('etat') || 'jour1';
  var L, env = null, faits = [];
  if (etat === 'jour1' || etat === 'ajout') {
    L = T.map(function (t) { return { t: t, k: 'rien', prix: null, paye: 0, h: null }; });
    if (etat === 'ajout') L = L.filter(function (x) { return x.t !== T[2]; });
  } else {
    L = [
      { t: T[3], k: 'cours', prix: 860, paye: 420, h: 12 },
      { t: T[0], k: 'paye', prix: 2480, paye: 1980, h: 2 },
      { t: T[1], k: 'devis', prix: 1140, paye: 0, h: 3 },
      { t: T[2], k: 'bloque', prix: null, paye: 0, h: 4, cause: 'les sols' },
      { t: T[4], k: 'rien', prix: null, sansAchat: true, paye: 0, h: 10 }
    ];
  }
  if (etat === 'depasse') { L[0].k = 'depasse'; L[0].paye = 1012.40; }
  if (etat === 'caisse') env = 5000;
  if (etat === 'fini') { faits = [{ t: T[0], hors: false }, { t: T[1], hors: true }]; L = L.filter(function (x) { return x.t !== T[0] && x.t !== T[1]; }); }
  if (etat === 'horsligne') { document.body.classList.add('renor3-off'); L[4].wait = true; }
  var racine = document.body, sel = null;

  function fmt(n) { var s = n.toFixed(2).split('.'); return s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ',' + s[1]; }
  var chev = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  var haut = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';
  var COUL = { rien: ['#FFFFFF', '#333333', '#111111', '3 2'], devis: ['#FFFFFF', '#1F64A3', '#1F64A3', ''], paye: ['#3F5F24', '#3F5F24', '#FFFFFF', ''],
    cours: ['#2C6670', '#2C6670', '#FFFFFF', ''], bloque: ['#FBF3E2', '#9C7020', '#7F5B10', '3 2'], depasse: ['#A8291F', '#A8291F', '#FFFFFF', ''], fait: ['#EBEBEB', '#3F5F24', '#3F5F24', ''] };
  function estFait(t) { return faits.some(function (f) { return f.t === t; }); }
  function objet(t, fait) {
    // Le manque dessiné à sa place : pointillé tant qu'il manque, plein une fois fait.
    var d = fait ? '' : ' stroke-dasharray="4 3"', s = fait ? '#3F5F24' : '#2C6670';
    if (t === T[0]) return '<path d="M66 50h60l-10 22H76z" fill="' + (fait ? '#E7EFE2' : '#FFFFFF') + '" stroke="' + s + '" stroke-width="2"' + d + '/>';
    if (t === T[1]) return '<rect x="268" y="50" width="40" height="22" rx="4" fill="' + (fait ? '#E7EFE2' : '#FFFFFF') + '" stroke="' + s + '" stroke-width="2"' + d + '/>';
    if (t === T[2]) return '<rect x="326" y="150" width="22" height="58" rx="2" fill="#FFFFFF" stroke="' + s + '" stroke-width="2"' + d + '/>';
    return '';
  }
  function plan() {
    var ajout = etat === 'ajout';
    var s = '<svg class="renor3-plan" viewBox="0 0 366 300" role="img" aria-label="Plan de la brasserie, chaque manque à sa place" data-booster="plan">';
    s += '<defs><pattern id="renor3-sol" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FFFFFF"/><path d="M0 0v8" stroke="' + (estFait(T[3]) ? '#B9CFA9' : '#C9DCDF') + '" stroke-width="3"/></pattern></defs>';
    // En ligne (le site) : hors du local, nommé
    s += '<rect x="178" y="4" width="180" height="34" rx="10" fill="#F5F5F5" stroke="#BFBFBF"/>';
    s += '<g transform="translate(188 13)" fill="none" stroke="#666666" stroke-width="1.5"><circle cx="8" cy="8" r="7"/><path d="M1 8h14M8 1c-3 4-3 10 0 14M8 1c3 4 3 10 0 14"/></g><text x="210" y="25" class="renor3-zl">En ligne</text>';
    // Le local : le sol, hachuré tant que la seconde passe n'est pas finie
    s += '<rect x="8" y="44" width="310" height="214" fill="url(#renor3-sol)" stroke="#111111" stroke-width="3"/>';
    s += '<path d="M168 44v70M168 150v108M168 132H318" stroke="#333333" stroke-width="2"/>';
    s += '<path d="M8 160h70" stroke="#333333" stroke-width="2"/>';
    // Brassage : la cuve, et la hotte au-dessus
    s += '<circle cx="96" cy="108" r="26" fill="#FFFFFF" stroke="#333333" stroke-width="2"/><text x="96" y="112" text-anchor="middle">cuve</text>';
    s += '<text x="16" y="150" class="renor3-zl">Brassage</text>';
    // Lavage : l'évier existant (plein) et le 2e (pointillé)
    s += '<rect x="214" y="50" width="40" height="22" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="2"/><text x="234" y="88" text-anchor="middle">évier</text>';
    s += '<text x="176" y="124" class="renor3-zl">Lavage</text>';
    // Fermentation, accueil, extérieur, rue : nommés
    s += '<circle cx="206" cy="176" r="17" fill="#FFFFFF" stroke="#333333" stroke-width="2"/><circle cx="256" cy="176" r="17" fill="#FFFFFF" stroke="#333333" stroke-width="2"/><text x="176" y="226" class="renor3-zl">Fermentation</text>';
    s += '<text x="16" y="182" class="renor3-zl">Accueil</text>';
    s += '<path d="M24 258h60" stroke="#FFFFFF" stroke-width="4"/><path d="M24 255h60M24 261h60" stroke="#333333" stroke-width="1.5"/><text x="28" y="276">vitrine de la rue</text>';
    s += '<text transform="translate(360 262) rotate(-90)" class="renor3-zl">Extérieur</text>';
    s += '<text x="176" y="250" fill="#2C6670" style="fill:#2C6670;font-weight:600">sol entier</text>';
    if (ajout) {
      ['M8 44h160v116H8z', 'M168 44h150v88H168z', 'M168 132h150v126H168z', 'M8 160h160v98H8z', 'M320 140h44v120h-44z', 'M178 4h180v34H178z'].forEach(function (d, i) {
        s += '<path d="' + d + '" class="renor3-zone-on" fill-opacity=".55" data-zone="' + i + '"/>';
      });
    }
    // Les objets et les repères numérotés dans la suite
    T.forEach(function (t) { if (L.some(function (x) { return x.t === t; }) || estFait(t)) s += objet(t, estFait(t)); });
    L.forEach(function (x, i) {
      var p = POS[x.t], c = COUL[x.k];
      s += '<g data-pin="' + i + '" role="button" aria-label="' + x.t + '"><circle cx="' + p[0] + '" cy="' + p[1] + '" r="16" fill="transparent"/>' +
        '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="11" fill="' + c[0] + '" stroke="' + c[1] + '" stroke-width="' + (sel === i ? 3 : 2) + '"' + (c[3] ? ' stroke-dasharray="' + c[3] + '"' : '') + '/>' +
        '<text x="' + p[0] + '" y="' + p[1] + '" class="renor3-pinn" style="fill:' + c[2] + '">' + (i + 1) + '</text></g>';
    });
    faits.forEach(function (f) {
      var p = POS[f.t];
      s += '<g><circle cx="' + p[0] + '" cy="' + p[1] + '" r="11" fill="#E7EFE2" stroke="#3F5F24" stroke-width="2"/><path d="M' + (p[0] - 5) + ' ' + p[1] + 'l3.5 3.5 6.5-7" fill="none" stroke="#3F5F24" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/></g>';
    });
    return s + '</svg>';
  }
  function ctx() {
    var connus = 0, n = 0, inc = 0;
    L.forEach(function (x) { if (x.sansAchat) return; if (x.prix == null) { inc++; return; } n++; connus += Math.max(x.prix, x.paye); });
    faits.forEach(function (f) { if (!f.hors) { n++; connus += 2480; } });
    var slot = document.getElementById('renor3-env-slot');
    if (!n) { slot.innerHTML = ''; return ''; }
    slot.innerHTML = '<button type="button" class="renor3-env' + (env ? ' renor3-set' : '') + '" data-booster="enveloppe" data-env="1">' + (env ? 'Enveloppe <span class="renor3-m">' + fmt(env) + '</span>' : 'Enveloppe à fixer') + '</button>';
    var h = '<div class="renor3-ctx"><span>Prix connus</span><b class="renor3-m" style="font-size:14px;color:#111">' + fmt(connus) + ' CHF</b>' + (inc ? '<span class="renor3-pa renor3-p-bloque">+' + inc + ' à estimer</span>' : '') +
      (env ? '<span style="margin-left:auto">libre <b class="renor3-m">' + fmt(env - connus) + '</b></span>' : '') + '</div>';
    if (env) h += '<div class="renor3-gau" aria-hidden="true"><i style="width:' + (connus / env * 100) + '%;background:#2C6670"></i><i style="width:' + ((env - connus) / env * 100) + '%;background:repeating-linear-gradient(90deg,#C9DCDF 0 2px,#FFFFFF 2px 6px)"></i></div>';
    return h;
  }
  function etiquette(x) {
    var p = [];
    if (x.k === 'cours') p.push('en cours');
    if (x.k === 'paye') p.push('payé, à poser');
    if (x.k === 'devis') p.push('devis');
    if (x.sansAchat) p.push('sans achat');
    if (x.h != null) p.push('<span class="renor3-m">' + x.h + ' h</span>');
    var s = p.join(' · ');
    if (x.k === 'bloque') s = '<span class="renor3-pa renor3-p-bloque">attend ' + x.cause + '</span>' + (s ? ' ' + s : '');
    if (x.k === 'depasse') s = '<span class="renor3-pa renor3-p-dep">dépassé <span class="renor3-m">+' + fmt(x.paye - x.prix) + '</span></span> ' + s;
    if (x.wait) s += ' <span class="renor3-pa renor3-p-wait">à envoyer</span>';
    return s;
  }
  function suite() {
    var h = ['<div class="renor3-sh"><span>La suite</span></div><div data-mots="lignes">'];
    L.forEach(function (x, i) {
      var pr = x.sansAchat || x.prix == null ? (etat === 'jour1' || etat === 'ajout' ? '' : '<span class="renor3-pr renor3-inc">' + (x.sansAchat ? '' : 'à estimer') + '</span>') :
        '<span class="renor3-pr renor3-m">' + fmt(Math.max(x.prix, x.paye)) + '</span>';
      h.push('<div class="renor3-row' + (sel === i ? ' renor3-sel' : '') + '"><button type="button" class="renor3-o" data-ouvre="' + i + '"><span class="renor3-pin renor3-k-' + x.k + '">' + (i + 1) + '</span>' +
        '<span class="renor3-tt"><strong>' + x.t + '</strong>' + (etiquette(x) ? '<span class="renor3-meta">' + etiquette(x) + '</span>' : '') + '</span>' + pr + '</button>' +
        (i ? '<button type="button" class="renor3-mv" data-monte="' + i + '" aria-label="Avancer dans la suite : ' + x.t + '" data-booster="suite">' + haut + '</button>' : '<span style="width:28px"></span>') + '</div>');
    });
    faits.forEach(function (f) {
      h.push('<div class="renor3-row"><span class="renor3-pin renor3-k-fait"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12l5 5 9-10"/></svg></span><span class="renor3-tt" style="flex:1"><strong style="color:#666;text-decoration:line-through">' + f.t + '</strong><span class="renor3-meta">' + (f.hors ? 'fait hors de l\'app' : 'posée · <span class="renor3-m">2 480,00</span>') + '</span></span></div>');
    });
    h.push('</div>');
    return h.join('');
  }
  function rendre() {
    document.getElementById('renor3-ctx').innerHTML = ctx();
    document.getElementById('renor3-plan').innerHTML = plan();
    document.getElementById('renor3-suite').innerHTML = suite();
    brancher();
  }
  function feuille(x) {
    var armoire = x.t === T[2];
    var r = ['<div class="renor3-fh"><span class="renor3-pin renor3-k-' + x.k + '">' + (L.indexOf(x) + 1) + '</span><b>' + x.t + '</b><button class="renor3-ib" type="button" data-ferme="1" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'];
    if (armoire) {
      r.push('<div class="renor3-rw"><span class="renor3-l">Bloqué par</span><button type="button" class="renor3-cause" data-booster="cause"><span class="renor3-pin renor3-k-cours" style="width:20px;height:20px">1</span>Seconde passe sur les sols' + chev + '</button></div>');
      r.push('<div class="renor3-rw"><span class="renor3-l">Prix</span><span class="renor3-inc">à estimer</span></div>');
      r.push('<div class="renor3-rw"><span class="renor3-l">Mes heures</span><span class="renor3-m">4 h</span></div>');
      r.push('<div class="renor3-lab">Étapes</div>');
      r.push('<label class="renor3-et renor3-done" data-booster="etapes"><input type="checkbox" checked><span>Mesurer le mur côté cour</span></label>');
      r.push('<label class="renor3-et"><input type="checkbox"><span>Demander un devis</span></label>');
      r.push('<label class="renor3-et"><input type="checkbox"><span>Fixer et raccorder</span></label>');
    } else {
      r.push('<div class="renor3-rw"><span class="renor3-l">Prix</span><span class="renor3-m">' + (x.prix != null ? fmt(x.prix) + ' CHF' : '') + '</span>' + (x.prix == null ? '<span class="renor3-inc">à estimer</span>' : '') + '</div>');
      r.push('<div class="renor3-rw"><span class="renor3-l">Payé</span><span class="renor3-m">' + fmt(x.paye) + ' CHF</span></div>');
    }
    r.push('<a class="renor3-prim" href="#noter-achat" data-booster="noter-achat">Noter l\'achat' + chev + '</a>');
    return r.join('');
  }
  function feuilleEnv() {
    return '<div class="renor3-fh"><b>Enveloppe des travaux</b><button class="renor3-ib" type="button" data-ferme="1" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
      '<div class="renor3-rw"><span class="renor3-l">Je mets au plus</span><input type="text" inputmode="decimal" placeholder="à fixer" aria-label="Enveloppe" style="height:32px;width:130px;padding:0 8px;border-radius:10px;border:1px solid #BFBFBF;font-family:var(--renor3-mono);font-size:16px;text-align:right"></div>' +
      '<a class="renor3-prim" href="#env">Fixer' + chev + '</a>';
  }
  function ouvrir(html) { document.getElementById('renor3-feuille').innerHTML = html; racine.classList.add('renor3-ouvre'); }
  function brancher() {
    document.querySelectorAll('#renor3-suite [data-ouvre]').forEach(function (b) { b.addEventListener('click', function () { ouvrir(feuille(L[+b.getAttribute('data-ouvre')])); }); });
    document.querySelectorAll('#renor3-plan [data-pin]').forEach(function (g) { g.addEventListener('click', function () { sel = +g.getAttribute('data-pin'); rendre(); }); });
    document.querySelectorAll('#renor3-suite [data-monte]').forEach(function (b) {
      b.addEventListener('click', function () { var i = +b.getAttribute('data-monte'); var x = L.splice(i, 1)[0]; L.splice(i - 1, 0, x); sel = i - 1; rendre(); });
    });
    var e = document.querySelector('[data-env]');
    if (e) e.addEventListener('click', function () { if (!env) ouvrir(feuilleEnv()); });
  }
  document.getElementById('renor3-voile').addEventListener('click', function () { racine.classList.remove('renor3-ouvre'); });
  document.getElementById('renor3-feuille').addEventListener('click', function (e) { if (e.target.closest('[data-ferme]')) racine.classList.remove('renor3-ouvre'); });
  rendre();
  if (etat === 'ajout') { racine.classList.add('renor3-on'); var i = document.getElementById('renor3-in'); i.value = 'Armoire extérieure'; i.focus(); }
  if (etat === 'ouvert') { sel = 3; rendre(); ouvrir(feuille(L[3])); }
})();
</script>
</body></html>
