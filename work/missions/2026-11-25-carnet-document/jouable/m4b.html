<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Carnets · M4 b jouable</title>
<!-- Jouable M4 b (25.11 soir). Base : maquettes/m4b-note.html (son choix M4 · Deux vues, « Mes notes » en vraie note).
     Capacités à déclarer à la publication : capabilities: { sample: {}, dictation: {},
       db: { rules: [ {path:"journal",read:"admin",write:"admin"}, {path:"liens",read:"view",write:"admin"}, {path:"demandes",read:"admin",write:"admin"} ] } }
     Liens lus par Claude (26.11) : la page lit liens/<id>, écrit demandes/<id> ; voir work/missions/2026-11-26-liens/LIENS.md.
     L'IA = Claude via sample (aucune clé, aucun Gemini). ?demo : réponse fixe, pour les captures hors claude.ai seulement. -->
<style>
:root{color-scheme:dark;--bg:#000;--card:#1c1c1f;--s2:#2a2a2e;--line:#424248;--mut:#a3a3aa;--ink:#f1f1f3;--ia:#b9a3ff;--ok:#8fd17e;--bad:#ff8f80;--att:#e8bd5a;--fin:#7db8f5;--im:#aab3c0;--car:#8ab4f8;
--barre:#0e0e10;--bord:#26262a;--bas:#17171a;--on:#2c2c31;--pop:#232327;--feuille:#1c1c1f;--lienbg:#1b2433;--ombre:rgba(0,0,0,.6);--voile:rgba(0,0,0,.6);--sur-plein:#000;
--iabg:color-mix(in srgb,var(--ia) 17%,var(--card));--okbg:color-mix(in srgb,var(--ok) 15%,var(--card));--badbg:color-mix(in srgb,var(--bad) 15%,var(--card));--attbg:color-mix(in srgb,var(--att) 15%,var(--card));--surl:color-mix(in srgb,var(--ia) 30%,var(--bg))}
@media (prefers-color-scheme: light){
:root{color-scheme:light;--bg:#fff;--card:#f2f2f5;--s2:#e3e3e8;--line:#c5c5cc;--mut:#5d5d66;--ink:#121214;--ia:#6a4bd6;--ok:#2e7a22;--bad:#bf3324;--att:#8c6000;--fin:#1d66b8;--im:#66707c;--car:#1a73e8;
--barre:#f6f6f8;--bord:#e0e0e5;--bas:#ececf0;--on:#fff;--pop:#fff;--feuille:#fff;--lienbg:#e8f0fb;--ombre:rgba(0,0,0,.18);--voile:rgba(0,0,0,.35);--sur-plein:#fff;--surl:color-mix(in srgb,var(--ia) 20%,var(--bg))}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overscroll-behavior:none}
body{font:16px/1.35 "Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
svg{flex:none}
q{quotes:none}
[hidden]{display:none!important}
#app{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100dvh);max-width:640px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.vue{display:none;flex:1;min-height:0;flex-direction:column;position:relative}
.vue.on{display:flex}
/* barre du haut : retour · bascule légère · annuler, refaire, fini */
.m4b-top{height:52px;flex:none;display:flex;align-items:center;padding:0 4px;margin-top:env(safe-area-inset-top)}
.m4b-ic{width:44px;height:44px;display:grid;place-items:center;color:var(--ink);flex:none;border-radius:12px}
.m4b-ic svg{width:24px;height:24px}
.m4b-esp{width:44px;flex:none}
.m4b-bas{margin:0 auto;display:flex;border-radius:999px;background:var(--bas)}
.m4b-bas button{height:44px;display:flex;align-items:center;gap:5px;padding:0 13px;border-radius:999px;font-size:14px;font-weight:700;color:var(--mut)}
.m4b-bas button.on{background:var(--on);color:var(--ink)}
.m4b-bas button.on.ia{color:var(--ia)}
.m4b-bas i{width:7px;height:7px;border-radius:50%;background:var(--ia);display:inline-block}
.m4b-bas i.att{background:var(--att)}
.edition-seule{display:none}
body.edite .edition-seule{display:grid}
body.edite .hors-edition{display:none}
#defil{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;position:relative}
/* la note */
.m4b-titre{font-size:20px;font-weight:800;padding:6px 22px 0;line-height:1.3;outline:none;word-break:break-word}
.m4b-titre[contenteditable]:empty:before{content:"Titre";color:var(--mut)}
.m4b-meta{font-size:14px;color:var(--mut);padding:4px 22px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.m4b-meta .sep{width:1px;height:14px;background:var(--line)}
.m4b-meta .ia{color:var(--ia)}
.m4b-meta .att{color:var(--att);font-weight:700}
.m4b-doc{padding:0 22px 96px;font-size:16px;line-height:1.75;outline:none;caret-color:var(--car);min-height:60%;word-break:break-word}
.m4b-doc > div,.m4b-doc > p{margin:0;min-height:1.75em}
.m4b-doc.vide:before{content:"Écris ici…";color:var(--mut);position:absolute;pointer-events:none}
.m4b-doc a{color:var(--fin);text-decoration:underline;text-underline-offset:4px}
.m4b-doc img{display:block;max-width:100%;max-height:260px;border-radius:12px;margin:6px 0 8px;object-fit:cover}
.m4b-doc .surl{background:var(--surl);border-radius:5px;box-shadow:0 0 0 5px var(--surl);margin:6px 0}
.m4b-doc .cb{display:inline-grid;place-items:center;width:20px;height:20px;border:2px solid var(--mut);border-radius:6px;vertical-align:-4px;margin-right:8px;cursor:pointer;font-size:14px;line-height:1;font-weight:800;color:var(--sur-plein)}
.m4b-doc .cb[data-c="1"]{background:var(--ok);border-color:var(--ok)}
.m4b-doc .cb[data-c="1"]:after{content:"✓"}
.m4b-doc div:has(> .cb[data-c="1"]){color:var(--mut);text-decoration:line-through}
::highlight(lu){text-decoration:underline;text-decoration-color:var(--ia);text-decoration-thickness:1.5px}
/* bulle d'un mot lu ou d'un lien */
.m4b-bulle{position:absolute;background:var(--on);border-radius:12px;padding:0 4px 0 12px;font-size:14px;line-height:1.3;display:flex;gap:10px;align-items:center;box-shadow:0 6px 20px var(--ombre);z-index:6;max-width:330px}
.m4b-bulle b{color:var(--att)}
.m4b-bulle .go{height:44px;display:flex;align-items:center;gap:4px;color:var(--ia);font-weight:700;padding:0 8px;border-left:1px solid var(--line);text-decoration:none}
.m4b-bulle .go svg{width:16px;height:16px}
.m4b-bulle:after{content:"";position:absolute;top:-6px;left:var(--fl,40px);width:12px;height:12px;background:var(--on);transform:rotate(45deg)}
/* outils au-dessus du clavier */
.m4b-outils{min-height:54px;flex:none;border-top:1px solid var(--bord);background:var(--barre);display:flex;align-items:center;justify-content:space-around;padding:0 4px env(safe-area-inset-bottom);position:relative}
.m4b-o{width:44px;height:44px;display:grid;place-items:center;color:var(--ink);opacity:.88;border-radius:12px}
.m4b-o svg{width:25px;height:25px}
.m4b-o.iao{color:var(--ia);opacity:1}
.m4b-o.on{background:var(--on);opacity:1}
.m4b-o.ecoute{background:var(--iabg);color:var(--ia);opacity:1}
.m4b-lit{height:44px;flex:1;margin:0 4px;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:0 10px;border-radius:12px;background:var(--iabg);color:var(--ia);font-size:14px;font-weight:700;min-width:0}
.m4b-lit span{display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden}
.m4b-lit svg{width:16px;height:16px}
.m4b-lit .bar{height:3px;border-radius:2px;background:color-mix(in srgb,var(--ia) 25%,transparent);overflow:hidden;position:relative}
.m4b-lit .bar i{position:absolute;top:0;bottom:0;width:40%;background:var(--ia);animation:m4b-va 1.4s ease-in-out infinite}
@keyframes m4b-va{0%{left:-40%}100%{left:100%}}
@media (prefers-reduced-motion:reduce){.m4b-lit .bar i{animation:none;left:0;width:58%}}
.m4b-lit.att{background:var(--attbg);color:var(--att)}
.m4b-txtbtn{height:44px;display:flex;align-items:center;padding:0 10px;font-size:14px;font-weight:700;color:var(--ink);border:1.5px solid var(--line);border-radius:12px;white-space:nowrap}
.m4b-txtbtn.att{color:var(--att);border-color:var(--att)}
.m4b-dicte{position:absolute;left:12px;right:12px;bottom:62px;background:var(--pop);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--mut);display:flex;gap:8px;align-items:center;box-shadow:0 6px 20px var(--ombre);z-index:3}
.m4b-dicte svg{width:18px;height:18px;color:var(--ia)}
/* menu de l'IA */
.m4b-voile-menu{position:absolute;inset:0;z-index:7}
.m4b-menu{position:absolute;left:10px;bottom:64px;width:300px;background:var(--pop);border-radius:16px;padding:6px;box-shadow:0 10px 30px var(--ombre);z-index:8}
.m4b-mi{display:flex;gap:12px;align-items:center;min-height:58px;padding:6px 10px;border-radius:12px;line-height:1.25;width:100%;text-align:left}
.m4b-mi+.m4b-mi{border-top:1px solid var(--s2)}
.m4b-mi svg{width:22px;height:22px;color:var(--ia)}
.m4b-mi b{display:block;font-weight:700}
.m4b-mi small{display:block;font-size:14px;color:var(--mut)}
.m4b-retour{position:absolute;left:50%;transform:translateX(-50%);bottom:66px;height:44px;display:flex;align-items:center;gap:6px;padding:0 16px;border-radius:999px;background:var(--on);color:var(--ia);font-size:14px;font-weight:700;box-shadow:0 6px 18px var(--ombre);white-space:nowrap;z-index:5;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.m4b-retour svg{width:18px;height:18px}
.m4b-toast{position:absolute;left:50%;transform:translateX(-50%);bottom:72px;background:var(--on);color:var(--ink);padding:10px 14px;border-radius:12px;font-size:14px;box-shadow:0 6px 18px var(--ombre);z-index:9;max-width:92%}
/* Organisé : la vue de l'IA */
.m4b-org{padding:0 14px 24px}
.m4b-org .m4b-titre,.m4b-org .m4b-meta{padding-left:8px;padding-right:8px}
.m4b-org .m4b-meta{padding-bottom:4px}
.m4b-range{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ia);font-weight:700;margin:0 0 6px 8px;min-height:44px;flex-wrap:wrap}
.m4b-range > svg{width:15px;height:15px}
.m4b-range .m4b-btn{margin-left:auto}
.m4b-range .lien{color:var(--ia);font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:44px}
.m4b-range.ok{color:var(--ok)}
.m4b-chg{margin-left:auto;display:flex;align-items:center;gap:5px;height:44px;padding:0 12px;border-radius:999px;border:1px solid color-mix(in srgb,var(--ia) 45%,var(--bg));color:var(--ia);font-size:14px;font-weight:700}
.m4b-chg svg{width:15px;height:15px}
.m4b-frise{display:flex;align-items:center;margin:2px 0 10px}
.m4b-frise i{flex:1;height:4px;background:var(--line);min-width:6px}
.m4b-frise i.f{background:var(--fin)}
.m4b-frise b{font-size:14px;color:var(--mut);font-weight:700;padding:0 3px;white-space:nowrap}
.m4b-frise b.fait{color:var(--fin)}
.m4b-frise b.ici{background:var(--fin);color:var(--sur-plein);border-radius:999px;padding:3px 10px}
.m4b-frise b.ici.ok{background:var(--ok)}
.m4b-frise button.prop{border:1.5px dashed var(--ia);color:var(--ia);border-radius:999px;display:flex;align-items:center;gap:6px;height:44px;padding:0 10px 0 6px;font-size:14px;font-weight:700;white-space:nowrap}
.m4b-frise button.prop i{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--ia);background:transparent;min-width:0}
.m4b-fnote{font-size:14px;color:var(--mut);margin:-4px 0 10px;text-align:center}
.m4b-k{font-size:14px;font-weight:700;color:var(--mut);margin:0 4px 6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.m4b-src{font-size:14px;color:var(--mut)}
.m4b-src q{color:var(--ink)}
.m4b-r{width:15px;height:15px;color:var(--ia);vertical-align:-3px;margin-left:3px}
.m4b-tag{font-size:14px;font-weight:700;border-radius:6px;padding:0 6px;white-space:nowrap}
.m4b-tag.app{background:var(--s2);color:var(--ink);border:1px solid var(--line)}
.m4b-tag.ia{background:var(--iabg);color:var(--ia)}
.m4b-tag.ok{background:var(--okbg);color:var(--ok)}
.m4b-pistes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.m4b-p{border-radius:14px;padding:9px 10px;display:grid;grid-template-columns:30px 1fr;gap:2px 8px;align-items:center;line-height:1.2;min-height:64px;text-align:left;width:100%}
.m4b-p .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;grid-row:span 2}
.m4b-p .v{font-weight:700}
.m4b-p.oui{background:var(--okbg)}.m4b-p.oui .ic{background:var(--ok);color:var(--sur-plein)}
.m4b-p.q{background:var(--attbg)}.m4b-p.q .ic{color:var(--att);border:2px solid var(--att)}
.m4b-p.q .v{color:var(--att)}
.m4b-bloc{background:var(--card);border-radius:14px;padding:2px 12px;margin-bottom:10px}
.m4b-bloc.prop{border:1.5px dashed color-mix(in srgb,var(--ia) 70%,var(--bg))}
.m4b-bhead{display:flex;align-items:center;gap:8px;min-height:44px;border-bottom:1px solid var(--s2);font-weight:700}
.m4b-bhead .t{flex:1}
.m4b-opt{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--s2);min-height:44px;width:100%;text-align:left}
.m4b-opt:last-child{border-bottom:0}
.m4b-opt .t{font-weight:700;line-height:1.2}
.m4b-opt .m{font-size:14px;color:var(--mut);display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center}
.m4b-opt .m b{color:var(--ink)}
.m4b-opt .m b.cout{font-size:16px;font-weight:800;background:var(--s2);border-radius:999px;padding:1px 10px}
.m4b-opt .t,.m4b-p .v,.m4b-tache .t{font-size:17px}
.m4b-opt .btn{grid-row:span 2}
.m4b-opt.seule{grid-template-columns:1fr}
.m4b-conseille{font-size:14px;font-weight:700;color:var(--ia);background:var(--iabg);border-radius:6px;padding:0 6px}
.m4b-btn{height:44px;min-width:44px;border-radius:11px;border:1.5px solid var(--ink);background:transparent;font:inherit;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:0 12px;color:var(--ink);white-space:nowrap}
.m4b-btn.plein{background:var(--ink);color:var(--sur-plein)}
.m4b-btn.doux{border-color:var(--line);color:var(--mut)}
.m4b-btn svg{width:16px;height:16px}
.m4b-case{width:44px;height:44px;display:grid;place-items:center;flex:none;margin-right:-8px}
.m4b-case i{width:28px;height:28px;border-radius:8px;border:2px solid var(--ia)}
.m4b-tache{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:8px 10px 8px 12px;display:grid;grid-template-columns:26px 1fr auto;gap:2px 10px;align-items:center;margin-bottom:8px}
.m4b-tache.prop{border:1.5px dashed color-mix(in srgb,var(--ia) 70%,var(--bg))}
.m4b-tache .c{width:24px;height:24px;border:2px solid var(--ink);border-radius:7px;grid-row:span 2;display:grid;place-items:center;position:relative}
.m4b-tache .c:before{content:"";position:absolute;inset:-10px}
.m4b-tache .t{font-weight:700;line-height:1.2}
.m4b-tache .m{font-size:14px;color:var(--mut);display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center}
.m4b-tache .btn{grid-row:span 2}
.m4b-tache.faite{background:var(--okbg);border-color:transparent}
.m4b-tache.faite .c{background:var(--ok);border-color:var(--ok);color:var(--sur-plein)}
.m4b-tache.faite .t{color:var(--ok)}
.m4b-tache > svg{width:22px;height:22px;color:var(--ia);grid-row:span 2}
.m4b-conseil{background:var(--iabg);border-left:4px solid var(--ia);border-radius:6px 14px 14px 6px;padding:8px 12px;display:flex;gap:8px;line-height:1.35;margin-bottom:10px}
.m4b-conseil > svg{width:17px;height:17px;color:var(--ia);margin-top:2px}
.m4b-conseil small{display:block;font-size:14px;color:var(--mut);margin-top:2px}
.m4b-carte{background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:10px;line-height:1.35}
.m4b-carte.ok{background:var(--okbg)}
.m4b-carte.prop{border:1.5px dashed var(--ia)}
.m4b-carte h3{margin:0 0 4px;font-size:16px;font-weight:800;display:flex;gap:6px;align-items:center}
.m4b-carte h3 svg{width:18px;height:18px}
.m4b-cite{border-left:3px solid var(--ink);padding:2px 0 2px 9px;margin:6px 0;font-weight:600;display:block;text-align:left;width:100%}
.m4b-cite .m4b-src{display:flex;font-weight:400;align-items:center}
.m4b-ligne{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--s2);width:100%;text-align:left}
.m4b-ligne:first-child{border-top:0}
.m4b-ligne .tx{flex:1}
.m4b-hl{border-radius:12px;padding:8px 10px;display:flex;gap:8px;align-items:center;font-weight:700;line-height:1.3;margin:0 0 10px}
.m4b-hl > svg{width:20px;height:20px;align-self:flex-start;margin-top:1px}
.m4b-hl .t{flex:1}
.m4b-hl small{display:block;font-size:14px;font-weight:600;color:var(--ink)}
.m4b-hl.bad{background:var(--badbg);color:var(--bad)}
.m4b-lit-org{margin:0 8px 10px}
.m4b-vide{color:var(--mut);margin:6px 8px 12px;line-height:1.4}
.m4b-actions{display:flex;gap:8px;margin-top:10px}
.m4b-actions .m4b-btn{flex:1}
.m4b-cmp{display:grid;background:var(--card);border-radius:14px;padding:4px 10px;margin-bottom:10px;font-size:14px;line-height:1.25}
.m4b-cmp > *{padding:8px 4px;border-bottom:1px solid var(--s2);min-width:0;overflow-wrap:anywhere}
.m4b-cmp .hd{font-weight:800;font-size:16px;text-align:left;min-height:44px}
.m4b-cmp .hd small{display:block;font-size:14px;font-weight:700;color:var(--ok)}
.m4b-cmp .cr{color:var(--mut)}
.m4b-cmp .v{font-weight:600}
.m4b-cmp .v small{color:var(--ia);font-weight:700}
.m4b-cmp .v.win{background:var(--okbg);color:var(--ok);border-radius:8px}
.m4b-cmp .v.inc{color:var(--mut);font-weight:400}
/* pied d'Organisé : pas de champ, on écrit dans Mes notes */
.m4b-pied{flex:none;border-top:1px solid var(--bord);padding:8px 14px calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;background:var(--barre)}
.m4b-pied .m4b-btn{flex:1}
/* feuilles */
.m4b-voile{position:absolute;inset:0;background:var(--voile);z-index:10}
.m4b-feuille{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--feuille);border-radius:20px 20px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));z-index:11}
.m4b-poig{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.m4b-feuille h2{font-size:20px;margin:0;display:flex;align-items:center;gap:6px}
.m4b-feuille h2 svg{width:20px;height:20px;color:var(--ia)}
.m4b-feuille .sous{font-size:14px;color:var(--mut);margin:2px 0 6px}
.m4b-feuille .grp{font-size:14px;font-weight:700;color:var(--mut);margin:8px 0 0}
.m4b-ch{display:flex;gap:10px;align-items:center;min-height:50px;border-bottom:1px solid var(--s2)}
.m4b-ch .t{flex:1;line-height:1.25;min-width:0}
.m4b-ch .t small{display:block;font-size:14px;color:var(--mut)}
.m4b-ch.off .t{color:var(--mut)}
.m4b-ch.off .t small{color:var(--bad);font-weight:700}
.m4b-ch .s{height:44px;display:flex;align-items:center;gap:3px;font-size:14px;color:var(--mut);max-width:132px;min-width:0}
