<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M3 · L'IA écrit dans la marge · correction 1 · 25.11</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* M3, correction 1 : page de carnet ; ses lignes à gauche, jamais touchées ; l'IA écrit dans la marge de droite
   (encre violette) et, quand il faut comparer ou décider, en bas de page. Ce que l'app lit seule reste gris, « lu par l'app ».
   Tout ce que l'IA propose (état, tâche, liste) attend son toucher. Annuler : la feuille « Changé par l'IA » (greffe M2). */
:root{--bg:#fff;--pap:#fbfaf7;--line:#ddd;--regle:#e6e0d4;--mut:#5f5f5f;--ink:#111;--ia:#6a4fb0;--ok:#3f6b2e;--bad:#a8291f;--fin:#1f64a3;--prod:#9a4f1e;
--marg:color-mix(in srgb,var(--prod) 40%,var(--pap));--iabg:color-mix(in srgb,var(--ia) 9%,var(--bg));--iabd:color-mix(in srgb,var(--ia) 38%,var(--bg));
--okbg:color-mix(in srgb,var(--ok) 11%,var(--bg));--badbg:color-mix(in srgb,var(--bad) 9%,var(--bg));--finbg:color-mix(in srgb,var(--fin) 11%,var(--bg))}
*{box-sizing:border-box}
body{margin:0;background:#d9d6d2;font:16px/1.375 "Source Sans 3",system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);display:flex;flex-wrap:wrap;gap:28px 24px;padding:24px}
figure{margin:0}
figcaption{font-weight:700;font-size:15px;margin:0 0 8px;color:#333}
button{font:inherit;cursor:pointer}
.m3-ecran{width:390px;height:844px;background:var(--pap);display:flex;flex-direction:column;position:relative;overflow:hidden}

/* en-tête */
.m3-haut{height:48px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px 0 2px;background:var(--bg);border-bottom:1px solid var(--line)}
.m3-ret{display:flex;align-items:center;gap:2px;height:44px;padding:0 6px 0 2px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.m3-ret svg{width:22px;height:22px;flex:none}
.m3-dom{display:flex;align-items:center;gap:4px;color:var(--mut);font-size:15px}
.m3-dom svg{width:18px;height:18px;color:var(--prod)}
.m3-sp{flex:1}
.m3-chg{display:flex;align-items:center;gap:4px;height:44px;padding:0 10px;border-radius:22px;color:var(--ia);font-weight:700;font-size:15px;border:0;background:none}
.m3-chg svg{width:18px;height:18px}
.m3-hl{display:flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:999px;background:#ecebe8;color:#333;font-size:14px;font-weight:700}
.m3-hl svg{width:18px;height:18px}

/* frise d'état (greffe M4) */
.m3-frise{flex:none;display:flex;gap:4px;padding:6px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.m3-frise span{flex:1;height:32px;display:grid;place-items:center;border-radius:8px;font-size:14px;font-weight:700;color:var(--mut);background:#f1efeb;white-space:nowrap}
.m3-frise .f{background:#e2e0dc;color:var(--ink)}
.m3-frise .c{background:var(--ink);color:#fff}
.m3-frise .p{outline:2px dashed var(--ia);outline-offset:-2px;color:var(--ia);background:var(--iabg)}
.m3-frise .s{box-shadow:0 0 0 3px var(--ia)}

/* page réglée : 28 px par ligne, partout */
.m3-defile{flex:1;position:relative;overflow:hidden}
.m3-page{position:relative;min-height:100%;background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--regle) 27px 28px)}
.m3-page::before{content:"";position:absolute;top:0;bottom:0;left:220px;width:2px;background:var(--marg)}
.m3-l{display:grid;grid-template-columns:24px 196px 170px;line-height:28px;position:relative}
.m3-l .n{font-size:13px;color:#7a7a7a;text-align:right;padding-right:3px}
.m3-l .t{padding:0 10px 0 5px}
.m3-l .m{padding:0 6px 0 12px;font-size:15px;font-weight:600;color:var(--ia);line-height:28px}
.m3-l .m span{display:block}
.m3-titre .t{grid-column:1/4;padding-left:29px;position:relative;z-index:1}
.m3-titre .t,.m3-jetons{background-color:var(--pap);background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--regle) 27px 28px)}
.m3-jlab{font-size:13px;font-weight:700;color:#444;align-self:center;margin-right:2px}
.m3-prop.l{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 10px;margin:4px 8px 0;position:relative;z-index:1}
.m3-prop.l .v{flex:1;font-size:15px;font-weight:600;line-height:1.25;margin:0;color:var(--ink)}
.m3-prop.l .v b{color:var(--ia)}
.m3-prop.l button{height:44px;border-radius:10px;font-weight:700;padding:0 12px}
.m3-prop.l .o{background:var(--ink);color:#fff;border:0}
.m3-prop.l .n{background:var(--bg);color:var(--ink);border:1.5px solid var(--ink)}
.m3-titre .t{font-size:24px;font-weight:800;padding-top:24px;line-height:32px}
.m3-titre .m{padding-top:28px;color:var(--mut);font-weight:600}
.m3-g{color:var(--mut)!important}
.m3-ok{color:var(--ok)!important}.m3-ko{color:var(--bad)!important}
.m3-x{text-decoration:line-through;color:var(--mut)!important;font-weight:400}
.m3-surl{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--ia) 20%,transparent) 60%)}
.m3-accol{border-left:3px solid var(--ia);margin-left:-9px;padding-left:6px}
.m3-let{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:2px solid var(--ia);font-size:13px;font-weight:800;vertical-align:1px;margin-right:4px;line-height:1}
.m3-let.plein{background:var(--ia);color:#fff}
.m3-vide{color:color-mix(in srgb,var(--ia) 55%,var(--pap))!important;font-weight:600;font-style:italic}
.m3-att{color:#333!important;display:flex!important;align-items:center;gap:4px}
.m3-att svg{width:16px;height:16px;flex:none}

/* jetons sous le titre : la vue d'ensemble */
.m3-jetons{display:flex;flex-wrap:wrap;gap:4px 6px;padding:2px 10px 2px 29px;position:relative;z-index:1}
.m3-j{height:24px;display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:6px;font-size:14px;font-weight:700;white-space:nowrap}
.m3-j.ok{background:var(--okbg);color:var(--ok)}
.m3-j.ko{background:repeating-linear-gradient(135deg,var(--badbg) 0 6px,var(--bg) 6px 9px);color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 30%,var(--bg))}
.m3-j.ia{background:var(--iabg);color:var(--ia);border:1px solid var(--iabd)}
.m3-j.app{background:var(--bg);color:#444;border:1.5px dashed #9a9a9a}

/* pièces jointes */
.m3-photo{display:flex;align-items:center;gap:8px;height:56px}
.m3-vign{width:64px;height:48px;border-radius:6px;flex:none;background:radial-gradient(ellipse 22px 9px at 34px 32px,#7fa0b8 0 70%,transparent 75%),radial-gradient(circle 6px at 34px 30px,#3c3c3c 0 80%,transparent 90%),linear-gradient(160deg,#b9b4aa,#8d877d);border:1px solid #777}
.m3-vign.s{width:28px;height:28px;border-radius:5px;background:radial-gradient(ellipse 10px 4px at 15px 18px,#7fa0b8 0 70%,transparent 75%),linear-gradient(160deg,#b9b4aa,#8d877d)}
.m3-l .m .m3-photo{display:flex;gap:6px;line-height:1.15;font-size:14px}
.m3-photo small{font-size:13px;color:var(--mut)}
.m3-lienp{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:6px;background:var(--finbg);color:var(--fin);font-size:14px;font-weight:700;vertical-align:middle}
.m3-lienp svg{width:15px;height:15px}

/* bas de page de l'IA : comparer, décider */
.m3-pied{position:relative;z-index:1;margin:6px 8px 8px;background:var(--bg);border:1.5px solid var(--iabd);border-radius:14px;padding:8px 10px 10px}
.m3-ph{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--ia);margin-bottom:2px}
.m3-ph svg{width:16px;height:16px}
.m3-ph .m3-sp{flex:1}
.m3-ph small{font-weight:600;color:var(--mut);font-size:13px}
.m3-opt{display:grid;grid-template-columns:30px 1fr auto;gap:0 6px;align-items:center;padding:6px 0;border-top:1px solid #eeeae4}
.m3-opt:first-of-type{border-top:0}
.m3-opt b{display:block;line-height:1.2}
.m3-opt .d{font-size:14px;color:var(--mut);line-height:1.25}
.m3-conseil{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--ia);border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:2px}
.m3-ret2{height:44px;min-width:76px;border-radius:10px;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);font-weight:700;padding:0 10px}
.m3-ret2.on{background:var(--ink);color:#fff}
.m3-prop{border:1.5px dashed var(--ia);background:var(--iabg);border-radius:12px;padding:7px 10px 8px;margin-top:8px}
.m3-prop .k{font-size:13px;font-weight:800;color:var(--ia);display:flex;align-items:center;gap:4px}
.m3-prop .k svg{width:14px;height:14px}
.m3-prop .v{font-weight:700;line-height:1.25;margin:2px 0}
.m3-prop .d{font-size:14px;color:#444;line-height:1.3}
.m3-bt{display:flex;gap:8px;margin-top:6px}
.m3-bt button{height:44px;border-radius:10px;font-weight:700;padding:0 16px}
.m3-bt .o{background:var(--ink);color:#fff;border:0;flex:1}
.m3-bt .n{background:var(--bg);color:var(--ink);border:1.5px solid var(--ink)}
.m3-tache{display:flex;align-items:center;gap:8px;min-height:48px;border-top:1px solid #eeeae4;padding-top:4px;margin-top:6px}
.m3-case{width:26px;height:26px;border:2px solid var(--ink);border-radius:6px;flex:none;display:grid;place-items:center;font-weight:800}
.m3-case.fait{background:var(--ok);border-color:var(--ok);color:#fff}
.m3-tache .x{flex:1;line-height:1.25}
.m3-tache .x small{display:block;font-size:13px;color:var(--mut)}
.m3-quand{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;padding:0 12px;color:var(--ink)}
.m3-si{font-size:14px;color:#333;line-height:1.35;margin-top:6px;padding-left:10px;border-left:3px solid #cfcac2}
.m3-cite{font-style:italic;color:var(--ink)}
.m3-pq{line-height:1.35;margin:2px 0 0}
.m3-pq li{margin:3px 0}
.m3-pq{padding-left:0;list-style:none}
.m3-pq .nn{display:inline-block;min-width:44px;font-size:13px;color:var(--ia);font-weight:700}
.m3-tab{width:100%;border-collapse:collapse;font-size:15px;margin-top:2px}
.m3-tab td{padding:6px 4px;border-top:1px solid #eeeae4;line-height:1.2}
.m3-tab td.p{text-align:right;font-weight:700;white-space:nowrap}
.m3-tab .q{font-size:13px;color:var(--bad);font-weight:700}

/* bande au-dessus du champ */
.m3-trace{flex:none;height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--iabg);color:var(--ia);font-size:15px;font-weight:700;border-top:1px solid var(--iabd)}
.m3-trace svg{width:18px;height:18px;flex:none}
.m3-trace .m3-sp{flex:1}
.m3-trace u{text-underline-offset:3px}
.m3-trace.hl{background:#ecebe8;color:#222;border-top-color:#cfcac2;font-weight:600}
.m3-trace.colle{background:var(--bg);border-top:1px solid var(--line);color:var(--mut);font-weight:600}
.m3-cl{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;background:var(--finbg);color:var(--fin);font-weight:700}
.m3-cl svg{width:18px;height:18px}

/* le champ : une ligne au repos, photo, micro, envoi toujours actifs */
.m3-barre{flex:none;display:flex;gap:6px;align-items:center;padding:6px 8px 8px;background:var(--bg);border-top:1px solid var(--line)}
.m3-o{width:44px;height:44px;border-radius:12px;background:#f2f0ec;display:grid;place-items:center;flex:none;color:var(--ink)}
.m3-o svg{width:24px;height:24px}
.m3-champ{flex:1;min-width:0;height:44px;border:1.5px solid #c9c5be;border-radius:22px;padding:0 12px;display:flex;align-items:center;gap:6px;color:var(--mut);white-space:nowrap;overflow:hidden}
.m3-champ span{overflow:hidden;text-overflow:ellipsis}
.m3-champ.plein{color:var(--ink);border-color:var(--ink);padding:6px 12px 6px 8px;height:auto;min-height:44px;white-space:normal;border-radius:18px;line-height:1.25}
.m3-champ.plein span{overflow:visible}
.m3-envoi{height:44px;border-radius:22px;border:0;background:var(--ia);color:#fff;font-weight:800;padding:0 12px 0 10px;display:flex;align-items:center;gap:4px;flex:none}
.m3-envoi svg{width:20px;height:20px}
.m3-envoi.att{background:#e6e4e0;color:#333}

/* feuille « Changé par l'IA » (greffe M2) */
.m3-voile{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:3}
.m3-feuille{position:absolute;left:0;right:0;bottom:0;z-index:4;background:var(--bg);border-radius:18px 18px 0 0;padding:8px 14px 14px}
.m3-poig{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.m3-feuille h2{font-size:18px;margin:0;display:flex;align-items:center;gap:6px}
.m3-feuille h2 svg{width:18px;height:18px;color:var(--ia)}
.m3-feuille .sous{font-size:14px;color:var(--mut);margin:2px 0 4px}
.m3-ch{display:flex;gap:8px;align-items:center;min-height:48px;padding:4px 0;border-top:1px solid #eeeae4}
.m3-ch .c{width:44px;height:44px;display:grid;place-items:center;flex:none;margin-left:-8px}
.m3-ch .c i{width:26px;height:26px;border-radius:7px;border:2px solid var(--ia);display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff;background:var(--ia)}
.m3-ch.off .c i{background:var(--bg);color:transparent}
.m3-ch .t{flex:1;line-height:1.25}
.m3-ch .t small{display:block;font-size:14px;color:#333}
.m3-ch .s{font-size:14px;color:var(--mut);white-space:nowrap}
.m3-actions{display:flex;gap:8px;margin-top:10px}
.m3-actions button{flex:1;height:46px;border-radius:12px;font-weight:800}
.m3-actions .a{background:var(--bg);border:1.5px solid var(--ink);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px}
.m3-actions .a svg{width:18px;height:18px}
.m3-actions .b{background:var(--ink);border:0;color:#fff}
.m3-fondu{position:absolute;left:0;right:0;top:0;height:14px;background:linear-gradient(var(--pap),transparent);z-index:2}
</style>
</head>

<!-- 1. Noté : ses notes brutes, la marge vide ; la note 6 et une photo dans le champ ; le lien du presse-papiers proposé. -->

<!-- 2. L'IA a annoté : marge violette, jetons sous le titre, correction de « à acheter », lien et photo rangés ; l'état est PROPOSÉ. -->
<figure><figcaption>2 · L’IA range : elle annote la marge</figcaption>
<section class="m3-ecran" id="range">
  <div class="m3-haut"><span class="m3-ret"><svg><use href="#m3-retour"/></svg>Carnets</span><span class="m3-dom"><svg><use href="#m3-maison"/></svg>Local · 24 nov.</span><span class="m3-sp"></span><button class="m3-chg"><svg><use href="#m3-annule"/></svg>Changé</button></div>
