<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M3 · L'IA écrit dans la marge · correction 2 · 25.11</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* M3, correction 2 : page de carnet ; ses lignes à gauche (16 px sur 232 px), jamais touchées ni déplacées ; l'IA écrit
   dans la marge de droite (140 px, encre violette, sans gras) et, pour comparer ou décider, en bas de page.
   Jetons collés sous la frise, visibles au défilement. Ce que l'app lit seule reste gris, « lu par l'app ».
   Tout ce que l'IA propose attend son toucher. Trois tailles de texte : 14, 16, 24. Un seul bouton plein par écran.
   Les options gardent leur lettre ET un nom court (Ⓐ joint, toi-même). Une piste non vérifiée reste « ? à vérifier ». */
:root{--bg:#fff;--pap:#fbfaf7;--line:#ddd;--regle:#e6e0d4;--mut:#5f5f5f;--ink:#111;--ia:#6a4fb0;--ok:#3f6b2e;--q:#7a5510;--fin:#1f64a3;--prod:#9a4f1e;
--marg:color-mix(in srgb,var(--prod) 40%,var(--pap));--iabg:color-mix(in srgb,var(--ia) 9%,var(--bg));--iabd:color-mix(in srgb,var(--ia) 38%,var(--bg));
--okbg:color-mix(in srgb,var(--ok) 11%,var(--bg));--qbg:color-mix(in srgb,#c08a1e 15%,var(--bg));--finbg:color-mix(in srgb,var(--fin) 11%,var(--bg))}
*{box-sizing:border-box}
body{margin:0;background:#d9d6d2;font:16px/1.375 "Source Sans 3",system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);display:flex;flex-wrap:wrap;gap:28px 24px;padding:24px}
figure{margin:0}
figcaption{font-weight:700;font-size:16px;margin:0 0 8px;color:#333}
button{font:inherit;cursor:pointer}
.m3-ecran{width:390px;height:844px;background:var(--pap);display:flex;flex-direction:column;position:relative;overflow:hidden}

/* en-tête : un seul accès aux changements, « Changé », ici */
.m3-haut{height:48px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px 0 2px;background:var(--bg)}
.m3-ret{display:flex;align-items:center;gap:2px;height:44px;padding:0 6px 0 2px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.m3-ret svg{width:22px;height:22px;flex:none}
.m3-dom{display:flex;align-items:center;gap:4px;color:var(--mut);font-size:14px;white-space:nowrap}
.m3-dom svg{width:18px;height:18px;color:var(--prod)}
.m3-sp{flex:1}
.m3-chg{display:flex;align-items:center;gap:4px;height:44px;padding:0 10px;border-radius:22px;color:var(--ia);font-weight:700;border:0;background:none}
.m3-chg svg{width:18px;height:18px}
.m3-hl{display:flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:999px;background:#ecebe8;color:#333;font-size:14px;font-weight:700}
.m3-hl svg{width:18px;height:18px}

/* tête collée : frise d'état (ses 4 états, toujours) puis jetons ; reste visible quand la page défile */
.m3-tete{flex:none;background:var(--bg);border-bottom:1px solid var(--line);position:relative;z-index:2}
.m3-frise{display:flex;gap:4px;padding:2px 10px 6px}
.m3-frise span{flex:1;height:32px;display:grid;place-items:center;border-radius:8px;font-size:14px;font-weight:700;color:var(--mut);background:#f1efeb;white-space:nowrap}
.m3-frise .f{background:#e2e0dc;color:var(--ink)}
.m3-frise .c{background:var(--ink);color:#fff}
.m3-frise .p{outline:2px dashed var(--ia);outline-offset:-2px;color:var(--ia);background:var(--iabg)}
.m3-jetons{display:flex;flex-wrap:wrap;gap:4px 6px;padding:0 10px 8px}
.m3-j{height:26px;display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:6px;font-size:14px;font-weight:700;white-space:nowrap}
.m3-j.ok{background:var(--okbg);color:var(--ok)}
.m3-j.q{background:var(--qbg);color:var(--q)}
.m3-j.ia{background:var(--iabg);color:var(--ia);border:1px solid var(--iabd)}
.m3-j.app{background:var(--bg);color:#444;border:1.5px dashed #9a9a9a}
.m3-jlab{font-size:14px;font-weight:700;color:#444;height:26px;display:inline-flex;align-items:center}
.m3-jia{font-size:14px;font-weight:700;color:var(--ia);height:26px;display:inline-flex;align-items:center;gap:6px}
.m3-jia svg{width:16px;height:16px}

/* page réglée : 28 px par ligne, partout */
.m3-defile{flex:1;position:relative;overflow:hidden}
.m3-page{position:relative;min-height:100%;background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--regle) 27px 28px)}
.m3-page::before{content:"";position:absolute;top:0;bottom:0;left:250px;width:2px;background:var(--marg)}
.m3-l{display:grid;grid-template-columns:18px 232px 140px;line-height:28px;position:relative}
.m3-l .n{font-size:14px;color:#7a7a7a;text-align:right;padding-right:2px}
.m3-l .t{padding:0 8px 0 4px}
.m3-l .m{padding:0 6px 0 10px;font-size:14px;font-weight:400;color:var(--ia);line-height:28px}
.m3-l .m>span,.m3-l .m .m3-accol>span{display:block}
.m3-titre{height:56px;background:var(--pap);position:relative;z-index:1;display:flex;align-items:center;padding-left:22px;font-size:24px;font-weight:800;border-bottom:1px solid var(--regle)}
.m3-g{color:var(--mut)!important}
.m3-ok{color:var(--ok)!important}
.m3-qq{color:var(--q)!important}
.m3-x{text-decoration:line-through;color:var(--mut)!important}
.m3-surl{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--ia) 20%,transparent) 60%)}
.m3-accol{border-left:3px solid var(--ia);margin-left:-9px;padding-left:6px}
.m3-let{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:2px solid var(--ia);font-size:14px;font-weight:700;font-style:normal;vertical-align:middle;margin-right:4px;line-height:1;color:var(--ia)}
.m3-let.plein{background:var(--ia);color:#fff}
.m3-vide{color:color-mix(in srgb,var(--ia) 55%,var(--pap))!important;font-style:italic}
.m3-sk{display:inline-block;height:10px;border-radius:5px;background:color-mix(in srgb,var(--ia) 16%,var(--pap));vertical-align:middle}
.m3-att{color:#333!important;display:flex!important;align-items:center;gap:4px}
.m3-att svg{width:16px;height:16px;flex:none}
.m3-lienm{display:inline-flex!important;align-items:center;height:28px;color:var(--fin)!important;font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* pièces jointes, chez lui */
.m3-photo{display:flex;align-items:center;gap:8px;height:56px}
.m3-vign{width:64px;height:48px;border-radius:6px;flex:none;background:radial-gradient(ellipse 22px 9px at 34px 32px,#7fa0b8 0 70%,transparent 75%),radial-gradient(circle 6px at 34px 30px,#3c3c3c 0 80%,transparent 90%),linear-gradient(160deg,#b9b4aa,#8d877d);border:1px solid #777}
.m3-photo small{font-size:14px;color:var(--mut)}
.m3-lienp{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border-radius:6px;background:var(--finbg);color:var(--fin);font-size:14px;font-weight:700;vertical-align:middle}
.m3-lienp svg{width:15px;height:15px}
.m3-coller{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;border:1.5px solid var(--fin);background:var(--bg);color:var(--fin);font-weight:700;margin:-4px 0}
.m3-coller svg{width:18px;height:18px}

/* bas de page de l'IA : comparer, décider, résoudre */
.m3-pied{position:relative;z-index:1;margin:6px 8px 8px;background:var(--bg);border:1.5px solid var(--iabd);border-radius:14px;padding:8px 10px 10px}
.m3-pied.app{border:1.5px dashed #9a9a9a}
.m3-ph{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--ia);margin-bottom:2px}
.m3-pied.app .m3-ph{color:#444}
.m3-ph svg{width:16px;height:16px}
.m3-ph small{font-weight:400;color:var(--mut);font-size:14px}
.m3-opt{display:grid;grid-template-columns:30px 1fr auto;gap:0 6px;align-items:center;padding:6px 0;border-top:1px solid #eeeae4}
.m3-opt:first-of-type{border-top:0}
.m3-opt b{display:block;line-height:1.25}
.m3-opt .d{font-size:14px;color:var(--mut);line-height:1.3}
.m3-opt .d em{font-style:normal;color:var(--ia);font-weight:700}
.m3-ret2{height:44px;min-width:76px;border-radius:10px;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);font-weight:700;padding:0 10px}
.m3-ret2.plein{background:var(--ink);color:#fff}
.m3-prop{border:1.5px dashed var(--ia);background:var(--iabg);border-radius:12px;padding:7px 10px 8px;margin-top:8px}
.m3-prop .k{font-size:14px;font-weight:700;color:var(--ia);display:flex;align-items:center;gap:4px}
.m3-prop .k svg{width:14px;height:14px}
.m3-prop .v{font-weight:700;line-height:1.25;margin:2px 0}
.m3-prop .d{font-size:14px;color:#444;line-height:1.3}
.m3-propl{display:flex;align-items:center;gap:6px;border:1.5px dashed var(--ia);background:var(--iabg);border-radius:12px;padding:6px 6px 6px 10px;margin:4px 8px 0;position:relative;z-index:1}
.m3-propl .v{flex:1;font-weight:600;line-height:1.25}
.m3-propl .v b{color:var(--ia)}
.m3-bt{display:flex;gap:8px;margin-top:6px}
.m3-bt button,.m3-propl button{height:44px;border-radius:10px;font-weight:700;padding:0 14px}
.m3-bt .o,.m3-propl .o{background:var(--ink);color:#fff;border:0}
.m3-bt .o{flex:1}
.m3-bt .n,.m3-propl .n{background:var(--bg);color:var(--ink);border:1.5px solid var(--ink)}
.m3-tache{display:flex;align-items:center;gap:8px;min-height:48px;padding-top:4px}
.m3-case{width:26px;height:26px;border:2px solid var(--ink);border-radius:6px;flex:none;display:grid;place-items:center;font-weight:800}
.m3-case.fait{background:var(--ok);border-color:var(--ok);color:#fff}
.m3-tache .x{flex:1;line-height:1.25}
.m3-tache .x small{display:block;font-size:14px;color:var(--mut)}
.m3-quand{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;padding:0 12px;color:var(--ink)}
.m3-si{font-size:14px;color:#333;line-height:1.35;margin-top:6px;padding-left:10px;border-left:3px solid #cfcac2}
.m3-cite{font-style:italic;color:var(--ink)}
.m3-pq{line-height:1.35;margin:2px 0 0;padding-left:0;list-style:none}
.m3-pq li{margin:4px 0;display:flex;gap:6px}
.m3-pq .nn{flex:none;width:58px;font-size:14px;color:var(--ia);font-weight:700;padding-top:1px}
.m3-tab{width:100%;border-collapse:collapse;margin-top:2px}
.m3-tab td{padding:6px 4px;border-top:1px solid #eeeae4;line-height:1.2}
.m3-tab td.p{text-align:right;font-weight:700;white-space:nowrap}
.m3-tab .q{font-size:14px;color:var(--q);font-weight:700;white-space:nowrap}
.m3-msg{display:flex;gap:8px;align-items:flex-start;margin:6px 8px 0;padding:8px 10px;border-radius:12px;background:var(--bg);border:1.5px solid #cfcac2;line-height:1.3;position:relative;z-index:1}
.m3-msg svg{width:20px;height:20px;flex:none;margin-top:1px;color:#8a3a1e}
.m3-msg small{display:block;font-size:14px;color:var(--mut)}

/* le champ : une ligne au repos ; photo, micro, Ajouter (sans IA) et Annoter (IA) toujours actifs */
.m3-barre{flex:none;display:flex;gap:6px;align-items:flex-end;padding:6px 8px 8px;background:var(--bg);border-top:1px solid var(--line)}
.m3-o{width:44px;height:44px;border-radius:12px;background:#f2f0ec;display:grid;place-items:center;flex:none;color:var(--ink);position:relative}
.m3-o svg{width:24px;height:24px}
.m3-o.vign{background:radial-gradient(ellipse 14px 6px at 22px 28px,#7fa0b8 0 70%,transparent 75%),radial-gradient(circle 4px at 22px 26px,#3c3c3c 0 80%,transparent 90%),linear-gradient(160deg,#b9b4aa,#8d877d);border:1px solid #777}
.m3-o.vign b{position:absolute;right:-5px;top:-5px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:14px;display:grid;place-items:center;line-height:1}
.m3-champ{flex:1;min-width:0;height:44px;border:1.5px solid #c9c5be;border-radius:22px;padding:0 12px;display:flex;align-items:center;gap:6px;color:var(--mut);white-space:nowrap;overflow:hidden}
.m3-champ span{overflow:hidden;text-overflow:ellipsis}
.m3-champ.plein{color:var(--ink);border-color:var(--ink);padding:5px 4px 5px 12px;height:auto;min-height:44px;white-space:normal;border-radius:20px;line-height:1.25;align-items:flex-end}
.m3-champ.plein span{overflow:visible;flex:1;padding-bottom:5px}
.m3-ajout{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);background:var(--bg);display:grid;place-items:center;flex:none;padding:0;color:var(--ink)}
.m3-ajout svg{width:18px;height:18px}
.m3-envoi{height:44px;border-radius:22px;border:1.5px solid var(--ia);background:var(--bg);color:var(--ia);font-weight:700;padding:0 12px 0 10px;display:flex;align-items:center;gap:4px;flex:none}
.m3-envoi svg{width:20px;height:20px}
.m3-envoi.plein{background:var(--ia);color:#fff;border-color:var(--ia)}
.m3-envoi.att{border-color:#b9b5ae;color:#333}

/* feuille « Changé par l'IA » (greffe M2) */
.m3-voile{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:3}
.m3-feuille{position:absolute;left:0;right:0;bottom:0;z-index:4;background:var(--bg);border-radius:18px 18px 0 0;padding:8px 14px 14px}
.m3-poig{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 8px}
.m3-feuille h2{font-size:16px;font-weight:800;margin:0;display:flex;align-items:center;gap:6px}
.m3-feuille h2 svg{width:18px;height:18px;color:var(--ia)}
.m3-feuille .sous{font-size:14px;color:var(--mut);margin:2px 0 4px}
.m3-ch{display:flex;gap:8px;align-items:center;min-height:48px;padding:4px 0;border-top:1px solid #eeeae4}
.m3-ch .c{width:44px;height:44px;display:grid;place-items:center;flex:none;margin-left:-8px}
.m3-ch .c i{width:26px;height:26px;border-radius:7px;border:2px solid var(--ia);display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff;background:var(--ia)}
.m3-ch.off .c i{background:var(--bg);color:transparent}
.m3-ch .t{flex:1;line-height:1.25}
.m3-ch .t small{display:block;font-size:14px;color:#333}
.m3-ch .s{font-size:14px;color:var(--mut);white-space:nowrap}
.m3-actions{display:flex;gap:8px;margin-top:10px}
.m3-actions button{flex:1;height:46px;border-radius:12px;font-weight:800}
.m3-actions .a{background:var(--bg);border:1.5px solid var(--ink);color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px}
.m3-actions .a svg{width:18px;height:18px}
.m3-actions .b{background:var(--ink);border:0;color:#fff}
.m3-fondu{position:absolute;left:0;right:0;top:0;height:14px;background:linear-gradient(var(--pap),transparent);z-index:2}
</style>
</head>

<!-- 1. Noté : ses notes brutes, marge vide ; il écrit la note 6 avec une photo ; le lien copié se colle dans la page (pas de rangée en plus). -->
<figure><figcaption>1 · Noté : ses notes, marge vide</figcaption>
<section class="m3-ecran" id="note">
  <div class="m3-haut"><span class="m3-ret"><svg><use href="#m3-retour"/></svg>Carnets</span><span class="m3-dom"><svg><use href="#m3-maison"/></svg>Local · 24 nov.</span><span class="m3-sp"></span></div>
  <div class="m3-tete"><div class="m3-frise"><span class="c">Noté</span><span>Je cherche</span><span>Décidé</span><span>Résolu</span></div></div>
  <div class="m3-defile"><div class="m3-page">
    <div class="m3-titre">Écoulement qui fuit</div>
    <div class="m3-l"><div class="n">1</div><div class="t">L’écoulement au sol de la salle fuit au joint, flaque après chaque nettoyage.</div><div class="m"><span class="m3-vide">marge de l’IA</span></div></div>
    <div class="m3-l"><div class="n">2</div><div class="t">Pistes : joint du siphon trouvé usé</div><div class="m"></div></div>
    <div class="m3-l"><div class="n">3</div><div class="t">fuite sous la dalle, pas trouvée.</div><div class="m"></div></div>
    <div class="m3-l"><div class="n">4</div><div class="t">Contacter l’entreprise X (exemple) pour un sanitaire.</div><div class="m"></div></div>
    <div class="m3-l"><div class="n">5</div><div class="t">Devis attendu.</div><div class="m"></div></div>
    <div class="m3-l"><div class="n"></div><div class="t"><button class="m3-coller"><svg><use href="#m3-lien"/></svg>Coller entreprise-x.ch</button></div><div class="m"><span class="m3-g">copié à 21:25</span></div></div>
