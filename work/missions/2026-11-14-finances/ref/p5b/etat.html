<title>p5b — Prévisions : les étiquettes accrochées (p4a, chaque sortie est une étiquette posée sur sa marche, la liste repliée) — passe 4, 09.11</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--acc:#C8382F;--page:#FFFFFF;--panel:#F5F5F5;--bord:#DDDDDD;--bordm:#BFBFBF;--t2:#666666;--t1:#333333;--t0:#111111;
--fin:#1F64A3;--finc:#86B9E6;--fint:#E6EFF8;--alerte:#C8382F;--alertet:#A8291F;--alertef:#FBE9E7;--vert:#2A7347;
--brassin:#9A4F1E;--brassint:#FBEDE3;--frigo:#176878;--frigot:#E2F2F5;
--sans:"Source Sans 3",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#E9E9E9;font-family:var(--sans);font-size:14px;line-height:1.3;color:var(--t1);-webkit-font-smoothing:antialiased}
.p5b-planche{display:flex;flex-wrap:wrap;gap:24px;padding:16px;align-items:flex-start}
.p5b-fig{display:flex;flex-direction:column;gap:6px}
.p5b-cap{font-size:13px;font-weight:600;color:var(--t1);max-width:390px}
.p5b-f{width:390px;height:844px;position:relative;overflow:hidden;background:var(--page);display:flex;flex-direction:column}
@media (max-width:500px){body{background:var(--page)}.p5b-planche{display:block;padding:0}.p5b-fig{gap:0}.p5b-cap{order:2;padding:6px 10px 14px;background:#E9E9E9}}
.p5b-m{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg.p5b-i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.p5b-app{height:44px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--bord)}
.p5b-logo{width:26px;height:26px;border-radius:10px;background:var(--t0);display:flex;align-items:center;justify-content:center}
.p5b-logo svg{width:14px;height:14px;stroke:#fff}
.p5b-app b{flex:1;font-size:16px;color:var(--t0)}
.p5b-ic{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--t2)}
.p5b-rail{display:flex;height:34px;border-bottom:1px solid var(--bord)}
.p5b-rail span{flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--t2);position:relative}
.p5b-rail .p5b-on{color:var(--fin);font-weight:600}
.p5b-rail .p5b-on::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--fin)}
.p5b-nav{position:absolute;left:0;right:0;bottom:0;height:56px;border-top:1px solid var(--bord);background:var(--page);display:flex;padding-right:72px}
.p5b-nav span{flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--t2)}
.p5b-nav .p5b-on{color:var(--fin);font-weight:600;background:var(--fint)}
.p5b-fab{position:absolute;right:10px;bottom:10px;width:48px;height:48px;border-radius:50%;background:var(--t0);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px -12px rgba(0,0,0,.5)}
.p5b-fab svg{width:24px;height:24px}
.p5b-c{flex:1;padding:6px 10px 60px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.p5b-tete{display:flex;align-items:center;gap:8px;height:30px}
.p5b-tete h1{font-size:18px;font-weight:600;color:var(--t0);flex:1}
.p5b-seg{display:inline-flex;border:1px solid var(--bordm);border-radius:10px;overflow:hidden;height:28px}
.p5b-seg span{padding:0 9px;display:flex;align-items:center;font-size:12px;color:var(--t2);border-right:1px solid var(--bordm);font-family:var(--mono)}
.p5b-seg span:last-child{border-right:0}
.p5b-seg .p5b-on{background:var(--t0);color:#fff;font-weight:600}
/* la bascule avec / sans, en une barre */
.p5b-sw{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--bordm);border-radius:10px;overflow:hidden;height:44px}
.p5b-sw button{border:0;background:#fff;font:inherit;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 8px;color:var(--t2);font-size:12px;text-align:left;cursor:pointer;white-space:nowrap}
.p5b-sw button+button{border-left:1px solid var(--bordm)}
.p5b-sw button b{font-size:17px;font-weight:600;color:var(--t0);white-space:nowrap}
.p5b-sw button[aria-pressed="true"]{background:var(--frigot);color:var(--frigo);font-weight:600;box-shadow:inset 0 0 0 2px var(--frigo)}
.p5b-sw button[aria-pressed="true"] b{color:var(--alertet)}
.p5b-sw button[aria-pressed="true"].p5b-bleu{background:var(--fint);color:var(--fin);box-shadow:inset 0 0 0 2px var(--fin)}
.p5b-sw button[aria-pressed="true"].p5b-bleu b{color:var(--t0)}
.p5b-sw small{display:block;font-weight:400;font-size:12px}
/* l'escalier aux étiquettes */
.p5b-g{position:relative;height:500px;border-radius:16px;background:var(--panel);overflow:hidden}
.p5b-g svg{position:absolute;inset:0;width:100%;height:100%}
.p5b-step{fill:none;stroke:var(--frigo);stroke-width:2.5;stroke-linejoin:round}
.p5b-stepn{fill:none;stroke:var(--alerte);stroke-width:2.5;stroke-linejoin:round}
.p5b-aire{fill:var(--frigo);opacity:.14}
.p5b-airen{fill:var(--alerte);opacity:.22}
.p5b-ghost{fill:none;stroke:var(--fin);stroke-width:1.8;stroke-dasharray:3 4;stroke-linejoin:round}
.p5b-plein{fill:none;stroke:var(--fin);stroke-width:2.5;stroke-linejoin:round}
.p5b-aireb{fill:var(--finc);opacity:.3}
.p5b-grid{stroke:var(--bord);stroke-width:1}
.p5b-zero{stroke:var(--t1);stroke-width:1.2}
.p5b-ax{font-family:var(--mono);font-size:12px;fill:var(--t2)}
.p5b-ax.p5b-z{fill:var(--t0);font-weight:600}
.p5b-mois{font-family:var(--sans);font-size:12px;fill:var(--t2);font-weight:600}
.p5b-sep{stroke:var(--bordm);stroke-dasharray:2 3}
.p5b-ici{stroke:var(--t0);stroke-width:1.5}
.p5b-pt{fill:var(--alerte)}.p5b-ptb{fill:var(--fin)}
.p5b-chip{fill:#fff;stroke:var(--t1);stroke-width:1.2}
.p5b-chip.p5b-cf{stroke:var(--frigo);stroke-width:2}
.p5b-chip.p5b-cb{stroke:var(--brassin);stroke-width:1.5}
.p5b-chip.p5b-cv{stroke:var(--fin);stroke-dasharray:3 3}
.p5b-fil{stroke:var(--t1);stroke-width:1.2}
.p5b-fil.p5b-cf{stroke:var(--frigo);stroke-width:2}.p5b-fil.p5b-cb{stroke:var(--brassin)}.p5b-fil.p5b-cv{stroke:var(--fin)}
.p5b-tx{font-family:var(--sans);font-size:13px;font-weight:600;fill:var(--t0)}
.p5b-tx.p5b-cf{fill:var(--frigo);font-size:15px;font-weight:700}
.p5b-tx.p5b-cb{fill:var(--brassin)}
.p5b-tx.p5b-cv{fill:var(--fin)}
.p5b-sub{font-family:var(--sans);font-size:12px;fill:var(--t2)}
.p5b-mt{font-family:var(--mono);font-weight:600}
.p5b-et{font-family:var(--sans);font-size:13px;fill:var(--t1);paint-order:stroke;stroke:var(--panel);stroke-width:3.5px;stroke-linejoin:round}
.p5b-et.p5b-rt{fill:var(--alertet);font-weight:700}
.p5b-et.p5b-bl{fill:var(--fin);font-weight:600}
.p5b-solde{font-family:var(--mono);font-size:12px;font-weight:600;fill:var(--t1);paint-order:stroke;stroke:var(--panel);stroke-width:3px}
.p5b-fin{font-family:var(--mono);font-size:16px;font-weight:700;fill:var(--alertet);paint-order:stroke;stroke:var(--panel);stroke-width:3.5px}
.p5b-fin.p5b-bl{fill:var(--fin)}
/* dessous : les notions, les plis, l'action */
.p5b-leg{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--t2);height:20px}
.p5b-leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.p5b-leg .p5b-dp{background:var(--alerte)}
.p5b-leg .p5b-dv{background:#fff;border:2px solid var(--fin)}
.p5b-leg .p5b-df{background:var(--frigo)}.p5b-leg .p5b-db{background:var(--brassin)}
.p5b-leg b{color:var(--t0);font-weight:600}
.p5b-pied{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.p5b-pli{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--t1);height:28px}
.p5b-pli+.p5b-pli{margin-left:-2px}
.p5b-prim{height:32px;padding:0 12px;border-radius:10px;background:var(--t0);color:#fff;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;border:0;font-family:inherit}
.p5b-prim.p5b-rouge{background:var(--alertet)}
/* annexe : la fiche d'une étiquette touchée */
.p5b-voile{position:absolute;inset:0;background:rgba(17,17,17,.28)}
.p5b-fiche{position:absolute;left:10px;right:10px;bottom:66px;background:#fff;border-radius:16px;padding:12px;box-shadow:0 16px 40px -16px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px}
.p5b-fiche h2{font-size:16px;font-weight:600;color:var(--frigo);display:flex;align-items:center;gap:8px}
.p5b-fiche h2 small{margin-left:auto;font-weight:400;color:var(--t2);font-size:12px}
.p5b-fiche .p5b-gr{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.p5b-fiche .p5b-k{background:var(--panel);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;gap:1px;font-size:12px;color:var(--t2)}
.p5b-fiche .p5b-k b{font-size:16px;font-weight:600;color:var(--t0)}
.p5b-fiche .p5b-k b.p5b-rt{color:var(--alertet)}
.p5b-fiche .p5b-k.p5b-l{grid-column:1/-1;background:var(--frigot);color:var(--frigo)}
.p5b-fiche .p5b-row{display:flex;align-items:center;gap:8px}
.p5b-fiche .p5b-sel{display:inline-flex;border:1px solid var(--bordm);border-radius:10px;overflow:hidden;height:28px;margin-left:auto}
.p5b-fiche .p5b-sel span{padding:0 9px;display:flex;align-items:center;font-size:12px;color:var(--t2);border-right:1px solid var(--bordm);font-family:var(--mono)}
.p5b-fiche .p5b-sel span:last-child{border-right:0}
.p5b-fiche .p5b-sel .p5b-on{background:var(--frigo);color:#fff;font-weight:600}
.p5b-fiche .p5b-acts{display:flex;gap:6px;justify-content:flex-end}
.p5b-fiche .p5b-sec{height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--bordm);background:#fff;font-weight:600;font-size:13px;display:inline-flex;align-items:center;font-family:inherit;color:var(--t1)}
</style></head>
