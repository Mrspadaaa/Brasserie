<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Source Sans 3",system-ui,sans-serif;color:#111;background:#fff;font-size:14px;line-height:18px}
.s2d-m{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-weight:600}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.s2d-hd{display:flex;align-items:center;gap:8px;height:52px;padding:0 10px;border-bottom:1px solid #EBEBEB}
.s2d-logo{width:30px;height:30px;border-radius:10px;background:#111;display:grid;place-items:center}
.s2d-hd b{font-size:18px;font-weight:600;flex:1}
.s2d-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.s2d-bx{background:#F5F5F5;border:1px solid #DADADA}
.s2d-app{max-width:760px;margin:0 auto;padding-bottom:84px}
.s2d-tabs{display:flex;margin:0 10px;border-bottom:1px solid #DADADA}
.s2d-tabs a{flex:1;text-align:center;padding:8px 0;font-size:14px;color:#444;text-decoration:none}
.s2d-tabs a.s2d-on{color:#2F6EA8;font-weight:600;box-shadow:inset 0 -3px 0 #2F6EA8}
/* bandeau : mois + piles basses, d'un seul bloc */
.s2d-band{margin:8px 10px 0;border-radius:16px;background:#FAF8F3;padding:6px 8px 8px}
.s2d-top{display:flex;align-items:center;gap:6px}
.s2d-pill{display:flex;align-items:center;gap:2px;border-radius:16px;background:#fff;border:1px solid #E4E0D6;padding:1px}
.s2d-pill button{width:28px;height:28px;border-radius:50%;font-size:17px}
.s2d-pill b{font-size:15px;padding:0 4px}
.s2d-due{margin-left:auto;display:flex;align-items:center;gap:5px;min-height:28px;padding:0 9px;border-radius:16px;background:#FDF1F0;border:1px solid #F1C9C5;font-size:13px;color:#8E2A23}
.s2d-due i{width:8px;height:8px;border-radius:50%;background:#D6453D}
.s2d-piles{display:grid;grid-template-columns:1.15fr 8px 1fr 1fr 1fr 10px .9fr;align-items:end;height:112px;gap:4px;margin-top:6px}
.s2d-p{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px;text-align:center}
.s2d-p b{font-size:12px;line-height:14px}
.s2d-st{border-radius:10px 6px 2px 2px;display:flex;flex-direction:column;overflow:hidden}
.s2d-st i{display:block}
.s2d-hat{background:repeating-linear-gradient(135deg,#E3B55D 0 4px,#FCEFD2 4px 8px);box-shadow:inset 0 0 0 1px #C99A3A}
.s2d-sep{height:100%;border-left:1px dashed #BDBDBD;justify-self:center}
.s2d-base{display:grid;grid-template-columns:1.15fr 8px 1fr 1fr 1fr 10px .9fr;gap:4px;border-top:2px solid #111;padding-top:3px}
.s2d-base span{font-size:12px;color:#333;text-align:center;line-height:14px}
.s2d-key{display:flex;gap:10px;margin-top:6px;font-size:12px;color:#444;align-items:center;flex-wrap:wrap}
.s2d-key span{display:flex;align-items:center;gap:4px}
.s2d-key i{width:13px;height:11px;border-radius:3px;display:inline-block}
.s2d-key b{font-size:13px;color:#111}
/* liste : groupes toujours ouverts, une opération = un bloc de deux étages */
.s2d-g{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;padding:5px 10px 1px;position:sticky;top:0;background:#fff}
.s2d-g .s2d-sq{width:22px;height:22px;border-radius:10px;display:grid;place-items:center}
.s2d-g b{font-size:13px;letter-spacing:.02em}
.s2d-g .s2d-sub{font-size:13px;color:#444}
.s2d-op{display:grid;grid-template-columns:4px 1fr auto;column-gap:8px;padding:2px 10px 5px 10px;border-bottom:1px solid #F0F0F0;align-items:center}
.s2d-bar{grid-row:1/3;align-self:stretch;border-radius:2px}
.s2d-q{font-size:14px;font-weight:600;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s2d-q small{font-weight:400;color:#555;font-size:13px}
.s2d-a{font-size:14px;text-align:right}
.s2d-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:#555;line-height:16px;min-height:18px}
.s2d-tg{display:inline-flex;align-items:center;gap:3px;padding:0 6px;border-radius:999px;line-height:16px;font-size:12px}
.s2d-ok{background:#E8F5EC;color:#22663A}
.s2d-pay{background:repeating-linear-gradient(135deg,#FBEBC9 0 4px,#FFF7E6 4px 8px);color:#6E500F;box-shadow:inset 0 0 0 1px #E3C27E}
.s2d-late{background:#FDECEA;color:#8E2A23;box-shadow:inset 0 0 0 1px #F1C9C5}
.s2d-pc{display:inline-flex;align-items:center;gap:2px;color:#555}
.s2d-pc.s2d-no{color:#7A5500}
.s2d-act{grid-column:3;justify-self:end;margin:1px 0 -4px}
.s2d-btn{min-height:24px;padding:0 10px;border-radius:16px;background:#111;color:#fff;font-size:13px;font-weight:600}
.s2d-mini{min-height:24px;padding:0 7px;border-radius:10px;border:1px solid #D9D9D9;font-size:12px;color:#444;background:#fff}
.s2d-part{margin:4px 10px 0;border-top:1px dashed #BDBDBD}
.s2d-foot{display:flex;gap:6px;flex-wrap:wrap;padding:10px}
.s2d-foot button{min-height:30px;padding:0 10px;border-radius:10px;background:#F5F5F5;font-size:13px;color:#444}
.s2d-foot .s2d-ia{border:1px dashed #A9C9E8;background:#fff;color:#2F6EA8}
.s2d-ex{font-size:12px;color:#666;padding:0 10px}
.s2d-nav{position:fixed;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:1px solid #EBEBEB;display:flex;padding-right:76px;z-index:5}
.s2d-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:#444;text-decoration:none;max-width:110px}
.s2d-nav a.s2d-on{background:#E6EFF8;color:#111;font-weight:600;box-shadow:inset 0 3px 0 #2F6EA8}
.s2d-fab{position:fixed;right:10px;bottom:6px;width:60px;height:52px;border-radius:26px;background:#111;color:#fff;font-size:30px;z-index:6}
/* annexe : l'état après « ✓ Payé » */
.s2d-annex{margin:18px 10px 0;border:1px solid #DADADA;border-radius:16px;padding:10px 0 6px;background:#fff}
.s2d-annex h2{font-size:13px;font-weight:600;color:#2F6EA8;padding:0 10px 6px}
.s2d-flash{background:#F1FAF3}
@media (min-width:900px){.s2d-app{max-width:1120px;display:grid;grid-template-columns:400px 1fr;gap:0 24px;align-items:start}.s2d-full{grid-column:1/3}.s2d-left{position:sticky;top:0}.s2d-piles{height:200px}.s2d-nav{justify-content:center}}

body{background:#ECECEC}
.s2d-shot{margin:0 0 20px}
.s2d-shot figcaption{font-size:14px;line-height:20px;padding:10px 10px 6px;color:#333;font-weight:600}
.s2d-frame{position:relative;width:390px;height:844px;overflow:hidden;background:#fff;margin:0}
.s2d-frame .s2d-nav,.s2d-frame .s2d-fab{position:absolute}
.s2d-frame .s2d-app{padding-bottom:0}
.s2d-frame .s2d-g{position:static}
.s2d-ref img{display:block;width:390px;height:auto}
.s2d-hors{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;min-height:26px;padding:2px 10px 2px 22px;border-bottom:1px solid #F0F0F0;font-size:12px;color:#666}
.s2d-hors b{font-size:13px;color:#8A8A8A;font-weight:500}
.s2d-hp{border:1px dashed #BDBDBD;border-radius:999px;padding:0 6px;line-height:16px;color:#555}
.s2d-days{position:relative;z-index:1;display:grid;grid-template-columns:repeat(30,1fr);align-items:end;height:36px}
.s2d-d{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.s2d-bk{width:66%;min-width:4px;border-radius:3px 3px 1px 1px;overflow:hidden;display:flex;flex-direction:column}
.s2d-bk i{display:block}
.s2d-z{width:3px;height:3px;border-radius:50%;background:#BDB6A6;margin-bottom:1px}
.s2d-v{width:6px;height:6px;border-radius:50%;background:#2FA855;margin-bottom:2px}
.s2d-dim{opacity:.25}
.s2d-ax{display:grid;grid-template-columns:repeat(30,1fr);height:16px;font-size:12px;line-height:16px;color:#555}
.s2d-ax span{grid-row:1;justify-self:center;white-space:nowrap}
.s2d-ax .s2d-auj{color:#2F6EA8;font-weight:700}
.s2d-ax .s2d-sb{color:#111;font-weight:700}

.s2d-hs{margin:4px 4px 2px}
.s2d-lb{position:relative;height:30px;display:flex;align-items:center}
.s2d-hint{display:flex;align-items:center;gap:5px;font-size:12px;color:#555}
.s2d-tr{position:relative;height:42px;padding-top:4px;border-bottom:1.5px solid #111}
.s2d-bg{position:absolute;top:0;bottom:0;background:#DCE8F5;border-radius:8px}
.s2d-wk{position:absolute;top:4px;bottom:0;border-left:1px solid #E6E1D5}
.s2d-win{position:absolute;top:-2px;bottom:-4px;border:2px solid #111;border-radius:8px;background:none;z-index:2}
.s2d-e{position:absolute;top:50%;width:8px;height:22px;margin-top:-11px;border-radius:4px;background:#111}
.s2d-tab{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-4px);display:flex;align-items:center;gap:2px;min-height:26px;padding:0 0 0 10px;border-radius:16px;background:#111;color:#fff;font-size:13px;white-space:nowrap}
.s2d-tab button{width:26px;height:26px;border-radius:50%;color:#fff;font-size:16px}
.s2d-gh{display:flex;flex-direction:column;justify-content:flex-end;border:1.5px dashed #A79F8C;border-bottom:0;border-radius:10px 6px 0 0}
.s2d-gh .s2d-st{border-radius:2px}</style>
</head>
