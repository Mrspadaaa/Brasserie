<link rel="stylesheet" href="../fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Source Sans 3",system-ui,sans-serif;color:#111;background:#fff;font-size:14px;line-height:18px}
.s2c-m{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-weight:600}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.s2c-hd{display:flex;align-items:center;gap:8px;height:52px;padding:0 10px;border-bottom:1px solid #EBEBEB}
.s2c-logo{width:30px;height:30px;border-radius:10px;background:#111;display:grid;place-items:center}
.s2c-hd b{font-size:18px;font-weight:600;flex:1}
.s2c-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.s2c-bx{background:#F5F5F5;border:1px solid #DADADA}
.s2c-app{max-width:760px;margin:0 auto;padding-bottom:84px}
.s2c-tabs{display:flex;margin:0 10px;border-bottom:1px solid #DADADA}
.s2c-tabs a{flex:1;text-align:center;padding:8px 0;font-size:14px;color:#444;text-decoration:none}
.s2c-tabs a.s2c-on{color:#2F6EA8;font-weight:600;box-shadow:inset 0 -3px 0 #2F6EA8}
/* bandeau : mois + piles basses, d'un seul bloc */
.s2c-band{margin:8px 10px 0;border-radius:16px;background:#FAF8F3;padding:6px 8px 8px}
.s2c-top{display:flex;align-items:center;gap:6px}
.s2c-pill{display:flex;align-items:center;gap:2px;border-radius:16px;background:#fff;border:1px solid #E4E0D6;padding:1px}
.s2c-pill button{width:28px;height:28px;border-radius:50%;font-size:17px}
.s2c-pill b{font-size:15px;padding:0 4px}
.s2c-due{margin-left:auto;display:flex;align-items:center;gap:5px;min-height:28px;padding:0 9px;border-radius:16px;background:#FDF1F0;border:1px solid #F1C9C5;font-size:13px;color:#8E2A23}
.s2c-due i{width:8px;height:8px;border-radius:50%;background:#D6453D}
.s2c-piles{display:grid;grid-template-columns:1.15fr 8px 1fr 1fr 1fr 10px .9fr;align-items:end;height:112px;gap:4px;margin-top:6px}
.s2c-p{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px;text-align:center}
.s2c-p b{font-size:12px;line-height:14px}
.s2c-st{border-radius:10px 6px 2px 2px;display:flex;flex-direction:column;overflow:hidden}
.s2c-st i{display:block}
.s2c-hat{background:repeating-linear-gradient(135deg,#E3B55D 0 4px,#FCEFD2 4px 8px);box-shadow:inset 0 0 0 1px #C99A3A}
.s2c-sep{height:100%;border-left:1px dashed #BDBDBD;justify-self:center}
.s2c-base{display:grid;grid-template-columns:1.15fr 8px 1fr 1fr 1fr 10px .9fr;gap:4px;border-top:2px solid #111;padding-top:3px}
.s2c-base span{font-size:12px;color:#333;text-align:center;line-height:14px}
.s2c-key{display:flex;gap:10px;margin-top:6px;font-size:12px;color:#444;align-items:center;flex-wrap:wrap}
.s2c-key span{display:flex;align-items:center;gap:4px}
.s2c-key i{width:13px;height:11px;border-radius:3px;display:inline-block}
.s2c-key b{font-size:13px;color:#111}
/* liste : groupes toujours ouverts, une opération = un bloc de deux étages */
.s2c-g{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;padding:5px 10px 1px;position:sticky;top:0;background:#fff}
.s2c-g .s2c-sq{width:22px;height:22px;border-radius:10px;display:grid;place-items:center}
.s2c-g b{font-size:13px;letter-spacing:.02em}
.s2c-g .s2c-sub{font-size:13px;color:#444}
.s2c-op{display:grid;grid-template-columns:4px 1fr auto;column-gap:8px;padding:2px 10px 5px 10px;border-bottom:1px solid #F0F0F0;align-items:center}
.s2c-bar{grid-row:1/3;align-self:stretch;border-radius:2px}
.s2c-q{font-size:14px;font-weight:600;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s2c-q small{font-weight:400;color:#555;font-size:13px}
.s2c-a{font-size:14px;text-align:right}
.s2c-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:#555;line-height:16px;min-height:18px}
.s2c-tg{display:inline-flex;align-items:center;gap:3px;padding:0 6px;border-radius:999px;line-height:16px;font-size:12px}
.s2c-ok{background:#E8F5EC;color:#22663A}
.s2c-pay{background:repeating-linear-gradient(135deg,#FBEBC9 0 4px,#FFF7E6 4px 8px);color:#6E500F;box-shadow:inset 0 0 0 1px #E3C27E}
.s2c-late{background:#FDECEA;color:#8E2A23;box-shadow:inset 0 0 0 1px #F1C9C5}
.s2c-pc{display:inline-flex;align-items:center;gap:2px;color:#555}
.s2c-pc.s2c-no{color:#7A5500}
.s2c-act{grid-column:3;justify-self:end;margin:1px 0 -4px}
.s2c-btn{min-height:24px;padding:0 10px;border-radius:16px;background:#111;color:#fff;font-size:13px;font-weight:600}
.s2c-mini{min-height:24px;padding:0 7px;border-radius:10px;border:1px solid #D9D9D9;font-size:12px;color:#444;background:#fff}
.s2c-part{margin:4px 10px 0;border-top:1px dashed #BDBDBD}
.s2c-foot{display:flex;gap:6px;flex-wrap:wrap;padding:10px}
.s2c-foot button{min-height:30px;padding:0 10px;border-radius:10px;background:#F5F5F5;font-size:13px;color:#444}
.s2c-foot .s2c-ia{border:1px dashed #A9C9E8;background:#fff;color:#2F6EA8}
.s2c-ex{font-size:12px;color:#666;padding:0 10px}
.s2c-nav{position:fixed;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:1px solid #EBEBEB;display:flex;padding-right:76px;z-index:5}
.s2c-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:#444;text-decoration:none;max-width:110px}
.s2c-nav a.s2c-on{background:#E6EFF8;color:#111;font-weight:600;box-shadow:inset 0 3px 0 #2F6EA8}
.s2c-fab{position:fixed;right:10px;bottom:6px;width:60px;height:52px;border-radius:26px;background:#111;color:#fff;font-size:30px;z-index:6}
/* annexe : l'état après « ✓ Payé » */
.s2c-annex{margin:18px 10px 0;border:1px solid #DADADA;border-radius:16px;padding:10px 0 6px;background:#fff}
.s2c-annex h2{font-size:13px;font-weight:600;color:#2F6EA8;padding:0 10px 6px}
.s2c-flash{background:#F1FAF3}
@media (min-width:900px){.s2c-app{max-width:1120px;display:grid;grid-template-columns:400px 1fr;gap:0 24px;align-items:start}.s2c-full{grid-column:1/3}.s2c-left{position:sticky;top:0}.s2c-piles{height:200px}.s2c-nav{justify-content:center}}

body{background:#ECECEC}
.s2c-shot{margin:0 0 20px}
.s2c-shot figcaption{font-size:14px;line-height:20px;padding:10px 10px 6px;color:#333;font-weight:600}
.s2c-frame{position:relative;width:390px;height:844px;overflow:hidden;background:#fff;margin:0}
.s2c-frame .s2c-nav,.s2c-frame .s2c-fab{position:absolute}
.s2c-frame .s2c-app{padding-bottom:0}
.s2c-frame .s2c-g{position:static}
.s2c-ref img{display:block;width:390px;height:auto}
.s2c-hors{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;min-height:26px;padding:2px 10px 2px 22px;border-bottom:1px solid #F0F0F0;font-size:12px;color:#666}
.s2c-hors b{font-size:13px;color:#8A8A8A;font-weight:500}
.s2c-hp{border:1px dashed #BDBDBD;border-radius:999px;padding:0 6px;line-height:16px;color:#555}
.s2c-days{position:relative;z-index:1;display:grid;grid-template-columns:repeat(61,1fr);align-items:end;height:30px}
.s2c-d{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.s2c-bk{width:66%;min-width:4px;border-radius:3px 3px 1px 1px;overflow:hidden;display:flex;flex-direction:column}
.s2c-bk i{display:block}
.s2c-z{width:3px;height:3px;border-radius:50%;background:#BDB6A6;margin-bottom:1px}
.s2c-v{width:6px;height:6px;border-radius:50%;background:#2FA855;margin-bottom:2px}
.s2c-dim{opacity:.25}
.s2c-ax{display:grid;grid-template-columns:repeat(61,1fr);height:16px;font-size:12px;line-height:16px;color:#555}
.s2c-ax span{grid-row:1;justify-self:center;white-space:nowrap}
.s2c-ax .s2c-auj{color:#2F6EA8;font-weight:700}
.s2c-ax .s2c-sb{color:#111;font-weight:700}

.s2c-yr{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:6px}
.s2c-mo{height:46px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;border-radius:10px;border:1.5px solid transparent;padding-bottom:2px}
.s2c-mo span{font-size:12px;line-height:14px;color:#555}
.s2c-an{box-shadow:inset 1px 0 0 #D6D0C2;border-radius:0}
.s2c-b{width:13px;border-radius:3px 3px 1px 1px;display:flex;flex-direction:column;overflow:hidden}
.s2c-b i{display:block}
.s2c-nd{width:13px;border-top:2px dotted #C9C4B8}
.s2c-cur{background:#fff;border-color:#111}
.s2c-cur span{color:#111;font-weight:700}
.s2c-br{position:absolute;top:0;height:30px;border:2px solid #2F6EA8;border-radius:5px;background:rgba(47,110,168,.16);pointer-events:none}
.s2c-rd{display:flex;align-items:center;gap:6px;min-height:28px;margin-top:6px;font-size:12px;color:#555}
.s2c-rd b{font-size:15px;color:#111}
.s2c-x{margin-left:auto;min-height:24px;padding:0 9px;border-radius:16px;border:1px solid #D9D9D9;background:#fff;font-size:12px;color:#444}
.s2c-zm{margin:6px 2px 0;background:#fff;border:1.5px solid #111;border-radius:12px;padding:4px 6px 2px}
.s2c-ml{display:flex;align-items:center;height:28px;font-size:15px}
.s2c-live{background:#111;color:#fff;border-radius:8px;padding:0 6px}
.s2c-un{margin-left:auto;min-height:24px;padding:0 8px;border-radius:16px;border:1px solid #D9D9D9;font-size:12px;color:#444;background:#fff}
.s2c-tr{position:relative;height:40px;padding-top:6px;border-bottom:1.5px solid #111}
.s2c-sel{position:absolute;top:0;bottom:0;background:#DCE8F5}
.s2c-mid{position:absolute;top:0;bottom:0;border-left:1px dashed #9A9A9A}
.s2c-pin{position:absolute;top:0;bottom:-2px;border-left:2px solid #111;z-index:2}
.s2c-pin b{position:absolute;bottom:2px;left:3px;font-size:12px;background:#111;color:#fff;border-radius:8px;padding:0 5px;line-height:18px;white-space:nowrap}
.s2c-touch{position:absolute;top:2px;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:rgba(17,17,17,.16);box-shadow:0 0 0 2px rgba(17,17,17,.35);z-index:3}
.s2c-bub{position:absolute;top:-38px;transform:translateX(-50%);background:#111;color:#fff;font-size:14px;font-weight:600;border-radius:10px;padding:3px 10px;white-space:nowrap;z-index:4}
.s2c-bub::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#111}
.s2c-none{margin:6px 10px 0;padding:3px 8px;border:1px dashed #C9C4B8;border-radius:10px;font-size:12px;color:#555}</style>
</head>
