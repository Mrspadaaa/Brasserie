<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m4bb-d · Le litre dans le verre (libre)</title>
<style>
@font-face{font-family:"Source Sans 3";src:url(../fonts/SourceSans3-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Source Sans 3";src:url(../fonts/SourceSans3-600.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Source Sans 3";src:url(../fonts/SourceSans3-700.woff2) format("woff2");font-weight:700}
@font-face{font-family:"IBM Plex Mono";src:url(../fonts/IBMPlexMono-600.woff2) format("woff2");font-weight:600}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Source Sans 3",system-ui,sans-serif;color:#111;background:#fff;font-size:14px;line-height:18px;width:390px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.m4bb-d-m{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-weight:600}
.m4bb-d-back{position:relative;height:84px;overflow:hidden}
.m4bb-d-back img{width:390px;display:block}
.m4bb-d-back::after{content:"";position:absolute;inset:0;background:rgba(17,17,17,.42)}
.m4bb-d-sheet{position:relative;margin-top:-20px;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.18);padding:6px 0 14px}
.m4bb-d-grip{width:36px;height:4px;border-radius:2px;background:#D6D6D6;margin:0 auto 6px}
/* l'étagère : le choix du brassin, en verres */
.m4bb-d-shelf{display:flex;gap:4px;padding:0 10px;align-items:flex-end;border-bottom:3px solid #8A6A3A;margin:0 10px;padding-bottom:0}
.m4bb-d-gl{display:flex;flex-direction:column;align-items:center;gap:2px;width:70px;min-height:64px;padding:4px 2px 4px;border-radius:10px 10px 0 0;font-size:12px;line-height:14px;text-align:center}
.m4bb-d-gl svg{display:block}
.m4bb-d-gl.m4bb-d-on{background:#FAF3E2;box-shadow:inset 0 -3px 0 #111;font-weight:600}
.m4bb-d-gl small{color:#666;font-weight:400}
.m4bb-d-x{margin-left:auto;align-self:center;width:32px;height:32px;border-radius:10px;background:#F5F5F5;border:1px solid #DADADA;font-size:18px}
/* le grand verre */
.m4bb-d-stage{display:grid;grid-template-columns:150px 1fr;gap:0 10px;padding:14px 10px 0;align-items:start}
.m4bb-d-lab{position:relative;height:250px}
.m4bb-d-l{position:absolute;left:0;right:0;display:flex;align-items:center;gap:6px;font-size:13px;line-height:15px}
.m4bb-d-l::before{content:"";width:16px;border-top:1.5px solid #999;flex:none}
.m4bb-d-l b{font-size:15px}
.m4bb-d-l small{display:block;color:#555;font-size:12px}
.m4bb-d-sum{margin:10px 10px 0;display:flex;align-items:baseline;gap:8px;padding:8px 10px;border-radius:16px;background:#FAF8F3}
.m4bb-d-sum .m4bb-d-big{font-size:30px;line-height:32px}
.m4bb-d-sum span{font-size:13px;color:#444}
.m4bb-d-btl{margin-left:auto;text-align:right;font-size:12px;color:#555;line-height:15px}
.m4bb-d-btl b{display:block;font-size:16px;color:#111}
/* les tickets à payer */
.m4bb-d-tk{display:flex;gap:6px;padding:10px 10px 0}
.m4bb-d-t{flex:1;min-height:56px;border-radius:10px;padding:4px 6px;background:repeating-linear-gradient(135deg,#FBEBC9 0 4px,#FFF7E6 4px 8px);box-shadow:inset 0 0 0 1px #E3C27E;color:#6E500F;font-size:12px;line-height:14px;text-align:left}
.m4bb-d-t b{display:block;font-size:15px;line-height:20px;color:#111}
.m4bb-d-task{display:flex;align-items:center;gap:8px;width:calc(100% - 20px);margin:10px 10px 0;min-height:44px;padding:0 10px;border-radius:10px;border:1px dashed #8A8A8A;text-align:left}
.m4bb-d-task i{font-style:normal;width:22px;height:22px;border-radius:50%;border:1.5px dotted #555;display:grid;place-items:center;font-weight:700}
.m4bb-d-task span{flex:1}
.m4bb-d-task small{color:#555;font-size:12px}
.m4bb-d-foot{display:flex;gap:6px;padding:10px 10px 0}
.m4bb-d-foot button{height:44px;border-radius:10px;padding:0 12px;font-weight:600}
.m4bb-d-ia{border:1px dashed #A9C9E8;color:#2F6EA8}
.m4bb-d-pri{flex:1;background:#E3E3E3;color:#6A6A6A}
.m4bb-d-more{display:block;margin:8px auto 0;font-size:13px;color:#2F6EA8;min-height:32px}
</style>
</head>
<body>
<div class="m4bb-d-back"><img src="../../../ref/p5b/p5b-haut.png" alt=""></div>
<section class="m4bb-d-sheet" aria-label="Coût du brassin">
 <div class="m4bb-d-grip"></div>
 <div class="m4bb-d-shelf" data-booster="etagere-brassins" aria-label="Quel brassin veux-tu estimer ?">
  <button class="m4bb-d-gl m4bb-d-on"><svg width="22" height="30" viewBox="0 0 22 30"><path d="M2 2h18l-2 26H4z" fill="#E9B44C" stroke="#111" stroke-width="1.5"/><path d="M2 2h18v4H2z" fill="#fff"/></svg>Pale Ale<small>20 nov.</small></button>
  <button class="m4bb-d-gl"><svg width="22" height="30" viewBox="0 0 22 30"><path d="M2 2h18l-2 26H4z" fill="#fff" stroke="#999" stroke-width="1.5" stroke-dasharray="3 2"/></svg>Saison<small>recette</small></button>
  <button class="m4bb-d-gl"><svg width="22" height="30" viewBox="0 0 22 30"><path d="M2 2h18l-2 26H4z" fill="#fff" stroke="#999" stroke-width="1.5" stroke-dasharray="3 2"/></svg>Stout<small>recette</small></button>
  <button class="m4bb-d-gl"><svg width="22" height="30" viewBox="0 0 22 30"><path d="M2 2h18l-2 26H4z" fill="#fff" stroke="#999" stroke-width="1.5" stroke-dasharray="3 2"/></svg>Blanche<small>recette</small></button>
  <button class="m4bb-d-x" aria-label="Fermer">×</button>
 </div>

 <div class="m4bb-d-stage" data-booster="verre-du-litre">
  <svg width="150" height="250" viewBox="0 0 150 250" aria-label="Le litre de Pale Ale, par moment de paiement">
   <defs>
    <pattern id="m4bbdH" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FCEFD2"/><rect width="4" height="8" fill="#E3B55D"/></pattern>
    <clipPath id="m4bbdC"><path d="M14 18h122l-14 226H28z"/></clipPath>
   </defs>
   <g clip-path="url(#m4bbdC)">
    <rect x="0" y="0" width="150" height="250" fill="#fff"/>
    <!-- échelle : 226 px pour 7,51 ; année 4,35 = 131 ; à payer 2,38 = 72 ; stock 0,78 = 23 -->
    <rect x="0" y="221" width="150" height="23" fill="#D2B356"/>
    <rect x="0" y="149" width="150" height="72" fill="url(#m4bbdH)"/>
    <rect x="0" y="18" width="150" height="131" fill="#9856D2"/>
    <rect x="0" y="18" width="150" height="131" fill="#fff" opacity=".18"/>
   </g>
   <path d="M14 8h122" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/>
   <text x="75" y="14" text-anchor="middle" font-size="12" font-family="Source Sans 3" fill="#444">? acide lactique</text>
   <path d="M14 18h122l-14 226H28z" fill="none" stroke="#111" stroke-width="2.5"/>
   <path d="M36 40l-4 180" stroke="#fff" stroke-width="5" opacity=".35" stroke-linecap="round"/>
  </svg>
  <div class="m4bb-d-lab">
   <span class="m4bb-d-l" style="top:70px"><span><b class="m4bb-d-m">4,35</b> part de l'année<small>charges fixes, usure : réparties</small></span></span>
   <span class="m4bb-d-l" style="top:170px"><span><b class="m4bb-d-m">2,38</b> à payer<small>achats, frais, impôt</small></span></span>
   <span class="m4bb-d-l" style="top:224px"><span><b class="m4bb-d-m">0,78</b> déjà payé<small>le stock</small></span></span>
  </div>
 </div>

 <div class="m4bb-d-sum">
  <b class="m4bb-d-big m4bb-d-m">≥ 7,51</b><span>CHF le litre<br><span class="m4bb-d-m">27 L</span> nets ›</span>
  <span class="m4bb-d-btl" data-booster="bouteille">la bouteille 33 cl<b class="m4bb-d-m">≥ 2,48</b>81 bouteilles</span>
 </div>

 <div class="m4bb-d-tk" aria-label="À payer, dans l'ordre">
  <button class="m4bb-d-t">avant le 20 nov.<b class="m4bb-d-m">26,70</b>malt, Citra, frais</button>
  <button class="m4bb-d-t">~4 déc.<b class="m4bb-d-m">30,72</b>emballage</button>
  <button class="m4bb-d-t">~18 déc.<b class="m4bb-d-m">6,84</b>impôt bière</button>
 </div>

 <button class="m4bb-d-task" data-booster="tache-filtrante"><i>?</i><span><b>Acide lactique</b> <small>· la mousse manque : prix à poser</small></span>›</button>
 <div class="m4bb-d-foot"><button class="m4bb-d-ia" data-booster="ia-expliquer">✦ Expliquer</button><button class="m4bb-d-pri" disabled>Prévoir <span class="m4bb-d-m">64,26</span></button></div>
 <button class="m4bb-d-more">Tout le détail, ligne à ligne ›</button>
</section>
</body>
</html>
