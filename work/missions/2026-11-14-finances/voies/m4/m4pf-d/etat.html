<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>m4pf-d · Ta brasserie en quatre phrases à trous (libre)</title>
<style>
@font-face{font-family:"Source Sans 3";src:url(../fonts/SourceSans3-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Source Sans 3";src:url(../fonts/SourceSans3-600.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Source Sans 3";src:url(../fonts/SourceSans3-700.woff2) format("woff2");font-weight:700}
@font-face{font-family:"IBM Plex Mono";src:url(../fonts/IBMPlexMono-600.woff2) format("woff2");font-weight:600}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Source Sans 3",system-ui,sans-serif;color:#111;background:#fff;font-size:14px;line-height:18px;width:390px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.m4pf-d-m{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-weight:600}
.m4pf-d-back{position:relative;height:200px;overflow:hidden}.m4pf-d-back img{width:390px;display:block}
.m4pf-d-back::after{content:"";position:absolute;inset:0;background:rgba(17,17,17,.42)}
.m4pf-d-sheet{position:relative;margin-top:-20px;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.18);padding:6px 12px 14px;min-height:664px}
.m4pf-d-grip{width:36px;height:4px;border-radius:2px;background:#D6D6D6;margin:0 auto 6px}
.m4pf-d-hd{display:flex;align-items:center}.m4pf-d-hd h1{font-size:13px;font-weight:600;color:#555;flex:1;letter-spacing:.02em}
.m4pf-d-x{width:32px;height:32px;border-radius:10px;background:#F5F5F5;border:1px solid #DADADA;font-size:18px}
.m4pf-d-s{font-size:20px;line-height:40px;margin-top:10px;padding-left:12px;border-left:4px solid var(--c)}
.m4pf-d-s .m4pf-d-hole{display:inline-flex;align-items:center;min-height:34px;padding:0 10px;border-radius:10px;background:#fff;border:1.5px solid #111;font-size:18px;line-height:22px;vertical-align:1px;gap:4px}
.m4pf-d-hole.m4pf-d-live{border-color:#2F6EA8;box-shadow:0 0 0 3px #E6EFF8}
.m4pf-d-chk{display:inline-flex;align-items:center;gap:4px;min-height:30px;padding:0 9px;border-radius:999px;background:#E8F5EC;color:#22663A;font-size:14px;vertical-align:2px}
.m4pf-d-fx{display:block;font-size:13px;line-height:17px;color:#555;margin:-2px 0 4px}
.m4pf-d-fx b{color:#111}
.m4pf-d-foot{display:flex;gap:6px;margin-top:18px}
.m4pf-d-foot button{height:44px;border-radius:10px;padding:0 14px;font-weight:600}
.m4pf-d-sec{background:#F5F5F5}.m4pf-d-pri{flex:1;background:#111;color:#fff}
.m4pf-d-hd h1{font-size:18px;line-height:22px;color:#111;letter-spacing:0;text-transform:none;font-variant:normal;font-weight:700}.m4pf-d-s .m4pf-d-hole,.m4pf-d-s .m4pf-d-chk{min-height:44px;margin:3px 4px}
</style></head><body>
<div class="m4pf-d-back"><img src="../../../ref/g3a/g3a-haut.png" alt=""></div>
<section class="m4pf-d-sheet" aria-label="Solde et paramètres">
 <div class="m4pf-d-grip"></div>
 <div class="m4pf-d-hd"><h1>Solde et paramètres</h1><button class="m4pf-d-x" aria-label="Fermer">×</button></div>

 <p class="m4pf-d-s" style="--c:#56D27B" data-booster="phrase-solde">Le <button class="m4pf-d-hole">1 janv. 2025 ⌄</button> j'avais <button class="m4pf-d-hole m4pf-d-live" role="textbox" inputmode="decimal"><span class="m4pf-d-m">3 250,00</span> CHF</button> en caisse <button class="m4pf-d-chk" role="switch" aria-checked="true">✓ vérifié</button>
  <span class="m4pf-d-fx">→ aujourd'hui <b class="m4pf-d-m">4 181,60</b></span></p>

 <p class="m4pf-d-s" style="--c:#56C1D2" data-booster="phrase-historique">Tout est noté depuis <button class="m4pf-d-hole">janv. 2025 ⌄</button>
  <span class="m4pf-d-fx">→ <b>10 mois</b> complets</span></p>

 <p class="m4pf-d-s" style="--c:#D2B356" data-booster="phrase-production">Cette année je brasse <button class="m4pf-d-hole"><span class="m4pf-d-m">1 800</span> L</button>
  <span class="m4pf-d-fx">→ charges fixes <b class="m4pf-d-m">3,88</b> CHF/L</span></p>

 <p class="m4pf-d-s" style="--c:#9856D2"><b>Indépendant</b> à <b>Fribourg</b>, <b>sans&nbsp;TVA</b>
  <span class="m4pf-d-fx">→ ventes <b class="m4pf-d-m">18 640</b> sur <b class="m4pf-d-m">100 000</b></span></p>

 <div class="m4pf-d-foot"><button class="m4pf-d-sec">Annuler</button><button class="m4pf-d-pri">Enregistrer</button></div>
</section></body></html>
