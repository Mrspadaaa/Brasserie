<style>
@font-face{font-family:"Source Sans 3";src:url(../fonts/SourceSans3-400.woff2) format("woff2");font-weight:400}

.m4ia-d-free span{flex:1}.m4ia-d-mode{min-height:44px;padding:0 10px;border-radius:10px;border:1px solid #D9D9D9;font-size:13px;color:#111;flex:none}.m4ia-d-free .m4ia-d-send{min-height:44px}
