<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m4bb-b · Le litre, et la seule chose à faire (froide)</title>
<style>
@font-face{font-family:"Source Sans 3";src:url(../fonts/SourceSans3-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Source Sans 3";src:url(../fonts/SourceSans3-600.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Source Sans 3";src:url(../fonts/SourceSans3-700.woff2) format("woff2");font-weight:700}
@font-face{font-family:"IBM Plex Mono";src:url(../fonts/IBMPlexMono-600.woff2) format("woff2");font-weight:600}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Source Sans 3",system-ui,sans-serif;color:#111;background:#fff;font-size:14px;line-height:18px;width:390px}
button,input{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.m4bb-b-m{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-weight:600}
.m4bb-b-back{position:relative;height:210px;overflow:hidden}
.m4bb-b-back img{width:390px;display:block}
.m4bb-b-back::after{content:"";position:absolute;inset:0;background:rgba(17,17,17,.42)}
.m4bb-b-sheet{position:relative;min-height:656px;margin-top:-22px;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.18);padding:6px 0 12px}
.m4bb-b-grip{width:36px;height:4px;border-radius:2px;background:#D6D6D6;margin:0 auto 6px}
/* le choix du brassin, dans la feuille même : une rangée de puces */
.m4bb-b-chips{display:flex;gap:6px;padding:0 10px 0 10px;overflow:hidden;align-items:center}
.m4bb-b-chip{flex:none;min-height:44px;padding:0 10px;border-radius:16px;border:1px solid #D9D9D9;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.m4bb-b-chip small{color:#666;font-size:12px}
.m4bb-b-on{background:#111;border-color:#111;color:#fff;font-weight:600}
.m4bb-b-on small{color:#CFCFCF}
.m4bb-b-x{margin-left:auto;flex:none;width:44px;height:44px;border-radius:10px;background:#F5F5F5;border:1px solid #DADADA;font-size:18px}
/* la réponse */
.m4bb-b-hero{padding:18px 10px 6px;text-align:center}
.m4bb-b-hero p{font-size:13px;color:#555}
.m4bb-b-big{font-size:48px;line-height:54px;letter-spacing:-.02em}
.m4bb-b-big small{font-size:18px;color:#555;letter-spacing:0}
.m4bb-b-ge{font-size:28px;color:#777;vertical-align:8px;margin-right:2px}
.m4bb-b-sub{display:flex;justify-content:center;gap:6px;margin-top:6px;font-size:13px;color:#444;align-items:center}
.m4bb-b-pill{display:inline-flex;align-items:center;min-height:44px;padding:0 9px;border-radius:999px;border:1px solid #D9D9D9;font-size:13px}
/* la seule chose à faire : édition sur place */
.m4bb-b-todo{margin:12px 10px 0;border-radius:16px;border:1.5px dashed #8A8A8A;padding:8px 10px 10px}
.m4bb-b-todo h2{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}
.m4bb-b-todo h2 i{font-style:normal;width:22px;height:22px;border-radius:50%;border:1.5px dotted #555;display:grid;place-items:center;font-size:13px}
.m4bb-b-todo h2 span{margin-left:auto;font-size:12px;color:#555;font-weight:400}
.m4bb-b-fields{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:end;margin-top:8px}
.m4bb-b-fields label{font-size:12px;color:#555;display:flex;flex-direction:column;gap:2px}
.m4bb-b-in{height:44px;border-radius:10px;border:1.5px solid #2F6EA8;padding:0 10px;font-size:16px;display:flex;align-items:center;justify-content:space-between;background:#fff;cursor:text;box-shadow:0 0 0 3px #E6EFF8}
.m4bb-b-in.m4bb-b-idle{border:1px solid #CFCFCF;box-shadow:none}
.m4bb-b-in em{font-style:normal;color:#777;font-size:13px}
.m4bb-b-caret{display:inline-block;width:1.5px;height:20px;background:#2F6EA8;margin-left:1px;vertical-align:-4px}
.m4bb-b-per{padding-bottom:12px;color:#555}
.m4bb-b-org{display:flex;gap:4px;margin-top:8px}.m4bb-b-org button{flex:1;min-height:44px;border-radius:10px;border:1px solid #D9D9D9;background:#fff;font-size:13px}.m4bb-b-org .m4bb-b-on2{background:#111;color:#fff;border-color:#111}.m4bb-b-lines{padding:0 2px 4px 24px;border-bottom:1px solid #EBEBEB}.m4bb-b-ln{display:grid;grid-template-columns:1fr auto;font-size:13px;line-height:24px;color:#333}.m4bb-b-ln .m4bb-b-m{text-align:right}.m4bb-b-lk{font-size:12px;color:#555;line-height:20px;padding-top:2px}
/* trois portes, fermées */
.m4bb-b-doors{margin:12px 10px 0;border-top:1px solid #EBEBEB}
.m4bb-b-door{display:grid;grid-template-columns:14px 1fr auto 14px;gap:8px;align-items:center;width:100%;min-height:44px;border-bottom:1px solid #EBEBEB;text-align:left;padding:0 2px}
.m4bb-b-door i{width:14px;height:14px;border-radius:4px}
.m4bb-b-door small{display:block;font-size:12px;color:#555;line-height:14px}
.m4bb-b-hat{background:repeating-linear-gradient(135deg,#E3B55D 0 3px,#FCEFD2 3px 6px);box-shadow:inset 0 0 0 1px #C99A3A}
/* pied */
.m4bb-b-foot{display:flex;gap:6px;padding:14px 10px 0;align-items:center}
.m4bb-b-ia{height:44px;padding:0 10px;border-radius:10px;border:1px dashed #A9C9E8;color:#2F6EA8;font-size:14px;font-weight:600;flex:none}
.m4bb-b-pri{flex:1;height:44px;border-radius:10px;background:#111;color:#fff;font-weight:600;font-size:15px}
.m4bb-b-sv{flex:none;height:44px;padding:0 10px;border-radius:10px;background:#F5F5F5;color:#333;font-weight:600}
.m4bb-b-after{font-size:12px;color:#555;text-align:center;padding:6px 10px 0}
</style>
</head>
<body>
<div class="m4bb-b-back"><img src="../../../ref/p5b/p5b-haut.png" alt=""></div>
<section class="m4bb-b-sheet" aria-label="Coût du brassin">
 <div class="m4bb-b-grip"></div>
 <div class="m4bb-b-chips" data-booster="choix-brassin" role="tablist" aria-label="Quel brassin veux-tu estimer ?">
  <button class="m4bb-b-chip m4bb-b-on" role="tab" aria-selected="true">Pale Ale <small>20 nov.</small></button>
  <button class="m4bb-b-chip" role="tab">Saison des vignes</button>
  <button class="m4bb-b-chip" role="tab">Stout…</button>
  <button class="m4bb-b-x" aria-label="Fermer">×</button>
 </div>

 <div class="m4bb-b-hero">
  <p>Ton litre de Pale Ale</p>
  <div class="m4bb-b-big m4bb-b-m">7,54 <small>CHF/L</small></div>
  <div class="m4bb-b-sub"><button class="m4bb-b-pill" data-booster="volumes"><span class="m4bb-b-m">27 L</span>&nbsp;nets ›</button><span>à sortir de ta caisse</span><b class="m4bb-b-m">64,26</b></div>
 </div>

 <section class="m4bb-b-todo" data-booster="prix-sur-place" aria-label="À compléter">
  <h2><i>?</i>Acide lactique · 10 mL en stock<span>aucun prix connu</span></h2>
  <div class="m4bb-b-fields">
   <label>Prix du format<span class="m4bb-b-in" role="textbox" inputmode="decimal" aria-label="Prix de l'acide lactique"><span class="m4bb-b-m">8,90<span class="m4bb-b-caret"></span></span><em>CHF</em></span></label>
   <span class="m4bb-b-per">pour</span>
   <label>Quantité<span class="m4bb-b-in m4bb-b-idle" role="textbox" inputmode="decimal"><span class="m4bb-b-m">100</span><em>mL ⌄</em></span></label>
  </div>
  <div class="m4bb-b-org" role="radiogroup" aria-label="Origine du prix"><button class="m4bb-b-on2" role="radio" aria-checked="true">Facture</button><button role="radio">Devis</button><button role="radio">Estimé</button></div>
 </section>

 <nav class="m4bb-b-doors" aria-label="Le détail">
  <button class="m4bb-b-door"><i style="background:#D2B356"></i><span>Déjà payé<small>stock : Pilsner, Cascade, US-05, acide</small></span><b class="m4bb-b-m">21,83</b>›</button>
  <button class="m4bb-b-door"><i class="m4bb-b-hat"></i><span>À payer<small>26,70 avant le 20 nov. · 37,56 plus tard</small></span><b class="m4bb-b-m">64,26</b>⌃</button>
  <div class="m4bb-b-lines"><p class="m4bb-b-lk">avant le 20 nov.</p><div class="m4bb-b-ln"><span>Munich · 0,8 kg</span><span class="m4bb-b-m">3,20</span></div><div class="m4bb-b-ln"><span>Citra · 60 g</span><span class="m4bb-b-m">9,80</span></div><div class="m4bb-b-ln"><span>Énergie</span><span class="m4bb-b-m">≈ 9,50</span></div><div class="m4bb-b-ln"><span>Nettoyage</span><span class="m4bb-b-m">≈ 4,20</span></div><p class="m4bb-b-lk">plus tard</p><div class="m4bb-b-ln"><span>Emballage · 81 × 33 cl</span><span class="m4bb-b-m">30,72</span></div><div class="m4bb-b-ln"><span>Impôt bière · ~18 déc.</span><span class="m4bb-b-m">≈ 6,84</span></div></div>
  <button class="m4bb-b-door"><i style="background:#9856D2"></i><span>Part de l'année<small>charges fixes et usure, réparties</small></span><b class="m4bb-b-m">117,57</b>›</button>
 </nav>

 <div class="m4bb-b-foot">
  <button class="m4bb-b-ia" aria-label="Expliquer avec le compagnon" data-booster="ia-expliquer">✦ Expliquer</button>
  <button class="m4bb-b-sv">Enregistrer</button>
  <button class="m4bb-b-pri" data-booster="prevoir">Prévoir <span class="m4bb-b-m">64,26</span> CHF</button>
 </div>
</section>
</body>
</html>
