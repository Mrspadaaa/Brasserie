<style>
@font-face{font-family:"Source Sans 3";font-weight:400;src:url(../fonts/SourceSans3-400.woff2) format("woff2")}
@font-face{font-family:"Source Sans 3";font-weight:600;src:url(../fonts/SourceSans3-600.woff2) format("woff2")}
@font-face{font-family:"Source Sans 3";font-weight:700;src:url(../fonts/SourceSans3-700.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;src:url(../fonts/IBMPlexMono-500.woff2) format("woff2")}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Source Sans 3",system-ui,sans-serif;color:#111;background:#fff;font-size:14px;line-height:18px;width:390px;overflow-x:hidden}
.m1ap-a-m{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-weight:600}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.m1ap-a-hd{display:flex;align-items:center;gap:8px;height:52px;padding:0 10px;border-bottom:1px solid #EBEBEB}
.m1ap-a-logo{width:30px;height:30px;border-radius:10px;background:#111;display:grid;place-items:center}
.m1ap-a-hd b{font-size:18px;font-weight:600;flex:1}
.m1ap-a-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.m1ap-a-bx{background:#F5F5F5;border:1px solid #DADADA}
.m1ap-a-tabs{display:flex;margin:0 10px;border-bottom:1px solid #DADADA}
.m1ap-a-tabs a{flex:1;text-align:center;padding:8px 0;font-size:14px;color:#444;text-decoration:none}
.m1ap-a-tabs a.m1ap-a-on{color:#2F6EA8;font-weight:600;box-shadow:inset 0 -3px 0 #2F6EA8}
.m1ap-a-band{margin:8px 10px 0;border-radius:16px;background:#FAF8F3;padding:6px 8px 8px}
.m1ap-a-top{display:flex;align-items:center;gap:6px}
.m1ap-a-pill{display:flex;align-items:center;gap:2px;border-radius:16px;background:#fff;border:1px solid #E4E0D6;padding:1px}
.m1ap-a-pill button{width:28px;height:28px;border-radius:50%;font-size:17px}
.m1ap-a-pill b{font-size:15px;padding:0 4px}
.m1ap-a-due{margin-left:auto;display:flex;align-items:center;gap:5px;min-height:28px;padding:0 9px;border-radius:16px;background:#FDF1F0;border:1px solid #F1C9C5;font-size:13px;color:#8E2A23}
.m1ap-a-due i{width:8px;height:8px;border-radius:50%;background:#D6453D}
.m1ap-a-piles{display:grid;grid-template-columns:1.15fr 8px 1fr 1fr 1fr 10px .9fr;align-items:end;height:112px;gap:4px;margin-top:6px}
.m1ap-a-p{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px;text-align:center}
.m1ap-a-p b{font-size:12px;line-height:14px;white-space:nowrap;letter-spacing:-.4px}
.m1ap-a-st{border-radius:10px 6px 2px 2px;display:flex;flex-direction:column;overflow:hidden}
.m1ap-a-st i{display:block}
.m1ap-a-hat{background:repeating-linear-gradient(135deg,#E3B55D 0 4px,#FCEFD2 4px 8px);box-shadow:inset 0 0 0 1px #C99A3A}
.m1ap-a-sep{height:100%;border-left:1px dashed #BDBDBD;justify-self:center}
.m1ap-a-base{display:grid;grid-template-columns:1.15fr 8px 1fr 1fr 1fr 10px .9fr;gap:4px;border-top:2px solid #111;padding-top:3px}
.m1ap-a-base span{font-size:12px;color:#333;text-align:center;line-height:14px}
.m1ap-a-key{display:flex;gap:10px;margin-top:6px;font-size:12px;color:#444;align-items:center;flex-wrap:wrap}
.m1ap-a-key span{display:flex;align-items:center;gap:4px}
.m1ap-a-key i{width:13px;height:11px;border-radius:3px;display:inline-block}
.m1ap-a-key b{font-size:13px;color:#111}
.m1ap-a-g{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;padding:5px 10px 1px;background:#fff}
.m1ap-a-g .m1ap-a-sq{width:22px;height:22px;border-radius:10px;display:grid;place-items:center}
.m1ap-a-g b{font-size:13px;letter-spacing:.02em}
.m1ap-a-g .m1ap-a-sub{font-size:13px;color:#444}
.m1ap-a-op{display:grid;grid-template-columns:4px 1fr auto;column-gap:8px;padding:2px 10px 5px 10px;border-bottom:1px solid #F0F0F0;align-items:center;background:#fff}
.m1ap-a-bar{grid-row:1/3;align-self:stretch;border-radius:2px}
.m1ap-a-q{font-size:14px;font-weight:600;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m1ap-a-q small{font-weight:400;color:#555;font-size:13px}
.m1ap-a-a{font-size:14px;text-align:right}
.m1ap-a-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:#555;line-height:16px;min-height:18px}
.m1ap-a-tg{display:inline-flex;align-items:center;gap:3px;padding:0 6px;border-radius:999px;line-height:16px;font-size:12px;white-space:nowrap}
.m1ap-a-ok{background:#E8F5EC;color:#22663A}
.m1ap-a-pay{background:repeating-linear-gradient(135deg,#FBEBC9 0 4px,#FFF7E6 4px 8px);color:#6E500F;box-shadow:inset 0 0 0 1px #E3C27E}
.m1ap-a-late{background:#FDECEA;color:#8E2A23;box-shadow:inset 0 0 0 1px #F1C9C5}
.m1ap-a-pc{display:inline-flex;align-items:center;gap:2px;color:#555;white-space:nowrap}
.m1ap-a-pc.m1ap-a-no{color:#7A5500}
.m1ap-a-act{grid-column:3;justify-self:end;margin:1px 0 -4px}
.m1ap-a-btn{min-height:24px;padding:0 10px;border-radius:16px;background:#111;color:#fff;font-size:13px;font-weight:600}
.m1ap-a-mini{min-height:24px;padding:0 7px;border-radius:10px;border:1px solid #D9D9D9;font-size:12px;color:#444;background:#fff}
.m1ap-a-part{margin:4px 10px 0;border-top:1px dashed #BDBDBD}
.m1ap-a-foot{display:flex;gap:6px;flex-wrap:wrap;padding:10px}
.m1ap-a-foot button{min-height:30px;padding:0 10px;border-radius:10px;background:#F5F5F5;font-size:13px;color:#444;display:inline-flex;align-items:center;gap:4px}
.m1ap-a-foot .m1ap-a-ia{border:1px dashed #A9C9E8;background:#fff;color:#2F6EA8}
.m1ap-a-foot .m1ap-a-prs{background:#111;color:#fff;font-weight:600}
.m1ap-a-foot .m1ap-a-urg{background:#FDF1F0;color:#8E2A23;box-shadow:inset 0 0 0 1px #F1C9C5}
.m1ap-a-n{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#D6453D;color:#fff;font-size:12px;font-weight:600;line-height:18px}
.m1ap-a-prs .m1ap-a-n{background:#fff;color:#111}
.m1ap-a-ex{font-size:12px;color:#666;padding:0 10px}
.m1ap-a-nav{position:relative;height:64px;background:#fff;border-top:1px solid #EBEBEB;display:flex;padding-right:76px;margin-top:12px}
.m1ap-a-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:#444;text-decoration:none;max-width:110px}
.m1ap-a-nav a.m1ap-a-on{background:#E6EFF8;color:#111;font-weight:600;box-shadow:inset 0 3px 0 #2F6EA8}
.m1ap-a-fab{position:absolute;right:10px;top:6px;width:60px;height:52px;border-radius:26px;background:#111;color:#fff;font-size:30px}
.m1ap-a-back{position:relative}
.m1ap-a-voile::after{content:"";position:absolute;inset:0;background:rgba(17,17,17,.44)}
.m1ap-a-sheet{position:relative;z-index:2;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);padding:6px 12px 16px}
.m1ap-a-grab{width:40px;height:4px;border-radius:2px;background:#CFCFCF;margin:0 auto 8px}
.m1ap-a-shd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.m1ap-a-shd h2{font-size:18px;line-height:22px;font-weight:700;flex:1}
.m1ap-a-x{width:32px;height:32px;border-radius:10px;background:#F5F5F5;display:grid;place-items:center;font-size:20px;color:#444}
.m1ap-a-cta{width:100%;min-height:44px;border-radius:14px;background:#111;color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.m1ap-a-sec{min-height:44px;border-radius:14px;background:#F5F5F5;color:#111;font-weight:600;padding:0 14px}
.m1ap-a-lien{color:#2F6EA8;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px;min-height:28px}

.m1ap-a-f{display:flex;flex-direction:column;gap:3px;margin-top:10px}
.m1ap-a-f>span{font-size:12px;color:#555}
.m1ap-a-in{display:flex;align-items:center;gap:6px;min-height:44px;border:1px solid #CFCFCF;border-radius:12px;padding:0 12px;background:#fff}
.m1ap-a-in input{border:0;outline:0;flex:1;min-width:0;font-size:16px;background:none}
.m1ap-a-chips{display:flex;gap:5px;flex-wrap:wrap}
.m1ap-a-c{min-height:32px;padding:0 11px;border-radius:16px;border:1px solid #D9D9D9;font-size:13px;background:#fff}
.m1ap-a-c.m1ap-a-on{background:#111;color:#fff;border-color:#111;font-weight:600}
.m1ap-a-dir{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.m1ap-a-d{min-height:52px;border-radius:14px;border:1px solid #D9D9D9;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:14px;text-align:left;line-height:16px}
.m1ap-a-d.m1ap-a-on{border:2px solid #111;background:#F6FBF7}
.m1ap-a-d i{font-style:normal;font-size:20px;width:26px;text-align:center}
.m1ap-a-amt input{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:22px}
.m1ap-a-amt b{font-size:14px;color:#555}
.m1ap-a-info{margin-top:10px;font-size:12px;color:#555;display:flex;gap:6px;align-items:center}
</style>
</head>
