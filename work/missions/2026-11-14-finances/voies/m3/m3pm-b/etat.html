<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>m3pm-b — Projet matériel : le minimum, le reste à un toucher (froide)</title>
<style>
:root{--page:#FFFFFF;--panel:#F5F5F5;--bord:#DDDDDD;--bordm:#BFBFBF;--t2:#666666;--t1:#333333;--t0:#111111;
--fin:#1F64A3;--finc:#86B9E6;--fint:#E6EFF8;--alerte:#C8382F;--alertet:#A8291F;--alertef:#FBE9E7;--vert:#2A7347;--vertf:#E4F1E8;
--brassin:#9A4F1E;--brassint:#FBEDE3;--frigo:#176878;--frigot:#E2F2F5;
--sans:"Source Sans 3","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",Consolas,ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;font-family:var(--sans);font-size:14px;line-height:1.3;color:var(--t1);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.m3pm-b-f{position:relative;width:390px;min-height:844px;background:#4a4a4a;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.m3pm-b-f::before{content:"";flex:0 0 52px}
.m3pm-b-bg{position:absolute;top:0;left:0;width:390px;height:844px;display:block}
.m3pm-b-voile{position:absolute;inset:0;background:rgba(17,17,17,.48)}
.m3pm-b-sh{margin-top:0!important;min-height:0!important;position:relative;background:var(--page);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px -14px rgba(0,0,0,.55);display:flex;flex-direction:column}
.m3pm-b-poi{width:36px;height:4px;border-radius:2px;background:var(--bordm);margin:6px auto 0}
.m3pm-b-m{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg.m3pm-b-i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.m3pm-b-x{width:32px;height:32px;border:0;background:none;color:var(--t2);display:flex;align-items:center;justify-content:center;border-radius:10px;flex-shrink:0}
.m3pm-b-pied{display:flex;gap:8px;padding:8px 10px 12px;border-top:1px solid var(--bord);background:var(--page)}
.m3pm-b-btn{height:44px;border-radius:10px;font-weight:600;font-size:15px;border:1px solid var(--bordm);background:var(--page);color:var(--t0);padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.m3pm-b-btn.m3pm-b-pri{flex:1;background:var(--t0);border-color:var(--t0);color:#fff}
.m3pm-b-lab{font-size:12px;color:var(--t2);display:block;margin-bottom:3px}
.m3pm-b-in{display:flex;align-items:center;gap:6px;width:100%;height:36px;border:1px solid var(--bordm);border-radius:10px;padding:0 10px;font-size:16px;color:var(--t0);background:var(--page)}
.m3pm-b-in::placeholder{color:#8a8a8a}
.m3pm-b-muet{font-size:12px;color:var(--t2)}
.m3pm-b-h{display:flex;align-items:flex-start;padding:4px 6px 0 12px}
.m3pm-b-h h2{flex:1;font-size:21px;font-weight:600;color:var(--t0);line-height:26px}
.m3pm-b-et{display:flex;gap:4px;padding:2px 12px 0}
.m3pm-b-et span{height:22px;padding:0 8px;border-radius:10px;font-size:12px;display:inline-flex;align-items:center;background:var(--panel);color:var(--t1);border:1px solid var(--bord)}
.m3pm-b-et span.m3pm-b-st{background:var(--fint);color:var(--fin);border-color:var(--finc);font-weight:600}
.m3pm-b-chiffre{display:flex;align-items:baseline;gap:10px;padding:10px 12px 4px}
.m3pm-b-chiffre b{font-family:var(--mono);font-size:32px;font-weight:600;color:var(--t0);letter-spacing:-.5px}
.m3pm-b-chiffre span{font-size:14px;color:var(--t1)}
.m3pm-b-chiffre em{margin-left:auto;font-style:normal;display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 10px;border:1px solid var(--bordm);border-radius:10px;font-size:14px;color:var(--t0)}
.m3pm-b-inc{display:flex;align-items:center;gap:10px;margin:6px 12px;padding:0 10px;height:48px;border-radius:10px;background:var(--fint)}
.m3pm-b-inc span{flex:1;font-size:15px;font-weight:600;color:var(--fin)}
.m3pm-b-inc small{font-size:12px;font-weight:400;color:var(--t1)}
.m3pm-b-sw{width:44px;height:26px;border-radius:13px;background:var(--fin);position:relative}
.m3pm-b-sw::after{content:"";position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.m3pm-b-tout{display:flex;align-items:center;gap:6px;margin:2px 12px 8px;height:40px;border-top:1px solid var(--bord);font-size:14px;color:var(--t0)}
.m3pm-b-tout span{flex:1}.m3pm-b-tout em{font-style:normal;font-size:12px;color:var(--t2)}
</style></head><body>
<div class="m3pm-b-f"><img class="m3pm-b-bg" src="../../../ref/p5b/p5b-haut.png" alt=""><div class="m3pm-b-voile"></div><div class="m3pm-b-sh">
<div class="m3pm-b-poi"></div>
<div class="m3pm-b-h"><h2>Frigo</h2><button class="m3pm-b-x" aria-label="Fermer"><svg class="m3pm-b-i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div class="m3pm-b-et"><span class="m3pm-b-st">Prêt à acheter</span><span>Bientôt</span></div>
<div class="m3pm-b-chiffre"><b>3 000,00</b><span>CHF</span><em data-booster="mois"><svg class="m3pm-b-i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>nov. 2026</em></div>
<div class="m3pm-b-inc" data-booster="inclure"><span>Dans mes prévisions <small>· le 15.11</small></span><i class="m3pm-b-sw" role="switch" aria-checked="true"></i></div>
<div class="m3pm-b-tout"><span>Besoin, prix détaillé, usure, notes</span><em>pose ? · usure 5 ans</em><svg class="m3pm-b-i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
<footer class="m3pm-b-pied" style="margin-top:auto"><button class="m3pm-b-btn">Annuler</button><button class="m3pm-b-btn m3pm-b-pri">Enregistrer</button></footer>
</div></div>
</body></html>
