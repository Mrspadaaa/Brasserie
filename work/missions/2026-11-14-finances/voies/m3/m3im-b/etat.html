<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>m3im-b — Immobilisation : ce qu'elle perd cette année, le reste à un toucher (froide)</title>
<style>
:root{--page:#FFFFFF;--panel:#F5F5F5;--bord:#DDDDDD;--bordm:#BFBFBF;--t2:#666666;--t1:#333333;--t0:#111111;
--fin:#1F64A3;--finc:#86B9E6;--fint:#E6EFF8;--alerte:#C8382F;--alertet:#A8291F;--alertef:#FBE9E7;--vert:#2A7347;--vertf:#E4F1E8;
--brassin:#9A4F1E;--brassint:#FBEDE3;--frigo:#176878;--frigot:#E2F2F5;
--sans:"Source Sans 3","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",Consolas,ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;font-family:var(--sans);font-size:14px;line-height:1.3;color:var(--t1);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.m3im-b-f{position:relative;width:390px;min-height:844px;background:#4a4a4a;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.m3im-b-f::before{content:"";flex:0 0 52px}
.m3im-b-bg{position:absolute;top:0;left:0;width:390px;height:844px;display:block}
.m3im-b-voile{position:absolute;inset:0;background:rgba(17,17,17,.48)}
.m3im-b-sh{margin-top:0!important;min-height:0!important;position:relative;background:var(--page);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px -14px rgba(0,0,0,.55);display:flex;flex-direction:column}
.m3im-b-poi{width:36px;height:4px;border-radius:2px;background:var(--bordm);margin:6px auto 0}
.m3im-b-m{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg.m3im-b-i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.m3im-b-x{width:32px;height:32px;border:0;background:none;color:var(--t2);display:flex;align-items:center;justify-content:center;border-radius:10px;flex-shrink:0}
.m3im-b-pied{display:flex;gap:8px;padding:8px 10px 12px;border-top:1px solid var(--bord);background:var(--page)}
.m3im-b-btn{height:44px;border-radius:10px;font-weight:600;font-size:15px;border:1px solid var(--bordm);background:var(--page);color:var(--t0);padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.m3im-b-btn.m3im-b-pri{flex:1;background:var(--t0);border-color:var(--t0);color:#fff}
.m3im-b-lab{font-size:12px;color:var(--t2);display:block;margin-bottom:3px}
.m3im-b-in{display:flex;align-items:center;gap:6px;width:100%;height:36px;border:1px solid var(--bordm);border-radius:10px;padding:0 10px;font-size:16px;color:var(--t0);background:var(--page)}
.m3im-b-in::placeholder{color:#8a8a8a}
.m3im-b-muet{font-size:12px;color:var(--t2)}
.m3im-b-sh{margin-top:470px;min-height:374px}
.m3im-b-h{display:flex;align-items:center;padding:2px 6px 0 12px}
.m3im-b-h h2{flex:1;font-size:18px;font-weight:600;color:var(--t0)}
.m3im-b-big{display:flex;align-items:center;gap:12px;padding:6px 12px 2px}
.m3im-b-big div{display:flex;flex-direction:column}
.m3im-b-big span{font-size:12px;color:var(--t2)}
.m3im-b-big b{font-family:var(--mono);font-size:30px;font-weight:600;color:var(--t0)}
.m3im-b-big p{margin-left:auto;font-family:var(--mono);font-size:14px;color:var(--t1);text-align:right;line-height:18px}
.m3im-b-big p em{font-style:normal;font-family:var(--sans);font-size:12px;color:var(--t2);display:block}
.m3im-b-faits{display:grid;grid-template-columns:auto auto 1fr;gap:4px;padding:8px 12px 4px}
.m3im-b-faits span{height:28px;padding:0 9px;border-radius:10px;border:1px solid var(--bord);background:var(--panel);display:inline-flex;align-items:center;font-size:13px;color:var(--t1);white-space:nowrap}
.m3im-b-faits span b{font-family:var(--mono);font-weight:600;margin-right:4px}
.m3im-b-conf{display:flex;align-items:center;gap:6px;margin:4px 12px;font-size:13px;color:var(--vert);font-weight:600}
.m3im-b-conf svg{width:16px;height:16px}
.m3im-b-tout{display:flex;align-items:center;gap:6px;margin:4px 12px 6px;height:40px;border-top:1px solid var(--bord);font-size:14px;color:var(--t0)}
.m3im-b-tout span{flex:1}.m3im-b-tout em{font-style:normal;font-size:12px;color:var(--t2)}
</style></head><body>
<div class="m3im-b-f"><img class="m3im-b-bg" src="../../../ref/g6/g6-4-materiel.png" alt=""><div class="m3im-b-voile"></div><div class="m3im-b-sh">
<div class="m3im-b-poi"></div>
<div class="m3im-b-h"><h2>Cuve de fermentation</h2><button class="m3im-b-x" aria-label="Fermer"><svg class="m3im-b-i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div class="m3im-b-big" data-booster="perte-annee"><div><span>Elle perd en 2026</span><b>−288,00</b></div><p>1 440,00 → 1 152,00<em>1er janv. → 31 déc.</em></p></div>
<div class="m3im-b-faits" data-booster="faits"><span><b>1 800,00</b>févr. 2025</span><span>Cuves · 20 % du reste</span></div>
<div class="m3im-b-conf"><svg class="m3im-b-i" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>Départ 2026 confirmé</div>
<div class="m3im-b-tout"><span>Achat lié, dates, part pro, vente</span><em>tout à 100 %</em><svg class="m3im-b-i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></div>
<footer class="m3im-b-pied" style="margin-top:auto"><button class="m3im-b-btn">Annuler</button><button class="m3im-b-btn m3im-b-pri">Enregistrer</button></footer>
</div></div>
</body></html>
