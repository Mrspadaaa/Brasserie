<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>m3pr-b — Ajouter une prévision : trois champs au-dessus du clavier (froide)</title>
<style>
:root{--page:#FFFFFF;--panel:#F5F5F5;--bord:#DDDDDD;--bordm:#BFBFBF;--t2:#666666;--t1:#333333;--t0:#111111;
--fin:#1F64A3;--finc:#86B9E6;--fint:#E6EFF8;--alerte:#C8382F;--alertet:#A8291F;--alertef:#FBE9E7;--vert:#2A7347;--vertf:#E4F1E8;
--brassin:#9A4F1E;--brassint:#FBEDE3;--frigo:#176878;--frigot:#E2F2F5;
--sans:"Source Sans 3","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",Consolas,ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#fff;font-family:var(--sans);font-size:14px;line-height:1.3;color:var(--t1);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.m3pr-b-f{position:relative;width:390px;min-height:844px;background:#4a4a4a;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.m3pr-b-f::before{content:"";flex:0 0 52px}
.m3pr-b-bg{position:absolute;top:0;left:0;width:390px;height:844px;display:block}
.m3pr-b-voile{position:absolute;inset:0;background:rgba(17,17,17,.48)}
.m3pr-b-sh{margin-top:0!important;min-height:0!important;position:relative;background:var(--page);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px -14px rgba(0,0,0,.55);display:flex;flex-direction:column}
.m3pr-b-poi{width:36px;height:4px;border-radius:2px;background:var(--bordm);margin:6px auto 0}
.m3pr-b-m{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg.m3pr-b-i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.m3pr-b-x{width:32px;height:32px;border:0;background:none;color:var(--t2);display:flex;align-items:center;justify-content:center;border-radius:10px;flex-shrink:0}
.m3pr-b-pied{display:flex;gap:8px;padding:8px 10px 12px;border-top:1px solid var(--bord);background:var(--page)}
.m3pr-b-btn{height:44px;border-radius:10px;font-weight:600;font-size:15px;border:1px solid var(--bordm);background:var(--page);color:var(--t0);padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.m3pr-b-btn.m3pr-b-pri{flex:1;background:var(--t0);border-color:var(--t0);color:#fff}
.m3pr-b-lab{font-size:12px;color:var(--t2);display:block;margin-bottom:3px}
.m3pr-b-in{display:flex;align-items:center;gap:6px;width:100%;height:36px;border:1px solid var(--bordm);border-radius:10px;padding:0 10px;font-size:16px;color:var(--t0);background:var(--page)}
.m3pr-b-in::placeholder{color:#8a8a8a}
.m3pr-b-muet{font-size:12px;color:var(--t2)}
.m3pr-b-sh{position:absolute;left:0;right:0;bottom:222px}
.m3pr-b-hd{display:flex;align-items:center;padding:2px 6px 0 12px;font-size:13px;color:var(--t2);font-weight:600}
.m3pr-b-hd span{flex:1}
.m3pr-b-nom{border:0;outline:0;font-size:22px;font-weight:600;color:var(--t0);padding:0 12px;width:100%;height:34px;background:none}
.m3pr-b-ligne{display:flex;align-items:baseline;gap:10px;padding:2px 12px 0}
.m3pr-b-mt{display:flex;align-items:baseline;gap:6px;flex:1;border-bottom:2px solid var(--t0);padding-bottom:2px}
.m3pr-b-mt input{border:0;outline:0;font-family:var(--mono);font-size:34px;font-weight:600;color:var(--t0);width:100%;background:none;font-variant-numeric:tabular-nums}
.m3pr-b-mt small{font-size:13px;color:var(--t2)}
.m3pr-b-curseur{display:inline-block;width:2px;height:30px;background:var(--fin);vertical-align:-4px;margin-left:-6px}
.m3pr-b-date{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px;border:1px solid var(--bordm);border-radius:10px;font-size:14px;color:var(--t0);white-space:nowrap}
.m3pr-b-regl{display:flex;gap:6px;padding:10px 12px 8px;flex-wrap:wrap}
.m3pr-b-regl button{display:inline-flex;align-items:center;gap:3px;height:28px;padding:0 6px 0 10px;border:1px solid var(--bord);background:var(--panel);border-radius:10px;font-size:13px;color:var(--t1)}
.m3pr-b-regl button svg{width:14px;height:14px;color:var(--t2)}
.m3pr-b-regl b{font-weight:600}
.m3pr-b-plus{display:flex;align-items:center;gap:6px;margin:0 12px 8px;height:32px;font-size:13px;color:var(--fin);font-weight:600}
.m3pr-b-plus span{color:var(--t2);font-weight:400;flex:1}
.m3pr-b-pied{border-top:0;padding-top:4px}
.m3pr-b-clav{position:absolute;left:0;right:0;bottom:0;height:222px;background:#D2D5DB;padding:6px 5px 8px;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:46px;gap:6px}
.m3pr-b-clav span{background:#fff;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:22px;color:#000;box-shadow:0 1px 0 #898A8D}
.m3pr-b-clav span small{font-size:9px;letter-spacing:1.5px;color:#333}
.m3pr-b-clav span.m3pr-b-k{background:#ADB3BC}
</style></head><body>
<div class="m3pr-b-f"><img class="m3pr-b-bg" src="../../../ref/p5b/p5b-haut.png" alt=""><div class="m3pr-b-voile"></div><div class="m3pr-b-sh">
<div class="m3pr-b-poi"></div>
<div class="m3pr-b-hd"><span>Prévoir une dépense</span><button class="m3pr-b-x" aria-label="Fermer"><svg class="m3pr-b-i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<input class="m3pr-b-nom" value="Électricité" aria-label="Libellé">
<div class="m3pr-b-ligne">
 <label class="m3pr-b-mt"><input inputmode="decimal" value="68,00" aria-label="Montant"><small>CHF</small></label>
 <span class="m3pr-b-date" data-booster="date"><svg class="m3pr-b-i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>9 déc.</span></span>
</div>
<div class="m3pr-b-regl" data-booster="reglages">
 <button><b>À payer</b><svg class="m3pr-b-i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><button>Charges fixes<svg class="m3pr-b-i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><button>chaque mois<svg class="m3pr-b-i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
</div>
<div class="m3pr-b-plus"><svg class="m3pr-b-i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Fournisseur, note, coût des brassins<span>à confirmer</span></div>
<footer class="m3pr-b-pied"><button class="m3pr-b-btn m3pr-b-pri">Enregistrer</button></footer>
</div>
<div class="m3pr-b-clav" aria-hidden="true">
 <span>1</span><span>2<small>ABC</small></span><span>3<small>DEF</small></span>
 <span>4<small>GHI</small></span><span>5<small>JKL</small></span><span>6<small>MNO</small></span>
 <span>7<small>PQRS</small></span><span>8<small>TUV</small></span><span>9<small>WXYZ</small></span>
 <span class="m3pr-b-k">,</span><span>0</span><span class="m3pr-b-k">⌫</span>
</div></div>
</body></html>
