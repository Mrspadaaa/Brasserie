<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>m2pa-b · Payer, froide : un seul geste, le reste à un toucher</title>
<style>
@font-face{font-family:"Source Sans 3";font-weight:400;src:url(../fonts/SourceSans3-400.woff2) format("woff2")}
@font-face{font-family:"Source Sans 3";font-weight:600;src:url(../fonts/SourceSans3-600.woff2) format("woff2")}
@font-face{font-family:"Source Sans 3";font-weight:700;src:url(../fonts/SourceSans3-700.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;src:url(../fonts/IBMPlexMono-500.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:600;src:url(../fonts/IBMPlexMono-600.woff2) format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Source Sans 3",system-ui,sans-serif;color:#111;background:#fff;font-size:14px;line-height:18px}
.m2pa-b-m{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-weight:600}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.m2pa-b-hd{display:flex;align-items:center;gap:8px;height:52px;padding:0 10px;border-bottom:1px solid #EBEBEB}
.m2pa-b-logo{width:30px;height:30px;border-radius:10px;background:#111;display:grid;place-items:center}
.m2pa-b-hd b{font-size:18px;font-weight:600;flex:1}
.m2pa-b-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.m2pa-b-bx{background:#F5F5F5;border:1px solid #DADADA}
.m2pa-b-app{max-width:760px;margin:0 auto;padding-bottom:84px}
.m2pa-b-tabs{display:flex;margin:0 10px;border-bottom:1px solid #DADADA}
.m2pa-b-tabs a{flex:1;text-align:center;padding:8px 0;font-size:14px;color:#444;text-decoration:none}
.m2pa-b-tabs a.m2pa-b-on{color:#2F6EA8;font-weight:600;box-shadow:inset 0 -3px 0 #2F6EA8}
/* bandeau : mois + piles basses, d'un seul bloc */
.m2pa-b-band{margin:8px 10px 0;border-radius:16px;background:#FAF8F3;padding:6px 8px 8px}
.m2pa-b-top{display:flex;align-items:center;gap:6px}
.m2pa-b-pill{display:flex;align-items:center;gap:2px;border-radius:16px;background:#fff;border:1px solid #E4E0D6;padding:1px}
.m2pa-b-pill button{width:28px;height:28px;border-radius:50%;font-size:17px}
.m2pa-b-pill b{font-size:15px;padding:0 4px}
.m2pa-b-due{margin-left:auto;display:flex;align-items:center;gap:5px;min-height:28px;padding:0 9px;border-radius:16px;background:#FDF1F0;border:1px solid #F1C9C5;font-size:13px;color:#8E2A23}
.m2pa-b-due i{width:8px;height:8px;border-radius:50%;background:#D6453D}
.m2pa-b-piles{display:grid;grid-template-columns:1.15fr 8px 1fr 1fr 1fr 10px .9fr;align-items:end;height:112px;gap:4px;margin-top:6px}
.m2pa-b-p{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px;text-align:center}
.m2pa-b-p b{font-size:12px;line-height:14px}
.m2pa-b-st{border-radius:10px 6px 2px 2px;display:flex;flex-direction:column;overflow:hidden}
.m2pa-b-st i{display:block}
.m2pa-b-hat{background:repeating-linear-gradient(135deg,#E3B55D 0 4px,#FCEFD2 4px 8px);box-shadow:inset 0 0 0 1px #C99A3A}
.m2pa-b-sep{height:100%;border-left:1px dashed #BDBDBD;justify-self:center}
.m2pa-b-base{display:grid;grid-template-columns:1.15fr 8px 1fr 1fr 1fr 10px .9fr;gap:4px;border-top:2px solid #111;padding-top:3px}
.m2pa-b-base span{font-size:12px;color:#333;text-align:center;line-height:14px}
.m2pa-b-key{display:flex;gap:10px;margin-top:6px;font-size:12px;color:#444;align-items:center;flex-wrap:wrap}
.m2pa-b-key span{display:flex;align-items:center;gap:4px}
.m2pa-b-key i{width:13px;height:11px;border-radius:3px;display:inline-block}
.m2pa-b-key b{font-size:13px;color:#111}
/* liste : groupes toujours ouverts, une opération = un bloc de deux étages */
.m2pa-b-g{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;padding:5px 10px 1px;position:sticky;top:0;background:#fff}
.m2pa-b-g .m2pa-b-sq{width:22px;height:22px;border-radius:10px;display:grid;place-items:center}
.m2pa-b-g b{font-size:13px;letter-spacing:.02em}
.m2pa-b-g .m2pa-b-sub{font-size:13px;color:#444}
.m2pa-b-op{display:grid;grid-template-columns:4px 1fr auto;column-gap:8px;padding:2px 10px 5px 10px;border-bottom:1px solid #F0F0F0;align-items:center}
.m2pa-b-bar{grid-row:1/3;align-self:stretch;border-radius:2px}
.m2pa-b-q{font-size:14px;font-weight:600;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m2pa-b-q small{font-weight:400;color:#555;font-size:13px}
.m2pa-b-a{font-size:14px;text-align:right}
.m2pa-b-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:#555;line-height:16px;min-height:18px}
.m2pa-b-tg{display:inline-flex;align-items:center;gap:3px;padding:0 6px;border-radius:999px;line-height:16px;font-size:12px}
.m2pa-b-ok{background:#E8F5EC;color:#22663A}
.m2pa-b-pay{background:repeating-linear-gradient(135deg,#FBEBC9 0 4px,#FFF7E6 4px 8px);color:#6E500F;box-shadow:inset 0 0 0 1px #E3C27E}
.m2pa-b-late{background:#FDECEA;color:#8E2A23;box-shadow:inset 0 0 0 1px #F1C9C5}
.m2pa-b-pc{display:inline-flex;align-items:center;gap:2px;color:#555}
.m2pa-b-pc.m2pa-b-no{color:#7A5500}
.m2pa-b-act{grid-column:3;justify-self:end;margin:1px 0 -4px}
.m2pa-b-btn{min-height:24px;padding:0 10px;border-radius:16px;background:#111;color:#fff;font-size:13px;font-weight:600}
.m2pa-b-mini{min-height:24px;padding:0 7px;border-radius:10px;border:1px solid #D9D9D9;font-size:12px;color:#444;background:#fff}
.m2pa-b-part{margin:4px 10px 0;border-top:1px dashed #BDBDBD}
.m2pa-b-foot{display:flex;gap:6px;flex-wrap:wrap;padding:10px}
.m2pa-b-foot button{min-height:30px;padding:0 10px;border-radius:10px;background:#F5F5F5;font-size:13px;color:#444}
.m2pa-b-foot .m2pa-b-ia{border:1px dashed #A9C9E8;background:#fff;color:#2F6EA8}
.m2pa-b-ex{font-size:12px;color:#666;padding:0 10px}
.m2pa-b-nav{position:fixed;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:1px solid #EBEBEB;display:flex;padding-right:76px;z-index:5}
.m2pa-b-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:#444;text-decoration:none;max-width:110px}
.m2pa-b-nav a.m2pa-b-on{background:#E6EFF8;color:#111;font-weight:600;box-shadow:inset 0 3px 0 #2F6EA8}
.m2pa-b-fab{position:fixed;right:10px;bottom:6px;width:60px;height:52px;border-radius:26px;background:#111;color:#fff;font-size:30px;z-index:6}
/* annexe : l'état après « ✓ Payé » */
.m2pa-b-annex{margin:18px 10px 0;border:1px solid #DADADA;border-radius:16px;padding:10px 0 6px;background:#fff}
.m2pa-b-annex h2{font-size:13px;font-weight:600;color:#2F6EA8;padding:0 10px 6px}
.m2pa-b-flash{background:#F1FAF3}
@media (min-width:900px){.m2pa-b-app{max-width:1120px;display:grid;grid-template-columns:400px 1fr;gap:0 24px;align-items:start}.m2pa-b-full{grid-column:1/3}.m2pa-b-left{position:sticky;top:0}.m2pa-b-piles{height:200px}.m2pa-b-nav{justify-content:center}}


.m2pa-b-fond{position:relative;height:250px;overflow:hidden}
.m2pa-b-fond .m2pa-b-nav,.m2pa-b-fond .m2pa-b-fab{display:none}
.m2pa-b-voile{position:absolute;inset:0;background:rgba(17,17,17,.46);z-index:3}
.m2pa-b-sh{position:relative;z-index:4;margin-top:-30px;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.20);padding:6px 14px 22px;min-height:624px}
.m2pa-b-grab{width:40px;height:5px;border-radius:3px;background:#D4D4D4;margin:2px auto 10px}
.m2pa-b-x{width:36px;height:36px;border-radius:12px;background:#F5F5F5;border:1px solid #DADADA;display:grid;place-items:center;flex:none}
.m2pa-b-mu{color:#555}
.m2pa-b-b1{min-height:44px;padding:0 18px;border-radius:16px;background:#111;color:#fff;font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.m2pa-b-b2{min-height:44px;padding:0 14px;border-radius:14px;background:#F5F5F5;border:1px solid #DADADA;font-size:15px;color:#222;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.m2pa-b-lk{color:#2F6EA8;font-weight:600}
input.m2pa-b-in{font:inherit;border:1px solid #DADADA;border-radius:12px;height:44px;padding:0 12px;font-size:16px;width:100%;background:#fff;color:#111}
input.m2pa-b-in:focus{outline:2px solid #2F6EA8;outline-offset:-1px}


.m2pa-b-sh{padding-bottom:16px}
.m2pa-b-l1{display:flex;align-items:center;gap:8px;font-size:15px;margin-bottom:12px}
.m2pa-b-l1 span{flex:1}
.m2pa-b-go{width:100%;min-height:64px;border-radius:20px;background:#111;color:#fff;display:flex;align-items:center;gap:12px;padding:0 18px;text-align:left}
.m2pa-b-go b{font-size:18px}
.m2pa-b-go small{display:block;font-size:13px;color:#C9C9C9;font-weight:400}
.m2pa-b-go .m2pa-b-m{margin-left:auto;font-size:22px}
.m2pa-b-oth{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;min-height:44px;margin-top:4px;font-size:15px;color:#2F6EA8;font-weight:600}
.m2pa-b-sep{margin:6px 0 2px;border-top:1px solid #EBEBEB}
.m2pa-b-ln{display:grid;grid-template-columns:58px 1fr;align-items:center;gap:8px;min-height:48px;border-bottom:1px solid #F0F0F0}
.m2pa-b-ln label{font-size:14px;color:#555}
.m2pa-b-chips{display:flex;gap:6px;flex-wrap:wrap}
.m2pa-b-chips button{min-height:36px;padding:0 10px;border-radius:999px;border:1px solid #DADADA;font-size:14px}
.m2pa-b-chips .m2pa-b-on{background:#111;border-color:#111;color:#fff;font-weight:600}
input.m2pa-b-in.m2pa-b-a{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:18px;text-align:right;width:130px}
.m2pa-b-rest{font-size:13px;margin-left:8px}

</style>
</head>
<body>
<div class="m2pa-b-fond"><header class="m2pa-b-hd">
  <span class="m2pa-b-logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2C14E" stroke-width="2.2"><path d="M6 5h10v15H6z"/><path d="M16 9h3v6h-3"/></svg></span>
  <b>L'Affinée</b>
  <span class="m2pa-b-ic" aria-label="Thème"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#444" stroke-width="1.8"><path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/></svg></span>
  <button class="m2pa-b-ic m2pa-b-bx" aria-label="Rechercher"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg></button>
  <button class="m2pa-b-ic m2pa-b-bx" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="#111"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
</header>

<div class="m2pa-b-app">
 <div class="m2pa-b-full">
  <nav class="m2pa-b-tabs" aria-label="Finances"><a href="#">Synthèse</a><a href="#" class="m2pa-b-on">Opérations</a><a href="#">Prévisions</a><a href="#">Annuel</a></nav>
 </div>

 <div class="m2pa-b-left">
  <section class="m2pa-b-band" aria-label="Le mois par catégorie" data-booster="piles-basses">
   <div class="m2pa-b-top">
    <span class="m2pa-b-pill"><button aria-label="Mois précédent">‹</button><b>novembre</b><button aria-label="Mois suivant">›</button></span>
    <button class="m2pa-b-due" data-booster="pastille-retard"><i></i>en retard <b class="m2pa-b-m">60,00</b></button>
   </div>
   <div class="m2pa-b-piles">
    <div class="m2pa-b-p"><b class="m2pa-b-m" style="color:#2A7240">+720,00</b><span class="m2pa-b-st" style="height:88px"><i style="flex:1;background:#56D27B"></i></span></div>
    <span class="m2pa-b-sep"></span>
    <div class="m2pa-b-p"><b class="m2pa-b-m">468,00</b><span class="m2pa-b-st" style="height:57px"><i class="m2pa-b-hat" style="flex:400"></i><i style="flex:68;background:#9856D2"></i></span></div>
    <div class="m2pa-b-p"><b class="m2pa-b-m">186,80</b><span class="m2pa-b-st" style="height:23px"><i style="flex:1;background:#D2B356"></i></span></div>
    <div class="m2pa-b-p"><b class="m2pa-b-m">42,00</b><span class="m2pa-b-st" style="height:6px"><i style="flex:1;background:#56C1D2"></i></span></div>
    <span class="m2pa-b-sep"></span>
    <div class="m2pa-b-p"><b class="m2pa-b-m">28,60</b><span class="m2pa-b-st" style="height:4px"><i style="flex:1;background:#567BD2"></i></span></div>
   </div>
   <div class="m2pa-b-base"><span>Ventes</span><span></span><span>Fixes</span><span>Brassage</span><span>Nettoyage</span><span></span><span>Matériel</span></div>
   <div class="m2pa-b-key"><span><i style="background:linear-gradient(90deg,#9856D2 25%,#D2B356 25% 50%,#56C1D2 50% 75%,#567BD2 75%)"></i>payé <b class="m2pa-b-m">325,40</b></span><span><i class="m2pa-b-hat"></i>à payer <b class="m2pa-b-m">400,00</b></span><span>dépensé <b class="m2pa-b-m">696,80</b></span></div>
  </section>
 </div>

 </div><div class="m2pa-b-voile"></div></div>
<section class="m2pa-b-sh" aria-label="Payer">
 <div class="m2pa-b-grab"></div>
 <div class="m2pa-b-l1"><span><b>Loyer de l'atelier</b> <span class="m2pa-b-mu">· Atelier</span></span><span class="m2pa-b-tg m2pa-b-pay" style="flex:none">à payer · 25 nov.</span></div>
 <button class="m2pa-b-go" data-booster="paye-un-geste"><span><b>✓ Tout payé</b><small>aujourd'hui · banque</small></span><span class="m2pa-b-m">400,00</span></button>
 <button class="m2pa-b-oth" aria-expanded="true">Autre montant, date ou moyen <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2F6EA8" stroke-width="2.4"><path d="M5 9l7 7 7-7"/></svg></button>
 <div class="m2pa-b-ln"><label>Montant</label><span style="display:flex;align-items:center"><input class="m2pa-b-in m2pa-b-a" type="text" inputmode="decimal" value="250,00" aria-label="Montant payé (CHF)"><span class="m2pa-b-rest m2pa-b-tg m2pa-b-pay">reste <b class="m2pa-b-m">150,00</b></span></span></div>
 <div class="m2pa-b-ln"><label>Le</label><span class="m2pa-b-chips"><button class="m2pa-b-on">9 nov.</button><button>8 nov.</button><button>…</button></span></div>
 <div class="m2pa-b-ln"><label>Avec</label><span class="m2pa-b-chips"><button class="m2pa-b-on">banque</button><button>TWINT</button><button>espèces</button><button>autre</button></span></div>
 <button class="m2pa-b-go" style="min-height:52px;margin-top:12px;justify-content:center"><b>✓ Payer 250,00</b></button>
</section>
</body>
</html>
