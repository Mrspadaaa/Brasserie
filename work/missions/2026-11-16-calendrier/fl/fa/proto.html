<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>fa · Calendrier en gestes</title>
<style>
:root{--bg:#fff;--s1:#f5f5f5;--s2:#ebebeb;--line:#ddd;--line2:#bfbfbf;--mut:#666;--ink:#111;--act:#111;--onact:#fff;--prod:#9a4f1e;--fin:#1f64a3;--finbg:#e8f0f8;--area:rgba(31,100,163,.12);--stk:#4c6b2a;--att:#7f5b10;--botOn:#efe8e1;--ok:#2f7d6b;--okbg:#e3f1ec;--bad:#b3261e;--badbg:#fbeae8;--halo:#fff;--sheet:#fff;--dim:rgba(0,0,0,.18);
--e-brassage:#9a4f1e;--e-evenement:#a3365c;--e-vente:#2f7d6b;--e-achat:#1f64a3;--e-renovation:#7f5b10;--e-activite:#4a4a4a;--e-fut:#4c6b2a;--e-charge:#6b6b6b;--e-taxe:#6b6b6b}
html[data-theme=cave]{--bg:#12100e;--s1:#1a1613;--s2:#221d19;--line:#2c2521;--line2:#3d342e;--mut:#9a8a7e;--ink:#f5f0ea;--act:#f2c14e;--onact:#12100e;--prod:#e7a070;--fin:#86b9e6;--finbg:#172634;--area:rgba(134,185,230,.20);--stk:#a3c97a;--att:#e0a02e;--botOn:#2c2521;--ok:#6fc3ad;--okbg:#14302a;--bad:#f08a80;--badbg:#3a1a17;--halo:#12100e;--sheet:#1a1613;--dim:rgba(0,0,0,.5);
--e-brassage:#e7a070;--e-evenement:#e48aae;--e-vente:#6fc3ad;--e-achat:#86b9e6;--e-renovation:#e0b04e;--e-activite:#c9bfb5;--e-fut:#a3c97a;--e-charge:#a89a8f;--e-taxe:#a89a8f}
html{--surb:#fff;--note:#fff3b0;--noteb:#e6cf5a;--noteink:#3b3000}
html[data-theme=cave]{--surb:#12100e;--note:#4a3f1c;--noteb:#a8913a;--noteink:#f5e7b0}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;overflow-x:clip;padding-bottom:150px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.fa-ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fa-ex{display:inline-block;border:1.5px solid var(--fin);color:var(--fin);border-radius:999px;font-size:11px;line-height:15px;padding:0 6px;font-weight:600;white-space:nowrap}
body.fa-geste{user-select:none;-webkit-user-select:none}

/* carte de la semaine */
.fa-carte{margin:10px 10px 0;border:1px solid var(--line);border-left:5px solid var(--prod);border-radius:16px;background:var(--s1);padding:8px 12px 10px 13px;position:relative}
.fa-ct{display:flex;align-items:center;gap:6px;font-size:14.5px;color:var(--mut);min-height:30px}
.fa-ct b{font-size:18px;color:var(--ink)}
.fa-ret{margin-left:auto;display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 10px;border-radius:16px;border:1.5px solid var(--line2);font-size:13.5px;font-weight:600;color:var(--ink);background:var(--bg)}
.fa-k{display:flex;align-items:center;gap:10px}
.fa-perm{font-size:46px;line-height:1;font-weight:800;color:var(--fin);letter-spacing:-.03em;font-variant-numeric:tabular-nums;transition:color .15s}
.fa-perm.neg{color:var(--bad)}
.fa-perm{position:relative}.fa-perm s{position:absolute;left:2px;top:-12px;font-size:14px;font-weight:600;color:var(--mut);letter-spacing:0;line-height:1.1}
.fa-pl{font-size:17px;font-weight:700;line-height:1.15;min-width:0}.fa-pl small{display:block;font-size:13.5px;font-weight:400;color:var(--mut);line-height:1.25}
.fa-jl{margin-left:auto;display:flex;align-items:center;gap:6px}.fa-jl b{font-size:17px;font-weight:800;color:var(--ok);white-space:nowrap}.fa-jl b.neg{color:var(--bad)}
.fa-dots{display:flex;gap:2px}.fa-dots i{width:14px;height:19px;border-radius:5px;background:var(--s2);color:var(--mut);font-style:normal;font-size:12px;font-weight:700;display:grid;place-items:center}.fa-dots i.on{background:var(--prod);color:var(--surb)}
.fa-wk{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:7px;padding-top:7px;border-top:1.5px dashed var(--line2);font-size:15px}
.fa-wk .it{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.fa-wk .it i{width:11px;height:11px;border-radius:3px;background:var(--c);flex:none}.fa-wk .it b{font-variant-numeric:tabular-nums}
.fa-wk .vide{color:var(--mut)}
.fa-hyp{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.fa-hypb{display:inline-flex;align-items:center;gap:5px;min-height:34px;padding:0 10px;border-radius:17px;background:var(--bg);border:1px solid var(--line);font-size:13px;color:var(--mut);white-space:nowrap}.fa-hypb b{color:var(--ink)}
.fa-etsi{display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px 6px 6px 10px;border-radius:12px;background:var(--okbg);color:var(--ink);font-size:14.5px}.fa-etsi b{color:var(--ok)}.fa-etsi button{margin-left:auto;min-height:36px;padding:0 12px;border-radius:18px;background:var(--bg);border:1.5px solid var(--line2);font-weight:600}

/* filtres */
.fa-flt{display:flex;gap:4px;margin:9px 10px 0;overflow-x:auto;scrollbar-width:none}
.fa-chip{display:inline-flex;align-items:center;gap:5px;min-height:40px;padding:0 10px;border-radius:20px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 15%,var(--bg));font-size:14px;font-weight:600;white-space:nowrap;flex:none;touch-action:manipulation}
.fa-chip i{display:none}
.fa-chip[aria-pressed=false]{background:var(--bg);border-style:dashed;border-color:var(--line2);color:var(--mut);text-decoration:line-through;text-decoration-thickness:1.5px}


/* bande de l'année */
.fa-nav{display:flex;align-items:stretch;gap:6px;margin:8px 10px 0}
.fa-nb{width:42px;flex:none;border:1.5px solid var(--line2);border-radius:12px;display:grid;place-items:center;font-size:22px;font-weight:700;background:var(--bg)}
.fa-bande{flex:1;position:relative;height:52px;touch-action:none;cursor:grab}
.fa-bande .bt{position:absolute;bottom:13px;width:3px;border-radius:1px 1px 0 0;background:var(--fin);opacity:.75}
.fa-bande .bt.neg{background:var(--bad);opacity:1;height:6px!important}
.fa-bande .fen{position:absolute;top:0;bottom:11px;border:2.5px solid var(--prod);border-radius:8px;background:color-mix(in srgb,var(--prod) 10%,transparent)}
.fa-bande .ms{position:absolute;bottom:-1px;font-size:11px;color:var(--mut);transform:translateX(-50%)}
.fa-bande .pb{position:absolute;top:-2px;font-size:11.5px;font-weight:700;color:var(--fin);white-space:nowrap;transform:translateX(-50%)}
.fa-bande .pbt{position:absolute;top:12px;bottom:13px;border-left:1.5px dotted var(--bad)}

/* tableau */
.fa-tab{margin:8px 10px 0;border:1.5px solid var(--line2);border-radius:14px;background:var(--bg);position:relative;overflow:clip;touch-action:pan-y}
.fa-tete{position:sticky;top:0;z-index:8;background:var(--bg);box-shadow:0 1px 0 var(--line2)}
.fa-row{display:flex;position:relative}
.fa-lc{flex:none;padding:5px 3px 5px 6px;border-right:1px solid var(--line);font-size:12px;color:var(--mut);line-height:1.15;overflow:hidden}
.fa-lc b{display:block;font-size:14px;letter-spacing:-.2px;color:var(--ink);line-height:1.15}
.fa-sems{flex:1;display:flex;position:relative}
.fa-sem{flex:1;min-width:0;text-align:center;padding:5px 0 3px;font-size:11.5px;color:var(--mut);line-height:1.1;border-left:1px solid var(--line)}
.fa-sem:first-child{border-left:0}
.fa-sem b{display:block;font-size:16.5px;color:var(--ink);font-weight:800}
.fa-sem.sel{background:color-mix(in srgb,var(--prod) 14%,var(--bg));box-shadow:inset 0 -3px 0 var(--prod)}.fa-sem.sel b{color:var(--prod)}
.fa-sem.auj b::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--prod);margin:1px auto 0}
.fa-lib{flex:1;min-width:0;text-align:center;padding:4px 0 4px;border-left:1px solid var(--line);font-variant-numeric:tabular-nums;line-height:1.05}
.fa-lib:first-child{border-left:0}
.fa-lib.sel{background:color-mix(in srgb,var(--prod) 8%,var(--bg))}
.fa-verre{width:20px;height:28px;margin:0 auto 3px;border:2px solid var(--line2);border-top:0;border-radius:0 0 5px 5px;position:relative;overflow:hidden;clip-path:polygon(0 0,100% 0,88% 100%,12% 100%)}
.fa-verre i{position:absolute;left:0;right:0;bottom:0;background:var(--fin);transition:height .12s}
.fa-lib.neg .fa-verre{border-color:var(--bad)}
.fa-lib b{display:block;font-size:13px;font-weight:800;color:var(--fin);letter-spacing:-.6px;white-space:nowrap}
.fa-lib.neg b{color:var(--bad)}
.fa-lib s{display:block;font-size:11px;color:var(--mut);height:12px;letter-spacing:-.3px}
.fa-lib em{display:block;font-style:normal;font-size:12.5px;font-weight:700;color:var(--ok);margin-top:1px}.fa-lib em.neg{color:var(--bad)}
.fa-lib.bouge b{color:var(--ink);background:color-mix(in srgb,var(--fin) 16%,transparent);border-radius:4px}
.fa-lib.bouge.neg b{background:var(--badbg);color:var(--bad)}
.fa-tout{display:block;margin-top:3px;font-style:normal;font-size:11px;font-weight:700;color:var(--ink);background:var(--s2);border-radius:5px;padding:1px 4px}

.fa-voie{display:flex;border-top:1px solid var(--line);position:relative}
.fa-zone{flex:1;position:relative;min-height:46px;touch-action:pan-y}
.fa-col{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);pointer-events:none}
.fa-colsel{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--prod) 9%,transparent);pointer-events:none;border-left:2px solid color-mix(in srgb,var(--prod) 55%,transparent);border-right:2px solid color-mix(in srgb,var(--prod) 55%,transparent)}
.fa-barre{position:absolute;height:32px;border-radius:9px;background:var(--c);color:var(--surb);display:flex;align-items:center;gap:5px;padding:0 7px;font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 2px 0 color-mix(in srgb,var(--c) 60%,#000);touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;z-index:2;cursor:grab}
.fa-barre.sb{background:color-mix(in srgb,var(--c) 6%,var(--bg));border:2px dashed var(--c);color:var(--ink);box-shadow:none}
.fa-barre.neuf{outline:3px solid var(--act);outline-offset:2px}
.fa-barre .g,.fa-barre .d{position:absolute;top:7px;bottom:7px;width:3px;border-radius:2px;background:currentColor;opacity:.4}
.fa-barre .g{left:3px}.fa-barre .d{right:3px}
.fa-barre.coupeg{border-top-left-radius:0;border-bottom-left-radius:0}.fa-barre.couped{border-top-right-radius:0;border-bottom-right-radius:0}
.fa-barre.coupeg .g,.fa-barre.couped .d{display:none}
.fa-lab{position:absolute;height:32px;display:flex;align-items:center;gap:5px;font-size:14.5px;font-weight:400;white-space:nowrap;z-index:2;touch-action:pan-y;user-select:none;-webkit-user-select:none;padding:0 2px}
.fa-lab.sous{height:21px;font-size:13.5px;color:var(--ink)}.fa-lab.sous .fa-val{min-height:20px;font-size:12.5px}
.fa-lab .fa-val{color:var(--ink);background:var(--s1);border:1px solid var(--line2)}
.fa-val{position:relative;display:inline-flex;align-items:center;min-height:24px;padding:0 4px;border-radius:7px;font-size:13.5px;background:color-mix(in srgb,var(--surb) 20%,transparent);font-weight:600;font-variant-numeric:tabular-nums;cursor:text}
.fa-val::after{content:"";position:absolute;inset:-8px 0}
.fa-barre.sb .fa-val{background:var(--s2);color:var(--ink)}
.fa-val.vide{border:1.5px dashed currentColor;background:transparent}
.fa-note{position:absolute;height:30px;top:8px;border-radius:4px;background:var(--note);color:var(--noteink);border:1px solid var(--noteb);box-shadow:1px 2px 0 var(--noteb);display:grid;place-items:center;font-weight:800;font-size:14px;transform:rotate(-1.5deg);z-index:2;touch-action:pan-y;user-select:none}
.fa-note .fa-val{background:transparent;padding:0 3px}
.fa-geste .fa-barre.tenu,.fa-geste .fa-note.tenu{z-index:9;box-shadow:0 10px 22px rgba(0,0,0,.35);transform:translateY(var(--dy,0px)) scale(1.03)}
.fa-barre.mort{background:var(--bad)!important;border-color:var(--bad)!important;color:var(--surb)!important;opacity:.9}
.fa-barre.horsjeu,.fa-lab.horsjeu{opacity:.35;text-decoration:line-through}
.fa-fant{position:absolute;height:32px;border-radius:9px;border:2px dashed var(--line2);z-index:1;pointer-events:none}
.fa-pose{position:absolute;height:32px;border-radius:9px;border:2.5px dashed var(--act);background:color-mix(in srgb,var(--act) 8%,transparent);z-index:1;pointer-events:none;animation:fa-pulse .5s ease-out}
@keyframes fa-pulse{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* doigt, info de geste, poubelle */
.fa-doigt{position:fixed;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle,rgba(127,127,127,.55) 0 32%,rgba(127,127,127,.2) 33% 68%,transparent 69%);pointer-events:none;z-index:60}
.fa-info{position:fixed;z-index:58;pointer-events:none;background:var(--act);color:var(--onact);font-weight:700;font-size:15px;border-radius:12px;padding:6px 11px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.3);transform:translate(-50%,-100%)}
.fa-info small{display:block;font-weight:500;font-size:12.5px;opacity:.85}
.fa-flotte{position:fixed;z-index:55;transform:translate(-50%,-100%) rotate(-2deg);pointer-events:none;height:34px;display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:10px;background:var(--c);color:var(--surb);font-weight:700;font-size:15px;white-space:nowrap;box-shadow:0 12px 26px rgba(0,0,0,.4)}.fa-flotte.sb{background:var(--bg);color:var(--ink);border:2px dashed var(--c)}.fa-flotte.mort{background:var(--bad);color:var(--surb);border-color:var(--bad)}.fa-flotte span{font-weight:600;opacity:.9}
.fa-poub{position:fixed;left:0;right:0;bottom:0;height:76px;z-index:50;display:flex;align-items:center;justify-content:center;gap:9px;background:var(--badbg);color:var(--bad);border-top:2.5px dashed var(--bad);font-weight:700;font-size:17px;transform:translateY(105%);transition:transform .15s,background .1s}
.fa-poub.on{transform:none}.fa-poub .fa-ico{width:26px;height:26px}
.fa-poub.chaud{background:var(--bad);color:var(--surb);font-size:19px}

/* bulle d'édition */
.fa-bulle{position:fixed;left:8px;right:8px;bottom:64px;z-index:40;background:var(--sheet);border:2px solid var(--c);border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.28);padding:10px 12px 12px}
.fa-bulle::before{display:none;content:"";position:absolute;top:-9px;left:var(--fx,40px);width:14px;height:14px;background:var(--sheet);border-left:2px solid var(--c);border-top:2px solid var(--c);transform:rotate(45deg)}
.fa-bh{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mut)}
.fa-seg{display:inline-flex;border:1.5px solid var(--line2);border-radius:10px;overflow:hidden}
.fa-seg button{min-height:34px;padding:0 12px;font-size:14px;font-weight:600;color:var(--mut)}.fa-seg button[aria-pressed=true]{background:var(--c);color:var(--surb)}
.fa-in{display:block;width:100%;min-height:46px;margin-top:8px;padding:0 12px;border:1.5px solid var(--line2);border-radius:12px;background:var(--bg);font-size:18px;font-weight:700}
.fa-in:focus{outline:2.5px solid var(--c);outline-offset:1px}
.fa-l2{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.fa-mt{display:flex;align-items:center;gap:6px;flex:1;min-width:150px}
.fa-mt .sig{font-size:22px;font-weight:800;color:var(--c);width:14px;text-align:center}
.fa-mt input{flex:1;min-width:0;min-height:46px;padding:0 10px;border:1.5px solid var(--line2);border-radius:12px;background:var(--bg);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.fa-mt input:focus{outline:2.5px solid var(--c)}
.fa-mt span{font-size:14px;color:var(--mut)}
.fa-pas{display:inline-flex;align-items:center;border:1.5px solid var(--line2);border-radius:12px;overflow:hidden}
.fa-pas button{width:44px;height:44px;display:grid;place-items:center;font-size:22px;font-weight:700}
.fa-pas b{min-width:52px;text-align:center;font-size:17px}
.fa-eff{margin-top:8px;font-size:14px;color:var(--mut);line-height:1.35}.fa-eff b{color:var(--ink)}.fa-eff .neg{color:var(--bad);font-weight:700}.fa-eff .ok{color:var(--ok);font-weight:700}
.fa-bb{display:flex;gap:8px;margin-top:10px;align-items:center}
.fa-bb .sup{display:inline-flex;align-items:center;gap:5px;min-height:44px;padding:0 12px;border-radius:12px;color:var(--bad);font-weight:600}
.fa-bb .ok{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:0 20px;border-radius:23px;background:var(--act);color:var(--onact);font-weight:700;font-size:16px}
.fa-edit{position:fixed;z-index:45;min-height:34px;border:2.5px solid var(--act);border-radius:9px;background:var(--bg);color:var(--ink);font-weight:800;font-size:16px;text-align:right;padding:0 8px;font-variant-numeric:tabular-nums;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.fa-edtip{position:fixed;z-index:45;font-size:12.5px;background:var(--act);color:var(--onact);border-radius:8px;padding:3px 8px;white-space:nowrap;pointer-events:none}
.fa-stp{position:fixed;z-index:45;display:flex;align-items:center;background:var(--sheet);border:2px solid var(--act);border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.3);overflow:hidden}
.fa-stp button{width:46px;height:46px;font-size:24px;font-weight:700}.fa-stp b{min-width:76px;text-align:center;font-size:17px}.fa-stp small{display:block;font-size:11.5px;font-weight:400;color:var(--mut)}

/* toast */
.fa-toast{position:fixed;left:10px;right:86px;bottom:66px;z-index:36;display:flex;align-items:center;gap:8px;background:var(--act);color:var(--onact);border-radius:14px;padding:7px 7px 7px 12px;font-size:14.5px;line-height:1.25;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.fa-toast span{flex:1;min-width:0}.fa-toast small{display:block;opacity:.8;font-size:12.5px}
.fa-toast button{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px;border-radius:12px;background:color-mix(in srgb,var(--onact) 18%,transparent);font-weight:700;white-space:nowrap;flex:none}

/* + volant et barre du bas (g8) */
.fa-bot{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;background:var(--s1);border-top:1px solid var(--line);z-index:30}
.fa-bot a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;position:relative;min-width:0;color:inherit;text-decoration:none}
.fa-bot a.on{background:var(--botOn);font-weight:600;box-shadow:inset 0 3px 0 var(--prod)}
.fa-badge{position:absolute;top:4px;left:calc(50% + 4px);background:#8a5a1c;color:#fff;font-size:11px;font-weight:600;border-radius:999px;padding:0 5px;line-height:16px}
.fa-fab{position:fixed;right:14px;bottom:70px;z-index:33;display:inline-flex;align-items:center;justify-content:center;gap:4px;height:56px;min-width:56px;padding:0 16px 0 13px;border-radius:28px;background:var(--act);color:var(--onact);font-weight:700;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 0 3px var(--bg)}
.fa-fab .fa-ico{width:26px;height:26px;stroke-width:2.4;transition:transform .15s}.fa-fab[aria-expanded=true]{padding:0 15px}.fa-fab[aria-expanded=true] .fa-ico{transform:rotate(45deg)}.fa-fab[aria-expanded=true] span{display:none}
.fa-fab.rond{width:58px;min-width:58px;padding:0;flex-direction:column;gap:0;font-size:12px;line-height:1}.fa-fab.rond .fa-ico{width:24px;height:24px}
.fa-bon{padding-bottom:340px}.fa-bon .fa-fab{opacity:0;pointer-events:none}.fa-land .fa-bulle{bottom:8px;left:auto;width:430px}
.fa-geste .fa-fab{opacity:0;pointer-events:none}

function sl(ms){return new Promise(function(r){setTimeout(r,ms)})}
