<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calendrier · fc passe 2 · la fluidité d’abord</title><style>:root{--bg:#fff;--s1:#f5f5f5;--s2:#ebebeb;--line:#ddd;--line2:#bfbfbf;--mut:#666;--ink:#111;--act:#111;--onact:#fff;--prod:#9a4f1e;--fin:#1f64a3;--finbg:#e8f0f8;--area:rgba(31,100,163,.12);--stk:#4c6b2a;--att:#7f5b10;--botOn:#efe8e1;--ok:#2f7d6b;--okbg:#e3f1ec;--bad:#b3261e;--badbg:#fbeae8;--halo:#fff;--sheet:#fff;--dim:rgba(0,0,0,.18);
--e-brassage:#9a4f1e;--e-evenement:#a3365c;--e-vente:#2f7d6b;--e-achat:#1f64a3;--e-renovation:#7f5b10;--e-activite:#4a4a4a;--e-fut:#4c6b2a;--e-charge:#6b6b6b;--e-taxe:#6b6b6b}
html[data-theme=cave]{--bg:#12100e;--s1:#1a1613;--s2:#221d19;--line:#2c2521;--line2:#3d342e;--mut:#9a8a7e;--ink:#f5f0ea;--act:#f2c14e;--onact:#12100e;--prod:#e7a070;--fin:#86b9e6;--finbg:#172634;--area:rgba(134,185,230,.20);--stk:#a3c97a;--att:#e0a02e;--botOn:#2c2521;--ok:#6fc3ad;--okbg:#14302a;--bad:#f08a80;--badbg:#3a1a17;--halo:#12100e;--sheet:#1a1613;--dim:rgba(0,0,0,.5);
--e-brassage:#e7a070;--e-evenement:#e48aae;--e-vente:#6fc3ad;--e-achat:#86b9e6;--e-renovation:#e0b04e;--e-activite:#c9bfb5;--e-fut:#a3c97a;--e-charge:#a89a8f;--e-taxe:#a89a8f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html{overflow-x:clip}
body{overflow-x:clip;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y;--hc:46px}
input{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.fc-ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}

/* ---------- tête : collée en haut, une ligne quand on défile ---------- */
#fc-top{position:relative;z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
#fc-bar{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);box-shadow:0 2px 10px var(--dim);transform:translateY(-110%);transition:transform .14s}
body.compact #fc-bar{transform:none}
body.land #fc-top{display:none}
.h-full{padding:8px 12px 4px}
.h-c{display:flex;align-items:center;gap:8px;height:46px;padding:0 10px 0 12px;white-space:nowrap}
.hA{height:30px;display:flex;align-items:center;gap:6px;min-height:28px;font-size:13.5px;color:var(--mut);white-space:nowrap}
.hA>b{color:var(--ink);font-size:15px}
.hA .cs b{color:var(--fin)}
.h-back{display:inline-flex;align-items:center;gap:3px;min-height:28px;padding:0 9px;border-radius:999px;border:1.5px solid var(--prod);color:var(--prod);font-weight:800;font-size:12.5px}
.h-back .fc-ico{width:14px;height:14px}
.alerte{margin-left:auto;display:inline-flex;align-items:center;gap:4px;min-height:30px;padding:0 9px;border-radius:999px;background:var(--badbg);color:var(--bad);font-weight:800;font-size:12.5px;border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.alerte .fc-ico{width:15px;height:15px}
.hB{height:54px;display:flex;align-items:center;gap:9px;margin-top:2px}
.big{font-size:46px;line-height:1;font-weight:800;color:var(--fin);letter-spacing:-.02em;white-space:nowrap;display:inline-flex;align-items:baseline;gap:6px}
.big.neg{color:var(--bad)}
.big s{font-size:20px;font-weight:600;color:var(--mut)}
.bigl{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:1;overflow:hidden}
.bigl b{font-size:16px}
.bigl span{font-size:12.5px;color:var(--mut);white-space:nowrap}
.bigl span b{font-size:12.5px;color:var(--att)}
.eff{font-weight:800;font-size:13px}.eff.ok{color:var(--ok)}.eff.ko{color:var(--bad)}
.jl{margin-left:auto;text-align:right;flex:none}
.jl>b{display:block;font-size:19px;font-weight:800;color:var(--ok);line-height:1.1;white-space:nowrap}
.jl>b.neg{color:var(--bad)}.jl>b.zero{color:var(--att)}
.dd{display:flex;gap:1px;margin-top:3px}
.dd i{font-style:normal;width:16px;height:18px;border-radius:999px;font-size:9px;font-weight:700;display:grid;place-items:center;color:var(--mut);background:var(--s1)}
.dd i.pris{background:var(--c);color:var(--bg)}
.dd i.libre{background:var(--bg);color:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok)}
.h-c .big{font-size:24px}.h-c .big s{font-size:14px}
.h-c .lab{font-size:12.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;min-width:0}
.h-c .jlc{font-weight:800;color:var(--ok);font-size:14px}.h-c .jlc.neg{color:var(--bad)}
.h-c .fd{margin-left:auto;display:inline-flex;align-items:center;gap:3px;min-height:34px;padding:0 8px;border-radius:999px;border:1px solid var(--line)}
.h-c .fd i{width:9px;height:9px;border-radius:999px;background:var(--c)}.h-c .fd i.off{background:none;box-shadow:inset 0 0 0 1.5px var(--line2)}
.h-c .alerte{margin-left:0;min-height:30px;padding:0 7px}

/* filtres */
#fc-fil{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:2px 10px 8px;height:52px}
.f{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:42px;padding:0 2px;border-radius:10px;border:1.5px solid color-mix(in srgb,var(--c) 40%,var(--line));font-size:10.5px;font-weight:800;white-space:nowrap;color:var(--ink);overflow:hidden}
.f .fc-ico{width:16px;height:16px;color:var(--c)}
.f.on{background:var(--c);border-color:var(--c);color:var(--bg)}.f.on .fc-ico{color:var(--bg)}
.f.off{opacity:.42;border-style:dashed}
.f.tous{border-color:var(--ink);background:var(--ink);color:var(--bg)}.f.tous .fc-ico{color:var(--bg)}

/* ---------- l'année en blocs ---------- */
#fc-an{padding-bottom:var(--pb,150px)}
.blk{position:relative;margin-bottom:6px}
.ax{position:sticky;top:var(--hc);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);touch-action:pan-y}
.ax-m,.ax-w,.ax-c{position:relative}
.ax-m{height:15px}.ax-w{height:17px}.ax-c{height:24px}
.mo{position:absolute;top:1px;font-size:11px;font-weight:800;color:var(--mut);white-space:nowrap;padding-left:3px;border-left:1.5px solid var(--line2);line-height:13px}
.mo.y{color:var(--ink)}
.wn{position:absolute;top:0;text-align:center;font-size:10.5px;color:var(--mut);line-height:17px}
.wn.now{color:var(--prod);font-weight:800}
.wn.sel{color:var(--bg);background:var(--fin);border-radius:999px;font-weight:800}
.cc{position:absolute;bottom:0;height:24px}
.cc i{position:absolute;left:1px;right:1px;bottom:2px;background:color-mix(in srgb,var(--fin) 38%,var(--bg));border-radius:0}
.cc.sel i{background:var(--fin)}
.cc.neg i{background:var(--bad)}
.cc.pb i{background:var(--att)}
.cc.ok{background:color-mix(in srgb,var(--ok) 22%,transparent)}.cc.ko{background:color-mix(in srgb,var(--bad) 24%,transparent)}
.cc.past i{display:none}
.seuil{position:absolute;left:0;right:0;border-top:1.5px dashed var(--att);pointer-events:none}
.cv{position:absolute;top:1px;font-size:10.5px;font-weight:800;color:var(--fin);background:var(--bg);padding:0 3px;border-radius:999px;white-space:nowrap;line-height:13px;box-shadow:0 0 0 1px var(--line)}
.cv.pb{color:var(--att)}
.ax-lab{position:absolute;left:2px;font-size:9.5px;font-weight:800;color:var(--mut);letter-spacing:.02em;text-transform:uppercase}

.lns{position:relative}
.ln{position:absolute;left:0;right:0;touch-action:pan-y}
.ln.t0{border-top:1px solid var(--line)}
.gut{position:absolute;left:0;top:0;bottom:0;display:grid;place-items:center;color:var(--c)}
.gut .fc-ico{width:15px;height:15px}
.hint{position:absolute;top:50%;transform:translateY(-50%);font-size:12px;color:var(--mut);opacity:.75;white-space:nowrap;pointer-events:none}
.col{position:absolute;top:0;bottom:0;pointer-events:none}
.col.sel{background:color-mix(in srgb,var(--fin) 9%,transparent);box-shadow:inset 1.5px 0 0 color-mix(in srgb,var(--fin) 35%,transparent),inset -1.5px 0 0 color-mix(in srgb,var(--fin) 35%,transparent)}
.col.now{background:color-mix(in srgb,var(--prod) 8%,transparent);border-left:2px solid var(--prod)}
.grid{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.55;pointer-events:none}
.grid.m{opacity:1;background:var(--line2)}

/* une chose */
.it{position:absolute;z-index:2;touch-action:none}
.bar{position:absolute;inset:0;border-radius:10px;background:var(--c);overflow:hidden}
.bar.cote{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 30%,var(--bg)) 0 5px,color-mix(in srgb,var(--c) 14%,var(--bg)) 5px 10px);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 70%,transparent)}
.bar.nb{background:color-mix(in srgb,var(--c) 12%,var(--bg));box-shadow:none;border:1.5px dashed var(--c)}
.bar.cont-g{border-top-left-radius:0;border-bottom-left-radius:0}
.bar.cont-d{border-top-right-radius:0;border-bottom-right-radius:0}
.pay{position:absolute;top:0;bottom:0;background:var(--c)}
.dot{position:absolute;bottom:-4px;width:10px;height:3px;border-radius:999px;background:var(--c);pointer-events:none}
.lb{position:absolute;top:0;bottom:0;display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:12.5px;line-height:1;pointer-events:auto}
.lb b{font-weight:800}
.lb.in{left:7px;right:5px;color:var(--bg);overflow:hidden}
.lb.in.clair{color:var(--ink)}
.lb.out b{color:var(--ink)}
.lb .v{display:inline-flex;align-items:center;min-height:20px;padding:0 5px;border-radius:999px;font-weight:700;font-size:11.5px;position:relative}
.lb .v::after{content:"";position:absolute;inset:-5px -3px}
.lb.in .v{background:var(--bg);color:var(--ink)}
.lb.in.clair .v,.lb.out .v{background:var(--s1);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.lb .v.pos{color:var(--ok)}
.lb .v.j{color:var(--mut)}
.lb.cont{color:var(--ink);font-size:11.5px;font-weight:700}
.lb.cont.in{color:var(--bg)}
.lb.cont.in.clair{color:var(--ink)}
.it.lift{z-index:9;filter:drop-shadow(0 6px 10px var(--dim))}
.it.lift .bar{transform:scaleY(1.12)}
.it.tire .bar{box-shadow:0 0 0 2px var(--ink)}
.it.draft .bar{background:color-mix(in srgb,var(--c) 18%,var(--bg));border:2px dashed var(--c);box-shadow:none}
.it.draft .lb{color:var(--c)}
.it.flash .bar{animation:fl 1.4s ease-out}
@keyframes fl{0%{box-shadow:0 0 0 4px var(--act)}100%{box-shadow:0 0 0 0 transparent}}
.it.poub .bar{background:var(--bad)!important;opacity:.7}
.del{position:absolute;z-index:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 6px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;font-weight:800}
.del{overflow:hidden;opacity:.75}.del.pret{opacity:1}
.it.sw .lb{visibility:hidden}
#fc-pop .bjl{font-size:12px;color:var(--mut);font-weight:700}
.del .fc-ico{width:14px;height:14px}
.it.gone{transition:opacity .18s,transform .18s;opacity:0;transform:scaleY(.2)}

/* bulle d'une chose */
#fc-pop{position:fixed;z-index:30;left:10px;right:10px;max-width:380px;background:var(--sheet);border:1px solid var(--line2);border-radius:16px;box-shadow:0 10px 30px var(--dim);padding:10px 12px;display:none;font-size:13.5px}
#fc-pop.on{display:block}
#fc-pop .t{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
#fc-pop .t i{width:10px;height:10px;border-radius:999px;background:var(--c)}
#fc-pop .l{color:var(--mut);margin-top:2px}
#fc-pop .aide{margin-top:6px;font-size:12.5px;color:var(--ink);background:var(--s1);border-radius:10px;padding:5px 8px}
#fc-pop .bb{display:flex;gap:8px;margin-top:8px;align-items:center}
.btn{min-height:40px;padding:0 14px;border-radius:999px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn.rouge{border:1.5px solid var(--bad);color:var(--bad)}
.btn.sec{border:1.5px solid var(--line2)}
.btn.go{background:var(--act);color:var(--onact)}
.step{display:inline-flex;align-items:center;gap:2px;background:var(--s1);border-radius:999px;border:1px solid var(--line)}
.step button{width:38px;height:38px;font-size:20px;font-weight:800;border-radius:999px}
.step b{min-width:34px;text-align:center;font-size:14px}

/* édition sur place d'une valeur */
#fc-edit{position:fixed;z-index:31;display:none}
#fc-edit.on{display:flex;align-items:center}
#fc-edit input{width:74px;height:32px;border-radius:999px;border:2px solid var(--fin);background:var(--bg);padding:0 8px;font-weight:800;font-size:15px;text-align:right}
#fc-edit .step{background:var(--sheet);box-shadow:0 4px 14px var(--dim);border:1.5px solid var(--ink)}

/* toast : une ligne, en haut */
#fc-toast{position:fixed;z-index:25;left:10px;right:10px;top:52px;height:36px;border-radius:999px;background:var(--ink);color:var(--bg);display:none;align-items:center;gap:8px;padding:0 6px 0 14px;font-size:13.5px;box-shadow:0 4px 14px var(--dim)}
#fc-toast.on{display:flex}
#fc-toast span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fc-toast button{min-height:30px;padding:0 12px;border-radius:999px;background:var(--bg);color:var(--ink);font-weight:800;font-size:13px}

/* composeur */
#fc-comp{position:fixed;z-index:24;left:0;right:0;bottom:64px;background:var(--sheet);border-top:1px solid var(--line2);border-radius:16px 16px 0 0;box-shadow:0 -8px 24px var(--dim);padding:8px 12px 10px;display:none}
#fc-comp.on{display:block}
.cp-h{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--mut);min-height:30px}
.cp-h b{color:var(--c);font-size:15px}
.cp-h .x{margin-left:auto;width:36px;height:36px;display:grid;place-items:center;border-radius:999px;background:var(--s1)}
.cp-t{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin:4px 0 6px}
.cp-t button{min-height:32px;padding:0 2px;overflow:hidden;border-radius:999px;border:1.5px solid var(--line);font-size:11.5px;font-weight:700;white-space:nowrap}
.cp-t button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:var(--bg)}
.cp-p{display:flex;flex-wrap:wrap;gap:6px}
.pu{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 9%,var(--bg));font-weight:800;font-size:13.5px}
.pu small{font-weight:700;color:var(--mut);font-size:12px}
.pu small.pos{color:var(--ok)}
.cp-r{display:flex;gap:6px;align-items:center;margin-top:8px}
.cp-r input{height:40px;border-radius:999px;border:1.5px solid var(--line2);background:var(--bg);padding:0 12px;font-size:14.5px;min-width:0}
.cp-r [data-champ=nom]{flex:1}
.cp-r .m{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--mut)}
.cp-r .m input{width:70px;text-align:right;padding:0 8px;font-weight:800}
.cp-r .sb{font-size:12px;color:var(--mut);white-space:nowrap}
.cp-r .step button{width:30px;height:36px;font-size:17px}.cp-r .step b{min-width:26px;font-size:13px}
.cp-r .btn.go{min-height:40px;padding:0 12px}
input.manque{border-color:var(--bad)!important}

/* + volant (règle b1r) */
#fc-fab{position:fixed;z-index:22;right:14px;bottom:80px;width:58px;height:58px;border-radius:999px;background:var(--act);color:var(--onact);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 16px var(--dim);transition:transform .15s,width .15s,height .15s,background .15s}
#fc-fab .fc-ico{width:24px;height:24px;stroke-width:2.6}
#fc-fab span{font-size:11px;font-weight:800;line-height:1}
body.defile #fc-fab{width:46px;height:46px}body.defile #fc-fab span{display:none}
body.porte #fc-fab{width:70px;height:70px;background:var(--bad);color:#fff}
body.porte #fc-fab.au{transform:scale(1.15)}
body.comp #fc-fab{display:none}
.fc-scrim{position:fixed;inset:0;z-index:40;background:var(--dim);display:none}
#fc-dial{position:fixed;z-index:41;left:10px;right:10px;bottom:80px;background:var(--sheet);border-radius:16px;padding:10px;box-shadow:0 10px 30px var(--dim);display:none;max-height:calc(100vh - 100px);overflow:auto}
body.dial .fc-scrim,body.dial #fc-dial{display:block}
.fc-dh{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--ink);margin:2px 4px 6px}.fc-dh.mut{color:var(--mut);margin-top:10px}
.fc-dg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fc-pp{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:52px;padding:6px 10px;border-radius:16px;background:color-mix(in srgb,var(--c) 10%,var(--bg));border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);text-align:left;font-weight:800;font-size:14px}
.fc-pp small{display:block;font-weight:600;font-size:11.5px;color:var(--mut)}
.fc-pp i{color:var(--c);display:grid}
.fc-pc{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:44px;padding:0 10px;border-radius:16px;border:1px solid var(--line);font-size:13.5px;font-weight:700;text-align:left}
.fc-pc i{color:var(--c);display:grid}

/* barre du bas */
.fc-bot{position:fixed;z-index:21;left:0;right:0;bottom:0;height:64px;display:grid;grid-template-columns:repeat(6,1fr);background:var(--bg);border-top:1px solid var(--line)}
.fc-bot a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mut);text-decoration:none;position:relative}
.fc-bot a.on{color:var(--ink);font-weight:800;background:var(--botOn);box-shadow:inset 0 3px 0 var(--prod)}
.fc-badge{position:absolute;top:6px;right:calc(50% - 22px);background:var(--att);color:var(--bg);font-size:10px;font-weight:800;border-radius:999px;padding:1px 5px}

/* paysage : plein écran, sans barre du bas, tête en une ligne */
body.land .fc-bot{display:none}
body.land #fc-fab{bottom:14px;width:48px;height:48px}body.land #fc-fab span{display:none}
body.land #fc-comp{bottom:0;max-width:560px;left:auto;right:12px}
body.land #fc-dial{bottom:14px;left:auto;width:420px}
body.land .h-c{height:36px}

<script>/* fc, passe 2 (16.11) : « la fluidité d'abord ». L'année repliée en blocs de 13 semaines (26 en paysage), qu'on lit en
   défilant d'un pouce ; dans chaque bloc, une piste par type, et plusieurs choses par piste quand elles ne se chevauchent pas.
   Chaque position du doigt donne une semaine, même d'un bloc à l'autre : tenir, tirer et dessiner traversent les blocs.
   Moteur d'argent : CORE de p2 (serie, tient, charge, joursSem, jOuvres, fmt, lab…), injecté avant ce script. E est mutable. */

 w=wo;if(x+w+6+W.n+W.v<=R)return {mode:'out',l0:x,l1:x+w+6+W.n+W.v};
 w=aCote(it.e)&&it.s1?wo-geo().pw:wo;if(W.m&&w>=W.n+W.m+14)return {mode:'inm',l0:x,l1:x+wo};
 if(x-6-W.n-W.v>=L)return {mode:'outL',l0:x-6-W.n-W.v,l1:x+wo};

   function etiq(lane){lane.sort(function(p,q){return p.x-q.x});var Lm=0;lane.forEach(function(it,j){var nx=lane[j+1],R=nx?nx.x-5:g.TL;var c=choixMode(it,Lm,R);it.mode=c.mode;it.l0=c.l0;it.l1=c.l1;Lm=c.l1+5})}

    for(var i=0;i<=lanes.length;i++){var L2=lanes[i]||[];if(L2===lane)continue;if(libre(L2.map(function(q){return [q.l0,q.l1]}),need[0],need[1])){lane.splice(lane.indexOf(it),1);if(!lanes[i])lanes[i]=L2;L2.push(it);etiq(lane);etiq(L2);break}}})});
   lanes=lanes.filter(function(l){return l.length});
   b.types.push({t:t,lanes:lanes.length?lanes:[[]],vide:!its.length})});

 lb.forEach(function(l){var x=g.GUT+(l[0]-b.r0)*pw,wd=l[1].indexOf('plancher')>0?92:86;x=Math.max(g.GUT,Math.min(g.GUT+g.TL-wd,x));h+=l[1].replace('class="cv','style="left:'+x+'px" class="cv')});
