<!-- Carnet, greffe 3, v06, recette H6 « L'objet et son prix ». Base (règle n° 1) : ra+p5f. Écrans assemblés depuis leurs sources classées :
 1 g05-1 (+ pastille h04-1, Chercher h01-1) · 2 cadre base-E00 + fantôme h05-2 · 3 h05-2 + puces g02-2 · 4 h01-3 · 5 h05-4b, 5 bis h03-4b ·
 6 h05-5 (+ J5) · 7 h01-6 (+ J17) · 8 g01-8 + règle h06-7 · 9 h06-8 (sans pastille « choisi ») + cases h05-8 · 10 h05-9 + total h06-9, dans Stocks › Matériel.

<style>/* ===== source A : greffe/v05.html (portée .sA) ===== */

/* Greffe v05, recette R5. Socle : vue du carnet v09 (liste, fiche en cours, fiche choisie), habit de l'app réelle
   (ref-app : en-tête ‹ Nov. ›, segment noir, retour bleu, grand titre noir, + carré noir, onglets colorés par zone).
   Greffes : champ « Va dans » v10-2, rangée Idée « Coller un lien » v10-1, carnet vide v01, article ouvert v02-2,
   côte à côte v01, Choisir / Écarter v04-1, pourquoi v04-3, À venir v10-5 ; idées I16 (En veille, prix barré) et
   I14 (Fixer la date · Ouvrir le carnet). Statique : HTML et CSS seuls. Textes 14 px au moins. */
.sA{--bg:#FFFFFF;--s1:#F5F5F5;--s2:#EBEBEB;--line:#DDDDDD;--line2:#BFBFBF;--mut:#666666;--txt:#333333;--ink:#111111;
  --stk:#4C6B2A;--stkd:#3B5420;--hop:#567F45;--ok:#3F6B2E;--fin:#1F64A3;--cal:#C87A2C;--brs:#A0522D;--straw:#F2C14E;--alrt:#A8291F;
  --stkbg:color-mix(in srgb,#4C6B2A 10%,#FFFFFF);--stkbg2:color-mix(in srgb,#4C6B2A 16%,#F5F5F5)}
.sA *{box-sizing:border-box}
.sA,.sA{color:var(--ink);font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.35}
.sA{}
.sA a{color:inherit;text-decoration:none}
.sA .v5-rail{display:flex;gap:28px;align-items:flex-start;width:100vw;overflow-x:auto;scroll-snap-type:x mandatory}
.sA .v5-col{flex:none;width:390px;display:flex;flex-direction:column;scroll-snap-align:start}
.sA .v5-cap{order:2;margin:8px 4px 0;font-size:14px;color:var(--txt)}
.sA .v5-cap b{font-weight:700}
.sA .v5-scr{position:relative;flex:none;width:390px;height:844px;overflow:hidden;background:var(--bg)}
.sA .v5-i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sA .v5-m{font-family:"IBM Plex Mono",Consolas,Menlo,ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:0}

/* en-tête de l'app (ref-app) */
.sA .v5-bar{display:flex;align-items:center;gap:8px;height:44px;padding:0 10px;border-bottom:1px solid var(--line)}
.sA .v5-logo{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#111}
.sA .v5-nom{font-size:16px;font-weight:500;color:var(--ink)}
.sA .v5-mois{margin-left:auto;display:flex;height:34px;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.sA .v5-mois span{display:grid;place-items:center;min-width:32px;font-size:15px;color:var(--ink)}
.sA .v5-mois span.m{min-width:52px;border-left:1px solid var(--line2);border-right:1px solid var(--line2);font-weight:600}
.sA .v5-mois .v5-i{width:16px;height:16px}
.sA .v5-lp{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;border:1px solid var(--line2);background:var(--s2)}
.sA .v5-lp .v5-i{width:18px;height:18px}
.sA .v5-av{position:relative;display:flex}
.sA .v5-av span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:14px;font-weight:700}
.sA .v5-av .g{background:#111;color:#fff}.sA .v5-av .a{margin-left:-6px;background:var(--s2);color:var(--ink)}
.sA .v5-av i{position:absolute;top:-2px;right:0;width:8px;height:8px;border-radius:50%;background:#111}

/* segment Stocks (actif noir) et sous-vues (comme Étagère / Recompter) */
.sA .v5-seg{display:flex;margin:6px 8px 0;padding:3px;border-radius:12px;background:var(--s1);border:1px solid var(--line)}
.sA .v5-seg a{flex:1;display:flex;align-items:center;justify-content:center;min-height:34px;border-radius:9px;font-size:14px;font-weight:500;color:var(--txt);white-space:nowrap}
.sA .v5-seg a.on{background:#111;color:#fff;font-weight:600}
.sA .v5-sous{display:flex;margin:8px 10px 0;padding:3px;border-radius:999px;background:var(--s2)}
.sA .v5-sous a{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;min-height:32px;border-radius:999px;font-size:14px;font-weight:600;color:var(--txt)}
.sA .v5-sous a.on{background:#111;color:#fff}
.sA .v5-sous .n{font-family:"IBM Plex Mono",Consolas,monospace;font-weight:500;opacity:.8}

/* groupes, panneaux, rangées (v09) */
.sA .v5-list{padding:0 14px}
.sA .v5-h{display:flex;align-items:center;gap:6px;margin:9px 0 5px}
.sA .v5-h .t{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--stkbg2);font-size:14px;font-weight:700;color:var(--stkd)}
.sA .v5-h .t .n{font-family:"IBM Plex Mono",Consolas,monospace;font-weight:500;color:var(--stk)}
.sA .v5-h .t .v5-i{width:16px;height:16px}
.sA .v5-h .r{margin-left:auto;font-size:14px;color:var(--mut)}
.sA .v5-pan{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--bg)}
.sA .v5-row{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 12px}
.sA .v5-row+.v5-row,.sA .v5-pan>*+*{border-top:1px solid var(--line)}
.sA .v5-vg{flex:none;width:50px;height:50px;border-radius:10px;overflow:hidden;display:grid;place-items:center}
.sA .v5-vg>svg{width:100%;height:100%;display:block}
.sA .v5-vg.pic{background:var(--stkbg2);color:var(--stkd)}
.sA .v5-vg.pic>svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sA .v5-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.sA .v5-tx b{font-size:16px;font-weight:600;line-height:1.25;color:var(--ink)}
.sA .v5-tx span{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sA .v5-tx .q{font-style:italic}
.sA .v5-tx .nx{color:var(--txt)}.sA .v5-tx .nx em{font-style:normal;font-weight:600;color:var(--stkd)}
.sA .v5-tx .why{color:var(--txt)}
.sA .v5-tx .ve{display:inline-flex;align-items:center;gap:4px}
.sA .v5-tx .ve .v5-i{width:16px;height:16px}
.sA .v5-fig{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:1px;text-align:right}
.sA .v5-fig .p{font-size:16px;font-weight:600;color:var(--ink)}
.sA .v5-fig .u,.sA .v5-fig .d{font-size:14px;color:var(--mut)}
.sA .v5-fig s{font-size:14px;color:var(--mut)}
.sA .v5-fig .bx{font-size:14px;font-weight:600;color:var(--ok)}
.sA .v5-go{flex:none;display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--stk);font-size:14px;font-weight:600;color:var(--stkd);white-space:nowrap}
.sA .v5-go .v5-i{width:16px;height:16px}
.sA .v5-av-l{display:flex;align-items:center;gap:6px;min-height:34px;margin:0 -12px -8px;padding:0 12px 0 74px;border-top:1px dashed var(--line);font-size:14px;font-weight:600;color:var(--stkd)}
.sA .v5-av-l .v5-i{width:16px;height:16px}
.sA .v5-av-l .go{margin-left:auto;display:inline-flex;align-items:center;gap:2px}
.sA .v5-colr{flex-direction:column;align-items:stretch;gap:0}
.sA .v5-colr>.v5-ln{display:flex;align-items:center;gap:12px}
.sA .v5-ex{margin:10px 2px 0;font-size:14px;color:var(--mut)}
.sA .v5-neuf{background:var(--stkbg)}
.sA .v5-neuf .tag{color:var(--stkd);font-weight:600}
.sA .v5-vl{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;font-size:14px;color:var(--mut)}
.sA .v5-vl b{font-weight:600;color:var(--txt)}.sA .v5-vl .r{margin-left:auto}
.sA .v5-wrap .v5-tx span{white-space:normal}
.sA .v5-tb{table-layout:fixed}
.sA .v5-tb td.t{font-family:inherit}

/* fiche : retour bleu et grand titre noir (comme « ‹ Fournisseurs » / « Brouwland ») */
.sA .v5-back{display:flex;align-items:center;gap:2px;height:40px;padding:0 10px;font-size:16px;color:var(--fin)}
.sA .v5-back .v5-i{width:20px;height:20px}
.sA .v5-back .st{margin-left:auto;display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--stkbg2);color:var(--stkd);font-size:14px;font-weight:600}
.sA .v5-ti{margin:0 14px;font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.01em;color:var(--ink)}
.sA .v5-ti.s{font-size:26px}
.sA .v5-sub{margin:4px 14px 0;font-size:16px;color:var(--mut)}
.sA .v5-kv{display:flex;gap:8px;margin:6px 14px 0;font-size:14px;color:var(--txt)}
.sA .v5-kv>span:first-child{flex:none;width:96px;color:var(--mut)}
.sA .v5-kv b{font-weight:600}
.sA .v5-kv .ia{color:var(--mut)}
.sA .v5-f .v5-row{min-height:56px;padding:6px 12px;gap:10px}
.sA .v5-f .v5-vg{width:44px;height:44px}
.sA .v5-hero{display:flex;gap:12px;padding:12px}
.sA .v5-hero .v5-vg{width:88px;height:80px}
.sA .v5-hero .v5-tx{gap:2px}
.sA .v5-why{display:block;padding:10px 12px;font-size:14px;color:var(--txt)}
.sA .v5-why b{font-weight:600;color:var(--stkd)}
.sA .v5-why .go{color:var(--fin);font-weight:600;white-space:nowrap}
.sA .v5-send{margin:10px 0 0;padding:10px 12px;border-radius:16px;background:var(--stkbg)}
.sA .v5-send p{margin:0 0 8px;font-size:14px;color:var(--txt)}
.sA .v5-plein{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:10px;background:var(--stk);color:#fff;font-size:16px;font-weight:600}
.sA .v5-off .v5-tx b{color:var(--txt)}
.sA .v5-off .v5-fig .p{color:var(--mut);font-weight:500}
.sA .v5-off .v5-vg{opacity:.75}
.sA .v5-f .v5-off .v5-row{min-height:50px;padding:4px 12px}
.sA .v5-f .v5-off .v5-vg{width:38px;height:38px}

/* champ d'une ligne (petites icônes photo et micro dedans) et + carré noir de l'app */
.sA .v5-dock{position:absolute;left:0;right:0;bottom:52px;height:72px;padding:0 12px;display:flex;align-items:center;gap:8px;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 30%);z-index:32}
.sA .v5-in{position:relative;flex:1;min-width:0;height:48px}
.sA .v5-in input{width:100%;height:48px;padding:0 70px 0 14px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);font:inherit;font-size:16px;color:var(--ink);box-shadow:0 4px 12px -8px rgba(0,0,0,.35)}
.sA .v5-in input::placeholder{color:var(--mut)}
.sA .v5-in .ics{position:absolute;right:10px;top:0;height:48px;display:flex;align-items:center;gap:10px;color:var(--mut)}
.sA .v5-in .ics .v5-i{width:18px;height:18px}
.sA .v5-dock .v5-sp{flex:none;width:56px}
.sA .v5-fab{position:absolute;right:12px;bottom:62px;z-index:33;display:grid;place-items:center;width:56px;height:56px;border-radius:16px;background:#111;color:#fff;box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}
.sA .v5-fab .v5-i{width:26px;height:26px;stroke-width:2.4}

/* barre d'onglets de l'app : icônes à la couleur de leur zone, actif sur fond gris avec trait */
.sA .v5-bot{position:absolute;left:0;bottom:0;width:390px;height:52px;display:flex;background:var(--s1);border-top:1px solid var(--line);z-index:30}
.sA .v5-bot a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:14px;letter-spacing:-.01em;position:relative;min-width:0;color:var(--txt)}
.sA .v5-bot a .v5-i{width:20px;height:20px}
.sA .v5-bot a.fi .v5-i{color:var(--fin)}.sA .v5-bot a.ca .v5-i{color:var(--cal)}.sA .v5-bot a.br .v5-i{color:var(--brs)}.sA .v5-bot a.st .v5-i{color:var(--stk)}
.sA .v5-bot a.on{background:var(--s2);font-weight:600;color:var(--ink)}
.sA .v5-bot a.on::before{content:"";position:absolute;top:0;left:50%;width:32px;margin-left:-16px;height:3px;border-radius:0 0 3px 3px;background:var(--stk)}
.sA .v5-bot .bdg{position:absolute;top:2px;left:calc(50% + 6px);display:grid;place-items:center;min-width:20px;height:20px;border-radius:999px;background:var(--fin);color:#fff;font-size:14px;font-weight:700;line-height:1}

/* voile, feuille et clavier */
.sA .v5-voile{position:absolute;inset:0;background:rgba(17,17,17,.38);z-index:40}
.sA .v5-sheet{position:absolute;left:0;right:0;z-index:41;background:var(--bg);border-radius:18px 18px 0 0;padding:12px 12px 10px;box-shadow:0 -8px 24px -12px rgba(0,0,0,.4)}
.sA .v5-va{display:flex;align-items:center;gap:6px;margin-bottom:10px;font-size:14px;color:var(--mut)}
.sA .v5-va a{display:inline-flex;align-items:center;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-size:14px;font-weight:600;color:var(--txt);white-space:nowrap}
.sA .v5-va a.on{background:var(--stkbg2);border-color:var(--stk);color:var(--stkd)}
.sA .v5-champ{display:flex;align-items:center;gap:8px;height:52px;padding:0 6px 0 12px;border:2px solid var(--stk);border-radius:14px}
.sA .v5-champ .tx{flex:1;min-width:0;font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sA .v5-champ .tx i{display:inline-block;width:2px;height:20px;margin-left:1px;vertical-align:-4px;background:var(--ink)}
.sA .v5-champ .ic{color:var(--mut);display:grid;place-items:center;width:28px}
.sA .v5-champ .ic .v5-i{width:18px;height:18px}
.sA .v5-noter{display:grid;place-items:center;height:38px;padding:0 14px;border-radius:10px;background:var(--stk);color:#fff;font-size:15px;font-weight:600}
.sA .v5-aide{margin:8px 2px 0;font-size:14px;color:var(--mut)}
.sA .v5-kb{position:absolute;left:0;right:0;bottom:0;height:262px;z-index:41;background:#D3D6DB;padding:8px 3px 0}
.sA .v5-kb>div{display:flex;justify-content:center;gap:5px;margin-bottom:10px}
.sA .v5-kb span{display:grid;place-items:center;width:33px;height:44px;border-radius:6px;background:#fff;font-size:18px;color:var(--ink);box-shadow:0 1px 0 #8f949b}
.sA .v5-kb span.w{width:46px;background:#AEB3BB;font-size:16px}
.sA .v5-kb span.sp{width:190px;font-size:15px}

/* article ouvert (v02-2), choisir (v04-1) */
.sA .v5-card{margin:6px 12px 0;border:1.5px solid var(--ink);border-radius:16px;padding:10px 12px}
.sA .v5-card-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--stkd)}
.sA .v5-rang{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--stk);color:#fff;font-size:14px;font-weight:700}
.sA .v5-card-h .rp{margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-weight:600;color:var(--txt)}
.sA .v5-card-h .rp .v5-i{width:16px;height:16px}
.sA .v5-art{display:flex;gap:12px;margin-top:8px}
.sA .v5-art .v5-vg{width:120px;height:96px}
.sA .v5-art .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.sA .v5-art .tx b{font-size:17px;font-weight:700;line-height:1.2}
.sA .v5-art .big{font-size:22px;font-weight:600;color:var(--stkd)}
.sA .v5-art .big small{font-size:14px;font-weight:600;color:var(--ink)}
.sA .v5-art .lu{font-size:14px;color:var(--mut)}
.sA .v5-regle{position:relative;height:22px;margin:10px 2px 0}
.sA .v5-regle::before{content:"";position:absolute;left:0;right:0;top:10px;height:3px;border-radius:2px;background:var(--line)}
.sA .v5-regle i{position:absolute;top:6px;width:11px;height:11px;margin-left:-5px;border-radius:50%;background:#fff;border:2px solid #9a9a9a}
.sA .v5-regle i.c{top:3px;width:17px;height:17px;margin-left:-8px;background:var(--stk);border:2px solid #fff;box-shadow:0 0 0 1px var(--stk)}
.sA .v5-regle i.p{background:#111;border-color:#111}
.sA .v5-rl{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin:2px 2px 0}
.sA .v5-sec{display:flex;align-items:baseline;justify-content:space-between;margin:10px 0 2px;padding-top:8px;border-top:1px solid var(--line);font-size:14px}
.sA .v5-sec b{font-weight:700}.sA .v5-sec span{color:var(--mut)}
.sA .v5-vd{display:flex;align-items:center;gap:10px;min-height:52px;padding:4px 0}
.sA .v5-vd+.v5-vd{border-top:1px solid var(--line)}
.sA .v5-rad{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line2)}
.sA .v5-rad.on{border:6px solid var(--ink)}
.sA .v5-vd .pr{flex:none;width:62px;font-size:16px;font-weight:600}
.sA .v5-vd .tx{flex:1;min-width:0;font-size:14px;color:var(--mut);line-height:1.3}
.sA .v5-vd .tx b{color:var(--ink);font-weight:600}
.sA .v5-vd .tx em{font-style:normal;color:var(--ok);font-weight:600}
.sA .v5-vd .ou{flex:none;display:inline-flex;align-items:center;gap:3px;font-size:14px;font-weight:600;color:var(--fin)}
.sA .v5-vd .ou .v5-i{width:15px;height:15px}
.sA .v5-veil{display:flex;align-items:center;gap:10px;margin-top:6px;padding:8px 10px;border-radius:12px;background:var(--s1)}
.sA .v5-veil .tx{flex:1;font-size:14px;color:var(--mut);line-height:1.3}
.sA .v5-veil .tx b{color:var(--ink);font-weight:600}
.sA .v5-tg{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.sA .v5-tg i{position:relative;width:40px;height:24px;border-radius:999px;background:var(--stk)}
.sA .v5-tg i::after{content:"";position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff}
.sA .v5-val{display:flex;align-items:center;min-height:32px;font-size:14px;border-top:1px solid var(--line)}
.sA .v5-val span:first-child{flex:1;color:var(--txt)}
.sA .v5-val .v5-m{width:96px;text-align:right;font-size:15px}
.sA .v5-val .pl{width:110px;text-align:right;color:var(--mut)}
.sA .v5-val .pl.b{color:var(--ok);font-weight:700}
.sA .v5-choix{display:flex;gap:8px;margin-top:10px}
.sA .v5-choix .v5-plein{flex:1;font-size:15px;padding:0 8px;white-space:nowrap}

/* ===== source B : greffe2/v05.html (portée .sB) ===== */

.sB{--bg:#FFFFFF;--s1:#F5F5F5;--s2:#EBEBEB;--line:#DDDDDD;--line2:#BFBFBF;--mut:#666666;--txt:#333333;--ink:#111111;

.sB .g5-rk{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);font-family:"IBM Plex Mono",Consolas,monospace;font-size:14px;font-weight:600;color:var(--txt)}

.sB .g5-dkbg{position:absolute;left:0;right:0;bottom:56px;height:84px;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 32%);z-index:30}

.sB .g5-tabs .br .g5-i{color:var(--prod)}.sB .g5-tabs .s .g5-i{color:var(--stk)}.sB .g5-tabs .cl .g5-i{color:var(--txt)}

/* ===== source C : greffe2/v01.html (portée .sC) ===== */

/* Greffe 2, v01, recette G1 « Ses n° 2 en cadre ». Socle : INVENTAIRE.md (9 écrans dans son ordre, habit de l'app d'après
   ref-app). Sources : 1 v09-1 ; 2 v08-2 (+ I4 v05-2) ; 3 v11-3 + rangs v03-1 ; 4 cadre base-E01b + v08-5 ; 5 base-E12b + v01-1 ;
   6 v01-2 + v02-2 ; 7 v01-3 + dessins v03-4 ; 8 v03-6 + en-tête v03-7 ; 9 v10-5 + v02-6 ; I1 v10-1 en bas de la liste.
   Données unifiées sur tout le parcours (les sources se contredisaient) : choisi le 14 nov. chez Brassage Romandie,
   11 700 CHF (v09-1, v10-5), la même chez Abfülltechnik West 11 400 CHF, ≈ 12 320 rendue en Suisse avec la TVA d'import.
   Statique : HTML et CSS, aucun script. Classes g1- (habit du socle) et g2- (ajouts). */
.sC{--bg:#FFFFFF;--s1:#F5F5F5;--s2:#EBEBEB;--s3:#E2E2E2;--line:#DDDDDD;--line2:#BFBFBF;--faint:#9E9E9E;--mut:#666666;--txt:#333333;--ink:#111111;
  --stk:#4C6B2A;--stkd:#3B5420;--hop:#567F45;--blue:#1F64A3;--straw:#F2C14E;--cal:#C87A2C;--bra:#A0522D;--att:#7F5B10;
  --stkbg:color-mix(in srgb,#4C6B2A 9%,#FFFFFF);--stkbg2:color-mix(in srgb,#4C6B2A 15%,#F5F5F5);--okbg:color-mix(in srgb,#567F45 12%,#FFFFFF)}
.sC *{box-sizing:border-box}
.sC,.sC{color:var(--ink);font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.35}
.sC a{color:inherit;text-decoration:none}
.sC .g1-m{font-family:"IBM Plex Mono",Consolas,Menlo,ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:0}
.sC .th{display:inline-block;width:.28em}
.sC .g1-i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* page : un rail d'écrans, chacun titré par son numéro de parcours (E1 à E13) pour comparer d'une version à l'autre */
.sC{}
.sC .g1-page{padding:16px 0 28px}
.sC .g1-tete{margin:0 20px 14px;font-size:16px;color:var(--txt)}
.sC .g1-tete b{font-size:18px;color:var(--ink)}
.sC .g1-tete span{color:var(--mut)}
.sC .g1-rail{display:flex;gap:28px;align-items:flex-start;padding:0 20px 12px;width:100vw;overflow-x:auto;scroll-snap-type:x mandatory}
.sC .g1-col{scroll-snap-align:start}
.sC .g1-col{flex:none;width:390px}
.sC .g1-cap{display:flex;align-items:baseline;gap:8px;height:30px;font-size:16px;color:var(--ink)}
.sC .g1-cap b{font-weight:700}
.sC .g1-cap span{margin-left:auto;font-size:14px;color:var(--mut)}
.sC .g1-scr{position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* en-tête de l'app (ref-app) : logo noir, ‹ Nov. ›, loupe bordée, avatars G et A */
.sC .g1-bar{display:flex;align-items:center;gap:8px;height:52px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.sC .g1-logo{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--ink)}
.sC .g1-logo svg{width:20px;height:20px}
.sC .g1-nom{font-size:15px;font-weight:500;color:var(--ink)}
.sC .g1-mois{margin-left:auto;display:flex;height:36px;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.sC .g1-mois span{display:grid;place-items:center;min-width:34px;font-size:15px;font-weight:600;color:var(--ink)}
.sC .g1-mois span+span{border-left:1px solid var(--line2)}
.sC .g1-mois span.mo{min-width:52px}
.sC .g1-mois .g1-i{width:16px;height:16px}
.sC .g1-lp{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;border:1px solid var(--line2);background:var(--s1)}
.sC .g1-lp .g1-i{width:17px;height:17px}
.sC .g1-av{position:relative;display:flex}
.sC .g1-av span{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:14px;font-weight:700}
.sC .g1-av span:first-child{background:var(--ink);color:#fff}

.sC .g1-av i{position:absolute;right:-1px;top:-2px;width:8px;height:8px;border-radius:50%;background:var(--ink);border:1px solid #fff}

/* segment Stocks (actif noir) et sous-vue au style Étagère / Recompter */
.sC .g1-seg{display:flex;gap:0;margin:8px 8px 0;padding:2px;border-radius:12px;background:var(--s1);border:1px solid var(--line)}

.sC .g1-sous{display:flex;gap:2px;margin:8px 12px 0;padding:3px;border-radius:999px;background:var(--s2)}
.sC .g1-sous a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:34px;border-radius:999px;font-size:15px;font-weight:600;color:var(--txt)}

/* groupes, panneaux et rangées (v09) */
.sC .g1-list{padding:2px 14px 0}

.sC .g1-vg{flex:none;width:52px;height:52px;border-radius:10px;overflow:hidden;display:grid;place-items:center;background:var(--s1)}
.sC .g1-vg>svg{width:100%;height:100%;display:block}
.sC .g1-vg.pic{background:var(--stkbg2);color:var(--stkd)}
.sC .g1-vg.pic>svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sC .g1-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}

.sC .g1-tx span{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sC .g1-tx .q{font-style:italic}
.sC .g1-tx .nx{color:var(--txt)}.sC .g1-tx .nx em{font-style:normal;font-weight:600;color:var(--stkd)}
.sC .g1-tx .why{color:var(--txt)}
.sC .g1-tx .ve{display:inline-flex;align-items:center;gap:4px}
.sC .g1-tx .ve .g1-i{width:16px;height:16px}
.sC .g1-tx .o2{color:var(--txt)}.sC .g1-tx .o2 .g1-m{font-weight:600;color:var(--ink)}
.sC .g1-fig{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:1px;text-align:right}
.sC .g1-fig .p{font-size:15px;font-weight:600;color:var(--ink)}
.sC .g1-fig .u,.sC .g1-fig .d{font-size:14px;color:var(--mut)}
.sC .g1-go{flex:none;display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--stk);font-size:14px;font-weight:600;color:var(--stkd)}
.sC .g1-go .g1-i{width:16px;height:16px}
.sC .g1-col2{display:flex;flex-direction:column;padding:10px 12px}
.sC .g1-col2>.g1-ln{display:flex;align-items:center;gap:12px}
.sC .g1-avl{display:flex;align-items:center;gap:6px;min-height:40px;margin:8px -12px -10px;padding:0 12px 0 76px;border-top:1px dashed var(--line);font-size:14px;font-weight:600;color:var(--stkd)}
.sC .g1-avl .g1-i{width:16px;height:16px}
.sC .g1-avl .go{margin-left:auto;display:inline-flex;align-items:center;gap:2px}

/* fiche : retour bleu, grand titre noir */
.sC .g1-back{display:flex;align-items:center;gap:2px;height:42px;padding:0 10px;font-size:15px;color:var(--blue)}

.sC .g1-back .st{margin-left:auto;display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--stkbg2);color:var(--stkd);font-size:14px;font-weight:600}

.sC .g1-btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 14px;border-radius:10px;background:var(--stk);color:#fff;font-size:15px;font-weight:600}
.sC .g1-btn2{display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);font-size:15px;font-weight:600;color:var(--ink)}

.sC .g1-off .g1-fig .p{color:var(--mut);font-weight:500}

/* barre d'onglets de l'app : icônes aux couleurs de zone, Stocks actif, pastille bleue */

/* Greffe v01, recette R1 : la vue du carnet de v09 (liste, fiche à trancher, fiche choisie) telle quelle, habit de l'app
   d'après ref-app (en-tête logo noir, ‹ Nov. ›, loupe bordée, avatars G/A ; Matériel actif noir ; sous-vue au style
   Étagère/Recompter ; retour bleu ; grand titre noir ; + carré noir à droite au-dessus des onglets ; photo et micro en
   petites icônes dans le champ). Greffes : E2 v10-2, E3 v01 annexe, E5 v11-4, E7/E9 v04-1 déplié sur place, E8 v01,
   E11 v04-3, E12 v10-5, E13 v09-3 + v04-1. Une idée extérieure : I7 (veille dite en mots, v02-2) ; I10 est dans E8.
   Statique : HTML et CSS, aucun script. Classes préfixées q1-. */

.sE{--bg:#FFFFFF;--s1:#F5F5F5;--s2:#EBEBEB;--s3:#E2E2E2;--line:#DDDDDD;--line2:#BFBFBF;--faint:#9E9E9E;--mut:#666666;--txt:#333333;--ink:#111111;
  --stk:#4C6B2A;--stkd:#3B5420;--hop:#567F45;--blue:#1F64A3;--straw:#F2C14E;--cal:#C87A2C;--bra:#A0522D;--att:#7F5B10;
  --stkbg:color-mix(in srgb,#4C6B2A 9%,#FFFFFF);--stkbg2:color-mix(in srgb,#4C6B2A 15%,#F5F5F5);--okbg:color-mix(in srgb,#567F45 12%,#FFFFFF)}
.sE *{box-sizing:border-box}
.sE,.sE{color:var(--ink);font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.35}
.sE a{color:inherit;text-decoration:none}
.sE .q1-m{font-family:"IBM Plex Mono",Consolas,Menlo,ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:0}
.sE .th{display:inline-block;width:.28em}
.sE .q1-i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* page : un rail d'écrans, chacun titré par son numéro de parcours (E1 à E13) pour comparer d'une version à l'autre */
.sE{}
.sE .q1-page{padding:16px 0 28px}
.sE .q1-tete{margin:0 20px 14px;font-size:16px;color:var(--txt)}
.sE .q1-tete b{font-size:18px;color:var(--ink)}

.sE .q1-rail{display:flex;gap:28px;align-items:flex-start;padding:0 20px 12px;width:100vw;overflow-x:auto;scroll-snap-type:x mandatory}
.sE .q1-col{scroll-snap-align:start}
.sE .q1-col{flex:none;width:390px}
.sE .q1-cap{display:flex;align-items:baseline;gap:8px;height:30px;font-size:16px;color:var(--ink)}

.sE .q1-scr{position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* en-tête de l'app (ref-app) : logo noir, ‹ Nov. ›, loupe bordée, avatars G et A */
.sE .q1-bar{display:flex;align-items:center;gap:8px;height:52px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.sE .q1-logo{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--ink)}

/* segment Stocks (actif noir) et sous-vue au style Étagère / Recompter */
.sE .q1-seg{display:flex;gap:0;margin:8px 8px 0;padding:2px;border-radius:12px;background:var(--s1);border:1px solid var(--line)}

/* groupes, panneaux et rangées (v09) */

.sE .q1-h .r{margin-left:auto;font-size:14px;color:var(--mut)}
.sE .q1-pan{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.sE .q1-row{display:flex;align-items:center;gap:12px;min-height:68px;padding:10px 12px}
.sE .q1-row+.q1-row,.sE .q1-row+.q1-col2,.sE .q1-col2+.q1-row{border-top:1px solid var(--line)}
.sE .q1-vg{flex:none;width:52px;height:52px;border-radius:10px;overflow:hidden;display:grid;place-items:center;background:var(--s1)}
.sE .q1-vg>svg{width:100%;height:100%;display:block}
.sE .q1-vg.pic{background:var(--stkbg2);color:var(--stkd)}
.sE .q1-vg.pic>svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sE .q1-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.sE .q1-tx b{font-size:16px;font-weight:600;line-height:1.25;color:var(--ink)}
.sE .q1-tx span{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sE .q1-tx .q{font-style:italic}
.sE .q1-tx .nx{color:var(--txt)}.sE .q1-tx .nx em{font-style:normal;font-weight:600;color:var(--stkd)}
.sE .q1-tx .why{color:var(--txt)}
.sE .q1-tx .ve{display:inline-flex;align-items:center;gap:4px}
.sE .q1-tx .ve .q1-i{width:16px;height:16px}
.sE .q1-tx .o2{color:var(--txt)}.sE .q1-tx .o2 .q1-m{font-weight:600;color:var(--ink)}
.sE .q1-fig{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:1px;text-align:right}
.sE .q1-fig .p{font-size:16px;font-weight:600;color:var(--ink)}
.sE .q1-fig .u,.sE .q1-fig .d{font-size:14px;color:var(--mut)}
.sE .q1-go{flex:none;display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--stk);font-size:14px;font-weight:600;color:var(--stkd)}
.sE .q1-go .q1-i{width:16px;height:16px}
.sE .q1-col2{display:flex;flex-direction:column;padding:10px 12px}

.sE .q1-avl{display:flex;align-items:center;gap:6px;min-height:40px;margin:8px -12px -10px;padding:0 12px 0 76px;border-top:1px dashed var(--line);font-size:14px;font-weight:600;color:var(--stkd)}
.sE .q1-avl .q1-i{width:16px;height:16px}
.sE .q1-avl .go{margin-left:auto;display:inline-flex;align-items:center;gap:2px}
.sE .q1-ex{margin:12px 2px 0;font-size:14px;color:var(--mut)}

/* fiche : retour bleu, grand titre noir */
.sE .q1-back{display:flex;align-items:center;gap:2px;height:42px;padding:0 10px;font-size:16px;color:var(--blue)}
.sE .q1-back .q1-i{width:20px;height:20px}
.sE .q1-back .st{margin-left:auto;display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--stkbg2);color:var(--stkd);font-size:14px;font-weight:600}
.sE .q1-ti{margin:0 14px;font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.sE .q1-kv{display:flex;gap:8px;margin:6px 14px 0;font-size:14px;color:var(--txt)}
.sE .q1-kv>span:first-child{flex:none;width:96px;color:var(--mut)}
.sE .q1-kv b{font-weight:600}
.sE .q1-kv .ia{color:var(--mut)}
.sE .q1-f .q1-row{min-height:58px;padding:8px 12px;gap:10px}
.sE .q1-f .q1-vg{width:44px;height:44px}
.sE .q1-hero{display:flex;gap:12px;padding:12px}
.sE .q1-hero .q1-vg{width:88px;height:80px}
.sE .q1-hero .q1-tx{gap:2px}
.sE .q1-why{display:flex;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid var(--line);font-size:14px;color:var(--txt)}
.sE .q1-why b{font-weight:600;color:var(--stkd)}
.sE .q1-send{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--stkbg)}
.sE .q1-send p{margin:0 0 8px;font-size:14px;color:var(--txt)}
.sE .q1-btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 14px;border-radius:10px;background:var(--stk);color:#fff;font-size:16px;font-weight:600}
.sE .q1-btn2{display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);font-size:16px;font-weight:600;color:var(--ink)}
.sE .q1-off .q1-tx b{color:var(--txt)}
.sE .q1-off .q1-fig .p{color:var(--mut);font-weight:500}
.sE .q1-off .q1-vg{opacity:.75}
.sE .q1-f .q1-off .q1-row{min-height:52px;padding:5px 12px}
.sE .q1-f .q1-off .q1-vg{width:40px;height:40px}
.sE .q1-new{background:var(--okbg)}
.sE .q1-new .nw{color:var(--stkd);font-weight:600}
.sE .q1-new .nw u{text-decoration:none;color:var(--blue);font-weight:600}

/* champ d'une ligne (photo et micro en petites icônes dedans) et + carré noir, juste au-dessus des onglets */
.sE .q1-dock{position:absolute;left:0;right:0;bottom:56px;height:66px;padding:0 12px;display:flex;align-items:center;gap:8px;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 32%);z-index:32}
.sE .q1-in{flex:1;min-width:0;display:flex;align-items:center;gap:2px;height:48px;padding:0 6px 0 14px;border-radius:14px;border:1px solid var(--line2);background:var(--bg);box-shadow:0 4px 12px -8px rgba(0,0,0,.35)}
.sE .q1-in .ph{flex:1;min-width:0;font-size:16px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sE .q1-in .ib{display:grid;place-items:center;width:32px;height:36px;color:var(--mut)}
.sE .q1-in .ib .q1-i{width:18px;height:18px}
.sE .q1-sp{flex:none;width:52px}
.sE .q1-fab{position:absolute;right:12px;bottom:66px;z-index:33;display:grid;place-items:center;width:52px;height:52px;border-radius:15px;background:var(--ink);color:#fff;box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}
.sE .q1-fab .q1-i{width:26px;height:26px;stroke-width:2.4}

/* barre d'onglets de l'app : icônes aux couleurs de zone, Stocks actif, pastille bleue */
.sE .q1-bot{position:absolute;left:0;bottom:0;width:390px;height:56px;display:flex;background:var(--s1);border-top:1px solid var(--line);z-index:30}
.sE .q1-bot a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;letter-spacing:-.01em;position:relative;min-width:0;color:var(--txt)}
.sE .q1-bot a .q1-i{width:20px;height:20px}
.sE .q1-bot .z-fin{color:var(--blue)}.sE .q1-bot .z-cal{color:var(--cal)}.sE .q1-bot .z-bra{color:var(--bra)}.sE .q1-bot .z-stk{color:var(--hop)}
.sE .q1-bot a.on{background:var(--s3);color:var(--ink);font-weight:600;box-shadow:inset 0 3px 0 var(--stk)}
.sE .q1-bot .bdg{position:absolute;top:3px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--blue);color:#fff;font-size:14px;font-weight:700;line-height:20px;text-align:center}

/* voile, feuille du bas et clavier */
.sE .q1-voile{position:absolute;inset:0;background:rgba(17,17,17,.38);z-index:34}
.sE .q1-kb{position:absolute;left:0;right:0;bottom:0;height:268px;z-index:36;background:#D3D6DB;padding:8px 4px 0;display:flex;flex-direction:column;gap:9px}
.sE .q1-kb div{display:flex;justify-content:center;gap:5px}
.sE .q1-kb span{display:grid;place-items:center;width:33px;height:44px;border-radius:6px;background:#FFFFFF;font-size:18px;color:var(--ink);box-shadow:0 1px 0 #9AA0A8}
.sE .q1-kb span.w{width:48px;background:#B5BAC2;font-size:14px}
.sE .q1-kb span.sp{width:186px;font-size:14px;color:var(--mut)}
.sE .q1-comp{position:absolute;left:0;right:0;bottom:268px;z-index:36;padding:10px 12px;background:var(--bg);border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -8px 20px -14px rgba(0,0,0,.45)}
.sE .q1-cible{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:14px;color:var(--mut)}
.sE .q1-cible a{display:inline-flex;align-items:center;min-height:32px;padding:0 10px;border-radius:10px;border:1px solid var(--line);font-size:14px;color:var(--txt)}
.sE .q1-cible a.on{background:var(--stkbg2);border-color:color-mix(in srgb,var(--stk) 45%,#fff);color:var(--stkd);font-weight:600}
.sE .q1-cible b{color:var(--ink);font-weight:600}
.sE .q1-champ{display:flex;align-items:center;gap:2px;min-height:50px;padding:0 6px 0 12px;border:2px solid var(--stk);border-radius:14px;background:var(--bg)}
.sE .q1-champ .tx{flex:1;min-width:0;display:flex;align-items:center;font-size:16px;color:var(--mut);white-space:nowrap;overflow:hidden}
.sE .q1-champ .tx.v{color:var(--ink)}
.sE .q1-champ .cur{flex:none;width:2px;height:20px;background:var(--stk);margin-right:2px}
.sE .q1-champ .tx.v .cur{margin:0 0 0 1px}
.sE .q1-champ .ib{display:grid;place-items:center;width:34px;height:36px;color:var(--mut)}
.sE .q1-champ .ib .q1-i{width:18px;height:18px}
.sE .q1-champ .ok{display:flex;align-items:center;min-height:36px;padding:0 12px;margin-left:4px;border-radius:10px;background:var(--stk);color:#fff;font-size:15px;font-weight:600}
.sE .q1-aide{margin:6px 0 0;font-size:14px;color:var(--mut)}

/* article déplié sur place (v04-1) */
.sE .q1-open{position:relative;border:1px solid var(--ink);border-radius:12px;padding:10px;background:var(--bg);box-shadow:0 8px 24px -12px rgba(0,0,0,.35)}
.sE .q1-fold{position:absolute;right:8px;top:8px;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);color:var(--ink)}
.sE .q1-fold .q1-i{width:16px;height:16px}
.sE .q1-ohero{display:grid;grid-template-columns:112px 1fr;gap:10px}
.sE .q1-ph{position:relative;width:112px;height:88px;border-radius:10px;background:linear-gradient(180deg,#F5F5F5,#EBEBEB)}
.sE .q1-ph svg{width:112px;height:88px;display:block}
.sE .q1-rk{position:absolute;left:-4px;top:-4px;display:grid;place-items:center;min-width:26px;height:26px;border-radius:13px;background:var(--hop);color:#fff;font-size:16px;font-weight:700;line-height:1}
.sE .q1-hn{font-size:16px;font-weight:700;line-height:1.25;padding-right:36px}
.sE .q1-hs{font-size:14px;color:var(--mut);margin-top:2px}
.sE .q1-hp{font-size:20px;font-weight:600;margin-top:4px}
.sE .q1-hp small{font-family:"Source Sans 3",system-ui,sans-serif;font-size:14px;font-weight:400;color:var(--mut)}
.sE .q1-key{display:grid;grid-template-columns:auto auto auto auto;justify-content:space-between;margin-top:6px;padding:4px 10px;border-radius:10px;background:var(--s1)}
.sE .q1-key div{line-height:1.15}
.sE .q1-key .q1-m{display:block;font-size:14px;font-weight:600;color:var(--ink)}
.sE .q1-key span{font-size:14px;color:var(--mut)}
.sE .q1-vend{margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sE .q1-vr{display:grid;grid-template-columns:18px 1fr auto 30px;gap:8px;align-items:center;min-height:42px;padding:2px 4px 2px 10px;font-size:14px}
.sE .q1-vr+.q1-vr{border-top:1px solid var(--line)}
.sE .q1-vr.sel{background:var(--s1)}
.sE .q1-rad{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2)}
.sE .q1-vr.sel .q1-rad{border:5px solid var(--ink)}
.sE .q1-vn{min-width:0}
.sE .q1-vn b{display:block;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sE .q1-vn span{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sE .q1-vn s{color:var(--faint)}
.sE .q1-vr .q1-m{font-size:16px;font-weight:600}
.sE .q1-ext{display:grid;place-items:center;width:30px;height:32px;color:var(--ink)}
.sE .q1-ext .q1-i{width:16px;height:16px}
.sE .q1-place{margin-top:6px;display:grid;gap:4px}
.sE .q1-rw{display:grid;grid-template-rows:20px 16px 18px}
.sE .q1-rw .hd{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--txt)}
.sE .q1-rw .hd b{font-weight:600;color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.sE .q1-rw .hd b .q1-i{width:14px;height:14px;color:var(--stk)}
.sE .q1-rw .hd .q1-m{font-weight:600;color:var(--ink)}
.sE .q1-rw .hd em{font-style:normal;color:var(--mut)}
.sE .q1-rw .bn{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);line-height:18px}
.sE .q1-rule{position:relative;height:16px}
.sE .q1-rule:before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;border-radius:1px;background:var(--line)}
.sE .q1-dot{z-index:2;position:absolute;top:4px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--bg);border:2px solid var(--faint)}
.sE .q1-dot.out{border-style:dotted}
.sE .q1-dot.me{top:2px;width:12px;height:12px;margin-left:-6px;border:0;background:var(--ink);box-shadow:0 0 0 2px var(--bg)}
.sE .q1-rng{position:absolute;top:3px;height:10px;border-radius:5px;background:var(--hop);box-shadow:0 0 0 2px var(--bg)}
.sE .q1-watch{display:flex;align-items:center;gap:8px;margin-top:6px;padding:3px 8px 3px 10px;border-radius:10px;border:1px solid var(--line)}
.sE .q1-watch>.q1-i{color:var(--stk)}
.sE .q1-watch .t{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14px;color:var(--mut);line-height:1.3}
.sE .q1-watch .t b{font-size:15px;font-weight:600;color:var(--ink)}
.sE .q1-tg{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--stkd)}
.sE .q1-tg i{position:relative;width:36px;height:22px;border-radius:11px;background:var(--stk)}
.sE .q1-tg i:after{content:"";position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#FFFFFF}
.sE .q1-act{display:flex;gap:8px;margin-top:6px}
.sE .q1-act .q1-btn{flex:1}
.sE .q1-note{font-size:14px;color:var(--mut);margin:6px 2px 0}
.sE .q1-note b{color:var(--txt);font-weight:600}
.sE .q1-src{font-size:14px;color:var(--mut);margin:4px 2px 0}
.sE .q1-src b{color:var(--att);font-weight:600}

/* confirmation du choix, sur place */
.sE .q1-conf{margin-top:8px;border:1px solid var(--hop);border-radius:10px;background:var(--okbg);padding:10px}
.sE .q1-conf .k{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700;color:var(--stkd)}
.sE .q1-conf .k .q1-i{width:18px;height:18px}
.sE .q1-conf .s{font-size:14px;color:var(--txt);margin:2px 0 0 24px}
.sE .q1-conf label{display:block;margin-top:10px;font-size:14px;color:var(--mut)}
.sE .q1-conf .fld{display:flex;align-items:center;gap:8px;min-height:44px;margin-top:4px;padding:0 10px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);font-size:16px;color:var(--ink)}
.sE .q1-conf .fld .q1-i{margin-left:auto;width:16px;height:16px;color:var(--mut)}
.sE .q1-conf p{margin:8px 0 0;font-size:14px;color:var(--txt)}
.sE .q1-conf .q1-act{margin-top:10px}

/* côte à côte (v01) */
.sE .q1-tb{width:100%;border-collapse:collapse;table-layout:fixed}
.sE .q1-tb th,.sE .q1-tb td{padding:7px 6px;font-size:14px;text-align:left;vertical-align:middle;border-top:1px solid var(--line)}
.sE .q1-tb thead th{border-top:0;vertical-align:top;padding-top:10px}
.sE .q1-tb thead th:first-child{width:86px}
.sE .q1-tb tbody th{font-weight:400;color:var(--mut)}
.sE .q1-tb td{font-family:"IBM Plex Mono",Consolas,monospace;font-variant-numeric:tabular-nums;color:var(--txt)}
.sE .q1-tb td.w{font-family:"Source Sans 3",system-ui,sans-serif}
.sE .q1-tb td.b{background:var(--okbg);color:var(--stkd);font-weight:600}
.sE .q1-tb .hc{display:flex;flex-direction:column;gap:4px}
.sE .q1-tb .hc .q1-vg{width:56px;height:48px}
.sE .q1-tb .hc b{font-size:14px;font-weight:700;color:var(--ink)}
.sE .q1-tb .hc span{font-size:14px;font-weight:400;color:var(--txt);line-height:1.2}
.sE .q1-cpr{display:flex;gap:8px;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--stkbg);font-size:15px;color:var(--txt);line-height:1.4}
.sE .q1-cpr .q1-i{color:var(--stk);margin-top:1px}
.sE .q1-cpr b{color:var(--ink)}

/* carnet vide (annexe v01) */
.sE .q1-vide{margin-top:12px;padding:16px 14px;border:1px dashed var(--line2);border-radius:12px;text-align:left}
.sE .q1-vide .pic{display:grid;place-items:center;width:64px;height:64px;border-radius:12px;background:var(--stkbg2);color:var(--stkd)}
.sE .q1-vide .pic svg{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sE .q1-vide p{margin:10px 0 0;font-size:16px;color:var(--txt);line-height:1.4}
.sE .q1-ia{margin-top:12px;padding:12px;border-radius:12px;background:var(--stkbg)}
.sE .q1-ia .l{display:flex;gap:8px;font-size:16px;color:var(--txt);line-height:1.4}
.sE .q1-ia .l .q1-i{color:var(--stk);margin-top:2px}
.sE .q1-ia .l b{color:var(--ink)}
.sE .q1-ia .q1-act{margin:10px 0 0 28px}
.sE .q1-ia .q1-act a{flex:none;min-height:40px}

/* écarter sur place, reprendre */
.sE .q1-ecr{padding:10px 12px;border-top:1px solid var(--line);background:var(--s1)}
.sE .q1-ecr .q{font-size:15px;font-weight:600;color:var(--ink)}
.sE .q1-ecr .fld{display:flex;align-items:center;gap:8px;min-height:44px;margin-top:6px;padding:0 10px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);font-size:16px;color:var(--ink)}
.sE .q1-ecr .fld em{margin-left:auto;font-style:normal;font-size:14px;color:var(--mut)}
.sE .q1-ecr .q1-act{margin-top:8px}
