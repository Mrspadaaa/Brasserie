<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carnet · greffe 2 · v06 · G6 L'objet d'abord · 9 écrans</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* v06 · recette G6 « L'objet d'abord ». Base : ra+p5f (proto.html). Parcours complet, 9 écrans (4 en deux temps), habit de l'app
   (ref-app : en-tête logo, ‹ Nov. ›, loupe, avatars ; segment gris à onglet noir ; retour bleu ; grands titres noirs ; rangées à filet ;
   mesures et prix en IBM Plex Mono ; bouton plein vert de zone Stocks ; + carré noir au-dessus des onglets). Statique : HTML et CSS seuls.
   Dessins des machines : ceux de v04 (v4-*) ; hotte, extracteur, chambre froide : ceux de v09 (ph-*) ; évier : celui de v08-5. */
:root{--bg:#FFFFFF;--s1:#F5F5F5;--s2:#EBEBEB;--line:#DDDDDD;--line2:#BFBFBF;--faint:#9E9E9E;--mut:#666666;--txt:#333333;--ink:#111111;
  --stk:#4C6B2A;--hop:#567F45;--ok:#3F6B2E;--fin:#1F64A3;--cop:#C87A2C;--prod:#9A4F1E;--att:#7F5B10;--attA:#9C7020;--straw:#F2C14E;
  --cuivre:#8D442C;--or:#7A5A12;
  --stkbg:color-mix(in srgb,#4C6B2A 8%,#FFFFFF);--stkbg2:color-mix(in srgb,#4C6B2A 15%,#FFFFFF);--attbg:color-mix(in srgb,#9C7020 12%,#FFFFFF)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--s2);color:var(--ink);font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.3}
a{color:inherit;text-decoration:none}
body{width:100vw;overflow-x:hidden}
.g6-rail{display:flex;gap:24px;align-items:flex-start;width:100vw;overflow-x:auto;scroll-snap-type:x mandatory}
.g6-rail>.g6-cad{scroll-snap-align:start}
.g6-cad{margin:0;width:390px;flex:none}
.g6-cad figcaption{padding:10px 6px 18px;font-size:14px;line-height:1.4;color:var(--txt)}
.g6-cad figcaption b{color:var(--ink)}
.g6-scr{position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg)}
.g6-i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.g6-m{font-family:"IBM Plex Mono",Consolas,Menlo,ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* en-tête de l'app */
.g6-top{display:flex;align-items:center;gap:8px;height:56px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.g6-logo{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--ink)}
.g6-logo svg{width:24px;height:24px}
.g6-marque{font-size:18px;font-weight:600;letter-spacing:-.01em}
.g6-mois{margin-left:auto;display:flex;height:38px;border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.g6-mois i{font-style:normal;display:grid;place-items:center;width:30px;color:var(--txt)}
.g6-mois i svg{width:18px;height:18px}
.g6-mois b{display:grid;place-items:center;width:52px;font-size:16px;font-weight:500;border-left:1px solid var(--line2);border-right:1px solid var(--line2)}
.g6-loupe{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--s1)}
.g6-avs{position:relative;display:flex;width:52px}
.g6-avs span{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;font-size:14px;font-weight:700}
.g6-avs .g{background:var(--ink);color:#fff;position:relative;z-index:1}
.g6-avs .a{background:var(--s2);color:var(--txt);margin-left:-8px}
.g6-avs i{position:absolute;right:-1px;top:-3px;z-index:2;width:9px;height:9px;border-radius:50%;background:var(--ink);border:1.5px solid #fff}

/* segments de l'app : gris, onglet actif noir */
.g6-seg{display:flex;gap:2px;margin:8px 12px 0;padding:3px;border-radius:12px;background:var(--s1);border:1px solid var(--line)}
.g6-seg a{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:5px;height:36px;padding:0 6px;border-radius:9px;font-size:14px;color:var(--txt);white-space:nowrap}
.g6-seg a.on{background:var(--ink);color:#fff;font-weight:600}
.g6-seg .n{font-family:"IBM Plex Mono",Consolas,monospace;font-size:14px;color:var(--mut)}
.g6-seg a.on .n{color:#fff}

/* bandeau À venir · Réalisés (I3, v11-1) */
.g6-sorties{display:flex;gap:8px;margin:8px 12px 0}
.g6-so{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:44px;padding:0 8px 0 10px;border:1px solid var(--line2);border-radius:10px;background:var(--bg)}
.g6-so b{font-size:16px;font-weight:600;white-space:nowrap}
.g6-so span{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.g6-so em{margin-left:auto;font-style:normal;color:var(--mut)}
.g6-so em svg{width:16px;height:16px;display:block}
.g6-so.r{flex:none;width:118px}
.g6-so.r span{flex:none}
.g6-so .g6-i{color:var(--hop)}

/* titres et groupes */
.g6-main{padding:0 12px}
.g6-h2{display:flex;align-items:baseline;gap:6px;margin:12px 0 0;font-size:18px;font-weight:700}
.g6-h2 .n{font-size:14px;font-weight:500;color:var(--mut)}
.g6-gh{display:flex;align-items:center;margin:10px 0 6px}
.g6-gh .t{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--stkbg2);font-size:14px;font-weight:700;color:var(--ok)}
.g6-gh .t .n{font-family:"IBM Plex Mono",Consolas,monospace;font-weight:500}
.g6-gh .r{margin-left:auto;font-size:14px;color:var(--mut)}

/* panneaux à filet */
.g6-pan{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.g6-row{display:flex;align-items:center;gap:12px;min-height:66px;padding:8px 12px}
.g6-row+.g6-row{border-top:1px solid var(--line)}
.g6-vg{flex:none;width:52px;height:52px;border-radius:8px;overflow:hidden;background:var(--s1);display:grid;place-items:center}
.g6-vg>svg{width:100%;height:100%;display:block}
.g6-vg.pic{background:var(--stkbg2);color:var(--ok)}
.g6-vg.pic>svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.g6-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.g6-tx b{font-size:16px;font-weight:600;line-height:1.25}
.g6-tx span{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g6-tx .nx{color:var(--txt)}.g6-tx .nx em{font-style:normal;font-weight:600;color:var(--ok)}
.g6-tx .q{font-style:italic}
.g6-tx .why{color:var(--txt)}
.g6-tx .ve{display:inline-flex;align-items:center;gap:4px}
.g6-tx .ve svg{width:16px;height:16px}
.g6-fig{flex:none;display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.g6-fig .p{font-size:16px;font-weight:600}
.g6-fig .u,.g6-fig .d{font-size:14px;color:var(--mut)}
.g6-go{flex:none;display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--stk);font-size:14px;font-weight:600;color:var(--ok)}
.g6-go svg{width:16px;height:16px}
.g6-col{flex-direction:column;align-items:stretch;gap:0;padding-bottom:0}
.g6-col>.g6-ln{display:flex;align-items:center;gap:12px}
.g6-avl{display:flex;align-items:center;gap:6px;height:38px;margin:8px -12px 0;padding:0 12px 0 76px;border-top:1px dashed var(--line);font-size:14px;font-weight:600;color:var(--ok)}
.g6-avl svg{width:16px;height:16px}
.g6-avl .go{margin-left:auto;display:inline-flex;align-items:center;gap:2px}
.g6-ex{margin:10px 2px 0;font-size:14px;color:var(--mut)}

/* retour, grand titre */
.g6-backl{display:flex;align-items:center;height:42px;padding:0 12px 0 6px}
.g6-back{display:inline-flex;align-items:center;gap:2px;font-size:16px;color:var(--fin)}
.g6-etat{margin-left:auto;display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-size:14px;color:var(--txt)}
.g6-etat svg{width:16px;height:16px;color:var(--ok)}
.g6-h1{margin:0;font-size:28px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.g6-sub{margin-top:2px;font-size:14px;color:var(--mut)}

/* champ (C8) + bouton volant + onglets */
.g6-fond{position:absolute;left:0;right:0;bottom:52px;height:86px;background:linear-gradient(rgba(255,255,255,0),#fff 38%);z-index:29}
.g6-dock{position:absolute;left:12px;right:76px;bottom:62px;height:52px;display:flex;align-items:center;gap:2px;padding:0 6px 0 14px;border:1px solid var(--line2);border-radius:12px;background:var(--bg);box-shadow:0 4px 14px -8px rgba(0,0,0,.3);z-index:31}
.g6-dock .ph{flex:1;min-width:0;font-size:16px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g6-dock .tx{flex:1;min-width:0;font-size:16px;color:var(--ink);white-space:nowrap}
.g6-dock .ic{flex:none;display:grid;place-items:center;width:32px;height:34px;color:var(--mut)}
.g6-dock .ic svg{width:19px;height:19px}
.g6-dock .lkc>span{overflow:hidden;text-overflow:ellipsis}
.g6-dock .lkc{flex:1;min-width:0;display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font-size:14px;color:var(--txt);white-space:nowrap;overflow:hidden}
.g6-dock .lkc svg{width:16px;height:16px}
.g6-dock.kb{bottom:224px;right:12px;padding-right:6px}
.g6-fab{position:absolute;right:12px;bottom:62px;width:52px;height:52px;border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center;z-index:32;box-shadow:0 8px 18px -8px rgba(0,0,0,.55)}
.g6-fab svg{width:26px;height:26px;stroke-width:2.4}
.g6-nav{position:absolute;left:0;right:0;bottom:0;height:52px;display:flex;background:var(--s1);border-top:1px solid var(--line);z-index:30}
.g6-nav a{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:14px;letter-spacing:-.02em;color:var(--txt)}
.g6-nav a svg{width:20px;height:20px}
.g6-nav .fin svg{color:var(--fin)}.g6-nav .cal svg,.g6-nav .bra svg{color:var(--cop)}.g6-nav .stk svg{color:var(--hop)}
.g6-nav .stk{--z:#567F45}.g6-nav .cal{--z:#9A4F1E}
.g6-nav a.on{font-weight:600;color:var(--ink);background:color-mix(in srgb,var(--z) 13%,#F5F5F5);box-shadow:inset 0 3px 0 var(--z)}
.g6-nav .bdg{position:absolute;top:1px;left:calc(50% + 2px);min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--fin);color:#fff;font-size:14px;font-weight:600;line-height:20px;text-align:center;border:1px solid #F5F5F5;letter-spacing:0}

/* boutons */
.g6-btns{display:flex;gap:8px;margin-top:8px}
.g6-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap}
.g6-btn svg{width:17px;height:17px}
.g6-cta{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:10px;background:var(--stk);color:#fff;font-size:16px;font-weight:600}
.g6-cta svg{width:19px;height:19px}
.g6-tg{flex:none;position:relative;width:42px;height:24px;border-radius:12px;background:var(--stk)}
.g6-tg:after{content:"";position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff}

/* 2 · ajouter une idée (v08-2 + I5) */
.g6-ghost{margin-top:12px;padding:10px 12px;border:2px dashed var(--stk);border-radius:12px;background:var(--stkbg)}
.g6-ghost .l1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.g6-ghost .l1 b{font-size:18px;font-weight:700}
.g6-ghost .ici{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--ok);white-space:nowrap}
.g6-ghost .ici svg{width:16px;height:16px}
.g6-ghost .l2{font-size:14px;color:var(--txt);margin-top:2px}
.g6-ghost .l2 b{color:var(--ok)}
.g6-caret{display:inline-block;width:2px;height:19px;background:var(--ink);margin-left:1px;vertical-align:-3px}
.g6-ou{margin-top:10px}
.g6-ou .q{font-size:14px;color:var(--mut);margin-bottom:6px}
.g6-opts{display:flex;gap:8px}
.g6-opt{flex:1;display:flex;align-items:center;gap:8px;min-height:56px;padding:6px 10px;border:1px solid var(--line2);border-radius:10px;font-size:14px;background:var(--bg)}
.g6-opt b{font-weight:600}
.g6-opt.on{border:2px solid var(--stk);background:var(--stkbg)}
.g6-rad{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);background:#fff}
.g6-opt.on .g6-rad{border:5px solid var(--stk)}
.g6-opt em{display:flex;align-items:center;gap:4px;font-style:normal;font-size:14px;color:var(--mut)}
.g6-opt em svg{width:15px;height:15px;color:var(--hop)}
.g6-mini{margin-top:0}
.g6-mr{display:flex;justify-content:space-between;align-items:center;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:16px}
.g6-mr .st{font-size:14px;font-weight:600}
.g6-mr .cu{color:var(--cuivre)}.g6-mr .or{color:var(--or)}.g6-mr .okk{color:var(--ok)}
.g6-creer{flex:none;display:inline-flex;align-items:center;gap:4px;height:38px;padding:0 12px;border-radius:10px;background:var(--stk);color:#fff;font-size:16px;font-weight:600}
.g6-creer svg{width:18px;height:18px}
.g6-kbd{position:absolute;left:0;right:0;bottom:0;height:214px;padding:8px 3px 0;background:#D5D8DD;z-index:30}
.g6-kbd .rg{display:flex;justify-content:center;gap:5px;margin-bottom:9px}
.g6-kbd i{font-style:normal;display:grid;place-items:center;width:33px;height:42px;border-radius:6px;background:#fff;font-size:16px;color:var(--ink);box-shadow:0 1px 0 #9A9EA5}
.g6-kbd i.k{width:44px;background:#B5BAC2;font-size:16px}
.g6-kbd i.w{width:170px;font-size:16px}
.g6-kbd i.go{width:60px;background:var(--stk);color:#fff}

/* 3 · carnet ouvert (v04-1) */
.g6-crit{display:flex;gap:8px;align-items:flex-start;margin-top:8px;padding:7px 10px;border-radius:10px;background:var(--s1);border:1px solid var(--line)}
.g6-crit svg{color:var(--hop);margin-top:2px}
.g6-crit em{display:block;font-style:normal;font-size:14px;color:var(--mut)}
.g6-crit b{display:block;font-size:16px;font-weight:600;line-height:1.25}
.g6-sep{margin-top:6px;padding:8px 12px 9px;border-radius:12px;background:var(--stkbg);border:1px solid color-mix(in srgb,#4C6B2A 28%,#FFFFFF)}
.g6-crit2{display:flex;gap:8px;align-items:flex-start;padding-bottom:5px;margin-bottom:5px;border-bottom:1px solid color-mix(in srgb,#4C6B2A 25%,#FFFFFF)}
.g6-crit2 svg{color:var(--hop);margin-top:2px}
.g6-crit2 em{display:block;font-style:normal;font-size:14px;color:var(--mut)}
.g6-crit2 b{display:block;font-size:16px;font-weight:600;line-height:1.25;color:var(--ink)}
.g6-sep .g6-btn{height:34px}
.g6-sep p{margin:0;font-size:14px;line-height:1.35;color:var(--txt)}
.g6-sep p b{color:var(--ok)}
.g6-sep s{color:var(--mut)}
.g6-lh{display:flex;align-items:baseline;justify-content:space-between;margin:7px 0 5px}
.g6-lh b{font-size:16px;font-weight:700}
.g6-lh span{font-size:14px;color:var(--mut)}
.g6-art{display:grid;grid-template-columns:44px 1fr auto;column-gap:10px;row-gap:0;align-items:center;padding:4px 10px;line-height:1.16}
.g6-art+.g6-art{border-top:1px solid var(--line)}
.g6-art>.g6-vg{grid-row:1/4;align-self:start;overflow:visible;position:relative;width:44px;height:44px;margin-top:3px}
.g6-art>.g6-vg>svg{border-radius:8px}
.g6-rk{position:absolute;left:-5px;top:-5px;min-width:22px;height:22px;border-radius:11px;background:var(--bg);border:1px solid var(--line2);font-size:14px;font-weight:700;display:grid;place-items:center;line-height:1}
.g6-rk.best{background:var(--hop);border-color:var(--hop);color:#fff}
.g6-rk.nv{color:var(--att);border-color:var(--attA)}
.g6-art .nm{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g6-art .px{font-size:16px;font-weight:600;text-align:right;white-space:nowrap}
.g6-art .vd{grid-column:2/4;font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g6-dl{color:var(--att)}.g6-dl.ok{color:var(--ok)}
.g6-art .mini{grid-column:2/4;display:flex;align-items:center;gap:6px;margin-top:1px}
.g6-o2{font-size:14px;font-weight:700;color:var(--ok)}
.g6-rule{position:relative;height:16px;flex:1;min-width:70px}
.g6-rule:before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;border-radius:1px;background:var(--line)}
.g6-dot{position:absolute;z-index:2;top:4px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--bg);border:2px solid var(--faint)}
.g6-dot.out{border-style:dotted}
.g6-dot.me{top:2px;width:12px;height:12px;margin-left:-6px;border:0;background:var(--hop);box-shadow:0 0 0 2px var(--bg)}
.g6-rng{position:absolute;top:3px;height:10px;border-radius:5px;background:var(--ink)}
.g6-rng.best{background:var(--hop)}
.g6-rng.est{background:repeating-linear-gradient(90deg,var(--ink) 0 6px,var(--faint) 6px 9px)}
.g6-rng.off{background:var(--faint)}
.g6-mv{font-size:14px;color:var(--mut);white-space:nowrap}
.g6-mv b{font-weight:600;color:var(--ink)}
.g6-mv .nv{color:var(--att);font-weight:600}
.g6-art.out{background:var(--s1)}
.g6-art.out .nm,.g6-art.out .px{color:var(--mut)}
.g6-art .why{grid-column:2/4;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--txt)}
.g6-art .why a{font-weight:600;color:var(--fin);white-space:nowrap}
.g6-cmp{display:flex;align-items:center;gap:8px;margin-top:6px;height:38px;padding:0 10px 0 12px;border:1px solid var(--line2);border-radius:10px;font-size:16px;font-weight:600}
.g6-cmp span{font-size:14px;font-weight:400;color:var(--mut)}
.g6-cmp em{margin-left:auto;font-style:normal;color:var(--mut)}
.g6-cmp em svg{width:18px;height:18px;display:block}

/* 4 · ajouter à une idée (base E01b + v06-4 + v07-1) */
.g6-q{margin-top:4px;font-size:16px;font-style:italic;color:var(--txt)}
.g6-vide{display:flex;align-items:center;gap:8px;min-height:44px;border-bottom:1px solid var(--line);font-size:14px;color:var(--mut)}
.g6-vide b{color:var(--ink);font-weight:600}
.g6-vide svg{color:var(--mut)}
.g6-vide:first-of-type{margin-top:10px;border-top:1px solid var(--line)}
.g6-voile{position:absolute;left:0;right:0;top:0;bottom:52px;background:rgba(17,17,17,.38);z-index:20}
