<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Carnet · greffe 2 · G4 Le + dit quoi</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Greffe 2, recette G4 « Le + dit quoi » (17.11). Base ra+p5f (E12b, E01b, E14a) ; écrans de son top 3 :
   1 v09-1 (+ I1 v10-1) · 2 v08-2 (+ I5 v06-1) · 3 v08-3 neuf, v11-3 rempli · 4 v06-4, v08-5, v07-2 · 5 base E12b ·
   6 v01-2 + v02-2 · 7 v01-3 + E14a · 8 v03-7 + v09-3 · 9 v10-5 + v02-6. Habit : ref-app. HTML et CSS seuls. */
:root{--bg:#FFFFFF;--s1:#F5F5F5;--s2:#EBEBEB;--line:#E0E0E0;--line2:#BFBFBF;--mut:#666666;--txt:#333333;--ink:#111111;
  --stk:#4C6B2A;--hop:#567F45;--hopd:#3F6B2E;--stkbg:#EEF4E8;--stkbg2:#E2ECD7;--zone:#A3C97A;--fin:#1F64A3;
  --att:#7F5B10;--attbg:#FBF1D9;--cal:#C87A2C;--prod:#9A4F1E;--straw:#F2C14E;--ambre:#8A5212}
*{box-sizing:border-box}
html,body{margin:0;background:var(--s2)}
body{color:var(--ink);font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.3}
a{color:inherit;text-decoration:none}
.m{font-family:"IBM Plex Mono",Consolas,ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
body{width:100vw;overflow-x:hidden}
.h4-page{width:100vw;overflow-x:auto;padding:0 0 20px}
.h4-rail{display:flex;gap:24px;align-items:flex-start;width:max-content;padding:0 12px 0 0}
.h4-fig{margin:0;width:390px;flex:none}
.h4-fig>figcaption{height:58px;display:flex;gap:8px;align-items:flex-start;padding:8px 2px 0;font-size:14px;color:var(--txt)}
.h4-fig>figcaption>b{flex:none;display:grid;place-items:center;min-width:26px;height:24px;padding:0 6px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700}
.h4-fig>figcaption em{font-style:normal;color:var(--mut)}
.h4-foot{margin:14px 12px 0;font-size:14px;color:var(--mut)}
.h4-tel{position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 1px #D2D2D2}
.h4-i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.h4-i.s{width:16px;height:16px}

/* en-tête de l'app */
.h4-top{display:flex;align-items:center;gap:7px;height:50px;padding:0 10px;border-bottom:1px solid var(--line)}
.h4-logo{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--ink)}
.h4-logo svg{width:20px;height:20px}
.h4-nom{font-size:16px;font-weight:600;letter-spacing:-.01em}
.h4-mois{margin-left:auto;display:flex;height:36px;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.h4-mois i{display:grid;place-items:center;width:32px}
.h4-mois i .h4-i{width:18px;height:18px}
.h4-mois b{display:grid;place-items:center;width:52px;border-left:1px solid var(--line2);border-right:1px solid var(--line2);font-size:15px;font-weight:600}
.h4-lou{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:var(--s1)}
.h4-lou .h4-i{width:18px;height:18px}
.h4-av{position:relative;display:flex}
.h4-av span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid var(--bg);font-size:14px;font-weight:700}
.h4-av span:first-child{background:var(--ink);color:#fff}
.h4-av span+span{margin-left:-8px;background:#E3E3E3}
.h4-av i{position:absolute;top:-1px;right:-1px;width:8px;height:8px;border-radius:50%;background:var(--ink)}

/* segment Stocks, sous-segment façon Étagère / Recompter */
.h4-seg{display:flex;margin:8px 10px 0;padding:3px;border-radius:12px;background:var(--s1);border:1px solid var(--line)}
.h4-seg a{flex:1;text-align:center;line-height:34px;border-radius:9px;font-size:15px;color:var(--txt)}
.h4-seg a.on{background:var(--ink);color:#fff;font-weight:600}
.h4-sous{display:flex;margin:8px 10px 0;padding:3px;border-radius:999px;background:var(--s2)}
.h4-sous a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:34px;border-radius:999px;font-size:15px;font-weight:600;color:var(--txt)}
.h4-sous a.on{background:var(--ink);color:#fff}
.h4-sous .n{font-family:"IBM Plex Mono",Consolas,monospace;font-weight:500;color:var(--mut)}
.h4-sous a.on .n{color:#fff}

/* liste, rangées à filet */
.h4-c{padding:0 12px}
.h4-gh{display:flex;align-items:center;gap:6px;margin:9px 0 5px}
.h4-gh .t{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:999px;background:var(--stkbg2);font-size:14px;font-weight:700;color:var(--hopd)}
.h4-gh .t .n{font-family:"IBM Plex Mono",Consolas,monospace;font-weight:500}
.h4-gh .t.att{background:var(--attbg);color:var(--att)}
.h4-gh .t.neu{background:#EDEDED;color:var(--txt)}
.h4-gh .t.vei{background:#E3ECF5;color:var(--fin)}
.h4-gh .r{margin-left:auto;font-size:14px;color:var(--mut)}
.h4-pan{border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden}
.h4-row{display:flex;align-items:center;gap:12px;padding:8px 12px}
.h4-row+.h4-row{border-top:1px solid var(--line)}
.h4-vg{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:8px;background:#F1F3EE}
.h4-vg svg{width:42px;height:36px}
.h4-vg.l{width:64px;height:60px}.h4-vg.l svg{width:56px;height:48px}
.h4-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.h4-tx>b{font-size:16px;font-weight:600;line-height:1.22}
.h4-tx>span{font-size:14px;color:var(--mut)}
.h4-tx .nx{color:var(--txt)}.h4-tx .nx em{font-style:normal;font-weight:600;color:var(--hopd)}
.h4-tx .q{font-style:italic}
.h4-tx .ve{display:inline-flex;align-items:center;gap:4px}
.h4-pr{flex:none;display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.h4-pr b{font-size:16px;font-weight:600}
.h4-pr small{font-size:14px;color:var(--mut)}
.h4-pr s{font-size:14px;color:var(--mut)}
.h4-avl{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 12px 0 72px;border-top:1px dashed var(--line2);font-size:14px;font-weight:600;color:var(--hopd)}
.h4-avl .go{margin-left:auto;color:var(--fin)}
.h4-pi{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap}
.h4-pi.att{background:var(--attbg);color:var(--att)}
.h4-pi.ok{background:var(--stkbg2);color:var(--hopd)}
.h4-pi.neu{background:#F0F0F0;color:var(--txt)}
.h4-b{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);font-size:14px;font-weight:600;color:var(--txt);white-space:nowrap}
.h4-b.v{border-color:var(--stk);color:var(--stk)}
.h4-b.k{border-color:var(--ink);color:var(--ink)}
.h4-plein{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:10px;background:var(--stk);color:#fff;font-size:16px;font-weight:600}

/* fiche : retour bleu, grand titre */
.h4-back{display:flex;align-items:center;gap:4px;height:42px;padding:0 10px 0 6px;font-size:16px;color:var(--fin)}
.h4-back .d{margin-left:auto;display:flex;align-items:center;gap:10px}
.h4-back .u{font-size:14px;color:var(--txt);text-decoration:underline}
.h4-h1{margin:0 14px;font-size:28px;font-weight:700;line-height:1.1;letter-spacing:-.015em}
.h4-h1.lg{font-size:25px}
.h4-sub{margin:4px 14px 0;font-size:15px;color:var(--mut)}
.h4-crit{display:flex;align-items:center;gap:6px;margin:8px 14px 0;font-size:15px;color:var(--txt)}
.h4-crit .h4-i{color:var(--stk)}
.h4-crit b{font-weight:600;color:var(--ink)}
.h4-crit span{color:var(--mut)}
.h4-sec{margin:14px 14px 0}
.h4-sh{display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:15px;font-weight:700}
.h4-sh .h4-i{width:18px;height:18px;color:var(--mut)}
.h4-sh small{margin-left:auto;font-size:14px;font-weight:400;color:var(--mut)}
.h4-box{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.h4-box+.h4-box{margin-top:6px}
.h4-box .tx{flex:1;display:flex;flex-direction:column;gap:1px;font-size:14px;color:var(--mut)}
.h4-box .tx b{font-size:16px;font-weight:600;color:var(--ink);line-height:1.22}
.h4-box .bt{display:flex;gap:6px}
.h4-slot{display:flex;align-items:center;gap:10px;padding:14px 12px;border:1.5px dashed #9DBB85;border-radius:8px;background:#FAFCF7;font-size:15px;color:var(--txt)}
.h4-slot .h4-i{color:var(--stk)}

/* champ du bas (C8) et + carré noir */
.h4-dock{position:absolute;left:0;right:0;bottom:56px;z-index:6;height:72px;padding:0 76px 0 12px;display:flex;align-items:center;background:linear-gradient(rgba(255,255,255,0),#fff 30%)}
.h4-in{flex:1;min-width:0;display:flex;align-items:center;gap:12px;height:48px;padding:0 12px 0 14px;border:1px solid var(--line2);border-radius:12px;background:var(--bg);font-size:16px;color:var(--mut)}
.h4-in em{flex:1;min-width:0;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h4-in .h4-i{color:var(--mut)}
.h4-in .ec{color:var(--ink)}
.h4-caret{display:inline-block;width:2px;height:19px;margin-left:1px;vertical-align:-3px;background:var(--fin)}
.h4-fab{position:absolute;right:12px;bottom:66px;z-index:7;display:grid;place-items:center;width:52px;height:52px;border-radius:14px;background:var(--ink);color:#fff;box-shadow:0 6px 16px -6px rgba(0,0,0,.55)}
.h4-fab .h4-i{width:26px;height:26px;stroke-width:2.4}
.h4-fab.x{width:auto;display:flex;align-items:center;gap:4px;padding:0 16px 0 11px;font-size:16px;font-weight:600}
.h4-dock.w{padding-right:118px}

/* barre d'onglets */
.h4-nav{position:absolute;left:0;right:0;bottom:0;z-index:8;height:56px;display:flex;border-top:1px solid var(--line);background:#FAFAFA}
.h4-nav a{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;color:var(--txt);letter-spacing:-.01em}
.h4-nav a .h4-i{width:22px;height:22px;stroke-width:1.8}
.h4-nav .fi .h4-i{color:var(--fin)}.h4-nav .ca .h4-i{color:var(--cal)}.h4-nav .br .h4-i{color:var(--prod)}.h4-nav .st .h4-i{color:var(--stk)}
.h4-nav a.on{background:var(--stkbg);color:var(--ink);font-weight:600}
.h4-nav .bdg{position:absolute;top:3px;right:10px;display:grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:var(--fin);color:#fff;font:600 14px/1 "IBM Plex Mono",Consolas,monospace}

/* clavier */
.h4-kbd{position:absolute;left:0;right:0;bottom:0;z-index:9;height:222px;padding:8px 3px 0;background:#D3D6DB}
.h4-kbd div{display:flex;gap:5px;margin-bottom:9px;padding:0 2px}
.h4-kbd i{flex:1;display:grid;place-items:center;height:42px;border-radius:6px;background:#fff;box-shadow:0 1px 0 #8E9298;font:400 18px/1 system-ui,sans-serif;color:var(--ink);font-style:normal}
.h4-kbd i.k{flex:1.4;background:#ABB0B8}
.h4-kbd i.w{flex:5}
.h4-kbd i.go{flex:1.6;background:var(--stk);color:#fff}
.h4-kb .h4-dock{bottom:222px;background:#fff;border-top:1px solid var(--line);padding:0 10px}

/* 2 : carte qui arrive, choix où la ranger (I5) */
.h4-ghost{margin:10px 12px 0;padding:10px 12px;border:2px dashed var(--hop);border-radius:8px;background:var(--stkbg)}
.h4-ghost .l1{display:flex;align-items:center;gap:8px}
.h4-ghost .l1 b{flex:1;font-size:17px;font-weight:700}
.h4-ghost .ici{display:inline-flex;align-items:center;gap:3px;font-size:14px;font-weight:600;color:var(--hopd)}
.h4-ghost .l2{margin-top:2px;font-size:14px;color:var(--txt)}
.h4-ghost .l2 b{color:var(--hopd)}
.h4-ou{margin:8px 12px 0}
.h4-ou p{margin:0 0 6px;font-size:14px;color:var(--mut)}
.h4-ou p b{color:var(--ink);font-weight:600}
.h4-opts{display:flex;gap:8px}
.h4-opt{flex:1;display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 10px;border:1px solid var(--line2);border-radius:8px;font-size:15px}
.h4-opt.on{border:2px solid var(--stk);background:var(--stkbg)}
.h4-opt b{display:block;font-weight:600}
.h4-opt small{display:inline-flex;align-items:center;gap:3px;font-size:14px;color:var(--mut)}
.h4-rd{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #8A8A8A}
.h4-rd.on{border-color:var(--stk);background:var(--stk);box-shadow:inset 0 0 0 3px #fff}
.h4-dim{margin:10px 12px 0;opacity:.62}
.h4-dimh{margin:12px 12px 0;font-size:14px;color:var(--mut)}
.h4-dim div{display:flex;align-items:center;height:42px;padding:0 12px;border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:8px;font-size:16px;font-weight:600;color:var(--txt)}
.h4-dim div+div{margin-top:5px}
.h4-dim span{margin-left:auto;font-size:14px;font-weight:600;color:var(--mut)}
.h4-cree{flex:none;display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 12px;border-radius:9px;background:var(--stk);color:#fff;font-size:15px;font-weight:600}

/* 3b : façons en cartes, tableau par façon (v11-3) */
.h4-fc{display:flex;gap:8px}
.h4-fc>div{flex:1;padding:9px 10px;border:1px solid var(--line);border-radius:8px}
.h4-fc>div.lead{border-color:#D9B860;background:#FFF9EC}
.h4-fc b{display:block;font-size:15px;font-weight:700}
.h4-fc .p{font-size:14px;color:var(--txt)}
.h4-fc .w{display:block;font-size:14px;color:var(--mut)}
.h4-fc .lead .w{color:var(--att);font-weight:600}
.h4-fc .bt{display:flex;gap:6px;margin-top:7px}
.h4-fc .bt .h4-b{flex:1;height:34px;padding:0 6px}
.h4-tab{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.h4-tab .th,.h4-tab .tr{display:flex;align-items:center;gap:6px;padding:0 10px}
.h4-tab .th{height:36px;align-items:flex-end;padding-bottom:4px;font-size:14px;color:var(--mut);line-height:1.05}
.h4-tab .tg{padding:4px 10px;background:var(--s1);border-top:1px solid var(--line);font-size:14px;font-weight:600;color:var(--txt)}
.h4-tab .tr{min-height:42px;border-top:1px solid var(--line)}
.h4-tab .nm{flex:1;min-width:0;display:flex;flex-direction:column;font-size:15px;font-weight:600;line-height:1.15}
.h4-tab .nm small{font-size:14px;font-weight:400;color:var(--mut);display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.h4-tab .tr .h4-vg{width:34px;height:34px;border-radius:6px}.h4-tab .tr .h4-vg svg{width:30px;height:26px}
.h4-tab .c{flex:none;width:46px;text-align:right;font-size:14px}
.h4-tab .c.p{width:52px}
.h4-tab .best{color:var(--hopd);font-weight:600}
.h4-tab .ok-l{color:var(--fin);font-weight:600;display:inline-flex;align-items:center;gap:3px;font-size:14px}
.h4-ln{display:flex;align-items:center;gap:8px;margin:10px 14px 0;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:8px;font-size:16px;font-weight:600}
.h4-ln span{font-size:14px;font-weight:400;color:var(--mut)}
.h4-ln .h4-i{margin-left:auto;color:var(--mut)}

/* 4a : le + dit QUOI (v06-4) */
.h4-scrim{position:absolute;inset:0;z-index:5;background:rgba(17,17,17,.4)}
.h4-menu{position:absolute;left:10px;right:10px;bottom:132px;z-index:7;padding:12px 0 6px;border-radius:14px;background:var(--bg);box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.h4-menu .mh{padding:0 16px 8px;font-size:18px;font-weight:700}
.h4-menu .mh small{display:block;font-size:15px;font-weight:400;color:var(--mut)}
.h4-mr{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 16px;border-top:1px solid var(--line)}
.h4-mr .ic{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--stkbg);color:var(--stk);flex:none}
.h4-mr .tx{flex:1;display:flex;flex-direction:column;font-size:14px;color:var(--mut)}
.h4-mr .tx b{font-size:17px;font-weight:600;color:var(--ink)}
.h4-mr>.h4-i{color:var(--mut)}
.h4-paste{display:flex;align-items:center;gap:8px;margin:0 16px 8px 62px;padding:6px 6px 6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--s1);font-size:14px;color:var(--txt)}
.h4-paste .u{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h4-paste .h4-b{height:32px}
.h4-dock.lit{background:#fff}
.h4-dock.lit .h4-in{border-color:var(--ink)}

/* 4b, 4c : ce qui arrive se voit dans sa case (v08-5, v07-2) */
.h4-arr{display:flex;gap:12px;padding:10px;border:2px dashed var(--hop);border-radius:8px;background:var(--stkbg)}
.h4-arr .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--txt)}
.h4-arr .tx b{font-size:16px;font-weight:600;color:var(--ink);line-height:1.2}
.h4-arr .tx .pr{font-size:16px;font-weight:600;color:var(--ink)}
.h4-arr .ici{display:inline-flex;align-items:center;gap:3px;float:right;margin-left:6px;font-size:14px;font-weight:600;color:var(--hopd)}
.h4-ve{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:14px;color:var(--txt)}
.h4-ve .h4-i{color:var(--stk)}
.h4-ve .o{margin-left:auto;font-weight:600}
.h4-sw{flex:none;position:relative;width:40px;height:24px;border-radius:12px;background:var(--stk)}
.h4-sw::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff}
.h4-done{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:14px;color:var(--txt)}
.h4-done .h4-i{color:var(--stk)}
.h4-done a{margin-left:auto;color:var(--fin);font-weight:600}
.h4-mini .h4-row{padding:7px 12px}
.h4-mini .h4-vg{width:40px;height:40px}.h4-mini .h4-vg svg{width:34px;height:30px}
.h4-tag{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--hopd)}
.h4-tag a{color:var(--fin)}
.h4-chg{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:14px;color:var(--mut)}
.h4-chg .h4-b{height:32px}

/* 5, 6 : feuille d'articles (base E12b) */
.h4-behind{opacity:1}
.h4-sheet{position:absolute;left:0;right:0;bottom:56px;z-index:6;padding:8px 12px 0;border-radius:16px 16px 0 0;background:var(--bg);box-shadow:0 -6px 24px -8px rgba(0,0,0,.35)}
.h4-grab{width:40px;height:5px;margin:0 auto 8px;border-radius:3px;background:#CFCFCF}
.h4-shd{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
