<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carnet · greffe v04 · R4 — v09 + les façons et le tableau de v11</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Greffe v04, recette R4 (17.11). Socle v09 (liste, fiche en cours, fiche choisie), habit de l'app réelle
   (ref-app : en-tête logo noir · ‹ Nov. › · loupe · G A, segment gris à actif noir, sous-segment façon Étagère,
   retour bleu, grand titre noir, + carré noir au-dessus des onglets). Écrans greffés depuis v10-2, v01, v11-4,
   v11-3, v04-1, v02-3, v02-5, v10-5. Idées : Retenir / Écarter sur l'en-tête de chaque façon (v11-3) ; mesure du
   critère en colonne dans les écartés (v11-2). Statique : HTML et CSS seuls. Classes préfixées g4-. */
:root{--bg:#FFFFFF;--s1:#F5F5F5;--s2:#EBEBEB;--line:#DDDDDD;--line2:#BFBFBF;--mut:#666666;--txt:#333333;--ink:#111111;
  --stk:#4C6B2A;--stkd:#3B5420;--hop:#567F45;--fin:#1F64A3;--prod:#9A4F1E;--cal:#C87A2C;--straw:#F2C14E;
  --stkbg:color-mix(in srgb,#4C6B2A 9%,#FFFFFF);--stkbg2:color-mix(in srgb,#4C6B2A 15%,#F5F5F5)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--s2);color:var(--ink);font-family:"Source Sans 3","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.35}
a{color:inherit;text-decoration:none}
body{width:100vw;overflow-x:hidden}
.g4-rail{display:flex;gap:28px;align-items:flex-start;width:100vw;overflow-x:auto;padding:0 0 40px}
.g4-fig{margin:0;flex:none;width:390px}
.g4-fig>figcaption{height:34px;display:flex;align-items:center;gap:8px;padding:0 4px;font-size:14px;color:var(--txt)}
.g4-fig>figcaption b{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700}
.g4-fig>figcaption span{color:var(--mut)}
.g4-scr{position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg)}
.g4-scr.long{height:1470px}
.g4-i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.g4-m{font-family:"IBM Plex Mono",Consolas,Menlo,ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:0}

/* en-tête de l'app (ref-app) */
.g4-bar{position:relative;z-index:5;display:flex;align-items:center;gap:6px;height:44px;padding:0 8px;border-bottom:1px solid var(--line);background:var(--bg)}
.g4-logo{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--ink)}
.g4-logo svg{width:22px;height:22px}
.g4-nom{margin-left:4px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.g4-mois{margin-left:auto;display:flex;height:36px;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.g4-mois>span{display:grid;place-items:center;width:38px;color:var(--ink)}
.g4-mois>span .g4-i{width:18px;height:18px}
.g4-mois>b{display:grid;place-items:center;width:54px;border-left:1px solid var(--line2);border-right:1px solid var(--line2);font-size:14px;font-weight:600}
.g4-lou{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;border:1px solid var(--line2);background:var(--s1);color:var(--ink)}
.g4-lou .g4-i{width:18px;height:18px}
.g4-av{position:relative;display:flex;margin-left:2px}
.g4-av span{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;font-size:14px;font-weight:700;border:2px solid var(--bg)}
.g4-av span:first-child{background:var(--ink);color:#fff}
.g4-av span:nth-child(2){margin-left:-7px;background:#E3E3E3;color:var(--ink)}
.g4-av i{position:absolute;top:-1px;right:-1px;width:7px;height:7px;border-radius:50%;background:var(--ink)}

/* segment Stocks (actif noir) et sous-segment façon Étagère / Recompter */
.g4-seg{display:flex;gap:2px;margin:8px 8px 0;padding:3px;border-radius:12px;background:var(--s1);border:1px solid var(--line)}
.g4-seg a{flex:1;display:grid;place-items:center;min-height:36px;border-radius:9px;font-size:14px;color:var(--txt);white-space:nowrap}
.g4-seg a.on{background:var(--ink);color:#fff;font-weight:600}
.g4-sous{display:flex;margin:8px 8px 0;padding:3px;border-radius:999px;background:var(--s2)}
.g4-sous a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:36px;border-radius:999px;font-size:14px;font-weight:600;color:var(--txt)}
.g4-sous a .g4-i{width:17px;height:17px}
.g4-sous a.on{background:var(--ink);color:#fff}
.g4-sous .n{font-family:"IBM Plex Mono",Consolas,monospace;font-weight:500;color:var(--mut)}
.g4-sous a.on .n{color:#fff}

/* groupes, panneaux, rangées (v09) */
.g4-list{padding:2px 14px 0}
.g4-h{display:flex;align-items:center;gap:6px;margin:14px 0 6px}
.g4-h .t{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--stkbg2);font-size:14px;font-weight:700;color:var(--stkd)}
.g4-h .t .n{font-family:"IBM Plex Mono",Consolas,monospace;font-weight:500;color:var(--stk)}
.g4-h .r{margin-left:auto;font-size:14px;color:var(--mut)}
.g4-pan{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.g4-row{display:flex;align-items:center;gap:12px;min-height:68px;padding:10px 12px}
.g4-row+.g4-row,.g4-band+.g4-row{border-top:1px solid var(--line)}
.g4-vg{flex:none;width:52px;height:52px;border-radius:10px;overflow:hidden;display:grid;place-items:center}
.g4-vg>svg{width:100%;height:100%;display:block}
.g4-vg.pic{background:var(--stkbg2);color:var(--stkd)}
.g4-vg.pic>svg{width:36px;height:36px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.g4-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.g4-tx b{font-size:16px;font-weight:600;line-height:1.25;color:var(--ink)}
.g4-tx span{font-size:14px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g4-tx .q{font-style:italic;white-space:normal}
.g4-tx .nx{color:var(--txt)}.g4-tx .nx em{font-style:normal;font-weight:600;color:var(--stkd)}
.g4-tx .why{color:var(--txt)}
.g4-tx .ve{display:inline-flex;align-items:center;gap:4px}
.g4-tx .ve .g4-i{width:16px;height:16px}
.g4-fig2{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:1px;text-align:right}
.g4-fig2 .p{font-size:16px;font-weight:600;color:var(--ink)}
.g4-fig2 .u,.g4-fig2 .d{font-size:14px;color:var(--mut)}
.g4-go{flex:none;display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--stk);font-size:14px;font-weight:600;color:var(--stkd);background:var(--bg)}
.g4-go .g4-i{width:16px;height:16px}
.g4-col{flex-direction:column;align-items:stretch;gap:0}
.g4-col>.g4-ln{display:flex;align-items:center;gap:12px}
.g4-avl{display:flex;align-items:center;gap:6px;min-height:40px;margin:8px -12px -10px;padding:0 12px 0 76px;border-top:1px dashed var(--line);font-size:14px;font-weight:600;color:var(--stkd)}
.g4-avl .g4-i{width:16px;height:16px}
.g4-avl .go{margin-left:auto;display:inline-flex;align-items:center;gap:2px;color:var(--fin)}
.g4-ex{margin:12px 2px 0;font-size:14px;color:var(--mut)}

/* fiche : retour bleu, grand titre, clés */
.g4-back{display:flex;align-items:center;gap:2px;height:40px;padding:0 8px;font-size:16px;color:var(--fin)}
.g4-back .g4-i{width:20px;height:20px}
.g4-back .st{margin-left:auto;display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--stkbg2);color:var(--stkd);font-size:14px;font-weight:600}
.g4-ti{margin:0 14px;font-size:28px;font-weight:700;line-height:1.12;letter-spacing:-.015em}
.g4-sub{margin:4px 14px 0;font-size:16px;color:var(--mut)}
.g4-kv{display:flex;gap:8px;margin:6px 14px 0;font-size:14px;color:var(--txt)}
.g4-kv>span:first-child{flex:none;width:96px;color:var(--mut)}
.g4-kv b{font-weight:600}
.g4-kv .ia{color:var(--mut)}
.g4-f .g4-row{min-height:58px;padding:8px 12px;gap:10px}
.g4-f .g4-vg{width:44px;height:44px}

/* I12 : en-tête de façon, Retenir / Écarter (v11-3) */
.g4-band{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;background:var(--s1)}
.g4-band p{flex:1;margin:0;font-size:14px;color:var(--txt)}
.g4-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);font-size:14px;font-weight:600;color:var(--txt);white-space:nowrap}
.g4-btn.k{border-color:var(--ink);color:var(--ink)}
.g4-btn .g4-i{width:16px;height:16px}
.g4-cmp{display:flex;align-items:center;gap:8px;margin-top:12px;min-height:50px;padding:0 12px;border:1px solid var(--line);border-radius:12px;font-size:16px;font-weight:600}
.g4-cmp span{font-size:14px;font-weight:400;color:var(--mut)}
.g4-cmp .g4-i{margin-left:auto;color:var(--mut)}
.g4-new{background:var(--stkbg)}
.g4-new .tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:var(--stk);color:#fff;font-size:14px;font-weight:600}
.g4-lk{color:var(--fin)!important}

/* fiche choisie (v09-3) */
.g4-hero{display:flex;gap:12px;padding:12px}
.g4-hero .g4-vg{width:88px;height:80px}
.g4-why{padding:10px 12px;border-top:1px solid var(--line);font-size:14px;color:var(--txt)}
.g4-why b{font-weight:600;color:var(--stkd)}
.g4-why a{display:inline-flex;align-items:center;gap:2px;margin-top:4px;color:var(--fin);font-weight:600}
.g4-why a .g4-i{width:16px;height:16px}
.g4-send{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--stkbg)}
.g4-send p{display:flex;gap:8px;margin:0 0 8px;font-size:14px;color:var(--txt)}
.g4-send p .g4-i{width:18px;height:18px;color:var(--stk);margin-top:1px}
.g4-send p b{font-weight:600;color:var(--stkd)}
.g4-full{display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:10px;background:var(--stk);color:#fff;font-size:16px;font-weight:600}
.g4-full .g4-i{width:18px;height:18px}
.g4-off .g4-tx b{color:var(--txt)}
.g4-off .g4-vg{opacity:.75}
.g4-off .g4-tx span{white-space:normal}
.g4-off .g4-row{min-height:52px;padding:5px 12px}
.g4-off .g4-vg{width:40px;height:40px}
.g4-off .c{flex:none;width:58px;text-align:right;font-size:14px;color:var(--ink)}
.g4-off .c.pr{width:62px;color:var(--mut)}
.g4-off .c.vert{color:var(--stk);font-weight:600}
.g4-thd{display:flex;align-items:flex-end;gap:12px;min-height:30px;padding:4px 12px;border-bottom:1px solid var(--line);background:var(--s1);font-size:14px;color:var(--mut)}
.g4-thd span:first-child{flex:1}
.g4-thd .c{flex:none;width:58px;text-align:right}
.g4-thd .c.pr{width:62px}

.g4-sendr{display:flex;align-items:center;gap:10px}
.g4-sendr p{flex:1;margin:0}
.g4-sendr .g4-full{flex:none;height:40px;padding:0 14px}
.g4-offh .r{margin-left:auto}
.g4-offh .c{flex:none;width:58px;text-align:right;font-size:14px;color:var(--mut)}
.g4-offh .c.pr{width:62px;margin-right:12px}
/* champ du bas (C8) et + carré noir de l'app */
.g4-dock{position:absolute;left:0;right:0;bottom:46px;height:76px;padding:0 78px 0 10px;display:flex;align-items:center;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 32%);z-index:32}
.g4-in{flex:1;min-width:0;display:flex;align-items:center;gap:12px;height:48px;padding:0 12px 0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);font-size:16px;color:var(--mut)}
.g4-in>em{flex:1;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g4-in .g4-i{color:var(--mut)}
.g4-fab{position:absolute;right:10px;bottom:58px;z-index:33;display:grid;place-items:center;width:56px;height:56px;border-radius:16px;background:var(--ink);color:#fff;box-shadow:0 8px 18px -8px rgba(0,0,0,.6)}
.g4-fab .g4-i{width:26px;height:26px;stroke-width:2.4}

/* barre d'onglets de l'app */
.g4-tab{position:absolute;left:0;bottom:0;width:390px;height:46px;display:flex;background:var(--s1);border-top:1px solid var(--line);z-index:30}
.g4-tab a{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:14px;letter-spacing:-.02em;color:var(--txt)}
.g4-tab a .g4-i{width:19px;height:19px}
.g4-tab .tf .g4-i{color:var(--fin)}.g4-tab .tc .g4-i{color:var(--cal)}.g4-tab .tb .g4-i{color:var(--prod)}.g4-tab .ts .g4-i{color:var(--hop)}
.g4-tab a.on{background:color-mix(in srgb,#4C6B2A 10%,#F5F5F5);font-weight:700;color:var(--ink)}
.g4-tab a.on::before{content:"";position:absolute;top:0;left:26%;right:26%;height:3px;border-radius:0 0 3px 3px;background:var(--stk)}
.g4-tab .bdg{position:absolute;top:1px;left:calc(50% + 4px);display:grid;place-items:center;min-width:21px;height:21px;padding:0 4px;border-radius:999px;border:2px solid var(--s1);background:var(--fin);color:#fff;font-size:14px;font-weight:700;line-height:1;letter-spacing:0}

/* feuilles et clavier */
.g4-dim{position:absolute;inset:0;background:rgba(17,17,17,.30);z-index:40}
.g4-sh{position:absolute;left:0;right:0;z-index:41;background:var(--bg);border-radius:16px 16px 0 0;box-shadow:0 -8px 24px -12px rgba(0,0,0,.4)}
.g4-kb{position:absolute;left:0;right:0;bottom:0;height:262px;z-index:42;padding:8px 3px 0;background:#D2D5DB}
.g4-kb div{display:flex;justify-content:center;gap:6px;margin-bottom:11px}
.g4-kb span{display:grid;place-items:center;width:33px;height:44px;border-radius:6px;background:#fff;box-shadow:0 1px 0 #898A8D;font-size:18px;color:var(--ink)}
.g4-kb span.w{width:46px;background:#ADB3BC;font-size:16px}
.g4-kb span.sp{width:190px;font-size:14px}
.g4-kb span.ok{width:84px;background:#ADB3BC;font-size:14px}
.g4-chips{display:flex;align-items:center;gap:6px;padding:12px 10px 8px}
.g4-chips>span{font-size:14px;color:var(--mut);margin-right:2px}
.g4-chip{display:inline-flex;align-items:center;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-size:14px;font-weight:600;color:var(--txt);white-space:nowrap}
.g4-chip.on{background:var(--stkbg2);border-color:var(--stk);color:var(--stkd)}
.g4-frow{display:flex;align-items:center;gap:8px;padding:0 10px}
.g4-fin{flex:1;min-width:0;display:flex;align-items:center;gap:12px;height:48px;padding:0 12px;border-radius:12px;border:1.5px solid var(--stk);font-size:16px;color:var(--ink)}
.g4-fin .typ{flex:1;min-width:0;display:flex;justify-content:flex-end;overflow:hidden;white-space:nowrap}
.g4-fin .typ i{display:inline-block;width:2px;height:22px;margin-left:1px;background:var(--ink);align-self:center}
.g4-fin .g4-i{color:var(--mut)}
.g4-noter{display:grid;place-items:center;height:48px;padding:0 16px;border-radius:12px;background:var(--stk);color:#fff;font-size:16px;font-weight:600}
.g4-envoi{display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:var(--ink);color:#fff}
.g4-hint{margin:0;padding:8px 12px 12px;font-size:14px;color:var(--mut)}
.g4-cible{margin:0;padding:12px 12px 8px;font-size:14px;color:var(--mut)}
.g4-cible b{color:var(--stkd);font-weight:700}

/* carnet neuf (v01 annexe) */
.g4-vide{margin-top:12px;padding:14px;border:1.5px dashed var(--line2);border-radius:12px}
.g4-vide>p{margin:0 0 12px;font-size:16px;color:var(--txt)}
.g4-ia{padding:12px;border-radius:10px;background:var(--s1)}
.g4-ia p{display:flex;gap:8px;margin:0 0 10px;font-size:14px;color:var(--txt)}
.g4-ia p b{font-weight:700;color:var(--ink)}
.g4-ia p .g4-i{width:18px;height:18px;color:var(--stk);margin-top:1px}
.g4-ia .bt{display:flex;gap:8px}
.g4-ia .bt a:first-child{background:var(--stk);border-color:var(--stk);color:#fff}

/* article ouvert (v04-1) */
.g4-crit{display:flex;gap:8px;margin:10px 14px 0;padding:10px 12px;border-radius:10px;background:var(--stkbg)}
.g4-crit .g4-i{width:18px;height:18px;color:var(--stk);margin-top:2px}
.g4-crit span{display:block;font-size:14px;color:var(--mut)}
.g4-crit b{display:block;font-size:16px;font-weight:600;color:var(--ink)}
.g4-fa{margin:8px 14px 0;font-size:14px;color:var(--txt)}
.g4-fa s{color:var(--mut)}
.g4-fab2{display:flex;gap:8px;margin:8px 14px 0}
.g4-lh{display:flex;align-items:baseline;gap:8px;margin:16px 14px 0}
.g4-lh b{font-size:18px;font-weight:700}
.g4-lh span{margin-left:auto;font-size:14px;color:var(--mut)}
.g4-lnote{margin:2px 14px 8px;font-size:14px;color:var(--mut)}
.g4-art{margin:0 14px;border:1.5px solid var(--ink);border-radius:12px;padding:12px}
.g4-art .top{display:flex;gap:12px}
.g4-art .ph{position:relative;flex:none;width:112px;height:96px;border-radius:10px;overflow:hidden}
.g4-art .ph svg{width:100%;height:100%;display:block}
.g4-rk{position:absolute;top:6px;left:6px;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--stk);color:#fff;font-size:14px;font-weight:700}
.g4-rk.g{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.g4-art .nm{flex:1;min-width:0}
.g4-art .nm b{display:block;font-size:16px;font-weight:700;line-height:1.25}
.g4-art .nm span{display:block;font-size:14px;color:var(--mut)}
.g4-art .nm .px{margin-top:4px;font-size:18px;font-weight:600;color:var(--ink)}
.g4-art .rep{display:inline-flex;align-items:center;gap:2px;font-size:14px;font-weight:600;color:var(--fin);white-space:nowrap}
.g4-art .rep .g4-i{width:16px;height:16px}
.g4-kv4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 0 0;padding:8px;border-radius:10px;background:var(--s1)}
.g4-kv4 b{display:block;font-family:"IBM Plex Mono",Consolas,monospace;font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap}
.g4-kv4 span{display:block;font-size:14px;color:var(--mut)}
.g4-vend{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.g4-vend>div{display:flex;align-items:center;gap:10px;min-height:54px;padding:6px 10px}
.g4-vend>div+div{border-top:1px solid var(--line)}
.g4-vend .ra{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line2)}
.g4-vend .ra.on{border:6px solid var(--ink)}
.g4-vend .vt{flex:1;min-width:0}
.g4-vend .vt b{display:block;font-size:14px;font-weight:600}
