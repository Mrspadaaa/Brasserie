:root{--bg:#fff;--s1:#f5f5f5;--s2:#ebebeb;--line:#ddd;--line2:#bfbfbf;--mut:#5f5f5f;--ink:#111;--act:#111;--onact:#fff;--fin:#1f64a3;--finbg:#e8f0f8;--stk:#4c6b2a;--att:#8a5f06;--attbg:#fbf1dc;--botOn:#efe8e1;--ok:#2f7d6b;--okbg:#e3f1ec;--bad:#b3261e;--halo:#fff;--prod:#9a4f1e;--onfin:#fff}

body{min-height:100vh;padding-bottom:172px}button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.k-tabs{display:flex;gap:2px;margin:8px 12px 0;padding:4px;background:var(--s2);border-radius:14px}

.k-ex{display:inline-block;border:1.5px solid var(--fin);color:var(--fin);border-radius:999px;font-size:14px;line-height:20px;padding:0 8px;font-weight:600;white-space:nowrap}
.k-rows{margin:0 12px;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.k-row{display:flex;align-items:center;gap:10px;min-height:52px;padding:5px 12px;border-top:1px solid var(--line);width:100%;text-align:left}.k-row:first-child{border-top:0}
.k-row:active{background:var(--s1)}
.k-row .k-dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--c)}
.k-row .k-tx{flex:1;min-width:0}.k-row .k-nm{font-size:16px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.k-row .k-q{font-size:15px;white-space:nowrap}
/* barre d'action collée au-dessus des onglets : la liste passe dessous, le + ne couvre rien */
.k-bar{position:fixed;left:0;right:0;bottom:78px;height:74px;background:var(--bg);border-top:1.5px solid var(--line);z-index:4;display:flex;align-items:center;padding:0 84px 0 12px}
.k-cta{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:12px;background:var(--act);color:var(--onact);font-size:17px;font-weight:700;white-space:nowrap;min-width:0}
.k-cta .k-n{min-width:28px;height:26px;padding:0 7px;border-radius:13px;background:var(--fin);color:var(--onfin);font-size:16px;line-height:26px;font-weight:800;text-align:center}
.k-fab{position:fixed;right:12px;bottom:86px;width:58px;height:58px;border-radius:50%;background:var(--act);color:var(--onact);display:grid;place-items:center;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.k-fab .ico{width:28px;height:28px;stroke-width:2.5}
.k-nav{position:fixed;left:0;right:0;bottom:0;height:78px;display:grid;grid-template-columns:repeat(6,1fr);background:var(--bg);border-top:1.5px solid var(--line);z-index:5}
.k-nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;color:var(--ink);text-decoration:none;position:relative}
.k-nav a.on{background:var(--botOn);font-weight:700}.k-nav a.on::before{content:'';position:absolute;top:-1.5px;left:0;right:0;height:4px;background:var(--prod)}
.k-nav a .ico{width:26px;height:26px}.k-nav a.st .ico{color:var(--stk)}
.k-pas{position:absolute;top:2px;left:calc(50% + 4px);min-width:28px;height:26px;padding:0 6px;border-radius:13px;font-size:15px;line-height:22px;font-weight:800;text-align:center;color:var(--onfin);background:var(--fin);border:2px solid var(--bg);font-variant-numeric:tabular-nums;transition:transform .2s}
.k-pas.pulse{animation:kpu .45s ease}@keyframes kpu{40%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.c3-head{display:flex;align-items:center;gap:12px;padding:12px 12px 0}
.c3-big{font-size:56px;line-height:1;font-weight:800;color:var(--fin);letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.c3-t{flex:1;min-width:0;font-size:15px;color:var(--mut);line-height:1.3}
.c3-chip{display:inline-flex;align-items:center;gap:6px;margin-top:2px;padding:2px 10px 2px 6px;border-radius:999px;background:var(--finbg);color:var(--ink);font-size:17px;font-weight:700;white-space:nowrap}
.c3-chip .ico{color:var(--prod);width:20px;height:20px}
.c3-tl{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:14px 12px 0}
.c3-col{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px 8px;border-radius:12px;border:1.5px solid transparent;min-height:184px}
.c3-col.on{background:var(--finbg)}.c3-col.sel{border-color:var(--fin)}
.c3-col.seu.on{background:var(--attbg)}.c3-col.seu.sel{border-color:var(--att)}
.c3-col .c3-w{font-size:14px;font-weight:700;color:var(--mut)}
.c3-col .c3-bar{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}
.c3-col .c3-bar span{font-size:15px;font-weight:800;color:var(--t,var(--c))}
.c3-col .c3-bar i{width:30px;border-radius:5px 5px 0 0;background:var(--c)}
.c3-col .ico{width:24px;height:24px;color:var(--c2)}
.c3-col .c3-n{font-size:14px;line-height:1.15;text-align:center;color:var(--ink);font-weight:600;min-height:32px}
.c3-sec{display:flex;align-items:center;gap:8px;padding:16px 12px 6px;font-size:17px;font-weight:700}
.c3-sec .ico{color:var(--prod)}.c3-sec small{margin-left:auto}
.c3-g{margin:0 12px 10px}#c3-l{padding-top:14px}
.c3-gh{display:flex;align-items:baseline;gap:8px;padding:0 4px 4px;font-size:15px;color:var(--mut)}.c3-gh b{color:var(--ink);font-size:16px}
</style></head><body>

<script>window.STK=(()=>{const A=[
{n:'Citra',q:'0,4 kg',sem:49,pour:'Porter'},
{n:'Malt chocolat',q:'1,2 kg',sem:49,pour:'Porter'},
{n:'Munich',q:'6 kg',sem:49,pour:'Porter'},
{n:'US-05',q:'2 sachets',sem:49,pour:'Porter'},
{n:'Soude caustique',q:'1 bidon',sem:48,pour:'lavage des fûts'},
{n:'Capsules 26 mm',q:'500',sem:50,pour:'Blonde en bouteilles'},
{n:'Acide peracétique',q:'1 L',sem:50,pour:'désinfection'},
{n:'Pilsner',q:'25 kg',sem:51,pour:'Pils de Noël'},
{n:'Saaz',q:'0,8 kg',sem:51,pour:'Pils de Noël'},
{n:'W-34/70',q:'3 sachets',sem:51,pour:'Pils de Noël'},
{n:'CO₂',q:'1 bouteille',sem:52,pour:'fûts du Marché'},
{n:'Mosaic',q:'0,4 kg',sem:null},{n:'Simcoe',q:'0,3 kg',sem:null},{n:'Malt de Vienne',q:'5 kg',sem:null},
{n:'Flocons d’avoine',q:'2 kg',sem:null},{n:'Lactose',q:'1 kg',sem:null},{n:'Irish moss',q:'100 g',sem:null},
{n:'Gypse',q:'250 g',sem:null},{n:'Chlorure de calcium',q:'250 g',sem:null},{n:'Acide lactique',q:'0,5 L',sem:null},
{n:'Étiquettes Blonde',q:'200',sem:null},{n:'Cartons de 6',q:'40',sem:null},{n:'Nottingham',q:'2 sachets',sem:null},{n:'Joints de fût',q:'10',sem:null}];
const Q=new URLSearchParams(location.search);
if(Q.get('theme')==='cave')document.documentElement.dataset.theme='cave';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const W=[47,48,49,50,51,52,99];
const sem=a=>a.sem||99;
const dans=H=>A.filter(a=>sem(a)<=H);
const par=w=>A.filter(a=>sem(a)===w);
const pour={47:'',48:'lavage',49:'Porter',50:'bouteilles',51:'Pils de Noël',52:'Marché',99:'au seuil'};
function row(a,c){const w=a.sem?'<em>S'+a.sem+'</em> · '+a.pour:'<em>au seuil</em> · aucun brassin';
return '<button class="k-row" style="--c:'+c+'" data-booster="article"><i class="k-dot"></i><span class="k-tx"><span class="k-nm">'+a.n+'</span><span class="k-sb">'+w+'</span></span><span class="k-q mono">'+a.q+'</span></button>'}
function pastille(n){const p=$('#k-pas');p.hidden=!n;p.textContent=n;p.classList.remove('pulse');void p.offsetWidth;p.classList.add('pulse')}
function cta(n,txt){$('#k-cta').innerHTML='<svg class="ico" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg>'+(txt||'Commander')+' <span class="k-n">'+n+'</span>'}
return {A,Q,$,$$,W,sem,dans,par,pour,row,pastille,cta,etat:Q.get('etat')||'repos'}})();</script>

<script>(()=>{const S=STK,{$,$$}=S;let H=49;
const VERRE='<svg class="ico" viewBox="0 0 24 24"><path d="M6 8h10v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z"/><path d="M16 11h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2"/><path d="M6 8a3 3 0 0 1 3-4 3 3 0 0 1 5 1 2.5 2.5 0 0 1 2 3"/></svg>';
const OUTIL='<svg class="ico" viewBox="0 0 24 24"><path d="M8 3h8l-1 5H9z"/><path d="M9 8v12a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1V8"/></svg>';
const SEUIL='<svg class="ico" viewBox="0 0 24 24"><path d="M4 18h16"/><path d="M7 14l4-4 3 3 5-6"/></svg>';
const COL=[[48,'Lavage',OUTIL],[49,'Porter',VERRE],[50,'Blonde bouteilles',VERRE],[51,'Pils de Noël',VERRE],[52,'Fûts du Marché',OUTIL],[99,'Sans brassin',SEUIL]];
const NOM={48:'le lavage',49:'le Porter',50:'la Blonde',51:'la Pils de Noël',52:'le Marché',99:'tout le seuil'};
function rendre(){const X=S.dans(H),m=13;
$('#c3-big').textContent=X.length;
$('#c3-chip').innerHTML=(H===99?SEUIL:VERRE)+(H===99?'tout le seuil':COL.find(c=>c[0]===H)[1]+' · S'+H);
$('#c3-tl').innerHTML=COL.map(([w,n,ic])=>{const k=S.par(w).length,on=w<=H,c=on?(w===99?'var(--att)':'var(--fin)'):'var(--line2)';
return '<button class="c3-col'+(on?' on':'')+(w===H?' sel':'')+(w===99?' seu':'')+'" data-h="'+w+'" style="--c:'+c+(on?'':';--t:var(--mut)')+';--c2:'+(on?(w===99?'var(--att)':'var(--prod)'):'var(--mut)')+'"><span class="c3-w">'+(w===99?'seuil':'S'+w)+'</span><span class="c3-bar"><span>'+k+'</span><i style="height:'+Math.max(6,k/m*78)+'px"></i></span>'+ic+'<span class="c3-n">'+n+'</span></button>'}).join('');
for(const b of $$('#c3-tl button'))b.onclick=()=>{H=+b.dataset.h;rendre()};
$('#c3-l').innerHTML=COL.filter(c=>c[0]<=H).map(([w,n])=>{const L=S.par(w);return '<div class="c3-g"><div class="c3-gh"><b>'+(w===99?'Au seuil':n)+'</b>'+(w===99?'aucun brassin prévu':'S'+w)+' · '+L.length+'</div><div class="k-rows" style="margin:0">'+L.map(a=>S.row(a,w===99?'var(--att)':'var(--fin)')).join('')+'</div></div>'}).join('');
S.cta(X.length,H===99?'Commander tout':'Commander jusqu’à '+(H===49?'Porter':H===51?'Pils':'S'+H));S.pastille(X.length)}
rendre();if(S.etat==='geste'){H=51;rendre()}})()</script>
