function pastille(n){const p=$('#k-pas');p.hidden=!n;p.textContent=n;p.classList.remove('pulse');void p.offsetWidth;p.classList.add('pulse')}
function cta(n,txt){$('#k-cta').innerHTML='<svg class="ico" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 7H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg>'+(txt||'Commander')+' <span class="k-n">'+n+'</span>'}

<script>(()=>{const S=STK,{$,$$}=S;let H=49;
const C=[[49,'S49','Porter'],[52,'6 sem.','jusqu’à S52'],[99,'Tout','au seuil']];
function rendre(){const X=S.dans(H);
$('#c1-big').textContent=X.length;
$('#c1-t').innerHTML=H===99?'à commander<b>tout le seuil · 24</b>':'à commander<b>'+(H===49?'d’ici S49 · Porter':'d’ici S52 · 6 semaines')+'</b>';
$('#c1-ch').innerHTML=C.map(([h,a,b])=>'<button data-h="'+h+'" class="'+(h===H?'on':'')+(h===99?' s':'')+'"><i>'+S.cumul(h)+'</i><b>'+a+'</b><span>'+b+'</span></button>').join('');
for(const b of $$('#c1-ch button'))b.onclick=()=>{H=+b.dataset.h;rendre()};
const n=S.EV.map(e=>S.par(e[0]).length),m=Math.max(...n);
$('#c1-his').innerHTML=S.EV.map(([w],i)=>{const on=w<=H;const c=on?(w===99?'var(--att)':'var(--fin)'):'var(--line2)';return '<div style="--c:'+c+(on?'':';--t:var(--mut)')+'"><span>'+n[i]+'</span><i style="height:'+Math.max(6,n[i]/m*62)+'px"></i></div>'}).join('');
$('#c1-wk').innerHTML=S.EV.map(([w,nm,s,ic])=>{const on=w<=H;return '<span style="--c2:'+(on?(w===99?'var(--att)':'var(--prod)'):'var(--mut)')+'">'+(w===99?'seuil':'S'+w)+ic+'<b>'+(w===51?'Pils':w===99?'sans brassin':nm)+'</b></span>'}).join('');
$('#c1-lt').textContent=H===99?'Les 24, par semaine':'Les '+X.length+' d’ici S'+H;
$('#c1-l').innerHTML=X.map(a=>S.row(a,a.sem?'var(--fin)':'var(--att)')).join('');
S.cta(X.length,H===99?'Commander tout':H===49?'Commander jusqu’à Porter':'Commander jusqu’à S52');S.pastille(X.length)}
rendre();if(S.etat==='geste'){H=52;rendre()}if(S.etat==='tout'){H=99;rendre()}})()</script>
