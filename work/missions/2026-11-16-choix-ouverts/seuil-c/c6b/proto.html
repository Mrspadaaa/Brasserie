<script>(()=>{const S=STK,{$,$$}=S;let H=49;
const C=[[49,'S49','Porter'],[52,'6 sem.','jusqu’à S52'],[99,'Tout','au seuil']];
const OP=[[49,'jusqu’au Porter','S49 · prochain brassin'],[52,'6 semaines','jusqu’à S52 · Pils, Marché'],[99,'tout le seuil','même sans brassin prévu']];
const nom=w=>S.EV.find(e=>e[0]===w)[1];
function rendre(){const X=S.dans(H),Y=S.A.filter(a=>S.sem(a)>H);
$('#c6-big').textContent=X.length;
$('#c6-qui').textContent=H===99?'tout ce qui est au seuil':'jusqu’à '+nom(H)+' · S'+H;
$('#c6-ch').innerHTML=C.map(([h,a,b])=>'<button data-h="'+h+'" class="'+(h===H?'on':'')+(h===99?' s':'')+'"><i>'+S.cumul(h)+'</i><b>'+a+'</b><span>'+b+'</span></button>').join('');
let h='';for(const [w,n,s,ic] of S.EV){const L=S.par(w),on=w<=H,cut=w===H;
h+='<button class="c6-w'+(on?' on':'')+(cut?' cut':'')+(w===99?' seu':'')+'" data-h="'+w+'">'+ic+'<span class="c6-x"><b>'+n+' <small>'+(w===99?'':'S'+w)+'</small></b><span>'+(w===99?L.length+' articles · aucun brassin':L.map(a=>a.n).join(', '))+'</span></span><span class="c6-k">+'+L.length+'</span><span class="c6-p">'+S.cumul(w)+'</span></button>';
if(cut)h+='<div class="c6-cut'+(w===99?' seu':'')+'"><svg class="ico" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M12 19V5M6 11l6-6 6 6"/></svg>'+(w===99?'tout est compté dans la pastille':'comptés dans la pastille')+'</div>'}

for(const b of $$('#c6-ch button,.c6-w'))b.onclick=()=>{H=+b.dataset.h;rendre()};
$('#c6-lt').textContent=H===99?'Les 24, par semaine':'Les '+X.length+' jusqu’à '+nom(H);
$('#c6-l').innerHTML=X.map(a=>S.row(a,a.sem?'var(--fin)':'var(--att)')).join('');
$('#c6-gr').innerHTML=Y.length?'<div class="c6-pas">Pas encore comptés · '+Y.length+'</div><div class="k-rows">'+Y.map(a=>S.row(a,'var(--line2)')).join('')+'</div>':'';
$('#c6-pb').textContent=X.length;
$('#c6-ops').innerHTML=OP.map(([o,a,b])=>'<button class="c6-op'+(o===H?' on':'')+'" data-h="'+o+'"><i class="c6-r"></i><span><b>'+a+'</b><small>'+b+'</small></span><span class="c6-n">'+S.cumul(o)+'</span></button>').join('');
