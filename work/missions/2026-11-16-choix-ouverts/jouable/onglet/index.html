function wk(){var h='<div class="wk" role="tablist">';W.forEach(function(w,i){h+='<button data-w="'+i+'" class="'+(i===0?'now ':'')+(i===S.w?'sel':'')+'" aria-selected="'+(i===S.w)+'"><b>'+w[0]+'</b><span class="num">'+w[1]+'</span></button>'});return h+'</div>'}
function lanes(only){
 var h='<div class="lanes"><div class="cols">';for(var i=0;i<6;i++)h+='<i class="'+(i===S.w?'sel':'')+'"></i>';h+='</div>';
 if(S.vide)return h+'<div class="vide-msg" style="position:relative;margin:14px 8px;background:var(--bg);border:1px dashed var(--line2);border-radius:12px"><b>Rien de posé sur ces 6 semaines.</b>Un brassin, une fête ou une dépense se pose avec le +.</div></div>';
 LANES.forEach(function(L){if(only&&only.indexOf(L[0])<0)return;var ev=EV.filter(function(e){return e.l===L[0]});var tot=ev.reduce(function(s,e){return s+e.m},0);
  h+='<section class="lane" style="--c:var('+L[2]+')"><h3><i></i>'+L[1]+'<small><span class="num">'+ev.length+' · '+chf(tot)+'</span></small></h3>';
  ev.forEach(function(e){var c=100/6,left=e.a*c,wd=(e.b-e.a+1)*c,span=e.b-e.a+1;
   h+='<div class="ev">';
   if(span>=3)h+='<button class="bar" data-ev="'+EV.indexOf(e)+'" style="left:calc('+left+'% + 2px);width:calc('+wd+'% - 4px)">'+e.n+'&nbsp;<span class="amt num">'+chf(e.m)+'</span></button>';
   else{h+='<button class="bar" data-ev="'+EV.indexOf(e)+'" aria-label="'+e.n+'" style="left:calc('+left+'% + 2px);width:calc('+wd+'% - 4px)"></button>';
    var lab=e.n+' <span class="amt num">'+chf(e.m)+'</span>';
    h+=(e.a>=3)?'<span class="lbl" style="right:calc('+(100-left)+'% + 6px)">'+lab+'</span>':'<span class="lbl" style="left:calc('+(left+wd)+'% + 6px)">'+lab+'</span>'}
   h+='</div>'});
  h+='</section>'});
 return h+'</div>'}
function weekItems(i){return EV.filter(function(e){return e.a<=i&&e.b>=i})}
function wpanel(titre){
 var w=W[S.w],h='<div class="wpanel"><div class="hd">'+(S.w?w[0]:titre)+'<small>'+(S.w?'dès le '+w[1]:'lun. 16 nov.')+'</small>'+(S.w?'<button data-w="0">Aujourd’hui</button>':'')+'</div>';
 if(S.vide)return h+'<div class="vide-msg">Rien cette semaine.</div></div>';
 var r='';if(S.w===0)TACHES.forEach(function(t,k){r+='<button class="row'+(S.fait[k]?' done':'')+'" data-t="'+k+'"><span class="chk">'+u('i-check')+'</span><span class="t"><b>'+t[0]+'</b><span>'+t[1]+'</span></span></button>'});
 weekItems(S.w).forEach(function(e){var L=LANES.filter(function(x){return x[0]===e.l})[0];r+='<button class="row" data-ev="'+EV.indexOf(e)+'"><span class="dot" style="background:var('+L[2]+')"></span><span class="t"><b>'+e.n+'</b><span>'+e.d+'</span></span><span class="v num '+(e.m<0?'neg':'pos')+'">'+chf(e.m)+'</span></button>'});
 return h+'<div class="card" style="border:0;border-top:1px solid var(--line);border-radius:0 0 12px 12px">'+r+'</div></div>'}
function chart(){var mx=6000,mn=3000,pts=CAISSE.map(function(v,i){return [(i+.5)*(366/6),90-(v-mn)/(mx-mn)*80]});
 var d=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)}).join(' ');
 return '<svg class="chart" viewBox="0 0 366 96" preserveAspectRatio="none" aria-label="Caisse en fin de semaine"><path d="'+d+' L'+pts[5][0]+' 96 L'+pts[0][0]+' 96Z" fill="var(--finbg)"/><path d="'+d+'" fill="none" stroke="var(--fin)" stroke-width="3"/>'+pts.map(function(p,i){return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(i===S.w?6:4)+'" fill="var(--fin)"/>'}).join('')+'</svg>'}
function finBloc(){
 if(S.vide)return '<div class="pad"><div class="card"><div class="vide-msg"><b>Aucune écriture.</b>La caisse se dessine dès la première vente ou dépense.</div></div></div>';
 return '<div class="pad"><div class="big"><span class="n num">259</span><span class="l">CHF à te permettre<br><b>au plus serré : S49</b></span></div><p class="jx-exp">S49 : <b class="num">3 872</b> en caisse, moins <b class="num">3 613</b> déjà promis (loyer, TVA, impôt bière)</p></div>'+wk()+'<div style="padding:0">'+chart()+'</div><div class="libre num">'+CAISSE.map(function(v){return '<div>'+v.toLocaleString('fr-CH').replace(/[\u2019']/g,'\u202f')+'</div>'}).join('')+'</div><div class="vt">caisse libre en fin de semaine, en CHF</div>'}
function ecritures(){if(S.vide)return '';return '<div class="pad"><div class="h2">Dernières écritures<small>novembre</small></div><div class="card">'+

function liste(rows,vide){if(S.vide)return '<div class="pad"><div class="card"><div class="vide-msg"><b>'+vide+'</b>Le + en ajoute un.</div></div></div>';return '<div class="pad"><div class="card">'+rows.map(function(r){return '<div class="row"><span class="dot" style="background:'+r[3]+'"></span><span class="t"><b>'+r[0]+'</b><span>'+r[1]+'</span></span><span class="v num">'+r[2]+'</span></div>'}).join('')+'</div></div>'}
function ecran(){
 var t=S.tab,h='';
 if(CFG.fusion&&t==='bord'){h+=top('Bord');h+='<div class="pad">'+wpanel('Aujourd’hui')+'</div>'+wk()+'<div class="pad" style="padding-top:0">'+lanes()+'</div>';return h}
 if(t==='bord'){h+=top('Bord');
  h+='<div class="pad"><div class="h2">Aujourd’hui<small>lun. 16 nov.</small></div><div class="card">';
  if(S.vide)h+='<div class="vide-msg"><b>Rien à faire aujourd’hui.</b></div>';else TACHES.forEach(function(x,k){h+='<button class="row'+(S.fait[k]?' done':'')+'" data-t="'+k+'"><span class="chk">'+u('i-check')+'</span><span class="t"><b>'+x[0]+'</b><span>'+x[1]+'</span></span></button>'});
  h+='</div>';
  if(!S.vide){h+='<div class="h2">En un coup d’œil</div><div class="card"><button class="row" data-go="'+(CFG.sections?'cal':'fin')+'"'+(CFG.sections?' data-sec="fin"':'')+'><span class="t"><b>À te permettre cette semaine</b><span>'+(CFG.sections?'Finances, dans le Calendrier':'Finances')+'</span></span><span class="v num" style="color:var(--fin);font-weight:700">259</span><span class="chev">›</span></button><button class="row" data-go="stk"><span class="t"><b>À commander</b><span>Stocks</span></span><span class="v num">5</span><span class="chev">›</span></button>'+(CFG.tabs.indexOf('cal')>=0?'<button class="row" data-go="cal"><span class="t"><b>Cette semaine au calendrier</b><span>B-031 IPA Nelson en cuve · J+4</span></span><span class="chev">›</span></button>':'')+'</div>';
  h+='<div class="h2">En cuve<small>densité</small></div><div class="card"><button class="row" data-go="bra"><span class="dot" style="background:#e0a030"></span><span class="t"><b>B-031 IPA Nelson</b><span>fermentation J+4</span></span><span class="v num">1,018</span><span class="chev">›</span></button><button class="row" data-go="bra"><span class="dot" style="background:#c8702a"></span><span class="t"><b>B-030 Triple d’automne</b><span>garde J+12</span></span><span class="v num">1,010</span><span class="chev">›</span></button></div>';}
  return h+'</div>'}
 if(t==='cal'){h+=top('Calendrier');
  if(CFG.sections){h+='<div class="chips" role="tablist">'+[['tout','Tout','i-cal'],['fin','Finances','i-wallet'],['bra','Brassins','i-beer'],['stk','Stocks','i-boxes'],['ag','Agenda','i-fete']].map(function(c){return '<button data-sec="'+c[0]+'" class="'+(S.sec===c[0]?'on':'')+'" role="tab" aria-selected="'+(S.sec===c[0])+'">'+u(c[2])+c[1]+'</button>'}).join('')+'</div>';
   if(S.sec==='fin')return h+finBloc()+'<div class="pad" style="padding-top:0">'+lanes(['vente','achat'])+'</div>'+(S.vide?'':'<div class="pad"><div class="card"><button class="row" data-sous="ecr"><span class="t"><b>Écritures, TVA, impôt bière</b><span>le reste de Finances</span></span><span class="chev">›</span></button></div></div>');
   var only={bra:['bra'],stk:['achat'],ag:['fete','vente']}[S.sec];
   return h+'<div class="pad">'+wpanel('Cette semaine')+'</div>'+wk()+'<div class="pad" style="padding-top:0">'+lanes(only)+'</div>'}
  return h+'<div class="pad">'+wpanel('Cette semaine')+'</div>'+wk()+'<div class="pad" style="padding-top:0">'+lanes()+'</div>'}
 if(t==='fin'||t==='ecr'){h+=top(t==='ecr'?'Finances':'Finances');if(t==='ecr')h+='<div class="pad"><button class="row card" data-go="cal" data-sec="fin" style="min-height:44px"><span class="t"><b>‹ Calendrier · Finances</b></span></button></div>';else h+=finBloc();return h+ecritures()}
 if(t==='bra')return top('Brassins')+liste([['B-031 IPA Nelson','fermentation J+4 · 19,0 °C','1,018','#e0a030'],['B-030 Triple d’automne','garde J+12 · 4,0 °C','1,010','#c8702a'],['B-032 Blanche au yuzu','planifié','21.11','#ecd27a'],['B-029 Blanche au yuzu','58 bouteilles de 33 cl','09.11','#ecd27a'],['B-028 Blonde d’automne','conditionnée · 6 fûts, 48 btl','02.11','#e8c35a']],'Aucun brassin.');
 if(t==='stk')return top('Stocks')+liste([['Soude caustique','à commander · S48','1 bidon','var(--fin)'],['Fuggle','à commander · S49 Porter','0,4 kg','var(--fin)'],['Malt chocolat','à commander · S49 Porter','1,2 kg','var(--fin)'],['Munich','à commander · S49 Porter','6 kg','var(--fin)'],['US-05','à commander · S49 Porter','2 sachets','var(--fin)'],['Pale ale','ok','25 kg','var(--stk)'],['Nelson Sauvin','ok','450 g','var(--stk)']],'Aucun article en stock.');
 if(t==='cli')return top('Clients')+liste([['Café du Pont','24 fûts livrés en 2026','2 680','var(--e-vente)'],['Épicerie La Grange','bouteilles','940','var(--e-vente)'],['Marché de Noël','stand 12 et 13 déc.','1 180','var(--e-fete)']],'Aucun client.');
}
function bar(){var h='';CFG.tabs.forEach(function(t){var on=(S.tab===t)||(S.tab==='ecr'&&t==='cal');h+='<button data-tab="'+t+'" class="'+(on?'on':'')+'" aria-current="'+(on?'page':'false')+'">'+(t==='stk'&&!S.vide?'<b class="jx-pas num" aria-label="5 à commander avant S49">5</b>':'')+'<svg class="ico" style="color:'+({fin:'var(--fin)',cal:'var(--prod)',bra:'var(--prod)',stk:'var(--stk)'}[t]||(CFG.fusion&&t==='bord'?'var(--prod)':'inherit'))+'"><use href="#'+ICO[t]+'"/></svg>'+NOMS[t]+'</button>'});return h}
function plusMenu(){var w=W[S.w][0],ici=[];
 if(cal())ici=[['i-beer','Poser un brassin en '+w],['i-fete','Poser une fête ou un marché'],['i-tirelire','Prévoir une dépense en '+w]];
 else if(S.tab==='fin'||S.tab==='ecr')ici=[['i-ecr','Nouvelle écriture'],['i-doc','Scanner une facture']];
 else if(S.tab==='bra')ici=[['i-cuve','Mesurer une densité'],['i-beer','Lancer un brassin']];
 else if(S.tab==='stk')ici=[['i-boxes','Entrée de stock']];
 else if(S.tab==='cli')ici=[['i-vente','Nouvelle vente']];
 else ici=[['i-check','Nouvelle tâche']];
 var tj=[['i-ecr','Nouvelle écriture'],['i-beer','Lancer un brassin'],['i-bulle','Noter une idée']].filter(function(a){return !ici.some(function(b){return b[1]===a[1]})});
 function rows(a){return a.map(function(x){return '<button class="row" data-a="'+x[1]+'">'+u(x[0])+'<span class="t"><b style="font-weight:600">'+x[1]+'</b></span></button>'}).join('')}
 return '<div class="voile" data-act="plus"></div><div class="sheet" role="dialog" aria-label="Ajouter"><h4>Ici · '+(S.tab==='ecr'?'Finances':NOMS[S.tab])+'</h4>'+rows(ici)+'<h4>Toujours</h4>'+rows(tj)+'</div>'}
var toastT;function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2600)}
function render(){$('#app').innerHTML=ecran();$('#bot').innerHTML=bar();$('#menu').innerHTML=S.plus?plusMenu():'';var f=$('#fab');f.className='fab'+(S.plus?' open':'');f.setAttribute('aria-expanded',S.plus);f.innerHTML=u('i-plus')+(cal()?'<span>'+W[S.w][0]+'</span>':'')}
function vib(){try{navigator.vibrate&&navigator.vibrate(10)}catch(x){}}
document.addEventListener('click',function(e){var b=e.target.closest('button,[data-act]');if(!b)return;var d=b.dataset;vib();
 if(d.tab||d.go||d.sous||d.sec)jxEfface();
 if(d.tab){S.tab=d.tab;S.plus=false;if(d.tab==='cal'&&!d.sec)S.sec=S.sec;scrollTo(0,0)}
 else if(d.go){S.tab=d.go;if(d.sec)S.sec=d.sec;scrollTo(0,0)}
 else if(d.sec){S.sec=d.sec}
 else if(d.sous){S.tab='ecr';scrollTo(0,0)}
 else if(d.w!==undefined){S.w=+d.w}
 else if(d.t!==undefined){S.fait[d.t]=!S.fait[d.t]}
 else if(d.ev!==undefined){var x=EV[+d.ev];toast(x.n+' · '+x.d+' · '+chf(x.m)+' CHF (exemple)')}
 else if(d.a){S.plus=false;var nv=null,wn=W[S.w][0];if(cal()){if(/^Poser un brassin/.test(d.a))nv={l:'bra',n:'Nouveau brassin',d:'posé en '+wn+' · exemple',m:-150,dit:'Nouveau brassin posé en '+wn};else if(/^Poser une fête/.test(d.a))nv={l:'fete',n:'Nouvelle fête',d:'posée en '+wn+' · exemple',m:500,dit:'Nouvelle fête posée en '+wn};else if(/^Prévoir une dépense/.test(d.a))nv={l:'achat',n:'Nouvelle dépense',d:'prévue en '+wn+' · exemple',m:-200,dit:'Nouvelle dépense prévue en '+wn}}if(nv){nv.a=nv.b=S.w;EV.push(nv);toast(nv.dit+' · exemple')}else toast(d.a+' (exemple)')}
 else if(d.act==='vide'){S.vide=!S.vide}
 else if(d.act==='plus'||b.id==='fab'){S.plus=!S.plus}
 render()});
var q=new URLSearchParams(location.search);if(q.get('theme')==='cave')document.documentElement.dataset.theme='cave';
var et=q.get('etat')||'';
({cal:function(){S.tab='cal'},plus:function(){S.tab=CFG.fusion?'bord':'cal';S.plus=true},vide:function(){S.tab=CFG.fusion?'bord':'cal';S.vide=true},semaine:function(){S.w=3},fin:function(){S.sec='fin'},bord:function(){S.tab='bord'},ecr:function(){S.tab='ecr'}}[et]||function(){})();
render()})();</script></body></html>
