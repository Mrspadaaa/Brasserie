<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>A1 — fiche technique</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* A1 « fiche technique » : la typographie et les filets font tout ; aucune carte, aucune surface décorée. */
:root{--bg:#12100E;--s1:#1A1613;--s2:#221D19;--l1:#2C2521;--l2:#3D342E;--t1:#F5F0EA;--t2:#D8CEC5;--t3:#A3958A;
--amb:#E3B55D;--red:#F29289;--grn:#A3C97A;--blu:#86B9E6;--ia:#BCA5E8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--t1);font:400 14px/20px "Source Sans 3","Segoe UI",system-ui,sans-serif}
body{width:390px;min-height:844px;position:relative;overflow:hidden}
.a1-m{font-family:"IBM Plex Mono",Consolas,monospace;font-variant-numeric:tabular-nums;font-size:12px}
.a1-pg{padding:10px 12px 0}
.a1-top{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:6px;border-bottom:2px solid var(--t1)}
.a1-top h1{font-size:20px;line-height:26px;font-weight:700;letter-spacing:-.01em}
.a1-cap{font-size:12px;line-height:16px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.a1-crumb{display:flex;align-items:center;gap:6px;height:24px;color:var(--t3);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.a1-crumb svg{width:16px;height:16px}
.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* tableaux */
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-size:12px;line-height:16px;color:var(--t3);font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:6px 0 4px;border-bottom:1px solid var(--l2)}
td{padding:0;height:28px;border-bottom:1px solid var(--l1);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r{text-align:right}
.a1-tree td:first-child{padding-left:16px;position:relative}
.a1-tree td:first-child::before{content:"";position:absolute;left:5px;top:0;bottom:0;border-left:1px solid var(--l2)}
.a1-tree tr.a1-last td:first-child::before{bottom:50%}
.a1-tree td:first-child::after{content:"";position:absolute;left:5px;width:7px;top:50%;border-top:1px solid var(--l2)}
.a1-nm{display:flex;align-items:center;gap:6px;overflow:hidden}
.a1-nm span{overflow:hidden;text-overflow:ellipsis}
.a1-nm .ico{color:var(--t3)}
.a1-grp td{height:26px;padding-top:6px;font-size:12px;color:var(--t2);font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--l2)}
.a1-grp td .a1-m{color:var(--t3);font-weight:400;margin-left:6px}
.st{font-size:12px;font-weight:600}
.a1-tree td:nth-child(2){padding-left:8px}
.st-cherche{color:var(--amb)}.st-urgent{color:var(--red)}.st-decide{color:var(--blu)}.st-note{color:var(--t3)}.st-regle{color:var(--grn)}
.a1-dim td{color:var(--t3)}
.a1-dim td.st-regle{color:var(--grn)}
.a1-sum{display:flex;gap:12px;padding:6px 0;font-size:12px;color:var(--t3);border-bottom:1px solid var(--l1)}
.a1-sum b{font-weight:600}
/* fiche */
.a1-title{font-size:20px;line-height:26px;font-weight:700;padding:2px 0 8px;border-bottom:2px solid var(--t1)}
.a1-spec td{height:28px}
.a1-spec td:first-child{width:92px;font-size:12px;color:var(--t3);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.a1-ref{width:30px;text-align:right;color:var(--t3)}
.a1-sec{display:flex;align-items:baseline;gap:8px;margin-top:12px;padding-bottom:4px;border-bottom:1px solid var(--t2)}
.a1-sec b{font-size:14px;font-weight:700}
.a1-sec .a1-n{font-size:12px;color:var(--t3);font-weight:600;width:14px}
.a1-sec .a1-m{margin-left:auto;color:var(--t3)}
.tag{font-size:12px;font-weight:600}
.a1-ia td{background:rgba(188,165,232,.07);box-shadow:inset 0 1px 0 rgba(188,165,232,.35),inset 0 -1px 0 rgba(188,165,232,.35)}
.a1-ia td:first-child{box-shadow:inset 2px 0 0 var(--ia),inset 0 1px 0 rgba(188,165,232,.35),inset 0 -1px 0 rgba(188,165,232,.35);padding-left:8px}
.ia{color:var(--ia)}
.a1-keep{display:inline-flex;gap:6px;justify-content:flex-end}
.a1-keep button{height:24px;padding:0 8px;border-radius:4px;border:1px solid var(--ia);background:none;color:var(--ia);font:600 12px "Source Sans 3",sans-serif}
.a1-keep button.x{border-color:var(--l2);color:var(--t3);width:24px;padding:0}
.a1-foot{margin-top:10px;font-size:12px;line-height:16px;color:var(--t3)}
.a1-foot li{list-style:none;display:flex;gap:8px;padding:2px 0}
.a1-foot .a1-m{width:20px;flex:none}
/* comparaison */
.a1-cmp th,.a1-cmp td{text-align:right;padding-right:6px}
.a1-cmp th:first-child,.a1-cmp td:first-child{text-align:left;width:86px;padding-right:0}
.a1-cmp td:first-child{font-size:12px;color:var(--t3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.a1-cmp th{color:var(--t1);text-transform:none;letter-spacing:0;font-size:14px;font-weight:700}
.a1-cmp td.a1-m{font-size:14px}
.a1-cmp td{height:34px}
.a1-kr{display:flex;justify-content:flex-end;gap:6px;padding:4px 6px 4px 0}
.a1-sug{display:flex;align-items:flex-end;gap:8px;white-space:normal;line-height:18px}
.a1-win{box-shadow:inset 2px 0 0 var(--grn),inset -2px 0 0 var(--grn)}
.a1-cmp tr:last-child .a1-win{box-shadow:inset 2px 0 0 var(--grn),inset -2px 0 0 var(--grn),inset 0 -2px 0 var(--grn)}
.a1-cmp th.a1-win{box-shadow:inset 2px 0 0 var(--grn),inset -2px 0 0 var(--grn),inset 0 2px 0 var(--grn)}
.a1-tot td{border-top:2px solid var(--t2);height:32px;font-weight:600}
.a1-tot td.a1-m{font-weight:500}
.a1-wtag{display:block;font-family:"Source Sans 3",sans-serif;font-size:12px;color:var(--grn);font-weight:600;line-height:14px}
.a1-read{display:flex;gap:8px;margin-top:8px;font-size:14px;line-height:20px;color:var(--t2)}
.a1-read .ia{flex:none}
/* cases */
.a1-cb{width:18px;height:18px;border:1.5px solid var(--t3);border-radius:3px;flex:none;display:inline-block;vertical-align:middle}
.a1-chk td:first-child{width:28px}
/* bas : action au pouce + champ */
.a1-dock{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--l2);padding:8px 12px 12px}
.a1-next{display:flex;align-items:center;gap:10px;height:44px;padding:0 0 8px;border-bottom:1px solid var(--l1);margin-bottom:8px}
.a1-next .a1-cap{flex:none;white-space:nowrap}
.a1-next b{font-weight:600;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.a1-btn{height:32px;padding:0 12px;border-radius:4px;background:var(--t1);color:#12100E;border:0;font:700 14px "Source Sans 3",sans-serif;flex:none}
.a1-field{display:flex;gap:8px;align-items:center}
.a1-field input{flex:1;height:36px;border:1px solid var(--l2);border-radius:4px;background:var(--s1);color:var(--t1);padding:0 10px;font:16px "Source Sans 3",sans-serif}
.a1-field input::placeholder{color:var(--t3)}
.a1-sq{width:36px;height:36px;border-radius:4px;border:1px solid var(--l2);background:none;color:var(--t1);display:grid;place-items:center;font-size:16px}
.a1-sq.ia{color:var(--ia);border-color:rgba(188,165,232,.5)}
.a1-sq.on{background:var(--ia);color:#12100E;border-color:var(--ia)}
.a1-sq .ico{width:18px;height:18px}
</style></head><body><div id="a1"></div>
<script>
(function(){
var q=new URLSearchParams(location.search),E=q.get('e')||'liste',IA=q.get('ia')==='1';
var P={probleme:'<path d="M8 2.2 14.3 13.3H1.7Z"/><path d="M8 6.6v3M8 11.4v.2"/>',achat:'<path d="M1.5 2.5h2l1.5 7.5h7.3l1.4-5.3H4.2"/><circle cx="6.3" cy="13" r=".9"/><circle cx="11.6" cy="13" r=".9"/>',echeance:'<rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/>',idee:'<path d="M6 12h4M6.5 14.2h3"/><path d="M8 1.8a4.2 4.2 0 0 0-2.5 7.6c.4.3.7.8.7 1.3V11h3.6v-.3c0-.5.3-1 .7-1.3A4.2 4.2 0 0 0 8 1.8Z"/>',tache:'<rect x="2.2" y="2.2" width="11.6" height="11.6" rx="2"/><path d="m5 8.2 2 2 4-4.3"/>',vente:'<path d="M2 6.5 3.2 2.5h9.6L14 6.5H2Z"/><path d="M3 6.5v7h10v-7M6.5 13.5v-4h3v4"/>',plus:'<path d="M8 3v10M3 8h10"/>',back:'<path d="M10 3 5 8l5 5"/>'};
function ic(n,c){return '<svg class="ico'+(c?' '+c:'')+'" viewBox="0 0 16 16">'+P[n]+'</svg>'}
function m(s){return '<span class="a1-m">'+s+'</span>'}
function num(s){return s.replace(/\d+(?:[,.]\d+)?(?![\dA-Za-zéè])(?:\s?(?:°C|%|bar))?/g,function(x){return m(x)})}
var ST={urgent:'urgent',cherche:'cherche',decide:'décidé',note:'noté',regle:'réglé'};
var T=[
['Brasserie',[
['Chaudière en panne jour de brassage','probleme','urgent','demain 7 h',1],
['600 bouteilles 33 cl','achat','cherche','avant le 15',1],
['Frigo de garde en panne','probleme','cherche','devis · déc.'],
['Trop de vapeur au brassage','probleme','decide','condenseur'],
['Odeur de soufre dans un lot','probleme','decide','lot 14',1],
['CO2 qui baisse vite dans un fût','probleme','decide','0,4 bar',1],
['Levure récoltée à tester','tache','note','3e gén.',1],
['Idée bière au sureau','idee','note','4,5 %',1],
['Levure lente à démarrer','probleme','regle','18 °C',1],
['Malt pilsner en rupture','achat','regle','2 sacs',1],
['Pompe qui chauffe','probleme','regle','vanne']]],
['Local',[
['Écoulement qui fuit','probleme','cherche','devis attendu'],
['Inspection électrique, fusible','tache','cherche','testeur'],
['Ranger la cave','tache','note','sam. 6 déc.',1]]],
['Administratif',[['Assurance à renouveler','echeance','note','31 déc.',1]]],
['Ventes',[['Bar du Centre veut nos bières','vente','note','rappeler lun.'],['Fête de la bière en juin','idee','note','juin']]]];
function dock(next){
 return '<div class="a1-dock">'+(next||'')+'<div class="a1-field"><input placeholder="Noter, coller un lien…" aria-label="Noter"><button class="a1-sq ia'+(IA?' on':'')+'" aria-label="Suggestions de l’IA" data-booster="ia">✦</button><button class="a1-sq" aria-label="Ajouter">'+ic('plus')+'</button></div></div>'}
function liste(){
 var h='<div class="a1-pg"><div class="a1-top"><h1>Carnets</h1><span class="a1-cap">17 · organisé</span></div>';
 h+='<div class="a1-sum"><span class="st-urgent"><b>1</b> urgent</span><span class="st-cherche"><b>5</b> en recherche</span><span class="st-decide"><b>3</b> décidés</span><span class="st-regle"><b>3</b> réglés</span></div>';
 h+='<table class="a1-tree"><colgroup><col><col style="width:62px"><col style="width:88px"></colgroup><thead><tr><th>Carnet</th><th>État</th><th class="r">Repère</th></tr></thead><tbody>';
 T.forEach(function(g){h+='<tr class="a1-grp"><td colspan="3">'+g[0]+'<span class="a1-m">'+g[1].length+'</span></td></tr>';
  g[1].forEach(function(r,i){h+='<tr class="'+(r[2]==='regle'?'a1-dim ':'')+(i===g[1].length-1?'a1-last':'')+'"><td><div class="a1-nm">'+ic(r[1])+'<span>'+r[0]+'</span></div></td><td class="st st-'+r[2]+'">'+ST[r[2]]+'</td><td class="r">'+'<span style="font-size:12px">'+num(r[3])+'</span>'+'</td></tr>'})});
 return h+'</tbody></table></div>'+dock('')}
function head(dom,genre,t){return '<div class="a1-pg"><div class="a1-crumb">'+ic('back')+dom+' / '+genre+'</div><div class="a1-title">'+t+'</div>'}
function sec(n,t,c){return '<div class="a1-sec"><span class="a1-n">'+n+'</span><b>'+t+'</b>'+(c?'<span class="a1-m">'+c+'</span>':'')+'</div>'}
function keep(){return '<span class="a1-keep"><button>Garder</button><button class="x" aria-label="Ignorer">×</button></span>'}
function probleme(){
 var h=head('Local','Problème','Écoulement qui fuit');
 h+='<table class="a1-spec"><tr><td>État</td><td class="st st-cherche">en recherche</td><td class="a1-ref"></td></tr>'+
 '<tr><td>Lieu</td><td>Écoulement au sol de la salle</td><td class="a1-ref a1-m">n2</td></tr>'+
 '<tr><td>Symptôme</td><td>Fuit au joint, flaque après nettoyage</td><td class="a1-ref a1-m">n2</td></tr>'+
 '<tr><td>Cause</td><td>Joint du siphon usé <span class="tag st-regle">· trouvée</span></td><td class="a1-ref a1-m">n3</td></tr></table>';
 h+=sec('1','Pistes','1/2 trouvée')+'<table><colgroup><col><col style="width:110px"><col style="width:30px"></colgroup>'+
 '<tr><td>Joint du siphon</td><td class="tag st-regle">usé · trouvé</td><td class="a1-ref a1-m">n3</td></tr>'+
 '<tr><td>Fuite sous la dalle</td><td class="tag st-note">pas trouvée</td><td class="a1-ref a1-m">n4</td></tr></table>';
 h+=sec('2','Démarches',IA?'0/3':'0/2')+'<table><colgroup><col><col style="width:110px"><col style="width:30px"></colgroup>'+
 '<tr><td>Entreprise X, sanitaire</td><td class="tag st-cherche">à contacter</td><td class="a1-ref a1-m">n5</td></tr>'+
 '<tr><td>Devis</td><td class="tag st-note">attendu</td><td class="a1-ref a1-m">n6</td></tr>'+
 (IA?'<tr class="a1-ia"><td colspan="3" style="padding:6px 6px 6px 8px;height:auto"><div class="a1-sug"><span><span class="ia">✦</span> Faire confirmer par X que le joint est la seule cause, avant de valider le devis</span>'+keep()+'</div></td></tr>':'')+'</table>';
 h+=sec('3','Options',IA?'1 + 1 ✦':'1')+(IA?'<table class="a1-cmp"><colgroup><col style="width:86px"><col><col></colgroup><tr><th></th><th>Entreprise X</th><th class="ia">✦ Toi</th></tr>':'<table class="a1-cmp"><colgroup><col style="width:86px"><col><col></colgroup><tr><th></th><th>Entreprise X</th><th></th></tr>')+'<tr><td>Geste</td><td style="font-size:12px">réparer</td><td style="font-size:12px" class="ia">'+(IA?'changer le joint':'')+'</td></tr><tr><td>Coût</td><td style="font-size:12px">devis attendu</td><td class="a1-m">'+(IA?'—':'')+'</td></tr></table>'+(IA?'<div class="a1-kr" style="box-shadow:inset 2px 0 0 var(--ia)"><span style="font-size:12px;color:var(--ia);margin-right:auto;padding-left:8px;align-self:center">✦ option : changer le joint toi-même</span>'+keep()+'</div>':'');
 if(false){h+=sec('3','Options','1 + 1 ✦')+'<table class="a1-cmp"><colgroup><col style="width:86px"><col><col></colgroup><tr><th></th><th>Entreprise X</th><th class="ia">✦ Toi</th></tr>'+
 '<tr><td>Geste</td><td style="font-size:12px">réparer</td><td style="font-size:12px" class="ia">changer le joint</td></tr>'+
 '<tr><td>Coût</td><td style="font-size:12px">devis attendu</td><td class="a1-m">—</td></tr>'+
 '<tr class="a1-ia"><td colspan="3" class="r" style="height:32px">'+keep()+'</td></tr></table>';}
 if(!IA){h+=sec('4','Sources','6 notes')+'<ul class="a1-foot">'+
 [['n2','L’écoulement au sol de la salle fuit au joint, flaque après chaque nettoyage.'],['n3','Pistes : joint du siphon trouvé usé'],['n4','fuite sous la dalle, pas trouvée.'],['n5','Contacter l’entreprise X (exemple) pour un sanitaire.'],['n6','Devis attendu.']].map(function(x){return '<li><span class="a1-m">'+x[0]+'</span><span>'+x[1]+'</span></li>'}).join('')+'</ul>';}
 return h+'</div>'+dock('<div class="a1-next"><span class="a1-cap">Prochain</span><b>Contacter l’entreprise X</b><button class="a1-btn" data-booster="fait">Fait</button></div>')}
function achat(){
 var h=head('Brasserie','Achat','600 bouteilles 33 cl');
 h+='<table class="a1-spec"><tr><td>Besoin</td><td>'+m('600')+' bouteilles 33 cl</td><td class="a1-ref"></td></tr>'+
 '<tr><td>Délai</td><td>avant le '+m('15')+'</td><td class="a1-ref a1-m">n4</td></tr>'+
 '<tr><td>État</td><td class="st st-cherche">3 offres à départager</td><td class="a1-ref"></td></tr></table>';
 h+=sec('1','Offres comparées','pour 600 bt')+'<table class="a1-cmp"><colgroup><col style="width:86px"><col><col><col></colgroup>'+
 '<tr><th></th><th>Verallia</th><th class="a1-win">Fourn. B</th><th>Occasion</th></tr>'+
 '<tr><td>Prix / bt</td><td class="a1-m">0,42</td><td class="a1-m a1-win">0,55</td><td class="a1-m">0,20</td></tr>'+
 '<tr><td>Lot</td><td class="a1-m">≥ 1200</td><td class="a1-m a1-win">× 600</td><td class="a1-m">≤ 400</td></tr>'+
 '<tr><td>Livraison</td><td class="a1-m">—</td><td class="a1-m a1-win">80 CHF</td><td class="a1-m">—</td></tr>'+
 '<tr><td>État</td><td class="a1-m">—</td><td class="a1-m a1-win">—</td><td style="font-size:12px" class="st-cherche">à laver</td></tr>'+
 '<tr><td>Couvre 600 <span class="ia">✦</span></td><td style="font-size:12px" class="st-cherche">+'+m('600')+' en trop</td><td style="font-size:12px" class="st-regle a1-win">oui</td><td style="font-size:12px" class="st-urgent">manque '+m('200')+'</td></tr>'+
 '<tr class="a1-tot"><td>Total <span class="ia">✦</span></td><td class="a1-m">504 CHF<span class="a1-wtag" style="color:var(--t3)">+ livr. —</span></td><td class="a1-m a1-win">410 CHF<span class="a1-wtag">le plus bas</span></td><td class="a1-m">80 CHF<span class="a1-wtag" style="color:var(--t3)">400 bt</span></td></tr></table>';
 h+='<div class="a1-read"><span class="ia">✦</span><span>B est la seule offre qui couvre 600 bt sans surplus : 0,55 × 600 + 80 = 410 CHF. Verallia impose 1200 bt.</span></div>';
 h+=sec('2','Sources','4 notes')+'<ul class="a1-foot">'+[['n1','Verallia : 0.42/bt, palette de 1200 min'],['n2','Fournisseur B : 0.55/bt par 600, livraison 80 CHF'],['n3','Occasion sur annonce : 0.20/bt, à laver, 400 seulement'],['n4','Besoin avant le 15 du mois']].map(function(x){return '<li><span class="a1-m">'+x[0]+'</span><span>'+x[1]+'</span></li>'}).join('')+'</ul>';
 return h+'</div>'+dock('<div class="a1-next"><span class="a1-cap">Avant le 15</span><b>Retenir Fournisseur B</b><button class="a1-btn" data-booster="retenir">Retenir</button></div>')}
function echeance(){
 var h=head('Administratif','Échéance','Assurance à renouveler');
 h+='<table class="a1-spec"><tr><td>Échéance</td><td>'+m('31.12')+' <span class="tag st-cherche">· dans '+m('35')+' j</span></td><td class="a1-ref a1-m">n1</td></tr>'+
 '<tr><td>Rappel <span class="ia">✦</span></td><td>fin novembre</td><td class="a1-ref"></td></tr>'+
 '<tr><td>Avancement</td><td>'+m('0/5')+' points</td><td class="a1-ref"></td></tr></table>';
 h+=sec('1','Pièces à réunir','0/3')+'<table class="a1-chk"><colgroup><col style="width:28px"><col><col style="width:30px"></colgroup>'+
 ['Police actuelle','Inventaire du matériel','Chiffre d’affaires '+m('2026')].map(function(x){return '<tr><td><span class="a1-cb"></span></td><td>'+x+'</td><td class="a1-ref a1-m">n2</td></tr>'}).join('')+'</table>';
 h+=sec('2','Démarches','0/2')+'<table class="a1-chk"><colgroup><col style="width:28px"><col><col style="width:62px"><col style="width:30px"></colgroup>'+
