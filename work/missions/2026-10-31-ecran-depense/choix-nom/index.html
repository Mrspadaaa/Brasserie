<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nom d'un nouvel article venu d'une facture étrangère · 02.11</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Voie c-nom, retouches e-t8 : six options côte à côte, trois mini maquettes chacune (dépense, stock, factures suivantes).
   A est la référence (aujourd'hui). Une vignette identique au pixel à celle de B est grisée et marquée « = B ». Thème clair. */
:root { color-scheme: light; --fond: #f4f6f1; --carte: #fff; --encre: #1c2019; --discret: #5a6155; --trait: #dde2d6; --houblon: #4a7426; --ref: #7f5b10; --const: #2d5f8a; }
* { box-sizing: border-box; }
body { background: var(--fond); color: var(--encre); font: 16px/1.45 "Segoe UI", system-ui, sans-serif; margin: 0; padding: 14px max(12px, env(safe-area-inset-left, 0px)) 56px; }
.page { max-width: 1320px; margin: 0 auto; display: grid; gap: 16px; }
h1 { margin: 0; line-height: 1.15; font-size: 1.5rem; font-weight: 800; text-wrap: balance; }
p { margin: 0; }
.sur-titre { font-size: 0.875rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--discret); }
#a-choisir { border-left: 4px solid var(--houblon); padding: 8px 12px; background: var(--carte); border-radius: 0 10px 10px 0; display: grid; gap: 4px; }
#a-choisir p:first-child { font-weight: 700; }
.reco { color: var(--houblon); font-weight: 700; }
.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 8px; align-items: start; }
@media (min-width: 1100px) { .options { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; } }
.option { margin: 0; display: grid; gap: 6px; align-content: start; min-width: 0; }
.tete { min-height: 9.4em; display: grid; gap: 3px; align-content: start; }
@media (min-width: 1100px) { .tete { min-height: 8.2em; } }
.lettre { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 6px; min-height: 1.7rem; }
.badge { font-size: 0.875rem; font-weight: 700; border-radius: 999px; padding: 0 8px; }
.b-ref { color: var(--ref); border: 1.5px solid currentColor; }
.b-reco { color: #fff; background: var(--houblon); }
.balises { display: flex; flex-wrap: wrap; gap: 4px; }
.balises span { font-size: 0.875rem; font-weight: 700; border-radius: 6px; padding: 0 6px; line-height: 1.4; }
.fiches { color: var(--houblon); border: 1.5px solid currentColor; }
.fiches.f3 { color: var(--ref); border-style: dashed; }
.aconst { color: var(--const); background: rgb(45 95 138 / 0.1); }
.tete p { font-size: 0.875rem; line-height: 1.3; }
.tete .mesure { color: var(--discret); }
.vue { margin: 0; display: grid; gap: 2px; }
.vue > span { font-size: 0.875rem; color: var(--discret); font-weight: 600; }
.ecran { position: relative; display: block; border: 1px solid var(--trait); border-radius: 10px; overflow: hidden; background: #fff; cursor: zoom-in; }
.ecran img { display: block; width: 100%; height: auto; }
.ecran.egal img { opacity: 0.45; }
.egal-b { position: absolute; top: 6px; right: 6px; font-size: 0.875rem; font-weight: 800; color: #fff; background: #3a3f36; border-radius: 6px; padding: 0 6px; }
[data-reference] .ecran { border: 2px solid var(--ref); }
.option.reco-col .ecran { border: 2px solid var(--houblon); }
dialog { border: 0; padding: 0; background: #0e100c; color: #eef2ea; width: min(96vw, 520px); max-height: 94vh; border-radius: 12px; }
dialog::backdrop { background: rgb(0 0 0 / 80%); }
dialog .haut { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; }
dialog .titre { font-size: 0.875rem; font-weight: 700; }
dialog button { font: 700 0.875rem system-ui, sans-serif; border: 0; border-radius: 999px; padding: 8px 14px; background: #eef2ea; color: #1c2019; cursor: pointer; }
dialog img { display: block; width: 100%; height: auto; max-height: 84vh; object-fit: contain; background: #fff; }
</style>
</head>
<body>
<div class="page">
  <header style="display:grid;gap:8px">
    <p class="sur-titre">L'Affinée · Dépense · nom au stock</p>
    <h1>Nom d'un nouvel article venu d'une facture étrangère · 02.11</h1>
    <div id="a-choisir">
      <p>Sous quel nom un article d'une facture allemande entre-t-il au stock, et la facture suivante le retrouve-t-elle ?</p>
      <p><span class="reco">Proposée : B</span>, « traduit en français et fait le bon lien » ; les six restent ouvertes.</p>
    </div>
  </header>

  <section data-choix="nom-article" aria-label="Six options" class="options">
    <figure class="option" data-reference>
      <div class="tete"><p class="lettre">A <span class="badge b-ref">aujourd'hui</span></p><p class="balises"><span class="fiches f3">3 fiches</span></p><p>Au stock sous le nom imprimé.</p><p class="mesure">aujourd'hui : DE se relie, EN et FR font 2 fiches de plus — mesuré 02.11</p></div>
      <div class="vue" data-vignette><span>Facture 1 · DE</span><a class="ecran" href="img/a-depense.png" data-agrandir data-titre="A · Facture 1, en allemand" title="cadre bleu : le nom qui entre au stock"><img src="img/a-depense.png" width="780" height="892" alt="A, Facture 1, en allemand"></a></div>
      <div class="vue" data-vignette><span>Au stock</span><a class="ecran" href="img/a-stock.png" data-agrandir data-titre="A · Au stock"><img src="img/a-stock.png" width="780" height="1040" alt="A, Au stock"></a></div>
      <div class="vue" data-vignette><span>Factures suivantes</span><a class="ecran" href="img/a-suivantes.png" data-agrandir data-titre="A · Les factures suivantes"><img src="img/a-suivantes.png" width="780" height="944" alt="A, Les factures suivantes"></a></div>
    </figure>
    <figure class="option reco-col" data-variante="b">
      <div class="tete"><p class="lettre">B <span class="badge b-reco">proposée</span></p><p class="balises"><span class="fiches">1 fiche</span><span class="aconst">à construire</span></p><p>En français ; l'imprimé gardé à la fiche.</p></div>
      <div class="vue" data-vignette><span>Facture 1 · DE</span><a class="ecran" href="img/b-depense.png" data-agrandir data-titre="B · Facture 1, en allemand" title="cadre bleu : le nom qui entre au stock"><img src="img/b-depense.png" width="780" height="892" alt="B, Facture 1, en allemand"></a></div>
      <div class="vue" data-vignette><span>Au stock</span><a class="ecran" href="img/b-stock.png" data-agrandir data-titre="B · Au stock"><img src="img/b-stock.png" width="780" height="1040" alt="B, Au stock"></a></div>
      <div class="vue" data-vignette><span>Factures suivantes</span><a class="ecran" href="img/b-suivantes.png" data-agrandir data-titre="B · Les factures suivantes"><img src="img/b-suivantes.png" width="780" height="944" alt="B, Les factures suivantes"></a></div>
    </figure>
    <figure class="option" data-variante="c">
      <div class="tete"><p class="lettre">C </p><p class="balises"><span class="fiches">1 fiche</span><span class="aconst">à construire</span></p><p>En français, l'imprimé dessous dans la liste.</p></div>
      <div class="vue" data-vignette><span>Facture 1 · DE</span><a class="ecran egal" href="img/c-depense.png" data-agrandir data-titre="C · Facture 1, en allemand (= B)" title="cadre bleu : le nom qui entre au stock"><img src="img/c-depense.png" width="780" height="892" alt="C, Facture 1, en allemand"><b class="egal-b">= B</b></a></div>
      <div class="vue" data-vignette><span>Au stock</span><a class="ecran" href="img/c-stock.png" data-agrandir data-titre="C · Au stock"><img src="img/c-stock.png" width="780" height="1040" alt="C, Au stock"></a></div>
      <div class="vue" data-vignette><span>Factures suivantes</span><a class="ecran" href="img/c-suivantes.png" data-agrandir data-titre="C · Les factures suivantes"><img src="img/c-suivantes.png" width="780" height="944" alt="C, Les factures suivantes"></a></div>
    </figure>
    <figure class="option" data-variante="d">
      <div class="tete"><p class="lettre">D </p><p class="balises"><span class="fiches">1 fiche</span><span class="aconst">à construire</span></p><p>B, et les doublons déjà là à fusionner.</p></div>
      <div class="vue" data-vignette><span>Facture 1 · DE</span><a class="ecran egal" href="img/d-depense.png" data-agrandir data-titre="D · Facture 1, en allemand (= B)" title="cadre bleu : le nom qui entre au stock"><img src="img/d-depense.png" width="780" height="892" alt="D, Facture 1, en allemand"><b class="egal-b">= B</b></a></div>
      <div class="vue" data-vignette><span>Au stock</span><a class="ecran" href="img/d-stock.png" data-agrandir data-titre="D · Au stock"><img src="img/d-stock.png" width="780" height="1040" alt="D, Au stock"></a></div>
      <div class="vue" data-vignette><span>Factures suivantes</span><a class="ecran egal" href="img/d-suivantes.png" data-agrandir data-titre="D · Les factures suivantes (= B)"><img src="img/d-suivantes.png" width="780" height="944" alt="D, Les factures suivantes"><b class="egal-b">= B</b></a></div>
    </figure>
    <figure class="option" data-variante="e">
      <div class="tete"><p class="lettre">E </p><p class="balises"><span class="fiches">1 fiche</span><span class="aconst">à construire</span></p><p>Le nom français en jaune, à garder.</p></div>
      <div class="vue" data-vignette><span>Facture 1 · DE</span><a class="ecran" href="img/e-depense.png" data-agrandir data-titre="E · Facture 1, en allemand" title="cadre bleu : le nom qui entre au stock"><img src="img/e-depense.png" width="780" height="892" alt="E, Facture 1, en allemand"></a></div>
      <div class="vue" data-vignette><span>Au stock</span><a class="ecran egal" href="img/e-stock.png" data-agrandir data-titre="E · Au stock (= B)"><img src="img/e-stock.png" width="780" height="1040" alt="E, Au stock"><b class="egal-b">= B</b></a></div>
      <div class="vue" data-vignette><span>Factures suivantes</span><a class="ecran egal" href="img/e-suivantes.png" data-agrandir data-titre="E · Les factures suivantes (= B)"><img src="img/e-suivantes.png" width="780" height="944" alt="E, Les factures suivantes"><b class="egal-b">= B</b></a></div>
    </figure>
    <figure class="option" data-variante="f">
      <div class="tete"><p class="lettre">F </p><p class="balises"><span class="fiches">1 fiche</span><span class="aconst">à construire</span></p><p>B, mais une autre langue est proposée.</p></div>
      <div class="vue" data-vignette><span>Facture 1 · DE</span><a class="ecran egal" href="img/f-depense.png" data-agrandir data-titre="F · Facture 1, en allemand (= B)" title="cadre bleu : le nom qui entre au stock"><img src="img/f-depense.png" width="780" height="892" alt="F, Facture 1, en allemand"><b class="egal-b">= B</b></a></div>
      <div class="vue" data-vignette><span>Au stock</span><a class="ecran egal" href="img/f-stock.png" data-agrandir data-titre="F · Au stock (= B)"><img src="img/f-stock.png" width="780" height="1040" alt="F, Au stock"><b class="egal-b">= B</b></a></div>
      <div class="vue" data-vignette><span>Factures suivantes</span><a class="ecran" href="img/f-suivantes.png" data-agrandir data-titre="F · Les factures suivantes"><img src="img/f-suivantes.png" width="780" height="944" alt="F, Les factures suivantes"></a></div>
    </figure>
  </section>
</div>

<dialog id="grand" aria-label="Capture en grand">
  <div class="haut"><p class="titre" id="grand-titre"></p><button type="button" class="fermer">Fermer</button></div>
  <img id="grand-img" alt="">
</dialog>
<script>
(function () {
  var dlg = document.getElementById('grand'), img = document.getElementById('grand-img'), titre = document.getElementById('grand-titre');
  document.querySelectorAll('[data-agrandir]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      if (!dlg.showModal) return;
      e.preventDefault();
      img.setAttribute('src', a.getAttribute('href'));
      img.setAttribute('alt', a.getAttribute('data-titre'));
      titre.textContent = a.getAttribute('data-titre');
      dlg.showModal();
    });
  });
  dlg.querySelector('.fermer').addEventListener('click', function () { dlg.close(); });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
})();
</script>
</body>
</html>
