.tvaz4-corps{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 8px 12px}
.tvaz4-titre{display:flex;align-items:center;gap:6px;min-height:40px;border-bottom:1px solid var(--bord)}

// La bouteille d'un brassin, remplie à la hauteur de sa TVA (part du plus gros) ; le fût pour le hors brassin.
function bouteille(part,inconnu){
 var H=22, y=8+H-Math.round(H*part);
 var fill=inconnu?'url(#'+P+'hach)':'var(--red)';
 return '<svg class="'+P+'bout" viewBox="0 0 24 36" aria-hidden="true"><defs><pattern id="'+P+'hach" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="4" fill="#C9A24A"/></pattern></defs>'+
  '<clipPath id="'+P+'cp'+Math.round(part*100)+'"><path d="M8 2h8v5l3 4v21a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V11l3-4z"/></clipPath>'+
  '<rect x="4" y="'+y+'" width="16" height="'+(H+8)+'" fill="'+fill+'" clip-path="url(#'+P+'cp'+Math.round(part*100)+')"/>'+
  '<path d="M8 2h8v5l3 4v21a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V11l3-4z" fill="none" stroke="var(--t1)" stroke-width="1.5" stroke-linejoin="round"/></svg>';
}
function fut(part){
 var H=24, y=6+H-Math.round(H*part);
 return '<svg class="'+P+'bout" viewBox="0 0 24 36" aria-hidden="true"><clipPath id="'+P+'cpf"><rect x="4" y="6" width="16" height="24" rx="3"/></clipPath>'+
  '<rect x="4" y="'+y+'" width="16" height="'+(H+6)+'" fill="var(--fin)" clip-path="url(#'+P+'cpf)"/>'+
  '<rect x="4" y="6" width="16" height="24" rx="3" fill="none" stroke="var(--t1)" stroke-width="1.5"/><path d="M4 13h16M4 23h16" stroke="var(--t1)" stroke-width="1.5"/></svg>';
}
function coquille(){
 return '<header class="'+P+'hd"><span class="'+P+'logo"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2h7v3h2v6h-2v3H4z"/></svg></span><h1>L\'Affinée</h1>'+
  '<button class="'+P+'ib '+P+'nb" aria-label="Thème cave" data-role="theme">'+ic.lune+'</button><button class="'+P+'ib" aria-label="Rechercher" data-role="rechercher">'+ic.loupe+'</button><button class="'+P+'ib" aria-label="Aide" data-role="aide">'+ic.quoi+'</button></header>'+
  '<nav class="'+P+'tabs" role="tablist"><button role="tab" aria-selected="true">Synthèse</button><button role="tab">Opérations</button><button role="tab">Prévisions</button><button role="tab">Annuel</button></nav>';
}
function bas(){
 return '<nav class="'+P+'bas"><button>'+ic.bord+'Bord</button><button aria-current="page">'+ic.fin+'Finances</button><button class="'+P+'c1">'+ic.bra+'Brassins</button><button class="'+P+'c2">'+ic.sto+'Stocks</button><button>'+ic.cli+'Clients</button><button class="'+P+'fab" aria-label="Actions rapides" data-role="plus">'+ic.plus+'</button></nav>';
}
function ligne(x){
 var tv=x.k==='inc'?'<span class="'+P+'tv '+P+'q">?</span>':'<span class="'+P+'tv">'+n2(x.tva)+'</span>';
 var tx=x.k==='inc'?'inconnue':x.k==='etr'?'DE 19 %':x.k==='dou'?'choisie':x.k==='2'?'2,6 %':'8,1 %';
 var kst=x.k==='inc'?'background:var(--hach);border:1px solid var(--inc)':x.k==='dou'?'background:#fff;border:1.5px dashed var(--inc)':x.k==='etr'?'background:var(--etr)':x.k==='2'?'background:var(--red)':'background:var(--fin)';
 return '<div class="'+P+'li"><span class="'+P+'d">'+x.d+'</span><span class="'+P+'f">'+x.f+' <small>· '+x.c+' · '+n2(x.ttc)+'</small></span><i class="'+P+'k" style="'+kst+'"></i><span class="'+P+'tx">'+tx+'</span>'+tv+'</div>';
}
function barre(S){
 if(S.nconnu===0)return '';
 var w=function(v){return Math.round(v/MAX*100)+'%';};
 return '<div class="'+P+'bar" aria-hidden="true">'+(S.t2?'<i class="'+P+'s2" style="width:'+w(S.t2)+'"></i>':'')+(S.t8?'<i class="'+P+'s8" style="width:'+w(S.t8)+'"></i>':'')+(S.tdou?'<i class="'+P+'sdou" style="width:'+w(Math.max(S.tdou,MAX*0.03))+'"></i>':'')+'</div>';
}
function brassin(g){
 var S=g.S, b=g.b, est=!!ouverts[b.id];
 var ctl=S.nconnu?Math.round(S.tot/b.l*100):null; // centimes par litre
 var h='<div class="'+P+'br" aria-expanded="'+est+'"><button class="'+P+'bh" data-booster="brassin" data-role="brassin" data-b="'+b.id+'">'+bouteille(S.tot/MAX,S.nconnu===0&&S.ninc>0)+
  '<span class="'+P+'bn"><b>'+b.nom+'</b>'+(est||S.ninc?'<small>'+(est?'<i>'+b.l+' L</i>':'')+(S.ninc?(est?' · ':'')+'<i style="color:var(--inc)">'+S.ninc+'?</i>':'')+'</small>':'')+'</span>'+
  '<span class="'+P+'bv">'+(S.nconnu?'<b>'+n2(S.tot)+'</b><span class="'+P+'ct">'+ctl+' ct/L</span>':(S.n?'<b class="'+P+'q">?</b><span class="'+P+'ct '+P+'g">TVA inconnue</span>':'<b>—</b>'))+'</span></button>'+barre(S);
 if(est&&g.items.length)h+='<div class="'+P+'fact" data-mots="lignes">'+g.items.map(ligne).join('')+'</div>';
 return h+'</div>';
}
function hors(){
 var S=HORS.S, est=!!ouverts[0];
 var h='<div class="'+P+'br" aria-expanded="'+est+'"><button class="'+P+'bh" data-booster="brassin" data-role="brassin" data-b="0">'+fut(S.tot/MAX)+
  '<span class="'+P+'bn"><b>Hors brassin</b></span>'+
  '<span class="'+P+'bv">'+(S.nconnu?'<b>'+n2(S.tot)+'</b>':'<b>—</b>')+(est?'<span class="'+P+'ct '+P+'g">'+Math.round(S.nconnu?S.tot/AN.tot*100:0)+' %</span>':'')+'</span></button>'+barre(S);
 if(S.ninc)h+='<div class="'+P+'inc"><i></i><b>'+S.ninc+'</b> sans TVA lue · <b>'+n2(S.ttcinc)+'</b></div>';
 if(S.netr)h+='<div class="'+P+'etr"><i></i>DE 19% <b>'+n2(S.tetr)+'</b><span>hors CH</span></div>';
 if(est&&HORS.items.length)h+='<div class="'+P+'fact" data-mots="lignes">'+HORS.items.map(ligne).join('')+'</div>';
 return h+'</div>';
}
function sheet(){
 if(!siOuvert)return '';
 return '<div class="'+P+'voile" data-role="voile"><div class="'+P+'sheet" role="dialog" aria-label="Si j\'étais assujetti"><header><b>Si j\'étais assujetti</b><button class="'+P+'ib" aria-label="Fermer" data-role="fermer">'+ic.x+'</button></header>'+
  '<div class="'+P+'kv"><span>Aujourd\'hui</span><b>Non assujetti · réglage de l\'app</b><span>Payée en '+ANNEE+'</span><b style="font-family:var(--mono)">'+n2(AN.tot)+' CHF</b><span>Récupérable</span><b>Dépend de tes ventes : rien n\'est déduit ici</b></div>'+
  '<a class="'+P+'lien" href="https://www.estv.admin.ch/estv/fr/accueil/taxe-sur-la-valeur-ajoutee.html" target="_blank" rel="noopener">'+ic.ext+'AFC · assujettissement<small>estv.admin.ch</small></a>'+
  '<a class="'+P+'lien" href="#fiduciaire">'+ic.chev+'Ma fiduciaire<small>Clients</small></a>'+
  '<button class="'+P+'bt" data-role="reglage">'+ic.regl+'Réglages · TVA</button></div></div>';
}
function rendu(){
 var app=document.getElementById(P+'app');
 var hl=ETAT==='horsligne'?'<div class="'+P+'hl">'+ic.nuage+'<b>Hors ligne</b> · lu sur l\'appareil, <b>'+L.length+'</b> factures</div>':'';
 var corps='<div class="'+P+'titre"><h2>Situation financière</h2>'+ic.regl+'<div class="'+P+'seg" role="group"><button aria-pressed="false">Situation</button><button aria-pressed="false">Coûts</button><button aria-pressed="true" data-booster="mode-tva">TVA</button></div></div>'+hl+
  '<div class="'+P+'ctx"><div class="'+P+'per" data-booster="periode"><button aria-label="Année précédente" data-role="per-moins">'+ic.g+'</button><b>'+ANNEE+'</b><button aria-label="Année suivante" data-role="per-plus">'+ic.d+'</button></div>'+
  '<button class="'+P+'st" data-booster="statut" data-role="reglage"><i></i>Non assujetti · réglage</button></div>';
 if(AN.n===0){
  corps+='<div class="'+P+'rep"><span class="'+P+'big">—<small> CHF</small></span><span class="'+P+'rl">aucune dépense en <b>'+ANNEE+'</b></span></div>';
  corps+='<div class="'+P+'brs">'+GR.map(brassin).join('')+hors()+'</div>';
  corps+='<div class="'+P+'videb"><button class="'+P+'bt '+P+'pri" data-role="plus">'+ic.plus+'Nouvelle dépense</button></div>';
 }else{
  corps+='<div class="'+P+'rep"><span class="'+P+'big">'+n2(AN.tot)+'<small> CHF</small></span><span class="'+P+'rl">payée · <b>0,00</b> remboursée'+(ETAT==='inconnues'?' · <span class="'+P+'part">total partiel</span>':'')+'</span></div>';
  corps+='<div class="'+P+'brs">'+GR.map(brassin).join('')+hors()+'</div>';
  corps+='<button class="'+P+'rem" data-booster="si-assujetti" data-role="si"><em>si assujetti '+ic.chev+'</em></button>';
 }
 app.innerHTML=coquille()+'<div class="'+P+'corps">'+corps+'</div>'+bas()+sheet();
 brancher();
}
function brancher(){
 var app=document.getElementById(P+'app');
 app.querySelectorAll('[data-role="brassin"]').forEach(function(b){b.addEventListener('click',function(){var id=Number(b.getAttribute('data-b'));ouverts[id]=!ouverts[id];rendu();});});
 app.querySelectorAll('[data-role="si"]').forEach(function(b){b.addEventListener('click',function(){siOuvert=true;rendu();});});
 app.querySelectorAll('[data-role="fermer"],[data-role="voile"]').forEach(function(b){b.addEventListener('click',function(e){if(e.target===b||b.getAttribute('data-role')==='fermer'){siOuvert=false;rendu();}});});
 app.querySelectorAll('[data-role="per-moins"],[data-role="per-plus"]').forEach(function(b){b.addEventListener('click',function(){ANNEE+=b.getAttribute('data-role')==='per-plus'?1:-1;rendu();});});
}
rendu();
})();
</script></body></html>
