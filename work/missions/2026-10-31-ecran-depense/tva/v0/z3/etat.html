 etoile:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l1.5 3.5L13 8l-3.5 1.5L8 13l-1.5-3.5L3 8l3.5-1.5z"/><path d="M14 2v3M12.5 3.5h3"/></svg>',
 plus:'<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" data-commun><path d="M10 4v12M4 10h12"/></svg>',
 ext:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M9 3h4v4M13 3 7 9M11 9v4H3V5h4"/></svg>',
 nuage:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4.5 12.5A3 3 0 0 1 5 6.6a4 4 0 0 1 7.6 1.2A2.5 2.5 0 0 1 12 12.5z"/><path d="M2 2l12 12"/></svg>'
};
function coquille(){
 return '<header class="'+P+'hd"><span class="'+P+'logo"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2h7v3h2v6h-2v3H4z"/></svg></span><h1>L\'Affinée</h1>'+
  '<button class="'+P+'ib '+P+'nb" aria-label="Thème cave" data-role="theme">'+ic.lune+'</button><button class="'+P+'ib" aria-label="Rechercher" data-role="rechercher">'+ic.loupe+'</button><button class="'+P+'ib" aria-label="Aide" data-role="aide">'+ic.quoi+'</button></header>'+
  '<nav class="'+P+'tabs" role="tablist"><button role="tab" aria-selected="true">Synthèse</button><button role="tab">Opérations</button><button role="tab">Prévisions</button><button role="tab">Annuel</button></nav>';
}
function bas(){
 return '<nav class="'+P+'bas"><button>'+ic.bord+'Bord</button><button aria-current="page">'+ic.fin+'Finances</button><button class="'+P+'c1">'+ic.bra+'Brassins</button><button class="'+P+'c2">'+ic.sto+'Stocks</button><button>'+ic.cli+'Clients</button><button class="'+P+'fab" aria-label="Actions rapides" data-role="plus">'+ic.plus+'</button></nav>';
}
// Les cases d'une liste de factures : colorées par taux pour la TVA connue, « ? » hachurée pour chaque facture sans TVA lue.
function cases(items){
 var h='';
 items.forEach(function(x){
  if(filtre&&x.k!==filtre)return;
  if(x.k==='etr')return;
  if(x.k==='inc'){h+='<i class="'+P+'cinc" title="sans TVA lue"></i>';return;}
  var n=Math.max(1,Math.round(x.tva/CASE));
  for(var j=0;j<n;j++)h+='<i class="'+P+'c'+x.k+'"></i>';
 });
 return h;
}
function chips(S){
 var h='<div class="'+P+'chips">';
 h+='<button class="'+P+'chip" data-booster="chip-taux" data-k="2" aria-pressed="'+(filtre==='2')+'"><i style="background:var(--red)"></i>2,6% <b>'+n2(S.t2)+'</b></button>';
 h+='<button class="'+P+'chip" data-booster="chip-taux" data-k="8" aria-pressed="'+(filtre==='8')+'"><i style="background:var(--fin)"></i>8,1% <b>'+n2(S.t8)+'</b></button>';
 if(S.ndou)h+='<button class="'+P+'chip" data-booster="chip-taux" data-k="dou" aria-pressed="'+(filtre==='dou')+'"><i style="background:#fff;border:1.5px dashed var(--inc)"></i>choisie <b>'+n2(S.tdou)+'</b></button>';
 if(S.ninc)h+='<button class="'+P+'chip" data-booster="chip-taux" data-k="inc" aria-pressed="'+(filtre==='inc')+'"><i style="background:var(--hach);border:1px solid var(--inc)"></i>'+S.ninc+' sans TVA lue · <b>'+n2(S.ttcinc)+'</b></button>';
 return h+'</div>';
}
function carte(){
 var h='<div class="'+P+'carte" role="button" tabindex="0" data-booster="carte-tva" data-role="ouvrir"><div class="'+P+'ch1"><b>TVA payée · '+ANNEE+'</b><em>Non assujetti · réglage</em>'+ic.chev+'</div>';
 if(AN.n===0)return h+'<div class="'+P+'rep"><span class="'+P+'big">—<small> CHF</small></span><span>aucune dépense</span></div></div>';
 h+='<div class="'+P+'rep"><span class="'+P+'big">'+n2(AN.tot)+'<small> CHF</small></span>'+(ETAT==='inconnues'?'<span class="'+P+'part">total partiel</span>':'')+'</div>';
 h+='<div class="'+P+'g" aria-hidden="true">'+cases(L)+'</div>'+chips(AN)+'</div>';
 return h;
}
function synthese(){
 return '<div class="'+P+'titre"><h2>Situation financière</h2>'+ic.regl+'<div class="'+P+'seg" role="group"><button aria-pressed="true">Situation</button><button aria-pressed="false">Coûts</button></div></div>'+
  '<button class="'+P+'row"><span class="'+P+'rl"><small>Trésorerie</small><span>Solde de départ à renseigner</span></span><span class="'+P+'mono">À compléter</span>'+ic.chev+'</button>'+
  carte()+
  '<div class="'+P+'row"><b>Pour une situation fiable</b></div>'+
  '<button class="'+P+'row"><span class="'+P+'rl"><span>Vérifier le solde de départ</span><small>La trésorerie ne peut pas encore être confirmée.</small></span>'+ic.chev+'</button>'+
  '<button class="'+P+'row"><b>Règlements à suivre</b><em style="margin-left:auto;color:var(--fin);font-size:14px">Tout voir</em>'+ic.chev+'</button>'+
  '<button class="'+P+'row"><span class="'+P+'rl"><span>Origine et limites des montants</span></span>'+ic.bas+'</button>'+
  '<button class="'+P+'row">'+ic.etoile+'<span class="'+P+'rl"><span>Comprendre mes dépenses</span></span><em>Compagnon brasseur</em>'+ic.chev+'</button>';
}
function vue(){
 var h='<div class="'+P+'vt"><button class="'+P+'ib '+P+'nb" aria-label="Retour à Synthèse" data-role="retour">'+ic.g+'</button><h2>TVA payée</h2><div class="'+P+'per" data-booster="periode"><button aria-label="Année précédente" data-role="per-moins">'+ic.g+'</button><b>'+ANNEE+'</b><button aria-label="Année suivante" data-role="per-plus">'+ic.d+'</button></div></div>';
 h+=(ETAT==='horsligne'?'<div class="'+P+'hl">'+ic.nuage+'<b>Hors ligne</b> · lu sur l\'appareil, <b>'+L.length+'</b> factures</div>':'');
 h+='<div class="'+P+'ctx"><button class="'+P+'st" data-booster="statut" data-role="reglage"><i></i>Non assujetti · réglage</button><span class="'+P+'unite"><i></i>= '+CASE+' CHF</span></div>';
 if(AN.n===0){
  h+='<div class="'+P+'rep"><span class="'+P+'big">—<small> CHF</small></span><span>aucune dépense en '+ANNEE+'</span></div>';
  h+='<div class="'+P+'mois">'+MOIS.map(function(m){return '<div class="'+P+'mr"><span class="'+P+'ml">'+m+'</span><span class="'+P+'vide"></span><span class="'+P+'mv">—</span></div>';}).join('')+'</div>';
  h+='<div class="'+P+'videb"><button class="'+P+'bt '+P+'pri" data-role="plus">'+ic.plus+'Nouvelle dépense</button></div>';
  return h;
 }
 h+='<div class="'+P+'rep"><span class="'+P+'big">'+n2(AN.tot)+'<small> CHF</small></span>'+chips(AN)+(ETAT==='inconnues'?'<span class="'+P+'part">total partiel</span>':'')+'</div>';
 h+='<div class="'+P+'mois" data-mots="lignes">';
 for(var m=1;m<=12;m++){
  var items=L.filter(function(x){return x.m===m;});
  var S=somme(items);
  var vis=items.filter(function(x){return !filtre||x.k===filtre;});
  var val=S.n===0?'—':(S.nconnu===0?'<span class="'+P+'q">?</span>':n2(S.tot)+(S.ninc?' <small>+'+S.ninc+'?</small>':''));
  h+='<button class="'+P+'mr" data-booster="mois" data-m="'+m+'" aria-pressed="'+(!!moisOuverts[m])+'" data-role="mois"><span class="'+P+'ml">'+MOIS[m-1]+'</span>'+(S.n===0?'<span class="'+P+'vide"></span>':'<span class="'+P+'g" aria-hidden="true">'+cases(items)+'</span>')+'<span class="'+P+'mv">'+val+'</span></button>';
  if(moisOuverts[m]&&vis.length){
   h+='<div class="'+P+'fact">'+vis.map(function(x){
    var tv=x.k==='inc'?'<span class="'+P+'tv '+P+'q">?</span>':'<span class="'+P+'tv">'+n2(x.tva)+'</span>';
    var tx=x.k==='inc'?'inconnue':x.k==='etr'?'DE 19 %':x.k==='dou'?'choisie':x.k==='2'?'2,6 %':'8,1 %';
    var kst=x.k==='inc'?'background:var(--hach);border:1px solid var(--inc)':x.k==='dou'?'background:#fff;border:1.5px dashed var(--inc)':x.k==='etr'?'background:var(--etr);border-radius:50%':x.k==='2'?'background:var(--red)':'background:var(--fin)';
    return '<div class="'+P+'li"><span class="'+P+'d">'+x.d+'</span><span class="'+P+'f">'+x.f+' <small>· '+x.c+' · '+n2(x.ttc)+'</small></span><i class="'+P+'k" style="'+kst+'"></i><span class="'+P+'tx">'+tx+'</span>'+tv+'</div>';
   }).join('')+'</div>';
  }
 }
 h+='</div>';
 if(AN.netr)h+='<button class="'+P+'etr" data-role="etrangere"><i></i>DE 19% <b>'+n2(AN.tetr)+'</b> · hors des cases<span>hors CH</span></button>';
 h+='<button class="'+P+'rem" data-booster="si-assujetti" data-role="si">Remboursée : <b>0,00</b> · non assujetti<em>si assujetti '+ic.chev+'</em></button>';
 if(siOuvert)h+='<div class="'+P+'pop"><div>Aujourd\'hui<b>non assujetti · réglage</b></div><a class="'+P+'lien" href="https://www.estv.admin.ch/estv/fr/accueil/taxe-sur-la-valeur-ajoutee.html" target="_blank" rel="noopener">'+ic.ext+'AFC · assujettissement<small>estv.admin.ch</small></a><a class="'+P+'lien" href="#fiduciaire">'+ic.chev+'Ma fiduciaire<small>Clients</small></a></div>';
 return h;
}
function rendu(){
 var app=document.getElementById(P+'app');
 app.innerHTML=coquille()+'<div class="'+P+'corps">'+(ouvert?vue():synthese())+'</div>'+bas();
 brancher();
}
function brancher(){
 var app=document.getElementById(P+'app');
 app.querySelectorAll('[data-role="ouvrir"]').forEach(function(b){b.addEventListener('click',function(e){if(e.target.closest('[data-booster="chip-taux"]'))return;ouvert=true;rendu();});});
 app.querySelectorAll('[data-role="retour"]').forEach(function(b){b.addEventListener('click',function(){ouvert=false;rendu();});});
 app.querySelectorAll('[data-role="mois"]').forEach(function(b){b.addEventListener('click',function(){var m=Number(b.getAttribute('data-m'));moisOuverts[m]=!moisOuverts[m];rendu();});});
 app.querySelectorAll('[data-booster="chip-taux"]').forEach(function(b){b.addEventListener('click',function(e){e.stopPropagation();var k=b.getAttribute('data-k');filtre=(filtre===k)?null:k;rendu();});});
 app.querySelectorAll('[data-role="si"]').forEach(function(b){b.addEventListener('click',function(){siOuvert=!siOuvert;rendu();});});
 app.querySelectorAll('[data-role="per-moins"],[data-role="per-plus"]').forEach(function(b){b.addEventListener('click',function(){ANNEE+=b.getAttribute('data-role')==='per-plus'?1:-1;rendu();});});
}
rendu();
})();
</script></body></html>
