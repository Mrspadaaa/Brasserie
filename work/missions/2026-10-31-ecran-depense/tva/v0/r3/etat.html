      ['29.10','Levures Démo Sàrl',61.00,null,17],['14.11','Malterie Fictive SA',520.00,2.6,18],['14.11','Houblons du Jura Sàrl',176.00,2.6,18],['02.12','Droguerie Démo SA',88.40,8.1,0],
      ['10.12','Malterie Fictive SA',498.00,2.6,19],['10.12','Houblons du Jura Sàrl',152.30,2.6,19],['19.12','Matériel Exemple SA',212.00,8.1,0]],
    2024: []
  };
  var VENTES = { 2026: 9860, 2025: 7420, 2024: 0 };
  var DOUTE = { i: 13, lu: '4,21', somme: '6,12' };
  var ETR = { d: '08.06', f: 'Inox Demo GmbH', mont: '1 180,00', mwst: '188,40' };

  var etat = new URLSearchParams(location.search).get('etat') || 'annee';
  var an = etat === 'inconnues' ? 2025 : etat === 'vide' ? 2024 : 2026;
  var ouvert = { annee: null, douteuse: 24, etrangere: 'de', inconnues: 17 }[etat] || null;
  if (etat === 'horsligne') document.body.classList.add('tvar3-off');

  function fmt(n) { var s = Math.abs(n).toFixed(2).split('.'); return (n < 0 ? '−' : '') + s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ',' + s[1]; }
  function tva(l) { return l[3] == null ? null : Math.round(l[2] * l[3] / (100 + l[3]) * 100) / 100; }
  function tx(t) { return String(t).replace('.', ',') + ' %'; }
  var chev = '<svg class="tvar3-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  var bas = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5714" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  var sortie = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5714" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';

  // Une perle par dépense : sa couleur dit le taux, sa largeur suit sa TVA ; l'inconnue est hachurée, « ? »
  function perle(l, dou, large) {
    var v = tva(l);
    if (v == null) return '<span class="tvar3-pe tvar3-ein">?</span>';
    var w = large ? '' : ' style="min-width:' + Math.max(20, Math.min(64, Math.round(v * 2.4))) + 'px"';
    return '<span class="tvar3-pe ' + (l[3] === 2.6 ? 'tvar3-e26' : 'tvar3-e81') + (dou ? ' tvar3-edou' : '') + '"' + w + '>' + (large ? tx(l[3]) : '') + '</span>';
  }
  function ligne(l, dou) {
    var v = tva(l);
    return '<button type="button" class="tvar3-li' + (dou ? ' tvar3-ldou' : '') + '"' + (dou ? ' data-ouvre="1" data-booster="douteuse"' : '') + '><span class="tvar3-d tvar3-m">' + l[0] + '</span><span class="tvar3-f">' + l[1] + ' · <span class="tvar3-m">' + fmt(l[2]) + '</span></span>' +
      (v == null ? '<span class="tvar3-pe tvar3-ein" style="width:58px">?</span>' : perle(l, dou, true)) + '<span class="tvar3-x tvar3-m">' + (v == null ? '—' : fmt(v)) + '</span></button>';
  }

  function rendre() {
    document.getElementById('tvar3-an').textContent = an;
    document.getElementById('tvar3-moins').disabled = an <= 2024;
    document.getElementById('tvar3-plus').disabled = an >= 2026;
    var deps = DEP[an], h = [];
    var etr = etat === 'etrangere' && an === 2026, dou = etat === 'douteuse' && an === 2026;
    var connu = 0, inc = 0, ttcInc = 0, ttcCon = 0, p26 = 0, p81 = 0;
    deps.forEach(function (l) { var v = tva(l); if (v == null) { inc++; ttcInc += l[2]; } else { connu += v; ttcCon += l[2]; if (l[3] === 2.6) p26 += v; else p81 += v; } });
    h.push('<div class="tvar3-recap"><a class="tvar3-non" href="#reglages" data-booster="statut-reglage"><b>Non</b><small>remboursée</small></a>');
    if (!deps.length) {
      h.push('<div class="tvar3-r1"><span class="tvar3-lb">TVA payée</span><span class="tvar3-am tvar3-m">0,00<small>CHF</small></span></div><div class="tvar3-r2"><a class="tvar3-chip tvar3-creg" href="#reglages">Non assujetti' + chev + '</a></div></div>');
      h.push('<div class="tvar3-vide"><span>Aucun brassin ni dépense en ' + an + '.</span><a href="#nouvelle">Saisir une dépense' + chev + '</a></div>');
      document.getElementById('tvar3-vue').innerHTML = h.join(''); brancher(); return;
    }
    h.push('<div class="tvar3-r1"><span class="tvar3-lb">TVA payée</span>' + (inc ? '<span class="tvar3-mn">au moins</span>' : '') + '<span class="tvar3-am tvar3-m' + (ttcInc > (ttcInc + ttcCon) / 2 ? ' tvar3-flou' : '') + '">' + fmt(connu) + '<small>CHF</small></span></div>');
    h.push('<div class="tvar3-r2">' + (inc ? '<button type="button" class="tvar3-chip tvar3-cinc" data-va="inc" data-booster="inconnues">+' + inc + ' inconnues' + chev + '</button>' : '') +
      (dou ? '<button type="button" class="tvar3-chip tvar3-cdou" data-ouvre="1">1 choisie à la saisie' + chev + '</button>' : '') +
      '<a class="tvar3-chip tvar3-creg" href="#reglages">Non assujetti' + chev + '</a></div></div>');
    // Les brassins de l'année, puis hors brassin, puis l'étranger à part
    h.push('<div class="tvar3-sh"><span>Par brassin</span><em>TVA · par litre</em></div>');
    var groupes = BRASSINS[an].map(function (b) { return { cle: b[0], b: b, l: deps.filter(function (l) { return l[4] === b[0]; }) }; });
    groupes.push({ cle: 0, l: deps.filter(function (l) { return l[4] === 0; }) });
    h.push('<div data-mots="lignes">');
    groupes.forEach(function (g) {
      var s = 0, n = 0; g.l.forEach(function (l) { var v = tva(l); if (v == null) n++; else s += v; });
      var tout = n === g.l.length;
      var nom = g.b ? '<b>#' + g.b[0] + ' ' + g.b[1] + '</b><small class="tvar3-m">' + g.b[2] + '</small>' : '<b>Hors brassin</b><small>matériel, nettoyage</small>';
      var parL = g.b && !tout ? '<small>' + fmt(s / g.b[3]) + '/L</small>' : '';
      h.push('<button type="button" class="tvar3-br" data-br="' + g.cle + '" aria-expanded="' + (ouvert === g.cle) + '" data-booster="brassin">' +
        '<span class="tvar3-ebc" style="background:' + (g.b ? g.b[4] : '#FFFFFF') + '"></span><span class="tvar3-nom">' + nom + '</span>' +
        '<span class="tvar3-perles">' + g.l.map(function (l) { return perle(l, dou && deps.indexOf(l) === DOUTE.i, false); }).join('') + '</span>' +
        '<span class="tvar3-som">' + (tout ? '<b class="tvar3-tir">—</b>' : '<b>' + fmt(s) + '</b>') + parL + '</span>' + chev + '</button>');
      if (ouvert === g.cle) h.push('<div class="tvar3-det" data-mots="lignes">' + g.l.map(function (l) { return ligne(l, dou && deps.indexOf(l) === DOUTE.i); }).join('') + '</div>');
    });
    h.push('</div>');
    if (etr) {
      h.push('<button type="button" class="tvar3-br" data-br="de" aria-expanded="' + (ouvert === 'de') + '" data-booster="etranger"><span class="tvar3-ebc" style="background:#FFFFFF"></span><span class="tvar3-nom"><b>Étranger</b><small>à part</small></span>' +
        '<span class="tvar3-perles"><span class="tvar3-pe tvar3-ede">DE 19 %</span></span><span class="tvar3-som"><b>' + ETR.mwst + '</b><small>EUR</small></span>' + chev + '</button>');
      if (ouvert === 'de') h.push('<div class="tvar3-det" data-mots="lignes"><div class="tvar3-li"><span class="tvar3-d tvar3-m">' + ETR.d + '</span><span class="tvar3-f">' + ETR.f + ' · <span class="tvar3-m">' + ETR.mont + ' EUR</span></span><span class="tvar3-pe tvar3-ede">MwSt</span><span class="tvar3-x">hors TVA suisse</span></div></div>');
    }
    // La balance : ce que je récupérerais, ce que je facturerais, le net ; hypothèses au toucher
    var fact = Math.round(VENTES[an] * 8.1 / 108.1 * 100) / 100, net = connu - fact, max = Math.max(connu, fact, 1);
    h.push('<section class="tvar3-bal" data-booster="si-balance"><h2><span>Si j\'étais assujetti</span><b class="tvar3-m">' + fmt(net) + '</b><small>CHF</small></h2>' +
      '<div class="tvar3-pl"><span>récupérée</span><span class="tvar3-jauge"><i style="width:' + (p26 / max * 100).toFixed(1) + '%;background:#6E9B5B"></i><i style="width:' + (p81 / max * 100).toFixed(1) + '%;background:#5B8FC4"></i></span><span class="tvar3-x tvar3-m">+' + fmt(connu) + '</span></div>' +
      '<div class="tvar3-pl"><span>facturée</span><span class="tvar3-jauge"><i style="width:' + (fact / max * 100).toFixed(1) + '%;background:#333333"></i></span><span class="tvar3-x tvar3-m">−' + fmt(fact) + '</span></div>' +
      '<details' + (etat === 'si' ? ' open' : '') + '><summary>Hypothèses' + bas + '</summary><ul><li>Ventes enregistrées ' + an + ' : <span class="tvar3-m">' + fmt(VENTES[an]) + ' CHF</span>, au taux normal 8,1 %</li>' +
      '<li>Méthode effective ; au taux de la dette fiscale nette, rien n\'est récupéré</li>' + (inc ? '<li>' + inc + ' dépenses à TVA inconnue non comptées</li>' : '') +
      '<li><a href="https://www.estv.admin.ch" target="_blank" rel="noopener">AFC, assujettissement ' + sortie + '</a></li></ul></details></section>');
    document.getElementById('tvar3-vue').innerHTML = h.join('');
    brancher();
  }
  function feuille() {
    var l = DEP[2026][DOUTE.i];
    document.getElementById('tvar3-feuille').innerHTML = '<div class="tvar3-fh"><b>' + l[1] + '</b><span class="tvar3-m">' + l[0] + '.2026</span><button class="tvar3-ib" type="button" data-ferme="1" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
      '<div class="tvar3-tuile"><div><b>' + DOUTE.lu + '</b><span>colonne MWST · lu</span></div><div class="tvar3-pris"><b>' + DOUTE.somme + '</b><span>choisie à la saisie</span></div><div><b>' + fmt(l[2]) + '</b><span>imprimé TTC</span></div>' +
      '<div class="tvar3-calc">' + fmt(l[2]) + ' × 2,6 / 102,6 = ' + DOUTE.somme + ' ≠ ' + DOUTE.lu + ' imprimé</div></div><a class="tvar3-fa" href="#facture">Ouvrir la facture' + chev + '</a>';
  }
  function brancher() {
    var z = document.getElementById('tvar3-vue');
    z.querySelectorAll('[data-br]').forEach(function (b) { b.addEventListener('click', function () { var k = b.getAttribute('data-br'); k = k === 'de' ? 'de' : Number(k); ouvert = ouvert === k ? null : k; rendre(); }); });
    z.querySelectorAll('[data-va="inc"]').forEach(function (b) { b.addEventListener('click', function () { var g = BRASSINS[an].map(function (x) { return x[0]; }).concat([0]); ouvert = g.find(function (k) { return DEP[an].some(function (l) { return l[4] === k && l[3] == null; }); }); rendre(); }); });
    z.querySelectorAll('[data-ouvre]').forEach(function (b) { b.addEventListener('click', function (e) { e.stopPropagation(); feuille(); document.body.classList.add('tvar3-ouvre'); }); });
  }
  document.getElementById('tvar3-voile').addEventListener('click', function () { document.body.classList.remove('tvar3-ouvre'); });
  document.getElementById('tvar3-feuille').addEventListener('click', function (e) { if (e.target.closest('[data-ferme]')) document.body.classList.remove('tvar3-ouvre'); });
  document.getElementById('tvar3-moins').addEventListener('click', function () { if (an > 2024) { an--; ouvert = null; rendre(); } });
  document.getElementById('tvar3-plus').addEventListener('click', function () { if (an < 2026) { an++; ouvert = null; rendre(); } });
  rendre();
})();
</script>
