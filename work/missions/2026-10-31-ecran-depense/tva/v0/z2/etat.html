 cli:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="6" r="2.5"/><path d="M2.5 15c0-2.5 2-4 4.5-4s4.5 1.5 4.5 4"/><circle cx="12.5" cy="6.5" r="2"/><path d="M13 11c1.8.3 3 1.6 3 4"/></svg>',
 plus:'<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" data-commun><path d="M10 4v12M4 10h12"/></svg>',
 x:'<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
 ext:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M9 3h4v4M13 3 7 9M11 9v4H3V5h4"/></svg>',
 nuage:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4.5 12.5A3 3 0 0 1 5 6.6a4 4 0 0 1 7.6 1.2A2.5 2.5 0 0 1 12 12.5z"/><path d="M2 2l12 12"/></svg>'
};
var QL=[['T1','janv.–mars'],['T2','avr.–juin'],['T3','juil.–sept.'],['T4','oct.–déc.']];
var ROW=function(S){return S.nconnu===0?'—':n2(S.tot);};
function coquille(){
 return '<header class="'+P+'hd"><span class="'+P+'logo"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2h7v3h2v6h-2v3H4z"/></svg></span><h1>L\'Affinée</h1>'+
  '<button class="'+P+'ib '+P+'nb" aria-label="Thème cave" data-role="theme">'+ic.lune+'</button><button class="'+P+'ib" aria-label="Rechercher" data-role="rechercher">'+ic.loupe+'</button><button class="'+P+'ib" aria-label="Aide" data-role="aide">'+ic.quoi+'</button></header>'+
  '<nav class="'+P+'tabs" role="tablist"><button role="tab">Synthèse</button><button role="tab">Opérations</button><button role="tab">Prévisions</button><button role="tab" aria-selected="true">Annuel</button></nav>';
}
function bas(){
 return '<nav class="'+P+'bas"><button>'+ic.bord+'Bord</button><button aria-current="page">'+ic.fin+'Finances</button><button class="'+P+'c1">'+ic.bra+'Brassins</button><button class="'+P+'c2">'+ic.sto+'Stocks</button><button>'+ic.cli+'Clients</button><button class="'+P+'fab" aria-label="Actions rapides" data-role="plus">'+ic.plus+'</button></nav>';
}
function barre(S,echelle){
 var w=function(v){return Math.max(v>0?3:0,Math.round(v/echelle*70))+'%';};
 var h='<span class="'+P+'bar" aria-hidden="true">';
 if(S.n===0)return h+'<i class="'+P+'vide"></i></span>';
 if(S.t2>0)h+='<i class="'+P+'s2" style="width:'+w(S.t2)+'"></i>';
 if(S.t8>0)h+='<i class="'+P+'s8" style="width:'+w(S.t8)+'"></i>';
 if(S.tdou>0)h+='<i class="'+P+'sdou" style="width:'+w(Math.max(S.tdou,echelle*0.04))+'"></i>';
 if(S.ninc>0)h+='<i class="'+P+'sinc">'+S.ninc+'?</i>';
 return h+'</span>';
}
function trimestres(){
 var h='<div class="'+P+'tri" data-booster="periode">';
 var ech=MAX*1.0;
 Q.forEach(function(S,i){
  h+='<button class="'+P+'q" data-q="'+(i+1)+'" aria-pressed="'+(periode===i+1)+'" data-role="periode"><span class="'+P+'ql"><b>'+QL[i][0]+'</b></span>'+barre(S,ech)+
   '<span class="'+P+'qv">'+ROW(S)+'</span></button>';
 });
 h+='<button class="'+P+'q '+P+'an" data-q="0" aria-pressed="'+(periode===0)+'" data-role="periode"><span class="'+P+'ql"><b>'+ANNEE+'</b></span>'+barre(AN,AN.tot||0.01)+
  '<span class="'+P+'qv">'+ROW(AN)+'</span></button>';
 if(AN.netr)h+='<button class="'+P+'etr" data-role="etrangere"><i></i>DE 19% <b>'+n2(AN.tetr)+'</b><span>hors CH</span></button>';
 h+='</div>';
 return h;
}
function detail(){
 var S=periode?Q[periode-1]:AN;
 var nom=periode?QL[periode-1][0]+' '+QL[periode-1][1]:String(ANNEE);
 var ventes=periode?VENTES[periode-1]:VENTES.reduce(function(a,b){return a+b;},0);
 var fact=tvaDe(ventes,8.1), net=S.tot-fact;
 var h='<div class="'+P+'det">';
 if(S.n===0){
  h+='<div class="'+P+'rep"><span class="'+P+'big">—<small> CHF</small></span><span>'+nom+' · aucune dépense</span></div>';
  h+='<div class="'+P+'videb"><span>Le cadre reste : les barres se remplissent dès la première facture.</span><button class="'+P+'bt '+P+'pri" data-role="plus">'+ic.plus+'Nouvelle dépense</button></div>';
  return h+'</div>';
 }
 h+='<div class="'+P+'rep"><span class="'+P+'big">'+n2(S.tot)+'<small> CHF</small></span><span>TVA payée'+(periode?' · '+nom:'')+(ETAT==='inconnues'?' · <b class="'+P+'part">total partiel</b>':'')+'</span></div>';
 h+='<button class="'+P+'si" data-booster="si-net" data-role="si"><span class="'+P+'sl">Si assujetti</span><span class="'+P+'chev">'+ic.chev+'</span>'+
  '<span class="'+P+'sv">'+n2(S.tot)+' − '+n2(fact)+' = <b'+(net>=0?' class="'+P+'pos"':'')+'>'+(net>=0?'+':'−')+n2(Math.abs(net))+'</b></span></button>';
 h+='<div class="'+P+'leg" data-booster="legende-taux">';
 h+='<span class="'+P+'lg"><i style="background:var(--red)"></i>2,6% <b>'+n2(S.t2)+'</b></span>';
 h+='<span class="'+P+'lg"><i style="background:var(--fin)"></i>8,1% <b>'+n2(S.t8)+'</b></span>';
 if(S.ndou)h+='<span class="'+P+'lg '+P+'ldou"><i></i>choisie <b>'+n2(S.tdou)+'</b></span>';
 if(S.ninc)h+='<span class="'+P+'lg '+P+'linc"><i></i>inconnue <b>'+S.ninc+'</b> · '+n2(S.ttcinc)+' CHF</span>';
 h+='</div>';
 var items=L.filter(function(x){return !periode||x.q===periode;});
 h+='<div class="'+P+'liste" data-mots="lignes">'+items.map(function(x){
  var tv=x.k==='inc'?'<span class="'+P+'tv '+P+'q">?</span>':'<span class="'+P+'tv">'+n2(x.tva)+'</span>';
  var tx=x.k==='inc'?'inconnue':x.k==='etr'?'DE 19 %':x.k==='dou'?'choisie':x.k==='2'?'2,6 %':'8,1 %';
  return '<button class="'+P+'li" data-role="facture"><span class="'+P+'d">'+x.d+'</span><span class="'+P+'f">'+x.f+' <small>· '+x.c+' · '+n2(x.ttc)+'</small></span><i class="'+P+'k '+P+'k'+x.k+'"></i><span class="'+P+'tx">'+tx+'</span>'+tv+'</button>';
 }).join('')+'</div>';
 return h+'</div>';
}
function reste(){
 return '<div class="'+P+'reste"><button>Compte de résultat '+ANNEE+'<span>'+ic.bas+'</span></button><button>Bilan<span>'+ic.bas+'</span></button><button>Clôture<span>'+ic.bas+'</span></button></div>';
}
function sheet(){
 if(!siOuvert)return '';
 var S=periode?Q[periode-1]:AN;
 var nom=periode?QL[periode-1][0]:'année '+ANNEE;
 var ventes=periode?VENTES[periode-1]:VENTES.reduce(function(a,b){return a+b;},0);
 var fact=tvaDe(ventes,8.1), net=S.tot-fact;
 return '<div class="'+P+'voile" data-role="voile"><div class="'+P+'sheet" role="dialog" aria-label="Si j\'étais assujetti"><header><b>Si j\'étais assujetti · '+nom+'</b><button class="'+P+'ib" aria-label="Fermer" data-role="fermer">'+ic.x+'</button></header>'+
  '<div class="'+P+'calc"><span>TVA payée sur mes achats (récupérée)</span><b>'+n2(S.tot)+'</b><span>TVA facturée sur mes ventes enregistrées</span><b>− '+n2(fact)+'</b><span class="'+P+'net">Net</span><b class="'+P+'net">'+(net>=0?'+':'−')+n2(Math.abs(net))+' CHF</b></div>'+
  '<div class="'+P+'hyp"><div>Ventes enregistrées <b class="'+P+'m">'+n2(ventes)+' CHF</b> TTC, au taux normal <b>8,1 %</b></div><div>Méthode effective ; la méthode TDFN ne récupère rien</div>'+(S.ninc?'<div>Les <b>'+S.ninc+'</b> factures sans TVA lue ne sont pas comptées</div>':'')+'<div>Aujourd\'hui : <b>non assujetti</b> (réglage de l\'app)</div></div>'+
  '<a class="'+P+'lien" href="https://www.estv.admin.ch/estv/fr/accueil/taxe-sur-la-valeur-ajoutee.html" target="_blank" rel="noopener">'+ic.ext+'AFC · assujettissement<small>estv.admin.ch</small></a></div></div>';
}
function rendu(){
 var app=document.getElementById(P+'app');
 var hors=ETAT==='horsligne'?'<div class="'+P+'hl">'+ic.nuage+'<b>Hors ligne</b> · lu sur l\'appareil, <b>'+L.length+'</b> factures</div>':'';
 app.innerHTML=coquille()+'<div class="'+P+'corps">'+
  '<div class="'+P+'titre"><h2>Bilan et impôts</h2><div class="'+P+'per" data-booster="annee"><button aria-label="Année précédente" data-role="per-moins">'+ic.g+'</button><b>'+ANNEE+'</b><button aria-label="Année suivante" data-role="per-plus">'+ic.d+'</button></div></div>'+
  hors+
  '<div class="'+P+'sh"><button class="'+P+'st" data-booster="statut" data-role="reglage"><i></i>Non assujetti · réglage</button></div>'+
  trimestres()+detail()+reste()+'</div>'+bas()+sheet();
 brancher();
}
function brancher(){
 var app=document.getElementById(P+'app');
 app.querySelectorAll('[data-role="periode"]').forEach(function(b){b.addEventListener('click',function(){periode=Number(b.getAttribute('data-q'));rendu();});});
 app.querySelectorAll('[data-role="si"]').forEach(function(b){b.addEventListener('click',function(){siOuvert=true;rendu();});});
 app.querySelectorAll('[data-role="fermer"],[data-role="voile"]').forEach(function(b){b.addEventListener('click',function(e){if(e.target===b||b.getAttribute('data-role')==='fermer'){siOuvert=false;rendu();}});});
 app.querySelectorAll('[data-role="per-moins"],[data-role="per-plus"]').forEach(function(b){b.addEventListener('click',function(){ANNEE+=b.getAttribute('data-role')==='per-plus'?1:-1;rendu();});});
}
rendu();
})();
</script></body></html>
