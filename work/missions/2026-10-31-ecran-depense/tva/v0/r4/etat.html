  var etat = new URLSearchParams(location.search).get('etat') || 'annee';
  var an = etat === 'inconnues' ? 2025 : etat === 'vide' ? 2024 : 2026;
  var mois = null, filtre = null, siOuvert = etat === 'si';
  if (etat === 'horsligne') document.body.classList.add('tvar4-off');

  function fmt(n) { var s = Math.abs(n).toFixed(2).split('.'); return (n < 0 ? '−' : '') + s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ',' + s[1]; }
  function tva(l) { return l[4] == null || l[4] === 'de' ? null : Math.round(l[3] * l[4] / (100 + l[4]) * 100) / 100; }
  function tx(t) { return String(t).replace('.', ',') + ' %'; }
  function mo(l) { return Number(l[0].slice(3, 5)) - 1; }
  function pa(t, txt) { return '<span class="tvar4-pa ' + (t === 2.6 ? 'tvar4-p26' : t === 8.1 ? 'tvar4-p81' : t === 'de' ? 'tvar4-pde' : 'tvar4-pin') + '">' + txt + '</span>'; }
  var chev = '<svg class="tvar4-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  var gau = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
  var bas = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5714" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  var sortie = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5714" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';

  function rendre() {
    var etr = etat === 'etrangere' && an === 2026, dou = etat === 'douteuse' && an === 2026;
    var deps = DEP[an].slice();
    if (etr) deps.push(ETR);
    var g = { 2.6: 0, 8.1: 0, inc: 0, ttcInc: 0, ttcCon: 0 };
    deps.forEach(function (l) { if (l[4] === 'de') return; var v = tva(l); if (v == null) { g.inc++; g.ttcInc += l[3]; } else { g[l[4]] += v; g.ttcCon += l[3]; } });
    var total = g[2.6] + g[8.1], h = [];
    h.push('<div class="tvar4-recap" data-booster="recap">');
    h.push('<div class="tvar4-rc1"><span class="tvar4-an"><button type="button" data-an="-1" aria-label="Année précédente"' + (an <= 2024 ? ' disabled' : '') + '>' + gau + '</button><b>TVA ' + an + '</b>' +
      '<button type="button" data-an="1" aria-label="Année suivante"' + (an >= 2026 ? ' disabled' : '') + '>' + chev + '</button></span>' + (g.inc ? '<span class="tvar4-mn">au moins</span>' : '') +
      '<span class="tvar4-am tvar4-m' + (g.ttcInc > (g.ttcInc + g.ttcCon) / 2 ? ' tvar4-flou' : '') + '">' + fmt(total) + '<small>CHF</small></span></div>');
    if (deps.length) {
      var k = [];
      if (g[2.6]) k.push('<button type="button" class="tvar4-k" data-f="2.6" aria-pressed="' + (filtre === '2.6') + '" data-booster="renvoi-taux">' + pa(2.6, tx(2.6)) + '<span class="tvar4-m">' + fmt(g[2.6]) + '</span></button>');
      if (g[8.1]) k.push('<button type="button" class="tvar4-k" data-f="8.1" aria-pressed="' + (filtre === '8.1') + '">' + pa(8.1, tx(8.1)) + '<span class="tvar4-m">' + fmt(g[8.1]) + '</span></button>');
      if (g.inc) k.push('<button type="button" class="tvar4-k tvar4-kinc" data-f="inc" aria-pressed="' + (filtre === 'inc') + '" data-booster="inconnues">? ' + g.inc + '</button>');
      if (dou) k.push('<button type="button" class="tvar4-k tvar4-kdou" data-ouvre="1" data-booster="douteuse">1 choisie à la saisie</button>');
      if (etr) k.push('<button type="button" class="tvar4-k tvar4-kde" data-f="de" aria-pressed="' + (filtre === 'de') + '" data-booster="etranger">DE à part</button>');
      h.push('<div class="tvar4-rc2">' + k.join('') + '</div>');
    }
    h.push('<div class="tvar4-rc3"><a class="tvar4-non" href="#reglages" data-booster="statut-reglage">Non remboursée' + chev.replace('tvar4-chev', 'tvar4-chevb') + '</a>' +
      '<button type="button" class="tvar4-si" id="tvar4-si" aria-expanded="' + siOuvert + '" data-booster="si-seuil">Si assujetti' + bas + '</button></div>');
    var pc = Math.min(100, VENTES[an] / 1000);
    h.push('<div class="tvar4-sip' + (siOuvert ? ' tvar4-vu' : '') + '"><div class="tvar4-seuil"><span>Ventes ' + an + '</span><span class="tvar4-m">' + fmt(VENTES[an]) + ' / 100 000 CHF</span><span class="tvar4-j"><i style="width:' + pc.toFixed(1) + '%"></i></span></div>' +
      '<a href="https://www.estv.admin.ch" target="_blank" rel="noopener"><span>AFC, assujettissement</span>' + sortie + '</a><a href="#fiduciaire"><span>Demander à ma fiduciaire</span>' + chev + '</a></div>');
    h.push('</div>');
    if (!deps.length) {
      h.push('<div class="tvar4-vide"><span>Aucune dépense en ' + an + '.</span><a href="#nouvelle">Saisir une dépense' + chev + '</a></div>');
      document.getElementById('tvar4-vue').innerHTML = h.join(''); brancher(); return;
    }
    // Frise des 12 mois : chaque colonne empilée par taux, l'inconnu en case hachurée ; un toucher choisit le mois
    var parMois = MOIS.map(function () { return { a: 0, b: 0, i: 0, n: 0 }; });
    deps.forEach(function (l) { var x = parMois[mo(l)]; x.n++; if (l[4] === 'de') return; var v = tva(l); if (v == null) x.i++; else if (l[4] === 2.6) x.a += v; else x.b += v; });
    var max = Math.max.apply(null, parMois.map(function (x) { return x.a + x.b; }).concat([1]));
    h.push('<div class="tvar4-frise" data-booster="frise-mois">');
    parMois.forEach(function (x, i) {
      var fut = an === 2026 && i >= 10;
      var c = (x.i ? '<i class="tvar4-cin"></i>' : '') + (x.b ? '<i class="tvar4-c81" style="height:' + Math.max(2, Math.round(x.b / max * 36)) + 'px"></i>' : '') + (x.a ? '<i class="tvar4-c26" style="height:' + Math.max(2, Math.round(x.a / max * 36)) + 'px"></i>' : '') + (!x.n ? '<i class="tvar4-c0"></i>' : '');
      h.push('<button type="button" class="tvar4-mo' + (fut ? ' tvar4-fut' : '') + '" data-mo="' + i + '" aria-pressed="' + (mois === i) + '" aria-label="' + MOIS[i] + '"><span class="tvar4-c">' + c + '</span><b>' + MOIS[i].charAt(0).toUpperCase() + '</b></button>');
    });
    h.push('</div>');
    // Le journal, groupé par mois, du plus récent au plus ancien ; une pastille TVA sur chaque dépense
    var vis = deps.filter(function (l) {
      if (mois != null && mo(l) !== mois) return false;
      if (!filtre) return true;
      if (filtre === 'inc') return l[4] == null;
      return String(l[4]) === filtre;
    }).reverse();
    h.push('<div data-mots="lignes">');
    if (mois != null || filtre) h.push('<div class="tvar4-mh"><span>' + (mois != null ? MOIS[mois] : 'toute l\'année') + (filtre ? ', ' + (filtre === 'inc' ? 'TVA inconnue' : filtre === 'de' ? 'étranger' : 'à ' + tx(filtre)) : '') + '</span><button type="button" data-tout="1">Tout</button></div>');
    var cour = -1;
    vis.forEach(function (l) {
      var m = mo(l);
      if (m !== cour) {
        cour = m;
        var s = 0, q = 0, c = 0; vis.forEach(function (o) { if (mo(o) === m && o[4] !== 'de') { var v = tva(o); if (v != null) { s += v; c++; } else q++; } });
        h.push('<div class="tvar4-mh"><span>' + MOIS[m].charAt(0).toUpperCase() + MOIS[m].slice(1) + '</span><span class="tvar4-m" style="flex:0">' + (q && !c ? '—' : (q ? '≥ ' : '') + fmt(s)) + '</span></div>');
      }
      var v = tva(l), d = dou && DEP[an].indexOf(l) === DOUTE.i;
      var p = l[4] === 'de' ? pa('de', 'DE 19 %') : v == null ? pa(null, '?') : pa(l[4], tx(l[4]));
      h.push('<button type="button" class="tvar4-li' + (d ? ' tvar4-ldou' : '') + '"' + (d ? ' data-ouvre="1"' : '') + '><span class="tvar4-f"><b>' + l[1] + '</b><small>' + l[0] + ' · ' + l[2] + '</small></span>' +
        '<span class="tvar4-tt tvar4-m">' + (typeof l[3] === 'number' ? fmt(l[3]) : l[3]) + '</span>' + p + '<span class="tvar4-x tvar4-m' + (v == null ? ' tvar4-tir' : '') + '">' + (l[4] === 'de' ? 'à part' : v == null ? '—' : fmt(v)) + '</span></button>');
    });
    h.push('</div>');
    document.getElementById('tvar4-vue').innerHTML = h.join('');
    brancher();
  }
  function feuille() {
    var l = DEP[2026][DOUTE.i];
    document.getElementById('tvar4-feuille').innerHTML = '<div class="tvar4-fh"><b>' + l[1] + '</b><span class="tvar4-m">' + l[0] + '.2026</span><button class="tvar4-ib" type="button" data-ferme="1" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
      '<div class="tvar4-tuile"><div><b>' + DOUTE.lu + '</b><span>colonne MWST · lu</span></div><div class="tvar4-pris"><b>' + DOUTE.somme + '</b><span>choisie à la saisie</span></div><div><b>' + fmt(l[3]) + '</b><span>imprimé TTC</span></div>' +
      '<div class="tvar4-calc">' + fmt(l[3]) + ' × 2,6 / 102,6 = ' + DOUTE.somme + ' ≠ ' + DOUTE.lu + ' imprimé</div></div><a class="tvar4-fa" href="#facture">Ouvrir la facture' + chev + '</a>';
  }
  function brancher() {
    var z = document.getElementById('tvar4-vue');
    z.querySelectorAll('[data-f]').forEach(function (b) { b.addEventListener('click', function () { var f = b.getAttribute('data-f'); filtre = filtre === f ? null : f; rendre(); }); });
    z.querySelectorAll('[data-mo]').forEach(function (b) { b.addEventListener('click', function () { var m = Number(b.getAttribute('data-mo')); mois = mois === m ? null : m; rendre(); }); });
    z.querySelectorAll('[data-an]').forEach(function (b) { b.addEventListener('click', function () { an += Number(b.getAttribute('data-an')); mois = null; filtre = null; rendre(); }); });
    z.querySelectorAll('[data-tout]').forEach(function (b) { b.addEventListener('click', function () { mois = null; filtre = null; rendre(); }); });
    z.querySelectorAll('[data-ouvre]').forEach(function (b) { b.addEventListener('click', function (e) { e.stopPropagation(); feuille(); document.body.classList.add('tvar4-ouvre'); }); });
    var s = document.getElementById('tvar4-si'); if (s) s.addEventListener('click', function () { siOuvert = !siOuvert; rendre(); });
  }
  document.getElementById('tvar4-voile').addEventListener('click', function () { document.body.classList.remove('tvar4-ouvre'); });
  document.getElementById('tvar4-feuille').addEventListener('click', function (e) { if (e.target.closest('[data-ferme]')) document.body.classList.remove('tvar4-ouvre'); });
  rendre();
})();
</script>
