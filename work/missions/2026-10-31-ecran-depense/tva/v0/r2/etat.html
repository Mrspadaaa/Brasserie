<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>r2 — TVA : la carte de Synthèse qui s'ouvre, par trimestre, en barre par taux (tiède, 01.11)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--tvar2-page:#FFFFFF;--tvar2-pan:#F5F5F5;--tvar2-sur:#EBEBEB;--tvar2-bord:#DDDDDD;--tvar2-bordm:#BFBFBF;--tvar2-t2:#666666;--tvar2-t1:#333333;--tvar2-t0:#111111;
--tvar2-fin:#1F64A3;--tvar2-red:#3F6B2E;--tvar2-redc:#6E9B5B;--tvar2-nor:#1F64A3;--tvar2-norc:#5B8FC4;--tvar2-att:#7F5B10;--tvar2-attf:#FBF3E2;--tvar2-attb:#9C7020;--tvar2-ven:#255633;
--tvar2-sans:"Source Sans 3",system-ui,sans-serif;--tvar2-mono:"IBM Plex Mono",ui-monospace,monospace;
--tvar2-hach:repeating-linear-gradient(135deg,#F3E2BD 0 5px,#FFFFFF 5px 9px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--tvar2-page);color:var(--tvar2-t1);font-family:var(--tvar2-sans);font-size:14px;line-height:1.3;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:var(--tvar2-fin);text-decoration:none}
::selection{background:#CFE0F1}
:focus-visible{outline:2px solid var(--tvar2-t0);outline-offset:2px}
.tvar2-m{font-family:var(--tvar2-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
svg{flex:none}
.tvar2-hd{position:sticky;top:0;z-index:6;background:var(--tvar2-page);border-bottom:1px solid var(--tvar2-bord);height:44px;display:flex;align-items:center;gap:8px;padding:0 8px}
.tvar2-logo{width:32px;height:32px;border-radius:10px;background:#111;display:flex;align-items:center;justify-content:center}
.tvar2-hd b{flex:1;font-size:16px;font-weight:600;color:var(--tvar2-t0)}
.tvar2-ib{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--tvar2-t1)}
.tvar2-ib.tvar2-f{background:var(--tvar2-sur);border:1px solid var(--tvar2-bordm)}
.tvar2-main{max-width:872px;margin:0 auto;padding:0 12px 76px}
.tvar2-tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--tvar2-bordm)}
.tvar2-tabs a{height:34px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--tvar2-t1);border-bottom:2px solid transparent}
.tvar2-tabs a[aria-current]{color:var(--tvar2-fin);border-bottom-color:var(--tvar2-fin);background:#F1F5FA;font-weight:600}
.tvar2-hl{display:none;align-items:center;gap:6px;min-height:28px;margin-top:6px;padding:0 8px;border-radius:10px;background:var(--tvar2-pan);border:1px solid var(--tvar2-bord);font-size:13px}
.tvar2-off .tvar2-hl{display:flex}
/* Tête de la vue ouverte depuis la carte */
.tvar2-tete{display:flex;align-items:center;gap:6px;min-height:44px;border-bottom:1px solid var(--tvar2-bord)}
.tvar2-retour{display:flex;align-items:center;gap:2px;height:32px;padding:0 6px 0 0;font-size:14px;color:var(--tvar2-fin)}
.tvar2-tete h1{font-size:16px;font-weight:600;color:var(--tvar2-t0)}
.tvar2-reg{margin-left:auto;display:inline-flex;align-items:center;gap:2px;height:28px;padding:0 8px;border-radius:10px;border:1px solid var(--tvar2-bordm);font-size:13px;color:var(--tvar2-fin)}
/* Période : quatre trimestres en colonnes, et l'année */
.tvar2-per{display:flex;align-items:flex-end;gap:6px;padding:8px 0 6px}
.tvar2-an{display:flex;flex-direction:column;align-items:center;gap:2px;margin-right:2px}
.tvar2-an span{font-family:var(--tvar2-mono);font-size:14px;color:var(--tvar2-t0)}
.tvar2-an div{display:flex}
.tvar2-an button{width:26px;height:26px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.tvar2-an button:disabled{color:var(--tvar2-bordm);cursor:default}
.tvar2-q{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px 3px;border-radius:10px;border:1px solid transparent;min-width:0}
.tvar2-q[aria-pressed="true"]{border-color:var(--tvar2-t0);background:var(--tvar2-pan)}
.tvar2-col{height:52px;width:26px;display:flex;flex-direction:column;justify-content:flex-end;gap:1px}
.tvar2-col i{display:block;width:100%}
.tvar2-col .tvar2-c26{background:var(--tvar2-redc)}.tvar2-col .tvar2-c81{background:var(--tvar2-norc)}
.tvar2-col .tvar2-cin{background:var(--tvar2-hach);border:1px dashed var(--tvar2-attb);font-style:normal;font-family:var(--tvar2-mono);font-size:12px;color:var(--tvar2-att);text-align:center;line-height:14px;height:16px}
.tvar2-q b{font-size:13px;font-weight:600;color:var(--tvar2-t1)}
.tvar2-q[aria-pressed="true"] b{color:var(--tvar2-t0)}
/* La réponse */
.tvar2-rep{display:flex;align-items:center;gap:8px;min-height:36px;border-top:1px solid var(--tvar2-bord);font-size:14px}
.tvar2-rep span{flex:1}
.tvar2-rep strong{font-size:16px;color:var(--tvar2-t0)}
.tvar2-tot{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;padding:6px 0 8px}
.tvar2-tot .tvar2-pl{font-size:14px;font-weight:600;color:var(--tvar2-t0);margin-right:auto}
.tvar2-tot .tvar2-mn{font-size:13px;color:var(--tvar2-t2)}
.tvar2-tot .tvar2-am{font-size:28px;font-weight:600;color:var(--tvar2-t0);line-height:1}
.tvar2-tot .tvar2-am small{font-size:14px;font-weight:500;margin-left:4px}
.tvar2-tot .tvar2-am.tvar2-flou{color:var(--tvar2-att);text-decoration:underline dashed 2px;text-underline-offset:6px}
.tvar2-ch{display:flex;gap:4px;flex-basis:100%;justify-content:flex-end}
.tvar2-inc,.tvar2-dou{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border-radius:10px;border:1px dashed var(--tvar2-attb);color:var(--tvar2-att);font-size:13px;font-weight:600}
.tvar2-inc{background:var(--tvar2-hach)}.tvar2-dou{background:var(--tvar2-attf)}
/* La barre empilée : ce qui a été dépensé, par taux */
.tvar2-barre{display:flex;height:28px;border-radius:10px;overflow:hidden;border:1px solid var(--tvar2-bordm);background:#FFFFFF}
.tvar2-barre button{height:100%;min-width:6px;border-right:2px solid #FFFFFF}
.tvar2-barre button:last-child,.tvar2-barre span:last-child{border-right:0}
.tvar2-barre span{border-right:2px solid #FFFFFF}
.tvar2-barre .tvar2-b26{background:var(--tvar2-redc)}.tvar2-barre .tvar2-b81{background:var(--tvar2-norc)}
.tvar2-barre .tvar2-bin{background:var(--tvar2-hach)}.tvar2-barre .tvar2-bde{background:repeating-linear-gradient(90deg,#FFFFFF 0 3px,#DDDDDD 3px 4px)}
.tvar2-barre button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--tvar2-t0)}
.tvar2-leg{margin-top:6px}
.tvar2-lh,.tvar2-lr{display:grid;grid-template-columns:58px 1fr 92px 84px 16px;align-items:center;gap:6px}
.tvar2-lh{font-size:12px;color:var(--tvar2-t2);min-height:20px}
.tvar2-lh span:nth-child(3),.tvar2-lh span:nth-child(4){text-align:right}
.tvar2-lr{min-height:40px;border-bottom:1px solid var(--tvar2-bord);width:100%;font-size:14px}
.tvar2-lr[aria-pressed="true"]{background:var(--tvar2-pan)}
.tvar2-lr .tvar2-n{font-size:13px;color:var(--tvar2-t2)}
.tvar2-lr .tvar2-r{text-align:right;color:var(--tvar2-t1)}
.tvar2-lr .tvar2-v{text-align:right;color:var(--tvar2-t0);font-weight:600}
.tvar2-lr .tvar2-v.tvar2-tir{color:var(--tvar2-att)}
.tvar2-pa{display:inline-flex;align-items:center;justify-content:center;min-width:54px;height:24px;padding:0 6px;border-radius:10px;font-family:var(--tvar2-mono);font-size:13px;font-weight:600}
.tvar2-p26{background:var(--tvar2-red);color:#FFFFFF}.tvar2-p81{background:var(--tvar2-nor);color:#FFFFFF}
.tvar2-pin{border:1px dashed var(--tvar2-attb);color:var(--tvar2-att);background:var(--tvar2-hach)}
.tvar2-pde{border:1px solid var(--tvar2-t0);color:var(--tvar2-t0);background:#FFFFFF}
.tvar2-chev{color:var(--tvar2-t2)}
/* Le net, si assujetti */
.tvar2-si{margin-top:8px;border:1px solid var(--tvar2-bordm);border-radius:16px;padding:0 10px}
.tvar2-si summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:44px;cursor:pointer}
.tvar2-si summary::-webkit-details-marker{display:none}
.tvar2-si summary .tvar2-st{flex:1;font-size:14px;font-weight:600;color:var(--tvar2-t0)}
.tvar2-si summary .tvar2-net{font-size:16px;font-weight:600;color:var(--tvar2-t0)}
.tvar2-si[open] summary svg{transform:rotate(180deg)}
.tvar2-eq{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:4px 0 8px;border-top:1px solid var(--tvar2-bord);font-size:14px}
.tvar2-eq .tvar2-x{text-align:right}
.tvar2-eq .tvar2-tt{border-top:1px solid var(--tvar2-t0);padding-top:4px;font-weight:600;color:var(--tvar2-t0)}
.tvar2-hyp{font-size:13px;color:var(--tvar2-t1);padding:0 0 8px;display:flex;flex-direction:column;gap:3px}
.tvar2-hyp li{list-style:none;padding-left:12px;position:relative}
.tvar2-hyp li::before{content:"";position:absolute;left:2px;top:7px;width:4px;height:4px;border-radius:50%;background:var(--tvar2-t2)}
.tvar2-hyp a{display:inline-flex;align-items:center;gap:4px;min-height:28px;font-weight:600}
/* Dépenses de la période */
.tvar2-dh{display:flex;align-items:center;min-height:32px;margin-top:10px;font-size:14px;font-weight:600;color:var(--tvar2-t0);border-bottom:1px solid var(--tvar2-bordm)}
.tvar2-dh span{flex:1}
.tvar2-dh button{font-size:13px;font-weight:400;color:var(--tvar2-fin);height:28px}
.tvar2-li{display:grid;grid-template-columns:42px 1fr 64px 52px;align-items:center;gap:6px;min-height:34px;border-bottom:1px solid var(--tvar2-bord);font-size:13px;width:100%}
.tvar2-li .tvar2-d{color:var(--tvar2-t2)}
.tvar2-li .tvar2-f{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tvar2-li .tvar2-pa{min-width:58px;height:22px;font-size:12px}
.tvar2-li .tvar2-x{text-align:right;color:var(--tvar2-t0)}
.tvar2-li.tvar2-ldou{background:var(--tvar2-attf)}
.tvar2-vide{padding:14px 0;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--tvar2-bord)}
.tvar2-vide a{font-weight:600;display:inline-flex;align-items:center;gap:4px}
/* Synthèse (geste retour) : la carte TVA parmi les rangées de l'app */
.tvar2-syn .tvar2-sr{display:flex;align-items:center;gap:8px;min-height:48px;border-bottom:1px solid var(--tvar2-bord);font-size:14px;width:100%}
.tvar2-syn .tvar2-sr div{flex:1}
.tvar2-syn .tvar2-sr small{display:block;font-size:12px;color:var(--tvar2-t2)}
.tvar2-carte{display:block;width:100%;border:1px solid var(--tvar2-bordm);border-radius:16px;padding:8px 10px;margin:8px 0}
.tvar2-carte .tvar2-c1{display:flex;align-items:baseline;gap:6px}
.tvar2-carte .tvar2-c1 b{flex:1;font-size:14px;color:var(--tvar2-t0)}
.tvar2-carte .tvar2-barre{height:10px;margin-top:6px}
.tvar2-feuille{display:none;position:fixed;left:0;right:0;bottom:0;max-width:872px;margin:0 auto;background:#FFFFFF;border-radius:24px 24px 0 0;z-index:21;padding:8px 12px 16px;box-shadow:0 -6px 24px rgba(0,0,0,.18)}
.tvar2-voile{display:none;position:fixed;inset:0;background:rgba(17,17,17,.35);z-index:20}
.tvar2-ouvre .tvar2-feuille,.tvar2-ouvre .tvar2-voile{display:block}
.tvar2-fh{display:flex;align-items:center;gap:8px;min-height:40px}
.tvar2-fh b{flex:1;font-size:16px;color:var(--tvar2-t0)}
.tvar2-tuile{border:2px solid var(--tvar2-t0);border-radius:16px;padding:8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.tvar2-tuile div{border:1px solid var(--tvar2-bord);border-radius:10px;padding:6px 8px}
.tvar2-tuile div b{display:block;font-family:var(--tvar2-mono);font-size:22px;color:var(--tvar2-t0)}
.tvar2-tuile div span{font-size:12px;color:var(--tvar2-t2)}
.tvar2-tuile div.tvar2-pris{background:#EAF2E6;border-color:#6E9B5B}
.tvar2-tuile .tvar2-calc{grid-column:1/-1;border:0;padding:2px 0 0;font-size:12px;color:var(--tvar2-t1)}
.tvar2-fa{display:flex;align-items:center;gap:6px;min-height:40px;margin-top:8px;font-weight:600}
.tvar2-nav{position:fixed;left:0;right:0;bottom:0;height:52px;background:#F7F7F7;border-top:1px solid var(--tvar2-bord);display:flex;justify-content:center;padding-right:76px;z-index:8}
.tvar2-nav a{flex:0 1 62px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--tvar2-t1)}
.tvar2-nav a[aria-current]{background:#E1E9F2;color:var(--tvar2-t0);box-shadow:inset 0 2px 0 var(--tvar2-fin)}
.tvar2-fab{position:fixed;right:8px;bottom:4px;width:64px;height:44px;border-radius:22px;background:#111;color:#FFF;display:flex;align-items:center;justify-content:center;z-index:9}
@media (min-width:900px){.tvar2-nav{padding-right:0}.tvar2-nav a{flex-basis:90px}.tvar2-fab{right:12px}
 .tvar2-vue{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;align-items:start}.tvar2-vue>.tvar2-tete,.tvar2-vue>.tvar2-per{grid-column:1/-1}.tvar2-gauche{grid-column:1;grid-row:3}.tvar2-droite{grid-column:2;grid-row:3}}
</style></head>

      ['11.03','Matériel Exemple SA','Matériel',845.00,null],['02.04','Malterie Fictive SA','Malts',512.80,null],['02.04','Houblons du Jura Sàrl','Houblons',201.10,null],
      ['24.04','Quincaillerie Démo','Matériel',38.60,null],['15.05','Malterie Fictive SA','Malts',476.20,null],['15.05','Levures Démo Sàrl','Levures',58.00,null],
      ['03.06','Droguerie Démo SA','Nettoyage',91.40,null],['26.06','Malterie Fictive SA','Malts',530.90,null],['26.06','Houblons du Jura Sàrl','Houblons',187.70,null],
      ['14.07','Marché Fictif','Autres frais',27.50,null],['06.08','Malterie Fictive SA','Malts',498.30,null],['06.08','Houblons du Jura Sàrl','Houblons',214.00,null],
      ['28.08','Matériel Exemple SA','Matériel',129.00,null],['17.09','Malterie Fictive SA','Malts',521.60,null],['17.09','Houblons du Jura Sàrl','Houblons',176.90,null],
      ['02.10','Droguerie Démo SA','Nettoyage',64.80,null],['21.10','Quincaillerie Démo','Matériel',19.90,null],['29.10','Levures Démo Sàrl','Levures',61.00,null],
      ['14.11','Malterie Fictive SA','Malts',520.00,2.6],['14.11','Houblons du Jura Sàrl','Houblons',176.00,2.6],['02.12','Droguerie Démo SA','Nettoyage',88.40,8.1],
      ['10.12','Malterie Fictive SA','Malts',498.00,2.6],['10.12','Houblons du Jura Sàrl','Houblons',152.30,2.6],['19.12','Matériel Exemple SA','Matériel',212.00,8.1]],
    2024: []
  };
  // Ventes enregistrées (fictives), TTC, au taux normal, par trimestre
  var VENTES = { 2026: [2140, 2860, 3120, 1740], 2025: [1200, 1900, 2400, 1920], 2024: [0, 0, 0, 0] };
  var DOUTE = { an: 2026, i: 13, lu: '4,21', somme: '6,12' };
  var ETR = { d: '08.06', f: 'Inox Demo GmbH', mont: 1180, mwst: '188,40' };

  var etat = new URLSearchParams(location.search).get('etat') || 'annee';
  var an = etat === 'inconnues' ? 2025 : etat === 'vide' ? 2024 : 2026;
  var per = { annee: 4, inconnues: 'A', douteuse: 3, etrangere: 2, vide: 'A', si: 4, horsligne: 4 }[etat] || 4;
  var filtre = null, ecran = 'vue';
  if (etat === 'horsligne') document.body.classList.add('tvar2-off');

  function fmt(n) { var s = Math.abs(n).toFixed(2).split('.'); return (n < 0 ? '−' : '') + s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ',' + s[1]; }
  function tva(l) { return l[4] == null ? null : Math.round(l[3] * l[4] / (100 + l[4]) * 100) / 100; }
  function trim(l) { return Math.ceil(Number(l[0].slice(3, 5)) / 3); }
  function taux(t) { return String(t).replace('.', ',') + ' %'; }
  function pa(t, txt) { return '<span class="tvar2-pa ' + (t === 2.6 ? 'tvar2-p26' : t === 8.1 ? 'tvar2-p81' : t === 'de' ? 'tvar2-pde' : 'tvar2-pin') + '">' + txt + '</span>'; }
  var chev = '<svg class="tvar2-chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  var gau = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
  var bas = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  var sortie = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5714" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';

  function bilan(lignes) {
    var g = { 2.6: { n: 0, v: 0, ttc: 0 }, 8.1: { n: 0, v: 0, ttc: 0 }, inc: { n: 0, ttc: 0 } };
    lignes.forEach(function (l) { var v = tva(l); if (v == null) { g.inc.n++; g.inc.ttc += l[3]; } else { var x = g[l[4]]; x.n++; x.v += v; x.ttc += l[3]; } });
    g.total = g[2.6].v + g[8.1].v;
    return g;
  }
  function dePeriode(a, p) { return D[a].filter(function (l) { return p === 'A' || trim(l) === p; }); }
  function avecEtr(a, p) { return etat === 'etrangere' && a === 2026 && (p === 'A' || p === 2); }

  function barre(g, etr, actif, statique) {
    var tot = g[2.6].ttc + g[8.1].ttc + g.inc.ttc + (etr ? ETR.mont : 0);
    if (!tot) return '';
    var seg = function (cle, val, cls) { if (!val) return ''; if (statique) return '<span class="' + cls + '" style="height:100%;flex:' + val.toFixed(2) + '"></span>'; return '<button type="button" class="' + cls + '" style="flex:' + val.toFixed(2) + '" data-filtre="' + cle + '" aria-pressed="' + (actif === cle) + '" aria-label="' + cle + '"></button>'; };
    return '<div class="tvar2-barre" data-booster="barre-taux">' + seg('2.6', g[2.6].ttc, 'tvar2-b26') + seg('8.1', g[8.1].ttc, 'tvar2-b81') + seg('inc', g.inc.ttc, 'tvar2-bin') + (etr ? seg('de', ETR.mont, 'tvar2-bde') : '') + '</div>';
  }

  function vue() {
    var lignes = dePeriode(an, per), g = bilan(lignes), etr = avecEtr(an, per);
    var dou = etat === 'douteuse' && an === DOUTE.an && (per === 'A' || per === 3);
    var h = [];
    h.push('<div class="tvar2-tete"><button type="button" class="tvar2-retour" id="tvar2-retour" data-booster="carte-retour">' + gau + 'Synthèse</button><h1>TVA</h1>' +
      '<a class="tvar2-reg" href="#reglages" data-booster="statut-reglage">Non assujetti' + chev + '</a></div>');
    // Période : ‹ année › puis T1…T4 en colonnes empilées, et l'année entière
    var qs = [1, 2, 3, 4].map(function (q) { return bilan(dePeriode(an, q)); });
    var max = Math.max.apply(null, qs.map(function (x) { return x.total; }).concat([1]));
    var col = function (x) {
      var h26 = Math.round(x[2.6].v / max * 34), h81 = Math.round(x[8.1].v / max * 34);
      return '<span class="tvar2-col">' + (x.inc.n ? '<i class="tvar2-cin">' + x.inc.n + '</i>' : '') + (h81 ? '<i class="tvar2-c81" style="height:' + h81 + 'px"></i>' : '') + (h26 ? '<i class="tvar2-c26" style="height:' + h26 + 'px"></i>' : '') + '</span>';
    };
    h.push('<div class="tvar2-per" data-booster="periode-trimestre"><div class="tvar2-an"><span>' + an + '</span><div>' +
      '<button type="button" data-an="-1" aria-label="Année précédente"' + (an <= 2024 ? ' disabled' : '') + '>' + gau + '</button>' +
      '<button type="button" data-an="1" aria-label="Année suivante"' + (an >= 2026 ? ' disabled' : '') + '>' + chev + '</button></div></div>');
    qs.forEach(function (x, i) { h.push('<button type="button" class="tvar2-q" data-per="' + (i + 1) + '" aria-pressed="' + (per === i + 1) + '">' + col(x) + '<b>T' + (i + 1) + '</b></button>'); });
    var ga = bilan(D[an]);
    var colAn = function (x) { var t = x[2.6].v + x[8.1].v || 1, a = Math.round(x[2.6].v / t * 40), b = Math.round(x[8.1].v / t * 40); return '<span class="tvar2-col">' + (x.inc.n ? '<i class="tvar2-cin">' + x.inc.n + '</i>' : '') + (b ? '<i class="tvar2-c81" style="height:' + b + 'px"></i>' : '') + (a ? '<i class="tvar2-c26" style="height:' + a + 'px"></i>' : '') + '</span>'; };
    h.push('<button type="button" class="tvar2-q" data-per="A" aria-pressed="' + (per === 'A') + '">' + colAn(ga) + '<b>Année</b></button></div>');
    h.push('<div class="tvar2-gauche">');
    h.push('<div class="tvar2-rep"><span>Remboursée</span><strong>Non</strong></div>');
    var lib = per === 'A' ? String(an) : 'T' + per + ' ' + an;
    if (!lignes.length && !etr) {
      h.push('<div class="tvar2-tot"><span class="tvar2-pl">TVA payée ' + lib + '</span><span class="tvar2-am tvar2-m">0,00<small>CHF</small></span></div>');
      h.push('<div class="tvar2-vide"><span>Aucune dépense sur cette période.</span><a href="#nouvelle">Saisir une dépense' + chev + '</a></div></div>');
      return h.join('');
    }
    var flou = g.inc.ttc > (g[2.6].ttc + g[8.1].ttc + g.inc.ttc) / 2;
    var chips = [];
    if (g.inc.n) chips.push('<button type="button" class="tvar2-inc" data-filtre="inc" data-booster="inconnues">+' + g.inc.n + (g.inc.n > 1 ? ' inconnues' : ' inconnue') + chev + '</button>');

    h.push('<div class="tvar2-tot"><span class="tvar2-pl">TVA payée ' + lib + '</span>' + (g.inc.n ? '<span class="tvar2-mn">au moins</span>' : '') +
      '<span class="tvar2-am tvar2-m' + (flou ? ' tvar2-flou' : '') + '">' + fmt(g.total) + '<small>CHF</small></span>' + (chips.length ? '<span class="tvar2-ch">' + chips.join('') + '</span>' : '') + '</div>');
    h.push(barre(g, etr, filtre));
    h.push('<div class="tvar2-leg"><div class="tvar2-lh"><span></span><span>dépenses</span><span>dépensé</span><span>TVA</span><span></span></div>');
    [[2.6], [8.1]].forEach(function (r) {
      var x = g[r[0]]; if (!x.n) return;
      h.push('<button type="button" class="tvar2-lr" data-filtre="' + r[0] + '" aria-pressed="' + (filtre === String(r[0])) + '" data-booster="filtre-taux">' + pa(r[0], taux(r[0])) + '<span class="tvar2-n">' + x.n + '</span><span class="tvar2-r tvar2-m">' + fmt(x.ttc) + '</span><span class="tvar2-v tvar2-m">' + fmt(x.v) + '</span>' + chev + '</button>');
    });
    if (g.inc.n) h.push('<button type="button" class="tvar2-lr" data-filtre="inc" aria-pressed="' + (filtre === 'inc') + '">' + pa(null, '?') + '<span class="tvar2-n">' + g.inc.n + '</span><span class="tvar2-r tvar2-m">' + fmt(g.inc.ttc) + '</span><span class="tvar2-v tvar2-m tvar2-tir">—</span>' + chev + '</button>');
    if (etr) h.push('<button type="button" class="tvar2-lr" data-filtre="de" aria-pressed="' + (filtre === 'de') + '" data-booster="etranger">' + pa('de', 'DE') + '<span class="tvar2-n">à part</span><span class="tvar2-r tvar2-m">' + fmt(ETR.mont) + ' €</span><span class="tvar2-v tvar2-m">' + ETR.mwst + ' €</span>' + chev + '</button>');
    h.push('</div>');
    // Le net si j'étais assujetti : récupéré − facturé, hypothèses au toucher
    var ventes = per === 'A' ? VENTES[an].reduce(function (s, v) { return s + v; }, 0) : VENTES[an][per - 1];
    var facture = Math.round(ventes * 8.1 / 108.1 * 100) / 100, net = g.total - facture;
    h.push('<details class="tvar2-si"' + (etat === 'si' ? ' open' : '') + ' data-booster="si-net"><summary><span class="tvar2-st">Si assujetti</span><span class="tvar2-net tvar2-m">' + fmt(net) + ' CHF</span>' + bas + '</summary>' +
      '<div class="tvar2-eq"><span>TVA payée, récupérée</span><span class="tvar2-x tvar2-m">+' + fmt(g.total) + '</span>' +
      '<span>TVA sur ventes, <span class="tvar2-m">' + fmt(ventes) + '</span> à 8,1 %</span><span class="tvar2-x tvar2-m">−' + fmt(facture) + '</span>' +
      '<span class="tvar2-tt">Net ' + lib + '</span><span class="tvar2-x tvar2-m tvar2-tt">' + fmt(net) + '</span></div>' +
      '<ul class="tvar2-hyp"><li>Ventes enregistrées, toutes au taux normal 8,1 %</li><li>Méthode effective ; au taux de la dette fiscale nette, rien n\'est récupéré</li>' +
      (g.inc.n ? '<li>' + g.inc.n + (g.inc.n > 1 ? ' dépenses' : ' dépense') + ' à TVA inconnue non comptée' + (g.inc.n > 1 ? 's' : '') + '</li>' : '') +
      '<li><a href="https://www.estv.admin.ch" target="_blank" rel="noopener">AFC, assujettissement' + sortie + '</a></li></ul></details>');
    h.push('</div><div class="tvar2-droite">');
    // Dépenses de la période (lignes)
    var vis = lignes.map(function (l) { return l; });
    if (etr) vis.push('etr');
    vis = vis.filter(function (l) { if (!filtre) return true; if (l === 'etr') return filtre === 'de'; if (filtre === 'inc') return l[4] == null; return String(l[4]) === filtre; }).reverse();
    h.push('<div class="tvar2-dh"><span>Dépenses ' + lib + (filtre ? ', ' + (filtre === 'inc' ? 'TVA inconnue' : filtre === 'de' ? 'étranger' : 'à ' + taux(filtre)) : '') + '</span>' + (filtre ? '<button type="button" data-filtre="">Toutes</button>' : '') + '</div><div data-mots="lignes">');
    vis.forEach(function (l) {
      if (l === 'etr') { h.push('<div class="tvar2-li"><span class="tvar2-d tvar2-m">' + ETR.d + '</span><span class="tvar2-f">' + ETR.f + '</span>' + pa('de', 'DE 19 %') + '<span class="tvar2-x">à part</span></div>'); return; }
      var v = tva(l), d = dou && D[an].indexOf(l) === DOUTE.i;
      h.push('<button type="button" class="tvar2-li' + (d ? ' tvar2-ldou' : '') + '"' + (d ? ' data-ouvre="1"' : '') + '><span class="tvar2-d tvar2-m">' + l[0] + '</span><span class="tvar2-f">' + l[1] + '</span>' + (v == null ? pa(null, '?') : pa(l[4], taux(l[4]))) + '<span class="tvar2-x tvar2-m">' + (v == null ? '—' : fmt(v)) + '</span></button>');
    });
    h.push('</div></div>');
    return '<div class="tvar2-vue">' + h.join('') + '</div>';
  }

  function synthese() {
    var g = bilan(D[an]);
    return '<div class="tvar2-syn"><div class="tvar2-tete"><h1>Situation financière</h1></div>' +
      '<div class="tvar2-sr"><div><small>Trésorerie</small>Solde de départ à renseigner</div><span class="tvar2-m">À compléter</span>' + chev + '</div>' +
      '<button type="button" class="tvar2-carte" id="tvar2-carte" data-booster="carte-tva"><span class="tvar2-c1"><b>TVA payée ' + an + '</b><span class="tvar2-m" style="font-size:16px;font-weight:600;color:#111">' + fmt(g.total) + ' CHF</span>' + chev + '</span>' +
      barre(g, false, null, true) + '<span class="tvar2-ch" style="justify-content:flex-start;margin-top:6px"><span class="tvar2-inc">+' + g.inc.n + ' inconnues</span><span class="tvar2-reg" style="margin-left:0">Non assujetti</span></span></button>' +
      '<div class="tvar2-sr"><div>Règlements à suivre</div><a href="#">Tout voir</a>' + chev + '</div></div>';
  }

  function feuille() {
    var l = D[2026][DOUTE.i];
    document.getElementById('tvar2-feuille').innerHTML = '<div class="tvar2-fh"><b>' + l[1] + '</b><span class="tvar2-m">' + l[0] + '.2026</span><button class="tvar2-ib" type="button" data-ferme="1" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
      '<div class="tvar2-tuile"><div><b>' + DOUTE.lu + '</b><span>colonne MWST · lu</span></div><div class="tvar2-pris"><b>' + DOUTE.somme + '</b><span>choisie à la saisie</span></div><div><b>' + fmt(l[3]) + '</b><span>imprimé TTC</span></div>' +
      '<div class="tvar2-calc">' + fmt(l[3]) + ' × 2,6 / 102,6 = ' + DOUTE.somme + ' ≠ ' + DOUTE.lu + ' imprimé</div></div><a class="tvar2-fa" href="#facture">Ouvrir la facture' + chev + '</a>';
  }

  function rendre() {
    var z = document.getElementById('tvar2-vue');
    z.innerHTML = ecran === 'vue' ? vue() : synthese();
    z.querySelectorAll('[data-filtre]').forEach(function (b) { b.addEventListener('click', function (e) { e.stopPropagation(); var f = b.getAttribute('data-filtre'); filtre = f && filtre !== f ? f : null; rendre(); }); });
    z.querySelectorAll('[data-per]').forEach(function (b) { b.addEventListener('click', function () { var p = b.getAttribute('data-per'); per = p === 'A' ? 'A' : Number(p); filtre = null; rendre(); }); });
    z.querySelectorAll('[data-an]').forEach(function (b) { b.addEventListener('click', function () { an += Number(b.getAttribute('data-an')); filtre = null; rendre(); }); });
    z.querySelectorAll('[data-ouvre]').forEach(function (b) { b.addEventListener('click', function (e) { e.stopPropagation(); feuille(); document.body.classList.add('tvar2-ouvre'); }); });
    var r = document.getElementById('tvar2-retour'); if (r) r.addEventListener('click', function () { ecran = 'synthese'; rendre(); });
    var c = document.getElementById('tvar2-carte'); if (c) c.addEventListener('click', function () { ecran = 'vue'; rendre(); });
  }
  document.getElementById('tvar2-voile').addEventListener('click', function () { document.body.classList.remove('tvar2-ouvre'); });
  document.getElementById('tvar2-feuille').addEventListener('click', function (e) { if (e.target.closest('[data-ferme]')) document.body.classList.remove('tvar2-ouvre'); });
  rendre();
})();
