<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>u3 — Nouvelle dépense · lecture et QR-facture, la fermeture éclair (01.11)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--page:#FFFFFF;--panel:#F5F5F5;--haut:#EBEBEB;--bord:#DDDDDD;--bordm:#BFBFBF;--t2:#666666;--t1:#333333;--t0:#111111;
--attt:#7F5B10;--attf:#FBF4E4;--ok:#2F6B45;--okf:#E7F3EA;--bleu:#2F5E9E;
--malt:#A8781F;--mout:#E3CFA3;--houb:#5E9A52;--lev:#5C7FB8;
--sans:"Source Sans 3",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E9E9E9;color:var(--t1);font-family:var(--sans);font-size:14px;line-height:1.3;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
svg{flex-shrink:0}
.qru3-m{font-family:var(--mono);font-variant-numeric:tabular-nums}
.qru3-f{height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--page)}
.qru3-hd{flex:none;height:44px;display:flex;align-items:center;gap:4px;padding:0 6px 0 12px;border-bottom:1px solid var(--bord)}
.qru3-hd h1{flex:1;font-size:16px;font-weight:600;color:var(--t0)}
.qru3-ib{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--t1)}
.qru3-ib:active{background:var(--haut)}
.qru3-corps{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.qru3-g{padding:6px 10px 0;display:flex;flex-direction:column;gap:8px}
.qru3-just{width:100%;text-align:left;display:flex;align-items:center;gap:6px;min-height:32px;font-size:14px;color:var(--t1);border-bottom:1px solid var(--bord)}
.qru3-just span{flex:1}
.qru3-bd{background:var(--panel);border:1px solid var(--bord);border-radius:16px;padding:6px 10px 8px;display:flex;flex-direction:column;gap:4px}
.qru3-l1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.qru3-four{font-size:16px;font-weight:600;color:var(--t0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qru3-l2{display:flex;align-items:center;gap:8px}
.qru3-tot{font-family:var(--mono);font-size:32px;line-height:1.05;font-weight:600;color:var(--t0);font-variant-numeric:tabular-nums}
.qru3-tot.qru3-chg{animation:qru3-flash .6s ease-out}
@keyframes qru3-flash{from{background:var(--okf)}to{background:transparent}}
.qru3-chf{font-size:12px;color:var(--t2)}
.qru3-nl{margin-left:auto;min-height:28px;display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:10px;border:1px solid var(--bordm);background:#fff;font-size:14px}
.qru3-nl svg{color:var(--attt)}
.qru3-barre{display:flex;height:10px;border-radius:10px;overflow:hidden;border:1px solid var(--bord);background:#fff}
.qru3-barre i{height:100%;border-right:1.5px solid #fff}
.qru3-barre i:last-child{border-right:0}
.qru3-pv{border:1px solid var(--bord);border-radius:16px;padding:4px 10px 6px;background:#fff}
.qru3-pv h2{font-size:14px;font-weight:600;color:var(--t0);min-height:24px;display:flex;align-items:center}
.qru3-rg{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:6px;min-height:28px;border-bottom:1px solid var(--bord);font-size:14px}
.qru3-rg b{font-family:var(--mono);font-weight:500;color:var(--t0);font-variant-numeric:tabular-nums}
.qru3-rg .qru3-ok{color:var(--ok)}
.qru3-rg .qru3-pt{color:var(--t2);text-align:center}
/* La rangée QR : un bouton de toute la rangée, qui déplie les quatre champs. */
.qru3-qr{width:100%;text-align:left;border-radius:10px;margin:2px -4px;padding:2px 4px;width:calc(100% + 8px)}
.qru3-qr .qru3-cases{display:flex;gap:4px;justify-content:flex-end}
.qru3-case{display:inline-flex;align-items:center;gap:2px;font-size:12px;line-height:20px;padding:0 5px;border-radius:10px;border:1px solid var(--bord);color:var(--t1)}
.qru3-case.qru3-v{border-color:#9CC3A8;background:var(--okf);color:var(--ok)}
.qru3-case.qru3-x{border:1.5px dashed var(--attt);background:var(--attf);color:var(--attt);font-weight:600}
.qru3-case.qru3-a{border-style:dotted;color:var(--t2)}
.qru3-qr.qru3-att{background:var(--attf)}
.qru3-qr .qru3-ic{color:var(--t0)}
.qru3-qr:active{background:var(--haut)}
.qru3-det{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;padding:4px 0 6px 24px;font-size:14px;border-bottom:1px solid var(--bord)}
.qru3-det span{color:var(--t2)}
.qru3-det b{font-family:var(--mono);font-weight:500;color:var(--t0)}
.qru3-det em{font-style:normal;font-size:12px;color:var(--ok);text-align:right}
.qru3-det em.qru3-x{color:var(--attt);font-weight:600}
.qru3-det em.qru3-a{color:var(--t2)}
.qru3-sous{font-size:12px;color:var(--t2);padding:0 0 4px 24px}
.qru3-rephoto{min-height:28px;padding:0 8px;border-radius:10px;border:1px solid var(--bordm);font-size:12px;color:var(--t0);background:#fff}
.qru3-liens{display:flex;flex-wrap:wrap;gap:2px 10px;padding-top:4px;font-size:12px;color:var(--t1)}
.qru3-liens span{display:inline-flex;align-items:center;gap:3px}
.qru3-liens b{font-family:var(--mono);color:var(--t0)}
.qru3-tu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qru3-tile{position:relative;border:1.5px dashed var(--attt);background:var(--attf);border-radius:16px;padding:4px 8px 6px 32px;text-align:left;min-height:46px;display:flex;flex-direction:column;justify-content:center}
.qru3-tile.qru3-large{grid-column:1 / -1}
.qru3-tile.qru3-fait{border:1px solid var(--bord);background:#fff}
.qru3-k{font-size:12px;color:var(--t2)}
.qru3-v{font-size:14px;color:var(--t0)}
.qru3-v .qru3-m{font-weight:500}
.qru3-sup{font-size:12px;color:var(--attt);border:1px dashed var(--attt);border-radius:10px;padding:0 4px;margin-left:2px}
.qru3-no{position:absolute;left:7px;top:8px;width:18px;height:18px;border-radius:50%;border:1.5px dashed var(--attt);color:var(--attt);font-family:var(--mono);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;background:#fff}
.qru3-fait .qru3-no{border:0;background:var(--ok);color:#fff}
.qru3-duel{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qru3-barr{text-decoration:line-through;color:var(--t2)}
.qru3-prendre{min-height:28px;padding:0 10px;border-radius:10px;background:var(--t0);color:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.qru3-prendre:active{transform:scale(.97)}
.qru3-chips{display:flex;flex-wrap:wrap;gap:6px}
.qru3-chip{min-height:28px;display:inline-flex;align-items:center;gap:4px;padding:0 8px 0 4px;border-radius:10px;border:1.5px dashed var(--attt);background:var(--attf);font-size:14px;color:var(--t0)}
.qru3-chip .qru3-no{position:static}
.qru3-lt{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;border-top:1px solid var(--bord);margin-top:4px}
.qru3-lt div{flex:1;font-size:14px;color:var(--t1)}
.qru3-lt small{display:block;font-size:12px;color:var(--attt)}
.qru3-d{padding:0 10px 12px}
.qru3-li{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;min-height:50px;border-top:1px solid var(--bord)}
.qru3-li b{font-size:16px;font-weight:600;color:var(--t0)}
.qru3-li small{display:block;font-size:12px;color:var(--t2)}
.qru3-li > .qru3-m{font-size:14px;color:var(--t0);text-align:right}
.qru3-li.qru3-mo{min-height:32px;margin-left:16px;border-left:2px dashed #C9A15A;padding-left:6px;background:var(--panel)}
.qru3-mot{font-size:12px;border:1.5px dashed var(--attt);border-radius:10px;padding:0 6px;color:var(--attt);font-weight:600;justify-self:start}
.qru3-past{font-size:12px;background:var(--haut);border-radius:10px;padding:0 5px;color:var(--t1);margin-left:4px;font-weight:400}
.qru3-sq{display:block;height:14px;border-radius:6px;background:linear-gradient(90deg,#EEE,#F7F7F7,#EEE);background-size:200% 100%;animation:qru3-sk 1.2s linear infinite}
@keyframes qru3-sk{to{background-position:-200% 0}}
.qru3-pied{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-top:1px solid var(--bord);background:var(--page)}
.qru3-pied span{font-size:12px;color:var(--t2)}
.qru3-conf{min-height:36px;padding:0 14px;border-radius:10px;background:var(--t0);color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.qru3-conf[disabled]{background:var(--bordm);color:#fff}
/* u3 : la fermeture éclair, lecture et QR face à face. */
.qru3-zip{border:1px solid var(--bord);border-radius:16px;padding:6px 8px 8px;background:#fff;display:flex;flex-direction:column;gap:6px}
.qru3-zt{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--t0);min-height:24px}
.qru3-zt .qru3-pa{margin-left:auto}
.qru3-zsans{font-weight:400;color:var(--t1)}
.qru3-pa{font-size:12px;font-weight:600;line-height:22px;padding:0 8px;border-radius:10px}
.qru3-pa-ok{background:var(--okf);color:var(--ok)}
.qru3-pa-x{border:1.5px dashed var(--attt);background:var(--attf);color:var(--attt)}
.qru3-z{display:grid;grid-template-columns:24px repeat(4,1fr);column-gap:3px;align-items:stretch}
.qru3-lb{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--t2)}
.qru3-lbqr{color:var(--t0)}
.qru3-c{display:flex;flex-direction:column;justify-content:center;padding:3px 6px;min-height:40px;background:var(--panel);min-width:0}
.qru3-c small{font-size:12px;color:var(--t2)}
.qru3-c b{font-size:14px;font-weight:500;color:var(--t0);white-space:nowrap}
.qru3-haut{border-radius:10px 10px 0 0}
.qru3-bas{border-radius:0 0 10px 10px;min-height:30px}
.qru3-c.qru3-ouvert{background:var(--attf)}
.qru3-c.qru3-ouvert b{color:var(--attt);font-weight:600}
.qru3-bas.qru3-flou{background:repeating-linear-gradient(135deg,#E8E2D2 0 3px,#F7F3EA 3px 7px)}
.qru3-bas.qru3-flou b{color:var(--attt)}
.qru3-bas.qru3-absent{background:#fff;border:1px dotted #8A8A8A;border-top:0}
.qru3-abs{font-size:12px!important;font-weight:400!important;color:#666!important;white-space:normal!important;line-height:1.1}
.qru3-dt{position:relative;height:14px;background:var(--panel)}
.qru3-dt::before,.qru3-dt::after{content:"";position:absolute;left:6px;right:6px;height:9px;transition:transform .25s ease,top .25s ease,bottom .25s ease}
.qru3-dt.qru3-ferme::before{top:0;background:repeating-linear-gradient(90deg,var(--ok) 0 4px,transparent 4px 8px)}
.qru3-dt.qru3-ferme::after{bottom:0;background:repeating-linear-gradient(90deg,transparent 0 4px,var(--ok) 4px 8px)}
.qru3-dt.qru3-ouvert{background:var(--attf)}
.qru3-dt.qru3-ouvert::before{top:0;height:3px;background:repeating-linear-gradient(90deg,var(--attt) 0 4px,transparent 4px 8px);right:55%}
.qru3-dt.qru3-ouvert::after{bottom:0;height:3px;background:repeating-linear-gradient(90deg,transparent 0 4px,var(--attt) 4px 8px);left:55%}
.qru3-dt i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:600;color:var(--attt);line-height:1}
.qru3-dt.qru3-absent::before{top:0;height:5px;background:repeating-linear-gradient(90deg,#9A9A9A 0 4px,transparent 4px 8px)}
.qru3-dt.qru3-absent{background:linear-gradient(var(--panel) 0 50%,#fff 50%)}
.qru3-dt.qru3-flou::before{top:0;height:5px;background:repeating-linear-gradient(90deg,var(--attt) 0 4px,transparent 4px 8px)}
.qru3-dt.qru3-flou{background:linear-gradient(var(--panel) 0 50%,#F2ECDD 50%)}
.qru3-dt.qru3-attente::after{bottom:0;height:5px;background:repeating-linear-gradient(90deg,var(--ok) 0 4px,transparent 4px 8px)}
.qru3-act{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--t1);border-top:1px solid var(--bord);padding-top:6px}
.qru3-act > span:nth-child(2){flex:1;min-width:150px}
.qru3-act .qru3-no{position:static}
.qru3-act.qru3-fait .qru3-no{border:0;background:var(--ok);color:#fff}
.qru3-pv.qru3-ferme{display:none}
@media (min-width:900px){.qru3-pv.qru3-ferme{display:block}}
@media (prefers-reduced-motion:reduce){.qru3-dt::before,.qru3-dt::after{transition:none}}
@media (prefers-reduced-motion:reduce){.qru3-tot.qru3-chg,.qru3-sq{animation:none}}
@media (min-width:900px){
  body{display:flex;align-items:center;justify-content:center;height:100vh}
  .qru3-f{width:980px;height:min(760px,94vh);border-radius:24px;border:1px solid var(--bord);overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.12)}
  .qru3-corps{display:grid;grid-template-columns:390px 1fr;overflow:hidden}
  .qru3-g{overflow:auto;padding-bottom:12px;border-right:1px solid var(--bord)}
  .qru3-d{overflow:auto;padding-top:6px}
  .qru3-lt{margin-top:0}
}
</style></head>
<body>
<div class="qru3-f" data-qr-ecran="u3">
  <header class="qru3-hd"><h1>Nouvelle dépense</h1>
    <button class="qru3-ib" aria-label="Justificatif"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 2.5h6.5L15 6v11.5H5z"/><path d="M11.5 2.5V6H15M7.5 10h5M7.5 13h5"/></svg></button>
    <button class="qru3-ib" aria-label="Fermer"><svg width="20" height="20" viewBox="0 0 20 20" stroke="currentColor" stroke-width="1.5"><path d="M5 5l10 10M15 5 5 15"/></svg></button></header>
  <div class="qru3-corps">
    <div class="qru3-g">
      <button class="qru3-just" type="button"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5 2.5h6.5L15 6v11.5H5z"/><path d="M11.5 2.5V6H15"/></svg><span>Voir le justificatif</span><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5 8l5 5 5-5"/></svg></button>
      <section class="qru3-bd" aria-label="Bandeau">
        <div class="qru3-l1"><span class="qru3-four" id="qru3-four">Brau- und Rauchshop GmbH</span><span class="qru3-m" id="qru3-date">27.04.2026</span></div>
        <div class="qru3-l2"><span class="qru3-tot" id="qru3-tot">86,50</span><span class="qru3-chf">CHF</span>
          <button type="button" class="qru3-nl" id="qru3-nl" data-booster="preuve"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.3"/><path d="M8 4.6v4.2M8 10.8v.4"/></svg><span class="qru3-m">23</span>&nbsp;lignes</button></div>
        <div class="qru3-barre" id="qru3-barre" aria-label="Les 23 lignes, à la largeur de leur montant"></div>

      <div class="qru3-zip" id="qru3-zip"></div>
      <section class="qru3-pv" id="qru3-pv" aria-label="Vérification">
        <h2 id="qru3-titre">Lecture à confirmer</h2>
        <div id="qru3-rangs"></div>
        <div class="qru3-liens" id="qru3-liens">
          <span><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="#111" stroke-width="2.1"><path d="M10 2.5 17 6v8l-7 3.5L3 14V6z"/><circle cx="15" cy="15" r="4.6" fill="#111" stroke="none"/><path d="M12.8 15.1l1.6 1.6 2.9-3" stroke="#fff"/></svg><b>13</b> reliés</span>
          <span><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="#2F6B45" stroke-width="2.1"><path d="M10 2.5 17 6v8l-7 3.5L3 14V6z"/><circle cx="15" cy="15" r="4.6" fill="#2F6B45" stroke="none"/><path d="M15 12.6v4.8M12.6 15h4.8" stroke="#fff"/></svg><b>0</b> nouveaux</span>
          <span><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="#7F5B10" stroke-width="2.1" stroke-dasharray="2.4 1.6"><path d="M10 2.5 17 6v8l-7 3.5L3 14V6z"/></svg><b>1</b> unité ?</span>
          <span><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="#666" stroke-width="2.1"><path d="M5 3v8a3 3 0 0 0 3 3h8"/><path d="M13 11l3 3-3 3"/></svg><b>5</b> moutures</span>
          <span><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="#666" stroke-width="2.1"><path d="M10 2.5 17 6v8l-7 3.5L3 14V6z"/></svg><b>4</b> sans stock</span></div>
      </section>
      <div class="qru3-tu" id="qru3-tu"></div>
      <div class="qru3-chips" id="qru3-chips"></div>
    </div>
    <div class="qru3-d">
      <div class="qru3-lt"><div>Lignes de la facture · <span class="qru3-m" id="qru3-nb">23</span><small id="qru3-prop">14 proposées par la lecture, à vérifier</small></div><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M5 12l5-5 5 5"/></svg></div>
      <div id="qru3-lignes" data-mots="lignes"></div>
    </div>
  </div>
  <footer class="qru3-pied"><span id="qru3-drive">Drive prêt</span><button class="qru3-conf" id="qru3-conf" type="button"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 10.5l4 4 8-9"/></svg>Confirmer</button></footer>
</div>
<script>
(function () {
  'use strict';
  // Les données de la fixture (la facture B&R de 23 lignes, celle des captures en ligne) ; le QR de chaque état.
  var LU = { total: '86,50', devise: 'CHF', numero: '372765', date: '27.04.2026' };
  var ETATS = {
    confirme: { qr: { total: '86,50', devise: 'CHF', numero: '372765', date: '27.04.2026' } },
    contredit: { lu: { total: '85,60' }, qr: { total: '86,50', devise: 'CHF', numero: '372765', date: '27.04.2026' } },
    partiel: { qr: { total: '86,50', devise: 'CHF', numero: null, date: null } },
    illisible: { illisible: true },
    sans: { sans: true },
    lecture: { lecture: true, qr: { total: '86,50', devise: 'CHF', numero: '372765', date: '27.04.2026' } }
  };
  var params = new URLSearchParams(location.search);
  var nom = ETATS[params.get('etat')] ? params.get('etat') : 'confirme';
  var E = ETATS[nom];
  var lu = { total: (E.lu && E.lu.total) || LU.total, devise: LU.devise, numero: LU.numero, date: LU.date };
  var pris = false, ouvert = nom !== 'confirme' && nom !== 'sans';
  var $ = function (id) { return document.getElementById('qru3-' + id); };
  var QR = '<svg class="qru3-ic" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="14" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="3.2" y="3.2" width="3" height="3" fill="currentColor"/><rect x="9.8" y="3.2" width="3" height="3" fill="currentColor"/><rect x="3.2" y="9.8" width="3" height="3" fill="currentColor"/><rect x="6.1" y="6.1" width="3.8" height="3.8" fill="currentColor"/><path d="M8 6.8v2.4M6.8 8h2.4" stroke="#fff" stroke-width="1.5"/></svg>';
  var OK = '<svg class="qru3-ok" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8.5l3 3 7-7.5"/></svg>';
  var LIGNES = [
    ['Maris Otter', '6 Kg', '13,80', '+6 kg'], ['mouture', '', '0,60', 'm'], ['Gerstenflocken', '1 Kg', '2,40', '+1 kg'],
    ['Röstgerste', '1 Kg', '1,80', '+1 kg'], ['mouture', '', '0,10', 'm'], ['Caramünch Typ 2', '1 Kg', '1,75', '+1 kg'],
    ['mouture', '', '0,10', 'm'], ['Target', '40 g · α 11,3', '1,60', ''], ['Goldings East Kent', '20 g · α 5,5', '0,80', ''],
    ['LALLEMAND Windsor', '2 Stk', '9,00', '= 2 sachets'], ['Safale BE-256', '1 Stk', '4,40', '= 1 sachet']
  ];
  var CUBE = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 2.5 17 6v8l-7 3.5L3 14V6z"/><path d="M3 6l7 3.5L17 6M10 9.5v8"/><circle cx="15" cy="15" r="4.6" fill="currentColor" stroke="none"/><path d="M12.8 15.1l1.6 1.6 2.9-3" stroke="#fff"/></svg>';
  var FLECHE = '<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#666" stroke-width="1.5" aria-hidden="true"><path d="M5 3v8a3 3 0 0 0 3 3h8"/><path d="M13 11l3 3-3 3"/></svg>';

  function barre() {
    var b = $('barre'), coul = ['var(--malt)', 'var(--mout)', 'var(--malt)', 'var(--malt)', 'var(--mout)', 'var(--malt)', 'var(--mout)', 'var(--houb)', 'var(--houb)', 'var(--lev)', 'var(--lev)', 'var(--malt)', 'var(--malt)', 'var(--mout)', 'var(--houb)', 'var(--lev)', 'var(--t0)', 'var(--t0)', 'var(--malt)', 'var(--mout)', 'var(--houb)', 'var(--t0)', 'var(--malt)'];
    var mt = [13.8, .6, 2.4, 1.8, .1, 1.75, .1, 1.6, .8, 9, 4.4, 7.5, 6.2, .5, 2.1, 6.8, 3, 2.5, 9.6, .4, 3.6, 2, 5.45];
    b.innerHTML = '';
    mt.forEach(function (m, i) { var x = document.createElement('i'); x.style.flexGrow = m; x.style.background = nom === 'lecture' ? '#E4E4E4' : coul[i]; b.appendChild(x); });
  }

  function lignes() {
    var h = '';
    if (nom === 'lecture') {
      for (var i = 0; i < 6; i++) h += '<div class="qru3-li"><span class="qru3-sq" style="width:20px"></span><span><span class="qru3-sq" style="width:' + (50 + i * 7 % 30) + '%"></span></span><span class="qru3-sq" style="width:40px"></span></div>';
      $('lignes').innerHTML = h; $('prop').textContent = 'Lecture des lignes en cours'; return;
    }
    LIGNES.forEach(function (l) {
      if (l[3] === 'm') { h += '<div class="qru3-li qru3-mo">' + FLECHE + '<span class="qru3-mot">mouture</span><span class="qru3-m">' + l[2] + '</span></div>'; return; }
      h += '<div class="qru3-li">' + CUBE + '<span><b>' + l[0] + '</b>' + (l[3] ? '<span class="qru3-past">' + l[3] + '</span>' : '') + '<small class="qru3-m">' + l[1] + '</small></span><span class="qru3-m">' + l[2] + '</span></div>';
    });
    $('lignes').innerHTML = h;
  }

  // La fermeture éclair : deux rubans face à face, la lecture en haut, le QR en bas, une colonne par champ. Là où ils disent la même
  // chose, les dents sont fermées (vert) ; là où ils divergent, le ruban s'ouvre (ambre, ≠) ; un champ que le QR ne porte pas n'a
  // qu'une rangée de dents ; un QR illisible laisse le ruban du bas hachuré.
  var CHAMPS = [['total', 'Montant'], ['devise', 'Devise'], ['numero', 'N°'], ['date', 'Date']];
  function court(c, v) { return c === 'date' && v ? v.slice(0, 5) : v; }
  function zip() {
    var z = $('zip');
    if (E.sans) {
      z.innerHTML = '<div class="qru3-zt qru3-zsans"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="2.5" fill="none" stroke="#767676" stroke-width="1.5" stroke-dasharray="2 1.6"/></svg><span>Pas de QR-facture sur la pièce : la lecture reste seule.</span></div>';
      return;
    }
    var etats = CHAMPS.map(function (c) {
      if (nom === 'lecture') return 'attente';
      if (E.illisible) return 'flou';
      var v = E.qr[c[0]];
      if (v === null) return 'absent';
      return (c[0] === 'total' && v !== lu.total) ? 'ouvert' : 'ferme';
    });
    var nOk = etats.filter(function (e) { return e === 'ferme'; }).length;
    var pastille = nom === 'lecture' ? '<span class="qru3-pa qru3-pa-ok">lu en <span class="qru3-m">0,6 s</span></span>'
      : E.illisible ? '<span class="qru3-pa qru3-pa-x">illisible</span>'
      : etats.indexOf('ouvert') >= 0 ? '<span class="qru3-pa qru3-pa-x">montant ≠</span>'
      : '<span class="qru3-pa qru3-pa-ok"><span class="qru3-m">' + nOk + '/4</span> d’accord</span>';
    var h = '<div class="qru3-zt">' + QR + '<span>Lecture et QR-facture</span>' + pastille + '</div>';
    h += '<div class="qru3-z" role="table" aria-label="Lecture et QR-facture, champ par champ">';
    h += '<span class="qru3-lb" role="rowheader">lu</span>';
    CHAMPS.forEach(function (c, i) {
      var v = nom === 'lecture' ? '<span class="qru3-sq" style="width:70%"></span>' : '<b class="qru3-m">' + court(c[0], lu[c[0]]) + '</b>';
      h += '<span class="qru3-c qru3-haut qru3-' + etats[i] + '" role="cell"><small>' + c[1] + '</small>' + v + '</span>';
    });
    h += '<span class="qru3-lb"></span>';
    CHAMPS.forEach(function (c, i) { h += '<span class="qru3-dt qru3-' + etats[i] + '" aria-label="' + c[1] + ' : ' + { ferme: 'identique', ouvert: 'différent', absent: 'absent du QR', flou: 'QR illisible', attente: 'lecture en attente' }[etats[i]] + '">' + (etats[i] === 'ouvert' ? '<i>≠</i>' : '') + '</span>'; });
    h += '<span class="qru3-lb qru3-lbqr" role="rowheader">' + QR + '</span>';
    CHAMPS.forEach(function (c, i) {
      var v = E.illisible ? '<b class="qru3-m">?</b>' : E.qr[c[0]] === null ? '<b class="qru3-abs">pas dans le QR</b>' : '<b class="qru3-m">' + court(c[0], E.qr[c[0]]) + '</b>';
      h += '<span class="qru3-c qru3-bas qru3-' + etats[i] + '" role="cell">' + v + '</span>';
    });
    h += '</div>';
    if (etats.indexOf('ouvert') >= 0) h += '<div class="qru3-act"><span class="qru3-no">1</span><span>Le QR dit <b class="qru3-m">86,50</b>, la lecture <b class="qru3-m">85,60</b>.</span><button type="button" class="qru3-prendre" data-booster="prendre-qr" data-geste="1">Fermer sur 86,50</button></div>';
    if (pris) h += '<div class="qru3-act qru3-fait"><span class="qru3-no">1</span><span>Total pris du QR · <span class="qru3-barr qru3-m">85,60</span></span></div>';
    if (E.illisible) h += '<div class="qru3-act"><span>QR vu sur la pièce, pas déchiffré : rien n’est confirmé.</span><button type="button" class="qru3-rephoto" data-booster="rephoto">Photographier le QR</button></div>';
    z.innerHTML = h;
  }

  function rangs() {
    var h = '', sommeOk = lu.total === '86,50';
    h += '<div class="qru3-rg">' + (sommeOk ? OK : '<span class="qru3-pt">·</span>') + '<span>Somme des lignes = imprimé</span><b>' + (sommeOk ? '86,50' : '86,50 ≠ ' + lu.total) + '</b></div>';
    h += '<div class="qru3-rg">' + OK + '<span>Quantité × prix, au centime</span><b>23/23</b></div>';
    h += '<div class="qru3-rg"><span class="qru3-pt">·</span><span>Lectures : désaccord sur certains points</span><b>2</b></div>';
    return h;
  }

  function tuiles() {
    var n = nom === 'contredit' ? 2 : 1, c = '';
    if (nom === 'lecture') { $('tu').innerHTML = ''; $('chips').innerHTML = ''; return; }
    var h = '<div class="qru3-tile"><span class="qru3-no">' + n++ + '</span><span class="qru3-k">TVA</span><span class="qru3-v qru3-m">2,80 · 4,15</span></div>';
    h += '<div class="qru3-tile"><span class="qru3-no">' + n++ + '</span><span class="qru3-k">Règlement</span><span class="qru3-v">Payé le <span class="qru3-m">27.04</span><span class="qru3-sup">supposée</span></span></div>';
    $('tu').innerHTML = h;
    ['Sabro unité', 'mouture ×5 +1,50', 'Target α'].forEach(function (t) { c += '<button type="button" class="qru3-chip"><span class="qru3-no">' + n++ + '</span>' + t + '</button>'; });
    $('chips').innerHTML = c;
  }

  var pvOuverte = false;
  function rendre() {
    $('tot').textContent = lu.total;
    if (nom === 'lecture') {
      $('tot').textContent = E.qr.total;
      $('four').innerHTML = '<span class="qru3-sq" style="width:180px;display:inline-block"></span>';
      $('nl').hidden = true; $('nb').textContent = '…'; $('conf').disabled = true; $('drive').textContent = 'Lecture du justificatif…';
    }
    $('pv').classList.toggle('qru3-ferme', !pvOuverte || nom === 'lecture');
    barre(); lignes(); zip(); $('rangs').innerHTML = rangs(); tuiles();
  }
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest && ev.target.closest('[data-booster]');
    if (!t) return;
    var b = t.getAttribute('data-booster');
    if (b === 'preuve') { pvOuverte = !pvOuverte; rendre(); }
    if (b === 'prendre-qr') { pris = true; lu.total = '86,50'; rendre(); var tt = $('tot'); tt.classList.remove('qru3-chg'); void tt.offsetWidth; tt.classList.add('qru3-chg'); }
  });
  rendre();
})();
</script>
