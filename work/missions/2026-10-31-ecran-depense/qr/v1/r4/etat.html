<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>r4b — QR-facture : le total chiffre à chiffre, passe 2, retouches R1 R2 (01.11)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--qrr4-fond:#F3F3F3;--qrr4-carte:#FAFAFA;--qrr4-blanc:#FFFFFF;--qrr4-bord:#DCDCDC;--qrr4-bordm:#BDBDBD;--qrr4-t2:#5E5E5E;--qrr4-t1:#2E2E2E;--qrr4-t0:#111111;
--qrr4-att:#7A560C;--qrr4-attf:#FBF3E2;--qrr4-ok:#2B6541;--qrr4-okf:#E6F2E9;--qrr4-sans:"Source Sans 3",system-ui,sans-serif;--qrr4-mono:"IBM Plex Mono",ui-monospace,monospace;
--qrr4-hach:repeating-linear-gradient(135deg,#E2D3B0 0 2px,#FBF3E2 2px 5px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#D9D9D9;color:var(--qrr4-t1);font-family:var(--qrr4-sans);font-size:14px;line-height:1.3;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:#E9D8B0}
:focus-visible{outline:2px solid var(--qrr4-t0);outline-offset:2px}
.qrr4-m{font-family:var(--qrr4-mono);font-variant-numeric:tabular-nums}
.qrr4-sheet{max-width:960px;margin:0 auto;min-height:100vh;background:var(--qrr4-fond);border-radius:24px 24px 0 0;display:flex;flex-direction:column}
.qrr4-hd{position:sticky;top:0;z-index:5;background:var(--qrr4-fond);display:flex;align-items:center;gap:4px;height:48px;padding:0 8px 0 12px;border-bottom:1px solid var(--qrr4-bord);border-radius:24px 24px 0 0}
.qrr4-hd h1{flex:1;font-size:20px;font-weight:600;color:var(--qrr4-t0)}
.qrr4-ib{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--qrr4-t1)}
/* La feuille de l'app : à 390 une colonne (haut, lignes, plis) ; à 1280 deux colonnes (haut et plis à gauche, lignes à droite). */
.qrr4-corps{flex:1;padding:6px 12px 88px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"a" "b" "c";gap:8px;align-content:start}
.qrr4-colA{grid-area:a}.qrr4-colB{grid-area:b}.qrr4-plis{grid-area:c}
.qrr4-colA,.qrr4-colB{display:flex;flex-direction:column;gap:8px;min-width:0}
.qrr4-just{display:flex;align-items:center;gap:8px;min-height:28px;font-size:14px;width:100%;text-align:left}
.qrr4-just span{flex:1}
/* Le bandeau (récap cliquable) : fournisseur, date en haut à droite, total, chip « n lignes », barre des lignes. */
.qrr4-bd{background:var(--qrr4-carte);border:1px solid var(--qrr4-bord);border-radius:16px;padding:6px 10px 8px;display:flex;flex-direction:column;gap:4px;transition:box-shadow .2s ease-out;scroll-margin-top:56px}
.qrr4-bd.qrr4-flash{box-shadow:0 0 0 2px var(--qrr4-att)}
.qrr4-bd1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.qrr4-four{font-size:16px;font-weight:600;color:var(--qrr4-t0)}
.qrr4-tr{display:flex;align-items:center;gap:8px;min-height:40px}
.qrr4-tot{font-family:var(--qrr4-mono);font-variant-numeric:tabular-nums;font-size:32px;font-weight:600;line-height:1.1;color:var(--qrr4-t0)}
.qrr4-dev{font-size:12px;color:var(--qrr4-t2)}
.qrr4-sp{flex:1}
.qrr4-chip{min-height:28px;display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:10px;border:1px solid var(--qrr4-bordm);background:var(--qrr4-blanc);font-size:14px}
/* Le sceau du total : le QR dessiné (24 px) et sa coche, un bouton qui ouvre « Ce que dit le QR ». */
.qrr4-sceau{min-height:32px;display:inline-flex;align-items:center;gap:3px;padding:0 6px 0 4px;border-radius:10px;border:1px solid var(--qrr4-ok);background:var(--qrr4-okf);color:var(--qrr4-ok);font-size:12px;font-weight:600}
.qrr4-sceau.qrr4-neutre{border-color:var(--qrr4-bordm);background:var(--qrr4-blanc);color:var(--qrr4-t1);font-weight:400}
.qrr4-sceau.qrr4-sans{border:1px dashed var(--qrr4-bordm);background:transparent;color:var(--qrr4-t2);font-weight:400}
.qrr4-sceau.qrr4-ill{border:1px dashed var(--qrr4-att);background:var(--qrr4-attf);color:var(--qrr4-att);font-weight:400}
.qrr4-sceau[aria-expanded="true"]{box-shadow:inset 0 0 0 1.5px var(--qrr4-t0)}
/* Le duel chiffre à chiffre : trois témoins, mêmes colonnes ; la colonne fautive en pointillé d'attention. */
.qrr4-cmp{display:grid;grid-template-columns:52px auto 1fr;column-gap:8px;align-items:center}
.qrr4-src{font-size:12px;color:var(--qrr4-t2);display:inline-flex;align-items:center;gap:4px;min-height:24px}
.qrr4-dg{display:flex;font-family:var(--qrr4-mono);font-variant-numeric:tabular-nums;font-weight:600;color:var(--qrr4-t0)}
.qrr4-dg span{display:inline-flex;justify-content:center;width:20px;border-radius:4px}
.qrr4-dg.qrr4-g{font-size:32px;line-height:1.15}
.qrr4-dg.qrr4-p{font-size:20px;line-height:1.3}
.qrr4-dg.qrr4-p.qrr4-v{color:var(--qrr4-ok)}
.qrr4-dg span.qrr4-x{background:var(--qrr4-attf);outline:1.5px dashed var(--qrr4-att);color:var(--qrr4-att)}
.qrr4-dg span.qrr4-vd{color:var(--qrr4-t2)}
.qrr4-dg span.qrr4-h{background:var(--qrr4-hach);color:var(--qrr4-att);margin-right:1px}
.qrr4-dg.qrr4-barre{text-decoration:line-through;text-decoration-thickness:2px;color:var(--qrr4-t2)}
.qrr4-fin{display:flex;align-items:center;gap:6px;justify-content:flex-end;min-width:0;font-size:12px;color:var(--qrr4-t2)}
.qrr4-act{display:flex;gap:6px;flex-wrap:wrap;padding-top:2px}
.qrr4-btn{min-height:28px;padding:0 10px;border-radius:10px;border:1px solid var(--qrr4-bordm);background:var(--qrr4-blanc);font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.qrr4-btn.qrr4-plein{background:var(--qrr4-t0);border-color:var(--qrr4-t0);color:#fff;font-weight:600}
.qrr4-btn b{font-family:var(--qrr4-mono);font-weight:600}
.qrr4-photo{min-height:28px;padding:0 8px;border-radius:10px;border:1px solid var(--qrr4-att);background:var(--qrr4-blanc);color:var(--qrr4-att);font-size:12px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.qrr4-coches{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--qrr4-t1)}
.qrr4-coches span{display:inline-flex;align-items:center;gap:3px}
.qrr4-coches b{font-family:var(--qrr4-mono);font-weight:600;color:var(--qrr4-t0)}
.qrr4-coches svg{color:var(--qrr4-ok)}
.qrr4-coches .qrr4-abs{color:var(--qrr4-t2);border:1px dashed var(--qrr4-bordm);border-radius:10px;padding:0 6px}
.qrr4-barre-l{display:flex;height:10px;border-radius:9px;overflow:hidden;border:1px solid var(--qrr4-bord)}
.qrr4-barre-l i{height:100%;border-right:1.5px solid var(--qrr4-blanc);cursor:pointer}
.qrr4-barre-l i:last-child{border-right:0}
.qrr4-l-relie{background:#9C7A2E}.qrr4-l-neuf{background:#4F74B0}.qrr4-l-aucun{background:#2B2B2B}.qrr4-l-mouture{background:#D9C499}
/* Panneaux ouverts au toucher : la preuve (chip), « Ce que dit le QR » (sceau), le règlement (tuile) ; bord noir de l'app. */
.qrr4-preuve{background:var(--qrr4-blanc);border:1px solid var(--qrr4-bord);border-radius:16px;padding:4px 10px 6px}
.qrr4-rr{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:6px;min-height:28px;border-bottom:1px solid var(--qrr4-bord);font-size:14px}
.qrr4-rr b{font-family:var(--qrr4-mono);font-weight:500;color:var(--qrr4-t0)}
.qrr4-cnt{display:flex;flex-wrap:wrap;gap:4px 10px;padding:6px 0 2px;font-size:12px;color:var(--qrr4-t1)}
.qrr4-cnt b{font-family:var(--qrr4-mono);font-weight:600}
.qrr4-pan{border:2px solid var(--qrr4-t0);border-radius:16px;padding:6px 10px 8px;background:var(--qrr4-blanc);display:flex;flex-direction:column;gap:4px}
.qrr4-pan h2{font-size:14px;font-weight:600;color:var(--qrr4-t0);display:flex;align-items:center;gap:6px}
.qrr4-kv{display:grid;grid-template-columns:72px 1fr auto;gap:6px;align-items:center;min-height:28px;border-top:1px solid var(--qrr4-bord);font-size:14px}
.qrr4-kv small{font-size:12px;color:var(--qrr4-t2)}
.qrr4-kv .qrr4-v{font-family:var(--qrr4-mono);font-variant-numeric:tabular-nums;color:var(--qrr4-t0);font-size:14px}
.qrr4-kv .qrr4-v.qrr4-ko{color:var(--qrr4-att);font-weight:600}
.qrr4-kv .qrr4-ss{font-size:12px;display:inline-flex;align-items:center;gap:3px;color:var(--qrr4-ok)}
.qrr4-kv .qrr4-ss.qrr4-ko{color:var(--qrr4-att)}
.qrr4-kv .qrr4-ss.qrr4-na{color:var(--qrr4-t2)}
.qrr4-kv .qrr4-iban{font-family:var(--qrr4-mono);font-size:14px;line-height:1.35;color:var(--qrr4-t0);padding:3px 0}
.qrr4-cp{min-height:28px;min-width:28px;padding:0 8px;border-radius:10px;border:1px solid var(--qrr4-bordm);display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--qrr4-t1);background:var(--qrr4-blanc)}
.qrr4-cp.qrr4-copie{border-color:var(--qrr4-ok);color:var(--qrr4-ok);background:var(--qrr4-okf)}
.qrr4-seg{display:inline-flex;border:1px solid var(--qrr4-bordm);border-radius:10px;overflow:hidden;align-self:flex-start}
.qrr4-seg button{min-height:28px;padding:0 10px;font-size:14px}
.qrr4-seg button[aria-pressed="true"]{background:var(--qrr4-t0);color:#fff;font-weight:600}
.qrr4-champ{height:32px;border:1px solid var(--qrr4-bordm);border-radius:10px;padding:0 8px;font-size:16px;font-family:var(--qrr4-mono);width:130px;background:var(--qrr4-blanc);color:var(--qrr4-t0)}
.qrr4-rang{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* Les tuiles et les points de la base, numérotés : ① Règlement · Payé le · supposée, ② mouture. */
.qrr4-tu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qrr4-tile{position:relative;border:1px solid var(--qrr4-bord);border-radius:16px;padding:6px 10px;display:flex;flex-direction:column;gap:3px;min-height:52px;background:var(--qrr4-carte);text-align:left;width:100%}
.qrr4-tile small{font-size:12px;color:var(--qrr4-t2);display:flex;align-items:center;gap:5px}
.qrr4-tile span{font-size:14px;color:var(--qrr4-t0)}
.qrr4-tile.qrr4-pt{border:1.5px dashed var(--qrr4-att);background:var(--qrr4-attf)}
.qrr4-tile.qrr4-pt.qrr4-fait{border:1px solid var(--qrr4-bord);background:var(--qrr4-carte)}
.qrr4-tile[aria-expanded="true"]{box-shadow:inset 0 0 0 1.5px var(--qrr4-t0)}
.qrr4-sup{font-size:12px;color:var(--qrr4-att);border:1px dashed var(--qrr4-att);border-radius:10px;padding:0 5px;background:var(--qrr4-blanc);align-self:flex-start}
.qrr4-ech{position:relative;height:8px;border-radius:9px;background:#E4E4E4;border:1px solid #8C8C8C}
.qrr4-ech i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--qrr4-att)}
.qrr4-ech b{position:absolute;top:-4px;width:2px;height:14px;background:var(--qrr4-t0);border-radius:1px}
.qrr4-pts{display:flex;flex-wrap:wrap;gap:6px}
.qrr4-no{width:18px;height:18px;border-radius:50%;border:1.5px dashed var(--qrr4-att);color:var(--qrr4-att);font-family:var(--qrr4-mono);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;background:var(--qrr4-blanc);flex:none}
.qrr4-fait .qrr4-no{border:1.5px solid var(--qrr4-ok);background:var(--qrr4-ok);color:#fff}
.qrr4-pc{min-height:28px;display:inline-flex;align-items:center;gap:5px;padding:0 8px 0 5px;border-radius:10px;border:1.5px dashed var(--qrr4-att);background:var(--qrr4-attf);color:var(--qrr4-t0);font-size:14px}
.qrr4-pc em{font-style:normal;font-family:var(--qrr4-mono);font-size:12px;color:var(--qrr4-att)}
.qrr4-pc.qrr4-fait{border:1px solid var(--qrr4-bord);background:var(--qrr4-blanc);color:var(--qrr4-t2);text-decoration:line-through}
/* La proposition du QR pour le règlement : un chip pointillé ambre, un toucher pour l'adopter (rien ne change sans lui). */
.qrr4-prop{min-height:32px;display:inline-flex;align-items:center;gap:6px;padding:0 8px 0 5px;border-radius:10px;border:1.5px dashed var(--qrr4-att);background:var(--qrr4-blanc);color:var(--qrr4-t0);font-size:14px;text-align:left}
.qrr4-prop small{font-size:12px;color:var(--qrr4-att)}
/* Les lignes de l'app : picto de lien, nom, pastille, quantité, montant ; la mouture rattachable ; puis Ajouter, Regrouper, Détail. */
.qrr4-lt{display:flex;align-items:center;justify-content:space-between;min-height:28px;border-top:1px solid var(--qrr4-bord);padding-top:4px;width:100%;text-align:left}
.qrr4-lt small{display:block;font-size:12px;color:var(--qrr4-att)}
.qrr4-li{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px solid var(--qrr4-bord);min-height:52px;border-radius:10px;transition:background .2s ease-out}
.qrr4-li.qrr4-vise{background:var(--qrr4-attf)}
.qrr4-li b{font-size:16px;font-weight:600;color:var(--qrr4-t0)}
.qrr4-li .qrr4-pas{font-size:12px;border-radius:10px;padding:0 6px;background:#E4E4E4;color:var(--qrr4-t1);margin-left:6px}
.qrr4-li .qrr4-pas.qrr4-neuf{background:#E3EAF6;color:#2C4F86}
.qrr4-li .qrr4-q2{display:block;font-family:var(--qrr4-mono);font-size:12px;color:var(--qrr4-t1)}
.qrr4-li .qrr4-mt{font-family:var(--qrr4-mono);font-variant-numeric:tabular-nums;font-size:14px;color:var(--qrr4-t0);text-align:right}
.qrr4-mo{grid-template-columns:24px 1fr auto;background:#EAEAEA;margin-left:12px;border-left:1.5px dashed var(--qrr4-bordm);border-radius:0 10px 10px 0;min-height:36px}
.qrr4-mo .qrr4-tag{min-height:24px;padding:0 8px;border:1px dashed var(--qrr4-att);border-radius:10px;color:var(--qrr4-att);font-size:12px;display:inline-flex;align-items:center;background:var(--qrr4-blanc)}
.qrr4-mo .qrr4-tag.qrr4-lie{border:1px solid var(--qrr4-bordm);color:var(--qrr4-t1)}
.qrr4-mo .qrr4-ratt{min-height:24px;padding:0 8px;border-radius:10px;background:var(--qrr4-t0);color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center;margin-left:6px}
.qrr4-aj{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qrr4-aj button{min-height:28px;border:1px dashed var(--qrr4-bordm);border-radius:10px;font-size:14px;color:var(--qrr4-t1)}
.qrr4-det{text-align:right;font-size:14px;color:var(--qrr4-t2)}
.qrr4-det b{font-family:var(--qrr4-mono);font-weight:500}
.qrr4-det b.qrr4-ko{color:var(--qrr4-att)}
.qrr4-plis{display:flex;flex-direction:column}
.qrr4-pli{display:flex;align-items:center;gap:8px;min-height:36px;border-top:1px solid var(--qrr4-bord);font-size:14px;color:var(--qrr4-t1);width:100%;text-align:left}
.qrr4-pli>span{flex:1;display:flex;flex-direction:column}
.qrr4-pli small{font-size:12px;color:var(--qrr4-t2)}
.qrr4-pli em{font-style:normal;font-size:12px;color:var(--qrr4-att)}
.qrr4-pli>span.qrr4-tag2{flex:none}
.qrr4-tag2{font-size:12px;border:1px dashed var(--qrr4-att);border-radius:10px;padding:0 6px;margin-left:6px;color:var(--qrr4-att)}
.qrr4-sq{display:grid;grid-template-columns:24px 1fr 40px;gap:10px;align-items:center;min-height:48px;border-bottom:1px solid var(--qrr4-bord)}
.qrr4-sq i{display:block;height:12px;border-radius:9px;background:#E2E2E2}
.qrr4-sq i:first-child{height:20px;border-radius:6px}
.qrr4-pulse{animation:qrr4-p 1.1s ease-in-out infinite alternate}
@keyframes qrr4-p{to{opacity:.35}}
@media (prefers-reduced-motion:reduce){.qrr4-pulse{animation:none}.qrr4-bd,.qrr4-li{transition:none}}
.qrr4-ft{position:sticky;bottom:0;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--qrr4-fond);border-top:1px solid var(--qrr4-bord)}
.qrr4-ft span{flex:1;font-size:12px;color:var(--qrr4-t1)}
.qrr4-go{min-height:32px;padding:0 12px;border-radius:10px;background:var(--qrr4-t0);color:#fff;font-weight:600;display:inline-flex;align-items:center;gap:6px}
@media (min-width:900px){
 html,body{padding-top:24px}
 .qrr4-sheet{min-height:calc(100vh - 24px);border-radius:24px}
 .qrr4-corps{grid-template-columns:440px minmax(0,1fr);grid-template-areas:"a b" "c b";column-gap:16px;padding-bottom:24px}
}
</style></head>

<script>
(function () {

  ];

  function chf(n) { return n.toFixed(2).split('.').join(','); }
  function cube(lien) {
    if (lien === 'mouture') return '<svg role="img" aria-label="mouture" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#5E5E5E" stroke-width="1.5"><path d="M5 3v8a3 3 0 0 0 3 3h8"/><path d="M13 11l3 3-3 3"/></svg>';
    if (lien === 'port') return '<svg role="img" aria-label="frais de port, aucun mouvement de stock" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#5E5E5E" stroke-width="1.5"><path d="M3 6h10l4 4v5H3z"/><path d="M13 6v4h4M6 15v1.5M14 15v1.5"/></svg>';
    var c = '<path d="M10 2.5 17 6v8l-7 3.5L3 14V6z"/><path d="M3 6l7 3.5L17 6M10 9.5v8"/>';
    var coul = lien === 'neuf' ? '#2F7A45' : '#111';

    var hd = '<header class="qrr4-hd"><h1>Nouvelle dépense</h1><button type="button" class="qrr4-ib" aria-label="Justificatif"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 1.8h6.5L14 5.3v10.9H4z"/><path d="M10.3 1.8v3.7H14M6.5 9h5M6.5 12h5"/></svg></button><button type="button" class="qrr4-ib" aria-label="Fermer"><svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.5"><path d="M3 3l10 10M13 3 3 13"/></svg></button></header>';
    var just = '<button type="button" class="qrr4-just"><svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 1.8h6.5L14 5.3v10.9H4z"/><path d="M10.3 1.8v3.7H14"/></svg><span>Voir le justificatif</span>' + CHEV(false) + '</button>';
    var corps = '<div class="qrr4-corps"><div class="qrr4-colA">' + just + bandeau() + preuve() + feuille() + tuiles() + points() + '</div><div class="qrr4-colB">' + lignes() + '</div>' + plis() + '</div>';
    var ft = '<footer class="qrr4-ft"><span>' + (lec ? 'Lecture en cours' : 'Drive prêt') + '</span><button type="button" class="qrr4-go"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 7.4 5.6 10.4 11.5 3.8"/></svg>Confirmer</button></footer>';
    document.getElementById('qrr4-racine').innerHTML = hd + corps + ft;
  }
  document.addEventListener('click', function (e) {
    var seg = e.target.closest('[data-ligne]');
    if (seg) {
      ui.vise = Number(seg.getAttribute('data-ligne'));
      rendre();
      var el = document.getElementById('qrr4-l' + ui.vise);
      if (el) el.scrollIntoView({ block: 'center' });
      return;
    }
    var t = e.target.closest('button');
    if (!t) return;
    if (t.getAttribute('data-garde')) { ui.garde = t.getAttribute('data-garde'); ui.flash = false; }
    else if (t.id === 'qrr4-sceau') ui.feuille = !ui.feuille;
    else if (t.id === 'qrr4-chip') ui.preuve = !ui.preuve;
    else if (t.id === 'qrr4-regl') ui.regl = !ui.regl;
    else if (t.id === 'qrr4-prop') ui.adopte = true;
    else if (t.id === 'qrr4-ratt') ui.ratt = true;
    else if (t.id === 'qrr4-photo') ui.photo = true;
    else if (t.id === 'qrr4-pm') {
      rendre();
      var m = document.getElementById('qrr4-l1');
      if (m) m.scrollIntoView({ block: 'center' });
      return;
    } else if (t.id === 'qrr4-p1') {
      /* Le point 1 saute au duel du bandeau et le cerne. */
      ui.flash = !ui.garde; rendre();
      document.getElementById('qrr4-bd').scrollIntoView({ block: 'start' });
      return;
    } else if (t.getAttribute('data-copie')) {
      ui.copie = t.getAttribute('data-copie');
      var txt = (ui.copie === 'iban' ? IBAN : REF).join(' ').split(' ').join('');
      if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(function () {});
    } else return;
    rendre();
  });
  rendre();
})();
</script>
</body></html>
