<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>p3b-1 — Nouvelle dépense · le registre (passe 3, 01.11)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--page:#FFFFFF;--panel:#F5F5F5;--haut:#EBEBEB;--bord:#DDDDDD;--bordm:#BFBFBF;--t2:#666666;--t1:#333333;--t0:#111111;
--attt:#7F5B10;--attf:#FBF4E4;--ok:#2F6B45;--okf:#E7F3EA;--err:#A3322A;--errf:#FBEAE8;
--malt:#C9A15A;--houb:#5E9A52;--lev:#5C7FB8;--mout:#D9C49A;
--sans:"Source Sans 3",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
--hach:repeating-linear-gradient(135deg,#C9B48A 0 2px,#fff 2px 5px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--t1);font-family:var(--sans);font-size:14px;line-height:1.3;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg path,svg circle,svg rect{vector-effect:non-scaling-stroke;stroke-width:1.5}
[hidden]{display:none!important}
.p3b1-m{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* Toute la place de l'app : rien derrière, en-tête d'une ligne de 40 px, pied « Confirmer ». */
.p3b1-scr{height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--page)}
.p3b1-sc{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.p3b1-fs{min-height:100vh;background:var(--page)}
.p3b1-hd{flex:none;z-index:6;height:40px;display:flex;align-items:center;gap:4px;padding:0 4px;background:var(--page);border-bottom:1px solid var(--bord)}
.p3b1-hd h1{flex:1;font-size:16px;font-weight:600;color:var(--t0)}
.p3b1-ib{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--t1)}
.p3b1-ib:active{background:var(--haut)}
.p3b1-etb{display:flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;font-size:12px}
.p3b1-etb.p3b1-hl{background:var(--t1);color:#fff}
.p3b1-etb.p3b1-rv{background:var(--errf);color:var(--err);font-weight:600}
.p3b1-grid{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"recap" "table" "rub";gap:8px;padding:8px 8px 0}
.p3b1-recap{grid-area:recap;display:flex;flex-direction:column;gap:8px}
.p3b1-table{grid-area:table;min-width:0}
.p3b1-rub{grid-area:rub;display:flex;flex-direction:column}
/* Le récap entouré : le bandeau et la preuve de r2b, ouverts d'office ; chaque compte renvoie. */
.p3b1-bd{background:var(--panel);border:1px solid var(--bord);border-radius:16px;padding:6px 10px 8px;display:flex;flex-direction:column;gap:4px}
.p3b1-bd1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.p3b1-four{font-size:16px;font-weight:600;color:var(--t0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.p3b1-date{min-height:24px;padding:0 4px;border-radius:10px;font-size:14px;color:var(--t1);border-bottom:1px dotted var(--bordm)}
.p3b1-bd2{display:flex;align-items:center;gap:8px}
.p3b1-tot{font-family:var(--mono);font-size:32px;line-height:1.1;font-weight:600;color:var(--t0)}
.p3b1-tot small{font-size:12px;font-weight:500;color:var(--t2)}
.p3b1-n23{margin-left:auto;min-height:28px;display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:10px;border:1px solid var(--bord);background:#fff;font-size:14px}
.p3b1-n23 svg{color:var(--ok)}
.p3b1-bar{display:flex;height:12px;border-radius:9px;overflow:hidden;background:#fff;border:1px solid var(--bord)}
.p3b1-bar button{height:100%;min-width:4px;border-right:1.5px solid #fff;padding:0}
.p3b1-bar button:last-child{border-right:0}
.p3b1-f-malt{background:var(--malt)}.p3b1-f-houb{background:var(--houb)}.p3b1-f-lev{background:var(--lev)}.p3b1-f-mout{background:var(--mout)}
.p3b1-bar .p3b1-dt{background:var(--hach)}
.p3b1-pv{background:#fff;border:1px solid var(--bord);border-radius:16px;padding:2px 10px 6px}
.p3b1-rr{display:grid;grid-template-columns:16px 1fr auto;align-items:center;gap:6px;min-height:28px;border-bottom:1px solid var(--bord);font-size:14px;width:100%;text-align:left}
.p3b1-rr svg{color:var(--ok)}
.p3b1-rr b{font-family:var(--mono);font-weight:500;color:var(--t0)}
.p3b1-rr.p3b1-pg svg{color:var(--t1)}
.p3b1-cnt{display:flex;flex-wrap:wrap;gap:4px;padding-top:6px}
.p3b1-pa{min-height:24px;display:inline-flex;align-items:center;gap:3px;padding:0 6px 0 4px;border-radius:10px;border:1px solid var(--bord);background:#fff;font-size:12px;color:var(--t1)}
.p3b1-pa b{font-family:var(--mono);font-weight:600;font-size:12px;color:var(--t0)}
.p3b1-pa.p3b1-dt{border:1.5px dashed var(--attt);background:var(--attf)}
.p3b1-pa[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--t0)}
/* Les tuiles d'argent (r2b) : 1 TVA, 2 Payé. */
.p3b1-tu{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.p3b1-tile{position:relative;border:1px solid var(--bord);border-radius:16px;padding:4px 8px 4px 30px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:52px;background:#fff}
.p3b1-tile .p3b1-k{font-size:12px;color:var(--t2)}
.p3b1-tile .p3b1-v{font-size:14px;color:var(--t0);display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.p3b1-tile.p3b1-dt{border:1.5px dashed var(--attt);background:var(--attf)}
.p3b1-no{position:absolute;left:7px;top:12px;width:18px;height:18px;border-radius:50%;border:1.5px dashed var(--attt);color:var(--attt);font-family:var(--mono);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;background:#fff}
.p3b1-no.p3b1-nin{position:static;flex:none}
.p3b1-fait .p3b1-no,.p3b1-no.p3b1-fait{border:1.5px solid var(--ok);background:var(--ok);color:#fff}
.p3b1-sup{font-size:12px;color:var(--attt);border:1px dashed var(--attt);border-radius:10px;padding:0 5px;line-height:18px;background:#fff;white-space:nowrap}
.p3b1-val2 b{font-family:var(--mono);font-weight:600;font-size:14px;color:var(--attt);border:1px dashed var(--attt);border-radius:10px;padding:0 4px;background:#fff;margin-right:3px}
.p3b1-pan{border:2px solid var(--t0);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;background:#fff}
.p3b1-calc{font-size:12px;color:var(--t1)}
.p3b1-calc b{font-family:var(--mono);font-weight:600}
.p3b1-ch{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.p3b1-ch button,.p3b1-bt{min-height:28px;padding:0 10px;border-radius:10px;border:1px solid var(--bordm);font-size:14px;background:#fff}
.p3b1-pri{background:var(--t0)!important;border-color:var(--t0)!important;color:#fff!important;font-weight:600}
.p3b1-ch button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--t0);font-weight:600}
.p3b1-tv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.p3b1-tv3 button{border:1px solid var(--bord);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:2px;text-align:left;background:#fff}
.p3b1-tv3 b{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--t0);line-height:1.1}
.p3b1-tv3 small{font-size:12px;color:var(--t2)}
.p3b1-tv3 .p3b1-prop{border:1.5px solid var(--ok);background:var(--okf)}
.p3b1-tv3 .p3b1-prop small{color:var(--ok)}
.p3b1-tv3 button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--t0)}
.p3b1-in{height:32px;border:1px solid var(--bordm);border-radius:10px;padding:0 8px;font-size:16px;font-family:var(--mono);width:96px;background:#fff}
/* Le registre : colonnes alignées, bandes pleines teintées par catégorie, collantes. */
.p3b1-th{display:grid;grid-template-columns:18px minmax(0,1fr) 76px 58px;column-gap:6px;align-items:center;min-height:32px;padding:0 6px}
.p3b1-th .p3b1-col{font-size:12px;color:var(--t2);text-align:right}
@media (max-width:899px){.p3b1-th .p3b1-col{display:none}}
.p3b1-seg{display:inline-flex;border:1px solid var(--bordm);border-radius:10px;overflow:hidden;grid-column:1/3;justify-self:start}
.p3b1-seg button{min-height:28px;padding:0 10px;font-size:14px}
.p3b1-seg button[aria-pressed="true"]{background:var(--t0);color:#fff;font-weight:600}
.p3b1-flt{position:sticky;top:0;z-index:4;height:32px;display:flex;align-items:center;gap:6px;min-height:32px;padding:0 6px;background:var(--t0);color:#fff;border-radius:10px;margin-bottom:2px}
.p3b1-flt span{flex:1;font-size:14px}
.p3b1-flt b{font-family:var(--mono)}
.p3b1-flt button{min-height:24px;padding:0 8px;border-radius:10px;border:1px solid #fff;font-size:12px;color:#fff}
.p3b1-gb{position:sticky;top:var(--p3b1-gtop,0px);z-index:3;display:grid;grid-template-columns:18px minmax(0,1fr) auto 58px;column-gap:6px;align-items:center;min-height:28px;padding:2px 6px;border-radius:10px;font-weight:600}
.p3b1-gb .p3b1-gn{display:flex;align-items:baseline;gap:6px;min-width:0;white-space:nowrap}
.p3b1-gb .p3b1-gn small{font-size:12px;font-weight:600;opacity:1}
.p3b1-gb .p3b1-gq{white-space:nowrap}
.p3b1-gb .p3b1-gq,.p3b1-gb .p3b1-ga{font-family:var(--mono);font-size:13px;text-align:right;line-height:1.25}
.p3b1-gb i{width:12px;height:12px;border-radius:50%;justify-self:center}
.p3b1-g-malt{background:#F3E6CB;color:#57400C}.p3b1-g-malt i{background:var(--malt)}
.p3b1-g-houb{background:#DDEDD8;color:#2C5524}.p3b1-g-houb i{background:var(--houb)}
.p3b1-g-lev{background:#DEE6F4;color:#284673}.p3b1-g-lev i{background:var(--lev)}
.p3b1-g-mout{background:#F1EADC;color:#574928}.p3b1-g-mout i{background:var(--mout)}
.p3b1-L{border-bottom:1px solid var(--bord)}
.p3b1-L:last-child{border-bottom:0}
.p3b1-li{display:grid;grid-template-columns:18px minmax(0,1fr) 76px 58px;column-gap:6px;align-items:center;min-height:28px;padding:0 6px;cursor:pointer;width:100%;text-align:left}
.p3b1-li:active{background:var(--panel)}
.p3b1-L.p3b1-dt{background:var(--attf)}
.p3b1-L[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--t0)}
.p3b1-ico{width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:var(--t1)}
.p3b1-ico.p3b1-q{color:var(--attt)}
.p3b1-nm{min-width:0;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.p3b1-nm b{font-size:14px;font-weight:600;color:var(--t0);overflow:hidden;text-overflow:ellipsis}
.p3b1-nm .p3b1-al{font-family:var(--mono);font-size:12px;color:var(--t2)}
.p3b1-nm .p3b1-par{font-size:12px;color:var(--t2);overflow:hidden;text-overflow:ellipsis}
.p3b1-cv{font-size:12px;color:var(--t1);background:var(--haut);border-radius:10px;padding:0 5px;line-height:18px}
.p3b1-qt{font-family:var(--mono);font-size:13px;color:var(--t1);text-align:right;white-space:nowrap}
.p3b1-qt.p3b1-bad{color:var(--attt);font-weight:600}
.p3b1-mt{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--t0);text-align:right}
.p3b1-mol{min-height:24px;cursor:default}
.p3b1-mol .p3b1-nm{gap:6px;padding-left:10px;border-left:1.5px dashed var(--attt);margin-left:-12px}
.p3b1-mo:not(.p3b1-dt) .p3b1-mol .p3b1-nm{border-left-color:var(--bordm)}
.p3b1-vd{display:inline-flex;align-items:center;padding:0 4px;line-height:16px}
.p3b1-mob{min-height:24px;display:inline-flex;align-items:center}
.p3b1-mol .p3b1-tous,.p3b1-mo1{min-height:24px;padding:0 8px;border-radius:10px;font-size:12px}
.p3b1-mol .p3b1-tous{background:var(--t0);color:#fff;font-weight:600}
.p3b1-mo1{min-width:24px;border:1.5px dashed var(--attt);color:var(--attt);font-weight:600;padding:0 8px}
.p3b1-mol .p3b1-mt{font-size:13px;color:var(--t1)}
.p3b1-fix{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:30px;padding:0 6px 3px 30px}
.p3b1-fix .p3b1-q2{font-size:12px;color:var(--t2);display:inline-flex;align-items:center;gap:3px}
.p3b1-fix button{min-height:24px;padding:0 8px;border-radius:10px;border:1px solid var(--bordm);background:#fff;font-size:12px}
.p3b1-fix button.p3b1-ac{border:1.5px dashed var(--attt);color:var(--attt);font-weight:600}
.p3b1-fix button.p3b1-tous{background:var(--t0);border-color:var(--t0);color:#fff;font-weight:600}
.p3b1-fix button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--t0);font-weight:600}
.p3b1-plat{margin:0 6px 6px 30px}
.p3b1-ev{font-size:12px;color:var(--t2)}
@keyframes p3b1-fl{0%{background:#F2D58F}100%{background:transparent}}
.p3b1-eclair{animation:p3b1-fl 1.1s ease-out}
@media (prefers-reduced-motion:reduce){.p3b1-eclair{animation:none;box-shadow:inset 0 0 0 2px var(--attt)}}
/* Les rubriques, après le registre (à 1280 : sous le récap). */
.p3b1-ru{display:flex;align-items:center;gap:8px;min-height:36px;border-bottom:1px solid var(--bord);padding:0 4px;width:100%;text-align:left}
.p3b1-ru .p3b1-rk{font-size:14px;color:var(--t1);white-space:nowrap}
.p3b1-ru .p3b1-rv2{flex:1;min-width:0;font-size:12px;color:var(--t2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p3b1-ref{display:grid;grid-template-columns:84px 1fr;gap:4px 8px;padding:6px 4px 8px;font-size:12px;color:var(--t2);align-items:center}
.p3b1-ref b{font-family:var(--mono);font-weight:500;font-size:14px;color:var(--t0)}
.p3b1-act{display:flex;gap:6px;padding:8px 0}
.p3b1-act button{flex:1;min-height:32px;border-radius:10px;border:1px dashed var(--bordm);font-size:14px}
.p3b1-lb{min-height:28px;padding:0 10px;border-radius:10px;border:1px solid var(--bordm);font-size:14px;color:var(--t1);background:#fff}
.p3b1-lb.p3b1-lon{background:var(--t0);border-color:var(--t0);color:#fff;font-weight:600}
.p3b1-det{font-size:12px;color:var(--t2);text-align:right;padding:0 4px 8px}
.p3b1-det b{font-family:var(--mono);color:var(--t0);font-weight:500}
.p3b1-det .p3b1-ecart{color:var(--err);font-weight:600}
.p3b1-pied{flex:none;position:relative;z-index:7;height:52px;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 8px;background:var(--page);border-top:1px solid var(--bord)}
.p3b1-go{min-height:36px;padding:0 16px;border-radius:10px;background:var(--t0);color:#fff;font-size:16px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
/* Finances, après « Confirmer » : la dépense est rangée, l'envoi part en arrière-plan. */
.p3b1-fh{position:sticky;top:0;height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--bord);background:var(--page);z-index:3}
.p3b1-fh h1{font-size:16px;font-weight:600;color:var(--t0);flex:1}
.p3b1-jr{padding:4px 8px 140px}
.p3b1-jm{font-size:12px;color:var(--t2);padding:8px 4px 4px}
.p3b1-jl{display:grid;grid-template-columns:44px minmax(0,1fr) auto 20px;align-items:center;gap:6px;min-height:44px;border-bottom:1px solid var(--bord);padding:0 4px}
.p3b1-jl .p3b1-jd{font-family:var(--mono);font-size:12px;color:var(--t2)}
.p3b1-jl b{display:block;font-size:14px;font-weight:600;color:var(--t0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p3b1-jl small{font-size:12px;color:var(--t2)}
.p3b1-jl .p3b1-ja{font-family:var(--mono);font-size:14px;color:var(--t0)}
.p3b1-jl.p3b1-neuf{background:var(--panel);border-radius:10px}
.p3b1-jl .p3b1-ko{color:var(--err)}
.p3b1-nav{position:fixed;left:0;right:0;bottom:0;height:56px;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--bord);background:var(--page);z-index:5}
.p3b1-nav span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--t2)}
.p3b1-nav span.p3b1-on{color:var(--t0);font-weight:600}
.p3b1-recu{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:6;display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:10px;background:var(--t1);color:#fff;font-size:12px;transition:opacity .25s}
.p3b1-recu.p3b1-part{opacity:0}
.p3b1-env{display:inline-flex;align-items:center;color:var(--t2)}
/* L'échec : une carte flottante au-dessus de la navigation, qui ne part pas seule. */
.p3b1-kc{position:fixed;left:8px;right:8px;bottom:64px;z-index:6;border:2px solid var(--err);border-radius:16px;background:#fff;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 24px -8px rgba(0,0,0,.35)}
.p3b1-kc1{display:flex;gap:10px;align-items:flex-start}
.p3b1-kc1 svg{color:var(--err);flex:none}
.p3b1-kc h2{font-size:16px;font-weight:700;color:var(--err)}
.p3b1-kc p{font-size:14px;color:var(--t1)}
.p3b1-kc p small{font-size:12px;color:var(--t2)}
.p3b1-kc .p3b1-ch button{min-height:32px}
.p3b1-jus{display:flex;flex-direction:column;gap:6px}
.p3b1-jus .p3b1-fi{display:flex;align-items:center;gap:8px;font-size:14px}
.p3b1-steps{display:flex;gap:6px}
.p3b1-steps span{flex:1;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--t2)}
.p3b1-steps span i{height:6px;border-radius:9px;background:var(--haut)}
.p3b1-steps .p3b1-fa{color:var(--t1)}.p3b1-steps .p3b1-fa i{background:var(--t1)}
.p3b1-steps .p3b1-co{color:var(--t0);font-weight:600}
.p3b1-steps .p3b1-co i{background:repeating-linear-gradient(90deg,var(--t1) 0 6px,var(--haut) 6px 12px);background-size:24px 6px;animation:p3b1-run 1s linear infinite}
@keyframes p3b1-run{to{background-position:24px 0}}
.p3b1-vide{border:1px dashed var(--bordm);border-radius:16px;padding:12px;font-size:14px;color:var(--t2);text-align:center}
.p3b1-ann{max-width:1180px;margin:24px auto 72px;padding:12px;border-top:2px solid var(--t0);font-size:12px;color:var(--t2);display:flex;flex-direction:column;gap:6px}
.p3b1-ann h2{font-size:14px;color:var(--t0)}
.p3b1-ann nav{display:flex;flex-wrap:wrap;gap:4px}
