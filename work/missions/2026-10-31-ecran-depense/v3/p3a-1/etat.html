<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>p3a-1 — Nouvelle dépense · plein écran, groupée, sous-totaux collants (01.11)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--page:#FFFFFF;--panel:#F5F5F5;--haut:#EBEBEB;--bord:#DDDDDD;--bordm:#BFBFBF;--t2:#666666;--t1:#333333;--t0:#111111;
--attt:#7F5B10;--attf:#FBF4E4;--ok:#2F6B45;--okf:#E7F3EA;--err:#A3322A;--errf:#FBEDEB;--bleu:#2F5E9E;
--malt:#C9A15A;--mout:#E3CFA3;--houb:#5E9A52;--lev:#5C7FB8;
--sans:"Source Sans 3",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;--hach:repeating-linear-gradient(135deg,#C9B48A 0 2px,#fff 2px 5px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--t1);font-family:var(--sans);font-size:14px;line-height:1.3;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
[hidden]{display:none!important}
svg{flex-shrink:0}
.p3a1-m{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* Plein écran : l'écran de la dépense est toute l'app (ni en-tête ni navigation de l'app derrière). */
/* L'écran tient la fenêtre : en-tête de 40 px, le corps qui défile, le pied. Ce qui passe sous le pied est hors de la vue. */
.p3a1-app{height:100vh;height:100dvh;display:flex;flex-direction:column}
.p3a1-corps{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.p3a1-hd{flex:none;position:relative;z-index:8;height:40px;display:flex;align-items:center;gap:4px;padding:0 4px 0 10px;background:var(--page);border-bottom:1px solid var(--bord)}
.p3a1-hd h1{flex:1;font-size:16px;font-weight:600;color:var(--t0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p3a1-ib{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--t1)}
.p3a1-ib:active{background:var(--haut)}
.p3a1-hl{font-size:12px;color:var(--t1);border:1px solid var(--bordm);border-radius:10px;padding:0 6px;line-height:20px}
.p3a1-col{padding:6px 8px 0;display:flex;flex-direction:column;gap:6px}
/* Le récap entouré : bandeau + preuve, ouverts d'office (r2b). */
.p3a1-bd{background:var(--panel);border:1px solid var(--bord);border-radius:16px;padding:5px 10px 7px;display:flex;flex-direction:column;gap:3px}
.p3a1-bd1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.p3a1-four{font-size:16px;font-weight:600;color:var(--t0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.p3a1-date{font-size:14px;color:var(--t1);border-bottom:1px dashed var(--bordm);min-height:24px}
.p3a1-bd2{display:flex;align-items:center;gap:8px}
.p3a1-tot{font-family:var(--mono);font-size:32px;line-height:1.05;font-weight:600;color:var(--t0);font-variant-numeric:tabular-nums}
.p3a1-tot small{font-size:12px;font-weight:500;color:var(--t2)}
.p3a1-pr{margin-left:auto;min-height:28px;display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:10px;border:1px solid var(--bord);background:#fff;font-size:14px}
.p3a1-pr svg{color:var(--ok)}
.p3a1-barre{display:flex;height:10px;border-radius:10px;overflow:hidden;border:1px solid var(--bord);background:#fff}
.p3a1-barre i{height:100%;border-right:1.5px solid #fff;cursor:pointer}
.p3a1-barre i:last-child{border-right:0}
.p3a1-barre .c-malt{background:var(--malt)}.p3a1-barre .c-mout{background:var(--mout)}.p3a1-barre .c-houb{background:var(--houb)}.p3a1-barre .c-lev{background:var(--lev)}.p3a1-barre i.p3a1-dt{background:var(--hach)}
.p3a1-preuve{border:1px solid var(--bord);border-radius:16px;padding:2px 8px 4px;background:#fff}
.p3a1-pv{display:grid;grid-template-columns:1fr 1fr;column-gap:10px}
.p3a1-rr{display:flex;align-items:center;gap:4px;min-height:26px;font-size:14px;border-bottom:1px solid var(--bord);text-align:left;width:100%}
.p3a1-rr svg{color:var(--ok)}
.p3a1-rr b{margin-left:auto;font-family:var(--mono);font-weight:500;color:var(--t0);font-variant-numeric:tabular-nums}
.p3a1-rr.p3a1-pg{color:var(--t1)}
.p3a1-rr.p3a1-pg svg{color:var(--t2)}
.p3a1-cnt{display:flex;flex-wrap:wrap;gap:2px 4px;padding-top:3px}
.p3a1-cnt button{min-height:24px;display:inline-flex;align-items:center;gap:3px;padding:0 4px;border-radius:10px;font-size:12px;color:var(--t1)}
.p3a1-cnt button b{font-family:var(--mono);font-weight:600;color:var(--t0)}
.p3a1-cnt .p3a1-cp{border:1.5px dashed var(--attt);background:var(--attf);color:var(--t0)}
.p3a1-cnt .p3a1-cp.p3a1-fait{border:1px solid var(--bord);background:#fff}
.p3a1-nc{width:16px;height:16px;border-radius:50%;border:1.5px dashed var(--attt);color:var(--attt);font-family:var(--mono);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;background:#fff;line-height:1}
.p3a1-nc.p3a1-ncf{border:1.5px solid var(--ok);background:var(--ok);color:#fff}
.p3a1-cnt button:active,.p3a1-cnt button:hover{background:var(--haut)}
/* Les points : tuiles d'argent et chips de stock numérotées par risque (r2b). */
.p3a1-tu{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.p3a1-tile{position:relative;border:1.5px dashed var(--attt);background:var(--attf);border-radius:16px;padding:3px 8px 4px 30px;text-align:left;display:flex;flex-direction:column;min-height:42px}
.p3a1-tile .p3a1-k{font-size:12px;color:var(--t2)}
.p3a1-tile .p3a1-v{font-size:14px;color:var(--t0);display:flex;gap:4px;align-items:baseline;flex-wrap:wrap}
.p3a1-no{position:absolute;left:6px;top:6px;width:18px;height:18px;border-radius:50%;border:1.5px dashed var(--attt);color:var(--attt);font-family:var(--mono);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;background:#fff}
.p3a1-fait .p3a1-no{border:1.5px solid var(--ok);background:var(--ok);color:#fff}
.p3a1-tile.p3a1-fait{border:1px solid var(--bord);background:#fff}
.p3a1-sup{font-size:12px;color:var(--attt);border:1px dashed var(--attt);border-radius:10px;padding:0 5px;line-height:18px;background:#fff;white-space:nowrap}
.p3a1-v2 b{font-family:var(--mono);font-weight:600;color:var(--attt);border:1px dashed var(--attt);border-radius:10px;padding:0 4px;background:#fff}
.p3a1-pts{display:flex;flex-wrap:wrap;gap:6px}
.p3a1-pc{position:relative;min-height:28px;display:inline-flex;align-items:center;gap:4px;padding:0 8px 0 28px;border-radius:10px;border:1.5px dashed var(--attt);background:var(--attf);color:var(--t0);font-size:14px}
.p3a1-pc .p3a1-no{left:5px;top:4px}
.p3a1-pc.p3a1-fait{border:1px solid var(--bord);background:#fff;color:var(--t2);text-decoration:line-through}
.p3a1-pan{border:2px solid var(--t0);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;background:#fff}
.p3a1-calc{font-size:12px;color:var(--t1)}
.p3a1-calc b{font-family:var(--mono);font-weight:600}
.p3a1-ch{display:flex;gap:6px;flex-wrap:wrap}
.p3a1-ch button,.p3a1-bt{min-height:28px;padding:0 10px;border-radius:10px;border:1px solid var(--bordm);font-size:14px;background:#fff}
.p3a1-ch button.p3a1-pri,.p3a1-bt.p3a1-pri{background:var(--t0);border-color:var(--t0);color:#fff;font-weight:600}
.p3a1-tv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.p3a1-tv3 button{border:1px solid var(--bord);border-radius:10px;padding:5px;display:flex;flex-direction:column;text-align:left}
.p3a1-tv3 b{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--t0);line-height:1.1}
.p3a1-tv3 small{font-size:12px;color:var(--t2)}
.p3a1-tv3 .p3a1-prop{border:1.5px solid var(--ok);background:var(--okf)}
.p3a1-tv3 .p3a1-prop small{color:var(--ok)}
/* La liste : groupes, sous-totaux collants, une ligne par rangée. */
.p3a1-liste{padding:6px 0 0}
.p3a1-grp{position:relative}
.p3a1-gh{position:sticky;top:0;z-index:5;height:28px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-top:1px solid var(--bord);border-bottom:1px solid var(--bord);font-size:14px}
.p3a1-gh .p3a1-pt{width:10px;height:10px;border-radius:10px}
.p3a1-gh strong{font-weight:600;color:var(--t0)}
.p3a1-gh .p3a1-nb{font-family:var(--mono);font-size:12px;color:var(--t1);border:1px solid var(--bordm);border-radius:10px;padding:0 5px;line-height:18px;background:#fff}
.p3a1-gh .p3a1-q{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--t1);font-variant-numeric:tabular-nums}
.p3a1-gh .p3a1-q i{font-style:normal;color:var(--attt);border:1px dashed var(--attt);border-radius:10px;padding:0 4px;background:#fff}
.p3a1-gh .p3a1-mt{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--t0);width:54px;flex:none;text-align:right}
.p3a1-li{scroll-margin-top:30px;border-bottom:1px solid var(--bord)}
.p3a1-r{display:flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;width:100%;text-align:left}
.p3a1-r .p3a1-nm{font-size:14px;color:var(--t0);min-width:0;line-height:1.15;overflow-wrap:normal} /* le nom entier : un nom long passe à la ligne plutôt que d'être coupé */
.p3a1-r .p3a1-n{font-family:var(--mono);font-size:12px;color:var(--t2);width:18px;text-align:right}
.p3a1-r .p3a1-a{font-family:var(--mono);font-size:12px;color:var(--t2);white-space:nowrap}
.p3a1-r .p3a1-qq{margin-left:auto;font-family:var(--mono);font-size:14px;color:var(--t1);white-space:nowrap;text-align:right}
.p3a1-r .p3a1-mm{font-family:var(--mono);font-size:14px;color:var(--t0);width:54px;flex:none;text-align:right}
.p3a1-eq{font-size:12px;color:var(--t1);background:var(--haut);border-radius:10px;padding:0 5px;line-height:18px;white-space:nowrap}
.p3a1-dou{font-size:12px;color:var(--attt);border:1px dashed var(--attt);border-radius:10px;padding:0 5px;line-height:18px;background:#fff;white-space:nowrap}
.p3a1-ob{min-height:36px;min-width:24px;display:flex;align-items:center;gap:6px}
.p3a1-sous .p3a1-r{padding-left:28px}
.p3a1-sous .p3a1-nm{color:var(--t1)}
.p3a1-li.p3a1-d{background:var(--attf)}
.p3a1-li.p3a1-d.p3a1-ok{background:#fff}
.p3a1-fix{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 10px 4px 34px}
.p3a1-fix .p3a1-st{font-size:12px;color:var(--t2)}
.p3a1-fix .p3a1-st b{font-family:var(--mono);font-weight:500}
.p3a1-fix button{min-height:24px;padding:0 8px;border-radius:10px;font-size:12px;border:1.5px dashed var(--attt);background:#fff;color:var(--t0);font-weight:600}
.p3a1-fix button.p3a1-sec{border:1px solid var(--bordm);font-weight:400}
.p3a1-seg{display:inline-flex;border:1px solid var(--bordm);border-radius:10px;overflow:hidden}
.p3a1-seg button{min-height:24px;min-width:32px;padding:0 8px;font-size:12px;border:0!important;border-radius:0!important;font-weight:400!important}
.p3a1-seg button[aria-pressed="true"]{background:var(--t0);color:#fff}
.p3a1-mb{white-space:nowrap;flex:none;min-height:24px;min-width:32px;display:inline-flex;align-items:center;justify-content:center;gap:3px;padding:0 6px;border-radius:10px;font-size:12px;border:1.5px dashed var(--attt);color:var(--attt);background:#fff}
.p3a1-mb.p3a1-lie{border:1px solid var(--bordm);color:var(--t1)}
.p3a1-mb.p3a1-tous{border:1px solid var(--malt);background:var(--malt);color:var(--t0);font-weight:600}
.p3a1-plat{padding:4px 10px 8px 34px;display:flex;flex-direction:column;gap:6px;background:var(--panel);border-top:1px solid var(--bord)}
.p3a1-plat .p3a1-k{font-size:12px;color:var(--t2)}
.p3a1-in{height:32px;border:1px solid var(--bordm);border-radius:10px;padding:0 6px;font-size:16px;font-family:var(--mono);width:72px;background:#fff}
.p3a1-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
@keyframes p3a1-eclair{0%{background:#F3D27A}100%{background:transparent}}
.p3a1-eclair{animation:p3a1-eclair 1.6s ease-out 1;outline:2px solid var(--attt);outline-offset:-2px}
.p3a1-garde{background:#F7E3B0!important;outline:2px solid var(--attt);outline-offset:-2px}
@media (prefers-reduced-motion:reduce){.p3a1-eclair{animation:none;background:#F7E3B0}}
.p3a1-fin{display:flex;gap:6px;padding:8px 10px;flex-wrap:wrap;align-items:center}
.p3a1-fin .p3a1-det{margin-left:auto;font-size:12px;color:var(--t2)}
.p3a1-fin .p3a1-det b{font-family:var(--mono);color:var(--t1);font-weight:500}
.p3a1-rub{display:flex;flex-direction:column;padding:4px 8px 12px}
.p3a1-rb{display:flex;align-items:center;gap:8px;min-height:36px;border-bottom:1px solid var(--bord);padding:0 4px;text-align:left;width:100%}
.p3a1-rb span{font-size:14px;color:var(--t1)}
.p3a1-rb em{margin-left:auto;font-style:normal;font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%}
.p3a1-rbo{padding:6px 4px 8px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--bord)}
.p3a1-kv{display:grid;grid-template-columns:84px 1fr;gap:4px 8px;font-size:14px}
.p3a1-kv span{font-size:12px;color:var(--t2)}
.p3a1-kv b{font-family:var(--mono);font-weight:500;color:var(--t0)}
/* Le pied : la bascule papier / catégorie et Confirmer, jamais bloqué. Rien sur Drive avant Confirmer. */
.p3a1-pied{flex:none;position:relative;z-index:9;height:52px;display:flex;align-items:center;gap:8px;padding:0 8px;background:var(--page);border-top:1px solid var(--bord)}
.p3a1-ord{display:inline-flex;border:1px solid var(--bordm);border-radius:10px;overflow:hidden}
.p3a1-ord button{min-height:32px;padding:0 10px;font-size:14px}
.p3a1-ord button[aria-pressed="true"]{background:var(--t0);color:#fff}
.p3a1-conf{margin-left:auto;min-height:36px;padding:0 14px;border-radius:10px;background:var(--t0);color:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
/* Finances (l'écran où il se trouve après Confirmer) et la notification d'échec. */
.p3a1-fin-ec{min-height:100vh;background:var(--page)}
.p3a1-alerte{position:sticky;top:0;z-index:20;background:var(--err);color:#fff;padding:10px 10px 10px;display:flex;flex-direction:column;gap:8px}
.p3a1-alerte .p3a1-at{display:flex;gap:8px;align-items:flex-start}
.p3a1-alerte strong{font-size:16px;font-weight:700;line-height:1.2}
.p3a1-alerte p{font-size:14px;color:#fff}
.p3a1-alerte .p3a1-ab{display:flex;gap:6px;flex-wrap:wrap}
.p3a1-alerte button{min-height:32px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:600;background:#fff;color:var(--err)}
.p3a1-alerte button.p3a1-sec{background:transparent;color:#fff;border:1.5px solid #fff}
.p3a1-fh{height:44px;display:flex;align-items:center;padding:0 12px;font-size:16px;font-weight:600;color:var(--t0);border-bottom:1px solid var(--bord)}
.p3a1-tabs{display:flex;gap:4px;padding:6px 8px}
.p3a1-tabs span{min-height:28px;display:inline-flex;align-items:center;padding:0 10px;border-radius:10px;font-size:14px;border:1px solid var(--bord)}
.p3a1-tabs span.on{background:var(--t0);color:#fff;border-color:var(--t0)}
.p3a1-jr{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border-bottom:1px solid var(--bord)}
.p3a1-jr .p3a1-jn{font-size:14px;color:var(--t0)}
.p3a1-jr .p3a1-jd{font-size:12px;color:var(--t2)}
.p3a1-jr .p3a1-jm{margin-left:auto;font-family:var(--mono);font-size:14px;color:var(--t0)}
.p3a1-jr.p3a1-jerr{background:var(--errf)}
.p3a1-nav{position:fixed;left:0;right:0;bottom:0;height:52px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--bord);background:#fff;font-size:12px;color:var(--t2)}
.p3a1-nav span.on{color:var(--t0);font-weight:600}
@keyframes p3a1-tourne{to{transform:rotate(360deg)}}
.p3a1-tour{animation:p3a1-tourne 1.2s linear infinite}
.p3a1-just{border:2px solid var(--err);border-radius:16px;padding:8px;display:flex;gap:10px;background:#fff}
.p3a1-doc{width:92px;flex-shrink:0;border:1px solid var(--bordm);border-radius:4px;padding:5px;display:flex;flex-direction:column;gap:2px;background:#fff;font-size:12px;line-height:1.05;color:var(--t1)}
.p3a1-doc b{font-size:12px}
.p3a1-just .p3a1-jx{display:flex;flex-direction:column;gap:6px;min-width:0}
.p3a1-errt{font-size:14px;color:var(--err);font-weight:600}
.p3a1-steps{display:flex;gap:6px}
.p3a1-steps span{flex:1;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--t2)}
.p3a1-steps span i{height:6px;border-radius:10px;background:var(--haut)}
.p3a1-steps .p3a1-sf{color:var(--t1)}.p3a1-steps .p3a1-sf i{background:var(--t1)}
.p3a1-steps .p3a1-sc{color:var(--t0);font-weight:600}
.p3a1-steps .p3a1-sc i{background:repeating-linear-gradient(90deg,var(--t1) 0 6px,var(--haut) 6px 12px);background-size:24px 6px;animation:p3a1-run 1s linear infinite}
@keyframes p3a1-run{to{background-position:24px 0}}
.p3a1-vide{margin:8px;border:1px dashed var(--bordm);border-radius:16px;min-height:120px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t2)}
.p3a1-annexe{padding:12px;display:flex;flex-direction:column;gap:8px;max-width:640px}
.p3a1-annexe a{color:var(--bleu);font-size:14px}
.p3a1-annexe p{font-size:14px}
/* Les axes des autres variantes (gardés éteints ici par CFG). */
button.p3a1-gh{width:100%;text-align:left;border-left:0;border-right:0}
.p3a1-chev{width:16px;font-size:16px;color:var(--t1);text-align:center}
.p3a1-gh-bande .p3a1-gh{background:var(--catf,var(--panel));border-top:0;border-bottom:0;height:30px}
.p3a1-gh-bande [data-groupe="malt"] .p3a1-gh{--catf:#F1E3C6}.p3a1-gh-bande [data-groupe="houb"] .p3a1-gh{--catf:#DCEBD8}.p3a1-gh-bande [data-groupe="lev"] .p3a1-gh{--catf:#DCE4F2}.p3a1-gh-bande [data-groupe="mout"] .p3a1-gh{--catf:#F3EAD6}

.p3a1-toast button.p3a1-sec{background:transparent;color:#fff;border:1.5px solid #fff}
.p3a1-toast .p3a1-tx{position:absolute;top:6px;right:4px;background:transparent;color:#fff;min-height:32px;padding:0}

 else if(ETAT==='echec'&&CFG.notif==='carte')h=finances('','err')+'<div class="'+P+'carte">'+notifEchec('flot')+'</div>';

function viser(cible){
 var ns=[];
 if(cible==='liste'){var f=document.querySelector('[data-ligne]');if(f)f.scrollIntoView({block:'start',behavior:'smooth'});return;}
 if(/^l\d+$/.test(cible))ns=[Number(cible.slice(1))];
 else if(/^\d+$/.test(cible))ns=[Number(cible)];
 else ns=L.filter(function(x){return lienDe(x)===cible;}).map(function(x){return x.n;});
 if(!ns.length)return;
 var mot={relie:'reliés',neuf:'nouveaux',bis:'bis',precis:'unité ?',mouture:'moutures'}[cible]||L.filter(function(x){return x.n===ns[0];})[0].nm;
 if(CFG.renvoi==='filtre'){S.filtre={mot:mot,ns:ns};S.garde=ns.slice();rendre();var lz=document.getElementById(P+'liste');if(lz)lz.scrollIntoView({block:'start'});return;}
 if(CFG.renvoi==='plier'){var cs={};ns.forEach(function(n){var x=L.filter(function(y){return y.n===n;})[0];cs[CFG.mout==='sous'&&x.c==='mout'?'malt':x.c]=1;});
  S.plie={};['malt','houb','lev','mout'].forEach(function(c){if(!cs[c])S.plie[c]=true;});S.garde=ns.slice();rendre();}
 var premier=document.getElementById(P+'l'+ns[0]);if(premier)premier.scrollIntoView({block:'start',behavior:ETAT==='renvoi'?'auto':'smooth'});
 ns.forEach(function(n){var e=document.getElementById(P+'l'+n);if(!e)return;e.classList.remove(P+'eclair');void e.offsetWidth;e.classList.add(P+'eclair');});
 S.garde=ns.slice();setTimeout(function(){S.garde=[];},1600);
}

})();
