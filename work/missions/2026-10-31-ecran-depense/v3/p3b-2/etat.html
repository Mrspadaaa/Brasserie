<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>p3b-2 — Nouvelle dépense · les tiroirs (passe 3, 01.11)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--page:#FFFFFF;--panel:#F5F5F5;--haut:#EBEBEB;--bord:#DDDDDD;--bordm:#BFBFBF;--t2:#666666;--t1:#333333;--t0:#111111;
--attt:#7F5B10;--attf:#FBF4E4;--ok:#2F6B45;--okf:#E7F3EA;--err:#A3322A;--errf:#FBEAE8;
--malt:#C9A15A;--houb:#5E9A52;--lev:#5C7FB8;--mout:#D9C49A;
--sans:"Source Sans 3",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
--hach:repeating-linear-gradient(135deg,#C9B48A 0 2px,#fff 2px 5px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--t1);font-family:var(--sans);font-size:14px;line-height:1.3;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg path,svg circle,svg rect{vector-effect:non-scaling-stroke;stroke-width:1.5}
.p3b2-m{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* Plein écran : en-tête 40 px, une zone qui défile, le pied. */
.p3b2-scr{height:100vh;height:100dvh;display:flex;flex-direction:column}
.p3b2-sc{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.p3b2-fs{min-height:100vh}
.p3b2-hd{flex:none;height:40px;display:flex;align-items:center;gap:4px;padding:0 4px;border-bottom:1px solid var(--bord)}
.p3b2-hd h1{flex:1;font-size:16px;font-weight:600;color:var(--t0)}
.p3b2-ib{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.p3b2-ib:active{background:var(--haut)}
.p3b2-etb{flex:none;display:flex;align-items:center;min-height:28px;padding:0 10px;font-size:12px}
.p3b2-etb.p3b2-hl{background:var(--t1);color:#fff}
.p3b2-etb.p3b2-rv{background:var(--errf);color:var(--err);font-weight:600}
.p3b2-grid{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"recap" "liste" "rub";gap:8px;padding:8px 8px 0}
.p3b2-recap{grid-area:recap;display:flex;flex-direction:column;gap:8px}
.p3b2-liste{grid-area:liste;min-width:0;display:flex;flex-direction:column;gap:4px}
.p3b2-rub{grid-area:rub}
/* Le récap de r2b, et sous la barre des 23 lignes, la barre des quatre tiroirs : un toucher ouvre le sien. */
.p3b2-bd{background:var(--panel);border:1px solid var(--bord);border-radius:16px;padding:6px 10px 8px;display:flex;flex-direction:column;gap:4px}
.p3b2-bd1{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.p3b2-four{font-size:16px;font-weight:600;color:var(--t0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p3b2-date{min-height:24px;padding:0 4px;border-radius:10px;font-size:14px;border-bottom:1px dotted var(--bordm)}
.p3b2-bd2{display:flex;align-items:center;gap:8px}
.p3b2-tot{font-family:var(--mono);font-size:32px;line-height:1.1;font-weight:600;color:var(--t0)}
.p3b2-tot small{font-size:12px;font-weight:500;color:var(--t2)}
.p3b2-n23{margin-left:auto;min-height:28px;display:inline-flex;align-items:center;gap:4px;padding:0 8px;border-radius:10px;border:1px solid var(--bord);background:#fff;font-size:14px}
.p3b2-n23 svg{color:var(--ok)}
.p3b2-bar{display:flex;height:10px;border-radius:9px;overflow:hidden;background:#fff;border:1px solid var(--bord)}
.p3b2-bar button{height:100%;min-width:4px;border-right:1.5px solid #fff}
.p3b2-bar button:last-child{border-right:0}
.p3b2-f-malt{background:var(--malt)}.p3b2-f-houb{background:var(--houb)}.p3b2-f-lev{background:var(--lev)}.p3b2-f-mout{background:var(--mout)}
.p3b2-bar .p3b2-dt{background:var(--hach)}
.p3b2-cat{display:flex;gap:3px;height:24px}
.p3b2-cat button{height:24px;border-radius:10px;min-width:24px;position:relative}
.p3b2-cat button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--t0)}
.p3b2-pv{background:#fff;border:1px solid var(--bord);border-radius:16px;padding:2px 10px 6px}
.p3b2-rr{display:grid;grid-template-columns:16px 1fr auto;align-items:center;gap:6px;min-height:28px;border-bottom:1px solid var(--bord);font-size:14px;width:100%;text-align:left}
.p3b2-rr svg{color:var(--ok)}
.p3b2-rr b{font-family:var(--mono);font-weight:500;color:var(--t0)}
.p3b2-cnt{display:flex;flex-wrap:wrap;gap:4px;padding-top:6px}
.p3b2-pa{min-height:24px;display:inline-flex;align-items:center;gap:3px;padding:0 6px 0 4px;border-radius:10px;border:1px solid var(--bord);background:#fff;font-size:12px}
.p3b2-pa b{font-family:var(--mono);font-weight:600;font-size:12px;color:var(--t0)}
.p3b2-pa.p3b2-dt{border:1.5px dashed var(--attt);background:var(--attf)}
.p3b2-pa[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--t0)}
.p3b2-tu{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.p3b2-tile{position:relative;border:1px solid var(--bord);border-radius:16px;padding:4px 8px 4px 30px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:52px;background:#fff}
.p3b2-tile .p3b2-k{font-size:12px;color:var(--t2)}
.p3b2-tile .p3b2-v{font-size:14px;color:var(--t0);display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.p3b2-tile.p3b2-dt{border:1.5px dashed var(--attt);background:var(--attf)}
.p3b2-no{position:absolute;left:7px;top:16px;width:18px;height:18px;border-radius:50%;border:1.5px dashed var(--attt);color:var(--attt);font-family:var(--mono);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;background:#fff}
.p3b2-no.p3b2-nin{position:static;flex:none}
.p3b2-fait .p3b2-no,.p3b2-no.p3b2-fait{border:1.5px solid var(--ok);background:var(--ok);color:#fff}
.p3b2-sup{font-size:12px;color:var(--attt);border:1px dashed var(--attt);border-radius:10px;padding:0 5px;line-height:18px;background:#fff;white-space:nowrap}
.p3b2-val2 b{font-family:var(--mono);font-weight:600;font-size:14px;color:var(--attt);border:1px dashed var(--attt);border-radius:10px;padding:0 4px;background:#fff;margin-right:3px}
.p3b2-pan{border:2px solid var(--t0);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px;background:#fff}
.p3b2-calc{font-size:12px;color:var(--t1)}
.p3b2-calc b{font-family:var(--mono);font-weight:600}
.p3b2-ch{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.p3b2-ch button{min-height:28px;padding:0 10px;border-radius:10px;border:1px solid var(--bordm);font-size:14px;background:#fff}
.p3b2-pri{background:var(--t0)!important;border-color:var(--t0)!important;color:#fff!important;font-weight:600}
.p3b2-ch button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--t0);font-weight:600}
.p3b2-tv3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.p3b2-tv3 button{border:1px solid var(--bord);border-radius:10px;padding:6px;display:flex;flex-direction:column;gap:2px;text-align:left;background:#fff}
.p3b2-tv3 b{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--t0);line-height:1.1}
.p3b2-tv3 small{font-size:12px;color:var(--t2)}
.p3b2-tv3 .p3b2-prop{border:1.5px solid var(--ok);background:var(--okf)}
.p3b2-tv3 .p3b2-prop small{color:var(--ok)}
.p3b2-in{height:32px;border:1px solid var(--bordm);border-radius:10px;padding:0 8px;font-size:16px;font-family:var(--mono);width:96px;background:#fff}
.p3b2-ev{font-size:12px;color:var(--t2)}
/* Les tiroirs : un en-tête repliable qui porte ses chiffres et sa part des 86,50 ; dedans, les lignes en tuiles, deux par rangée. */
.p3b2-ctl{display:flex;align-items:center;gap:6px;min-height:32px}
.p3b2-seg{display:inline-flex;border:1px solid var(--bordm);border-radius:10px;overflow:hidden}
.p3b2-seg button{min-height:28px;padding:0 10px;font-size:14px}
.p3b2-seg button[aria-pressed="true"]{background:var(--t0);color:#fff;font-weight:600}
.p3b2-dep{margin-left:auto;min-height:28px;padding:0 10px;border-radius:10px;border:1px solid var(--t0);background:var(--t0);color:#fff;font-size:14px;font-weight:600}
.p3b2-tir{border-radius:16px;border:1px solid var(--bord);overflow:hidden;background:#fff}
.p3b2-dw{position:sticky;top:0;z-index:3;width:100%;display:grid;grid-template-columns:16px 10px minmax(0,1fr) 44px auto auto;align-items:center;column-gap:6px;min-height:34px;padding:0 10px 0 8px;text-align:left;font-weight:600}
.p3b2-dw .p3b2-cv{transition:transform .18s}
.p3b2-dw[aria-expanded="false"] .p3b2-cv{transform:rotate(-90deg)}
.p3b2-dw i{width:10px;height:10px;border-radius:50%}
.p3b2-dw .p3b2-dn{display:flex;align-items:baseline;gap:6px;white-space:nowrap;min-width:0}
.p3b2-dw .p3b2-dn small{font-family:var(--mono);font-size:12px}
.p3b2-dw .p3b2-pt{height:8px;border-radius:9px;background:rgba(255,255,255,.7);overflow:hidden}
.p3b2-dw .p3b2-pt span{display:block;height:100%}
.p3b2-dw .p3b2-dq,.p3b2-dw .p3b2-da{font-family:var(--mono);font-size:13px;text-align:right;white-space:nowrap}
.p3b2-dw .p3b2-da{min-width:48px}
.p3b2-g-malt .p3b2-dw{background:#F3E6CB;color:#57400C}.p3b2-g-malt i,.p3b2-g-malt .p3b2-pt span{background:var(--malt)}
.p3b2-g-houb .p3b2-dw{background:#DDEDD8;color:#2C5524}.p3b2-g-houb i,.p3b2-g-houb .p3b2-pt span{background:var(--houb)}
.p3b2-g-lev .p3b2-dw{background:#DEE6F4;color:#284673}.p3b2-g-lev i,.p3b2-g-lev .p3b2-pt span{background:var(--lev)}
.p3b2-g-mout .p3b2-dw{background:#F1EADC;color:#574928}.p3b2-g-mout i,.p3b2-g-mout .p3b2-pt span{background:var(--mout)}
.p3b2-gr{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px}
.p3b2-T{border:1px solid var(--bord);border-radius:10px;background:#fff;min-width:0}
.p3b2-T.p3b2-dt{border:1.5px dashed var(--attt);background:var(--attf)}
.p3b2-T.p3b2-wide{grid-column:1/-1}
.p3b2-T[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--t0)}
.p3b2-tb{width:100%;display:grid;grid-template-columns:16px minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:5px;align-items:center;min-height:40px;padding:3px 6px;text-align:left}
.p3b2-tb .p3b2-ico{grid-row:1/3;color:var(--t1);display:flex}
.p3b2-tb .p3b2-ico.p3b2-q{color:var(--attt)}
.p3b2-tb b{grid-column:2/4;font-size:14px;font-weight:600;color:var(--t0);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p3b2-tb .p3b2-r2{grid-column:2;display:flex;align-items:center;gap:4px;min-width:0;white-space:nowrap;overflow:hidden;font-family:var(--mono);font-size:12px;color:var(--t1)}
.p3b2-tb .p3b2-r2 .p3b2-bad{color:var(--attt);font-weight:600}
.p3b2-tb .p3b2-mt{grid-column:3;font-family:var(--mono);font-size:14px;font-weight:500;color:var(--t0)}
.p3b2-cvp{font-family:var(--sans);font-size:12px;color:var(--t1);background:var(--haut);border-radius:10px;padding:0 5px;line-height:16px}
.p3b2-fix{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:0 6px 5px 6px}
.p3b2-fix button{min-height:24px;min-width:24px;padding:0 7px;border-radius:10px;border:1px solid var(--bordm);background:#fff;font-size:12px}
.p3b2-fix button.p3b2-ac{border:1.5px dashed var(--attt);color:var(--attt);font-weight:600}
.p3b2-fix .p3b2-q2{font-size:12px;color:var(--t2)}
.p3b2-dwact{display:flex;gap:6px;padding:4px 4px 0}
.p3b2-dwact button{min-height:24px;padding:0 8px;border-radius:10px;font-size:12px;border:1px solid var(--bordm);background:#fff}
.p3b2-dwact .p3b2-tous{background:var(--t0);border-color:var(--t0);color:#fff;font-weight:600}
.p3b2-papier{display:flex;flex-direction:column;gap:4px}
.p3b2-papier .p3b2-T .p3b2-tb{grid-template-columns:22px 16px minmax(0,1fr) auto}
.p3b2-papier .p3b2-tb .p3b2-ico{grid-column:2}
.p3b2-papier .p3b2-tb b{grid-column:3/5}
.p3b2-papier .p3b2-tb .p3b2-r2{grid-column:3}
.p3b2-papier .p3b2-tb .p3b2-mt{grid-column:4}
.p3b2-papier .p3b2-nn{grid-column:1;grid-row:1/3;font-family:var(--mono);font-size:12px;color:var(--t2)}
.p3b2-plat{margin:0 4px 4px}
@keyframes p3b2-fl{0%{background:#F2D58F}100%{background:transparent}}
.p3b2-eclair{animation:p3b2-fl 1.1s ease-out}
@media (prefers-reduced-motion:reduce){.p3b2-eclair{animation:none}.p3b2-dw .p3b2-cv{transition:none}}
.p3b2-ru{display:flex;align-items:center;gap:8px;min-height:36px;border-bottom:1px solid var(--bord);padding:0 4px;width:100%;text-align:left}
.p3b2-ru .p3b2-rk{font-size:14px;white-space:nowrap}
.p3b2-ru .p3b2-rv2{flex:1;min-width:0;font-size:12px;color:var(--t2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p3b2-ref{display:grid;grid-template-columns:84px 1fr;gap:4px 8px;padding:6px 4px 8px;font-size:12px;color:var(--t2)}
.p3b2-ref b{font-family:var(--mono);font-weight:500;font-size:14px;color:var(--t0)}
.p3b2-act{display:flex;gap:6px;padding:8px 0}
.p3b2-act button{flex:1;min-height:32px;border-radius:10px;border:1px dashed var(--bordm);font-size:14px}
.p3b2-lb{min-height:28px;padding:0 10px;border-radius:10px;border:1px solid var(--bordm);font-size:14px;color:var(--t1);background:#fff}
.p3b2-lb.p3b2-lon{background:var(--t0);border-color:var(--t0);color:#fff;font-weight:600}
.p3b2-det{font-size:12px;color:var(--t2);text-align:right;padding:0 4px 8px}
.p3b2-det b{font-family:var(--mono);color:var(--t0);font-weight:500}
.p3b2-pied{flex:none;height:52px;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;border-top:1px solid var(--bord)}
.p3b2-go{min-height:36px;padding:0 16px;border-radius:10px;background:var(--t0);color:#fff;font-size:16px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
/* Finances : la dépense rangée ; si Drive échoue, une pastille rouge reste sur sa ligne, et un toast qui ne part pas seul. */
.p3b2-fh{height:40px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--bord)}
.p3b2-fh h1{font-size:16px;font-weight:600;color:var(--t0);flex:1}
.p3b2-jr{padding:4px 8px 220px}
.p3b2-jl{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:6px;min-height:48px;border-bottom:1px solid var(--bord);padding:0 4px}
.p3b2-jl .p3b2-jd{font-family:var(--mono);font-size:12px;color:var(--t2)}
.p3b2-jl b{display:block;font-size:14px;font-weight:600;color:var(--t0)}
.p3b2-jl small{font-size:12px;color:var(--t2)}
.p3b2-jl .p3b2-ja{font-family:var(--mono);font-size:14px;color:var(--t0)}
.p3b2-jl.p3b2-ko{background:var(--errf);border-radius:10px;border:1.5px solid var(--err)}
.p3b2-pst{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:0 8px;border-radius:10px;background:var(--err);color:#fff;font-size:12px;font-weight:600;margin-top:2px}
.p3b2-nav{position:fixed;left:0;right:0;bottom:0;height:56px;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--bord);background:var(--page);z-index:5}
.p3b2-nav span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--t2)}
.p3b2-nav span.p3b2-on{color:var(--t0);font-weight:600}
.p3b2-toast{position:fixed;left:8px;right:8px;bottom:64px;z-index:6;background:var(--err);color:#fff;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.p3b2-toast h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.p3b2-toast p{font-size:14px}
.p3b2-toast .p3b2-ch button{background:#fff;color:var(--err);border-color:#fff;font-weight:600;min-height:32px}
.p3b2-toast .p3b2-ch button.p3b2-sec{background:transparent;color:#fff}
.p3b2-toast .p3b2-x{position:absolute;right:6px;top:6px;width:28px;height:28px;color:#fff;border-radius:10px}
.p3b2-info{position:fixed;left:50%;transform:translateX(-50%);bottom:64px;z-index:6;min-height:28px;display:inline-flex;align-items:center;padding:0 10px;border-radius:10px;background:var(--t1);color:#fff;font-size:12px}
.p3b2-steps{display:flex;gap:6px}
.p3b2-steps span{flex:1;display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--t2)}
.p3b2-steps span i{height:6px;border-radius:9px;background:var(--haut)}
.p3b2-steps .p3b2-fa i{background:var(--t1)}
.p3b2-steps .p3b2-co{color:var(--t0);font-weight:600}
.p3b2-steps .p3b2-co i{background:repeating-linear-gradient(90deg,var(--t1) 0 6px,var(--haut) 6px 12px);background-size:24px 6px;animation:p3b2-run 1s linear infinite}
@keyframes p3b2-run{to{background-position:24px 0}}
.p3b2-vide{border:1px dashed var(--bordm);border-radius:16px;padding:12px;font-size:14px;color:var(--t2);text-align:center}
.p3b2-ann{max-width:1180px;margin:24px auto 72px;padding:12px;border-top:2px solid var(--t0);font-size:12px;color:var(--t2);display:flex;flex-direction:column;gap:6px}
.p3b2-ann h2{font-size:14px;color:var(--t0)}
.p3b2-ann nav{display:flex;flex-wrap:wrap;gap:4px}
.p3b2-ann a{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border:1px solid var(--bordm);border-radius:10px;color:var(--t1);text-decoration:none}
.p3b2-ann a[aria-current="true"]{background:var(--t0);color:#fff}
@media (min-width:900px){
 .p3b2-grid{grid-template-columns:400px minmax(0,840px);grid-template-areas:"recap liste" "rub liste";grid-template-rows:auto 1fr;align-items:start;justify-content:center;gap:8px 20px;padding:12px 16px 0}
 .p3b2-recap{position:static}
 .p3b2-jr{max-width:820px;margin:0 auto}
 .p3b2-gr{grid-template-columns:repeat(3,1fr)}
 .p3b2-toast{left:auto;right:24px;width:420px}
}
.p3b2-nav{display:block;height:44px}
.p3b2-navi{max-width:448px;margin:0 auto;display:flex;height:100%}
.p3b2-nav span{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;color:var(--t1)}

  var PTS={p1:0,p2:0,p3:0,p4:0,p5:0,p6:0};
  var S={etat:'repos',mode:'cat',ouvert:{malt:1,lev:1,houb:1,mout:1},plie:null,mout:{},unite:{},tva:null,sel:null,panel:null,ecran:'depense',drive:null,reseau:true,rouverte:false,retire:{},val:{},vise:null};
  var chf=function(c){return (c<0?'−':'')+(Math.abs(c)/100).toFixed(2).replace('.',',')};
  var $=function(s){return document.querySelector(s)};
  var cube='<path d="M10 2.5 17 6v8l-7 3.5L3 14V6z"/><path d="M3 6l7 3.5L17 6M10 9.5v8"/>';

  var chev='<svg class="p3b2-cv" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor"><path d="M5 8l5 5 5-5"/></svg>';
  var MOTS={relie:'relié',neuf:'nouvel article',bis:'article bis',precis:'unité à préciser',mout:'mouture'};
  function lg(n){for(var i=0;i<L.length;i++)if(L[i][0]===n)return L[i];return null}

  function etatStock(l){if(l[8]==='mout')return 'mout';if(l[9].s==='precis'&&S.unite[20])return 'relie';return l[9].s}
  function unit(l){return l[0]===20?(S.unite[20]||null):l[5]}

  function somme(){return vivantes().reduce(function(a,l){return a+montant(l)},0)}
  function comptes(){var c={relie:0,neuf:0,bis:0,precis:0,mout:0};vivantes().forEach(function(l){c[etatStock(l)]++});return c}

    var segs=L.map(function(l){var dt=doute(l)&&!S.retire[l[0]];return '<button type="button" class="p3b2-f-'+l[8]+(dt?' p3b2-dt':'')+'" style="flex:'+Math.max(montant(l),40)+' 1 0" data-seg="'+l[0]+'" aria-label="Ligne '+l[0]+' · '+l[3]+'"></button>'}).join('');

     +'<div class="p3b2-rr" style="border-bottom:0"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor"><path d="M5 2.5h7l3 3v12H5z"/></svg><span>Page 2 coupée · argent complet</span><span></span></div>'

  function pa(k,n,mot,dt){return '<button type="button" class="p3b2-pa'+(dt?' p3b2-dt':'')+'" data-va="'+k+'" aria-pressed="'+(S.vise===k)+'" aria-label="'+n+' '+mot+'" data-booster="renvoi">'+ico(k,14)+'<b>'+n+'</b>'+mot+(k==='mout'&&dt?' <span class="p3b2-m">+1,50</span>':'')+'</button>'}

    return '<div class="p3b2-tu"><button type="button" class="p3b2-tile'+(t1?' p3b2-fait':' p3b2-dt')+'" data-pan="tva" data-booster="tva"><span class="p3b2-no">1</span><span class="p3b2-k">TVA</span><span class="p3b2-v">'+tv+'</span></button>'

  function panPaye(){return '<div class="p3b2-pan"><div class="p3b2-ch"><button type="button" aria-pressed="true" data-booster="reglement">Déjà payé</button><button type="button">À payer</button><span class="p3b2-ev">E-Finance · lu</span></div><div class="p3b2-calc">Payé le : non imprimé · « Betrag per E-Finance dankend erhalten »</div><div class="p3b2-ch"><button type="button" class="p3b2-pri" data-paye="ok">C\'est la date de la facture</button><button type="button" data-paye="autre">Autre date</button></div></div>'}

  // Une ligne = une tuile : nom ; quantité imprimée et pastilles ; montant. Le doute se règle dans la tuile.
  function tuile(l,papier){
    var n=l[0],st=etatStock(l),dt=doute(l),u=unit(l),r2='';
    if(l[8]==='mout'){r2='→ '+lg(l[9].p)[3].split(' ')[0]+(S.mout[n]==='att'?' <span class="p3b2-cvp" style="background:var(--okf);color:var(--ok)">✓</span>':'')}

    GR.forEach(function(g){var f=g[0],t=sousTotal(f),o=!!S.ouvert[f],dans=vivantes().filter(function(l){return l[8]===f});if(!dans.length)return;

        h+='<div class="p3b2-gr">'+dans.map(function(l){return tuile(l)}).join('')+'</div>'}
      h+='</section>';});
    return h;
  }

    if(S.etat==='lecture') return '<div class="p3b2-act"><button type="button" data-booster="ajouter">+ Ajouter une ligne</button></div>'
     +'<div class="p3b2-ru"><span class="p3b2-rk">Règlement</span><span class="p3b2-rv2"><button type="button" class="p3b2-lb" aria-pressed="false" data-booster="reglement">Déjà payé</button> <button type="button" class="p3b2-lb">À payer</button></span></div>'
