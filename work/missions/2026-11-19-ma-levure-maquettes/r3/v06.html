<!doctype html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ma levure — r3 v06 : la consigne de brassage</title>
<!--
  r3, version 6 sur 8, parti « 6. La consigne de brassage », passe de correction (19.11, cinq critiques).
  Base : v01, haut repris tel quel : en-tête, carte à bord noir, nom · dose en haut à droite · ×, FG / fiche · conduite
  (avec « Caler à 11 °C ») / floculation, Compléter la fiche, Changer de levure, pied, + volant, onglets.
  Décision : sous les cases, la consigne « Ensemencer [− 2 sachets +] », UN seul réglage (la dose), puis la conduite
  lue en une ligne avec son petit profil en marches ; un toucher ouvre le graphe de l'app, jamais de compteurs.
  Le minimum du fabricant (≥ 15 g ÷ sachet 11,5 g = 2) est un plancher, pas un besoin calculé.
  Écart à v01 : les cinq lignes d'effets deviennent trois cases à crans et valeur (comme v01) ; les deux vides vont
  dans le compteur de « Compléter la fiche » (B8). Offres, Repères, Atelier : trois entrées d'un toucher, sur une ligne (B7).
  Statique : HTML et CSS seuls. Données : exemple (Munich Lager Yeast, 20 L à 1,026, FG 1,006–1,007 de sa capture).
-->
<style>
:root{
    --page:#FFFFFF; --panneau:#F5F5F5; --sur:#EBEBEB; --bord:#DDDDDD; --bord2:#BFBFBF; --trait:#9E9E9E;
    --t2:#666666; --t1:#333333; --t0:#111111;
    --or:#7A5A12; --or-aplat:#F2C14E; --att:#9C7020; --alerte:#C8382F; --alerte-t:#A8291F; --prod:#9A4F1E; --eau:#4F7E9B; --vert:#567F45;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--page);color:var(--t0)}
  body{font:15px/1.3 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
  .c6-mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;letter-spacing:-.01em}
  .c6-esp{flex:1}
  .c6-gris{color:var(--t2)}

  /* Planche : écrans 390 × 844 côte à côte, le premier à l'origine */
  .c6-rang{display:flex;gap:28px;align-items:flex-start;width:100%;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 0 40px}
  .c6-rang::after{content:"";flex:none;width:1px}
  .c6-cadre{margin:0;width:390px;flex:none;scroll-snap-align:start}
  .c6-ecran{position:relative;width:390px;height:844px;overflow:hidden;background:var(--page);outline:1px solid var(--bord2)}
  .c6-cadre figcaption{padding:12px 6px 0;font-size:15px;color:var(--t1);line-height:1.4}
  .c6-cadre figcaption b{font-size:16px;color:var(--t0)}
  .c6-num{display:inline-grid;place-items:center;width:24px;height:24px;margin-right:8px;border-radius:50%;background:var(--t0);color:#fff;font-size:14px;font-weight:600}

  /* En-tête et étapes : v01 */
  .c6-tete{background:var(--page);border-bottom:1px solid var(--bord)}
  .c6-l1{display:flex;align-items:center;gap:8px;height:44px;padding:0 10px 0 6px}
  .c6-ic{width:32px;height:32px;display:grid;place-items:center;color:var(--t1)}
  .c6-titre{font-size:20px;font-weight:600;letter-spacing:-.01em}
  .c6-titre span{font-weight:400;color:var(--t2);margin-left:4px}
  .c6-lien{font-size:15px;text-decoration:underline;text-underline-offset:3px}
  .c6-etapes{display:flex;justify-content:space-between;gap:6px;padding:0 8px;white-space:nowrap;overflow:hidden}
  .c6-etapes span{font-size:14px;color:var(--t2);padding:2px 0 5px;border-bottom:4px solid var(--bord)}
  .c6-etapes span.fait{border-color:#555}
  .c6-etapes span.ici{color:var(--t0);font-weight:600;border-color:var(--t0)}

  /* Bandeau partagé (captures malts et levure) */
  .c6-band{display:flex;justify-content:space-between;align-items:center;margin:8px 8px 0;height:36px;padding:0 12px;border:1.5px solid var(--bord);border-radius:999px;background:var(--panneau);font-size:14px;color:var(--t2);white-space:nowrap}
  .c6-band b{color:var(--t0);font-size:16px;font-weight:600;margin-left:3px}
  .c6-ebc{display:inline-block;width:11px;height:11px;border-radius:50%;background:#E0A02E;margin:0 1px 0 4px;vertical-align:0}

  /* Carte : bord noir, fond panneau ; nom · dose en haut à droite · × (v01) */
  .c6-carte{margin:8px 8px 0;border:2px solid var(--t0);border-radius:16px;background:var(--panneau);overflow:hidden}
  .c6-hd{display:grid;grid-template-columns:40px 1fr auto 32px;column-gap:8px;align-items:center;padding:8px 4px 7px 10px}
  .c6-pastille{grid-row:1 / span 2;width:40px;height:40px;border-radius:50%;background:#FBEBC0;border:2px solid var(--or-aplat);display:grid;place-items:center;color:var(--or)}
  .c6-nom{min-width:0}
  .c6-nom b{display:block;font-size:20px;font-weight:600;line-height:1.15;letter-spacing:-.01em;white-space:nowrap}
  .c6-lu{white-space:nowrap;text-align:right}
  .c6-lu .c6-mono{font-size:24px;font-weight:700}
  .c6-lu em{font-style:normal;font-size:14px;color:var(--t2);margin-left:3px}
  .c6-lu.vide .c6-mono{color:var(--t2);font-weight:600;border-bottom:2px dashed var(--trait)}
  .c6-marque{grid-column:2 / span 3;font-size:14px;color:var(--t2);white-space:nowrap;margin-top:1px}
  .c6-ex{font-size:14px;color:var(--t2);border:1px solid var(--bord2);border-radius:999px;padding:0 7px}
  .c6-x{width:32px;height:32px;display:grid;place-items:center;color:var(--t1)}

  .c6-cases{display:grid;grid-template-columns:1fr 1.18fr .86fr;border-top:1px solid var(--bord2);border-bottom:1px solid var(--bord2)}
  .c6-case{padding:6px 8px 8px;min-width:0}
  .c6-case + .c6-case{border-left:1px solid var(--bord2)}
  .c6-et{font-size:14px;color:var(--t2);white-space:nowrap}
  .c6-val{font-size:16px;font-weight:600;margin-top:1px;white-space:nowrap}
  .c6-sous{font-size:14px;color:var(--t2);white-space:nowrap}
  .c6-rouge{color:var(--alerte-t)}
  .c6-jauge{position:relative;height:8px;border-radius:4px;background:var(--sur);margin-top:6px}
  .c6-jauge i{position:absolute;top:0;bottom:0;border-radius:4px;background:repeating-linear-gradient(135deg,var(--or-aplat) 0 3px,#F7DC93 3px 6px)}
  .c6-ech{display:flex;justify-content:space-between;font-size:14px;color:var(--t2);margin-top:2px}
  .c6-plage{position:relative;height:8px;border-radius:4px;margin-top:8px;background:linear-gradient(90deg,#4F7E9B,#A9C6D8 30%,#F2C14E 62%,#D6453D)}
  .c6-plage .fiche{position:absolute;top:-3px;bottom:-3px;left:24%;width:12%;border:2px solid var(--t0);border-radius:3px;background:rgba(255,255,255,.35)}
  .c6-plage .ici{position:absolute;top:-5px;bottom:-5px;left:74%;width:3px;border-radius:2px;background:var(--alerte)}
  .c6-caler{display:inline-flex;align-items:center;gap:5px;margin-top:8px;height:32px;padding:0 9px;border:1.5px solid var(--att);border-radius:10px;background:var(--page);color:var(--or);font-size:14px;font-weight:600;white-space:nowrap}
  .c6-floc{display:flex;gap:3px;margin-top:12px}
  .c6-floc i{flex:1;height:8px;border-radius:3px;background:#8C8C8C}
  .c6-floc i.non{background:var(--bord2)}

  /* La consigne : une phrase, un seul réglage (la dose) */
  .c6-consigne{background:var(--page);padding:8px 10px 4px;border-bottom:1px solid var(--bord2)}
  .c6-ligne{display:flex;align-items:center;gap:12px}
  .c6-mot{flex:none;font-size:17px;color:var(--t1)}
  .c6-mot.pt{font-size:15px;color:var(--t2);width:14px}
  .c6-pas{flex:none;display:inline-flex;align-items:stretch;height:50px;border:2px solid var(--t0);border-radius:14px;background:var(--page);overflow:hidden;box-shadow:inset 0 -4px 0 var(--or-aplat)}
  .c6-pas .m,.c6-pas .p{width:52px;display:grid;place-items:center;font-size:26px;color:var(--t0);background:var(--panneau)}
  .c6-pas .m{border-right:1px solid var(--bord)}
  .c6-pas .p{border-left:1px solid var(--bord)}
  .c6-pas .v{display:flex;align-items:baseline;justify-content:center;gap:6px;min-width:112px;padding:0 10px;align-self:center}
  .c6-pas .v b{font-size:34px;font-weight:700;line-height:1}
  .c6-pas .v em{font-style:normal;font-size:16px;color:var(--t1)}
  .c6-pas .presse{background:var(--t1);color:#fff;font-weight:600;box-shadow:inset 0 0 0 3px var(--or-aplat)}
  .c6-pas.vide{border-style:dashed;border-color:var(--trait);box-shadow:none;background:#FAFAFA}
  .c6-pas.vide .v b{color:var(--t2);font-weight:600}
  .c6-pas.vide .m{color:var(--bord2)}
  .c6-s1{display:flex;align-items:center;gap:8px;margin-top:4px;white-space:nowrap;min-height:28px}
  .c6-s2{font-size:14px;color:var(--t2);white-space:nowrap;line-height:1.35}
  .c6-g{font-size:16px;color:var(--t0);font-weight:600}
  .c6-part{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600}
  .c6-part::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
  .c6-part.ok{color:var(--vert)}
  .c6-part.sous{color:var(--alerte-t)}
  .c6-part.afaire{color:var(--t2)}
  .c6-part.afaire::before{background:transparent;border:1.5px dashed var(--t2)}
  .c6-poser{display:inline-flex;align-items:center;height:34px;padding:0 12px;border-radius:10px;background:var(--t0);color:#fff;font-size:15px;font-weight:600}
  /* Stock : une icône et son compte, sans cadre (une info, pas un bouton) ; « manque 1 » seulement quand il manque */
  .c6-stock{display:inline-flex;align-items:center;gap:5px;font-size:14px;color:var(--t2)}
  .c6-stock svg{color:var(--eau)}
  .c6-stock.manque{color:var(--or);font-weight:600}
  .c6-stock.manque svg{color:var(--att)}
  .c6-repris{display:flex;align-items:center;gap:10px;margin-top:4px;padding:0 4px 0 10px;height:36px;border-radius:10px;background:#FFF8E6;border:1.5px solid var(--att);font-size:15px;color:var(--t0);white-space:nowrap}
  .c6-annuler{margin-left:auto;font-size:15px;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:0 6px}
  .c6-cond{display:flex;align-items:center;gap:8px;height:40px;margin:4px -10px 0;padding:0 6px 0 10px;border-top:1px solid #E4E4E4}
  .c6-cond.touche{background:#EAF3FB;outline:3px solid #86B9E6;outline-offset:-3px}
  .c6-prof{flex:none}
  .c6-condt{font-size:15px;font-weight:600;white-space:nowrap}
  .c6-chev{display:grid;place-items:center;width:28px;color:var(--t1)}

  /* Fiche IA (v01) et effets en cases à crans et valeur */
  .c6-pied-carte{padding:6px 8px 6px}
  .c6-ia{display:flex;align-items:center;gap:8px;padding:0 10px;height:40px;border-radius:11px;border:1.5px dashed var(--att);background:#FFF8E6}
  .c6-etoile{display:grid;color:var(--att)}
  .c6-ia b{font-size:15px;font-weight:600}
  .c6-cpt{font-size:14px;color:var(--or);white-space:nowrap}
  .c6-effets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
  .c6-eff{padding:3px 4px 2px}
  .c6-eff .c6-et{display:flex;align-items:center;gap:5px}
  .c6-eff .d{width:10px;height:10px;border-radius:50%;background:var(--c)}
  .c6-ev{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--t1)}
  .c6-ev .cr{display:inline-flex;gap:2px;width:30px}
  .c6-ev .cr i{flex:1;height:8px;border-radius:2px;background:var(--bord)}
  .c6-ev .cr i.on{background:var(--c)}

  /* Changer de levure : v01 */
  .c6-chg{margin:6px 8px 0;padding:6px 8px;border-radius:16px;background:var(--panneau)}
  .c6-champ{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border:1.5px dashed var(--trait);border-radius:999px;background:var(--page);color:var(--t2);font-size:16px}
  .c6-puces{display:flex;gap:6px;margin-top:8px}
  .c6-puce{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 9px;border:1.5px solid var(--bord2);border-radius:12px;background:var(--page);font-size:15px;white-space:nowrap}
  .c6-puce svg{color:var(--eau)}
  .c6-puce.hc{margin-left:auto;border-style:dashed}

  /* Offres, Repères, Atelier : trois entrées d'un toucher, sur une ligne, jamais empilées (B7, R1) */
  .c6-plus{display:flex;gap:6px;margin:6px 8px 0}
  .c6-plus span{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:2px;height:36px;border:1px solid var(--bord2);border-radius:12px;background:var(--page);font-size:15px;color:var(--t1)}

  /* Pied du wizard, + volant, onglets (v01) */
  .c6-pied{position:absolute;left:0;right:0;bottom:62px;z-index:6;height:58px;display:flex;align-items:center;gap:10px;padding:0 90px 0 10px;background:var(--page);border-top:1px solid var(--bord)}
  .c6-btn{display:inline-flex;align-items:center;height:42px;padding:0 16px;border-radius:10px;font-size:16px;font-weight:600;white-space:nowrap}
  .c6-btn.noir{background:var(--t0);color:#fff}
  .c6-btn.trait{border:1px solid var(--bord2);background:var(--page)}
  .fab{position:absolute;z-index:9;bottom:70px;right:16px;width:56px;height:56px;border-radius:50%;background:var(--t0);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:300;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.28)}
  .c6-onglets{position:absolute;left:0;right:0;bottom:0;z-index:7;height:62px;display:grid;grid-template-columns:repeat(6,1fr);background:var(--page);border-top:1px solid var(--bord)}
  .c6-onglets a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--t2);font-size:14px;letter-spacing:-.02em}
  .c6-onglets a.ici{color:var(--prod);font-weight:600}
  .c6-onglets svg{width:22px;height:22px}

  /* Écran 6 : la feuille du graphe °C × jours (l5b, Conduite.tsx) */
  .c6-voile{position:absolute;inset:0;z-index:10;background:rgba(17,17,17,.38)}
  .c6-feuille{position:absolute;left:0;right:0;bottom:0;z-index:11;padding:6px 16px 20px;background:var(--page);border-radius:20px 20px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.2)}
  .c6-poignee{width:40px;height:5px;border-radius:3px;background:var(--bord2);margin:0 auto 8px}
  .c6-fhd{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  .c6-fhd b{font-size:20px;font-weight:600}
  .c6-fsous{font-size:14px;color:var(--t2)}
  .c6-g2{display:block;margin:0 -4px}
  .c6-flegende{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;white-space:nowrap}
  .c6-flegende .c6-mono{font-size:16px;font-weight:600}
  .c6-fs{color:var(--alerte-t)}
  .c6-caler.grand{height:40px;padding:0 12px;font-size:15px;margin-top:0}
</style>
</head>
<body>
<div class="c6-rang">
<figure class="c6-cadre" id="e-repos"><div class="c6-ecran" aria-label="Au repos"><header class="c6-tete"><div class="c6-l1"><span class="c6-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></span><span class="c6-titre">Levure<span class="c6-mono">4/7</span></span><span class="c6-esp"></span><span class="c6-lien">Abandonner</span><span class="c6-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M8 3h8l3 3v14H5V6z"/><path d="M11 13h8m-3-3 3 3-3 3"/></svg></span><span class="c6-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></span></div>
<nav class="c6-etapes"><span class="fait">Identité</span><span class="fait">Malts/sucres</span><span class="fait">Houblons</span><span class="ici">Levure</span><span>Paliers</span><span>Eau</span><span>Récap.</span></nav></header>
<div class="c6-band"><span>Grain <b class="c6-mono">2,75 kg</b></span><span>OG <b class="c6-mono">1,026</b></span><span>IBU <b class="c6-mono">65</b></span><span>EBC <i class="c6-ebc"></i><b class="c6-mono">11,9</b></span></div><section class="c6-carte"><div class="c6-hd"><span class="c6-pastille"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 15h9"/></svg></span><div class="c6-nom"><b>Munich Lager Yeast</b></div><div class="c6-lu"><span class="c6-mono">2</span><em>sachets</em></div><span class="c6-x" aria-label="Retirer la levure"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></span><div class="c6-marque">White Labs · vendue par Lallemand · <span class="c6-ex">exemple</span></div></div>
<div class="c6-cases"><div class="c6-case"><div class="c6-et">FG</div><div class="c6-val c6-mono">1,006–1,007</div><div class="c6-sous">≈ 2,5–2,7 % vol</div><div class="c6-jauge" aria-label="FG 1,006 à 1,007 sur 1,000 à 1,030"><i style="left:20%;width:4%"></i></div><div class="c6-ech c6-mono"><span>1,000</span><span>1,030</span></div></div>
<div class="c6-case"><div class="c6-et">fiche · conduite</div><div class="c6-val c6-mono">9–11 · <span class="c6-rouge">19 °C</span></div><div class="c6-plage" aria-label="Plage de la fiche 9 à 11 °C, conduite 19 °C hors plage"><span class="fiche"></span><span class="ici"></span></div><span class="c6-caler"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h13m-5-5 5 5-5 5"/></svg>Caler à 11 °C</span></div>
<div class="c6-case"><div class="c6-et">floculation</div><div class="c6-val" style="font-weight:400;color:var(--t1)">moyenne</div><div class="c6-floc"><i></i><i></i><i class="non"></i></div></div></div><div class="c6-consigne"><div class="c6-ligne"><span class="c6-mot">Ensemencer</span><span class="c6-pas"><span class="m" aria-label="moins">−</span><span class="v"><b class="c6-mono">2</b><em>sachets</em></span><span class="p" aria-label="plus">+</span></span></div>
