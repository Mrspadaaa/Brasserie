<!doctype html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ma levure — r2 v07 : des lignes comme les effets</title>
<!--
  r2 · v07, recette « 7 · Lignes comme les effets » (mode greffe). Base : v01 (« v01 c'est bien »), carte du haut reprise telle quelle,
  effets à 40 px comme v01. À la place des huit volets (R1, « Toute cette partie là ») : trois lignes au vocabulaire des effets v01
  (picto gris, nom 15 px, valeur 16 px gras à droite, pas de chevron) : dose, conduite, objectifs ; puis, sur un rang, Changer de
  levure et le bouton du rare (offres · repères · atelier). Chaque ligne touchée devient une feuille basse. Rien des volets n'est jeté :
  Dose → B, Conduite → C, Objectifs → G, Produit et offres → F Offres, Repères et sources → F Repères, Atelier → F Atelier,
  Fiche : compléter, corriger → geste IA (D, E) et « Corriger la fiche produit » (F), Mon stock ou saisie libre → Atelier (puces) et Changer de levure.
  Écart à v01 : la dose en tête dit le nombre choisi, 23 g (inventaire : « ≥ 15 g n'est pas le nombre choisi ») ; ≥ 15 g vit dans B.
  Statique (L30) : HTML et CSS seuls. Données : exemple (moût 20 L à 1,026, sa capture ; 72 % → FG 1,007–1,008, ≈ 2,4–2,5 % vol).
-->
<style>
  :root{
    --page:#FFFFFF; --panneau:#F5F5F5; --sur:#EBEBEB; --bord:#DDDDDD; --bord2:#BFBFBF; --trait:#9E9E9E;
    --t2:#666666; --t1:#333333; --t0:#111111;
    --or:#7A5A12; --or-aplat:#F2C14E; --att:#9C7020; --alerte:#C8382F; --alerte-t:#A8291F; --prod:#9A4F1E; --eau:#4F7E9B; --eau-f:#2F5F7D; --vert:#4C6B2A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--sur);color:var(--t0)}
  body{font:15px/1.3 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
  .v7-mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;letter-spacing:-.01em}
  .v7-esp{flex:1}

  /* Planche : écrans de 390 × 844 côte à côte ; A occupe la vue au chargement */
  .v7-planche{display:flex;align-items:flex-start;gap:28px;width:max-content;padding:0 28px 40px 0}
  .v7-fig{margin:0;width:390px;flex:none}
  .v7-tel{position:relative;width:390px;height:844px;overflow:hidden;background:var(--page)}
  .v7-fig figcaption{padding:12px 12px 0;font-size:14px;line-height:1.35;color:var(--t1)}
  .v7-fig figcaption b{display:block;font-size:16px;color:var(--t0);margin-bottom:2px}
  .v7-defile{height:724px;overflow:hidden}

  /* En-tête et étapes : v01 */
  .v7-tete{background:var(--page);border-bottom:1px solid var(--bord)}
  .v7-l1{display:flex;align-items:center;gap:8px;height:46px;padding:0 10px 0 6px}
  .v7-retour{width:32px;height:32px;display:grid;place-items:center}
  .v7-titre{font-size:20px;font-weight:600;letter-spacing:-.01em}
  .v7-titre span{font-weight:400;color:var(--t2);margin-left:4px}
  .v7-ex{font-size:14px;font-weight:400;color:var(--t2);border:1px solid var(--bord2);border-radius:999px;padding:0 7px;margin-left:4px;white-space:nowrap}
  .v7-lien{font-size:15px;text-decoration:underline;text-underline-offset:3px}
  .v7-ico{width:32px;height:32px;display:grid;place-items:center;color:var(--t1)}
  .v7-etapes{display:flex;justify-content:space-between;gap:6px;padding:0 8px;overflow:hidden;white-space:nowrap}
  .v7-etapes span{font-size:14px;color:var(--t2);padding:4px 0 6px;border-bottom:4px solid var(--bord2)}
  .v7-etapes span.fait{border-color:#555}
  .v7-etapes span.ici{color:var(--t0);font-weight:600;border-color:var(--t0)}
  .v7-etapes span.apres{border-color:var(--bord)}

  /* Carte Ma levure : v01, effets à 30 px */
  .v7-carte{margin:10px 8px 0;border:2px solid var(--t0);border-radius:16px;background:var(--panneau);overflow:hidden}
  .v7-hd{display:grid;grid-template-columns:40px 1fr auto 28px;column-gap:8px;align-items:center;padding:10px 6px 10px 10px}
  .v7-pastille{grid-row:1 / span 2;width:40px;height:40px;border-radius:50%;background:#FBEBC0;border:2px solid var(--or-aplat);display:grid;place-items:center;color:var(--or)}
  .v7-nom{min-width:0}
  .v7-nom b{display:block;font-size:20px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
  .v7-marque{grid-column:2 / span 3;font-size:14px;color:var(--t2);white-space:nowrap;margin-top:1px}
  .v7-dose{text-align:right;white-space:nowrap}
  .v7-dose .v7-mono{font-size:22px;font-weight:600}
  .v7-dose em{font-style:normal;font-size:14px;color:var(--t2);margin-left:2px}
  .v7-x{width:32px;height:32px;display:grid;place-items:center;color:var(--t1)}
  .v7-cases{display:grid;grid-template-columns:1fr 1.18fr .86fr;border-top:1px solid var(--bord2);border-bottom:1px solid var(--bord2)}
  .v7-case{padding:8px 8px 9px;min-width:0}
  .v7-case + .v7-case{border-left:1px solid var(--bord2)}
  .v7-et{font-size:14px;color:var(--t2);white-space:nowrap}
  .v7-val{font-size:16px;font-weight:600;margin-top:2px;white-space:nowrap}
  .v7-sous{font-size:14px;color:var(--t2);white-space:nowrap}
  .v7-ech{display:flex;justify-content:space-between;font-size:14px;color:var(--t2);margin-top:3px}
  .v7-jauge{position:relative;height:8px;border-radius:4px;background:var(--sur);margin-top:8px}
  .v7-jauge i{position:absolute;top:0;bottom:0;border-radius:4px;background:repeating-linear-gradient(135deg,var(--or-aplat) 0 3px,#F7DC93 3px 6px)}
  .v7-hors{color:var(--alerte-t)}
  .v7-plage{position:relative;height:8px;border-radius:4px;margin-top:7px;background:linear-gradient(90deg,#4F7E9B,#A9C6D8 30%,#F2C14E 62%,#D6453D)}
  .v7-plage .fiche{position:absolute;top:-3px;bottom:-3px;left:24%;width:12%;border:2px solid var(--t0);border-radius:3px;background:rgba(255,255,255,.35)}
  .v7-plage .ici{position:absolute;top:-5px;bottom:-5px;left:74%;width:3px;border-radius:2px;background:var(--alerte)}
  .v7-caler{display:inline-flex;align-items:center;gap:5px;margin-top:8px;height:32px;padding:0 9px;border:1.5px solid var(--att);border-radius:10px;background:var(--page);color:var(--or);font-size:14px;font-weight:600;white-space:nowrap}
  .v7-floc{display:flex;gap:3px;margin-top:10px}
  .v7-floc i{flex:1;height:8px;border-radius:3px;background:#8C8C8C}
  .v7-floc i.non{background:var(--bord2)}

  .v7-ia{display:flex;align-items:center;gap:10px;margin:8px 8px 2px;padding:0 10px 0 12px;height:44px;border-radius:12px;border:1.5px dashed var(--att);background:#FFF8E6}
  .v7-etoile{flex:none;color:var(--att)}
  .v7-ia b{font-size:16px;font-weight:600}
  .v7-cpt{font-size:14px;color:var(--or);white-space:nowrap}
  .v7-ia.pendant{border:1.5px solid var(--t1);background:var(--sur)}
  .v7-ia.pendant .v7-cpt{color:var(--t1);font-weight:600}
  .v7-ia.apres{border-style:solid;border-color:var(--t0);background:var(--page)}
  .v7-prog{flex:1;height:6px;border-radius:3px;background:var(--page);overflow:hidden}
  .v7-prog i{display:block;height:100%;width:40%;background:var(--att)}
  .v7-btn{display:inline-flex;align-items:center;height:34px;padding:0 12px;border-radius:10px;font-size:15px;font-weight:600;white-space:nowrap}
  .v7-btn.noir{background:var(--t0);color:#fff}
  .v7-btn.trait{border:1px solid var(--bord2);background:var(--page);color:var(--t0)}
  .v7-btn.grand{height:44px;padding:0 20px;font-size:16px}
  .v7-lienpetit{font-size:15px;color:var(--t1);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}

  .v7-traits{list-style:none;margin:0;padding:0 0 4px}
  .v7-traits li{display:flex;align-items:center;gap:6px;height:40px;padding:0 10px}
  .v7-traits li.prop{background:#FFF8E6}
  .v7-traits li + li{border-top:1px solid #E4E4E4}
  .v7-crans{flex:none;display:flex;gap:2px;width:40px}
  .v7-crans i{flex:1;height:8px;border-radius:2px;background:var(--bord)}
  .v7-crans i.on{background:var(--c)}
  .v7-crans.vide i{background:transparent;border:1px dashed var(--bord2)}
  .v7-traits .v7-tv{width:58px;flex:none}
  .v7-traits .v7-tv.vide{width:auto}
  .v7-dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c)}
  .v7-tn{flex:1;min-width:0;font-size:15px;color:var(--t1);white-space:nowrap}
  .v7-tv{font-size:16px;font-weight:600;white-space:nowrap}
  .v7-tv.vide{font-weight:400;color:var(--t2)}
  .v7-src{font-size:14px;color:var(--t2);white-space:nowrap}
  .v7-tag{flex:none;display:inline-flex;align-items:center;height:22px;padding:0 6px;border-radius:6px;font-size:14px;font-weight:600;white-space:nowrap}
  .v7-tag.fiche{border:1.5px solid var(--t1);color:var(--t1);background:var(--page)}
  .v7-tag.ia{border:1.5px dashed var(--att);color:var(--or);background:#FFF8E6}
  .v7-act{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--bord2);background:var(--page);display:grid;place-items:center;color:var(--t1)}
  .v7-act.remettre{border-color:var(--t1)}
  .v7-ecarte{width:58px;flex:none;font-size:16px;color:var(--t2);text-decoration:line-through;white-space:nowrap}
  .v7-attente{flex:none;display:inline-block;width:98px;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--sur),#F7F7F7,var(--sur))}

  /* LA décision de v07 : les lignes du bas, au vocabulaire des effets */
  .v7-lignes{list-style:none;margin:8px 8px 0;padding:2px 0;border:1.5px solid var(--bord2);border-radius:16px;background:var(--page)}
  .v7-ligne{display:flex;align-items:center;gap:8px;min-height:33px;padding:0 12px}
  .v7-ligne + .v7-ligne{border-top:1px solid #E4E4E4}
  .v7-ligne .v7-dot{width:12px;height:12px}
  .v7-ln{flex:1;min-width:0;font-size:15px;color:var(--t1);white-space:nowrap}
  .v7-lv{font-size:16px;white-space:nowrap;text-align:right}
  .v7-lv b{font-weight:700}
  .v7-lq{font-size:15px;color:var(--t2)}
  .v7-ligne.double{display:block;padding:3px 12px 5px}
  .v7-lrang{display:flex;align-items:center;gap:8px;height:26px}
  .v7-lrang .v7-ln{flex:none}
  .v7-lrang .v7-lv{margin-left:auto}
  .v7-marches{flex:none}
  .v7-lpast{display:flex;justify-content:flex-end;gap:6px;margin-top:1px}
  .v7-pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:14px;white-space:nowrap;background:var(--page)}
  .v7-pill.gris{border:1.5px solid var(--bord2);color:var(--t1)}
  .v7-pill.or{border:1.5px solid var(--att);color:var(--or);font-weight:600}
  .v7-pill.vert{border:1.5px solid var(--vert);color:var(--vert);font-weight:600}
  .v7-ligne.rare{min-height:30px;background:var(--panneau);border-radius:0 0 14px 14px}
  .v7-ligne.rare .v7-dot{background:transparent;border:1.5px dashed var(--trait);width:10px;height:10px}
  .v7-ligne.rare .v7-ln{font-size:14px;color:var(--t2)}
  .v7-ligne.rare .v7-lv{font-size:14px;color:var(--t2)}
  .v7-ligne.touche{background:#FFF3D6;box-shadow:inset 4px 0 0 var(--t0)}

  .v7-pic{flex:none;width:18px;height:18px;color:var(--t1)}
  .v7-lv .v7-lq{font-size:15px}
  .v7-lw{font-size:15px;color:var(--t2);font-weight:400}
  .v7-lsous{display:flex;justify-content:flex-end;gap:5px;height:20px;align-items:center;font-size:15px;color:var(--t2)}
  .v7-lsous b{font-weight:600;color:var(--t0)}
  /* Changer de levure (base) et le rare, sur un rang */
  .v7-chg2{display:flex;gap:6px;margin:6px 8px 0}
  .v7-chg2 .v7-champ{flex:1;min-width:0;height:44px;font-size:16px;padding:0 12px;gap:8px}
  .v7-plus{flex:none;display:flex;align-items:center;gap:6px;height:44px;padding:0 6px 0 12px;border:1.5px solid var(--t1);border-radius:12px;background:var(--page);line-height:1.12}
  .v7-plus b{display:block;font-size:15px;font-weight:600;color:var(--t0);white-space:nowrap}
  .v7-plus small{display:block;font-size:14px;color:var(--t1);white-space:nowrap}
  .v7-plus.touche{background:#FFF3D6;border:2px solid var(--t0)}
  .v7-ftitre{display:flex;align-items:center;gap:8px;height:40px;padding:0 4px;font-size:17px;font-weight:600}
  .v7-ftitre span{margin-left:auto;font-size:14px;font-weight:400;color:var(--t2)}
  /* Changer de levure : v01 */
  .v7-chg{margin:8px 8px 0;padding:6px;border-radius:16px;background:var(--panneau)}
  .v7-champ{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border:1.5px dashed var(--trait);border-radius:999px;background:var(--page);color:var(--t2);font-size:17px}
  .v7-puces{display:flex;gap:6px;margin-top:6px}
  .v7-puce{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 9px;border:1.5px solid var(--bord2);border-radius:12px;background:var(--page);font-size:15px;color:var(--t0);white-space:nowrap}
  .v7-puce svg{color:var(--eau)}
  .v7-puce.hc{margin-left:auto;border-style:dashed}
  .v7-puce.on{border:2px solid var(--t0);font-weight:600}
  .v7-puce.sans{border:0;padding:0;font-weight:600;font-size:16px}

  /* Pied, + volant, onglets : v01, posés dans chaque téléphone */
  .v7-pied{position:absolute;left:0;right:0;bottom:62px;z-index:6;height:58px;background:var(--page);border-top:1px solid var(--bord);display:flex;align-items:center;gap:10px;padding:0 90px 0 10px}
  .v7-pied .v7-btn{height:42px;padding:0 16px;font-size:16px}
  .fab{position:absolute;z-index:8;bottom:70px;right:16px;width:56px;height:56px;border-radius:50%;background:var(--t0);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:300;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.28)}
  .v7-onglets{position:absolute;left:0;right:0;bottom:0;z-index:7;height:62px;background:var(--page);border-top:1px solid var(--bord);display:grid;grid-template-columns:repeat(6,1fr)}
  .v7-onglets a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--t2);text-decoration:none;font-size:14px;letter-spacing:-.02em}
  .v7-onglets a.ici{color:var(--prod);font-weight:600}
  .v7-onglets svg{width:22px;height:22px}

  /* Feuilles basses */
  .v7-voile{position:absolute;inset:0 0 62px 0;z-index:9;background:rgba(17,17,17,.45)}
  .v7-feuille{position:absolute;left:0;right:0;bottom:62px;z-index:10;max-height:700px;background:var(--page);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);padding:6px 12px 0;display:flex;flex-direction:column}
  .v7-poignee{display:block;width:40px;height:5px;border-radius:3px;background:var(--bord2);margin:0 auto 8px}
  .v7-ftete{margin:0 0 6px;border:2px solid var(--t0);border-radius:14px}
  .v7-ftete .v7-ligne{background:#FFF3D6;border-radius:12px}
  .v7-ftete .v7-ligne.rare{background:var(--panneau);min-height:36px}
  .v7-bloc{padding:8px 2px;border-top:1px solid #E4E4E4}
  .v7-flab{font-size:14px;color:var(--t2);margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .v7-unite{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;color:var(--t1)}
  .v7-pas{display:flex;align-items:center;gap:10px}
  .v7-pasb{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--bord2);display:grid;place-items:center;font-size:24px;color:var(--t0);background:var(--page)}
  .v7-pasb.petit{width:36px;height:36px;font-size:20px}
  .v7-pasv{min-width:84px;text-align:center;font-size:16px;color:var(--t2)}
  .v7-pasv b{font-size:30px;color:var(--t0)}
  .v7-pasv.petit{min-width:64px}
  .v7-pasv.petit b{font-size:20px}
  .v7-pasq{margin-left:auto;text-align:right;font-size:14px;color:var(--t1);line-height:1.25}
  .v7-regle{position:relative;height:10px;border-radius:5px;margin-top:10px;background:linear-gradient(90deg,#F2C14E,#6E9B5B)}
  .v7-regle .sous{position:absolute;left:0;top:0;bottom:0;border-radius:5px 0 0 5px;background:repeating-linear-gradient(135deg,#E9B9B4 0 3px,#F6DEDB 3px 6px)}
  .v7-regle .choix{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;border-radius:2px;background:var(--t0)}
  .v7-regle.att{background:var(--sur)}
  .v7-regle .bande{position:absolute;top:-2px;bottom:-2px;border:2px solid var(--t0);border-radius:3px;background:rgba(242,193,78,.5)}
  .v7-min{color:var(--alerte-t);text-decoration:underline;text-underline-offset:3px}
  .v7-champs{display:flex;gap:8px}
  .v7-ch{flex:1;display:flex;align-items:baseline;gap:6px;height:44px;padding:0 12px;align-items:center;border:1.5px solid var(--bord2);border-radius:12px;font-size:15px;color:var(--t2)}
  .v7-ch b{font-size:18px;color:var(--t0)}
  .v7-seg{display:flex;border:1.5px solid var(--bord2);border-radius:12px;overflow:hidden}
  .v7-seg span{flex:1;height:40px;display:grid;place-items:center;font-size:15px;color:var(--t1);background:var(--page)}
  .v7-seg span + span{border-left:1px solid var(--bord2)}
  .v7-seg span.on{background:var(--t0);color:#fff;font-weight:600}
  .v7-seg.grand{margin-bottom:8px}
  .v7-seg.grand span{height:44px;font-size:16px}
  .v7-estimer{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;margin-top:8px;border:1.5px solid var(--eau);border-radius:12px;color:var(--eau-f);font-size:15px;font-weight:600}
  .v7-rang{display:flex;align-items:center;gap:8px}
  .v7-starter{font-size:15px;font-weight:600}
  .v7-bascule{width:44px;height:26px;border-radius:13px;background:var(--bord2);position:relative}
  .v7-bascule i{position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff}
  .v7-conseil{margin:6px 0 0;padding:8px 10px;border-radius:12px;background:#EEF4F8;border-left:4px solid var(--eau);font-size:14px;line-height:1.35;color:var(--t1)}
  .v7-fbas{display:flex;align-items:center;gap:10px;padding:10px 0 10px;margin-top:auto}
  .v7-graphe{display:block;margin:2px -2px 0}
  .v7-paliers{list-style:none;margin:2px 0 0;padding:0;border-top:1px solid #E4E4E4}
  .v7-paliers li{display:flex;align-items:center;gap:10px;height:36px;border-bottom:1px solid #E4E4E4;font-size:16px}
  .v7-pn{width:24px;height:24px;border-radius:50%;background:var(--t0);color:#fff;display:grid;place-items:center;font-size:14px}
  .v7-pj{width:36px;color:var(--t1)}
  .v7-pd{margin-left:auto;font-size:14px;color:var(--t2)}
  .v7-averif{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 10px;border:1.5px solid var(--att);border-radius:12px;background:#FFF8E6;font-size:14px;color:var(--t1);line-height:1.3}
  .v7-averif b{color:var(--or)}
  .v7-averif .v7-caler{margin:0 0 0 auto}
  .v7-cible{font-size:16px;font-weight:600}
  .v7-gros{font-size:22px}
  .v7-rare{min-height:0}
