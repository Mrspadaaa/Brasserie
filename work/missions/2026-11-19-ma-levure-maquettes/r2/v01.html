<!doctype html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ma levure r2 · v01 : rangée « Ma fermentation » sous la carte</title>
<!--
  r2 · v01, recette de greffe n° 1 : une rangée « Ma fermentation » sous la carte. Passe de correction (critique du 19.11).
  Base (règle n° 1) : ../v01.html, retenue (« v01 c'est bien »). En-tête, étapes, carte du haut, geste IA, Changer de levure,
  pied, + et onglets : v01. Retouches de la carte : la dose choisie (46 g) en grand en tête, le conseil (≥ 38) en petit dessous ;
  lignes d'effets à 30 px ; au pied, trois portes pleines vers le rare de cette levure (Offres, Repères, Atelier).
  Rangée : la conduite (paliers, températures, jours) en pleine largeur, puis ensemencement et objectifs ; chaque case porte ▾.
  Données cohérentes : OG 1,067 (16,4 °P), FG 1,018–1,021, ≈ 6,0–6,4 % vol, atténuation 69–73 %.
  Parcours en dix écrans côte à côte (390 chacun) : A repos, B dose, C conduite, G objectifs, D IA pendant, E IA après,
  F Offres, H Repères, I Atelier, J Hors catalogue. Statique (L30) : HTML et CSS seuls. Données : exemple.
-->
<style>
  :root{
    --page:#FFFFFF; --panneau:#F5F5F5; --sur:#EBEBEB; --bord:#DDDDDD; --bord2:#BFBFBF; --trait:#9E9E9E;
    --t2:#666666; --t1:#333333; --t0:#111111;
    --or:#7A5A12; --or-aplat:#F2C14E; --att:#9C7020; --alerte:#C8382F; --alerte-t:#A8291F; --prod:#9A4F1E; --eau:#4F7E9B;
  }
  /* Échelle de texte : 14, 16, 20, 28 (et le + du bouton volant). */
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--sur);color:var(--t0)}
  body{font:16px/1.3 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
  .v1-mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;letter-spacing:-.01em}

  /* Planche : téléphones côte à côte, le premier occupe exactement la vue à 390 */
  .r2a-parc{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 28px 0}
  .r2a-ecr{flex:none;width:390px;margin:0;scroll-snap-align:start}
  .r2a-tel{position:relative;width:390px;height:844px;overflow:hidden;background:var(--page);display:flex;flex-direction:column;padding-bottom:120px}
  .r2a-zone{flex:1;min-height:0;overflow:hidden}
  .r2a-ecr figcaption{padding:12px 6px 0;font-size:16px;color:var(--t1);line-height:1.35}
  .r2a-ecr figcaption > b{display:inline-grid;place-items:center;width:26px;height:26px;margin-right:6px;border-radius:50%;background:var(--t0);color:#fff;font-size:16px}
  .r2a-ecr figcaption small{display:block;margin-top:6px;font-size:14px;color:var(--t2)}

  /* En-tête et étapes : v01 */
  .v1-tete{flex:none;position:relative;z-index:5;background:var(--page);border-bottom:1px solid var(--bord)}
  .v1-l1{display:flex;align-items:center;gap:8px;height:46px;padding:0 10px 0 6px}
  .v1-retour{width:32px;height:32px;display:grid;place-items:center;color:var(--t0)}
  .v1-titre{font-size:20px;font-weight:600;letter-spacing:-.01em}
  .v1-titre span{font-weight:400;color:var(--t2);margin-left:4px}
  .v1-ex{font-size:14px;color:var(--t2);border:1px solid var(--bord2);border-radius:999px;padding:0 7px;margin-left:4px;font-weight:400}
  .v1-esp{flex:1}
  .v1-lien{font-size:16px;color:var(--t0);text-decoration:underline;text-underline-offset:3px}
  .v1-ico{width:32px;height:32px;display:grid;place-items:center;color:var(--t1)}
  .v1-etapes{display:flex;justify-content:space-between;gap:6px;padding:0 8px;overflow:hidden;white-space:nowrap}
  .v1-etapes span{font-size:14px;color:var(--t2);padding:4px 0 6px;border-bottom:4px solid var(--bord2);border-radius:0}
  .v1-etapes span.fait{border-color:#555}
  .v1-etapes span.ici{color:var(--t0);font-weight:600;border-color:var(--t0)}
  .v1-etapes span.apres{border-color:var(--bord)}

  /* Le nombre choisi : un seul gros chiffre, partout le même */
  .r2a-gros{font-size:28px;font-weight:700;line-height:1;letter-spacing:-.02em}

  /* Carte Ma levure : v01 ; en tête, la dose choisie en grand et le conseil dessous */
  .v1-carte{margin:var(--decal,6px) 8px 0;border:2px solid var(--t0);border-radius:16px;background:var(--panneau);overflow:hidden}
  .v1-hd{display:grid;grid-template-columns:40px 1fr auto 28px;grid-template-rows:auto auto;column-gap:6px;align-items:center;padding:6px 4px 6px 8px}
  .v1-pastille{grid-row:1 / span 2;width:40px;height:40px;border-radius:50%;background:#FBEBC0;border:2px solid var(--or-aplat);display:grid;place-items:center;color:var(--or)}
  .v1-nom{min-width:0;grid-column:2;grid-row:1}
  .v1-nom b{display:block;font-size:20px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
  .v1-marque{grid-column:2;grid-row:2;font-size:14px;color:var(--t2);line-height:1.25;margin-top:1px}
  .v1-dose{grid-column:3;grid-row:1 / span 2;align-self:center;text-align:right;white-space:nowrap}
  .v1-dose .r2a-gros{text-decoration:underline dotted var(--bord2) 2px;text-underline-offset:4px}
  .v1-dose em{font-style:normal;font-size:16px;font-weight:600;margin-left:2px}
  .v1-dose small{display:block;font-size:14px;color:var(--t2);line-height:1.2;margin-top:3px}
  .v1-x{grid-column:4;grid-row:1;width:32px;height:32px;display:grid;place-items:center;color:var(--t1)}

  .v1-cases{display:grid;grid-template-columns:1fr 1.18fr .86fr;border-top:1px solid var(--bord2);border-bottom:1px solid var(--bord2)}
  .v1-case{padding:6px 8px 6px;min-width:0}
  .v1-case + .v1-case{border-left:1px solid var(--bord2)}
  .v1-et{font-size:14px;color:var(--t2);white-space:nowrap}
  .v1-val{font-size:16px;font-weight:600;margin-top:2px;white-space:nowrap}
  .v1-sous{font-size:14px;color:var(--t2);white-space:nowrap}
  .v1-ech{display:flex;justify-content:space-between;font-size:14px;color:var(--t2);margin-top:1px}
  .v1-jauge{position:relative;height:8px;border-radius:4px;background:var(--sur);margin-top:6px}
  .v1-jauge i{position:absolute;top:0;bottom:0;border-radius:4px;background:repeating-linear-gradient(135deg,var(--or-aplat) 0 3px,#F7DC93 3px 6px)}
  .v1-hors{color:var(--alerte-t)}
  .v1-plage{position:relative;height:8px;border-radius:4px;margin-top:7px;background:linear-gradient(90deg,#4F7E9B,#A9C6D8 30%,#F2C14E 62%,#D6453D)}
  .v1-plage .fiche{position:absolute;top:-3px;bottom:-3px;left:24%;width:12%;border:2px solid var(--t0);border-radius:3px;background:rgba(255,255,255,.35)}
  .v1-plage .ici{position:absolute;top:-5px;bottom:-5px;left:74%;width:3px;border-radius:2px;background:var(--alerte)}
  .v1-caler{display:inline-flex;align-items:center;gap:5px;margin-top:7px;height:32px;padding:0 9px;border:1.5px solid var(--att);border-radius:10px;background:var(--page);color:var(--or);font-size:14px;font-weight:600;white-space:nowrap}
  .v1-floc{display:flex;gap:3px;margin-top:10px}
  .v1-floc i{flex:1;height:8px;border-radius:3px;background:#8C8C8C}
  .v1-floc i.non{background:var(--bord2)}

  /* Le geste IA : v01 */
  .v1-ia{display:flex;align-items:center;gap:10px;margin:6px 8px 2px;padding:0 10px 0 12px;height:44px;border-radius:12px;border:1.5px dashed var(--att);background:#FFF8E6;color:var(--t0)}
  .v1-ia .v1-etoile{flex:none;color:var(--att)}
  .v1-ia b{font-size:16px;font-weight:600}
  .v1-ia .v1-cpt{font-size:14px;color:var(--or);white-space:nowrap}
  .v1-ia.pendant{border:1.5px solid var(--t1);background:var(--sur)}
  .v1-ia.pendant .v1-cpt{color:var(--t1);font-weight:600}
  .v1-ia.apres{border-style:solid;border-color:var(--t0);background:var(--page)}
  .v1-prog{flex:1;height:6px;border-radius:3px;background:var(--bord);overflow:hidden}
  .v1-prog i{display:block;height:100%;width:60%;background:var(--att)}
  .v1-btn{display:inline-flex;align-items:center;height:34px;padding:0 12px;border-radius:10px;font-size:16px;font-weight:600;white-space:nowrap}
  .v1-btn.noir{background:var(--t0);color:#fff}
  .v1-btn.trait{border:1px solid var(--bord2);background:var(--page);color:var(--t0)}
  .v1-lienpetit{font-size:16px;color:var(--t1);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}

  .v1-traits{list-style:none;margin:0;padding:0 0 2px}
  .v1-traits li{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px}
  .v1-traits li.prop{background:#FFF8E6}
  .v1-crans{flex:none;display:flex;gap:2px;width:40px}
  .v1-crans i{flex:1;height:8px;border-radius:2px;background:var(--bord)}
  .v1-crans i.on{background:var(--c)}
  .v1-crans.vide i{background:transparent;border:1px dashed var(--bord2)}
  .v1-traits .v1-tv{width:58px;flex:none}
  .v1-traits .v1-tv.vide{width:auto}
  .v1-tag{flex:none;display:inline-flex;align-items:center;height:24px;padding:0 6px;border-radius:6px;font-size:14px;font-weight:600;white-space:nowrap}
  .v1-tag.fiche{border:1.5px solid var(--t1);color:var(--t1);background:var(--page)}
  .v1-tag.ia{border:1.5px dashed var(--att);color:var(--or);background:#FFF8E6}
  .v1-act{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--bord2);background:var(--page);display:grid;place-items:center;color:var(--t1)}
  .v1-act.remettre{border-color:var(--t1)}
  .v1-traits li + li{border-top:1px solid #E4E4E4}
  .v1-dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--c)}
  .v1-tn{flex:1;min-width:0;font-size:16px;color:var(--t1);white-space:nowrap}
  .v1-tv{font-size:16px;font-weight:600;white-space:nowrap}
  .v1-tv.vide{font-weight:400;color:var(--t2)}
  .v1-src{font-size:14px;color:var(--t2);white-space:nowrap}
  .v1-ecarte{width:58px;flex:none;font-size:16px;color:var(--t2);text-decoration:line-through;white-space:nowrap}
  .v1-attente{flex:none;display:inline-block;width:98px;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--sur),#F7F7F7,var(--sur))}

  /* Pied de carte : le rare de CETTE levure, trois portes pleines */
  .r2a-portes{display:grid;grid-template-columns:1fr 1fr .9fr;border-top:1px solid var(--bord2);background:var(--page)}
  .r2a-porte{display:flex;align-items:center;gap:5px;height:36px;padding:0 6px 0 9px;font-size:16px;font-weight:600;color:var(--t0);white-space:nowrap;min-width:0}
  .r2a-porte + .r2a-porte{border-left:1px solid var(--bord2)}
  .r2a-porte svg{flex:none;color:var(--t1)}
  .r2a-porte .r2a-n{font-size:14px;font-weight:400;color:var(--t2)}
  .r2a-porte .r2a-chev{margin-left:auto;color:var(--t2)}
  .r2a-porte.touche{background:var(--t0);color:#fff}
  .r2a-porte.touche svg,.r2a-porte.touche .r2a-n{color:#fff}

  /* LA greffe : rangée « Ma fermentation » ; la conduite en pleine largeur, puis ensemencement et objectifs */
  .r2a-rang{margin:5px 8px 0;border:1px solid var(--bord2);border-radius:12px;background:var(--page);overflow:hidden}
  .r2a-c{padding:4px 8px 5px;min-width:0;position:relative}
  .r2a-c .v1-sous{line-height:1.2}
  .r2a-l1 .r2a-chev{margin:-1px -2px}
  .r2a-cond{display:flex;align-items:center;gap:10px;padding:4px 8px}
  .r2a-spark{flex:none;border-radius:4px;background:var(--panneau)}
  .r2a-ct{flex:1;min-width:0}
  .r2a-v{font-size:16px;font-weight:600;white-space:nowrap;line-height:1.25}
  .r2a-fl{color:var(--t2);font-weight:400;margin:0 5px}
  .r2a-chev{flex:none;color:var(--t1)}
  .r2a-brou{display:inline-flex;align-items:center;height:19px;padding:0 6px;line-height:1;border:1.5px solid var(--bord2);border-radius:999px;font-size:14px;color:var(--t1);white-space:nowrap;background:var(--page)}
  .r2a-bas{display:grid;grid-template-columns:.8fr 1.2fr;border-top:1px solid var(--bord2)}
  .r2a-bas .r2a-c + .r2a-c{border-left:1px solid var(--bord2)}
  .r2a-l1{display:flex;align-items:center;justify-content:space-between;gap:4px}
  .r2a-ecart{display:inline-flex;align-items:center;height:20px;line-height:1;margin-left:6px;padding:0 6px;border:1.5px solid var(--att);border-radius:999px;background:#FFF8E6;font-size:14px;font-weight:600;color:var(--or);vertical-align:1px}
  .r2a-pil{display:inline-flex;align-items:center;height:22px;padding:0 6px;border:1.5px solid var(--bord2);border-radius:999px;font-size:14px;color:var(--t1);white-space:nowrap;background:var(--page)}
  /* case ouverte : elle se soude au panneau dessous */
  .r2a-rang.ouvert{border-radius:12px 12px 0 0;border-color:var(--t0);border-width:2px 2px 0}
  .r2a-c.actif{background:var(--panneau);box-shadow:inset 0 -3px 0 var(--t0)}

  /* Tête épinglée (défilement) */
  .r2a-epingle{flex:none;position:relative;z-index:4;display:flex;align-items:center;gap:8px;height:48px;padding:0 12px 0 10px;background:var(--panneau);border-bottom:2px solid var(--t0)}
  .r2a-ep-pa{width:28px;height:28px;border-radius:50%;background:#FBEBC0;border:2px solid var(--or-aplat);display:grid;place-items:center;color:var(--or)}
  .r2a-epingle b{font-size:16px;font-weight:600}
  .r2a-ep-dose{font-size:16px;font-weight:600}
  .r2a-ep-min{font-size:14px;color:var(--t2)}

  /* Panneau ouvert en place sous la rangée */
  .r2a-pan{margin:0 8px;border:2px solid var(--t0);border-top:1px solid var(--bord2);border-radius:0 0 14px 14px;background:var(--panneau);padding:10px 10px 12px}
  .r2a-pt{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:600}
  .r2a-qte{display:flex;align-items:center;gap:10px;margin-top:8px}
  .r2a-pas{flex:none;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--bord2);background:var(--page);display:grid;place-items:center;font-size:28px;font-weight:600;color:var(--t0);line-height:1}
  .r2a-pas.petit{width:36px;height:36px;font-size:20px}
  .r2a-grand{min-width:64px;text-align:center;white-space:nowrap}
  .r2a-grand em{font-style:normal;font-size:16px;font-weight:600;margin-left:3px}
  .r2a-qs{font-size:14px;color:var(--t2);line-height:1.3;margin-left:2px}
  .r2a-qs b{color:var(--t0);font-weight:600}
  .r2a-regle,.r2a-att{position:relative;height:10px;border-radius:5px;background:var(--sur);margin:14px 2px 0}
  .r2a-regle i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:repeating-linear-gradient(135deg,var(--or-aplat) 0 3px,#F7DC93 3px 6px)}
  .r2a-regle s,.r2a-att s{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1px;border-radius:2px;background:var(--t0)}
  .r2a-att i.lev{position:absolute;top:-2px;bottom:-2px;border:2px solid var(--t0);border-radius:4px;background:repeating-linear-gradient(135deg,var(--or-aplat) 0 3px,#F7DC93 3px 6px)}
  .r2a-ech{position:relative;height:20px;font-size:14px;color:var(--t2);margin:3px 2px 0}
  .r2a-ech span{position:absolute;top:0;white-space:nowrap}
  .r2a-lignes{margin-top:8px;border-top:1px solid var(--bord)}
  .r2a-li{display:flex;align-items:center;gap:6px;min-height:44px;border-bottom:1px solid var(--bord)}
  .r2a-li .r2a-lab{flex:1;font-size:16px;color:var(--t1);white-space:nowrap;line-height:1.15}
  .r2a-chip{display:inline-flex;align-items:center;height:34px;padding:0 9px;border:1.5px solid var(--bord2);border-radius:10px;background:var(--page);font-size:16px;font-weight:600;white-space:nowrap}
  .r2a-chip em{font-style:normal;font-size:14px;font-weight:400;color:var(--t2);margin-left:4px}
  .r2a-chip.vide{font-weight:400;color:var(--t2);border-style:dashed}
  .r2a-seg{display:inline-flex;border:1.5px solid var(--bord2);border-radius:10px;overflow:hidden;background:var(--page)}
  .r2a-seg span{display:inline-flex;align-items:center;height:34px;padding:0 10px;font-size:16px;color:var(--t1);white-space:nowrap}
  .r2a-seg span + span{border-left:1px solid var(--bord2)}
  .r2a-seg span.on{background:var(--t0);color:#fff;font-weight:600}
  .r2a-conseil{margin-top:8px;font-size:14px;color:var(--t1);line-height:1.35}
  .r2a-conseil b{font-weight:600}
  .r2a-estim{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1.5px solid var(--t1);border-radius:10px;background:var(--page);font-size:14px;font-weight:600;white-space:nowrap}

  .r2a-graphe{display:block;margin:6px -2px 0}
  .r2a-graphe text{font-family:"Source Sans 3",system-ui,"Segoe UI",sans-serif;font-size:14px;fill:var(--t2)}
  .r2a-graphe .m{font-weight:600;fill:var(--t0)}
  .r2a-graphe .o{fill:var(--or);font-weight:600}
  .r2a-verif{display:flex;align-items:center;gap:8px;margin-top:8px;padding:6px 8px;border:1.5px solid var(--att);border-radius:12px;background:#FFF8E6}
  .r2a-verif p{margin:0;flex:1;font-size:14px;color:var(--t1);line-height:1.3}
  .r2a-verif .v1-caler{margin-top:0}

  /* Changer de levure : v01 (stock et hors catalogue) */
  .v1-chg{margin:5px 8px 0;padding:5px 10px 6px;border-radius:16px;background:var(--panneau)}
  .v1-champ{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border:1.5px dashed var(--trait);border-radius:999px;background:var(--page);color:var(--t2);font-size:16px}
  .v1-puces{display:flex;gap:5px;margin-top:5px}
  .v1-puce{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 8px;border:1.5px solid var(--bord2);border-radius:12px;background:var(--page);font-size:16px;color:var(--t0);white-space:nowrap}
  .v1-puce svg{color:var(--eau)}
  .v1-puce.hc{margin-left:auto;border-style:dashed}
  .v1-puce.hc svg{color:var(--t1)}

  /* Pied du wizard, + volant, onglets : v01 */
  .v1-pied{position:absolute;left:0;right:0;bottom:62px;z-index:6;height:58px;background:var(--page);border-top:1px solid var(--bord)}
  .v1-pied > div{height:100%;display:flex;align-items:center;gap:10px;padding:0 90px 0 10px}
  .v1-pied .v1-btn{height:42px;padding:0 16px;font-size:16px}
  .fab{position:absolute;z-index:8;bottom:70px;right:16px;width:56px;height:56px;border-radius:50%;background:var(--t0);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:300;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.28)}
  .v1-onglets{position:absolute;left:0;right:0;bottom:0;z-index:7;height:62px;background:var(--page);border-top:1px solid var(--bord)}
  .v1-onglets > div{height:100%;display:grid;grid-template-columns:repeat(6,1fr)}
  .v1-onglets a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--t2);text-decoration:none;font-size:14px;letter-spacing:-.02em}
  .v1-onglets a.ici{color:var(--prod);font-weight:600}
  .v1-onglets svg{width:22px;height:22px}

  /* Feuilles basses du rare */
  .r2a-voile{position:absolute;left:0;right:0;top:0;bottom:62px;z-index:9;background:rgba(17,17,17,.46)}
