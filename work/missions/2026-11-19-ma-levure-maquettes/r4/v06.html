<!doctype html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ma levure r4 — v06 : l'éditeur du malt, copié pour la levure</title>
<!--
  NOTE — r4, version 6 sur 6, recette G6 « L'éditeur du malt, copié pour la levure ». Chaleur : froide (greffe).
  Base v01 (règle n° 1) : en-tête Levure 4/7 et étapes, carte à bord noir, pastille or · Munich Lager Yeast · marque · ×,
  le nombre en haut à droite ; bandeau Grain/OG/IBU/EBC ; FG, fiche · conduite (Caler à 11 °C), floculation ; conduite en
  marches ; effets en crans ; Changer de levure et ses puces (stock d'abord) ; Retour / Suivant — Paliers ; + volant ; onglets.
  Greffes : la part « ensemencement · 117 % du besoin lager » (v04, « J'aime bien le 117% lager »), sous le haut comme
  « empâtage 62 % du grain » ; le nombre souligné en pointillé, qu'on touche pour taper (v05) ; « = 23 g » sous le nombre
  (v04) ; « manque 1 » à la place de l'icône de stock (v05) ; rangée unique Compléter · IA | Offres | Repères | Atelier (v05) ;
  la conséquence du geste sur la ligne même (v01) ; le manque dessiné jusqu'à la cible, en aplat et non en texture (v03) ;
  « à choisir » à la place du nombre, et un toucher qui pose 2 sachets (v04).
  Le motif de l'éditeur du malt (sa capture malts-en-ligne-1911.jpg) pris à la lettre : piste blanche à bord gris,
  remplissage or, poignée noire ronde, graduation fine (un cran chiffré par sachet, demi-crans), « 0 1 2 3 › »,
  − et + de 48 px. Le nombre en haut à droite reste le seul nombre de dose.
  Corrections de ce qu'il a reproché : un seul verdict, celui de la recette (lager), au lieu de « ale · lager » (v03, « dur à
  lire ») ; cible lager en trait noir plein, jamais une texture sur une texture ; manque en aplat rouge clair ; un seul jeu
  de chiffres (1 = 59 %, 2 = 117 %, 3 = 176 % ; sur-dosé au-delà de 200 %) ; aucun calcul exposé ; la forme vient de la
  fiche, jamais « à choisir » pour elle ; bouton IA sur les trois écrans ; pas de jetons de sachets (v02).
  Passe de correction (19.11) : haut de la base rendu tel quel (« exemple » sur la ligne de la marque, « = 23 g » sous le
  nombre) ; piste « 0 1 2 3 › » chiffrée, trait « lager 1,7 » ; verdict au repos ; plus d'étiquette « ensemencement » ; le stock
  ne se dessine plus dans la barre (icône seule) ; l'écran « après » montre le sous-dosage et son remède « +1 → 117 % » ;
  au cas limite, − inactif et « Mettre 2 sachets · 117 % lager » en bouton plein ; ligne « conduite » nommée ; + jamais noirci.
  Écart : la piste va de 0 à 3 › (comme celle du malt) au lieu de 0 à 4 ›, pour écarter la poignée du trait lager.
  Chiffres (exemple) : sa capture du 19.11 (OG 1,026, FG 1,006–1,007, ≈ 2,5–2,7 % vol, 9–11 · 19 °C) ; besoin lager
  1,5 M/mL/°P pour 20 L ≈ 1,7 sachet ; sachet de 11,5 g et stock de 2 sachets : exemple.
  Statique (L30) : HTML et CSS seuls, produits par un gabarit hors du dépôt ; aucun script dans la page.
-->
<style>
  :root{
    --page:#FFFFFF; --panneau:#F5F5F5; --sur:#EBEBEB; --bord:#DDDDDD; --bord2:#BFBFBF; --trait:#9E9E9E;
    --t2:#666666; --t1:#333333; --t0:#111111;
    --or:#7A5A12; --or-aplat:#F2C14E; --or-clair:#FBEBC0; --att:#9C7020; --alerte:#C8382F; --alerte-t:#A8291F; --prod:#9A4F1E;
    --eau:#4F7E9B; --stock:#6E9B5B; --stock-t:#3F6B2E;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--sur);color:var(--t0)}
  body{font:15px/1.3 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;
    display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:28px 24px;padding:0 0 40px}
  .g6-mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;letter-spacing:-.01em}
  .g6-esp{flex:1}
  .g6-g{color:var(--t2)}

  /* Planche : trois écrans de 390 × 844, côte à côte dès que la largeur le permet */
  .g6-fig{flex:none;width:390px;margin:0}
  .g6-tel{position:relative;width:390px;height:844px;overflow:hidden;background:var(--page)}
  .g6-fig figcaption{margin:12px 10px 0;font-size:15px;line-height:1.35;color:var(--t1)}
  .g6-fig figcaption b{display:flex;align-items:center;gap:8px;margin-bottom:3px;font-size:16px;font-weight:600;color:var(--t0)}
  .g6-fig figcaption b span{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--t0);color:#fff;font-size:14px}
  .g6-variante{margin:16px 0 0;padding:10px 0 12px;background:var(--page)}
  .g6-variante > b{display:block;margin:0 10px 2px;font-size:15px;font-weight:600}
  .g6-variante > p{margin:6px 10px 0;font-size:15px;color:var(--t1)}

  /* En-tête et étapes : v01 (base) */
  .g6-tete{background:var(--page);border-bottom:1px solid var(--bord)}
  .g6-l1{display:flex;align-items:center;gap:8px;height:46px;padding:0 10px 0 6px}
  .g6-retour{width:32px;height:32px;display:grid;place-items:center}
  .g6-titre{font-size:20px;font-weight:600;letter-spacing:-.01em}
  .g6-titre span{font-weight:400;color:var(--t2);margin-left:4px}
  .g6-ex{font-size:14px;color:var(--t2);border:1px solid var(--bord2);border-radius:999px;padding:0 7px;margin-left:2px}
  .g6-lien{font-size:15px;text-decoration:underline;text-underline-offset:3px}
  .g6-ico{width:32px;height:32px;display:grid;place-items:center;color:var(--t1)}
  .g6-etapes{display:flex;justify-content:space-between;gap:6px;padding:0 8px;overflow:hidden;white-space:nowrap}
  .g6-etapes span{font-size:14px;color:var(--t2);padding:4px 0 6px;border-bottom:4px solid var(--bord2)}
  .g6-etapes span.fait{border-color:#555}
  .g6-etapes span.ici{color:var(--t0);font-weight:600;border-color:var(--t0)}
  .g6-etapes span.apres{border-color:var(--bord)}

  /* Bandeau partagé avec Malts/sucres */
  .g6-bandeau{display:flex;justify-content:space-between;align-items:center;height:38px;margin:8px 8px 0;padding:0 12px;border:1.5px solid var(--bord);border-radius:999px;background:var(--panneau);font-size:15px;font-weight:600;white-space:nowrap}
  .g6-bandeau em{font-style:normal;font-weight:400;color:var(--t2);font-family:"Source Sans 3",system-ui,sans-serif;font-size:14px;margin-right:2px}
  .g6-ebc{display:inline-block;width:11px;height:11px;border-radius:50%;background:#E0A02E;margin-right:4px;vertical-align:-1px}

  /* Carte Ma levure : v01, le nombre à droite du nom comme « 1,7 kg » sur la ligne d'un malt */
  .g6-carte{margin:8px 8px 0;border:2px solid var(--t0);border-radius:16px;background:var(--panneau);overflow:hidden}
  .g6-carte.seule{margin:6px 8px 0}
  .g6-hd{display:grid;grid-template-columns:40px minmax(0,1fr) auto 28px;column-gap:8px;align-items:center;padding:8px 4px 6px 10px}
  .g6-pastille{grid-row:1 / span 2;width:40px;height:40px;border-radius:50%;background:var(--or-clair);border:2px solid var(--or-aplat);display:grid;place-items:center;color:var(--or)}
  .g6-nom b{display:block;font-size:20px;font-weight:600;line-height:1.15;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .g6-qte{display:flex;align-items:baseline;gap:4px;white-space:nowrap;padding:0 2px 1px;border-bottom:2px dotted var(--t1)}
  .g6-qte b{font-size:28px;font-weight:700;line-height:1}
  .g6-qte em{font-style:normal;font-size:15px;color:var(--t2)}
  .g6-qte.vide{align-items:center;height:34px;padding:0 10px;border:1.5px dashed var(--t1);border-radius:10px;background:var(--page)}
  .g6-qte.vide span{font-size:16px;font-weight:600;color:var(--t1)}
  .g6-x{width:28px;height:32px;display:grid;place-items:center;color:var(--t1);align-self:start}
  .g6-nom{grid-column:2;grid-row:1;min-width:0}
  .g6-q{grid-column:3;grid-row:1 / span 2;align-self:start;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  .g6-marque{grid-column:2;grid-row:2;margin-top:2px;font-size:14px;line-height:1.3;color:var(--t2)}
  .g6-marque .g6-ex{white-space:nowrap}
  .g6-grammes{font-size:15px;font-weight:600;color:var(--t1);white-space:nowrap}

  /* Ligne de part, comme « empâtage 62 % du grain » */
  .g6-dose{background:var(--page);border-top:1px solid var(--bord2);padding:4px 10px 0}
  .g6-part{display:flex;align-items:center;gap:8px;min-height:44px;white-space:nowrap}
  .g6-pl{display:flex;align-items:baseline;gap:6px;font-size:16px}
  .g6-pv{color:var(--t0)}
  .g6-pv b{font-weight:700}
  .g6-v{font-weight:700}
  .g6-v.ok{color:var(--stock-t)}
  .g6-v.sous{color:var(--alerte-t)}
  .g6-stock{display:grid;place-items:center;width:32px;height:28px;border-radius:9px;color:var(--stock);background:#EEF5EA;border:1.5px solid var(--stock)}
  .g6-manque{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 7px 0 5px;border:1.5px solid #E9B7B2;border-radius:9px;background:#FCEFEE;color:var(--alerte-t);font-size:15px;font-weight:600}
  .g6-manque svg{color:var(--alerte)}

  /* L'éditeur du malt, copié : − 56 px, piste graduée par sachet, + 56 px */
  .g6-ed{display:flex;align-items:flex-start;gap:12px;padding:0 0 4px}
  .g6-pas{flex:none;width:48px;height:48px;margin-top:12px;border-radius:50%;border:1.5px solid var(--bord2);background:var(--page);display:grid;place-items:center;color:var(--t0)}
  .g6-pas.off{border-style:dashed;border-color:var(--bord);color:var(--bord2);background:var(--panneau)}
  .g6-pb{position:relative;flex:1;height:78px}
  .g6-piste{position:absolute;left:0;right:0;top:24px;height:24px;border-radius:12px;background:var(--page);border:1.5px solid var(--bord2);overflow:hidden}
  .g6-ed.vide .g6-piste{border:2px dashed var(--trait);background:var(--panneau)}
  .g6-rempli{position:absolute;left:0;top:0;bottom:0;background:var(--or-aplat)}
  .g6-manqueseg{position:absolute;top:0;bottom:0;background:#F4C6C1}
  .g6-cible{position:absolute;top:17px;height:38px;width:3px;margin-left:-1.5px;border-radius:1px;background:var(--t0)}
  .g6-cible-mot{position:absolute;top:0;transform:translateX(-50%);font-size:14px;line-height:17px;font-weight:600;color:var(--t0);white-space:nowrap}
  .g6-cible-mot b{font-weight:700}
  .g6-poignee{position:absolute;top:23px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--t0);border:3px solid var(--page);box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .g6-gr{position:absolute;top:53px;width:2px;height:9px;margin-left:-1px;background:var(--t1)}
  .g6-gr.fin{width:1px;height:5px;margin-left:-.5px;background:var(--trait)}
  .g6-n{position:absolute;top:61px;transform:translateX(-50%);font-size:14px;line-height:16px;color:var(--t1);white-space:nowrap}
  .g6-n.fin{transform:translateX(-.32em)}
  .g6-remede{display:inline-flex;align-items:center;height:36px;padding:0 10px;border:1.5px solid var(--att);border-radius:10px;background:#FFF8E6;color:var(--or);font-size:15px;font-weight:600;white-space:nowrap}
  .g6-mettre{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;margin:2px 0;border-radius:11px;background:var(--t0);color:#fff;font-size:16px;font-weight:600;white-space:nowrap}

  /* FG, fiche · conduite, floculation : base */
  .g6-cases{display:grid;grid-template-columns:1fr 1.18fr .86fr;border-top:1px solid var(--bord2);border-bottom:1px solid var(--bord2)}
  .g6-case{padding:6px 8px;min-width:0}
  .g6-case + .g6-case{border-left:1px solid var(--bord2)}
  .g6-et{font-size:14px;color:var(--t2);white-space:nowrap}
  .g6-val{font-size:16px;font-weight:600;margin-top:2px;white-space:nowrap}
  .g6-val.fin{font-weight:400;color:var(--t1)}
  .g6-sous{font-size:14px;color:var(--t2);white-space:nowrap}
  .g6-jauge{position:relative;height:8px;border-radius:4px;background:var(--sur);margin-top:7px}
  .g6-jauge i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--or-aplat)}
  .g6-horsplage{color:var(--alerte-t)}
  .g6-plage{position:relative;height:8px;border-radius:4px;margin-top:7px;background:linear-gradient(90deg,#4F7E9B,#A9C6D8 30%,#F2C14E 62%,#D6453D)}
  .g6-plage .fiche{position:absolute;top:-3px;bottom:-3px;left:24%;width:12%;border:2px solid var(--t0);border-radius:3px;background:rgba(255,255,255,.35)}
  .g6-plage .ici{position:absolute;top:-5px;bottom:-5px;left:74%;width:3px;border-radius:2px;background:var(--alerte)}
  .g6-caler{display:inline-flex;align-items:center;gap:5px;margin-top:7px;height:30px;padding:0 9px;border:1.5px solid var(--att);border-radius:10px;background:var(--page);color:var(--or);font-size:14px;font-weight:600;white-space:nowrap}
  .g6-floc{display:flex;gap:3px;margin-top:8px}
  .g6-floc i{flex:1;height:8px;border-radius:3px;background:#8C8C8C}
  .g6-floc i.non{background:var(--bord2)}

  .g6-conduite{display:flex;align-items:center;gap:7px;height:34px;padding:0 10px;border-bottom:1px solid var(--bord2);font-size:15px;white-space:nowrap}
  .g6-conduite .g6-mono{font-weight:600}
  .g6-conduite .g6-g{font-size:14px}

  .g6-traits{display:grid;grid-template-columns:repeat(3,1fr);padding:5px 4px}
  .g6-traits > div{padding:2px 6px}
  .g6-traits > div + div{border-left:1px solid #E4E4E4}
  .g6-tn{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--t1)}
  .g6-dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
  .g6-tl{display:flex;align-items:center;gap:6px;margin-top:3px}
  .g6-tl b{font-size:15px;font-weight:600}
  .g6-crans{flex:none;display:flex;gap:2px;width:36px}
  .g6-crans i{flex:1;height:8px;border-radius:2px;background:var(--bord)}
  .g6-crans i.on{background:var(--c)}

  /* Le reste de l'étape à un toucher : une rangée, jamais des volets empilés */
  .g6-toucher{display:flex;gap:5px;padding:6px 7px 7px;border-top:1px solid var(--bord2);background:var(--page)}
  .g6-tch{flex:1 1 auto;justify-content:center;display:inline-flex;align-items:center;gap:4px;height:38px;padding:0 7px;border:1.5px solid var(--bord2);border-radius:11px;background:var(--page);font-size:15px;white-space:nowrap;color:var(--t1)}
  .g6-tch.ia{border:1.5px dashed var(--att);background:#FFF8E6;color:var(--or);font-weight:600}

  /* Changer de levure : base, le stock d'abord */
  .g6-chg{margin:10px 8px 0;padding:9px 10px 10px;border-radius:16px;background:var(--panneau)}
  .g6-champ{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border:1.5px dashed var(--trait);border-radius:999px;background:var(--page);color:var(--t2);font-size:17px}
  .g6-puces{display:flex;gap:6px;margin-top:8px}
  .g6-puce{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 9px;border:1.5px solid var(--bord2);border-radius:12px;background:var(--page);font-size:15px;white-space:nowrap}
  .g6-puce svg{width:16px;height:16px;color:var(--eau)}
  .g6-puce.hc{margin-left:auto;border-style:dashed}

  /* Pied, + volant, onglets */
  .g6-pied{position:absolute;left:0;right:0;bottom:62px;z-index:6;height:58px;display:flex;align-items:center;gap:10px;padding:0 90px 0 10px;background:var(--page);border-top:1px solid var(--bord)}
  .g6-btn{display:inline-flex;align-items:center;height:42px;padding:0 16px;border-radius:10px;font-size:16px;font-weight:600;white-space:nowrap}
  .g6-btn.noir{background:var(--t0);color:#fff}
  .g6-btn.trait{border:1px solid var(--bord2);background:var(--page)}
  .fab{position:absolute;z-index:8;bottom:70px;right:16px;width:56px;height:56px;border-radius:50%;background:var(--t0);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:300;line-height:1;box-shadow:0 4px 12px rgba(0,0,0,.28)}
  .g6-onglets{position:absolute;left:0;right:0;bottom:0;z-index:7;height:62px;background:var(--page);border-top:1px solid var(--bord)}
  .g6-onglets > div{height:100%;display:grid;grid-template-columns:repeat(6,1fr)}
  .g6-onglets a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--t2);font-size:14px;letter-spacing:-.02em}
  .g6-onglets a.ici{color:var(--prod);font-weight:600}
  .g6-onglets svg{width:22px;height:22px}
</style>
</head>
<body>
<figure class="g6-fig" id="repos">
<div class="g6-tel">
  <header class="g6-tete">
    <div class="g6-l1">
      <span class="g6-retour" aria-label="Retour"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></span>
      <span class="g6-titre">Levure<span class="g6-mono">4/7</span></span>
      <span class="g6-esp"></span>
      <span class="g6-lien">Abandonner</span>
      <span class="g6-ico" aria-label="Importer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M8 3h8l3 3v14H5V6z"/><path d="M11 13h8m-3-3 3 3-3 3"/></svg></span>
      <span class="g6-ico" aria-label="Thème"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></span>
    </div>
    <nav class="g6-etapes" aria-label="Étapes de la recette"><span class="fait">Identité</span><span class="fait">Malts/sucres</span><span class="fait">Houblons</span><span class="ici">Levure</span><span class="apres">Paliers</span><span class="apres">Eau</span><span class="apres">Récap.</span></nav>
  </header>
  <div class="g6-bandeau g6-mono"><span><em>Grain</em> 2,75 kg</span><span><em>OG</em> 1,026</span><span><em>IBU</em> 65</span><span><em>EBC</em> <i class="g6-ebc"></i>11,9</span></div>
  <section class="g6-carte" aria-label="Ma levure">
    <div class="g6-hd">
      <span class="g6-pastille"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 15h9"/></svg></span>
      <div class="g6-nom"><b>Munich Lager Yeast</b></div>
      <span class="g6-q"><span class="g6-qte" role="button" aria-label="Taper le nombre de sachets"><b class="g6-mono">2</b><em>sachets</em></span><span class="g6-grammes g6-mono">= 23 g</span></span>
      <span class="g6-x" aria-label="Retirer la levure"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></span>
      <div class="g6-marque">White Labs · vendue par Lallemand · <span class="g6-ex">exemple</span></div>
    </div>
    <div class="g6-dose">
      <div class="g6-part"><span class="g6-pl"><span class="g6-pv"><b>117 %</b> du besoin lager</span><span class="g6-g">·</span><b class="g6-v ok">couvre</b></span><span class="g6-esp"></span><span class="g6-stock" aria-label="En stock : 2 sachets"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg></span></div>
      <div class="g6-ed">
