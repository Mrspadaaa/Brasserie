<!doctype html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>z2 — Je décide, ça donne · Identité 1/7 (v0, 31.10)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--page:#fff;--panel:#F5F5F5;--surf:#EBEBEB;--bord:#DDD;--bord2:#BFBFBF;--t1:#111;--t2:#333;--t3:#666;
--hop:#567F45;--hopT:#3F6B2E;--water:#4F7E9B;--eau:#2F6E96;--waterT:#2F5F7D;--alert:#C8382F;--att:#9C7020;--attT:#7F5B10;--gold:#E0A02E;--goldT:#7A5A12;--violet:#6A4FB0;--violetT:#4E3A86}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--t2)}
body{width:390px;min-height:844px;font:14px/18px 'Source Sans 3',system-ui,sans-serif;position:relative;padding-bottom:8px}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.z2-mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-weight:600}
.z2-haut{padding:0 8px;background:var(--page);border-bottom:1px solid var(--bord)}
.z2-titre{display:flex;align-items:center;gap:6px;height:36px}
.z2-ico{width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--t3);flex:none}
.z2-nomEtape{flex:1;min-width:0;margin:0;display:flex;align-items:baseline;gap:6px;font-size:16px;color:var(--t1)}
.z2-pos{font-size:14px;color:var(--t3);font-weight:400}
.z2-abandon{height:28px;padding:0 6px;font-size:12px;color:var(--t2);text-decoration:underline;text-underline-offset:2px;border-radius:4px}
.z2-fil{display:flex;gap:4px;height:32px;align-items:center}
.z2-fil button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 2px}
.z2-fil span{font-size:12px;color:var(--t3);white-space:nowrap}
.z2-fil i{display:block;height:6px;width:100%;border-radius:999px;background:var(--bord)}
.z2-fil [aria-current] span{color:var(--t1);font-weight:600}
.z2-fil [aria-current] i{background:var(--t1)}
.z2-bandeau{margin:8px 8px 0;height:32px;padding:0 10px;background:var(--panel);border:1px solid var(--bord);border-radius:999px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.z2-bl{display:flex;align-items:center;gap:4px;color:var(--t3);font-size:14px;white-space:nowrap}
.z2-bl b{color:var(--t1);font-size:14px}
.z2-og{color:var(--goldT)}
.z2-piste{position:relative;display:inline-block;width:46px;height:8px;border-radius:999px;background:var(--bord);margin-left:2px}
.z2-piste u{position:absolute;left:46%;width:36%;top:0;bottom:0;background:var(--bord2);border-radius:999px}
.z2-piste s{position:absolute;left:66%;top:-3px;width:2px;height:14px;background:var(--t1);border-radius:1px}
.z2-ebc{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--gold)}
.z2-pied{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 8px 0;margin-right:72px}
.z2-retour{height:28px;padding:0 10px;border-radius:4px;color:var(--t3);border:1px solid var(--bord);opacity:.6}
.z2-suivant{height:32px;padding:0 10px;border-radius:4px;background:var(--t1);color:#fff;font-weight:600}
.z2-plus{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:var(--t1);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.z2-tag{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:999px;border:1px solid rgba(217,119,6,.4);background:rgba(251,191,36,.4);color:#6B3F05;font-weight:600;font-size:14px;white-space:nowrap}
.z2-tiret{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:999px;border:1px dashed var(--bord2);color:var(--t3);font-size:12px;white-space:nowrap;list-style:none}
.z2-tiret::-webkit-details-marker{display:none}
.z2-champ{height:32px;border:1px solid var(--bord2);border-radius:4px;background:var(--page);padding:0 8px;font-size:16px;color:var(--t1);min-width:0}
.z2-num{width:58px;text-align:right}
.z2-sim{color:var(--t3)}
.z2-pl{display:flex;align-items:center;gap:6px;min-height:20px}
.z2-pln{width:30px;font-size:12px;color:var(--t3);flex:none}
.z2-plb{position:relative;flex:1;height:8px;border-radius:999px;background:var(--bord)}
.z2-plb u{position:absolute;top:0;bottom:0;background:var(--bord2);border-radius:999px}
.z2-plb s{position:absolute;top:-4px;width:2px;height:16px;background:var(--t1);margin-left:-1px;border-radius:1px}
.z2-plb s.z2-hors{background:var(--att)}

.z2-corps{padding:8px}
.z2-coller{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--bord2);border-radius:4px;color:var(--t1);font-weight:600}
.z2-coller{margin-bottom:8px}
.z2-grille{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--bord);border-radius:8px;overflow:hidden}
.z2-grille>div{padding:8px 10px;min-height:70px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--bord)}
.z2-grille>div:nth-last-child(-n+2){border-bottom:0}
.z2-d{background:var(--page)}
.z2-c{background:rgba(79,126,155,.42);border-left:1px solid var(--bord);color:var(--t2);font-size:12px;flex-wrap:wrap;align-content:center}
.z2-c b{color:var(--t1);font-size:14px}
.z2-c .z2-vert{color:#2F5A22}
.z2-d .z2-champ{width:100%}
.z2-d .z2-num{width:62px}
.z2-unit{color:var(--t3)}
.z2-barre{flex-basis:100%;height:10px;border-radius:999px;background:var(--bord2);position:relative;margin-top:2px}
.z2-barre u{position:absolute;left:0;top:0;bottom:0;width:80%;background:var(--hop);border-radius:999px}
.z2-barre s{position:absolute;left:80%;top:-3px;width:0;height:16px;border-left:2px dashed var(--t1)}
.z2-barre.z2-eau u{width:66%;background:var(--eau)}
.z2-barre.z2-eau s{left:66%;border-left-style:solid}
.z2-case{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--t1)}
.z2-case input{width:22px;height:22px;margin:0;accent-color:var(--violet)}
.z2-off{color:var(--t3);font-weight:400}
.z2-on{color:var(--violetT)}
.z2-mat{font-size:12px;color:var(--t2);flex-direction:column;align-items:flex-start;gap:2px}
.z2-mat b{color:var(--t1)}
.z2-pls{flex-basis:100%;display:flex;flex-direction:column;gap:2px}
.z2-pln{width:26px}
.z2-plb{background:rgba(255,255,255,.7)}
.z2-plb u{background:var(--bord2)}
.z2-pln{color:var(--t2)}
</style>
</head>
<body class="z2" data-concept="z2">

<header class="z2-haut" data-commun="en-tete">
  <div class="z2-titre">
    <button type="button" class="z2-ico" aria-label="Fermer" data-role="fermer"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <p class="z2-nomEtape"><b>Identité</b> <span class="z2-mono z2-pos">1/7</span></p>
    <button type="button" class="z2-abandon" data-role="abandonner-brouillon">Abandonner</button>
    <button type="button" class="z2-ico" aria-label="Coller une recette" data-role="import"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H9a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1Z"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2M16 4h2a2 2 0 0 1 2 2v2M11 14h10"/><path d="m17 10 4 4-4 4"/></svg></button>
    <button type="button" class="z2-ico" aria-label="Thème" data-role="theme"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
  </div>
  <nav class="z2-fil" aria-label="Étapes" data-commun="fil">
    <button type="button" aria-current="step"><span>Identité</span><i></i></button><button type="button" ><span>Malts/sucres</span><i></i></button><button type="button" ><span>Houblons</span><i></i></button><button type="button" ><span>Levure</span><i></i></button><button type="button" ><span>Paliers</span><i></i></button><button type="button" ><span>Eau</span><i></i></button><button type="button" ><span>Récap.</span><i></i></button>
  </nav>
</header>
<div class="z2-bandeau" data-commun="bandeau">
  <span class="z2-bl">Grain <b class="z2-mono">8,6 kg</b></span>
  <span class="z2-bl">OG <b class="z2-mono z2-og">1,080</b></span>
  <span class="z2-bl">IBU <b class="z2-mono">~93</b><i class="z2-piste"><u></u><s></s></i></span>
  <span class="z2-bl">EBC <i class="z2-ebc"></i><b class="z2-mono">9,5</b></span>
</div>

<main class="z2-corps">
  <div class="z2-grille" aria-label="Identité : à gauche ce que je décide, à droite ce que ça donne">
    <div class="z2-d"><input class="z2-champ" value="neipa v3" aria-label="Nom de la bière"></div>
    <div class="z2-c"><span>brouillon repris</span></div>

    <div class="z2-d"><button type="button" class="z2-tag" data-booster="pastille-style">Double IPA <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button></div>
    <div class="z2-c" data-booster="plages-au-style"><span><b>22A</b> BJCP 2021</span><span class="z2-pls"><span class="z2-pl"><span class="z2-pln">OG</span><i class="z2-plb"><u style="left:42%;width:33%"></u><s style="left:66%" class=""></s></i></span><span class="z2-pl"><span class="z2-pln">FG</span><i class="z2-plb"><u style="left:27%;width:33%"></u></i></span><span class="z2-pl"><span class="z2-pln">alc.</span><i class="z2-plb"><u style="left:62%;width:21%"></u></i></span><span class="z2-pl"><span class="z2-pln">IBU</span><i class="z2-plb"><u style="left:43%;width:28%"></u><s style="left:66%" class=""></s></i></span><span class="z2-pl"><span class="z2-pln">EBC</span><i class="z2-plb"><u style="left:30%;width:40%"></u><s style="left:24%" class="z2-hors"></s></i></span></span></div>

    <div class="z2-d"><input class="z2-champ z2-num z2-mono" value="24" inputmode="decimal" aria-label="Volume en fermenteur"><span class="z2-unit">L</span></div>
    <div class="z2-c" data-booster="etat-fermenteur"><b class="z2-mono z2-vert">6 L libres</b><span>sur <b class="z2-mono">30 L</b></span><span class="z2-barre" role="img" aria-label="24 sur 30 litres, conseil 24"><u></u><s></s></span><span>conseil <b class="z2-mono">24 L</b></span></div>

    <div class="z2-d"><input class="z2-champ z2-num z2-mono" value="60" inputmode="numeric" aria-label="Durée d'ébullition"><span class="z2-unit">min</span></div>
    <div class="z2-c" data-booster="evaporation-simulee"><b class="z2-mono">~3 L</b><span>évaporés</span><span class="z2-barre z2-eau" role="img" aria-label="60 minutes sur 90"><u></u><s></s></span><span>avant ébullition <b class="z2-mono">~27 L</b></span></div>

    <div class="z2-d"><label class="z2-case" data-booster="case-nolo"><input type="checkbox" id="z2-nolo">NOLO</label></div>
    <div class="z2-c"><b class="z2-mono z2-off" id="z2-nolo-c">≤ 0,5 %</b></div>

    <div class="z2-d z2-mat"><b>Royal Catering</b><span>cuve <b class="z2-mono">45 L</b></span></div>
    <div class="z2-c"><span>espace libre <b class="z2-mono">~20 %</b></span></div>
  </div>
</main>

<footer class="z2-pied" data-commun="pied">
  <button type="button" class="z2-retour" disabled>Retour</button>
  <button type="button" class="z2-suivant">Suivant — Malts/sucres</button>
</footer>
<button type="button" class="z2-plus" aria-label="Actions rapides" data-commun="plus"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<script>(function(){var c=document.getElementById('z2-nolo'),e=document.getElementById('z2-nolo-c');c.addEventListener('change',function(){e.className='z2-mono '+(c.checked?'z2-on':'z2-off')});})();</script>
</body>
</html>
