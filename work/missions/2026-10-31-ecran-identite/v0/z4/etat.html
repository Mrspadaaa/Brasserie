<!doctype html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>z4 — Le verre · Identité 1/7 (v0, 31.10)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--page:#fff;--panel:#F5F5F5;--surf:#EBEBEB;--bord:#DDD;--bord2:#BFBFBF;--t1:#111;--t2:#333;--t3:#666;
--hop:#567F45;--hopT:#3F6B2E;--water:#4F7E9B;--eau:#2F6E96;--waterT:#2F5F7D;--alert:#C8382F;--att:#9C7020;--attT:#7F5B10;--gold:#E0A02E;--goldT:#7A5A12;--violet:#6A4FB0;--violetT:#4E3A86}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--t2)}
body{width:390px;min-height:844px;font:14px/18px 'Source Sans 3',system-ui,sans-serif;position:relative;padding-bottom:8px}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.z4-mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-weight:600}
.z4-haut{padding:0 8px;background:var(--page);border-bottom:1px solid var(--bord)}
.z4-titre{display:flex;align-items:center;gap:6px;height:36px}
.z4-ico{width:28px;height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--t3);flex:none}
.z4-nomEtape{flex:1;min-width:0;margin:0;display:flex;align-items:baseline;gap:6px;font-size:16px;color:var(--t1)}
.z4-pos{font-size:14px;color:var(--t3);font-weight:400}
.z4-abandon{height:28px;padding:0 6px;font-size:12px;color:var(--t2);text-decoration:underline;text-underline-offset:2px;border-radius:4px}
.z4-fil{display:flex;gap:4px;height:32px;align-items:center}
.z4-fil button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 2px}
.z4-fil span{font-size:12px;color:var(--t3);white-space:nowrap}
.z4-fil i{display:block;height:6px;width:100%;border-radius:999px;background:var(--bord)}
.z4-fil [aria-current] span{color:var(--t1);font-weight:600}
.z4-fil [aria-current] i{background:var(--t1)}
.z4-bandeau{margin:8px 8px 0;height:32px;padding:0 10px;background:var(--panel);border:1px solid var(--bord);border-radius:999px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.z4-bl{display:flex;align-items:center;gap:4px;color:var(--t3);font-size:14px;white-space:nowrap}
.z4-bl b{color:var(--t1);font-size:14px}
.z4-og{color:var(--goldT)}
.z4-piste{position:relative;display:inline-block;width:46px;height:8px;border-radius:999px;background:var(--bord);margin-left:2px}
.z4-piste u{position:absolute;left:46%;width:36%;top:0;bottom:0;background:var(--bord2);border-radius:999px}
.z4-piste s{position:absolute;left:66%;top:-3px;width:2px;height:14px;background:var(--t1);border-radius:1px}
.z4-ebc{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--gold)}
.z4-pied{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 8px 0;margin-right:72px}
.z4-retour{height:28px;padding:0 10px;border-radius:4px;color:var(--t3);border:1px solid var(--bord);opacity:.6}
.z4-suivant{height:32px;padding:0 10px;border-radius:4px;background:var(--t1);color:#fff;font-weight:600}
.z4-plus{position:absolute;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:var(--t1);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.z4-tag{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:999px;border:1px solid rgba(217,119,6,.4);background:rgba(251,191,36,.4);color:#6B3F05;font-weight:600;font-size:14px;white-space:nowrap}
.z4-tiret{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:999px;border:1px dashed var(--bord2);color:var(--t3);font-size:12px;white-space:nowrap;list-style:none}
.z4-tiret::-webkit-details-marker{display:none}
.z4-champ{height:32px;border:1px solid var(--bord2);border-radius:4px;background:var(--page);padding:0 8px;font-size:16px;color:var(--t1);min-width:0}
.z4-num{width:58px;text-align:right}
.z4-sim{color:var(--t3)}
.z4-pl{display:flex;align-items:center;gap:6px;min-height:20px}
.z4-pln{width:30px;font-size:12px;color:var(--t3);flex:none}
.z4-plb{position:relative;flex:1;height:8px;border-radius:999px;background:var(--bord)}
.z4-plb u{position:absolute;top:0;bottom:0;background:var(--bord2);border-radius:999px}
.z4-plb s{position:absolute;top:-4px;width:2px;height:16px;background:var(--t1);margin-left:-1px;border-radius:1px}
.z4-plb s.z4-hors{background:var(--att)}

.z4-corps{padding:8px}
.z4-nom{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.z4-nom input{flex:1;border:0;border-bottom:1px solid var(--bord2);border-radius:0;background:transparent;padding:0 2px;font-size:28px;line-height:36px;height:44px;font-weight:600}
.z4-scene{display:grid;grid-template-columns:176px 1fr;gap:10px;align-items:stretch}
.z4-verre{display:flex;flex-direction:column;align-items:center;gap:4px}
.z4-verre svg{display:block}
.z4-cap{font-size:12px;color:var(--t3)}
.z4-col{display:flex;flex-direction:column;gap:10px;justify-content:center}
.z4-l{display:flex;align-items:center;gap:6px;min-height:32px}
.z4-l .z4-unit{color:var(--t3)}
.z4-badge{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(86,127,69,.16);color:var(--hopT);white-space:nowrap}
.z4-sim{font-size:12px}
.z4-mini{display:inline-block;position:relative;width:54px;height:10px;border-radius:999px;background:var(--bord)}
.z4-mini u{position:absolute;left:0;top:0;bottom:0;width:66%;background:var(--eau);border-radius:999px}
.z4-pil{height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--bord2);background:var(--page);font-weight:600;color:var(--t1);white-space:nowrap}
.z4-pil[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff}
.z4-pls{display:flex;flex-direction:column;gap:3px;padding-top:2px}
.z4-pls .z4-pln{width:28px}
.z4-strip{margin-top:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.z4-strip>span{display:flex;flex-direction:column;gap:2px;padding:8px;background:var(--panel);border:1px solid var(--bord);border-radius:8px;font-size:12px;color:var(--t3);min-height:54px;justify-content:center}
.z4-strip b{color:var(--t1);font-size:14px}
</style>
</head>
<body class="z4" data-concept="z4">

<header class="z4-haut" data-commun="en-tete">
  <div class="z4-titre">
    <button type="button" class="z4-ico" aria-label="Fermer" data-role="fermer"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <p class="z4-nomEtape"><b>Identité</b> <span class="z4-mono z4-pos">1/7</span></p>
    <button type="button" class="z4-abandon" data-role="abandonner-brouillon">Abandonner</button>
    <button type="button" class="z4-ico" aria-label="Coller une recette" data-role="import"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H9a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1Z"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2M16 4h2a2 2 0 0 1 2 2v2M11 14h10"/><path d="m17 10 4 4-4 4"/></svg></button>
    <button type="button" class="z4-ico" aria-label="Thème" data-role="theme"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
  </div>
  <nav class="z4-fil" aria-label="Étapes" data-commun="fil">
    <button type="button" aria-current="step"><span>Identité</span><i></i></button><button type="button" ><span>Malts/sucres</span><i></i></button><button type="button" ><span>Houblons</span><i></i></button><button type="button" ><span>Levure</span><i></i></button><button type="button" ><span>Paliers</span><i></i></button><button type="button" ><span>Eau</span><i></i></button><button type="button" ><span>Récap.</span><i></i></button>
  </nav>
</header>
<div class="z4-bandeau" data-commun="bandeau">
  <span class="z4-bl">Grain <b class="z4-mono">8,6 kg</b></span>
  <span class="z4-bl">OG <b class="z4-mono z4-og">1,080</b></span>
  <span class="z4-bl">IBU <b class="z4-mono">~93</b><i class="z4-piste"><u></u><s></s></i></span>
  <span class="z4-bl">EBC <i class="z4-ebc"></i><b class="z4-mono">9,5</b></span>
</div>

<main class="z4-corps" aria-label="Identité">
  <div class="z4-nom"><input value="neipa v3" aria-label="Nom de la bière"></div>
  <div class="z4-scene">
    <div class="z4-verre" data-booster="verre-ebc" role="img" aria-label="Verre à la couleur EBC 9,5">
      <svg viewBox="0 0 120 190" width="170" height="269" fill="none">
        <defs><clipPath id="z4c"><path d="M22 6h76l-4 66c-2 22-4 38-6 50l-2 10c-1 6 2 10 8 12 6 2 8 6 8 10v6H18v-6c0-4 2-8 8-10 6-2 9-6 8-12l-2-10C30 110 28 94 26 72z"/></clipPath></defs>
        <g clip-path="url(#z4c)"><rect x="0" y="0" width="120" height="190" fill="#E0A02E"/><rect x="0" y="0" width="120" height="24" fill="#FFF7E0"/><ellipse cx="60" cy="24" rx="48" ry="6" fill="#FFFFFF" opacity=".9"/><rect x="34" y="32" width="6" height="110" fill="#fff" opacity=".25"/></g>
        <path d="M22 6h76l-4 66c-2 22-4 38-6 50l-2 10c-1 6 2 10 8 12 6 2 8 6 8 10v6H18v-6c0-4 2-8 8-10 6-2 9-6 8-12l-2-10C30 110 28 94 26 72z" stroke="#111" stroke-width="1"/>
      </svg>
      <span class="z4-cap">couleur EBC</span>
    </div>
    <div class="z4-col">
      <div class="z4-l"><button type="button" class="z4-tag" data-booster="pastille-style">Double IPA <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button></div>
      <div class="z4-pls" data-booster="plages-au-style"><span class="z4-cap">22A BJCP 2021</span><span class="z4-pl"><span class="z4-pln">OG</span><i class="z4-plb"><u style="left:42%;width:33%"></u><s style="left:66%" class=""></s></i></span><span class="z4-pl"><span class="z4-pln">IBU</span><i class="z4-plb"><u style="left:43%;width:28%"></u><s style="left:66%" class=""></s></i></span><span class="z4-pl"><span class="z4-pln">EBC</span><i class="z4-plb"><u style="left:30%;width:40%"></u><s style="left:24%" class="z4-hors"></s></i></span></div>
      <div class="z4-l"><input class="z4-champ z4-num z4-mono" value="24" inputmode="decimal" aria-label="Volume en fermenteur"><span class="z4-unit">L</span><span class="z4-badge z4-mono" data-booster="badge-fermenteur">6 L libres</span></div>
      <div class="z4-l"><input class="z4-champ z4-num z4-mono" value="60" inputmode="numeric" aria-label="Durée d'ébullition"><span class="z4-unit">min</span><span class="z4-mini" role="img" aria-label="60 minutes sur 90"><u></u></span><span class="z4-sim z4-mono">~3 L</span></div>
      <div class="z4-l"><button type="button" class="z4-pil" aria-pressed="false" id="z4-nolo" data-booster="pilule-nolo">NOLO non</button></div>
    </div>
  </div>
  <div class="z4-strip" data-booster="materiel-du-plan">
    <span>Royal Catering<b>cuve <span class="z4-mono">45 L</span></b></span>
    <span>fermenteur<b class="z4-mono">30 L</b></span>
    <span>conseil<b class="z4-mono">24 L</b></span>
  </div>
  <div class="z4-strip">
    <span>espace libre<b class="z4-mono">~20 %</b></span>
    <span>avant ébullition<b class="z4-mono">~27 L</b></span>
    <span>brouillon<b>repris</b></span>
  </div>
</main>

<footer class="z4-pied" data-commun="pied">
  <button type="button" class="z4-retour" disabled>Retour</button>
  <button type="button" class="z4-suivant">Suivant — Malts/sucres</button>
</footer>
<button type="button" class="z4-plus" aria-label="Actions rapides" data-commun="plus"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<script>(function(){var b=document.getElementById('z4-nolo');b.addEventListener('click',function(){var on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.textContent=on?'NOLO ≤ 0,5 %':'NOLO non'});})();</script>
</body>
</html>
