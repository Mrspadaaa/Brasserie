<!doctype html>
<html lang="fr" data-theme="clair"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>r6 — Identité 1/7 · un centre de contrôle (v0, 31.10)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--page:#FFFFFF;--panel:#F5F5F5;--haut:#EBEBEB;--bord:#DDDDDD;--bordm:#BFBFBF;--trait:#9E9E9E;--t2:#666666;--t1:#333333;--t0:#111111;
--hop:#567F45;--hopt:#3F6B2E;--eau:#4F7E9B;--eaut:#2F5F7D;--alerte:#C8382F;--alertet:#A8291F;--att:#9C7020;--attt:#7F5B10;
--or:#E0A02E;--paille:#F2C14E;--sans:"Source Sans 3",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--t1);font-family:var(--sans);font-size:14px;line-height:1.3;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.r6-m{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.r6-hd{position:sticky;top:0;z-index:5;background:var(--page);padding:0 8px;border-bottom:1px solid var(--bord)}
.r6-tb{display:flex;align-items:center;gap:6px;height:36px}
.r6-ic{width:28px;height:28px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--t2);flex-shrink:0}
.r6-tt{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px}
.r6-tn{font-size:16px;font-weight:600;color:var(--t0)}
.r6-tp{font-family:var(--mono);font-size:14px;color:var(--t2)}
.r6-ab{height:28px;padding:0 6px;font-size:12px;color:var(--t1);text-decoration:underline;text-underline-offset:2px}
.r6-rail{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.r6-rail button{flex-shrink:0;padding:0 4px;min-height:28px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.r6-rail span{font-size:12px;color:var(--t2);white-space:nowrap}
.r6-rail i{display:block;height:6px;border-radius:9px;background:var(--bord)}
.r6-rail [aria-current] span{color:var(--t0);font-weight:600}
.r6-rail [aria-current] i{background:var(--t0)}
.r6-bd{margin:8px 10px 0;display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:6px 10px;background:var(--panel);border:1px solid var(--bord);border-radius:16px}
.r6-bd>div{display:flex;align-items:baseline;gap:4px}
.r6-bd .r6-l{font-size:14px;color:var(--t2)}
.r6-bd .r6-v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;color:var(--t0)}
.r6-pst{position:relative;align-self:center;width:48px;height:8px;border-radius:9px;background:var(--bord)}
.r6-pst b{position:absolute;top:0;bottom:0;border-radius:9px;background:var(--trait)}
.r6-pst em{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--t0)}
.r6-sw{width:10px;height:10px;border-radius:50%;border:1px solid var(--bordm);background:var(--or);align-self:center}
.r6-pied{display:flex;justify-content:space-between;gap:8px;padding:12px 66px 8px 10px}
.r6-ret{min-height:24px;padding:0 12px;border-radius:10px;border:1px solid var(--bord);color:var(--t2);font-size:14px;opacity:.4}
.r6-suiv{min-height:28px;padding:0 8px;border-radius:10px;background:var(--t0);color:#fff;font-size:14px;font-weight:600}
.r6-fab{position:fixed;right:10px;bottom:14px;width:48px;height:48px;border-radius:50%;background:var(--t0);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px -12px rgba(0,0,0,.5);z-index:6}
.r6-annexe{margin:28px 10px 80px;padding-top:10px;border-top:1px dashed var(--bordm)}
.r6-annexe>h2{font-size:12px;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}

.r6-c{padding:10px 10px 0;min-height:760px}
.r6-cc{user-select:none;-webkit-user-select:none;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:auto;gap:8px}
.r6-t{position:relative;background:var(--panel);border-radius:16px;overflow:hidden;text-align:left;padding:10px 12px;display:flex;flex-direction:column;color:var(--t1)}
.r6-t:active{transform:scale(.985)}
.r6-k{font-size:12px;color:var(--t2);display:flex;align-items:center;gap:5px;position:relative}
.r6-big{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:34px;font-weight:600;color:var(--t0);line-height:38px;position:relative}
.r6-big small{font-size:16px;font-weight:500;color:var(--t1);margin-left:2px}
.r6-sous{font-size:14px;font-weight:600;position:relative}
.r6-nomt{grid-column:1/-1;flex-direction:row;align-items:center;gap:10px;min-height:72px;background:#fff;border:1px solid var(--bord)}
.r6-nomt .r6-nn{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.r6-nom{width:100%;border:0;border-bottom:1.5px dotted var(--trait);background:none;font-size:22px;font-weight:600;color:var(--t0);height:30px;padding:0}
.r6-pas{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 4px;border-radius:10px;background:#D5F2EC;border:1px solid #8ED5C7;color:#0E5A50;font-size:14px;font-weight:600;width:max-content}
.r6-pas i{width:16px;height:16px;border-radius:50%;background:#2BB59F}
.r6-pas small{font-weight:400;font-size:12px}
.r6-ebc{width:44px;height:56px;flex-shrink:0;border-radius:4px 4px 12px 12px;background:linear-gradient(180deg,#FFF4D6 0 18%,#F0C25C 18%,#E0A02E);border:1.5px solid #111}
.r6-vol{grid-column:1/3;grid-row:span 2;min-height:372px;touch-action:none;cursor:ns-resize;background:repeating-linear-gradient(135deg,#E2E2E2 0 2px,#F5F5F5 2px 8px)}
.r6-vfill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,#F2C860,#DE9F2C);transition:height .15s ease}
.r6-vfill.r6-trop{background:repeating-linear-gradient(135deg,#E9A29C 0 3px,#F7D6D3 3px 8px)}
.r6-vcons{position:absolute;left:0;right:0;border-top:2px dashed #111}
.r6-vcons span{position:absolute;right:8px;top:-20px;font-size:12px;color:#111;background:#F5F5F5;border-radius:10px;padding:0 4px}
.r6-vcons b{font-family:var(--mono)}
.r6-vgrad{position:absolute;right:0;top:0;bottom:0;width:10px;background:repeating-linear-gradient(180deg,transparent 0 calc(16.66% - 1px),rgba(17,17,17,.35) calc(16.66% - 1px) 16.66%)}
.r6-vol .r6-sous{color:var(--t0)}
.r6-vol .r6-sous.r6-plein{color:var(--alertet)}
.r6-vtxt{margin-top:auto;position:relative}
.r6-boil{grid-column:3/5;min-height:182px;touch-action:none;cursor:ew-resize;background:#666;color:#fff}
.r6-bfill{position:absolute;left:0;top:0;bottom:0;background:#111;transition:width .15s ease}
.r6-boil .r6-k,.r6-boil .r6-big,.r6-boil .r6-sous{color:#fff}
.r6-boil .r6-big small{color:#fff}
.r6-bgrad{position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(90deg,transparent 0 calc(12.5% - 1px),rgba(255,255,255,.7) calc(12.5% - 1px) 12.5%)}
.r6-boil .r6-sous{font-weight:400;font-size:13px;margin-top:auto}
.r6-boil .r6-sous b{font-family:var(--mono);font-weight:600}
.r6-nolo{min-height:182px;transition:background .15s,color .15s}
.r6-nolo[aria-checked="true"]{background:#111;color:#fff}
.r6-nolo[aria-checked="true"] .r6-k{color:#ccc}
.r6-nolo b{font-size:18px;color:inherit;margin-top:auto}
.r6-nolo .r6-etat{font-size:13px}
.r6-esp{min-height:182px}
.r6-esp .r6-big{font-size:24px;line-height:28px;margin-top:auto}
.r6-tagr{font-size:12px;color:var(--attt);border:1px dashed var(--att);border-radius:10px;padding:0 6px;line-height:18px;width:max-content;margin-top:4px}
.r6-mat{grid-column:1/-1;flex-direction:row;align-items:center;gap:8px;min-height:48px;padding:0 12px}
.r6-mat span{font-size:14px}
.r6-mat b{font-family:var(--mono);color:var(--t0)}
.r6-mat svg:last-child{margin-left:auto;color:var(--t2)}
.r6-rep{grid-column:1/-1;flex-direction:row;align-items:center;gap:8px;min-height:40px;padding:0 12px;background:#fff;border:1px solid var(--bord);color:var(--eaut);font-size:14px}
.r6-rep svg{margin-left:auto}
.r6-al{font-size:12px;font-weight:600}
.r6-annexe .r6-cc{grid-template-columns:repeat(3,1fr)}
.r6-annexe .r6-t{min-height:96px}
</style></head>
<body data-concept="r6">
<header class="r6-hd">
  <div class="r6-tb">
    <button class="r6-ic" aria-label="Fermer"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <p class="r6-tt"><span class="r6-tn">Identité</span><span class="r6-tp">1/7</span></p>
    <button class="r6-ab" aria-label="Abandonner le brouillon">Abandonner</button>
    <button class="r6-ic" aria-label="Coller une recette"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H9a1 1 0 0 0-1 1v2c0 .6.4 1 1 1h6c.6 0 1-.4 1-1V3c0-.6-.4-1-1-1Z"/><path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2M16 4h2a2 2 0 0 1 2 2v2M11 14h10"/><path d="m17 10 4 4-4 4"/></svg></button>
    <button class="r6-ic" aria-label="Changer de thème"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
  </div>
  <nav class="r6-rail" aria-label="Étapes"><button aria-current="step"><span>Identité</span><i></i></button><button><span>Malts/sucres</span><i></i></button><button><span>Houblons</span><i></i></button><button><span>Levure</span><i></i></button><button><span>Paliers</span><i></i></button><button><span>Eau</span><i></i></button><button><span>Récap.</span><i></i></button></nav>
</header>
<div class="r6-bd" data-commun="bandeau">
  <div><span class="r6-l">Grain</span><span class="r6-v">8,6 kg</span></div>
  <div><span class="r6-l">OG</span><span class="r6-v">1,080</span></div>
  <div><span class="r6-l">IBU</span><span class="r6-v">~93</span><span class="r6-pst" role="img" aria-label="style 60–100 IBU"><b style="left:42.9%;width:calc(71.4% - 42.9%)"></b><em style="left:66.4%"></em></span></div>
  <div><span class="r6-l">EBC</span><span class="r6-sw"></span><span class="r6-v">9,5</span></div>
</div>
<main class="r6-c">
  <div class="r6-cc">
    <div class="r6-t r6-nomt">
      <div class="r6-ebc" role="img" aria-label="Couleur prévue, EBC 9,5"></div>
      <div class="r6-nn"><input class="r6-nom" value="neipa v3" aria-label="Nom de la bière"><button class="r6-pas" aria-haspopup="listbox"><i></i>Double IPA <small>22A</small><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button></div>
    </div>

    <div class="r6-t r6-vol" data-booster="tuile-volume" role="slider" tabindex="0" aria-label="Volume en fermenteur" aria-valuemin="1" aria-valuemax="33" aria-valuenow="24">
      <div class="r6-vfill" data-role="vfill" style="height:80%"></div>
      <div class="r6-vcons" style="bottom:80%"><span>conseil <b>~24</b></span></div>
      <div class="r6-vgrad"></div>
      <span class="r6-k"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.78" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="3"/><path d="M6 11h12M10 2h4"/></svg> Fermenteur <b class="r6-m" style="color:var(--t0)">30 L</b></span>
      <div class="r6-vtxt"><div class="r6-big" data-role="vol">24<small>L</small></div><div class="r6-sous" data-role="libre">6 L libres</div></div>
    </div>

    <div class="r6-t r6-boil" data-booster="tuile-ebullition" role="slider" tabindex="0" aria-label="Durée d'ébullition" aria-valuemin="0" aria-valuemax="120" aria-valuenow="60">
      <div class="r6-bfill" data-role="bfill" style="width:50%"></div>
      <div class="r6-bgrad"></div>
      <span class="r6-k"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.78" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.3 1.6 1.2 2.5 2 2.5-.6-3 0-5.5 1-8Z"/></svg> Ébullition</span>
      <div class="r6-big" data-role="boil">60<small>min</small></div>
      <div class="r6-sous"><b data-role="evap">~3 L</b> évaporés</div>
    </div>

    <button class="r6-t r6-nolo" role="switch" aria-checked="false" data-booster="tuile-nolo">
      <span class="r6-k"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l-1.6 17.2a1 1 0 0 1-1 .8H8.6a1 1 0 0 1-1-.8Z"/><path d="M6.6 9h10.8"/><circle cx="12" cy="15" r="2.4"/></svg></span>
      <b>NOLO</b><span class="r6-etat"><span class="r6-m">≤ 0,5 %</span></span>
    </button>

    <button class="r6-t r6-esp" aria-expanded="false">
      <span class="r6-k">Espace libre</span>
      <span class="r6-big">20<small>%</small></span>
      <span class="r6-tagr">repère</span>
    </button>

    <button class="r6-t r6-rep" aria-expanded="false">Repères du style · 22A · BJCP 2021 <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <button class="r6-t r6-mat" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.78" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="3"/><path d="M6 11h12M10 2h4"/></svg><span>Royal Catering · cuve <b>45 L</b></span><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
  </div>
  <nav class="r6-pied" data-commun="pied"><button class="r6-ret" disabled>Retour</button><button class="r6-suiv">Suivant — Fermentescibles</button></nav>
</main>
<section class="r6-annexe" aria-label="États de la maquette">
  <h2>États (annexe de la maquette)</h2>
  <div class="r6-cc">
    <div class="r6-t r6-vol" style="grid-column:auto;grid-row:auto;min-height:150px"><div class="r6-vfill r6-trop" style="height:100%"></div><span class="r6-k">Fermenteur <b class="r6-m" style="color:var(--t0)">30 L</b></span><div class="r6-vtxt"><div class="r6-big">30<small>L</small></div><div class="r6-sous r6-plein">Plein : réduis</div></div></div>
    <div class="r6-t r6-vol" style="grid-column:auto;grid-row:auto;min-height:150px;background:var(--panel)"><span class="r6-k">Fermenteur <b class="r6-m" style="color:var(--t0)">30 L</b></span><div class="r6-vtxt"><div class="r6-big">—<small>L</small></div><div class="r6-sous" style="color:var(--t2)">à renseigner</div></div></div>
    <button class="r6-t r6-nolo" role="switch" aria-checked="true" style="min-height:150px"><span class="r6-k"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12l-1.6 17.2a1 1 0 0 1-1 .8H8.6a1 1 0 0 1-1-.8Z"/><path d="M6.6 9h10.8"/><circle cx="12" cy="15" r="2.4"/></svg></span><b>NOLO</b><span class="r6-etat">activé</span></button>
  </div>
</section>
<button class="r6-fab" aria-label="Actions rapides" data-commun="lanceur"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<script>(function(){
var q=function(s){return document.querySelector(s)};
var vol=24,boil=60;
function maj(){
  var f=q('[data-role="vfill"]'); f.style.height=Math.min(100,vol/30*100)+'%'; f.classList.toggle('r6-trop',vol>=30);
  q('[data-role="vol"]').innerHTML=vol+'<small>L</small>';
  var l=30-vol,t=q('[data-role="libre"]'); t.textContent=l>0?l+' L libres':'Plein : réduis le volume'; t.classList.toggle('r6-plein',l<=0);
  q('.r6-vol[data-booster]').setAttribute('aria-valuenow',vol);
  q('[data-role="bfill"]').style.width=(boil/120*100)+'%';
  q('[data-role="boil"]').innerHTML=boil+'<small>min</small>';
  var e=Math.round(3*boil/60*10)/10; q('[data-role="evap"]').textContent=e>0?'~'+String(e).replace('.',',')+' L':'0 L';
  q('.r6-boil').setAttribute('aria-valuenow',boil);
}
function glisse(el,fn){var on=false;el.addEventListener('pointerdown',function(e){on=true;el.setPointerCapture(e.pointerId);fn(e);});el.addEventListener('pointermove',function(e){if(on)fn(e);});el.addEventListener('pointerup',function(){on=false;});}
var tv=q('.r6-vol[data-booster]'), tb=q('.r6-boil');
glisse(tv,function(e){var r=tv.getBoundingClientRect();vol=Math.max(1,Math.min(32,Math.round((r.bottom-e.clientY)/r.height*30)));maj();});
glisse(tb,function(e){var r=tb.getBoundingClientRect();boil=Math.max(0,Math.min(120,Math.round((e.clientX-r.left)/r.width*120/5)*5));maj();});
var n=q('[data-booster="tuile-nolo"]'); n.addEventListener('click',function(){n.setAttribute('aria-checked',n.getAttribute('aria-checked')==='true'?'false':'true');});
})();</script>
</body></html>
