<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#fff;color:#111;font:16px/1.3 sans-serif}
.rang{position:relative;margin:12px;padding:10px 14px}
/* la bande de sélection est un frère du texte, pas son ancêtre (le défaut vu dans g1, 31.10) */
.bande{position:absolute;inset:0;background:#1f2937;border-radius:10px;pointer-events:none}
.txt{position:relative;color:#fff}
</style></head>
<body>
<p>Un texte clair sur une bande sombre posée à côté.</p>
<div class="rang"><span class="bande"></span><span class="txt">Volume 30 L</span></div>
</body></html>
