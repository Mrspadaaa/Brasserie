<!doctype html>
<html lang="fr" data-theme="clair" class="h-full bg-cave-950 text-cave-200 antialiased selection:bg-ebc-straw selection:text-cave-950">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍺</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="L'Affinée" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      // Thème gardé sur l'appareil, posé avant le premier rendu (sans clignotement). Clé : src/theme/theme.ts.
      try { if (localStorage.getItem('laffinee.theme') === 'cave') { document.documentElement.dataset.theme = 'cave'; document.querySelector('meta[name="theme-color"]').setAttribute('content', '#12100E'); } } catch (e) {}
    </script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>L'Affinée — Micro-Brasserie</title>
  </head>
  <body class="h-full overflow-x-hidden bg-cave-950 font-sans">
    <div id="root" class="min-h-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
