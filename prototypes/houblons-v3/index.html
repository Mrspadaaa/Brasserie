<title>Houblons de la recette</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Étape Houblons, prototype v3 (mission #119). Téléphone : en-tête, jauge IBU, puis une zone
   qui défile (mon houblonnage, mes houblons classés) et, dès 2 houblons cochés, le volet de
   comparaison qui prend sa place en bas sans rien couvrir. Bureau (≥ 900 px) : trois colonnes.
   Jetons de DESIGN.md ; app sombre. Couleurs des houblons comparés : validées (CVD, contraste). */
:root {
  --c950: #12100E; --c900: #1A1613; --c850: #221D19; --c800: #2C2521; --c700: #3D342E; --c600: #574A42;
  --c400: #9A8A7E; --c200: #D8CEC5; --c50: #F5F0EA;
  --straw: #F2C14E; --attention: #E3B55D; --alert-strong: #F29289; --hop: #6E9B5B; --hop-text: #9CC488;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c9a227;
  --sans: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--c950); color: var(--c200); font: 14px/18px var(--sans); -webkit-text-size-adjust: 100%; }
::selection { background: #F2C14E55; color: var(--c50); }
button, select, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--straw); outline-offset: 1px; border-radius: 6px; }
a { color: var(--c50); text-underline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--c400); }
.strong { color: var(--c50); }
.warn { color: var(--attention); }
.bad { color: var(--alert-strong); }
.ok { color: var(--hop-text); }
.ico { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
*::-webkit-scrollbar { width: 6px; height: 6px; } *::-webkit-scrollbar-thumb { background: var(--c700); border-radius: 3px; } *::-webkit-scrollbar-track { background: transparent; }

#app { height: 100%; display: flex; flex-direction: column; overflow: hidden; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.progp { display: none; }
.ph3 { margin: 0; padding: 10px 10px 4px; font-size: 13px; font-weight: 600; color: var(--c50); }
.ph3 .muted { font-weight: 400; font-size: 12px; }
.top { flex: none; background: var(--c950); }
.hd { height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 10px; border-bottom: 1px solid var(--c800); }
.hd .title { display: flex; align-items: center; gap: 6px; min-width: 0; height: 32px; padding: 0 4px; border-radius: 10px; }
.hd .title b { color: var(--c50); font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hd .title .ico { color: var(--c400); }
.hd .meta { color: var(--c400); font-size: 12px; white-space: nowrap; }
.sp { flex: 1; }
.btn { height: 28px; padding: 0 8px; border-radius: 10px; background: var(--c850); border: 1px solid var(--c700); color: var(--c200); display: inline-flex; align-items: center; gap: 4px; font-size: 13px; white-space: nowrap; }
.btn.primary { background: var(--straw); color: var(--c950); border-color: var(--straw); font-weight: 600; }
.btn.ghost { background: none; border-color: transparent; }
.btn.sq { width: 28px; padding: 0; justify-content: center; }
.gauge { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--c800); min-height: 40px; }
.gauge .v { font: 600 20px/24px var(--mono); color: var(--c50); }
.gauge .u { font-size: 12px; color: var(--c400); }
.track { position: relative; flex: 1; height: 10px; border-radius: 5px; background: var(--c850); min-width: 60px; }
.track .band { position: absolute; top: 0; bottom: 0; border: 1px solid var(--hop); background: #6E9B5B33; border-radius: 5px; }
.track .mk { position: absolute; top: -3px; width: 3px; height: 16px; border-radius: 2px; background: var(--c50); transform: translateX(-1px); }
.track .dryr { position: absolute; top: 3px; height: 4px; background: var(--c200); opacity: .5; border-radius: 2px; }
.gauge .aro { font-size: 12px; color: var(--c400); max-width: 40%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }

.main { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
.sec { display: flex; align-items: center; gap: 6px; padding: 6px 10px 4px; min-height: 32px; }
.sec h2 { margin: 0; font-size: 14px; font-weight: 600; color: var(--c50); white-space: nowrap; }
.sec .muted { font-size: 12px; }
.seg { display: inline-flex; border: 1px solid var(--c700); border-radius: 10px; overflow: hidden; background: var(--c900); }
.seg button { height: 26px; padding: 0 9px; font-size: 13px; color: var(--c400); }
.seg button[aria-pressed="true"] { background: var(--c800); color: var(--c50); font-weight: 600; }
.grp { display: flex; align-items: center; gap: 6px; padding: 3px 10px; min-height: 24px; font-size: 12px; color: var(--c400); background: var(--c900); border-top: 1px solid var(--c800); }
.grp b { color: var(--c200); font-weight: 600; }

.row { display: flex; align-items: center; min-height: 44px; border-top: 1px solid var(--c850); padding-right: 6px; }
.row.on { background: var(--c900); }
.cb { width: 36px; height: 44px; flex: none; display: grid; place-items: center; }
.cb .box { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--c600); display: grid; place-items: center; }
.cb[aria-checked="true"] .box { border-color: transparent; }
.rowmain { flex: 1; min-width: 0; text-align: left; padding: 4px 0; min-height: 40px; display: flex; flex-direction: column; justify-content: center; }
.rowmain .l1 { display: flex; align-items: baseline; gap: 6px; }
.rowmain .nm { color: var(--c50); font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rowmain .rk { font: 600 12px var(--mono); color: var(--c400); }
.rowmain .l2 { font-size: 12px; line-height: 16px; color: var(--c400); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.qty { display: flex; flex-direction: column; align-items: flex-end; font: 600 14px/18px var(--mono); color: var(--c50); padding: 0 8px 0 4px; white-space: nowrap; }
.qty .zero { color: var(--c400); font: 400 13px/18px var(--sans); }
.qty small { font: 400 12px/16px var(--mono); color: var(--c400); }
.qty small.warn { color: var(--attention); }
.cb .box svg { width: 14px; height: 14px; }
.addb { width: 28px; height: 28px; border-radius: 10px; border: 1px solid var(--c700); display: grid; place-items: center; color: var(--c200); background: var(--c850); flex: none; }
.addb.done { border-color: var(--hop); color: var(--hop-text); }
.meter { position: relative; width: 56px; height: 6px; border-radius: 3px; background: var(--c800); flex: none; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.lv { display: inline-flex; gap: 1px; margin-left: 2px; vertical-align: middle; }
.lv i { width: 3px; height: 8px; border-radius: 1px; background: var(--c700); }
.lv i.f { background: var(--c200); }
.axw { color: var(--c200); }
.axw.st { color: var(--c50); font-weight: 600; }
.info { padding: 6px 10px 8px 36px; font-size: 13px; line-height: 18px; color: var(--c200); background: var(--c900); border-top: 1px dashed var(--c800); }
.info p { margin: 0 0 4px; }
.info .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.more { display: flex; justify-content: center; padding: 8px 10px 12px; border-top: 1px solid var(--c850); }

/* Mon houblonnage */
.adds { border-bottom: 1px solid var(--c800); }
.add { border-top: 1px solid var(--c850); }
.addrow { display: flex; align-items: center; padding-right: 6px; }
.addh { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; min-height: 36px; padding: 2px 6px 2px 10px; text-align: left; }
.addh .nm { flex: 1; min-width: 0; color: var(--c50); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.addh .d { font: 600 13px var(--mono); color: var(--c50); }
.addh .t { font-size: 12px; color: var(--c400); min-width: 54px; }
.addh .i { font: 600 13px var(--mono); color: var(--c200); min-width: 54px; text-align: right; }
.addh .st { font-size: 12px; min-width: 64px; text-align: right; }
.ed { padding: 4px 10px 8px; background: var(--c900); display: grid; gap: 6px; }
.step { display: inline-flex; align-items: center; gap: 4px; }
.step input { width: 64px; height: 32px; border-radius: 10px; border: 1px solid var(--c700); background: var(--c850); color: var(--c50); text-align: center; font: 600 16px var(--mono); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { height: 28px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--c700); background: var(--c850); font-size: 13px; color: var(--c200); display: inline-flex; align-items: center; gap: 4px; }
.chip[aria-pressed="true"] { background: var(--c700); color: var(--c50); border-color: var(--c400); font-weight: 600; }
.ed .line { font-size: 12px; color: var(--c400); }
.ed .acts { display: flex; gap: 6px; }
.note { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 13px; background: var(--c850); border-top: 1px solid var(--c800); }
.empty { display: flex; align-items: center; gap: 8px; padding: 4px 10px 8px; font-size: 13px; color: var(--c400); }

/* Comparaison */
.dock { flex: none; height: 52dvh; min-height: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--c900); border-top: 1px solid var(--c700); border-radius: 16px 16px 0 0; box-shadow: 0 -12px 40px -16px rgba(0,0,0,.8); }
.dock.peek { height: auto; }
.peekb { display: flex; gap: 2px; padding: 4px 8px 6px 0; }
.peekb .radar { padding: 0; flex: none; }
.peekb .radar svg { width: 200px; height: 200px; max-width: none; }
.peekr { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; padding-top: 2px; }
.peekr .ph { display: flex; align-items: center; gap: 4px; }
.peekr h2 { margin: 0; font-size: 14px; color: var(--c50); white-space: nowrap; }
.pl { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 4px 6px; align-items: center; font-size: 13px; }
.pl .nm { color: var(--c50); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pl .mono { color: var(--c200); font-size: 13px; }
.peekr .cap { font-size: 12px; color: var(--c400); }
.peekr .btn { align-self: flex-start; }
.app.full .main { display: none; }
.app.full .dock { flex: 1; height: auto; border-radius: 0; }
.dockh { flex: none; display: flex; align-items: center; gap: 6px; padding: 6px 8px 4px 10px; }
.dockh h2 { margin: 0; font-size: 14px; color: var(--c50); }
.dockb { flex: 1; overflow-y: auto; padding-bottom: 10px; }
.legend { display: flex; gap: 4px; padding: 0 8px 4px 10px; flex-wrap: wrap; }
.lgi { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 2px 0 6px; border-radius: 10px; background: var(--c850); border: 1px solid var(--c800); font-size: 13px; color: var(--c50); max-width: 100%; }
.lgi .q { font: 12px var(--mono); color: var(--c400); }
.lgi button { width: 24px; height: 24px; display: grid; place-items: center; color: var(--c400); border-radius: 8px; }
.shape { width: 12px; height: 12px; flex: none; }
.cmp h3 { margin: 0; padding: 10px 10px 4px; font-size: 13px; font-weight: 600; color: var(--c50); display: flex; align-items: baseline; gap: 6px; }
.cmp h3 .muted { font-weight: 400; font-size: 12px; }
.radar { display: flex; justify-content: center; padding: 0 4px; }
.radar svg { width: 100%; max-width: 240px; height: auto; }
.app.full .radar svg { max-width: 320px; }
.dots { padding: 0 10px; display: grid; gap: 1px; }
.dr { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 8px; font-size: 12px; }
.dr .tr.sc { height: 16px; }
.dr .tr.sc b { position: absolute; top: 0; transform: translateX(-50%); font: 400 12px var(--mono); color: var(--c400); }
.dr .t { color: var(--c400); }
.dr .t.st { color: var(--c50); font-weight: 600; }
.dr .tr { position: relative; margin: 0 6px; }
.dr .tr .g { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--c800); }
.dr .tr .mk { position: absolute; width: 10px; height: 10px; transform: translateX(-5px); line-height: 0; }
.dr .tr .mk .shape { width: 10px; height: 10px; }
.dr .n { text-align: right; color: var(--c400); font-size: 12px; }
.diffs { padding: 0 10px; font-size: 12px; color: var(--c400); display: grid; gap: 2px; }
.bars { padding: 0 10px; display: grid; gap: 3px; }
.br { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; align-items: center; gap: 8px; min-height: 22px; font-size: 12px; }
.br .o { color: var(--c400); font-size: 12px; margin-left: 6px; }
@media (min-width: 900px) { .dockh [data-act="full"] { display: none; } }
.br .t { color: var(--c200); display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.br .b { position: relative; height: 8px; background: var(--c850); border-radius: 4px; }
.br .b i { position: absolute; top: 0; height: 8px; border-radius: 4px; }
.br .b .tick { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--c50); border-radius: 1px; }
.br .b .need { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--c50); }
.br .n { text-align: right; color: var(--c200); font: 12px var(--mono); white-space: nowrap; }
.metric { padding: 2px 10px 6px; }
.metric .mh { display: flex; justify-content: space-between; font-size: 12px; color: var(--c400); padding: 2px 0; }
.metric .mh b { color: var(--c200); font-weight: 600; }
.cls { font-size: 12px; padding: 1px 6px; border-radius: 8px; border: 1px solid var(--c700); color: var(--c200); white-space: nowrap; }
.tagsl { padding: 0 10px; display: grid; gap: 4px; font-size: 12px; color: var(--c200); }
.tagsl .t { display: flex; gap: 6px; align-items: baseline; }
.cmpacts { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px 4px; }
.src { padding: 8px 10px 0; font-size: 12px; color: var(--c400); }
.hint { padding: 8px 10px; font-size: 13px; color: var(--c400); display: grid; gap: 8px; justify-items: start; }

/* Feuilles */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 86dvh; z-index: 21; background: var(--c900); border-radius: 24px 24px 0 0; border-top: 1px solid var(--c700); box-shadow: 0 -12px 40px -16px rgba(0,0,0,.8); display: flex; flex-direction: column; }
.sheet.fullv { top: 0; max-height: none; border-radius: 0; }
.sheeth { flex: none; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 8px 0 12px; border-bottom: 1px solid var(--c800); }
.sheeth h2 { margin: 0; font-size: 16px; color: var(--c50); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheetb { flex: 1; overflow-y: auto; padding-bottom: 16px; }
.field { display: flex; align-items: center; gap: 8px; padding: 6px 12px; }
.field label { width: 96px; font-size: 13px; color: var(--c400); }
.field input, .search { height: 32px; border-radius: 10px; border: 1px solid var(--c700); background: var(--c850); color: var(--c50); padding: 0 10px; font-size: 16px; }
.field input { width: 96px; font-family: var(--mono); }
.search { width: calc(100% - 24px); margin: 6px 12px; }
.stl { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 36px; padding: 2px 12px; text-align: left; border-top: 1px solid var(--c850); }
.stl .c { font: 12px var(--mono); color: var(--c400); width: 34px; }
.stl .n { flex: 1; color: var(--c200); }
.stl[aria-current="true"] .n { color: var(--c50); font-weight: 600; }
.stl .i { font: 12px var(--mono); color: var(--c400); }
.sub { display: flex; align-items: center; gap: 8px; min-height: 52px; width: 100%; padding: 4px 12px; text-align: left; border-top: 1px solid var(--c850); }
.sub .m { flex: 1; min-width: 0; }
.sub .m b { color: var(--c50); display: block; }
.sub .m small { display: block; font-size: 12px; color: var(--c400); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub .d { font: 600 14px var(--mono); color: var(--c50); text-align: right; }
.sub .s { font-size: 12px; text-align: right; display: block; }

/* Questions */
.qg { padding: 10px 12px 2px; font-size: 12px; font-weight: 600; color: var(--c400); letter-spacing: .02em; }
.qa { border-top: 1px solid var(--c850); }
.qhead { display: flex; gap: 8px; align-items: flex-start; width: 100%; padding: 8px 12px 2px; text-align: left; }
.qhead .qt { flex: 1; color: var(--c50); font-weight: 600; font-size: 14px; }
.qhead .ico { margin-top: 2px; color: var(--c400); transition: transform .15s ease-out; }
.qa.open .qhead .ico { transform: rotate(180deg); }
.ans { padding: 0 12px 8px; font-size: 13px; line-height: 18px; color: var(--c200); }
.ans .nd { color: var(--attention); font-weight: 600; }
.ans ul { margin: 2px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.ans li { display: flex; gap: 8px; align-items: baseline; }
.ans li > span:first-child { flex: 1; min-width: 0; }
.ans li .mono { color: var(--c50); white-space: nowrap; }
.ans li .v { color: var(--c50); text-align: right; }
.qnav { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 12px 4px; }
.ans li .sp { display: none; }
.pick { height: 28px; border-radius: 10px; border: 1px solid var(--c700); background: var(--c850); color: var(--c50); padding: 0 6px; font-size: 13px; max-width: 170px; }
.det { padding: 6px 12px 10px; font-size: 12px; line-height: 17px; color: var(--c400); background: var(--c850); border-top: 1px dashed var(--c800); }
.det p { margin: 0 0 4px; }
.det b { color: var(--c200); font-weight: 600; }
.mini { display: flex; gap: 8px; align-items: center; }
.mini svg { flex: none; }
.toast { display: flex; align-items: center; gap: 8px; padding: 4px 10px; min-height: 36px; font-size: 13px; background: var(--c850); border-top: 1px solid var(--c700); }

@media (min-width: 900px) {
  #app { display: grid; grid-template-columns: 340px minmax(0, 1fr) 460px; grid-template-rows: auto minmax(0, 1fr); }
  .top { grid-column: 1 / -1; }
  .gauge .track { max-width: 520px; }
  .progp { display: block; border-top: 1px solid var(--c800); }
  .progp .radar svg { max-width: 260px; }
  .radar svg, .app.full .radar svg { max-width: 320px; }
  .main { display: contents; }
  .col-a { grid-column: 1; grid-row: 2; overflow-y: auto; border-right: 1px solid var(--c800); }
  .col-b { grid-column: 2; grid-row: 2; overflow-y: auto; }
  .dock { grid-column: 3; grid-row: 2; height: auto; border-radius: 0; border-top: 0; border-left: 1px solid var(--c700); box-shadow: none; }
  .app.full .main { display: contents; }
  .sheet { left: 50%; right: auto; width: 640px; transform: translateX(-50%); bottom: 0; }
  .sheet.fullv { top: 24px; bottom: 24px; border-radius: 24px; }
  .gauge .aro { max-width: 120px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

q('Q09', 'Selon la bière', 'Lager juicy, très aromatique et non amère', () => {

  const A = sum(share.map(({ h, g }) => g * 1000 / c.V * alphaOf(h).val / 100 * u70));
  const low = rankBitter(inStock(), st, { ibu: 10 }, c).find((r) => r.enough); const B = 10; const dry = dryBitter(gd, c.V, [B, B]);
  return { short: `<ul>${li(`<b class="strong">Tout au whirlpool à 70 °C</b> : ${share.map(({ h, g }) => `${esc(hname(h))} ${nf(g)} g`).join(' + ')}`, `${nf(A)} IBU`)}${li(`<b class="strong">Amertume basse + dry hop</b> : ${low ? `${esc(hname(low.h))} ${nf(low.dose)} g à 60′` : '—'}, puis ${gd} g à cru`, dry && !dry.over ? `${nf(dry.lo)}–${nf(dry.hi)} IBU` : '')}</ul>`,
    detail: `<p>Base : Helles (BJCP 4A, ${st.ibu[0]}–${st.ibu[1]} IBU). Houblons « juicy » : les plus tropicaux, agrumes et fruits de ton stock, ${nf(START_GL.wp, 0)} g/L au whirlpool (dose de départ de l’app, plafonnée au stock). À 70 °C au lieu de 80 °C, l’isomérisation est environ deux fois plus lente : moins d’IBU pour le même arôme. Le dry hop en lager se fait à froid ; amertume à cru en plage (Maye 2016). L’écart entre IBU calculé et amertume perçue n’est pas modélisé.</p>` };
});
q('Q10', 'Selon la bière', 'Pastry stout trop sucrée : compenser avec le houblon ?', () => {
  const st = STYC.get('16A'); const mine = /stout/i.test(style().en) && S.adds.length > 0;
  const og = mine ? S.og : 1.09; const c = { ...ctx(), og }; const cur = mine ? prog().hot : 30;
  const pts = (og - 1) * 1000; const bugu = cur / pts;
  const mid = (st.og[0] + st.og[1]) / 2; const ref = [st.ibu[0] / ((mid - 1) * 1000), st.ibu[1] / ((mid - 1) * 1000)]; const refMid = (ref[0] + ref[1]) / 2;
  const add = Math.max(0, refMid * pts - cur);
  const b = add > 0 ? rankBitter(inStock(), st, { ibu: add }, c).find((r) => r.enough) : null;
  return { short: `${mine ? 'Ta recette' : 'Exemple, pastry stout'} : BU:GU <b class="strong mono">${nf(bugu, 2)}</b> (${nf(cur)} IBU, DI ${nf(og, 3)}) ; stout douce BJCP : ${nf(ref[0], 2)}–${nf(ref[1], 2)}. ${add > 0 ? `Levier houblon : <b class="strong mono">+${nf(add)} IBU</b> pour revenir au rapport moyen (${nf(refMid, 2)})${b ? ` = ${esc(hname(b.h))} ${nf(b.dose)} g à 60′` : ''}.` : 'Ton rapport est déjà au-dessus du rapport moyen du style.'} Limite : l’amertume équilibre, elle n’enlève pas le sucre.`,
    detail: `<p>${mine ? 'Ta recette.' : 'Exemple : pastry stout à DI 1,090 et 30 IBU (ton houblonnage est vide ou ta recette n’est pas une stout).'} Repère : IBU / points de densité de la stout douce BJCP 16A (${st.ibu[0]}–${st.ibu[1]} IBU, DI moyenne ${nf(mid, 3)}). L’équilibre sucre–amertume perçu n’est pas modélisé ; densité finale, levure et malt restent les autres leviers.</p>` };
});
q('Q11', 'Selon la bière', 'Bière de Champagne florale : la biotransformation peut-elle aider ?', () => {
  const pool = [...inStock(), ...catalogue()].filter((h) => h.v.hs?.lin).sort((a, b) => (b.g > 0) - (a.g > 0) || b.v.hs.lin[1] - a.v.hs.lin[1]).slice(0, 3);
  const flo = [...catalogue()].filter((h) => h.v.hs?.lin).sort((a, b) => b.v.hs.lin[1] - a.v.hs.lin[1]).slice(0, 3);
  return { short: `Possible, si les houblons apportent du linalol et du géraniol et si la levure les transforme. Deux voies :<ul>${li(`Whirlpool 80 °C, houblons riches en linalol : ${flo.map((h) => `${esc(h.v.n)} ${rng(h.v.hs.lin)} %`).join(', ')}`)}${li(`Dry hop pendant la fermentation active ; dans ton stock : ${pool.filter((h) => h.g > 0).map((h) => `${esc(hname(h))} ${rng(h.v.hs.lin)} %`).join(', ') || 'aucun linalol documenté'}`)}</ul>Ta levure : ${ND('la β-lyase et la conversion des terpènes des levures du dépôt (inconnues pour les 6)')}`,
    detail: '<p>Linalol en % de l’huile : fiches Hopsteiner 2025 (77 variétés). La conversion du géraniol en citronellol par la levure est décrite (Takoi et al.) mais non chiffrée par levure dans les données. Amertume légère : garder l’essentiel du houblon après l’ébullition.</p>' };
});
q('Q13', 'Selon la bière', 'Avec ma levure, quels houblons et quand pour ma NEIPA ?', () => {
  const st = STYC.get('21C'); const pool = [...inStock(), ...catalogue()].filter((h) => h.v.hs?.th === 'forte');
  const r = rankAroma(pool, st).filter((x) => x.cls !== 'hors').sort((a, b) => (b.h.g > 0) - (a.h.g > 0)).slice(0, 3);
  const gd = Math.round(START_GL.dry * S.V), gw = Math.round(START_GL.wp * S.V);
  return { short: `<ul>${li(`<b class="strong">1. Dry hop en fermentation active (J2–J3), ${nf(START_GL.dry, 0)} g/L (${gd} g)</b> : ${r.map((x) => `${esc(hname(x.h))}${x.h.g > 0 ? ` (stock ${nf(x.h.g)} g)` : ' (à acheter)'}`).join(', ')} : thiols forts, biotransformation possible ; hop creep à surveiller`)}${li(`<b class="strong">2. Whirlpool 80 °C, ${nf(START_GL.wp, 0)} g/L (${gw} g), puis dry hop après fermentation, ${nf(START_GL.dry, 0)} g/L</b> : arôme plus prévisible, sans compter sur la levure`)}</ul>Part de ta levure : ${ND('des essais houblon × levure ; β-lyase inconnue pour les 6 levures des données')}`,
    detail: '<p>Classe « Thiol impact » forte : fiches Hopsteiner (thiols libres du houblon, pas un rendement de levure). Style IPA trouble (BJCP 21C) : herbacé et végétal exclus. Un seul essai houblon × levure documenté dans les données (Cascade, Lafontaine 2018).</p>' };
});
q('Q27', 'Selon la bière', 'NOLO : quels houblons et quelle stratégie ?', () => ({ short: ND('des sources houblon propres aux bières sans ou peu alcoolisées (aucune dans les données ; les données NOLO portent sur les levures et l’alcool)'), detail: '<p>Le classement et les simulations restent utilisables en choisissant le style de base ; l’effet de l’absence d’alcool sur l’amertume et l’arôme n’est pas documenté.</p>' }));
q('Q28', 'Selon la bière', 'Sour : quels houblons avec ma culture acidifiante ?', () => {
  const b = STYC.get('23A'), g = STYC.get('23G');
  return { short: `${ND('la tolérance de ta culture acidifiante au houblon (aucun seuil dans les données)')} Repère de style : Berliner Weisse ${b.ibu[0]}–${b.ibu[1]} IBU, Gose ${g.ibu[0]}–${g.ibu[1]} IBU (BJCP).`, detail: '<p>Les iso-alpha-acides freinent certaines bactéries lactiques ; le seuil dépend de la souche et n’est pas documenté ici.</p>' };
});
q('Q26', 'Cas particuliers', 'Goût trop herbeux ou raté : que faire ?', () => {
  const P = progOrProposal(); const herb = P.adds.map((a) => hop(a.key)).filter((h) => h.v.ax && h.v.ax[AXI.her] >= 1);
  return { short: `${ND('des sources sur les défauts (herbacé, végétal) et leurs remèdes')} Dans ${P.label}, l’herbacé vient de : ${herb.map((h) => esc(hname(h))).join(', ') || 'aucun houblon décrit herbacé'}.`, detail: '<p>Pour le prochain brassin, la liste « pour l’arôme » montre l’herbacé de chaque houblon ; l’IPA trouble l’exclut.</p>' };
});
q('Q29', 'Cas particuliers', 'Houblon maison ou sans analyse : comment l’utiliser ?', () => {
  const h = hop(S.qp.q29) || hop('cascade'); const v = h.v; const c = ctx(); const n = need(c); const a = v.a;
  if (!a) return { short: ND('une plage d’alpha pour cette variété'), detail: '' };
  const d = n.ibu * c.V / (1000 * (a[0] + a[1]) / 2 / 100 * util(c, 'b60'));
  const lo = ibuG(d, a[0], 'b60', c), hi = ibuG(d, a[1], 'b60', c);
  return { short: `${pickVar('q29', v.id, D.varieties.map((x) => [x.id, x.n]))} sans analyse : α ${rng(a)} % (plage de la variété). Départ : <b class="strong mono">${nf(d)} g</b> à 60′ → entre <b class="strong mono">${nf(lo)} et ${nf(hi)} IBU</b>. Note l’amertume perçue pour caler l’alpha au prochain brassin.`,
    detail: `<p>Dose pour ${n.ibu} IBU au milieu de la plage d’alpha Beer Maverick ; l’IBU réel peut aller du bas au haut de la plage. Un houblon maison varie davantage qu’un lot analysé ; garder ses ajouts d’arôme tardifs, moins sensibles à l’alpha.</p>` };
});
q('Q30', 'Cas particuliers', 'Où acheter ce houblon en Suisse ?', () => ({ short: ND('des offres de houblon datées de fournisseurs suisses (les données d’approvisionnement ne couvrent que les levures)'), detail: '<p>Les houblons « à acheter » de la liste restent marqués comme tels ; aucun lien d’achat n’est inventé.</p>' }));

function renderQuestions() {
  let h = `<section class="sheet fullv" role="dialog" aria-modal="true" aria-label="Mes questions"><div class="sheeth"><h2>Mes questions</h2><span class="muted" style="font-size:12px">calculé sur ta recette et ton stock</span><span class="sp"></span><button class="btn sq" data-act="close" aria-label="Fermer">${ico('x')}</button></div><div class="sheetb">`;
  const groups = [...new Set(Q.map((it) => it.group))];
  h += `<nav class="qnav" aria-label="Aller à">${groups.map((g, i) => `<button class="chip" data-act="qjump" data-g="${i}">${g} · ${Q.filter((it) => it.group === g).length}</button>`).join('')}</nav>`;
  let grp = null;
  for (const it of Q) {
    if (it.group !== grp) { grp = it.group; h += `<div class="qg" data-g="${groups.indexOf(grp)}">${grp}</div>`; }
    let r; try { r = it.fn(); } catch (e) { r = { short: '<span class="bad">Erreur de calcul</span>', detail: esc(e.message) }; }
    const open = S.qOpen.has(it.id);
    h += `<div class="qa${open ? ' open' : ''}" data-q="${it.id}"><button class="qhead" data-act="qopen" data-q="${it.id}" aria-expanded="${open}"><span class="qt">${esc(it.title)}</span>${ico('down')}</button><div class="ans">${r.short}</div>${open && r.detail ? `<div class="det">${r.detail}</div>` : ''}</div>`;
  }
  return h + '</div></section>';
}

/* ---------- Actions ---------- */
function addHop(key, t, g0) {
  const h = hop(key); const c = ctx(); let g = g0;
  if (g == null && (t === 'b60' || t === 'fwh' || t === 'b30')) { const n = need(); g = Math.round(doseFor(h, n.ibu, t, c) || 20); }
  else if (g == null) g = Math.round((START_GL[t] || 1) * S.V);
  const a = { id: S.nextId++, key, g: Math.max(1, g), t };
  S.adds.push(a); S.toast = null;
  return a;
}
function parseNum(s) { const x = Number(String(s).replace(/\s/g, '').replace(',', '.')); return Number.isFinite(x) ? x : null; }
app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'INPUT' || el.tagName === 'SELECT') return;
  const act = el.dataset.act, id = Number(el.dataset.id), key = el.dataset.key;
  const A = () => S.adds.find((a) => a.id === id);
  switch (act) {
    case 'recipe': S.sheet = 'recipe'; S.styleQ = ''; break;
    case 'next': S.next = el.dataset.t; break;
    case 'qjump': { const g = app.querySelector(`.qg[data-g="${el.dataset.g}"]`); if (g) g.scrollIntoView({ block: 'start' }); return; }
    case 'questions': S.sheet = 'questions'; break;
    case 'close': S.sheet = null; break;
    case 'legend': S.legend = !S.legend; break;
    case 'sel': toggleSel(key); break;
    case 'clearsel': S.sel = []; S.full = false; break;
    case 'full': S.full = !S.full; break;
    case 'top4': setSel(rankList(inStock(), style()).slice(0, 4).map((r) => r.h.key)); break;
    case 'near': { const h = hop(key); setSel([h.key, ...similar(h, inStock()).map((x) => x.h.key)]); S.info = null; break; }
    case 'cmpkeys': setSel(el.dataset.keys.split(',')); S.sheet = null; break;
    case 'info': S.info = S.info === key ? null : key; break;
    case 'cat': S.cat = !S.cat; S.catN = 30; break;
    case 'catmore': S.catN += 30; break;
    case 'addhop': { const pl = plusPlan(hop(key)); addHop(key, pl.t, pl.g); break; }
    case 'addas': addHop(key, el.dataset.t); S.info = null; break;
    case 'propose': for (const a of proposal()) S.adds.push({ id: S.nextId++, ...a }); break;
    case 'openadd': S.open = S.open === id ? null : id; break;
    case 'dose': { const a = A(); a.g = Math.max(0, a.g + Number(el.dataset.d)); break; }
    case 'time': { const a = A(); const old = ibuOf(hop(a.key), a.g, a.t, ctx()); a.t = el.dataset.t; break; }
    case 'remove': { const i = S.adds.findIndex((a) => a.id === id); const [a] = S.adds.splice(i, 1); S.toast = { msg: `${hname(hop(a.key))} retiré.`, undo: () => S.adds.splice(i, 0, a) }; S.open = null; break; }
    case 'replace': S.sheet = 'replace'; S.replaceFor = id; break;
    case 'cmpsubs': { const a = A(); const R = substitutes(a); setSel([a.key, ...R.list.slice(0, 3).map((x) => x.h.key)]); S.sheet = null; break; }
    case 'applysub': { const a = A(); const R = substitutes(a); const x = R.all.find((s) => s.h.key === key); const before = { key: a.key, g: a.g }; const oldName = hname(hop(a.key));
      a.key = key; a.g = Math.max(0.1, Math.round((x ? x.dose : a.g) * 10) / 10); S.sheet = null; S.open = a.id;
      S.toast = { msg: `${oldName} remplacé par ${hname(hop(key))}, ${gtxt(a.g)} g.`, undo: () => { a.key = before.key; a.g = before.g; } }; break; }
    case 'undo': S.toast?.undo?.(); S.toast = null; break;
    case 'toastx': S.toast = null; break;
    case 'style': S.style = el.dataset.id; S.og = style().ogMid || S.og; S.sheet = null; S.next = null; S.info = null; break;
    case 'qopen': { const qid = el.dataset.q; S.qOpen.has(qid) ? S.qOpen.delete(qid) : S.qOpen.add(qid); break; }
    default: return;
  }
  render();
});
app.addEventListener('input', (e) => {
  const el = e.target; const act = el.dataset.act;
  if (act === 'dosein') { const a = S.adds.find((x) => x.id === Number(el.dataset.id)); const v = parseNum(el.value); if (a && v != null && v >= 0) { a.g = v; renderSoft(el); } }
  else if (act === 'param') { const v = parseNum(el.value); if (v != null && v > 0) { if (el.dataset.p === 'og' && v > 1.2) return; S[el.dataset.p] = v; renderSoft(el); } }
  else if (act === 'styleq') { S.styleQ = el.value; renderSoft(el); }
  else if (act === 'catq') { S.catQ = el.value; S.catN = 30; renderSoft(el); }
});
app.addEventListener('change', (e) => {
  const el = e.target; if (el.dataset.act !== 'qp') return;
  const p = el.dataset.p; S.qp[p] = p === 'q19y' ? Number(el.value) : el.value; render();
});
// Un champ numérique sélectionne sa valeur à l'entrée : la saisie la remplace.
app.addEventListener('focusin', (e) => { const el = e.target; if (S._refocus || el.tagName !== 'INPUT' || el.inputMode !== 'decimal') return; setTimeout(() => { try { el.select(); } catch (_) {} }, 0); });
// Rendu sans réécrire le champ en cours de saisie (la valeur tapée reste telle quelle).
function renderSoft(input) { const v = input.value; render(); const el = app.querySelector(`[data-focuskey="${input.dataset.focuskey}"]`); if (el && el.value !== v) { el.value = v; S._refocus = true; el.focus(); S._refocus = false; try { el.setSelectionRange(v.length, v.length); } catch (_) {} } }
window.matchMedia('(min-width: 900px)').addEventListener('change', render);

/* ---------- Accès pour les contrôles automatiques (scripts/check-hop-v3.mjs) ---------- */
window.__v3 = {
  S, render, hop, prog, rankAroma, rankBitter, substitutes, Q,
  setStyle(id) { S.style = id; S.og = style().ogMid || S.og; render(); },
  compare(keys) { setSel(keys); render(); },
  openQuestions() { S.sheet = 'questions'; render(); },
  answers() { return Q.map((it) => { let r; try { r = it.fn(); } catch (e) { r = { short: 'ERREUR ' + e.message }; } const t = document.createElement('div'); t.innerHTML = r.short; return { id: it.id, title: it.title, text: t.textContent.trim(), nd: /Non documenté/.test(t.textContent) }; }); },
};
render();
</script>
