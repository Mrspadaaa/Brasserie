":[13,17.5],"beta":[4,6.5],"oil":[2.4,4.5],"myrcene":[45,60],"humulene":[9,18],"caryophyllene":[6,11],"farnesene":null,"tags":["poivre noir","réglisse","curry","pungent"],"fam":["epice","herbace","resine"],"famTags":{"epice":2,"herbace":1,"resine":1},"nTags":4,"tf":[["poivre noir","epice"],["réglisse","herbace"],["curry","epice"],["pungent","resine"]],"usage":[],"usageSource":null,"url":"https://beermaverick.com/hop/zeus/"},{"id":"zula","name":"Zula","origin":"Poland (POL)","alpha":[8,14],"beta":[3.8,7],"oil":[1.1,2],"myrcene":null,"humulene":null,"caryophyllene":null,"farnesene":null,"tags":["clean","agrumes","fruits tropicaux","fruité"],"fam":["agrumes","tropical","fruite"],"famTags":{"agrumes":1,"tropical":1,"fruite":1},"nTags":4,"tf":[["clean",null],["agrumes","agrumes"],["fruits tropicaux","tropical"],["fruité","fruite"]],"usage":[],"usageSource":null,"url":"https://beermaverick.com/hop/zula/"},{"id":"zythos","name":"Zythos","origin":"États-Unis","alpha":[10,12.5],"beta":[4.7,6.2],"oil":[0.7,1.2],"myrcene":[30,50],"humulene":[14,23],"caryophyllene":[7,10],"farnesene":null,"tags":["mandarine","agrumes","floral","pin","pamplemousse","fruits tropicaux"],"fam":["agrumes","floral","resine","tropical"],"famTags":{"agrumes":3,"floral":1,"resine":1,"tropical":1},"nTags":6,"tf":[["mandarine","agrumes"],["agrumes","agrumes"],["floral","floral"],["pin","resine"],["pamplemousse","agrumes"],["fruits tropicaux","tropical"]],"usage":[],"usageSource":null,"url":"https://beermaverick.com/hop/zythos/"}],"styles":[{"id":"stout-export","label":"Stout export","group":"stout","wanted":["terreux","herbace","floral"],"unwanted":[],"ibu":[50,70],"note":"Foreign Extra Stout, houblons anglais typiques","origins":["Royaume-Uni"],"source":"BJCP 2021, 16D","url":"https://www.bjcp.org/style/2021/16/16D/foreign-extra-stout/"},{"id":"stout-irlandaise","label":"Stout sèche (irlandaise)","group":"stout","wanted":["terreux","floral"],"unwanted":[],"ibu":[25,45],"note":"arôme houblon faible, facul alphaLot":17.2,"alphaFrom":"fiche"},{"item":"Houblon Nelson Sauvin 9.6%","variety":"nelson-sauvin","grams":100,"form":"pellet","alphaLot":9.6,"alphaFrom":"nom de l’article"},{"item":"Houblon Sabro 13.4%","variety":"sabro","grams":30,"form":"pellet","alphaLot":13.4,"alphaFrom":"nom de l’article"},{"item":"Houblon Hallertauer Blanc 9.5% CH","variety":"hallertau-blanc","grams":30,"form":"pellet","alphaLot":9.5,"alphaFrom":"nom de l’article"},{"item":"Houblon Motueka 8.1%","variety":"motueka","grams":20,"form":"pellet","alphaLot":8.1,"alphaFrom":"nom de l’article"},{"item":"Houblon Idaho 7 12.7%","variety":"idaho-7","grams":20,"form":"pellet","alphaLot":12.7,"alphaFrom":"nom de l’article"},{"item":"Houblon Cryo Hops Citra 24.8%","variety":"citra","grams":65,"form":"cryo","alphaLot":24.8,"alphaFrom":"nom de l’article"},{"item":"Nuget","variety":"nugget","grams":0,"form":"pellet","alphaLot":13,"alphaFrom":"fiche"}],"products":[{"id":"cryo","name":"Cryo Hops®","maker":"Yakima Chief Hops","ratio":[0.4,0.5],"uses":["boil","whirlpool","dryhop"],"source":"Yakima Chief Hops, page Cryo Hops (products.ts)","note":"Départ à 40–50 % du poids en pellets T-90 ; ni alpha, ni IBU, ni goût garantis."},{"id":"hyperboost","name":"HyperBoost®","maker":"Yakima Chief Hops","ratio":[0.008,0.01],"uses":["dryhop"],"source":"Yakima Chief Hops, HyperBoost (products.ts)","note":"Dry hop en fermentation active : 25–50 % de la charge, T-90 ou Cryo pour le reste."}],"sources":{"varieties":"Beer Maverick (agrégat de plages de fournisseurs), src/data/hopBeerMaverickBootstrap.json","usage":"src/data/hopStyleUsageBootstrap.json (IPA seulement)","stock":"production, lecture seule, 17.10.2026","styles":"BJCP 2021 Style Guidelines"}}</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const V = Object.fromEntries(DATA.varieties.map((v) => [v.id, v]));
  const STYLES = Object.fromEntries(DATA.styles.map((s) => [s.id, s]));
  const FAM = DATA.families;
  // Stock : un houblon peut avoir plusieurs articles (fiche à 0 g et article réel, #120).
  const STOCK = {};
  for (const s of DATA.stock) {
    const e = (STOCK[s.variety] ??= { grams: 0, alpha: null, alphaFrom: null, form: 'pellet', items: [] });
    e.grams += s.grams; e.items.push(s.item);
    if (s.grams > 0) { e.form = s.form; if (s.alphaLot != null) { e.alpha = s.alphaLot; e.alphaFrom = s.alphaFrom; } }
  }
  const MOMENTS = [
    { id: 'fw', label: '1er moût', stage: 'firstWort' }, { id: 60, label: '60′' }, { id: 30, label: '30′' }, { id: 15, label: '15′' }, { id: 5, label: '5′' },
    { id: 'wp', label: 'Whirlpool', stage: 'whirlpool' }, { id: 'cru', label: 'À cru', stage: 'dryHop' },
  ];
  const momLabel = (m) => (MOMENTS.find((x) => x.id === m) || {}).label || m;

  const S = { style: 'stout-export', volume: 20, og: 1.06, boil: 60, role: 'amer', cat: false, sel: [], adds: [], open: -1, why: null, sheet: null, rep: -1, all: false, undo: null, more: false };
  const fmt = (n, d = 0) => (n == null || !Number.isFinite(n) ? '—' : Number(n).toLocaleString('fr-FR', { maximumFractionDigits: d }));
  const fmtOg = (n) => Number(n).toLocaleString('fr-FR', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const range = (r, d = 1) => (!r ? 'inconnu' : r[0] === r[1] ? fmt(r[0], d) : `${fmt(r[0], d)}–${fmt(r[1], d)}`);
  const mid = (r) => (r ? (r[0] + r[1]) / 2 : null);

  // Alpha utilisé pour le calcul : celui du lot en stock, sinon le milieu de la plage de la variété.
  const alphaOf = (id) => { const s = STOCK[id]; if (s && s.grams > 0 && s.alpha != null) return { value: s.alpha, from: s.alphaFrom === 'fiche' ? 'lot' : 'lu sur l’article' }; const r = V[id].alpha; return r ? { value: mid(r), from: 'plage ' + range(r) + ' %' } : null; };
  // IBU d'un ajout : BrewingMath.hopIbu (src/services/brewingMath.ts), même formule.
  function ibu(id, g, m) {
    const a = alphaOf(id); if (!a || !(g > 0)) return a ? 0 : null;
    const G = 1.65 * Math.pow(0.000125, Math.max(0, S.og - 1));
    const t = (min) => (1 - Math.exp(-0.04 * Math.max(0, min))) / 4.15;
    let u = 0;
    if (m === 'fw') u = G * t(S.boil) * 1.1;
    else if (m === 'wp') u = G * t(20) * Math.pow(2, (80 - 100) / 10);
    else if (typeof m === 'number') u = G * t(m);
    return (g * 1000 / S.volume) * (a.value / 100) * u;
  }
  const doseFor = (id, target, m) => { const one = ibu(id, 1, m); return one ? target / one : null; };
  const totalIbu = () => S.adds.reduce((s, a) => s + (ibu(a.id, a.g, a.m) || 0), 0);
  const used = (id, except = -1) => S.adds.reduce((s, a, i) => (a.id === id && i !== except ? s + a.g : s), 0);

  // Adéquation au style : part des descripteurs du houblon dans les familles voulues, moins
  // celles à éviter ; atténuée pour les houblons à peu de descripteurs (n + 2).
  const fit = (v, st) => { const w = st.wanted.reduce((s, f) => s + (v.famTags[f] || 0), 0); const u = st.unwanted.reduce((s, f) => s + (v.famTags[f] || 0), 0); return (w - u) / ((v.nTags || 0) + 2); };
  const documentedFor = (v, st) => !!st.usage && v.usage.some((u) => st.usage.includes(u));
  const wantedTags = (v, st) => (v.tf || []).filter(([, f]) => st.wanted.includes(f)).map(([x]) => x);
  const againstTags = (v, st) => (v.tf || []).filter(([, f]) => st.unwanted.includes(f)).map(([x]) => x);
  const originOk = (v, st) => !!st.origins && st.origins.includes(v.origin);
  // Classe : typique (usage documenté, ou origine citée par le guide et descripteurs dans le
  // sens du style), compatible (descripteurs dans le sens du style), hors style ; « aucune »
  // si le style n'a pas de direction documentée.
  function klass(v, st) {
    if (documentedFor(v, st)) return 'typique';
    if (!st.wanted.length) return 'aucune';
    const w = wantedTags(v, st).length, u = againstTags(v, st).length;
    if (w > u && originOk(v, st)) return 'typique';
    return w > u ? 'compatible' : 'hors';
  }
  const KLASS = { typique: 'Typique de ce style', compatible: 'Compatible', hors: 'Hors style', aucune: 'Sans direction de style' };
  const KWORD = { typique: 'typique', compatible: 'compatible', hors: 'hors style', aucune: '' };
  const ORDER = { typique: 0, compatible: 1, hors: 2, aucune: 3 };
  // Dose du prochain ajout : amertume à 60′ pour atteindre le milieu de la cible ; arôme 1 g/L (Cryo × 0,45).
  function needFor(id) {
    const st = STYLES[S.style];
    if (S.role === 'amer') { const g = doseFor(id, Math.max(1, (st.ibu[0] + st.ibu[1]) / 2 - totalIbu()), 60); return g == null ? null : Math.ceil(g); }
    return Math.max(1, Math.round(STOCK[id]?.form === 'cryo' ? S.volume * 0.45 : S.volume));
  }
  const freeOf = (id) => (STOCK[id]?.grams || 0) - used(id);
  // Groupes de la liste. Rang chiffré seulement si le style a des usages documentés ;
  // sinon des groupes, pas un rang (critique UX du 18.10.2026).
  function groups() {
    const st = STYLES[S.style];
    const name = (x, y) => V[x.id].name.localeCompare(V[y.id].name);
    const item = (id) => { const v = V[id], need = needFor(id); return { id, k: klass(v, st), f: fit(v, st), a: alphaOf(id)?.value ?? 0, o: originOk(v, st) ? 1 : 0, d: documentedFor(v, st) ? 1 : 0, need, enough: need != null && freeOf(id) >= need, g: STOCK[id]?.grams || 0 }; };
    const stockIds = Object.keys(STOCK).filter((id) => STOCK[id].grams > 0);
    const items = stockIds.map(item);
    const out = [];
    if (S.role === 'amer') {
      // Amertume : assez en stock pour la dose visée d'abord ; puis usage documenté, alpha, origine du style.
      const cmp = (x, y) => y.d - x.d || y.a - x.a || y.o - x.o || y.f - x.f || name(x, y);
      out.push({ title: 'Assez pour l’amertume visée', ids: items.filter((x) => x.enough).sort(cmp) });
      out.push({ title: 'Pas assez en stock', ids: items.filter((x) => !x.enough).sort(cmp) });
    } else {
      // Arôme : classe de style, puis adéquation, puis quantité.
      const cmp = (x, y) => y.f - x.f || y.g - x.g || name(x, y);
      for (const k of ['typique', 'compatible', 'hors', 'aucune']) out.push({ title: KLASS[k], ids: items.filter((x) => x.k === k).sort(cmp) });
    }
    if (S.cat) {
      const cat = DATA.varieties.map((v) => v.id).filter((id) => !stockIds.includes(id)).map(item)
        .sort((x, y) => ORDER[x.k] - ORDER[y.k] || (S.role === 'amer' ? y.a - x.a : y.f - x.f) || name(x, y)).slice(0, 40);
      out.push({ title: 'À acheter', cat: true, ids: cat });
    }
    return { documented: !!st.usage, groups: out.filter((g) => g.ids.length) };
  }
  const flatIds = () => groups().groups.flatMap((g) => g.ids.map((x) => x.id));
  function reason(id) {
    const v = V[id], st = STYLES[S.style];
    const w = wantedTags(v, st), u = againstTags(v, st);
    const parts = [];
    parts.push(documentedFor(v, st) ? 'Usage documenté pour ce style (' + esc(v.usageSource || 'source du dépôt') + ').' : 'Usage pour ce style : non documenté.');
    if (st.wanted.length) parts.push(w.length ? 'Dans le sens du style : ' + w.map(esc).join(', ') + '.' : 'Aucun descripteur dans le sens du style.');
    if (u.length) parts.push('Contre le style : ' + u.map(esc).join(', ') + '.');
    if (st.origins) parts.push(originOk(v, st) ? 'Origine ' + esc(v.origin) + ' : citée par le guide pour ce style.' : 'Origine ' + esc(v.origin || 'inconnue') + ' : le guide cite ' + st.origins.map(esc).join(' ou ') + '.');
    return parts.join(' ');
  }

  // Arôme : seuls les ajouts tardifs comptent (à cru 1, whirlpool 0,8, 10′ ou moins 0,5,
  // 15′ ou moins 0,3) ; au-delà, l'ajout donne de l'amertume, pas d'arôme.
  const weightOf = (m) => (m === 'cru' ? 1 : m === 'wp' ? 0.8 : typeof m === 'number' ? (m <= 10 ? 0.5 : m <= 15 ? 0.3 : 0) : 0);
  function aroma(list = S.adds) {
    const w = {};
    for (const a of list) { const v = V[a.id]; const k = weightOf(a.m) * a.g / S.volume; if (!k) continue; for (const [f, n] of Object.entries(v.famTags)) w[f] = (w[f] || 0) + k * n / (v.nTags || 1); }
    return Object.entries(w).sort((x, y) => y[1] - x[1]).filter((x) => x[1] > 0.01).slice(0, 2).map((x) => FAM[x[0]]);
  }

  function addHop(id) {
    const st = STYLES[S.style];
    const amer = S.role === 'amer';
    const m = amer ? 60 : 'wp';
    const target = (st.ibu[0] + st.ibu[1]) / 2;
    let g = amer ? doseFor(id, Math.max(1, target - totalIbu()), 60) : S.volume * 1;

  // ---------- rendu ----------

  function compare() {
    const st = STYLES[S.style];
    const ref = S.adds[0] && typeof S.adds[0].m === 'number' ? S.adds[0] : { g: 20, m: 60 };
    const ids = S.sel, ib = ids.map((id) => ibu(id, ref.g, ref.m)), best = Math.max(...ib.filter((x) => x != null));
    const rows = [
      ['En stock', ids.map((id) => (STOCK[id]?.grams > 0 ? fmt(STOCK[id].grams) + ' g' : 'à acheter')), true],

  function sheetReplace() {
    const a = S.adds[S.rep]; if (!a) return '';
    const v = V[a.id], keep = ibu(a.id, a.g, a.m);
    const fa = new Set(v.fam);
    const sim = (x) => { const fb = new Set(V[x].fam); const inter = [...fa].filter((f) => fb.has(f)).length; const uni = new Set([...fa, ...fb]).size; return uni ? inter / uni : 0; };
    const cands = DATA.varieties.map((x) => x.id).filter((id) => id !== a.id).map((id) => {
      let g = a.m === 'cru' || keep == null ? a.g : doseFor(id, keep, a.m);
      if (g == null) return null;
      g = Math.max(1, Math.round(g));
      const s = STOCK[id], free = s ? s.grams - used(id, S.rep) : 0;
      const state = !s || s.grams <= 0 ? 'buy' : free >= g ? 'ok' : 'low';
      const gain = V[id].fam.filter((f) => !fa.has(f)).slice(0, 2).map((f) => FAM[f]);
      const lost = v.fam.filter((f) => !V[id].fam.includes(f)).slice(0, 2).map((f) => FAM[f]);
      return { id, g, state, free, s: sim(id), gain, lost };
    }).filter(Boolean).sort((p, q) => ({ ok: 0, low: 1, buy: 2 }[p.state] - { ok: 0, low: 1, buy: 2 }[q.state]) || q.s - p.s);
    const shown = S.more ? cands.slice(0, 40) : cands.slice(0, 5);

      ${S.more ? '' : `<div class="sub"><button class="btn2" data-act="more">Voir plus de remplaçants</button></div>`}

  // Chaque question de la banque renvoie à l'endroit qui répond, ou dit ce qui manque.
  const QUESTIONS = [
    ['Q01', 'Stout : mes houblons classés, stock d’abord', 'list'], ['Q02', 'Comparer 2 à 4 houblons', 'top4'], ['Q03', 'Un toucher, sans défiler', 'list'],

    ['Q20', 'Simuler tous mes ajouts', 'ibu'], ['Q21', 'Houblons pour n’importe quel style', 'style'], ['Q22', 'Stout très amère et chocolatée', 'style:stout-imperiale'],

  function answer(kind) {

  function sheetQuestions() {

  function render(focusId) {

  function act(a, d) {
