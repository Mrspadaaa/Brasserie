<title>Houblons de la recette</title>

<style>
/* Prototype de l'étape Houblons (mission #119, phase 8). Une seule colonne au téléphone :
   en-tête 36 px, rail 28 px, bandeau IBU 32 px, ajouts repliés, puis la liste classée.
   Deux colonnes à partir de 900 px. Jetons de DESIGN.md ; l'app est sombre (U5). */
:root {

.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { height: 36px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0; border-bottom: 1px solid var(--cave-800); }

@media (min-width: 900px) { .cmp { left: 50%; width: 640px; transform: translateX(-50%); border-radius: 16px 16px 0 0; } }

.styl { width: 100%; display: grid; gap: 1px; padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--cave-850); }

<script id="data" type="application/json">/*DATA*/</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const V = Object.fromEntries(DATA.varieties.map((v) => [v.id, v]));
  const STYLES = Object.fromEntries(DATA.styles.map((s) => [s.id, s]));
  const FAM = DATA.families;
  // Stock : un houblon peut avoir plusieurs articles (fiche à 0 g et article réel, #120).
  const STOCK = {};
  for (const s of DATA.stock) {
    const e = (STOCK[s.variety] ??= { grams: 0, alpha: null, alphaFrom: null, form: 'pellet', items: [] });
    e.grams += s.grams; e.items.push(s.item);
    if (s.grams > 0) { e.form = s.form; if (s.alphaLot != null) { e.alpha = s.alphaLot; e.alphaFrom = s.alphaFrom; } }
  }
  const MOMENTS = [
    { id: 'fw', label: '1er moût', stage: 'firstWort' }, { id: 60, label: '60′' }, { id: 30, label: '30′' }, { id: 15, label: '15′' }, { id: 5, label: '5′' },
    { id: 'wp', label: 'Whirlpool', stage: 'whirlpool' }, { id: 'cru', label: 'À cru', stage: 'dryHop' },
  ];
  const momLabel = (m) => (MOMENTS.find((x) => x.id === m) || {}).label || m;

  const S = { style: 'stout-export', volume: 20, og: 1.06, boil: 60, role: 'amer', cat: false, sel: [], adds: [], open: -1, why: null, sheet: null, rep: -1, all: false, undo: null, more: false };
  const fmt = (n, d = 0) => (n == null || !Number.isFinite(n) ? '—' : Number(n).toLocaleString('fr-FR', { maximumFractionDigits: d }));
  const fmtOg = (n) => Number(n).toLocaleString('fr-FR', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const range = (r, d = 1) => (!r ? 'inconnu' : r[0] === r[1] ? fmt(r[0], d) : `${fmt(r[0], d)}–${fmt(r[1], d)}`);
  const mid = (r) => (r ? (r[0] + r[1]) / 2 : null);

  // Alpha utilisé pour le calcul : celui du lot en stock, sinon le milieu de la plage de la variété.
  const alphaOf = (id) => { const s = STOCK[id]; if (s && s.grams > 0 && s.alpha != null) return { value: s.alpha, from: s.alphaFrom === 'fiche' ? 'lot' : 'lu sur l’article' }; const r = V[id].alpha; return r ? { value: mid(r), from: 'plage ' + range(r) + ' %' } : null; };
  // IBU d'un ajout : BrewingMath.hopIbu (src/services/brewingMath.ts), même formule.
  function ibu(id, g, m) {
    const a = alphaOf(id); if (!a || !(g > 0)) return a ? 0 : null;
    const G = 1.65 * Math.pow(0.000125, Math.max(0, S.og - 1));
    const t = (min) => (1 - Math.exp(-0.04 * Math.max(0, min))) / 4.15;
    let u = 0;
    if (m === 'fw') u = G * t(S.boil) * 1.1;
    else if (m === 'wp') u = G * t(20) * Math.pow(2, (80 - 100) / 10);
    else if (typeof m === 'number') u = G * t(m);
    return (g * 1000 / S.volume) * (a.value / 100) * u;
  }
  const doseFor = (id, target, m) => { const one = ibu(id, 1, m); return one ? target / one : null; };
  const totalIbu = () => S.adds.reduce((s, a) => s + (ibu(a.id, a.g, a.m) || 0), 0);
  const used = (id, except = -1) => S.adds.reduce((s, a, i) => (a.id === id && i !== except ? s + a.g : s), 0);

  // Adéquation au style : part des descripteurs du houblon dans les familles voulues, moins
  // celles à éviter ; atténuée pour les houblons à peu de descripteurs (n + 2).
  const fit = (v, st) => { const w = st.wanted.reduce((s, f) => s + (v.famTags[f] || 0), 0); const u = st.unwanted.reduce((s, f) => s + (v.famTags[f] || 0), 0); return (w - u) / ((v.nTags || 0) + 2); };
  const documentedFor = (v, st) => !!st.usage && v.usage.some((u) => st.usage.includes(u));
  const wantedTags = (v, st) => (v.tf || []).filter(([, f]) => st.wanted.includes(f)).map(([x]) => x);
  const againstTags = (v, st) => (v.tf || []).filter(([, f]) => st.unwanted.includes(f)).map(([x]) => x);
  const originOk = (v, st) => !!st.origins && st.origins.includes(v.origin);
  // Classe : typique (usage documenté, ou origine citée par le guide et descripteurs dans le
  // sens du style), compatible (descripteurs dans le sens du style), hors style ; « aucune »
  // si le style n'a pas de direction documentée.
  function klass(v, st) {
    if (documentedFor(v, st)) return 'typique';
    if (!st.wanted.length) return 'aucune';
    const w = wantedTags(v, st).length, u = againstTags(v, st).length;
    if (w > u && originOk(v, st)) return 'typique';
    return w > u ? 'compatible' : 'hors';
  }
  const KLASS = { typique: 'Typique de ce style', compatible: 'Compatible', hors: 'Hors style', aucune: 'Sans direction de style' };
  const KWORD = { typique: 'typique', compatible: 'compatible', hors: 'hors style', aucune: '' };
  const ORDER = { typique: 0, compatible: 1, hors: 2, aucune: 3 };
  // Dose du prochain ajout : amertume à 60′ pour atteindre le milieu de la cible ; arôme 1 g/L (Cryo × 0,45).
  function needFor(id) {
    const st = STYLES[S.style];
    if (S.role === 'amer') { const g = doseFor(id, Math.max(1, (st.ibu[0] + st.ibu[1]) / 2 - totalIbu()), 60); return g == null ? null : Math.ceil(g); }
    return Math.max(1, Math.round(STOCK[id]?.form === 'cryo' ? S.volume * 0.45 : S.volume));
  }
  const freeOf = (id) => (STOCK[id]?.grams || 0) - used(id);
  // Groupes de la liste. Rang chiffré seulement si le style a des usages documentés ;
  // sinon des groupes, pas un rang (critique UX du 18.10.2026).
  function groups() {
    const st = STYLES[S.style];
    const name = (x, y) => V[x.id].name.localeCompare(V[y.id].name);
    const item = (id) => { const v = V[id], need = needFor(id); return { id, k: klass(v, st), f: fit(v, st), a: alphaOf(id)?.value ?? 0, o: originOk(v, st) ? 1 : 0, d: documentedFor(v, st) ? 1 : 0, need, enough: need != null && freeOf(id) >= need, g: STOCK[id]?.grams || 0 }; };
    const stockIds = Object.keys(STOCK).filter((id) => STOCK[id].grams > 0);
    const items = stockIds.map(item);
    const out = [];
    if (S.role === 'amer') {
      // Amertume : assez en stock pour la dose visée d'abord ; puis usage documenté, alpha, origine du style.
      const cmp = (x, y) => y.d - x.d || y.a - x.a || y.o - x.o || y.f - x.f || name(x, y);
      out.push({ title: 'Assez pour l’amertume visée', ids: items.filter((x) => x.enough).sort(cmp) });
      out.push({ title: 'Pas assez en stock', ids: items.filter((x) => !x.enough).sort(cmp) });
    } else {
      // Arôme : classe de style, puis adéquation, puis quantité.
      const cmp = (x, y) => y.f - x.f || y.g - x.g || name(x, y);
      for (const k of ['typique', 'compatible', 'hors', 'aucune']) out.push({ title: KLASS[k], ids: items.filter((x) => x.k === k).sort(cmp) });
    }
    if (S.cat) {
      const cat = DATA.varieties.map((v) => v.id).filter((id) => !stockIds.includes(id)).map(item)
        .sort((x, y) => ORDER[x.k] - ORDER[y.k] || (S.role === 'amer' ? y.a - x.a : y.f - x.f) || name(x, y)).slice(0, 40);
      out.push({ title: 'À acheter', cat: true, ids: cat });
    }
    return { documented: !!st.usage, groups: out.filter((g) => g.ids.length) };
  }
  const flatIds = () => groups().groups.flatMap((g) => g.ids.map((x) => x.id));
  function reason(id) {
    const v = V[id], st = STYLES[S.style];
    const w = wantedTags(v, st), u = againstTags(v, st);
    const parts = [];
    parts.push(documentedFor(v, st) ? 'Usage documenté pour ce style (' + esc(v.usageSource || 'source du dépôt') + ').' : 'Usage pour ce style : non documenté.');
    if (st.wanted.length) parts.push(w.length ? 'Dans le sens du style : ' + w.map(esc).join(', ') + '.' : 'Aucun descripteur dans le sens du style.');
    if (u.length) parts.push('Contre le style : ' + u.map(esc).join(', ') + '.');
    if (st.origins) parts.push(originOk(v, st) ? 'Origine ' + esc(v.origin) + ' : citée par le guide pour ce style.' : 'Origine ' + esc(v.origin || 'inconnue') + ' : le guide cite ' + st.origins.map(esc).join(' ou ') + '.');
    return parts.join(' ');
  }

  // Arôme : seuls les ajouts tardifs comptent (à cru 1, whirlpool 0,8, 10′ ou moins 0,5,
  // 15′ ou moins 0,3) ; au-delà, l'ajout donne de l'amertume, pas d'arôme.
  const weightOf = (m) => (m === 'cru' ? 1 : m === 'wp' ? 0.8 : typeof m === 'number' ? (m <= 10 ? 0.5 : m <= 15 ? 0.3 : 0) : 0);
  function aroma(list = S.adds) {
    const w = {};
    for (const a of list) { const v = V[a.id]; const k = weightOf(a.m) * a.g / S.volume; if (!k) continue; for (const [f, n] of Object.entries(v.famTags)) w[f] = (w[f] || 0) + k * n / (v.nTags || 1); }
    return Object.entries(w).sort((x, y) => y[1] - x[1]).filter((x) => x[1] > 0.01).slice(0, 2).map((x) => FAM[x[0]]);
  }

  function addHop(id) {
    const st = STYLES[S.style];
    const amer = S.role === 'amer';
    const m = amer ? 60 : 'wp';
    const target = (st.ibu[0] + st.ibu[1]) / 2;
    let g = amer ? doseFor(id, Math.max(1, target - totalIbu()), 60) : S.volume * 1;
    if (g == null) g = S.volume; // alpha inconnu : dose d'arôme par défaut, IBU affiché « inconnu »
    if (!amer && STOCK[id]?.form === 'cryo') g = g * 0.45; // Cryo : départ à 40–50 % du poids T-90 (YCH)
    S.adds.push({ id, g: Math.max(1, Math.round(g)), m });
    S.open = S.adds.length - 1;
  }

  // ---------- rendu ----------
  const app = document.getElementById('app');
  let refocus = false;
  function top() {
    const st = STYLES[S.style];

      <button class="title" data-act="style" aria-label="Style et paramètres de la recette"><b>${esc(st.label)}</b><span class="mono">${fmt(S.volume)} L · ${fmtOg(S.og)}</span></button>

  function strip() {

      <span class="aro">${aroText}</span></div>`;
  }

  function addLine(a, i) {
    const v = V[a.id], val = ibu(a.id, a.g, a.m), s = STOCK[a.id];

      <span class="v">${fmt(a.g)} g · ${esc(momLabel(a.m))}</span>${lack ? '<span class="warn">⚠ stock</span>' : '<span></span>'}<span class="ibu">${val == null ? 'α ?' : a.m === 'cru' ? 'arôme' : fmt(val, 1) + ' IBU'}</span>
      <span class="aro2">${aro}</span></button>`;
    if (!open) return `<div class="add">${head}</div>`;
    const al = alphaOf(a.id);
    return `<div class="add open">${head}<div class="edit">
      <div class="r1"><span class="stepper"><button data-act="minus" data-i="${i}" aria-label="Moins 1 g">−</button><input id="dose-${i}" data-i="${i}" type="text" inputmode="decimal" autocomplete="off" value="${fmt(a.g)}" aria-label="Dose de ${esc(v.name)} en grammes"><span class="u">g</span><button data-act="plus" data-i="${i}" aria-label="Plus 1 g">+</button></span>
        <span class="mono" style="color:var(--cave-400);font-size:12px">${fmt(a.g / S.volume, 1)} g/L</span></div>
      <div class="moms" role="group" aria-label="Moment">${MOMENTS.map((m) => `<button class="mom" data-act="mom" data-i="${i}" data-m="${m.id}" aria-pressed="${a.m === m.id}">${m.label}</button>`).join('')}</div>

  function row(x, n, cat) {

        <button data-act="role" data-r="amer" aria-pressed="${S.role === 'amer'}">Amertume</button><button data-act="role" data-r="arome" aria-pressed="${S.role === 'arome'}">Arôme</button></span></div>
      <div class="chips"><button class="chip" data-act="stock" aria-pressed="${!S.cat}">Mon stock · ${Object.values(STOCK).filter((s) => s.grams > 0).length}</button><button class="chip" data-act="cat" aria-pressed="${S.cat}">+ Catalogue</button>
        <button class="chip" data-act="top4">Comparer les 4 premiers</button></div>
      ${banner}<div role="list" aria-label="Houblons classés">${rows}</div>
      ${S.sel.length >= 2 ? '<div class="spacer"></div>' : '<div style="height:24px"></div>'}`;
  }
  function compare() {
    const st = STYLES[S.style];
    const ref = S.adds[0] && typeof S.adds[0].m === 'number' ? S.adds[0] : { g: 20, m: 60 };
    const ids = S.sel, ib = ids.map((id) => ibu(id, ref.g, ref.m)), best = Math.max(...ib.filter((x) => x != null));
    const rows = [
      ['En stock', ids.map((id) => (STOCK[id]?.grams > 0 ? fmt(STOCK[id].grams) + ' g' : 'à acheter')), true],
      ['α (%)', ids.map((id) => { const a = alphaOf(id); return a ? fmt(a.value, 1) : 'inconnu'; }), true],
      [fmt(ref.g) + ' g à ' + momLabel(ref.m), ids.map((id, i) => (ib[i] == null ? 'inconnu' : `<span class="${ib[i] === best ? 'best' : ''}">${fmt(ib[i])} IBU</span>`)), true],
      ['Style', ids.map((id) => KWORD[klass(V[id], st)] || '—'), false],
      ['Sens du style', ids.map((id) => wantedTags(V[id], st).slice(0, 3).map(esc).join(', ') || 'aucun'), false],
      ['Arôme', ids.map((id) => V[id].tags.slice(0, ids.length > 3 ? 1 : 2).map(esc).join(', ') || 'non documenté'), false],
    ];
    const extra = [
      ['Plage α (%)', ids.map((id) => range(V[id].alpha)), true],
      ['Huiles (mL/100 g)', ids.map((id) => (V[id].oil ? range(V[id].oil) : 'inconnu')), true],
      ['Myrcène (%)', ids.map((id) => (V[id].myrcene ? range(V[id].myrcene, 0) : 'inconnu')), true],
      ['Humulène (%)', ids.map((id) => (V[id].humulene ? range(V[id].humulene, 0) : 'inconnu')), true],
      ['Origine', ids.map((id) => esc(V[id].origin || 'inconnue')), false],
      ['Usage', ids.map((id) => (documentedFor(V[id], st) ? 'documenté' : 'non documenté')), false],

    return `<div class="cmp" role="region" aria-label="Comparaison"><div class="sh"><b>Comparer · ${ids.length}</b><span class="sp"></span>

      <div class="tb"><table class="${ids.length > 3 ? 'c4' : ''}"><thead><tr><th></th>${ids.map((id) => `<th>${hopName(id)}</th>`).join('')}</tr></thead><tbody>
      ${shown.map((r) => `<tr><td>${r[0]}</td>${r[1].map((x) => `<td class="${r[2] ? 'n' : ''}">${x}</td>`).join('')}</tr>`).join('')}
      ${hidden && !S.all ? `<tr><td colspan="${ids.length + 1}" class="more">${hidden} ligne${hidden > 1 ? 's' : ''} identique${hidden > 1 ? 's' : ''} masquée${hidden > 1 ? 's' : ''}</td></tr>` : ''}
      <tr><td></td>${ids.map((id) => `<td><button class="btn2" data-act="add" data-id="${id}">Ajouter</button></td>`).join('')}</tr></tbody></table></div></div>`;
  }
  function sheetReplace() {
    const a = S.adds[S.rep]; if (!a) return '';
    const v = V[a.id], keep = ibu(a.id, a.g, a.m);
    const fa = new Set(v.fam);
    const sim = (x) => { const fb = new Set(V[x].fam); const inter = [...fa].filter((f) => fb.has(f)).length; const uni = new Set([...fa, ...fb]).size; return uni ? inter / uni : 0; };
    const cands = DATA.varieties.map((x) => x.id).filter((id) => id !== a.id).map((id) => {
      let g = a.m === 'cru' || keep == null ? a.g : doseFor(id, keep, a.m);
      if (g == null) return null;
      g = Math.max(1, Math.round(g));
      const s = STOCK[id], free = s ? s.grams - used(id, S.rep) : 0;
      const state = !s || s.grams <= 0 ? 'buy' : free >= g ? 'ok' : 'low';

      return { id, g, state, free, s: sim(id), gain, lost };
    }).filter(Boolean).sort((p, q) => ({ ok: 0, low: 1, buy: 2 }[p.state] - { ok: 0, low: 1, buy: 2 }[q.state]) || q.s - p.s);
    const shown = S.more ? cands.slice(0, 40) : cands.slice(0, 5);

      ${S.more ? '' : `<div class="sub"><button class="btn2" data-act="more">Voir plus de remplaçants</button></div>`}
      <div class="sub">Ressemblance : familles de descripteurs Beer Maverick en commun. Aucune note de substitution n’est importée.</div>
    </div></div>`;
  }
  function sheetStyle() {
    return `<div class="sheet" role="dialog" aria-modal="true" aria-label="Recette"><div class="sh"><b>Recette</b><button class="x" data-act="close">Fermer</button></div><div class="sb">

  }
  // Chaque question de la banque renvoie à l'endroit qui répond, ou dit ce qui manque.
  const QUESTIONS = [
    ['Q01', 'Stout : mes houblons classés, stock d’abord', 'list'], ['Q02', 'Comparer 2 à 4 houblons', 'top4'], ['Q03', 'Un toucher, sans défiler', 'list'],
    ['Q04', 'Stout amérisée au Nugget : trop résineuse ?', 'nugget'], ['Q05', 'Saaz remplacé par Styrian Golding', 'saaz'],

    ['Q17', 'IBU et arôme de chaque ajout', 'adds'], ['Q18', 'Remplacer X par Y au même IBU', 'rep'], ['Q19', 'Houblon × moment × levure : résultat', 'nd:essais houblon × levure'],
    ['Q20', 'Simuler tous mes ajouts', 'ibu'], ['Q21', 'Houblons pour n’importe quel style', 'style'], ['Q22', 'Stout très amère et chocolatée', 'style:stout-imperiale'],

    ['Q28', 'Sour : houblons avec ma culture acidifiante', 'nd:tolérance des cultures au houblon'], ['Q29', 'Houblon maison sans analyse', 'adds'],

  function answer(kind) {
    if (kind.startsWith('nd:')) return [`Non documenté : il manque ${esc(kind.slice(3))}.`, null, true];
    if (kind === 'list') return ['Réponse : la liste « Mes houblons pour cette bière ».', 'golist'];
    if (kind === 'top4') return ['Réponse : cases à cocher ou « Comparer les 4 premiers ».', 'top4'];
    if (kind === 'rep') return ['Réponse : « Remplacer » sur une ligne d’ajout.', S.adds.length ? 'firstrep' : 'golist'];
    if (kind === 'ibu') return [`Réponse : le bandeau. IBU total maintenant : ${fmt(totalIbu())} ; le dry hop compte 0 au calcul de Tinseth (amertume à froid non simulée ici).`, null];
    if (kind === 'adds') return ['Réponse : chaque ligne d’ajout (dose, moment, IBU, stock, alpha).', S.adds.length ? 'openfirst' : 'golist'];
    if (kind === 'why') return ['Réponse : ⓘ sur un houblon, ou « Tout afficher » dans la comparaison.', 'golist'];
    if (kind === 'products') return ['Cryo : 40–50 % du poids en pellets T-90, tous moments. HyperBoost : 0,8–1 % du poids T-90, dry hop en fermentation active, 25–50 % de la charge (Yakima Chief Hops).', null];
    if (kind === 'nugget') { const v = V.nugget; const st = STYLES[S.style]; const r = (v.famTags.resine || 0); return [`Nugget : ${r ? 'descripteur résineux présent' : 'aucun descripteur résineux'} dans Beer Maverick (${v.tags.slice(0, 4).join(', ')}). Pour « ${esc(st.label)} », le guide cite ${st.wanted.map((f) => FAM[f]).join(', ')}. Intensité dans une bière torréfiée : non documentée.`, 'compnugget']; }
    if (kind === 'saaz') return ['Réponse : choisis « Lager blonde tchèque », ajoute Saaz, puis « Remplacer » : gagné, perdu et dose au même IBU.', 'stylesaaz'];
    if (kind === 'style') return ['Réponse : touche le titre de la recette et choisis le style.', 'style'];
    if (kind.startsWith('style:')) return [`Réponse : style « ${esc(STYLES[kind.slice(6)].label)} », puis la liste classée et le bandeau.`, 'setstyle:' + kind.slice(6)];
    return ['', null];
  }
  function sheetQuestions() {
    return `<div class="sheet" role="dialog" aria-modal="true" aria-label="Mes questions"><div class="sh"><b>Mes questions</b><button class="x" data-act="close">Fermer</button></div><div class="sb qs">
      ${QUESTIONS.map(([q, t, k]) => { const [text, go, nd] = answer(k); return `<div class="q"><span class="qt" data-q="${q}">${esc(t)}</span><span class="qa${nd ? ' nd2' : ''}">${text}</span>${go ? `<button class="btn2" data-act="go" data-go="${go}">Y aller</button>` : ''}</div>`; }).join('')}
    </div></div>`;
  }

  function render(focusId) {
    const b = app.querySelector('.body'), sb = app.querySelector('.sb');
    const scroll = [b ? b.scrollTop : 0, sb ? sb.scrollTop : 0];
    const modal = !!S.sheet;
    app.innerHTML = top() + `<main class="body${S.undo ? ' withsnack' : ''}"${modal ? ' inert' : ''}>${strip()}<div class="cols"><section aria-label="Ajouts">${adds()}</section><section aria-label="Classement">${list()}</section></div></main>` +
      (S.sel.length >= 2 && !modal ? compare() : '') +
      (S.sheet === 'replace' ? sheetReplace() : S.sheet === 'style' ? sheetStyle() : S.sheet === 'questions' ? sheetQuestions() : '') +
      (S.undo ? `<div class="snack" role="status"><span>${esc(S.undo.msg)}</span><button data-act="undo">Annuler</button></div>` : '');
    const nb = app.querySelector('.body'), ns = app.querySelector('.sb');
    if (nb) nb.scrollTop = scroll[0];
    if (ns && S.keepSheetScroll) ns.scrollTop = scroll[1];
    S.keepSheetScroll = false;
    if (focusId) { const f = document.getElementById(focusId); if (f) { refocus = true; f.focus(); refocus = false; const n = f.value.length; f.setSelectionRange(n, n); } }
  }

  let snackTimer = null;
  function armSnack() { clearTimeout(snackTimer); if (S.undo) { const u = S.undo; snackTimer = setTimeout(() => { if (S.undo === u) { S.undo = null; render(); } }, 5000); } }
  function act(a, d) {
    if (a !== 'undo') S.undo = null;
    switch (a) {
      case 'add': addHop(d.id); S.sel = S.sel.filter((x) => x !== d.id && S.sel.length > 2 ? true : x !== d.id); break;
      case 'sel': { const i = S.sel.indexOf(d.id); if (i >= 0) S.sel.splice(i, 1); else { if (S.sel.length >= 4) S.sel.shift(); S.sel.push(d.id); } break; }
      case 'top4': S.sel = flatIds().slice(0, 4); break;
      case 'why': S.why = S.why === d.id ? null : d.id; break;
      case 'stock': S.cat = false; break;
      case 'cat': S.cat = true; break;
      case 'role': S.role = d.r; break;
      case 'nd': S.ndOpen = !S.ndOpen; break;
      case 'clearsel': S.sel = []; S.all = false; break;
      case 'all': S.all = !S.all; break;
      case 'toggle': S.open = S.open === +d.i ? -1 : +d.i; break;
      case 'minus': S.adds[+d.i].g = Math.max(1, S.adds[+d.i].g - 1); break;
      case 'plus': S.adds[+d.i].g += 1; break;
      case 'mom': S.adds[+d.i].m = /^\d+$/.test(d.m) ? Number(d.m) : d.m; break;
      case 'del': S.undo = { adds: structuredClone(S.adds), msg: `${V[S.adds[+d.i].id].name} retiré` }; S.adds.splice(+d.i, 1); S.open = -1; break;
      case 'rep': S.sheet = 'replace'; S.rep = +d.i; S.more = false; break;
      case 'more': S.more = true; S.keepSheetScroll = true; break;
      case 'apply': { const old = S.adds[S.rep]; S.undo = { adds: structuredClone(S.adds), msg: `${V[old.id].name} remplacé par ${V[d.id].name}` }; S.adds[S.rep] = { id: d.id, g: Number(d.g), m: old.m }; S.sheet = null; S.open = S.rep; break; }
      case 'undo': if (S.undo) S.adds = S.undo.adds; S.undo = null; break;
      case 'style': S.sheet = 'style'; break;
      case 'setstyle': S.style = d.s; S.keepSheetScroll = true; break;
      case 'questions': S.sheet = 'questions'; break;
      case 'close': S.sheet = null; break;
      case 'go': go(d.go); break;
    }
  }
  function go(target) {
    S.sheet = null;
    if (target === 'golist') { requestAnimationFrame(() => app.querySelector('[role="list"]')?.scrollIntoView({ block: 'start' })); }
    else if (target === 'top4') act('top4', {});
    else if (target === 'firstrep') { S.sheet = 'replace'; S.rep = 0; }
    else if (target === 'openfirst') S.open = 0;
    else if (target === 'style') S.sheet = 'style';
    else if (target === 'compnugget') { S.sel = ['nugget', ...flatIds().filter((x) => x !== 'nugget').slice(0, 1)]; }
    else if (target === 'stylesaaz') { S.style = 'lager-tcheque'; S.adds = [{ id: 'saaz', g: 40, m: 60 }]; S.open = 0; S.sheet = 'replace'; S.rep = 0; }
    else if (target.startsWith('setstyle:')) S.style = target.slice(9);
  }

  app.addEventListener('click', (e) => { const t = e.target.closest('[data-act]'); if (!t || !app.contains(t)) return; act(t.dataset.act, t.dataset); render(); armSnack(); });
  app.addEventListener('input', (e) => {
    const f = e.target; const v = parseFloat(String(f.value).replace(',', '.'));
    if (f.matches('input[data-i]')) { if (Number.isFinite(v) && v > 0) { S.adds[+f.dataset.i].g = Math.round(v * 10) / 10; render(f.id); } }
    else if (f.matches('input[data-f]')) {
      const k = f.dataset.f; const ok = { volume: v > 0 && v < 5000, og: v > 1 && v < 1.2, boil: v >= 0 && v <= 240 }[k];
      if (Number.isFinite(v) && ok) { S[k] = v; S.keepSheetScroll = true; render(f.id); }
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sheet) { S.sheet = null; render(); } });
  window.__proto = { state: S, groups, flatIds, ibu, aroma, V, STOCK };
  render();
})();
</script>
